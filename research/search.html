e visits unlike the practice visits in the training: several people talking, a visit interrupted partway through, or a patient raising a second problem at the door. they learned to handle those drafts by using the scribe. this is one participant&#x27;s account and says nothing about how much the training helped compared with no training. [medium] (review habits) they read the assessment and plan in full on every draft. history sections they skim where nothing is underlined. they put their review at &quot;a minute or two a note&quot; on a routine visit, an informal estimate. the january round recorded 4 of 6 participants saying the underline let them skim (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:30) without saying who, so this can&#x27;t be compared with what this participant did in january, and it isn&#x27;t described here as a change. [low] (peer questions) colleagues who started using the scribe after ga ask them how to correct a line or what the underline means. they described this as informal and did not describe any formal role. [low] (nurse practitioner use) they did not describe anything about the scribe that works differently for them as a nurse practitioner. whether nps review drafts differently from physicians is not something one interview can show. representative quotes &quot;the training got me comfortable with the buttons. what it couldn&#x27;t show me was a visit where three people are talking and the patient remembers a second problem at the door.&quot; — nurse practitioner, p118 (returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate) &quot;i read the plan every time. the history i&#x27;ll skim if nothing&#x27;s underlined.&quot; — nurse practitioner, p118 (returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate) recommendations in any later ambient-scribe training, include practice with drafts from visits that don&#x27;t go to plan: several speakers, interruptions, a second problem raised at the end. record how clinicians who start using the scribe after ga are trained, so any later comparison of trained and untrained clinicians rests on a known basis. note that informal peer questions are reaching pilot-trained clinicians; if that support is expected of them, it needs time set aside for it. follow-ups / open questions how clinicians who started using the scribe after ga were trained is not recorded in the corpus. whether pilot-trained clinicians are more comfortable than others is still not a controlled comparison; the january round said so, and one returning participant can&#x27;t settle it. how long draft review takes is not measured; &quot;a minute or two a note&quot; is one nurse practitioner&#x27;s estimate. related earlier session: 2026-01-13 ga release candidate synthesized into: ambient-scribe.md , rollout-and-change-management.md participants participants — interview — returning nurse practitioner on champion training and review habits count: 1 roles: p118 — nurse practitioner (app), returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate researcher: priya patel recruitment note: recontacted from the ga release-candidate usability test. the participant is p118, returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate, where they took part in january 2026 after going through the champion training pilot; this interview is in may 2026. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-05-28-interview-icu-nurse-handoff-narrative", "kind": "raw", "title": "Interview — ICU Nurse on the Handoff Narrative", "date": "2026-05-28", "type": "interview", "status": "raw", "tags": ["nursing", "high-acuity", "documentation", "trust-in-ai", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-05-28-interview-icu-nurse-handoff-narrative/session-notes.md", "corrections": [], "html": "<h1>Interview — ICU Nurse on the Handoff Narrative</h1>\n<h2>Objective</h2>\n<p>The February 2025 nursing survey&#x27;s top volunteered concern was losing the clinical narrative voice, and an ICU respondent wrote that their notes are how they hand off a patient safely. This session asked an ICU nurse what the narrative in their notes does at shift handoff, and what they would expect of AI drafting nursing notes, which doesn&#x27;t exist.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a senior registered nurse in an adult ICU. Their charting is manual; the ambient scribe, GA since January 2026, drafts notes for physicians, NPs and PAs only, and no nurse uses it for their own documentation. Everything they said about AI drafting nursing notes is an expectation, not experience. They did not take part in any earlier session; they are not P07, the ICU nurse quoted in the February 2025 survey.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(handoff narrative)</em> The narrative part of their note is a safety artifact: it is where they record what worried them and why, the trend they are watching, and what they would do if it got worse. Flowsheet values show what happened; the narrative shows what the next nurse should watch for. At handoff the oncoming nurse reads it before the verbal report, and they described it as the one part of the note they write for a specific reader.</li><li><strong>[MEDIUM]</strong> <em>(expectation of AI drafting)</em> They were skeptical of any AI drafting nursing notes. Their expectation was that a draft could summarise the flowsheet but would not know what they were worried about, and that a nurse at the end of a twelve-hour shift would accept it rather than rewrite it. They saw that as worse than writing less. This is an expectation of a tool that doesn&#x27;t exist.</li><li><strong>[LOW]</strong> <em>(where help might fit)</em> They could see help with the parts that repeat flowsheet data in prose, as long as the narrative stayed theirs. This came up once, unprompted, and wasn&#x27;t explored.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The numbers are in the flowsheet. My note is what I was worried about at three a.m. That&#x27;s what the next nurse needs.&quot;</p><p>— Registered Nurse (ICU), P140</p></blockquote>\n<blockquote><p>&quot;At hour twelve, if it hands me a paragraph, I&#x27;m going to sign it. That&#x27;s what scares me.&quot;</p><p>— Registered Nurse (ICU), P140</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Treat the nursing narrative as a handoff safety artifact in any future discussion of AI drafting for nurses, not only as a documentation-burden item.</li><li>If AI drafting for nursing notes is ever scoped, test end-of-shift acceptance of drafts directly, since this nurse&#x27;s concern was about tired nurses accepting a draft, not about accuracy.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>This is one ICU nurse. It is consistent with the February 2025 survey&#x27;s note that ICU and ED nurses were more skeptical, but one interview does not validate that unit-level claim, which was low-confidence and had no per-unit figures.</li><li>Whether skepticism varies with years of experience (the survey&#x27;s tenure question) is still open; this interview can&#x27;t answer it.</li><li>How nurses on other units use the narrative at handoff is not known.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — ICU Nurse on the Handoff Narrative</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P140 — Registered Nurse (ICU) (nurse)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via ICU nursing contacts. This participant is new to the research and did not take part in any earlier session; they are not P07, the ICU nurse quoted in the February 2025 nursing survey. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — icu nurse on the handoff narrative nursing high-acuity documentation trust-in-ai project-cross-cutting interview — icu nurse on the handoff narrative objective the february 2025 nursing survey&#x27;s top volunteered concern was losing the clinical narrative voice, and an icu respondent wrote that their notes are how they hand off a patient safely. this session asked an icu nurse what the narrative in their notes does at shift handoff, and what they would expect of ai drafting nursing notes, which doesn&#x27;t exist. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a senior registered nurse in an adult icu. their charting is manual; the ambient scribe, ga since january 2026, drafts notes for physicians, nps and pas only, and no nurse uses it for their own documentation. everything they said about ai drafting nursing notes is an expectation, not experience. they did not take part in any earlier session; they are not p07, the icu nurse quoted in the february 2025 survey. key findings [high] (handoff narrative) the narrative part of their note is a safety artifact: it is where they record what worried them and why, the trend they are watching, and what they would do if it got worse. flowsheet values show what happened; the narrative shows what the next nurse should watch for. at handoff the oncoming nurse reads it before the verbal report, and they described it as the one part of the note they write for a specific reader. [medium] (expectation of ai drafting) they were skeptical of any ai drafting nursing notes. their expectation was that a draft could summarise the flowsheet but would not know what they were worried about, and that a nurse at the end of a twelve-hour shift would accept it rather than rewrite it. they saw that as worse than writing less. this is an expectation of a tool that doesn&#x27;t exist. [low] (where help might fit) they could see help with the parts that repeat flowsheet data in prose, as long as the narrative stayed theirs. this came up once, unprompted, and wasn&#x27;t explored. representative quotes &quot;the numbers are in the flowsheet. my note is what i was worried about at three a.m. that&#x27;s what the next nurse needs.&quot; — registered nurse (icu), p140 &quot;at hour twelve, if it hands me a paragraph, i&#x27;m going to sign it. that&#x27;s what scares me.&quot; — registered nurse (icu), p140 recommendations treat the nursing narrative as a handoff safety artifact in any future discussion of ai drafting for nurses, not only as a documentation-burden item. if ai drafting for nursing notes is ever scoped, test end-of-shift acceptance of drafts directly, since this nurse&#x27;s concern was about tired nurses accepting a draft, not about accuracy. follow-ups / open questions this is one icu nurse. it is consistent with the february 2025 survey&#x27;s note that icu and ed nurses were more skeptical, but one interview does not validate that unit-level claim, which was low-confidence and had no per-unit figures. whether skepticism varies with years of experience (the survey&#x27;s tenure question) is still open; this interview can&#x27;t answer it. how nurses on other units use the narrative at handoff is not known. related synthesized into: clinician-experience-documentation-burden.md participants participants — interview — icu nurse on the handoff narrative count: 1 roles: p140 — registered nurse (icu) (nurse) researcher: priya patel recruitment note: recruited via icu nursing contacts. this participant is new to the research and did not take part in any earlier session; they are not p07, the icu nurse quoted in the february 2025 nursing survey. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-06-02-interview-him-specialist-roi-ai-drafted-notes", "kind": "raw", "title": "Interview — HIM Specialist on Releasing AI-Drafted Notes", "date": "2026-06-02", "type": "interview", "status": "raw", "tags": ["him", "release-of-information", "phi", "legal-record", "sensitive-notes", "ai-generated-content", "project-him"], "related_components": ["roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-06-02-interview-him-specialist-roi-ai-drafted-notes/session-notes.md", "corrections": [], "html": "<h1>Interview — HIM Specialist on Releasing AI-Drafted Notes</h1>\n<h2>Objective</h2>\n<p>Understand how releasing records that contain scribe-drafted notes has changed day-to-day release of information (ROI) work since the ambient scribe went GA in January 2026: what the specialist thinks counts as the released legal record, what new redaction work the scribe has created, and what they would still expect from a redaction-assistance tool. The participant is an HIM specialist doing ROI fulfillment. They have the same role label as P69 in the July 2025 contextual inquiry but are a different person, and did not take part in that session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; no ROI redaction tool has been built or piloted either. 42 CFR Part 2 handling is still fully manual. The participant does first-pass review and redaction on ROI requests and passes anything that needs Part 2 handling to the second-level review described in the March 2026 supervisor interview.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(legal record)</em> The specialist isn&#x27;t sure what the released legal record is for a scribe-drafted note. They release the signed note as it appears in the chart, but they&#x27;ve heard the scribe keeps generation metadata somewhere (a draft, a transcript, or both, they weren&#x27;t sure) and don&#x27;t know whether that is part of the designated record set, whether a requester or an attorney could ask for it, or who would decide. Nobody has given ROI guidance on it since GA. They have had one request from an attorney&#x27;s office that asked for &quot;all versions and drafts&quot; of a visit note; it was escalated to the supervisor and they didn&#x27;t hear how it was resolved.</li><li><strong>[HIGH]</strong> <em>(sensitive notes)</em> The scribe captures things said in passing that a physician typing their own note would usually have left out, for example a patient mentioning a family member&#x27;s diagnosis or a relative&#x27;s substance use, or a side comment about a partner. These end up in the signed note and have to be found and redacted before release, page by page, because they&#x27;re not in a predictable section. By their own informal estimate, they find something like this in &quot;maybe one in five or six&quot; scribe-drafted notes in a typical release, though they said that was a guess and depends heavily on the clinic. This is separate from Part 2: most of what they redact here isn&#x27;t Part 2 content, but some of it could be, which pushes the request into second-level review.</li><li><strong>[MEDIUM]</strong> <em>(trust)</em> Asked about redaction assistance, they reaffirmed the July 2025 position: highlighting what might need redaction would help, especially for the incidental content above, but a person has to make the redaction and do the final release. They&#x27;d want to see why something was flagged. They were more skeptical than they expected to be about the tool missing things: &quot;it&#x27;s the stuff it doesn&#x27;t flag that I&#x27;d lose sleep over.&quot;</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;When somebody asks for the record, I send the signed note. But if there&#x27;s a draft sitting behind it that the scribe made, is that the record too? I genuinely don&#x27;t know, and I don&#x27;t think anybody&#x27;s told us.&quot;</p><p>— HIM Specialist (Release of Information), P124</p></blockquote>\n<blockquote><p>&quot;The scribe writes down everything. Mom&#x27;s diagnosis, the brother&#x27;s drinking, whatever came up while they were talking. Now that&#x27;s in the chart, and I&#x27;m the one who has to catch it before it goes out the door.&quot;</p><p>— HIM Specialist (Release of Information), P124</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Ask Legal/Compliance to state whether scribe generation metadata (drafts, transcripts, provenance) is part of the designated record set or legal record, and give ROI written guidance. Add this to the still-pending ratification of the CMIO&#x27;s August 2025 attestation model.</li><li>Share examples of incidental third-party and sensitive content captured by the scribe with the ambient scribe team, as input to what the drafting step leaves out of the note.</li><li>If ROI redaction assistance is scoped, keep it suggest-only with a human doing the redaction and final release, show why each item was flagged, and test specifically for missed incidental content, not only Part 2 content.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How was the &quot;all versions and drafts&quot; attorney request resolved, and by whom?</li><li>Does the scribe retain a transcript or draft after the note is signed, and for how long?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — HIM Specialist on Releasing AI-Drafted Notes</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P124 — HIM Specialist (Release of Information) (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2026-03-31). This participant is a different person from P69, the HIM specialist in the 2025-07-15 contextual inquiry, despite the same role label. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — him specialist on releasing ai-drafted notes him release-of-information phi legal-record sensitive-notes ai-generated-content project-him roi-redaction-tool interview — him specialist on releasing ai-drafted notes objective understand how releasing records that contain scribe-drafted notes has changed day-to-day release of information (roi) work since the ambient scribe went ga in january 2026: what the specialist thinks counts as the released legal record, what new redaction work the scribe has created, and what they would still expect from a redaction-assistance tool. the participant is an him specialist doing roi fulfillment. they have the same role label as p69 in the july 2025 contextual inquiry but are raft after the note is signed, and for how long? related synthesized into: him-coding-and-billing.md , governance-and-phi.md participants participants — interview — him specialist on releasing ai-drafted notes count: 1 roles: p124 — him specialist (release of information) (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2026-03-31). this participant is a different person from p69, the him specialist in the 2025-07-15 contextual inquiry, despite the same role label. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-06-09-interview-care-coordinator-remote-outreach", "kind": "raw", "title": "Interview — Remote Care Coordinator on Telephonic Outreach", "date": "2026-06-09", "type": "interview", "status": "raw", "tags": ["care-coordination", "chart-review", "workflow", "legacy", "project-care-coordination"], "related_components": ["chart-review-summary-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-06-09-interview-care-coordinator-remote-outreach/session-notes.md", "corrections": [], "html": "<h1>Interview — Remote Care Coordinator on Telephonic Outreach</h1>\n<h2>Objective</h2>\n<p>Understand how pre-outreach chart review works for a care coordinator who works fully remotely and does all their outreach by phone, and whether the January 2025 baseline&#x27;s two workarounds (cross-checking 3-4 systems before every call, and an undocumented colour-coding system in the shared spreadsheet) look different from home.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a care coordinator who works fully remotely and makes telephonic outreach calls to a panel of patients. They read the signed visit notes clinicians produce, including scribe-drafted ones, but don&#x27;t use the scribe themselves. Alerts still arrive in the chronological queue; the AI-ranked queue hasn&#x27;t been built. The chart-review summary panel is still a concept and wasn&#x27;t shown in this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(cross-checking systems)</em> Before each call they still cross-check the same 3 to 4 systems the January 2025 baseline described: the EHR, the care management platform, the shared spreadsheet and the legacy scheduling tool. Working from home, the legacy scheduling tool is the slowest of the four to load and to move around in, so it is the step they most often put off until they&#x27;re already on the phone. This is their own account; nothing was timed in this session.</li><li><strong>[MEDIUM]</strong> <em>(undocumented colour key)</em> They keep a private notes document alongside the shared spreadsheet, because the spreadsheet&#x27;s colour key isn&#x27;t written down anywhere. They learned what the colours mean by asking colleagues when they started, and wrote the answers into their own document. This is the baseline&#x27;s undocumented-workaround pattern again, now with a second, private layer on top of it.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;It&#x27;s still the same four places before every call. From home, the scheduling one is the one that makes me wait.&quot;</p><p>— Care Coordinator, P133</p></blockquote>\n<blockquote><p>&quot;Nobody wrote the colours down. I asked around, and now I&#x27;ve got my own little document that says what they mean.&quot;</p><p>— Care Coordinator, P133</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>When the chart-review summary concept is next tested, include remote coordinators and check how it handles data from the legacy scheduling tool, since that is the slowest source for them.</li><li>Treat the spreadsheet&#x27;s colour key as information the design has to carry (or replace), not a private convention each coordinator rebuilds for themselves.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How much slower the legacy scheduling tool is from home than on site is not measured; this is one coordinator&#x27;s impression.</li><li>How many coordinators keep a private key to the spreadsheet, as this participant does, is not known.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Remote Care Coordinator on Telephonic Outreach</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P133 — Care Coordinator (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions. This participant is new to the research and did not take part in the January 2025 baseline, the August 2025 alert-triage test or the 2026 interviews. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — remote care coordinator on telephonic outreach care-coordination chart-review workflow legacy project-care-coordination chart-review-summary-panel interview — remote care coordinator on telephonic outreach objective understand how pre-outreach chart review works for a care coordinator who works fully remotely and does all their outreach by phone, and whether the january 2025 baseline&#x27;s two workarounds (cross-checking 3-4 systems before every call, and an undocumented colour-coding system in the shared spreadsheet) look different from home. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a care coordinator who works fully remotely and makes telephonic outreach calls to a panel of patients. they read the signed visit notes clinicians produce, including scribe-drafted ones, but don&#x27;t use the scribe themselves. alerts still arrive in the chronological queue; the ai-ranked queue hasn&#x27;t been built. the chart-review summary panel is still a concept and wasn&#x27;t shown in this session. key findings [high] (cross-checking systems) before each call they still cross-check the same 3 to 4 systems the january 2025 baseline described: the ehr, the care management platform, the shared spreadsheet and the legacy scheduling tool. working from home, the legacy scheduling tool is the slowest of the four to load and to move around in, so it is the step they most often put off until they&#x27;re already on the phone. this is their own account; nothing was timed in this session. [medium] (undocumented colour key) they keep a private notes document alongside the shared spreadsheet, because the spreadsheet&#x27;s colour key isn&#x27;t written down anywhere. they learned what the colours mean by asking colleagues when they started, and wrote the answers into their own document. this is the baseline&#x27;s undocumented-workaround pattern again, now with a second, private layer on top of it. representative quotes &quot;it&#x27;s still the same four places before every call. from home, the scheduling one is the one that makes me wait.&quot; — care coordinator, p133 &quot;nobody wrote the colours down. i asked around, and now i&#x27;ve got my own little document that says what they mean.&quot; — care coordinator, p133 recommendations when the chart-review summary concept is next tested, include remote coordinators and check how it handles data from the legacy scheduling tool, since that is the slowest source for them. treat the spreadsheet&#x27;s colour key as information the design has to carry (or replace), not a private convention each coordinator rebuilds for themselves. follow-ups / open questions how much slower the legacy scheduling tool is from home than on site is not measured; this is one coordinator&#x27;s impression. how many coordinators keep a private key to the spreadsheet, as this participant does, is not known. related synthesized into: care-coordination-triage.md participants participants — interview — remote care coordinator on telephonic outreach count: 1 roles: p133 — care coordinator (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions. this participant is new to the research and did not take part in the january 2025 baseline, the august 2025 alert-triage test or the 2026 interviews. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-06-16-interview-utilization-review-nurse-case-scope", "kind": "raw", "title": "Interview — Returning Utilization Review Nurse on Pilot Case Scope", "date": "2026-06-16", "type": "interview", "status": "raw", "tags": ["nursing", "prior-auth", "utilization-management", "trust-in-ai", "project-prior-auth"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-06-16-interview-utilization-review-nurse-case-scope/session-notes.md", "corrections": [], "html": "<h1>Interview — Returning Utilization Review Nurse on Pilot Case Scope</h1>\n<h2>Objective</h2>\n<p>Check the prior-auth scope decision in <code>prior-authorization.md</code> against daily work, with a nurse who now uses the drafting panel. The finding says scope discipline held: pilot scope was limited to &quot;straightforward&quot; cases and complex cases were kept out (<code>findings/prior-authorization.md</code>:35-38), and that inline citations are actively used rather than ignored (lines 32-34). Both rest on test sessions with realistic scenarios. The participant is P19, returning from 2025-04-08-usability-test-prior-auth-ai-v1, where they said they liked the draft &quot;for the boring, obvious cases&quot; and wanted it kept away from complicated ones. The questions were whether the straightforward boundary matches the cases that actually reach them, how they check the panel&#x27;s citations, and which cases they still do by hand.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> A limited pilot of the prior-auth drafting panel has run in the utilization review department since early 2026, on straightforward cases only, the scope the v2 test recommended (2025-11-04-usability-test-prior-auth-ai-v2/session-notes.md:39). Complex cases stay manual. The pilot is not generally available and has not reached other departments. The panel shows inline citations to the chart entries behind each part of the draft. The participant is in the pilot and uses the panel on their own straightforward cases. They took part in the April 2025 v1 test only, not the November 2025 v2 test, so nothing here speaks to v2. They are not P17, the utilization review supervisor quoted in v1 and v2. No pilot outcomes data was reviewed in this session, and the written straightforward-case definition was not reviewed either; what the participant says about it is their own description.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(boundary vs case mix)</em> The boundary holds as a rule but does not sort their cases cleanly up front. In their own words, a straightforward case is &quot;one request, one current diagnosis, criteria we see every week.&quot; On their informal estimate, roughly half of what reaches them in a week looks like that at intake, and some of those turn out not to be once they are into the chart: an older related request, a prior claim denial on the same service, or evidence spread over years of notes. When that happens they stop using the draft and finish the case by hand, so the decision is made case by case, partway through, by the nurse. This complicates the finding&#x27;s &quot;scope discipline held&quot; claim: the scope held in testing, where cases were labelled straightforward or complex in advance, but in daily work the label is not known until the nurse has read enough of the chart.</li><li><strong>[MEDIUM]</strong> <em>(citation checking)</em> They open the citations for the diagnosis and for the date of the most recent supporting note on every case, and skim the rest. They check dates first because of the outdated-code issue they saw in v1. They said they have not seen an outdated code in the pilot; that is their account, not a count, and v2&#x27;s no-recurrence result covered 4 test cases. This confirms the finding&#x27;s claim that citations are used rather than ignored, and extends it from a test session to one nurse&#x27;s daily use; it says nothing about how other pilot users check.</li><li><strong>[MEDIUM]</strong> <em>(manual cases)</em> Cases they still do entirely by hand: anything following a prior claim denial, requests covering several services at once, and cases with long histories where they have to judge which evidence matters. Their reason was the same for all three: the work is deciding what to include, and a draft that includes things they then have to remove is slower than starting blank. Their rule when unsure is to treat the case as complex.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The definition&#x27;s fine on paper. The trouble is a lot of my cases look straightforward right up until I&#x27;m into the chart.&quot;</p><p>— Utilization Review Nurse, P19 (returning from 2025-04-08-usability-test-prior-auth-ai-v1)</p></blockquote>\n<blockquote><p>&quot;I click the dates first. After the old-codes problem last year, I don&#x27;t trust a diagnosis until I&#x27;ve seen when it was written.&quot;</p><p>— Utilization Review Nurse, P19 (returning from 2025-04-08-usability-test-prior-auth-ai-v1)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>When <code>prior-authorization.md</code> is next revised, say that the straightforward boundary is applied by the nurse during the case, not only at intake, and that cases leave the draft partway through.</li><li>Treat a case that starts in the panel and moves to manual as a normal path, and ask the pilot team whether it is recorded, since it is part of what the pilot is testing.</li><li>Keep dates prominent in the citations; this nurse checks them before anything else.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How the pilot is performing is not known: no outcomes data (time, accuracy, claim denials) is recorded in the corpus, and none was reviewed here. The only time figures on record are v1&#x27;s estimate and v2&#x27;s measurement on 2 straightforward test cases.</li><li>What &quot;pilot expansion&quot; in the v2 recommendation meant (how many nurses, how many weeks, what go/no-go metric) is still the open question v2 left; this participant did not know, and was not in v2.</li><li>How often a case leaves the draft partway through is not measured; &quot;roughly half&quot; looking straightforward at intake is one nurse&#x27;s estimate.</li><li>Whether other pilot users check citations the same way is not known; this is one interview.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/prior-authorization.md\">prior-authorization.md</a></li></ul><h2>Participants</h2><h1>Participants — Inte ections": [], "html": "<h1>Interview — Medical Coder on Review and Override Habits</h1>\n<h2>Objective</h2>\n<p>Understand how a production coder actually reviews and overrides prompts from the tools they already use, and what that suggests about how they would treat suggestions from the AI coding-suggestion concept if it were ever built. The question behind it is whether the human-final-decision model from July 2025 holds up under productivity quotas, or whether accept-by-default would set in on simple charts.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; 42 CFR Part 2 handling is still manual. The participant codes mostly outpatient encounters under a daily productivity quota and has coded from scribe-drafted notes since GA. They have not used the suggester; their expectations come from a walkthrough of the July 2025 screens during this session and from how they use the prompts and edits in their current coding tools.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(override habits)</em> On simple charts they already click through the prompts their current tools raise (edit warnings, &quot;are you sure&quot; checks) without reading most of them, because the quota is counted in charts per hour and the prompts are usually right or irrelevant. They expect they would do the same with a suggester: on a simple, single-diagnosis visit the suggested code would probably be accepted as shown unless something jumped out. They said this plainly and without much discomfort, and connected it to the quota, not to trust in the tool.</li><li><strong>[MEDIUM]</strong> <em>(complex charts)</em> On complex, multi-diagnosis charts they said they would ignore suggestions and code from the note as they do now, because checking someone else&#x27;s list takes longer than building their own. This matches what coders said in the July 2025 test about complex charts.</li><li><strong>[MEDIUM]</strong> <em>(citations)</em> They liked the idea of the source-text citation for each suggested code, but said they would open it only when a suggestion looks off: an unexpected code, an unusual specificity level or a code they wouldn&#x27;t have thought of. On a routine chart where the suggestion matches what they expected, they wouldn&#x27;t check it. They pointed out that this means the citation gets looked at least on exactly the charts where they&#x27;d be accepting by default.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Honestly? If it&#x27;s a simple visit and the code looks right, I&#x27;m clicking accept. I&#x27;ve got a number to hit by the end of the day. The quota wins. It always wins.&quot;</p><p>— Medical Coder, P125</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Don&#x27;t assume the human-final-decision model guarantees review. Design for accept-by-default on simple charts, and take that into account in the audit sampling the coding auditor proposed in April 2026 (higher sampling of codes accepted without edits).</li><li>Raise with HIM leadership whether productivity quotas would need adjusting for charts coded with AI assistance, so the quota doesn&#x27;t reward unreviewed acceptance.</li><li>Test whether surfacing the citation inline, rather than behind a click, changes how often coders read it on routine charts.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How are current quotas set, and do they differ for inpatient and outpatient coders?</li><li>Is there existing data on how often coders dismiss prompts in the current tools without changing anything?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Medical Coder on Review and Override Habits</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P125 — Medical Coder (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-29, 2026-03-10). The participant did not take part in the July 2025 usability test. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — medical coder on review and override habits him coding trust-in-ai audit-trail workflow project-him coding-suggestion-panel interview — medical coder on review and override habits objective understand how a production coder actually reviews and overrides prompts from the tools they already use, and what that suggests about how they would treat suggestions from the ai coding-suggestion concept if it were ever built. the question behind it is whether the human-final-decision model from july 2025 holds up under productivity quotas, or whether accept-by-default would set in on simple charts. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the ai coding-suggestion tool is still a concept from july 2025 and has not been built or piloted; 42 cfr part 2 handling is still manual. the participant codes mostly outpatient encounters under a daily productivity quota and has coded from scribe-drafted notes since ga. they have not used the suggester; their expectations come from a walkthrough of the july 2025 screens during this session and from how they use the prompts and edits in their current coding tools. key findings [high] (override habits) on simple charts they already click through the prompts their current tools raise  (2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md:21-27). Since GA, a family physician in an ambulatory primary care clinic described checking each medication change in the plan against the order they had placed (2026-03-24-interview-family-physician-plan-and-medication-changes-at-sign-off/session-notes.md:28, :32). No raw session dated on or before this one mentions a specialty clinic, rheumatology, a dose taper or a weekly dosing schedule. This session asked a rheumatologist, about six months after the January 2026 GA, how they check the medication lines in a draft when a patient&#x27;s medication list is long and doses change often.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a rheumatologist in an ambulatory specialty clinic, mid-career. They opted in to the ambient scribe after the January 2026 GA and use it for most visits. The scribe drafts the visit note only; the clinician enters orders, including medication orders, separately. Low-confidence transcription is shown with a subtle underline. The distinct medication flag tested on 2026-02-10 has not shipped; there is no medication-specific marking beyond the confidence underline. They did not take part in any earlier session, and the researcher did not share what other participants had said. This is an interview about their own practice; nothing was shown or observed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(long lists)</em> Many of their patients have long medication lists: disease-modifying drugs, a steroid, supplements, and drugs for other conditions managed by other clinicians. At most visits only one or two of those lines change. In the draft, a line that changed at this visit and a line that was only mentioned while going through the list look the same, and the underline marks only where the scribe was unsure what it heard. To find what changed they read the whole medication section against the orders they placed and the patient&#x27;s current list. They put a long list at &quot;fifteen lines, give or take&quot; for many of their patients, an informal impression, not a count.</li><li><strong>[HIGH]</strong> <em>(dose schedules)</em> In their account, dose changes in their clinic are often schedules rather than a single number: a prednisone taper stepped down over several weeks, or methotrexate taken once a week, where the day matters. They said the draft sometimes keeps the first step of a taper and drops the rest, or writes the methotrexate dose without &quot;weekly&quot;. Those lines are usually not underlined, because each word was heard clearly. They rewrite the schedule by hand before signing. They put an incomplete taper at &quot;a few times a month&quot;, an informal impression.</li><li><strong>[MEDIUM]</strong> <em>(whose dose)</em> Patients often say what they actually take, which can differ from what was prescribed (&quot;I&#x27;ve been taking half&quot;). The draft records the dose that was said without saying who said it, so a patient&#x27;s report can read like the clinician&#x27;s decision. They check whether each dose in the draft is what the patient reported or what they decided, and reword it so the note says which. This is one rheumatologist&#x27;s practice; whether other clinicians make the same check is not known.</li><li><strong>[LOW]</strong> <em>(what would help)</em> Asked what would help, without being shown anything, they said a way to see which medication lines changed at this visit. That is an expectation; nothing was shown, and the distinct medication flag was not discussed with them.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Fifteen medications and one of them changed today. The draft doesn&#x27;t tell me which one, so I read all fifteen.&quot;</p><p>— Physician (Rheumatology), P149</p></blockquote>\n<blockquote><p>&quot;It got the first dose right. The rest of the taper just isn&#x27;t there.&quot;</p><p>— Physician (Rheumatology), P149</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Share with the ambient scribe team that, in this rheumatologist&#x27;s account, multi-step dose schedules (tapers, weekly dosing) are where medication lines go wrong without being underlined, because each word is heard clearly.</li><li>When drafts are evaluated, include specialty-clinic visits with long medication lists and multi-step dose schedules, not only single dose changes.</li><li>Explore, as an open design question, whether a draft could show which medication lines changed at this visit and whether a dose is the patient&#x27;s report or the clinician&#x27;s decision; neither has been designed or tested.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often a dose schedule is written incompletely is not measured; &quot;a few times a month&quot; is one rheumatologist&#x27;s impression.</li><li>Whether other specialists, or NPs and PAs in specialty clinics, check medication lines the same way is not known; this is one interview.</li><li>Whether the distinct medication flag, which targets sound-alike names, would help with dose schedules is untested; it has not shipped.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier sessions: <a href=\"../2025-02-25-usability-test-ambient-scribe-v01/session-notes.md\">2025-02-25 v0.1 usability test</a>, <a href=\"../2025-09-23-usability-test-ambient-scribe-v02/session-notes.md\">2025-09-23 v0.2 usability test</a>, <a href=\"../2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">2026-01-13 GA release candidate</a>, <a href=\"../2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md\">2026-02-10 medication flag concept</a>, <a href=\"../2026-03-24-interview-family-physician-plan-and-medication-changes-at-sign-off/session-notes.md\">2026-03-24 family physician interview</a></li><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Rheumatologist on Medication Lines in Scribe Drafts</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P149 — Physician (Rheumatology) (physician)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via specialty clinic physician contacts, from clinicians who opted in to the ambient scribe after the January 2026 GA. This participant is new to the research and did not take part in any earlier session. They are not P09, P11, P22, P27, P84, P119, P146 or P147, the physicians in earlier sessions. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — rheumatologist on medication lines in scribe drafts ambient-scribe documentation medication-safety clinician-workflow project-ambient-scribe ambient-scribe-widget interview — rheumatologist on medication lines in scribe drafts objective earlier ambient-scribe sessions tested medication accuracy in drafts: dosage errors in v0.1 and v0.2 (2025-02-25-usability-test-ambient-scribe-v01/session-notes.md:30; 2025-09-23-usability-test-ambient-scribe-v02/session-notes.md:31), sound-alike drug names at the ga release candidate (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:31), and a concept for a distinct sound-alike medication flag (2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md:21-27). since ga, a family physician in an ambulatory primary care clinic described checking each medication change in the plan against the order they had placed (2026-03-24-interview-family-physician-plan-and-medication-changes-at-sign-off/session-notes.md:28, :32). no raw session dated te taken once a week, where the day matters. they said the draft sometimes keeps the first step of a taper and drops the rest, or writes the methotrexate dose without &quot;weekly&quot;. those lines are usually not underlined, because each word was heard clearly. they rewrite the schedule by hand before signing. they put an incomplete taper at &quot;a few times a month&quot;, an informal impression. [medium] (whose dose) patients often say what they actually take, which can differ from what was prescribed (&quot;i&#x27;ve been taking half&quot;). the draft records the dose that was said without saying who said it, so a patient&#x27;s report can read like the clinician&#x27;s decision. they check whether each dose in the draft is what the patient reported or what they decided, and reword it so the note says which. this is one rheumatologist&#x27;s practice; whether other clinicians make the same check is not known. [low] (what would help) asked what would help, without being shown anything, they said a way to see which medication lines changed at this visit. that is an expectation; nothing was shown, and the distinct medication flag was not discussed with them. representative quotes &quot;fifteen medications and one of them changed today. the draft doesn&#x27;t tell me which one, so i read all fifteen.&quot; — physician (rheumatology), p149 &quot;it got the first dose right. the rest of the taper just isn&#x27;t there.&quot; — physician (rheumatology), p149 recommendations share with the ambient scribe team that, in this rheumatologist&#x27;s account, multi-step dose schedules (tapers, weekly dosing) are where medication lines go wrong without being underlined, because each word is heard clearly. when drafts are evaluated, include specialty-clinic visits with long medication lists and multi-step dose schedules, not only single dose changes. explore, as an open design question, whether a draft could show which medication lines changed at this visit and whether a dose is the patient&#x27;s report or the clinician&#x27;s decision; neither has been designed or tested. follow-ups / open questions how often a dose schedule is written incompletely is not measured; &quot;a few times a month&quot; is one rheumatologist&#x27;s impression. whether other specialists, or nps and pas in specialty clinics, check medication lines the same way is not known; this is one interview. whether the distinct medication flag, which targets sound-alike names, would help with dose schedules is untested; it has not shipped. related earlier sessions: 2025-02-25 v0.1 usability test , 2025-09-23 v0.2 usability test , 2026-01-13 ga release candidate , 2026-02-10 medication flag concept , 2026-03-24 family physician interview synthesized into: ambient-scribe.md participants participants — interview — rheumatologist on medication lines in scribe drafts count: 1 roles: p149 — physician (rheumatology) (physician) researcher: priya patel recruitment note: recruited via specialty clinic physician contacts, from clinicians who opted in to the ambient scribe after the january 2026 ga. this participant is new to the research and did not take part in any earlier session. they are not p09, p11, p22, p27, p84, p119, p146 or p147, the physicians in earlier sessions. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-07-02-interview-family-physician-after-hours-charting-since-ga", "kind": "raw", "title": "Interview — Family Physician on After-Hours Charting Since GA", "date": "2026-07-02", "type": "interview", "status": "raw", "tags": ["documentation-burden", "documentation", "clinician-experience", "ambient-scribe", "clinician-workflow", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-07-02-interview-family-physician-after-hours-charting-since-ga/session-notes.md", "corrections": [], "html": "<h1>Interview — Family Physician on After-Hours Charting Since GA</h1>\n<h2>Objective</h2>\n<p>The September 2025 baseline survey asked about after-hours charting and reported it for physician respondents (2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md:29). It recommended future re-surveys &quot;(e.g., 6 and 12 months post-rollout)&quot; (same file, :40) and listed as a follow-up &quot;a repeat of this exact survey instrument 6 months after ambient scribe GA rollout&quot; (same file, :44). No repeat is recorded in research/raw on or before this session&#x27;s date: the only survey folder after September 2025 is the December 2025 all-staff AI readiness pulse (2025-12-02-survey-allstaff-ai-readiness-pulse). No earlier 1:1 session asked a physician about charting after clinic: among raw sessions dated on or before 2026-07-02, after-hours and &quot;pajama time&quot; charting appear only in the September survey (session-notes.md:29, :40). This session asked a family physician, about six months after the January 2026 GA, when and how they finish their notes now. It is one physician&#x27;s informal account and does not re-measure anything the survey measured.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a family medicine physician in an ambulatory primary care clinic, about ten years in practice. They opted in to the ambient scribe shortly after the January 2026 GA and use it for most visits. The scribe drafts the visit note only; the clinician reviews the draft, corrects single lines in place, and signs, and enters orders separately. They did not take part in any earlier session; whether they responded to the September 2025 survey is not known, because it was anonymous. This is an interview about their own practice; nothing was shown or observed, and nothing was timed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(evening notes)</em> They still finish some notes after clinic on most days. In their account the evening work is now mostly reading and signing drafts they didn&#x27;t get to between visits, plus the notes for visits where they chose not to use the scribe; before the scribe, they recalled, it was mostly writing notes from memory. They put it at &quot;four or five notes on a full day&quot;, an informal estimate. They have not timed it, then or now, and this is not a measure of time saved.</li><li><strong>[MEDIUM]</strong> <em>(which notes wait)</em> The drafts that wait until the evening are the ones that need more than a quick read: long visits with several problems, and drafts where they expect to move or rewrite lines. Short visits they try to sign straight after the patient leaves. When the clinic runs late, that falls apart and more drafts wait.</li><li><strong>[MEDIUM]</strong> <em>(reviewing later)</em> Reviewing a draft hours after the visit is harder for them than reviewing it straight away, because checking it depends on remembering what was said. In the evening they read more slowly and leave more of it as written when they can&#x27;t recall the detail. That is their own description of their practice; how often it happens was not discussed.</li><li><strong>[LOW]</strong> <em>(other evening work)</em> They said much of their evening now goes to patient messages and test results rather than notes, and the scribe doesn&#x27;t touch those. That is their impression; how their evening time divides was not measured.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The evening used to be writing. Now it&#x27;s mostly reading what it wrote and signing, and then the messages.&quot;</p><p>— Physician (Family Medicine), P150</p></blockquote>\n<blockquote><p>&quot;Right after the visit I remember what we said. By the evening I&#x27;m checking it against a memory that&#x27;s gone fuzzy.&quot;</p><p>— Physician (Family Medicine), P150</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Treat this interview as context for the repeat of the September 2025 survey, not as a measure. Whether after-hours charting has changed since GA needs that repeat, which the baseline recommended and which is not recorded in the corpus.</li><li>Share with the ambient scribe team that, in this physician&#x27;s account, a draft reviewed hours after the visit gets a weaker check, because the check depends on memory of the visit.</li><li>In later after-hours questions, ask about patient messages and test results as well as notes, since this physician placed much of their evening work there.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Whether after-hours charting has changed since GA is not measured; this is one physician&#x27;s informal account, and no repeat of the September 2025 survey is recorded in the corpus.</li><li>How their evening time divides between notes, messages and results is not measured.</li><li>Whether other physicians, or NPs and PAs, describe the same pattern is not known; this is one interview.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier session: <a href=\"../2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md\">2025-09-09 documentation burden baseline survey</a></li><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Family Physician on After-Hours Charting Since GA</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P150 — Physician (Family Medicine) (physician)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong>
