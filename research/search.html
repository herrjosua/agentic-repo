es comparison.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Decide with leadership whether the September burnout survey or a repeat of the February survey is the better instrument for the planned 6-month post-GA comparison.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/rollout-and-change-management.md\">rollout-and-change-management.md</a></li></ul><h2>Participants</h2><h1>Participants — Survey — All-Staff AI Readiness Pulse Survey</h1>\n<p><strong>Count:</strong> 421</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Clinical staff (various)</li><li>Non-clinical/administrative staff</li></ul>\n<p><strong>Researcher:</strong> M. Okafor</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "survey — all-staff ai readiness pulse survey survey organizational-readiness pulse year-end patient-chatbot-widget survey — all-staff ai readiness pulse survey objective take an org-wide temperature check on ai readiness/sentiment heading into 2026, as input to roadmap prioritization and communications planning. method method: org-wide anonymous pulse survey, 10 questions researcher: m. okafor full participant roster: see participants.md in this folder key findings [medium] (awareness gap) only 34% of non-clinical staff reported being aware compass ai initiatives were underway at all, versus 71% of clinical staff — suggesting internal communications have been clinically focused and may need broadening if non-clinical rollouts (e.g., scheduling) proceed. [medium] (sentiment trend (directional, not causal)) among clinical respondents, favorable sentiment toward ai-assisted documentation was somewhat higher than the march-ish baseline period, though this survey used different question wording than february's, so it's directional context rather than a clean comparison. [low] (top requested feature) when asked what ai feature they'd most want next, 'appointment scheduling help' was the top write-in among non-clinical/admin staff, and 'documentation time savings' remained the top pick among clinical staff — consistent with priorities identified all year. representative quotes \"i hear about this ai stuff from clinical friends but nobody's told admin staff what's actually happening or if it affects us.\" — non-clinical/administrative staff, p112 (survey open-ended) recommendations broaden internal communications about compass ai to non-clinical staff specifically before any admin-facing pilot (e.g., scheduling chatbot) goes live, given the awareness gap found here. if a clean sentiment trend is wanted for 2026 reporting, re-run the exact february nursing survey instrument rather than a new pulse survey, to get a true apples-to-apples comparison. follow-ups / open questions decide with leadership whether the september burnout survey or a repeat of the february survey is the better instrument for the planned 6-month post-ga comparison. related synthesized into: rollout-and-change-management.md participants participants — survey — all-staff ai readiness pulse survey count: 421 roles: clinical staff (various) non-clinical/administrative staff researcher: m. okafor recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-12-16-stakeholder-interview-executive-steering-committee-retro", "kind": "raw", "title": "Executive Steering Committee — Year-End Retro & 2026 Roadmap Input", "date": "2025-12-16", "type": "interview", "status": "raw", "tags": ["executive", "retro", "roadmap", "year-end", "governance"], "related_components": [], "severity": {}, "path": "raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md", "html": "<h1>Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</h1>\n<h2>Objective</h2>\n<p>Close out the year with the same executive group (plus two additions) from the January kickoff to review what research found, what shipped, and what should be prioritized in 2026.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Group interview/retro, 90 min, 4 executives</li><li><strong>Researcher:</strong> J. Alvarez</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(shared metrics gap partially closed)</em> The group agreed, informally, to adopt 'documentation time saved' and 'PHI incidents (target: zero)' as the two headline metrics going into 2026 — resolving the shared-metrics gap flagged as a finding back in January, though it's not yet been formally written into any governance document.</li><li><strong>[MEDIUM]</strong> <em>(recurring platform debt surfaced)</em> The CIO specifically called out the color-only status indicator issue (found independently in 3 separate 2025 audits) as an example of the kind of small, recurring finding that research should flag as a pattern, not just three separate tickets — asked for a standing 'cross-cutting findings' section in future reporting.</li><li><strong>[LOW]</strong> <em>(scope discipline praised)</em> VP Clinical Informatics specifically praised the decision to keep behavioral health and complex prior-auth cases out of scope for 2025, saying the discipline of 'not doing it' was as valuable as anything shipped.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"A year ago we couldn't agree on what success even meant. Now we at least agree on the two numbers we're arguing about. That's real progress.\"</p><p>— Chief Information Officer, P01 (returning from January)</p></blockquote>\n<blockquote><p>\"The stuff you told us not to build yet mattered as much as the stuff you told us to build.\"</p><p>— VP Clinical Informatics, P02 (returning from January)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Formalize the two agreed 2026 headline metrics in an actual governance document before Q1 2026 planning locks, so the informal agreement here doesn't get lost.</li><li>Introduce a standing 'cross-cutting findings' section in the research repo/reporting specifically to surface patterns like the color-only status issue across otherwise-separate sessions.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Draft the formal metrics document and route for exec sign-off in January 2026.</li><li>Retrofit a 'cross-cutting findings' index into the research repo covering 2025 (e.g., color-only status, transparency/citation requests, Part 2 flagging gap).</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</h1>\n<p><strong>Count:</strong> 4</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Chief Information Officer</li><li>VP Clinical Informatics</li><li>Chief Privacy Officer</li><li>Chief Medical Information Officer</li></ul>\n<p><strong>Researcher:</strong> J. Alvarez</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "executive steering committee — year-end retro & 2026 roadmap input executive retro roadmap year-end governance executive steering committee — year-end retro &amp; 2026 roadmap input objective close out the year s. follow-ups / open questions draft the formal metrics document and route for exec sign-off in january 2026. retrofit a 'cross-cutting findings' index into the research repo covering 2025 (e.g., color-only status, transparency/citation requests, part 2 flagging gap). related synthesized into: governance-and-phi.md participants participants — executive steering committee — year-end retro &amp; 2026 roadmap input count: 4 roles: chief information officer vp clinical informatics chief privacy officer chief medical information officer researcher: j. alvarez recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2026-01-13-usability-test-ambient-scribe-ga-release-candidate", "kind": "raw", "title": "Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)", "date": "2026-01-13", "type": "usability-test", "status": "raw", "tags": ["ambient-scribe", "usability", "documentation", "ga-release", "longitudinal"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "path": "raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md", "html": "<h1>Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</h1>\n<h2>Objective</h2>\n<p>Final validation pass on the ambient scribe before GA release, testing the v0.3 confidence-indicator concept (from September's recommendation) and confirming readiness against the full history of prior findings.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, simulated + 2 real (consented) low-acuity encounters, 45 min/session</li><li><strong>Researcher:</strong> M. Okafor</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[LOW]</strong> <em>(confidence indicator (positive))</em> The new per-line confidence highlighting (low-confidence transcription shown in a subtle underline) was well received and, notably, 4 of 6 participants said it let them skim high-confidence lines for the first time across the whole testing history — the first session where reduced line-by-line reading was observed.</li><li><strong>[MEDIUM]</strong> <em>(sound-alike medication errors)</em> Still present in 1 of 6 sessions despite the pronunciation dictionary work referenced in September; team should treat this as an ongoing monitoring item post-GA rather than a pre-GA blocker, given the confidence indicator now flags it for review anyway.</li><li><strong>[MEDIUM]</strong> <em>(training readiness)</em> Participants who'd been through the champion-model style training pilot (per October's recommendation) reported higher initial comfort than those who hadn't, though this wasn't a controlled comparison.</li><li><strong>[LOW]</strong> <em>(phi-handling (confirmed stable))</em> Draft-retention/auto-expiry behavior (fixed in v0.2) remains stable and correctly documented for audit purposes; no new PHI-handling issues found.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"This is the first time I actually skimmed a section instead of reading every word, because it showed me exactly where to look instead.\"</p><p>— Physician, Internal Medicine, P09 (returning from v0.1 and v0.2)</p></blockquote>\n<blockquote><p>\"I went through the champion training last month and honestly walked in already comfortable. That part worked.\"</p><p>— Nurse Practitioner, P118 (new participant)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Approve for GA release; the critical (Feb) and high (Feb, Sept) findings across this tool's full testing history are resolved or actively monitored, and the confidence-indicator concept appears to be the trust-building lever the team was looking for since September.</li><li>Continue tracking sound-alike medication errors as a post-GA metric rather than delaying release further for a low-frequency, now-flagged issue.</li><li>Use this session as the evidence base for the CIO's requested 'documentation time saved' 2026 headline metric baseline measurement.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Set up post-GA monitoring dashboard for sound-alike medication error rate.</li><li>Feed this session's time data into the formal 2026 metrics document (per December retro action item).</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</h1>\n<p><strong>Count:</strong> 6</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician (Family Medicine)</li><li>Physician (Internal Medicine)</li><li>Nurse Practitioner</li><li>Physician Assistant</li></ul>\n<p><strong>Researcher:</strong> M. Okafor</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ambient ai scribe ga release candidate (final validation) ambient-scribe usability documentation ga-release longitudinal ambient-scribe-widget encounter-view usability test — ambient ai scribe ga release candidate (final validation) objective final validation pass on the ambient scribe before ga release, testing the v0.3 confidence-indicator concept (from september's recommendation) and confirming readiness against the full history of prior findings. method method: moderated usability test, simulated + 2 real (consented) low-acuity encounters, 45 min/session researcher: m. okafor full participan ested 'documentation time saved' 2026 headline metric baseline measurement. follow-ups / open questions set up post-ga monitoring dashboard for sound-alike medication error rate. feed this session's time data into the formal 2026 metrics document (per december retro action item). related synthesized into: ambient-scribe.md participants participants — usability test — ambient ai scribe ga release candidate (final validation) count: 6 roles: physician (family medicine) physician (internal medicine) nurse practitioner physician assistant researcher: m. okafor recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2026-01-19-onboarding-usability-test", "kind": "raw", "title": "Onboarding usability test — session notes", "date": "2026-01-19", "type": "usability-test", "status": "raw", "tags": ["onboarding"], "related_components": [], "severity": {}, "path": "raw/2026-01-19-onboarding-usability-test/session-notes.md", "html": "<h2>Session 1 — Jan 19</h2>\n<p>Participant paused ~15s at step 3 (\"Connect calendar\"), said \"wait, do I have to do this?\" before proceeding. Completed step without connecting a real calendar (used the skip-adjacent \"I'll do this later\" affordance, which doesn't actually exist — participant tried clicking the step label itself as an exit).</p>\n<h2>Session 2 — Jan 20</h2>\n<p>Attempted to skip step 2 directly, assuming it was optional. Backed out when the \"required\" indicator appeared, expressed mild frustration (\"could've told me that up front\").</p>\n<h2>Session 3 — Jan 21</h2>\n<p>Same step 3 hesitation as session 1. When asked directly, said: \"I guess I'm worried this is going to email my whole team before I'm ready.\"</p>\n<h2>Sessions 4–6 (Jan 22–23)</h2>\n<p>Consistent with sessions 1–3: step 3 wording read as optional by all participants; none independently identified it as required without hitting the \"required\" state first.</p><h2>Participants</h2><p>6 participants, all first-time Fernway workspace admins hired within the last 90 days. Company sizes ranged 10–200 employees, mix of industries. Recruited via existing customer outreach list, screened for \"has not previously completed Fernway onboarding themselves.\"</p>", "searchText": "onboarding usability test — session notes onboarding session 1 — jan 19 participant paused ~15s at step 3 (\"connect calendar\"), said \"wait, do i have to do this?\" before proceeding. completed step without connecting a real calendar (used the skip-adjacent \"i'll do this later\" affordance, which doesn't actually exist — participant tried clicking the step label itself as an exit). session 2 — jan 20 attempted to skip step 2 directly, assuming it was optional. backed out when the \"required\" indicator appeared, expressed mild frustration (\"could've told me that up front\"). session 3 — jan 21 same step 3 hesitation as session 1. when asked directly, said: \"i guess i'm worried this is going to email my whole team before i'm ready.\" sessions 4–6 (jan 22–23) consistent with sessions 1–3: step 3 wording read as optional by all participants; none independently identified it as required without hitting the \"required\" state first. participants 6 participants, all first-time fernway workspace admins hired within the last 90 days. company sizes ranged 10–200 employees, mix of industries. recruited via existing customer outreach list, screened for \"has not previously completed fernway onboarding themselves.\""}, {"id": "raw:2026-01-27-dashboard-review-ambient-scribe-ga-adoption", "kind": "raw", "title": "Dashboard review — Ambient scribe GA candidate adoption", "date": "2026-01-27", "type": "analytics", "status": "raw", "tags": ["ambient-scribe", "ga-release", "dashboard"], "related_components": ["ambient-scribe-widget"], "severity": {}, "path": "raw/2026-01-27-dashboard-review-ambient-scribe-ga-adoption/session-notes.md", "html": "<h1>Dashboard review — Ambient scribe GA candidate adoption</h1>\n<h2>Objective</h2>\n<p>Manually review the internal usage dashboard for the ambient scribe GA release candidate to see whether adoption and engagement patterns in real usage match what the GA-candidate usability round found — particularly whether the per-line confidence highlighting is actually changing reviewing behavior at scale, not just in the moderated session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Manual dashboard review (no moderated session, no participants) — internal analytics</li></ul>\n<p>dashboard covering the first 4 weeks of GA-candidate rollout</p>\n<ul><li><strong>Researcher:</strong> J. Bock</li><li><strong>Full participant roster:</strong> none — this is an analytics review, not a research session; see</li></ul>\n<p><code>participants.md</code> in this folder for why</p>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(trust)</em> Clinicians who were shown confidence highlighting skim high-confidence</li></ul>\n<p>lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the usability round's finding that visible uncertainty, not raw accuracy, changes reviewing behavior.</p>\n<ul><li><strong>[LOW]</strong> <em>(adoption)</em> Adoption is uneven by role: attending physicians are opting in at a</li></ul>\n<p>noticeably higher rate than residents in the same departments, worth understanding qualitatively rather than assuming it's a training gap.</p>\n<h2>Recommendations</h2>\n<ol><li>Feed this dashboard pattern back into <code>findings/ambient-scribe.md</code> as corroborating evidence for</li></ol>\n<p>the confidence-highlighting result, rather than treating it as a separate finding.</p>\n<ol><li>Consider a short follow-up interview round specifically on the physician/resident adoption gap.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Is the physician/resident adoption gap explained by workflow differences, trust, or something</li></ul>\n<p>else entirely? Dashboard data alone can't answer this.</p>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Dashboard review — Ambient scribe GA candidate adoption</h1>\n<p><strong>Count:</strong> N/A</p>\n<p><strong>Roles:</strong> N/A — this session has no research participants. It's a manual review of aggregate, de-identified usage data from the internal analytics dashboard, not a moderated or observed session. This file exists only to keep the folder shape consistent with every other <code>raw/</code> session for indexing purposes.</p>\n<p><strong>Researcher:</strong> J. Bock</p>", "searchText": "dashboard review — ambient scribe ga candidate adoption ambient-scribe ga-release dashboard ambient-scribe-widget dashboard review — ambient scribe ga candidate adoption objective manually review the internal usage dashboard for the ambient scribe ga release candidate to see whether adoption and engagement patterns in real usage match what the ga-candidate usability round found — particularly whether the per-line confidence highlighting is actually changing reviewing behavior at scale, not just in the moderated session. method method: manual dashboard review (no moderated session, no participants) — internal analytics dashboard covering the first 4 weeks of ga-candidate rollout researcher: j. bock full participant roster: none — this is an analytics review, not a research session; see participants.md in this folder for why key findings [medium] (trust) clinicians who were shown confidence highlighting skim high-confidence lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the usability round's finding that visible uncertainty, not raw accuracy, changes reviewing behavior. [low] (adoption) adoption is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments, worth understanding qualitatively rather than assuming it's a training gap. recommendations feed this dashboard pattern back into findings/ambient-scribe.md as corroborating evidence for the confidence-highlighting result, rather than treating it as a separate finding. consider a short follow-up interview round specifically on the physician/resident adoption gap. follow-ups / open questions is the physician/resident adoption gap explained by workflow differences, trust, or something else entirely? dashboard data alone can't answer this. related synthesized into: ambient-scribe.md participants participants — dashboard review — ambient scribe ga candidate adoption count: n/a roles: n/a — this session has no research participants. it's a manual review of aggregate, de-identified usage data from the internal analytics dashboard, not a moderated or observed session. this file exists only to keep the folder shape consistent with every other raw/ session for indexing purposes. researcher: j. bock"}, {"id": "finding:accessibility-cross-cutting", "kind": "finding", "title": "Accessibility (Cross-Cutting)", "date": "2025-11-18", "type": "synthesis", "status": "synthesized", "tags": ["accessibility", "components", "design-system", "extjs", "legacy", "low-vision", "mobile", "motor-impairment", "section-508", "wcag"], "related_components": ["admin-console-grid", "alert-triage-queue", "design-system-form-field", "design-system-modal", "mobile-app-alert-list"], "severity": {}, "path": "findings/accessibility-cross-cutting.md", "html": "<h1>Accessibility (Cross-Cutting)</h1>\n<h2>Overview</h2>\n<p>Three independent WCAG 2.1 AA audits across the year — the legacy ExtJS admin console (Mar 2025), the new design system component library (Jul 2025), and the mobile clinician app (Nov 2025) — turned up one recurring pattern worth calling out on its own, separate from each audit's other findings.</p>\n<ul><li>**The same color-only status indicator (red/yellow/green dots, no text/pattern alternative)</li></ul>\n<p>appears in all three surfaces audited this year.** This was flagged as a likely single shared root component rather than three separate bugs, and the CIO cited it at the December executive retro as the example of what a \"cross-cutting findings\" reporting category should look like going forward (see <a href=\"governance-and-phi.md\">governance-and-phi.md</a>).</p>\n<ul><li><strong>Progress is visible surface-by-surface even though the pattern repeats</strong>: the modal</li></ul>\n<p>keyboard-trap issue found in the legacy console (Mar) was already fixed by the time the new design system's modal component was audited (Jul), though that same audit surfaced a <em>new</em> issue (form-field error association) not present in the legacy system.</p>\n<ul><li><strong>The mobile app audit (Nov) connects directly to a live Compass AI feature</strong>: undersized touch</li></ul>\n<p>targets (32×32px vs. the 44×44px minimum) were found specifically on the alert-triage icon set, which is the same feature usability-tested in August — see <a href=\"care-coordination-triage.md\">care-coordination-triage.md</a>. This is a case where an accessibility defect and a usability finding land on the exact same component from two different research methods.</p>\n<p>Recommendation: treat the color-only status pattern as a single design-system-level fix rather than three surface-level tickets, and confirm whether a shared component is in fact the common root cause.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-03-10</strong> — <a href=\"../raw/2025-03-10-accessibility-audit-legacy-extjs-admin-console/session-notes.md\">Accessibility Audit — Legacy Admin Console (ExtJS)</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2025-07-01</strong> — <a href=\"../raw/2025-07-01-accessibility-audit-new-design-system-components/session-notes.md\">Accessibility Audit — New Design System Component Library</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2025-11-18</strong> — <a href=\"../raw/2025-11-18-accessibility-audit-mobile-clinician-app/session-notes.md\">Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</a> <em>(<code>accessibility-audit</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>(none currently linked)</li></ul>", "searchText": "accessibility (cross-cutting) accessibility components design-system extjs legacy low-vision mobile motor-impairment section-508 wcag admin-console-grid alert-triage-queue design-system-form-field design-system-modal mobile-app-alert-list accessibility (cross-cutting) overview three independent wcag 2.1 aa audits across the year — the legacy extjs admin console (mar 2025), the new design system component library (jul 2025), and the mobile clinician app (nov 2025) — turned up one recurring pattern worth calling out on its own, separate from each audit's other findings. **the same color-only status indicator (red/yellow/green dots, no text/pattern alternative) appears in all three surfaces audited this year.** this was flagged as a likely single shared root component rather than three separate bugs, and the cio cited it at the december executive retro as the example of what a \"cross-cutting findings\" reporting category should look like going forward (see governance-and-phi.md ). progress is visible surface-by-surface even though the pattern repeats : the modal keyboard-trap issue found in the legacy console (mar) was already fixed by the time the new design system's modal component was audited (jul), though that same audit surfaced a new issue (form-field error association) not present in the legacy system. the mobile app audit (nov) connects directly to a live compass ai feature : undersized touch targets (32×32px vs. the 44×44px minimum) were found specifically on the alert-triage icon set, which is the same feature usability-tested in august — see care-coordination-triage.md . this is a case where an accessibility defect and a usability finding land on the exact same component from two different research methods. recommendation: treat the color-only status pattern as a single design-system-level fix rather than three surface-level tickets, and confirm whether a shared component is in fact the common root cause. evidence trail 2025-03-10 — accessibility audit — legacy admin console (extjs) ( accessibility-audit ) 2025-07-01 — accessibility audit — new design system component library ( accessibility-audit ) 2025-11-18 — accessibility audit — mobile clinician app (low vision &amp; motor impairment focus) ( accessibility-audit ) related findings (none currently linked)"}, {"id": "finding:ambient-scribe", "kind": "finding", "title": "Ambient AI Scribe", "date": "2026-01-13", "type": "synthesis", "status": "synthesized", "tags": ["ambient-scribe", "documentation", "ga-release", "longitudinal", "usability", "v0.1", "v0.2"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "path": "findings/ambient-scribe.md", "html": "<h1>Ambient AI Scribe</h1>\n<h2>Overview</h2>\n<p>The ambient AI scribe has moved from a formative concept (v0.1, Feb 2025) through iteration (v0.2, Sep 2025) to a GA release candidate (Jan 2026), with 3 of the original 5 physician participants retained across all three rounds for longitudinal comparison.</p>\n<ul><li><strong>PHI handling:</strong> The critical draft-retention/audit gap found in v0.1 was fixed by v0.2 and has</li></ul>\n<p>remained stable through the GA candidate — drafts auto-expire after 10 minutes of inactivity and the behavior is documented for Compliance. No PHI-handling issues have recurred since.</p>\n<ul><li><strong>Accuracy:</strong> Medication dosage errors dropped from 3/5 sessions (v0.1) to 1/5 (v0.2), driven by</li></ul>\n<p>fixing outright garbling; the remaining error class is specifically sound-alike medication names, which is now a tracked, monitored issue rather than a blocker.</p>\n<ul><li><strong>Trust calibration was the hardest problem, and accuracy alone didn't solve it.</strong> Returning</li></ul>\n<p>participants read every line in both v0.1 and v0.2 despite the accuracy improvement between them — trust didn't move with correctness. The GA-candidate round introduced per-line confidence highlighting, and for the first time participants reported actually skimming high-confidence lines. This is the strongest evidence so far that <em>visible uncertainty</em>, not raw accuracy, is the lever that changes reviewing behavior.</p>\n<ul><li><strong>Recommendation status:</strong> Approved for GA release. Sound-alike medication errors move to</li></ul>\n<p>post-GA monitoring rather than blocking launch.</p>\n<p>Open thread: this tool's rollout scope has been deliberately kept away from behavioral health / substance-use encounters — see <a href=\"scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a>.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-02-25</strong> — <a href=\"../raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md\">Usability Test — Ambient AI Scribe Prototype v0.1</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-09-23</strong> — <a href=\"../raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md\">Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-01-13</strong> — <a href=\"../raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"governance-and-phi.md\">AI Governance, PHI &amp; Compliance</a></li><li><a href=\"clinician-experience-documentation-burden.md\">Clinician Experience &amp; Documentation Burden</a></li></ul>", "searchText": "ambient ai scribe ambient-scribe documentation ga-release longitudinal usability v0.1 v0.2 ambient-scribe-widget encounter-view ambient ai scribe overview the ambient ai scribe has moved from a formative concept (v0.1, feb 2025) through iteration (v0.2, sep 2025) to a ga release candidate (jan 2026), with 3 of the original 5 physician participants retained across all three rounds for longitudinal comparison. phi handling: the critical draft-retention/audit gap found in v0.1 was fixed by v0.2 and has remained stable through the ga candidate — drafts auto-expire after 10 minutes of inactivity and the behavior is documented for compliance. no phi-handling issues have recurred since. accuracy: medication dosage errors dropped from 3/5 sessions (v0.1) to 1/5 (v0.2), driven by fixing outright garbling; the remaining error class is specifically sound-alike medication names, which is now a tracked, monitored issue rather than a blocker. trust calibration was the hardest problem, and accuracy alone didn't solve it. returning participants read every line in both v0.1 and v0.2 despite the accuracy improvement between them — trust didn't move with correctness. the ga-candidate round introduced per-line confidence highlighting, and for the first time participants reported actually skimming high-confidence lines. this is the strongest evidence so far that visible uncertainty , not raw accuracy, is the lever that changes reviewing behavior. recommendation status: approved for ga release. sound-alike medication errors move to post-ga monitoring rather than blocking launch. open thread: this tool's rollout scope has been deliberately kept away from behavioral health / substance-use encounters — see scope-boundaries-and-workflow-fit.md . evidence trail 2025-02-25 — usability test — ambient ai scribe prototype v0.1 ( usability-test ) 2025-09-23 — usability test — ambient ai scribe prototype v0.2 (follow-up) ( usability-test ) 2026-01-13 — usability test — ambient ai scribe ga release candidate (final validation) ( usability-test ) related findings ai governance, phi &amp; compliance clinician experience &amp; documentation burden"}, {"id": "finding:care-coordination-triage", "kind": "finding", "title": "Care Coordination & Alert Triage", "date": "2025-08-26", "type": "synthesis", "status": "synthesized", "tags": ["alert-fatigue", "alert-triage", "baseline", "care-coordination", "chart-review", "usability", "workflow"], "related_components": ["alert-triage-queue", "chart-review-summary-panel"], "severity": {}, "path": "findings/care-coordination-triage.md", "html": "<h1>Care Coordination &amp; Alert Triage</h1>\n<h2>Overview</h2>\n<p>Two sessions bookend this topic: a baseline contextual inquiry of manual chart review (Jan 2025, before any AI concept existed) and a usability test of an AI-ranked alert triage queue (Aug 2025).</p>\n<ul><li><strong>The baseline shaped what got built.</strong> Coordinators explicitly said they didn't want full</li></ul>\n<p>AI summarization (they already distrust the EHR's existing auto-summary tool after it missed medication changes twice) — what they wanted was \"what changed since I last looked.\" The August alert-triage concept is a variant of that same idea applied to alert prioritization rather than chart summarization.</p>\n<ul><li><strong>The triage ranking works, but not for the reason initially expected.</strong> It was faster</li></ul>\n<p>(6.5 min vs. 9 min to clear a 20-item queue), but 4 of 5 participants disagreed with at least one ranking decision, generally because the model weighted recency over coordinators' own sense of patient-history-driven risk — echoing the alert-fatigue concern raised separately in the May clinician dashboard testing (see <a href=\"clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a>). There was also no way to capture <em>why</em> a coordinator overrode a ranking, which both loses a model-improvement signal and undercuts the sense of agency the supervisor specifically flagged as a risk (fast-but-wrong being worse than slow-but-right in this workflow).</p>\n<ul><li><strong>This is also where the mobile accessibility touch-target finding lands</strong> — the alert-triage icon</li></ul>\n<p>set audited in November is the same feature tested here in August (see <a href=\"accessibility-cross-cutting.md\">accessibility-cross-cutting.md</a>).</p>\n<p>Recommendation: add lightweight override-reason capture before further ranking-model tuning, and share it with whoever owns the care-gap flagging model tuning, since it's likely the same underlying problem.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-01-29</strong> — <a href=\"../raw/2025-01-29-contextual-inquiry-chart-review-baseline/session-notes.md\">Contextual Inquiry — Manual Chart Review Baseline (Care Coordinators)</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-08-26</strong> — <a href=\"../raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md\">Usability Test — AI Alert Triage for Care Coordination</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"clinician-experience-documentation-burden.md\">Clinician Experience &amp; Documentation Burden</a></li></ul>", "searchText": "care coordination & alert triage alert-fatigue alert-triage baseline care-coordination chart-review usability workflow alert-triage-queue chart-review-summary-panel care coordination &amp; alert triage overview two sessions bookend this topic: a baseline contextual inquiry of manual chart review (jan 2025, before any ai concept existed) and a usability test of an ai-ranked alert triage queue (aug 2025). the baseline shaped what got built. coordinators explicitly said they didn't want full ai summarization (they already distrust the ehr's existing auto-summary tool after it missed medication changes twice) — what they wanted was \"what changed since i last looked.\" the august alert-triage concept is a variant of that same idea applied to alert prioritization rather than chart summarization. the triage ranking works, but not for the reason initially expected. it was faster (6.5 min vs. 9 min to clear a 20-item queue), but 4 of 5 participants disagreed with at least one ranking decision, generally because the model weighted recency over coordinators' own sense of patient-history-driven risk — echoing the alert-fatigue concern raised separately in the may clinician dashboard testing (see clinician-experience-documentation-burden.md ). there was also no way to capture why a coordinator overrode a ranking, which both loses a model-improvement signal and undercuts the sense of agency the supervisor specifically flagged as a risk (fast-but-wrong being worse than slow-but-right in this workflow). this is also where the mobile accessibility touch-target finding lands — the alert-triage icon set audited in november is the same feature tested here in august (see accessibility-cross-cutting.md ). recommendation: add lightweight override-reason capture before further ranking-model tuning, and share it with whoever owns the care-gap flagging model tuning, since it's likely the same underlying problem. evidence trail 2025-01-29 — contextual inquiry — manual chart review baseline (care coordinators) ( contextual-inquiry ) 2025-08-26 — usability test — ai alert triage for care coordination ( usability-test ) related findings clinician experience &amp; documentation burden"}, {"id": "finding:clinician-experience-documentation-burden", "kind": "finding", "title": "Clinician Experience & Documentation Burden", "date": "2025-09-09", "type": "synthesis", "status": "synthesized", "tags": ["baseline", "burnout", "clinician-experience", "dashboard", "documentation-burden", "information-architecture", "nursing", "survey", "trust-in-ai", "usability"], "related_components": ["ambient-scribe-widget", "care-gap-badge", "clinician-dashboard"], "severity": {}, "path": "findings/clinician-experience-documentation-burden.md", "html": "<h1>Clinician Experience &amp; Documentation Burden</h1>\n<h2>Overview</h2>\n<p>Three sessions trace clinician sentiment and documentation burden across the year: a nursing attitudes survey (Feb 2025, before AI framing was introduced), a clinician dashboard usability test (May 2025), and an org-wide burnout/documentation-burden baseline survey (Sep 2025, which explicitly referenced the AI initiative).</p>\n<ul><li><strong>The top volunteered concern was not accuracy or privacy — it was voice.</strong> In February, \"losing</li></ul>\n<p>my clinical narrative voice / it will sound robotic\" was the most common open-ended concern among nurses, ahead of accuracy or trust concerns that were originally hypothesized to dominate.</p>\n<ul><li><strong>Documentation burden is real and quantifiable, not just anecdotal.</strong> The September baseline</li></ul>\n<p>found documentation burden is physicians' #1 self-selected burnout driver (52%, ahead of patient volume at 31%), with 64% doing regular after-hours \"pajama time\" charting (avg. 1.2 hrs/day). This is now the official pre-AI baseline for measuring Compass AI's impact at 6 and 12 months post-GA. <strong>Caveat:</strong> the September survey mentioned the AI initiative explicitly in its framing, while the February survey didn't — any comparison between the two datasets needs to account for that framing difference, not treat them as a clean before/after.</p>\n<ul><li><strong>Alert fatigue is an emerging risk, not yet realized.</strong> The May dashboard test found that 5 of 6</li></ul>\n<p>participants expected AI-flagged \"care gap\" badges to become background noise within a week if flagging precision isn't improved — 2 of the 3 example flags shown were judged clinically low-value. This is the same alert-fatigue pattern later confirmed in the care-coordination alert triage testing (see <a href=\"care-coordination-triage.md\">care-coordination-triage.md</a>), suggesting it's a property of how these flagging models are currently tuned generally, not a one-off UI problem.</p>\n<p>Recommendation: do not ship the care-gap flagging feature until precision is validated against clinical review, and use the September survey as the fixed baseline instrument for future comparisons rather than re-wording the questions.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-02-11</strong> — <a href=\"../raw/2025-02-11-survey-nursing-attitudes-ai-documentation/session-notes.md\">Survey — Nursing Staff Attitudes Toward AI-Assisted Documentation</a> <em>(<code>survey</code>)</em></li><li><strong>2025-05-06</strong> — <a href=\"../raw/2025-05-06-usability-test-clinician-dashboard-redesign-v1/session-notes.md\">Usability Test — Clinician Dashboard Redesign (v1)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-09-09</strong> — <a href=\"../raw/2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md\">Survey — Clinician Burnout &amp; Documentation Burden Baseline</a> <em>(<code>survey</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"ambient-scribe.md\">Ambient AI Scribe</a></li><li><a href=\"care-coordination-triage.md\">Care Coordination &amp; Alert Triage</a></li></ul>", "searchText": "clinician experience & documentation burden baseline burnout clinician-experience dashboard documentation-burden information-architecture nursing survey trust-in-ai usability ambient-scribe-widget care-gap-badge clinician-dashboard clinician experience &amp; documentation burden overview three sessions trace clinician sentiment and documentation burden across the year: a nursing attitudes survey (feb 2025, before ai framing was introduced), a clinician dashboard usability test (may 2025), and an org-wide burnout/documentation-burden baseline survey (sep 2025, which explicitly referenced the ai initiative). the top volunteered concern was not accuracy or privacy — it was voice. in february, \"losing my clinical narrative voice / it will sound robotic\" was the most common open-ended concern among nurses, ahead of accuracy or trust concerns that were originally hypothesized to dominate. documentation burden is real and quantifiable, not just anecdotal. the september baseline found documentation burden is physicians' #1 self-selected burnout driver (52%, ahead of patient volume at 31%), with 64% doing regular after-hours \"pajama time\" charting (avg. 1.2 hrs/day). this is now the official pre-ai baseline for measuring compass ai's impact at 6 and 12 months post-ga. caveat: the september survey mentioned the ai initiative explicitly in its framing, while the february survey didn't — any comparison between the two datasets needs to account for that framing difference, not treat them as a clean before/after. alert fatigue is an emerging risk, not yet realized. the may dashboard test found that 5 of 6 participants expected ai-flagged \"care gap\" badges to become background noise within a week if flagging precision isn't improved — 2 of the 3 example flags shown were judged clinically low-value. this is the same alert-fatigue pattern later confirmed in the care-coordination alert triage testing (see care-coordination-triage.md ), suggesting it's a property of how these flagging models are currently tuned generally, not a one-off ui problem. recommendation: do not ship the care-gap flagging feature until precision is validated against clinical review, and use the september survey as the fixed baseline instrument for future comparisons rather than re-wording the questions. evidence trail 2025-02-11 — survey — nursing staff attitudes toward ai-assisted documentation ( survey ) 2025-05-06 — usability test — clinician dashboard redesign (v1) ( usability-test ) 2025-09-09 — survey — clinician burnout &amp; documentation burden baseline ( survey ) related findings ambient ai scribe care coordination &amp; alert triage"}, {"id": "finding:governance-and-phi", "kind": "finding", "title": "AI Governance, PHI & Compliance", "date": "2025-12-16", "type": "synthesis", "status": "synthesized", "tags": ["ai-generated-content", "ai-strategy", "audit-trail", "cmio", "de-identification", "executive", "governance", "hipaa", "kickoff", "legal-record", "phi", "privacy", "retro", "roadmap", "year-end"], "related_components": [], "severity": {}, "path": "findings/governance-and-phi.md", "html": "<h1>AI Governance, PHI &amp; Compliance</h1>\n<h2>Overview</h2>\n<p>This is the connective tissue for the whole program: four executive-level sessions across the year, from initial kickoff (Jan 2025) to year-end retro (Dec 2025), plus a Privacy Officer interview (Mar 2025) and a CMIO interview (Aug 2025) in between.</p>\n<ul><li><strong>The shared-metrics gap identified in January was real and took all year to close.</strong> At kickoff,</li></ul>\n<p>the CIO and VP Clinical Informatics couldn't agree on what \"success\" meant. By December's retro, the same two executives (plus Privacy and CMIO) had converged on two headline 2026 metrics: documentation time saved, and PHI incidents (target: zero). This is the single clearest before/after in the whole research program and should anchor how the 2026 roadmap is framed.</p>\n<ul><li>**De-identification and audit-trail requirements (Privacy Officer, Mar) turned out to be</li></ul>\n<p>non-negotiable engineering constraints, not policy nice-to-haves**: Safe Harbor-level de-identification for any fine-tuning/eval data, and model-version + input provenance logging for anything that becomes part of the legal record. These constraints were later validated as workable by the CMIO's August interview, which proposed a concrete attestation model (once a clinician signs AI-assisted content, it carries the same liability as if they'd typed it, with generation metadata kept in an internal audit log only) — but that model still needs formal Legal/Compliance ratification, it is not yet policy.</p>\n<ul><li><strong>PHI-sensitivity-ordered rollout sequencing</strong> (lowest-sensitivity workflows first: scheduling →</li></ul>\n<p>admin/coding → documentation → clinical-decision-adjacent) was proposed independently by executives in January and reaffirmed by the CMIO in August — it's held up as a stable planning principle across two separate conversations eight months apart.</p>\n<ul><li>**A recurring cross-cutting finding was explicitly named as a category, not just fixed three</li></ul>\n<p>times**: the CIO used the color-only status indicator accessibility bug (found independently in three separate audits — see <a href=\"accessibility-cross-cutting.md\">accessibility-cross-cutting.md</a>) as the example of a pattern research should flag as such, not file as three unrelated tickets.</p>\n<p>Two items still need to move from \"informally agreed in a meeting\" to an actual governance document: the 2026 headline metrics, and the AI-content attestation model.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-01-14</strong> — <a href=\"../raw/2025-01-14-stakeholder-interview-ai-strategy-kickoff/session-notes.md\">AI Strategy Kickoff — Executive Alignment Interview</a> <em>(<code>interview</code>)</em></li><li><strong>2025-03-24</strong> — <a href=\"../raw/2025-03-24-interview-privacy-officer-deidentification-requirements/session-notes.md\">Interview — Privacy/Compliance Officer on De-Identification &amp; Audit Trail Requirements</a> <em>(<code>interview</code>)</em></li><li><strong>2025-08-12</strong> — <a href=\"../raw/2025-08-12-interview-cmio-ai-generated-content-governance/session-notes.md\">Interview — CMIO on Governance for AI-Generated Content in the Legal Record</a> <em>(<code>interview</code>)</em></li><li><strong>2025-12-16</strong> — <a href=\"../raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md\">Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"ambient-scribe.md\">Ambient AI Scribe</a></li><li><a href=\"scope-boundaries-and-workflow-fit.md\">Scope Boundaries &amp; Workflow Fit</a></li></ul>", "searchText": "ai governance, phi & compliance ai-generated-content ai-strategy audit-trail cmio de-identification executive governance hipaa kickoff legal-record phi privacy retro roadmap year-end ai governance, phi &amp; compliance overview this is the connective tissue for the whole program: four executive-level sessions across the year, from initial kickoff (jan 2025) to year-end retro (dec 2025), plus a privacy officer interview (mar 2025) and a cmio interview (aug 2025) in between. the shared-metrics gap identified in january was real and took all year to close. at kickoff, the cio and vp clinical informatics couldn't agree on what \"success\" meant. by december's retro, the same two executives (plus privacy and cmio) had converged on two headline 2026 metrics: documentation time saved, and phi incidents (target: zero). this is the single clearest before/after in the whole research program and should anchor how the 2026 roadmap is framed. **de-identification and audit-trail requirements (privacy officer, mar) turned out to be non-negotiable engineering constraints, not policy nice-to-haves**: safe harbor-level de-identification for any fine-tuning/eval data, and model-version + input provenance logging for anything that becomes part of the legal record. these constraints were later validated as workable by the cmio's august interview, which proposed a concrete attestation model (once a clinician signs ai-assisted content, it carries the same liability as if they'd typed it, with generation metadata kept in an internal audit log only) — but that model still needs formal legal/compliance ratification, it is not yet policy. phi-sensitivity-ordered rollout sequencing (lowest-sensitivity workflows first: scheduling → admin/coding → documentation → clinical-decision-adjacent) was proposed independently by executives in january and reaffirmed by the cmio in august — it's held up as a stable planning principle across two separate conversations eight months apart. **a recurring cross-cutting finding was explicitly named as a category, not just fixed three times**: the cio used the color-only status indicator accessibility bug (found independently in three separate audits — see accessibility-cross-cutting.md ) as the example of a pattern research should flag as such, not file as three unrelated tickets. two items still need to move from \"informally agreed in a meeting\" to an actual governance document: the 2026 headline metrics, and the ai-content attestation model. evidence trail 2025-01-14 — ai strategy kickoff — executive alignment interview ( interview ) 2025-03-24 — interview — privacy/compliance officer on de-identification &amp; audit trail requirements ( interview ) 2025-08-12 — interview — cmio on governance for ai-generated content in the legal record ( interview ) 2025-12-16 — executive steering committee — year-end retro &amp; 2026 roadmap input ( interview ) related findings ambient ai scribe scope boundaries &amp; workflow fit"}, {"id": "finding:him-coding-and-billing", "kind": "finding", "title": "HIM: Coding, Billing & Release of Information", "date": "2025-07-29", "type": "synthesis", "status": "synthesized", "tags": ["billing", "coding", "compliance", "him", "phi", "release-of-information", "usability", "workflow"], "related_components": ["coding-suggestion-panel", "roi-redaction-tool"], "severity": {}, "path": "findings/him-coding-and-billing.md", "html": "<h1>HIM: Coding, Billing &amp; Release of Information</h1>\n<h2>Overview</h2>\n<p>Two contextual/usability sessions in HIM (July 2025) surfaced a shared theme — extremely low risk tolerance for anything that could look like automated judgment on a compliance-sensitive task — from two different angles: release-of-information redaction, and AI-assisted medical coding.</p>\n<ul><li><strong>Release of information (contextual inquiry) is the higher-stakes of the two.</strong> Staff described</li></ul>\n<p>ROI as the one area where a mistake has caused real incidents (wrong record released, or behavioral-health notes not correctly given the stricter 42 CFR Part 2 handling). Any AI assistance here would need to be \"suggest and highlight for human review only,\" never auto-redact-and-release. This session also surfaced a standalone platform gap — there's no structured way to flag a note as Part 2-protected in the EHR — that recurred again independently in the October behavioral health research (see <a href=\"scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a>), making it a two-source-confirmed gap worth fixing regardless of any AI plans.</p>\n<ul><li>**AI-assisted coding suggestions (usability test) surfaced the same underlying concern in a</li></ul>\n<p>different shape**: the senior coder's objection wasn't accuracy (14/20 suggestions matched independent human judgment) but audit posture — she wanted it explicit in the UI and audit log that the human coder made the final call, to avoid the suggestion looking like it steered toward upcoding. This is the same \"show your work\" / attribution-of-decision pattern seen in prior authorization testing (see <a href=\"prior-authorization.md\">prior-authorization.md</a>).</p>\n<p>Recommendation: any AI feature touching this department needs an explicit, audit-log-visible human-decision boundary as a baseline requirement, not a design nicety — this shows up whether the task is redaction, coding, or (per the prior-auth findings) authorization drafting.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-07-15</strong> — <a href=\"../raw/2025-07-15-contextual-inquiry-him-release-of-information/session-notes.md\">Contextual Inquiry — Health Information Management (Release of Information)</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-07-29</strong> — <a href=\"../raw/2025-07-29-usability-test-ai-coding-billing-suggestions/session-notes.md\">Usability Test — AI-Assisted Medical Coding Suggestions</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"governance-and-phi.md\">AI Governance, PHI &amp; Compliance</a></li></ul>", "searchText": "him: coding, billing & release of information billing coding compliance him phi release-of-information usability workflow coding-suggestion-panel roi-redaction-tool him: coding, billing &amp; release of information overview two contextual/usability sessions in him (july 2025) surfaced a shared theme — extremely low risk tolerance for anything that could look like automated judgment on a compliance-sensitive task — from two different angles: release-of-information redaction, and ai-assisted medical coding. release of information (contextual inquiry) is the higher-stakes of the two. staff described roi as the one area where a mistake has caused real incidents (wrong record released, or behavioral-health notes not correctly given the stricter 42 cfr part 2 handling). any ai assistance here would need to be \"suggest and highlight for human review only,\" never auto-redact-and-release. this session also surfaced a standalone platform gap — there's no structured way to flag a note as part 2-protected in the ehr — that recurred again independently in the october behavioral health research (see scope-boundaries-and-workflow-fit.md ), making it a two-source-confirmed gap worth fixing regardless of any ai plans. **ai-assisted coding suggestions (usability test) surfaced the same underlying concern in a different shape**: the senior coder's objection wasn't accuracy (14/20 suggestions matched independent human judgment) but audit posture — she wanted it explicit in the ui and audit log that the human coder made the final call, to avoid the suggestion looking like it steered toward upcoding. this is the same \"show your work\" / attribution-of-decision pattern seen in prior authorization testing (see prior-authorization.md ). recommendation: any ai feature touching this department needs an explicit, audit-log-visible human-decision boundary as a baseline requirement, not a design nicety — this shows up whether the task is redaction, coding, or (per the prior-auth findings) authorization drafting. evidence trail 2025-07-15 — contextual inquiry — health information management (release of information) ( contextual-inquiry ) 2025-07-29 — usability test — ai-assisted medical coding suggestions ( usability-test ) related findings ai governance, phi &amp; compliance"}, {"id": "finding:onboarding", "kind": "finding", "title": "Onboarding flow — setup step confusion", "date": "2026-02-03", "type": "synthesis", "status": "synthesized", "tags": ["onboarding"], "related_components": [], "severity": {}, "path": "findings/onboarding.md", "html": "<h2>Summary</h2>\n<p>New admins hesitate at, or attempt to skip, step 3 of the onboarding wizard (\"Connect calendar\") because its wording implies the step is optional, when it's actually required for later functionality. This is the largest single source of friction in first-time setup.</p>\n<h2>Evidence</h2>\n<p>Sourced from <code>raw/2026-01-19-onboarding-usability-test/</code> — 6 participants, moderated usability sessions, Jan 19–23 2026. All 3 participants observed in sessions 1–3 paused at step 3; 2 of 3 attempted to skip it outright.</p>\n<p>Corroborated by funnel data — see <code>analytics/summaries/onboarding-funnel-dropoff.md</code>, which independently shows step 3 as the largest drop-off point.</p>\n<h2>Recommendation</h2>\n<p>Relabel step 3 to state clearly that calendar connection is required, and give visible feedback that invites (entered later, in step 4) aren't sent until the whole wizard is submitted.</p>\n<h2>Status</h2>\n<p>Synthesized Feb 3, 2026, from sessions 1–6. Revisit after the step 3 wording change (proposed in <code>research-readouts/onboarding-flow-q1-readout.md</code>) ships and gets retested.</p>", "searchText": "onboarding flow — setup step confusion onboarding summary new admins hesitate at, or attempt to skip, step 3 of the onboarding wizard (\"connect calendar\") because its wording implies the step is optional, when it's actually required for later functionality. this is the largest single source of friction in first-time setup. evidence sourced from raw/2026-01-19-onboarding-usability-test/ — 6 participants, moderated usability sessions, jan 19–23 2026. all 3 participants observed in sessions 1–3 paused at step 3; 2 of 3 attempted to skip it outright. corroborated by funnel data — see analytics/summaries/onboarding-funnel-dropoff.md , which independently shows step 3 as the largest drop-off point. recommendation relabel step 3 to state clearly that calendar connection is required, and give visible feedback that invites (entered later, in step 4) aren't sent until the whole wizard is submitted. status synthesized feb 3, 2026, from sessions 1–6. revisit after the step 3 wording change (proposed in research-readouts/onboarding-flow-q1-readout.md ) ships and gets retested."}, {"id": "finding:patient-scheduling-chatbot", "kind": "finding", "title": "Patient Scheduling Chatbot", "date": "2025-06-17", "type": "synthesis", "status": "synthesized", "tags": ["chatbot", "patient-experience", "scheduling", "survey", "trust", "usability"], "related_components": ["patient-chatbot-widget", "scheduling-widget"], "severity": {}, "path": "findings/patient-scheduling-chatbot.md", "html": "<h1>Patient Scheduling Chatbot</h1>\n<h2>Overview</h2>\n<p>A patient-facing scheduling chatbot was scoped narrowly based on a trust survey (Jun 2025) and then usability tested against that scope (Jun 2025, two weeks later).</p>\n<ul><li><strong>The survey drew a sharp, useful line.</strong> 67% of patients were comfortable with an AI chatbot for</li></ul>\n<p>scheduling/rescheduling, but comfort dropped to 22% when extended to symptom-related questions. This directly shaped the decision to scope the chatbot to logistics only and explicitly exclude symptom Q&amp;A from v1 — a scope decision the usability test then validated by not needing to test symptom-handling at all.</p>\n<ul><li>**The \"talk to a human\" escape hatch, identified as a trust prerequisite in the survey (41% of</li></ul>\n<p>open-ended responses asked for it), failed discoverability testing.** 3 of 8 usability test participants couldn't find it — it existed only as a small text link. This is a case where a clearly-identified requirement from the survey wasn't sufficiently weighted in the initial design.</p>\n<ul><li>Secondary findings: rescheduling had a lower task-success rate than new bookings (appointment-ID</li></ul>\n<p>friction), and the bot's \"overly cheerful\" tone was mismatched for patients scheduling around illness.</p>\n<p>Recommendation: redesign the escape hatch as a persistent, prominent control (not a link) and re-test discoverability specifically before wider rollout. This chatbot would also be the non-clinical rollout most likely to run into the awareness gap noted in <a href=\"rollout-and-change-management.md\">rollout-and-change-management.md</a>.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-06-03</strong> — <a href=\"../raw/2025-06-03-survey-patient-portal-ai-chatbot-trust/session-notes.md\">Survey — Patient Trust in AI Chatbot for Scheduling</a> <em>(<code>survey</code>)</em></li><li><strong>2025-06-17</strong> — <a href=\"../raw/2025-06-17-usability-test-patient-chatbot-prototype/session-notes.md\">Usability Test — Patient Scheduling Chatbot Prototype</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"rollout-and-change-management.md\">Rollout &amp; Change Management</a></li></ul>", "searchText": "patient scheduling chatbot chatbot patient-experience scheduling survey trust usability patient-chatbot-widget scheduling-widget patient scheduling chatbot overview a patient-facing scheduling chatbot was scoped narrowly based on a trust survey (jun 2025) and then usability tested against that scope (jun 2025, two weeks later). the survey drew a sharp, useful line. 67% of patients were comfortable with an ai chatbot for scheduling/rescheduling, but comfort dropped to 22% when extended to symptom-related questions. this directly shaped the decision to scope the chatbot to logistics only and explicitly exclude symptom q&amp;a from v1 — a scope decision the usability test then validated by not needing to test symptom-handling at all. **the \"talk to a human\" escape hatch, identified as a trust prerequisite in the survey (41% of open-ended responses asked for it), failed discoverability testing.** 3 of 8 usability test participants couldn't find it — it existed only as a small text link. this is a case where a clearly-identified requirement from the survey wasn't sufficiently weighted in the initial design. secondary findings: rescheduling had a lower task-success rate than new bookings (appointment-id friction), and the bot's \"overly cheerful\" tone was mismatched for patients scheduling around illness. recommendation: redesign the escape hatch as a persistent, prominent control (not a link) and re-test discoverability specifically before wider rollout. this chatbot would also be the non-clinical rollout most likely to run into the awareness gap noted in rollout-and-change-management.md . evidence trail 2025-06-03 — survey — patient trust in ai chatbot for scheduling ( survey ) 2025-06-17 — usability test — patient scheduling chatbot prototype ( usability-test ) related findings rollout &amp; change management"}, {"id": "finding:prior-authorization", "kind": "finding", "title": "AI-Assisted Prior Authorization", "date": "2025-11-04", "type": "synthesis", "status": "synthesized", "tags": ["longitudinal", "prior-auth", "usability", "utilization-management", "v1", "v2"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "path": "findings/prior-authorization.md", "html": "<h1>AI-Assisted Prior Authorization</h1>\n<h2>Overview</h2>\n<p>AI-drafted prior authorization justifications were tested in two rounds (v1, Apr 2025; v2, Nov 2025) with the same utilization review nurse supervisor across both, which mattered for tracking whether fixes actually landed.</p>\n<ul><li><strong>v1</strong> surfaced a correctness bug (citing outdated diagnosis codes) serious enough that</li></ul>\n<p>participants said it would likely cause payer denials — not a UX problem, a data-freshness/model fix. It also surfaced a durable requirement: nurses want inline citations to the specific chart text behind each suggestion (\"show your work\"), not just a black-box draft.</p>\n<ul><li><strong>v2</strong>, after both fixes landed, confirmed the outdated-code issue did not recur and that the</li></ul>\n<p>citation feature is actively used (3 of 4 participants checked at least one citation before accepting) rather than being ignored as friction.</p>\n<ul><li><strong>Scope discipline held.</strong> The team deliberately limited v1 testing to \"straightforward\" cases</li></ul>\n<p>(defined jointly with the nursing supervisor) and kept complex cases out of scope. v2 confirmed complex cases still aren't ready — validating that the scope limitation, not a rushed fix, was the right call. This same \"citation transparency\" requirement has since shown up independently in the medical coding work — see <a href=\"him-coding-and-billing.md\">him-coding-and-billing.md</a>.</p>\n<ul><li><strong>Time savings:</strong> ~5 min vs. ~15 min manual for straightforward cases, confirmed (not just</li></ul>\n<p>estimated) in v2.</p>\n<p>Status: recommended for pilot expansion, strictly within the agreed straightforward-case scope.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-04-08</strong> — <a href=\"../raw/2025-04-08-usability-test-prior-auth-ai-v1/session-notes.md\">Usability Test — AI-Assisted Prior Authorization Drafting (v1)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-11-04</strong> — <a href=\"../raw/2025-11-04-usability-test-prior-auth-ai-v2/session-notes.md\">Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"governance-and-phi.md\">AI Governance, PHI &amp; Compliance</a></li></ul>", "searchText": "ai-assisted prior authorization longitudinal prior-auth usability utilization-management v1 v2 prior-auth-drafting-panel ai-assisted prior authorization overview ai-drafted prior authorization justifications were tested in two rounds (v1, apr 2025; v2, nov 2025) with the same utilization review nurse supervisor across both, which mattered for tracking whether fixes actually landed. v1 surfaced a correctness bug (citing outdated diagnosis codes) serious enough that participants said it would likely cause payer denials — not a ux problem, a data-freshness/model fix. it also surfaced a durable requirement: nurses want inline citations to the specific chart text behind each suggestion (\"show your work\"), not just a black-box draft. v2 , after both fixes landed, confirmed the outdated-code issue did not recur and that the citation feature is actively used (3 of 4 participants checked at least one citation before accepting) rather than being ignored as friction. scope discipline held. the team deliberately limited v1 testing to \"straightforward\" cases (defined jointly with the nursing supervisor) and kept complex cases out of scope. v2 confirmed complex cases still aren't ready — validating that the scope limitation, not a rushed fix, was the right call. this same \"citation transparency\" requirement has since shown up independently in the medical coding work — see him-coding-and-billing.md . time savings: ~5 min vs. ~15 min manual for straightforward cases, confirmed (not just estimated) in v2. status: recommended for pilot expansion, strictly within the agreed straightforward-case scope. evidence trail 2025-04-08 — usability test — ai-assisted prior authorization drafting (v1) ( usability-test ) 2025-11-04 — usability test — ai-assisted prior authorization drafting (v2, follow-up) ( usability-test ) related findings ai governance, phi &amp; compliance"}, {"id": "finding:rollout-and-change-management", "kind": "finding", "title": "Rollout & Change Management", "date": "2025-12-02", "type": "synthesis", "status": "synthesized", "tags": ["change-management", "organizational-readiness", "pulse", "rollout", "survey", "training", "year-end"], "related_components": ["patient-chatbot-widget"], "severity": {}, "path": "findings/rollout-and-change-management.md", "html": "<h1>Rollout &amp; Change Management</h1>\n<h2>Overview</h2>\n<p>Two sessions, five weeks apart at year-end, look at how Compass AI features actually get adopted once built: a training/change-management interview (Oct 2025) and an all-staff AI readiness pulse survey (Dec 2025).</p>\n<ul><li><strong>The training interview drew directly on a documented past failure.</strong> The 2022 CDS alert</li></ul>\n<p>rollout — referenced independently by executives back in January (see <a href=\"governance-and-phi.md\">governance-and-phi.md</a>) — is treated as the cautionary tale: a single 20-minute training video with no hands-on practice, and adoption suffered. The Director of Training's recommendation is a \"unit champion\" model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time, and to avoid rolling out during flu season (Nov-Feb) given historical attendance patterns.</p>\n<ul><li>**The December pulse survey found an awareness gap that changes rollout sequencing for</li></ul>\n<p>non-clinical features specifically**: only 34% of non-clinical/admin staff were aware Compass AI work was even underway, vs. 71% of clinical staff. This matters directly for the patient scheduling chatbot (see <a href=\"patient-scheduling-chatbot.md\">patient-scheduling-chatbot.md</a>), which is the first admin-facing, non-clinical feature nearing rollout — communications need to reach that audience before launch, not after.</p>\n<ul><li>The survey's directional sentiment comparison to the September burnout survey is noted but</li></ul>\n<p>flagged as not a clean apples-to-apples comparison (different question wording).</p>\n<p>Recommendation: use the unit-champion training model for the ambient scribe GA rollout (avoiding flu-season timing), and run a dedicated non-clinical-staff communications push before the scheduling chatbot goes live.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-10-21</strong> — <a href=\"../raw/2025-10-21-interview-training-department-rollout-change-management/session-notes.md\">Interview — Training &amp; Education Dept on Rollout/Change Management Planning</a> <em>(<code>interview</code>)</em></li><li><strong>2025-12-02</strong> — <a href=\"../raw/2025-12-02-survey-allstaff-ai-readiness-pulse/session-notes.md\">Survey — All-Staff AI Readiness Pulse Survey</a> <em>(<code>survey</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"governance-and-phi.md\">AI Governance, PHI &amp; Compliance</a></li><li><a href=\"ambient-scribe.md\">Ambient AI Scribe</a></li></ul>", "searchText": "rollout & change management change-management organizational-readiness pulse rollout survey training year-end patient-chatbot-widget rollout &amp; change management overview two sessions, five weeks apart at year-end, look at how compass ai features actually get adopted once built: a training/change-management interview (oct 2025) and an all-staff ai readiness pulse survey (dec 2025). the training interview drew directly on a documented past failure. the 2022 cds alert rollout — referenced independently by executives back in january (see governance-and-phi.md ) — is treated as the cautionary tale: a single 20-minute training video with no hands-on practice, and adoption suffered. the director of training's recommendation is a \"unit champion\" model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time, and to avoid rolling out during flu season (nov-feb) given historical attendance patterns. **the december pulse survey found an awareness gap that changes rollout sequencing for non-clinical features specifically**: only 34% of non-clinical/admin staff were aware compass ai work was even underway, vs. 71% of clinical staff. this matters directly for the patient scheduling chatbot (see patient-scheduling-chatbot.md ), which is the first admin-facing, non-clinical feature nearing rollout — communications need to reach that audience before launch, not after. the survey's directional sentiment comparison to the september burnout survey is noted but flagged as not a clean apples-to-apples comparison (different question wording). recommendation: use the unit-champion training model for the ambient scribe ga rollout (avoiding flu-season timing), and run a dedicated non-clinical-staff communications push before the scheduling chatbot goes live. evidence trail 2025-10-21 — interview — training &amp; education dept on rollout/change management planning ( interview ) 2025-12-02 — survey — all-staff ai readiness pulse survey ( survey ) related findings ai governance, phi &amp; compliance ambient ai scribe"}, {"id": "finding:scope-boundaries-and-workflow-fit", "kind": "finding", "title": "Scope Boundaries & Workflow Fit", "date": "2025-10-07", "type": "synthesis", "status": "synthesized", "tags": ["42-cfr-part-2", "authentication", "baseline", "behavioral-health", "clinician-workflow", "ed", "high-acuity", "intake", "mfa", "phi", "security", "sensitive-notes", "sso", "workflow"], "related_components": ["ambient-scribe-widget", "ed-intake-form", "sso-mfa-login"], "severity": {}, "path": "findings/scope-boundaries-and-workflow-fit.md", "html": "<h1>Scope Boundaries &amp; Workflow Fit</h1>\n<h2>Overview</h2>\n<p>Three sessions across the year are grouped here because their common output was a \"don't build this yet, or don't build it here\" conclusion — which the December executive retro specifically praised as valuable in its own right.</p>\n<ul><li><strong>ED intake (contextual inquiry, Apr 2025):</strong> peak-hour interruption frequency (every 2-4 minutes)</li></ul>\n<p>makes any AI tool requiring sustained review attention a poor fit for ED intake nurses specifically during peak windows. The one positive signal — insurance-card-photo pre-fill for registration clerks — was carved out as a smaller, separate, lower-risk candidate instead.</p>\n<ul><li><strong>SSO/MFA modernization (interview, May 2025):</strong> independent of any AI feature, a planned</li></ul>\n<p>15-minute forced re-authentication conflicts with clinical ops' expectation of a 4-hour session — and nobody had yet defined what happens to an in-progress ambient scribe recording session if a forced re-auth interrupts it mid-visit. This was flagged as an unhandled edge case for the ambient scribe team (see <a href=\"ambient-scribe.md\">ambient-scribe.md</a>) rather than something to solve in this session.</p>\n<ul><li><strong>Behavioral health (contextual inquiry, Oct 2025):</strong> reiterated, independently, the same \"no</li></ul>\n<p>structured way to flag a 42 CFR Part 2-protected note\" platform gap first identified in the July HIM research (see <a href=\"him-coding-and-billing.md\">him-coding-and-billing.md</a>) — and added a harder constraint on top: any AI tool listening to or drafting behavioral health notes needs a dedicated legal/consent review that hasn't started yet. This population was formally excluded from the near-term ambient scribe rollout as a result.</p>\n<p>Recommendation: keep these three exclusions as explicit, documented scope boundaries in the 2026 roadmap (per the December retro) rather than informal assumptions that could quietly erode.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-04-22</strong> — <a href=\"../raw/2025-04-22-contextual-inquiry-ed-intake-shadowing/session-notes.md\">Contextual Inquiry — Emergency Department Intake Shadowing</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-05-20</strong> — <a href=\"../raw/2025-05-20-interview-it-security-sso-mfa-modernization/session-notes.md\">Interview — IT Security on SSO/MFA Modernization Impact</a> <em>(<code>interview</code>)</em></li><li><strong>2025-10-07</strong> — <a href=\"../raw/2025-10-07-contextual-inquiry-behavioral-health-sensitive-notes/session-notes.md\">Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling</a> <em>(<code>contextual-inquiry</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li><a href=\"governance-and-phi.md\">AI Governance, PHI &amp; Compliance</a></li></ul>", "searchText": "scope boundaries & workflow fit 42-cfr-part-2 authentication baseline behavioral-health clinician-workflow ed high-acuity intake mfa phi security sensitive-notes sso workflow ambient-scribe-widget ed-intake-form sso-mfa-login scope boundaries &amp; workflow fit overview three sessions across the year are grouped here because their common output was a \"don't build this yet, or don't build it here\" conclusion — which the december executive retro specifically praised as valuable in its own right. ed intake (contextual inquiry, apr 2025): peak-hour interruption frequency (every 2-4 minutes) makes any ai tool requiring sustained review attention a poor fit for ed intake nurses specifically during peak windows. the one positive signal — insurance-card-photo pre-fill for registration clerks — was carved out as a smaller, separate, lower-risk candidate instead. sso/mfa modernization (interview, may 2025): independent of any ai feature, a planned 15-minute forced re-authentication conflicts with clinical ops' expectation of a 4-hour session — and nobody had yet defined what happens
