Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> Participant supervises ROI request intake and fulfillment and does second-level Part 2 review themselves. Part 2 handling is still fully manual; no ROI redaction tool has been built or piloted.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(42 CFR Part 2)</em> Part 2 records are still identified from memory. There is still no structured flag in the EHR, and nothing has changed since July 2025. Newer specialists work from a printed sheet of the clinics and note types that &quot;usually&quot; need Part 2 handling and ask a senior specialist when unsure. Because nothing says which notes actually come from a Part 2 program, staff send any substance-use mention to the stricter review to be safe, wherever the note came from. The supervisor said scribe-drafted notes from general medical visits sometimes capture that part of the conversation in more detail than a physician would have typed, so specialists now read those notes more closely.</li><li><strong>[MEDIUM]</strong> <em>(volume)</em> By their own informal count, ROI requests are up &quot;somewhere around a quarter&quot; on a year ago. That differs from the ~18% year-over-year figure the other supervisor gave in July 2025. This supervisor counts every request received, re-requests and follow-ups from requesters chasing a late response included, which may explain part of the gap. Both figures are informal and neither has been checked against system data.</li><li><strong>[MEDIUM]</strong> <em>(turnaround)</em> The backlog is concentrated in requests that need Part 2 review, not routine ones. They named four drivers: only a few senior specialists can do the second-level Part 2 review; released records are longer because scribe-drafted notes are longer, so page-by-page review takes more time; re-requests add intake work for requests already in the queue; and one open specialist position. By their own informal count, turnaround on requests that need Part 2 review has slipped from about a week to closer to two.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Part 2 is still tribal knowledge. It&#x27;s in my head, it&#x27;s in the heads of two or three people on my team, and it&#x27;s on a sheet taped up by the printer. That&#x27;s the system.&quot;</p><p>— HIM Supervisor, P121</p></blockquote>\n<blockquote><p>&quot;The easy requests go out fine. What&#x27;s stuck is anything that needs the second look for Part 2, because there&#x27;s only a couple of us who can do it, and everything just piles up behind us.&quot;</p><p>— HIM Supervisor, P121</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Re-escalate the structured Part 2 flag as a standalone platform gap. It has now come up in three separate sessions (HIM in July 2025, behavioral health in October 2025, and here), and nothing has changed.</li><li>If ROI redaction assistance is scoped later, treat the second-level Part 2 review queue as the bottleneck to design around, not first-pass redaction.</li><li>Pull system-of-record ROI volume and turnaround data. This was an open follow-up in July 2025 and is still outstanding.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Reconcile the two informal volume estimates (~18% in July 2025, roughly a quarter here) against actual request counts, and agree on whether re-requests count as requests.</li><li>Check whether pages per released record can be measured before and after GA, to test the &quot;notes are longer now&quot; impression.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — HIM Supervisor on ROI Volume and Part 2 Handling</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P121 — HIM Supervisor (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2025-07-29). No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — him supervisor on roi volume and part 2 handling him release-of-information 42-cfr-part-2 workflow compliance project-him roi-redaction-tool interview — him supervisor on roi volume and part 2 handling objective revisit release of information (roi) eight months after the july 2025 contextual inquiry: how request volume and turnaround stand now, whether anything has changed in how 42 cfr part 2 records are handled, and whether the ambient scribe going ga in january 2026 has changed the work. the participant is a different him supervisor from the one in the july 2025 session (p67). method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: participant supervises roi request intake and fulfillment and does second-level part 2 review themselves. part 2 handling is still fully manual; no roi redaction tool has been built or piloted. key findings [high] (42 cfr part 2) part 2 records are still identified from memory. there is still no structured flag in the ehr, and nothing has changed since july 2025. newer specialists work from a printed sheet of the clinics and note types that &quot;usually&quot; need part 2 handling and ask a senior specialist when unsure. because nothing says which notes actually come from a part 2 program, staff send any substance-use mention to the stricter review to be safe, wherever the note came from. the supervisor said scribe-drafted notes from general medical visits sometimes capture that part of the conversation in more detail than a physician would have typed, so specialists now read those notes more closely. [medium] (volume) by their own informal count, roi requests are up &quot;somewhere around a quarter&quot; on a year ago. that differs from the ~18% year-over-year figure the other supervisor gave in july 2025. this supervisor counts every request received, re-requests and follow-ups from requesters chasing a late response included, which may explain part of the gap. both figures are informal and neither has been checked against system data. [medium] (turnaround) the backlog is concentrated in requests that need part 2 review, not routine ones. they named four drivers: only a few senior specialists can do the second-level part 2 review; released records are longer because scribe-drafted notes are longer, so page-by-page review takes more time; re-requests add intake work for requests already in the queue; and one open specialist position. by their own informal count, turnaround on requests that need part 2 review has slipped from about a week to closer to two. representative quotes &quot;part 2 is still tribal knowledge. it&#x27;s in my head, it&#x27;s in the heads of two or three people on my team, and it&#x27;s on a sheet taped up by the printer. that&#x27;s the system.&quot; — him supervisor, p121 &quot;the easy requests go out fine. what&#x27;s stuck is anything that needs the second look for part 2, because there&#x27;s only a couple of us who can do it, and everything just piles up behind us.&quot; — him supervisor, p121 recommendations re-escalate the structured part 2 flag as a standalone platform gap. it has now come up in three separate sessions (him in july 2025, behavioral health in october 2025, and here), and nothing has changed. if roi redaction assistance is scoped later, treat the second-level part 2 review queue as the bottleneck to design around, not first-pass redaction. pull system-of-record roi volume and turnaround data. this was an open follow-up in july 2025 and is still outstanding. follow-ups / open questions reconcile the two informal volume estimates (~18% in july 2025, roughly a quarter here) against actual request counts, and agree on whether re-requests count as requests. check whether pages per released record can be measured before and after ga, to test the &quot;notes are longer now&quot; impression. related synthesized into: him-coding-and-billing.md , scope-boundaries-and-workflow-fit.md participants participants — interview — him supervisor on roi volume and part 2 handling count: 1 roles: p121 — him supervisor (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2025-07-29). no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-04-07-interview-care-coordinator-float-pool-system-familiarity", "kind": "raw", "title": "Interview — Float-Pool Care Coordinator on System Familiarity", "date": "2026-04-07", "type": "interview", "status": "raw", "tags": ["care-coordination", "chart-review", "alert-triage", "workflow", "project-care-coordination"], "related_components": ["chart-review-summary-panel", "alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-04-07-interview-care-coordinator-float-pool-system-familiarity/session-notes.md", "corrections": [], "html": "<h1>Interview — Float-Pool Care Coordinator on System Familiarity</h1>\n<h2>Objective</h2>\n<p>Follow up the January 2025 baseline&#x27;s open question on float-pool coordinators, who &quot;may have different pain points due to less system familiarity&quot;. The participant is P05, returning from 2025-01-29-contextual-inquiry-chart-review-baseline, where they were shadowed in January 2025; this interview is in April 2026. The question was what covering for different teams does to chart review and alert triage, and whether their own 2025 request (&quot;what changed since I last touched this chart&quot;) still fits how they work.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant still works in the float pool, covering ambulatory care coordination teams when their own coordinators are out. Alerts still arrive in the chronological queue; the AI-ranked queue tested in August 2025 hasn&#x27;t been built, and they did not take part in that test. The chart-review summary panel is still a concept.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(float pool)</em> Each team they cover keeps its own version of the shared spreadsheet, with its own columns and its own colour-coding, and none of it is written down. They spend the start of a covering shift working out that team&#x27;s conventions, from the sheet itself or by asking whoever is on the team that day, before they can trust what the sheet is telling them about a patient. This is the undocumented-workaround pattern from the January 2025 baseline, seen from the side of the person who has to read it.</li><li><strong>[MEDIUM]</strong> <em>(what changed)</em> &quot;Since I last touched this chart&quot; doesn&#x27;t fit floating, because on a covering shift they have often never touched the chart. What they want is &quot;what changed since the team&#x27;s last contact&quot; with the patient, whoever made it. This refines their own January 2025 request rather than replacing it: the reference point is the last contact by anyone on the care team.</li><li><strong>[MEDIUM]</strong> <em>(alert triage)</em> When floating, they work the alert queue strictly in order. They said they don&#x27;t know the patients well enough to move one alert above another on history, so they leave reprioritising to the team&#x27;s own coordinators when they&#x27;re back. This is their account of their own practice; nothing was observed or measured in this session.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Every team has their own sheet and their own colours. The first half hour of a covering day is me figuring out what yellow means on this team.&quot;</p><p>— Care Coordinator (float pool), P05 (returning from 2025-01-29-contextual-inquiry-chart-review-baseline)</p></blockquote>\n<blockquote><p>&quot;When I&#x27;m covering, I haven&#x27;t touched the chart. I need to know what&#x27;s changed since anybody on the team last talked to this person.&quot;</p><p>— Care Coordinator (float pool), P05 (returning from 2025-01-29-contextual-inquiry-chart-review-baseline)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>In the chart-review summary concept, support &quot;since the team&#x27;s last contact&quot; as well as &quot;since my last contact&quot;, so it works for covering coordinators.</li><li>Treat each team&#x27;s spreadsheet conventions as something the design has to account for (or replace), not a single shared convention.</li><li>When AI ranking is next tested, include float-pool coordinators specifically, since they may rely on the ranked order differently from coordinators who know the patients.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How many teams&#x27; spreadsheet conventions differ, and how much, is not known; this is one coordinator&#x27;s account.</li><li>Would a covering coordinator follow an AI-ranked order more closely than a team&#x27;s own coordinator does? Not tested; the August 2025 test did not separate float-pool participants.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Float-Pool Care Coordinator on System Familiarity</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P05 — Care Coordinator (float pool) (care-coordinator), returning from 2025-01-29-contextual-inquiry-chart-review-baseline</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recontacted from the January 2025 baseline. The participant is P05, returning from 2025-01-29-contextual-inquiry-chart-review-baseline, where they were shadowed in January 2025; this interview is in April 2026. They are still in the float pool. They did not take part in the 2025-08-26 alert-triage test. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — float-pool care coordinator on system familiarity care-coordination chart-review alert-triage workflow project-care-coordination chart-review-summary-panel alert-triage-queue interview — float-pool care coordinator on system familiarity objective follow up the january 2025 baseline&#x27;s open question on float-pool coordinators, who &quot;may have different pain points due to less system familiarity&quot;. the participant is p05, returning from 2025-01-29-contextual-inquiry-chart-review-baseline, where they were shadowed in january 2025; this interview is in april 2026. the question was what covering for different teams does to chart review and alert triage, and whether their own 2025 request (&quot;what changed since i last touched this chart&quot;) still fits how they work. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant still works in the float pool, covering ambulatory care coordination teams when their own coordinators are out. alerts still arrive in the chronological queue; the ai-ranked queue tested in august 2025 hasn&#x27;t been built, and they did not take part in that test. the chart-review summary panel is still a concept. key findings [high] (float pool) each team they cover keeps its own version of the shared spreadsheet, with its own columns and its own colour-coding, and none of it is written down. they spend the start of a covering shift working out that team&#x27;s conventions, from the sheet itself or by asking whoever is on the team that day, before they can trust what the sheet is telling them about a patient. this is the undocumented-workaround pattern from the january 2025 baseline, seen from the side of the person who has to read it. [medium] (what changed) &quot;since i last touched this chart&quot; doesn&#x27;t fit floating, because on a covering shift they have often never touched the chart. what they want is &quot;what changed since the team&#x27;s last contact&quot; with the patient, whoever made it. this refines their own january 2025 request rather than replacing it: the reference point is the last contact by anyone on the care team. [medium] (alert triage) when floating, they work the alert queue strictly in order. they said they don&#x27;t know the patients well enough to move one alert above another on history, so they leave reprioritising to the team&#x27;s own coordinators when they&#x27;re back. this is their account of their own practice; nothing was observed or measured in this session. representative quotes &quot;every team has their own sheet and their own colours. the first half hour of a covering day is me figuring out what yellow means on this team.&quot; — care coordinator (float pool), p05 (returning from 2025-01-29-contextual-inquiry-chart-review-baseline) &quot;when i&#x27;m covering, i haven&#x27;t touched the chart. i need to know what&#x27;s changed since anybody on the team last talked to this person.&quot; — care coordinator (float pool), p05 (returning from 2025-01-29-contextual-inquiry-chart-review-baseline) recommendations in the chart-review summary concept, support &quot;since the team&#x27;s last contact&quot; as well as &quot;since my last contact&quot;, so it works for covering coordinators. treat each team&#x27;s spreadsheet conventions as something the design has to account for (or replace), not a single shared convention. when ai ranking is next tested, include float-pool coordinators specifically, since they may rely on the ranked order differently from coordinators who know the patients. follow-ups / open questions how many teams&#x27; spreadsheet conventions differ, and how much, is not known; this is one coordinator&#x27;s account. would a covering coordinator follow an ai-ranked order more closely than a team&#x27;s own coordinator does? not tested; the august 2025 test did not separate float-pool participants. related synthesized into: care-coordination-triage.md participants participants — interview — float-pool care coordinator on system familiarity count: 1 roles: p05 — care coordinator (float pool) (care-coordinator), returning from 2025-01-29-contextual-inquiry-chart-review-baseline researcher: priya patel recruitment note: recontacted from the january 2025 baseline. the participant is p05, returning from 2025-01-29-contextual-inquiry-chart-review-baseline, where they were shadowed in january 2025; this interview is in april 2026. they are still in the float pool. they did not take part in the 2025-08-26 alert-triage test. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-04-16-interview-care-coordinator-transitions-medication-changes", "kind": "raw", "title": "Interview — Transitions-of-Care Coordinator on Medication Changes after Discharge", "date": "2026-04-16", "type": "interview", "status": "raw", "tags": ["care-coordination", "medication-safety", "chart-review", "alert-triage", "workflow", "project-care-coordination"], "related_components": ["alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-04-16-interview-care-coordinator-transitions-medication-changes/session-notes.md", "corrections": [], "html": "<h1>Interview — Transitions-of-Care Coordinator on Medication Changes after Discharge</h1>\n<h2>Objective</h2>\n<p>Understand how a transitions-of-care coordinator, who follows patients from an inpatient discharge to home, handles medication changes on post-discharge calls, given the January 2025 baseline&#x27;s finding that coordinators distrust the EHR&#x27;s after-visit summaries for missing changed medications. A second question was how discharge alerts fit the alert queue, given the August 2025 finding that the AI ranking weighted recency more heavily than coordinators&#x27; sense of clinical risk.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant makes follow-up calls to patients after an inpatient discharge. Discharge alerts reach them through the same chronological queue other coordinators use; the AI-ranked queue tested in August 2025 hasn&#x27;t been built. They did not take part in any earlier session. They read the discharge note and the clinicians&#x27; signed notes, some of them scribe-drafted since GA, but don&#x27;t use the scribe.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(medication changes)</em> On post-discharge calls, the discharge paperwork the patient has and the current medication list sometimes disagree. When they do, the coordinator reads the discharge note itself and calls the clinic to confirm before going through medications with the patient. They recalled the after-visit summary leaving out a medication change &quot;a few times this year&quot;, but they kept no log, couldn&#x27;t say how many and couldn&#x27;t say how many summaries were correct. This is a recollection, not a rate, and it doesn&#x27;t answer the baseline&#x27;s question of how often the AVS misses medication changes.</li><li><strong>[MEDIUM]</strong> <em>(alert timing)</em> For discharge alerts, they said time since discharge <em>is</em> the clinical risk: the first days at home are when a missed medication change or a missed follow-up matters most, so a recent discharge should rise to the top. This refines rather than contradicts the August 2025 finding that the model weighted recency more heavily than coordinators&#x27; sense of clinical risk: for this alert type, recency and risk point the same way, so the right ranking signal depends on the alert type.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;If the paperwork and the med list don&#x27;t match, I don&#x27;t pick one. I read the discharge note and I call the clinic, and then I call the patient.&quot;</p><p>— Care Coordinator (transitions of care), P131</p></blockquote>\n<blockquote><p>&quot;For a discharge, newer is worse. The first few days home are when things go wrong.&quot;</p><p>— Care Coordinator (transitions of care), P131</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Don&#x27;t treat recency as a single global weight in any ranking model: test whether coordinators&#x27; risk judgement differs by alert type, with discharge alerts as one case where recency and risk line up.</li><li>Keep the medication reconciliation step human on post-discharge calls; nothing here supports summarising medication changes for coordinators without the discharge note alongside.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often the AVS misses medication changes is still not known. This interview adds a recollection, not a rate; closing it needs incident or complaint logs, or a chart audit comparing summaries with reconciled medication lists.</li><li>Which other alert types, if any, behave like discharge alerts? Not covered in this session.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Transitions-of-Care Coordinator on Medication Changes after Discharge</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P131 — Care Coordinator (transitions of care) (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). This participant is new to the research and did not take part in either earlier session. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — transitions-of-care coordinator on medication changes after discharge care-coordination medication-safety chart-review alert-triage workflow project-care-coordination alert-triage-queue interview — transitions-of-care coordinator on medication changes after discharge objective understand how a transitions-of-care coordinator, who follows patients from an inpatient discharge to home, handles medication changes on post-discharge calls, given the january 2025 baseline&#x27;s finding that coordinators distrust the ehr&#x27;s after-visit summaries for missing changed medications. a second question was how discharge alerts fit the alert queue, given the august 2025 finding that the ai ranking weighted recency more heavily than coordinators&#x27; sense of clinical risk. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder conte s a single global weight in any ranking model: test whether coordinators&#x27; risk judgement differs by alert type, with discharge alerts as one case where recency and risk line up. keep the medication reconciliation step human on post-discharge calls; nothing here supports summarising medication changes for coordinators without the discharge note alongside. follow-ups / open questions how often the avs misses medication changes is still not known. this interview adds a recollection, not a rate; closing it needs incident or complaint logs, or a chart audit comparing summaries with reconciled medication lists. which other alert types, if any, behave like discharge alerts? not covered in this session. related synthesized into: care-coordination-triage.md participants participants — interview — transitions-of-care coordinator on medication changes after discharge count: 1 roles: p131 — care coordinator (transitions of care) (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). this participant is new to the research and did not take part in either earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-04-21-interview-coding-auditor-override-audit-trail", "kind": "raw", "title": "Interview — Coding Auditor on Override Tracking and Audit Trail", "date": "2026-04-21", "type": "interview", "status": "raw", "tags": ["him", "coding", "audit-trail", "compliance", "governance", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-04-21-interview-coding-auditor-override-audit-trail/session-notes.md", "corrections": [], "html": "<h1>Interview — Coding Auditor on Override Tracking and Audit Trail</h1>\n<h2>Objective</h2>\n<p>Follow up on the July 2025 recommendation to bring Compliance into the audit-log design for the AI coding-suggestion concept: understand what an internal coding auditor would need in order to audit, and defend, codes produced with AI assistance. The concept has not been built or piloted; the participant responded to the July 2025 screens and the accept/override tracking described there.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> Participant does internal retrospective coding audits (sample-based review of coded encounters) and supports responses to external audits and claim denials.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[CRITICAL]</strong> <em>(audit trail)</em> The auditor said they could not defend a code in an external audit, or on a claim denial appeal, without a per-code record of what the tool suggested, what the coder accepted, what the coder overrode and what they changed it to, and who did it and when. A flag saying &quot;AI assistance was used&quot; on the encounter isn&#x27;t enough. Without the per-code record they would recommend Compliance not sign off on the tool going live.</li><li><strong>[HIGH]</strong> <em>(governance)</em> Wants generation metadata (the suggestion, the source text it cited, the model version and, for the note itself, which parts were scribe-drafted) visible to coding auditors, not internal-only in the sense of &quot;only IT can pull it&quot;. They had no objection to keeping it off the permanent chart, in line with the CMIO&#x27;s attestation model, but said &quot;internal&quot; has to include the people who audit the codes.</li><li><strong>[MEDIUM]</strong> <em>(sampling)</em> For at least the first year they would audit AI-accepted codes at a higher rate than codes the coder entered themselves, as an informal starting point &quot;maybe double the usual sample&quot;. They would focus on suggestions accepted without any edit and on unspecified codes. They would also compare acceptance and override rates across coders: someone who accepts nearly everything would be a reason to look closer, not a sign of efficiency.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;When I pull a chart the question is always the same: who picked this code, and why. If the answer is &#x27;the system suggested it and somebody clicked accept,&#x27; I can&#x27;t stand behind that in front of anyone.&quot;</p><p>— Coding Auditor, P122</p></blockquote>\n<blockquote><p>&quot;I don&#x27;t need it on the chart. I need it somewhere I can actually see it. &#x27;Internal&#x27; can&#x27;t mean only IT can get to it.&quot;</p><p>— Coding Auditor, P122</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Make the per-code suggested / accepted / overridden record (with user and timestamp) a release-blocking requirement for the coding-suggestion concept, and spec it jointly with Compliance and coding audit.</li><li>Add the question of who can access the internal audit log to the still-pending Legal/Compliance ratification of the CMIO&#x27;s attestation model. The model says where the metadata lives, not who can read it.</li><li>Design the audit log so it can be filtered by acceptance status (accepted as suggested, edited, overridden) to support targeted sampling.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Who owns access to the internal audit log the CMIO&#x27;s model describes, and does it already exist for scribe-drafted notes?</li><li>Confirm with Compliance whether a higher audit rate for AI-accepted codes would need to be written into coding audit policy.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Coding Auditor on Override Tracking and Audit Trail</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P122 — Coding Auditor (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2025-07-29). No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — coding auditor on override tracking and audit trail him coding audit-trail compliance governance project-him coding-suggestion-panel interview — coding auditor on override tracking and audit trail objective follow up on the july 2025 recommendation to bring compliance into the audit-log design for the ai coding-suggestion concept: understand what an internal coding auditor would need in order to audit, and defend, codes produced with ai assistance. the concept has not been built or piloted; the participant responded to the july 2025 screens and the accept/override tracking described there. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: participant does internal retrospective coding audits (sample-based review of coded encounters) and supports responses to external audits and claim denials. key findings [critical] (audit trail) the auditor said they could not defend a code in an external audit, or on a claim denial appeal, without a per-code record of what the tool suggested, what the coder accepted, what the coder overrode and what they changed it to, and who did it and when. a flag saying &quot;ai assistance was used&quot; on the encounter isn&#x27;t enough. without the per-code record they would recommend compliance not sign off on the tool going live. [high] (governance) wants generation metadata (the suggestion, the source text it cited, the model version and, for the note itself, which parts were scribe-drafted) visible to coding auditors, not internal-only in the sense of &quot;only it can pull it&quot;. they had no objection to keeping it off the permanent chart, in line with the cmio&#x27;s attestation model, but said &quot;internal&quot; has to include the people who audit the codes. [medium] (sampling) for at least the first year they would audit ai-accepted codes at a higher rate than codes the coder entered themselves, as an informal starting point &quot;maybe double the usual sample&quot;. they would focus on suggestions accepted without any edit and on unspecified codes. they would also compare acceptance and override rates across coders: someone who accepts nearly everything would be a reason to look closer, not a sign of efficiency. representative quotes &quot;when i pull a chart the question is always the same: who picked this code, and why. if the answer is &#x27;the system suggested it and somebody clicked accept,&#x27; i can&#x27;t stand behind that in front of anyone.&quot; — coding auditor, p122 &quot;i don&#x27;t need it on the chart. i need it somewhere i can actually see it. &#x27;internal&#x27; can&#x27;t mean only it can get to it.&quot; — coding auditor, p122 recommendations make the per-code suggested / accepted / overridden record (with user and timestamp) a release-blocking requirement for the coding-suggestion concept, and spec it jointly with compliance and coding audit. add the question of who can access the internal audit log to the still-pending legal/compliance ratification of the cmio&#x27;s attestation model. the model says where the metadata lives, not who can read it. design the audit log so it can be filtered by acceptance status (accepted as suggested, edited, overridden) to support targeted sampling. follow-ups / open questions who owns access to the internal audit log the cmio&#x27;s model describes, and does it already exist for scribe-drafted notes? confirm with compliance whether a higher audit rate for ai-accepted codes would need to be written into coding audit policy. related synthesized into: him-coding-and-billing.md , governance-and-phi.md participants participants — interview — coding auditor on override tracking and audit trail count: 1 roles: p122 — coding auditor (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2025-07-29). no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-05-05-interview-care-coordinator-supervisor-queue-oversight", "kind": "raw", "title": "Interview — Care Coordinator Supervisor on Queue Oversight", "date": "2026-05-05", "type": "interview", "status": "raw", "tags": ["care-coordination", "alert-triage", "alert-fatigue", "trust-in-ai", "audit-trail", "project-care-coordination"], "related_components": ["alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-05-05-interview-care-coordinator-supervisor-queue-oversight/session-notes.md", "corrections": [], "html": "<h1>Interview — Care Coordinator Supervisor on Queue Oversight</h1>\n<h2>Objective</h2>\n<p>Get a care coordinator supervisor&#x27;s view of what oversight they would need if alerts were AI-ranked, following up the August 2025 supervisor&#x27;s concern that speed gains could mask rubber-stamping, and the override-reason capture designed after that test. The participant is a different person from P79, the supervisor in the August 2025 test.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant leads an ambulatory care coordination team. Their team works the chronological queue; the AI-ranked queue hasn&#x27;t been built, and the override-reason capture wireflow is designed and in review, not built. They had not seen the August 2025 screens before; they reacted to a description of the ranked queue and the override-reason flow in this session. They did not take part in any earlier session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(oversight)</em> If alerts were AI-ranked, they would want a record of the order each coordinator was shown and what the coordinator did with each alert, so they could look back at a case when something went wrong. They would also use override reasons for coaching, to see how a coordinator is judging risk, not only for model tuning. That raises a question the current design doesn&#x27;t settle: the wireflow logs reasons for model-tuning review and says they are &quot;not surfaced to other coordinators&quot;, but doesn&#x27;t say whether supervisors see them.</li><li><strong>[MEDIUM]</strong> <em>(alert volume)</em> They estimated that heavy days run &quot;maybe 30 to 60 alerts&quot; per coordinator, and that many of them are administrative rather than clinical. This is their informal estimate; no queue data was reviewed in this session.</li><li><strong>[MEDIUM]</strong> <em>(rubber-stamping)</em> They shared the August 2025 supervisor&#x27;s worry that a ranked order could be followed without judgement, but said they&#x27;d only know if it was happening by looking at what coordinators did with the order. This is a perspective, not a measurement; nothing about how often coordinators follow a ranking has been measured.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;If something goes wrong, I need to see what order they were shown and what they did with it. Otherwise I&#x27;m coaching blind.&quot;</p><p>— Care Coordinator Supervisor, P132</p></blockquote>\n<blockquote><p>&quot;The reasons are the useful part for me. They tell me how someone&#x27;s thinking about risk.&quot;</p><p>— Care Coordinator Supervisor, P132</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Decide who can see override reasons (model-tuning review only, or supervisors as well) before the reason-capture wireflow leaves review, and say so in the design.</li><li>If a ranked queue is piloted, record the order shown and each coordinator&#x27;s action, so rubber-stamping can be looked for in data rather than assumed.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often coordinators would follow a ranked order without judgement is not measured, and can&#x27;t be until something is built and logged.</li><li>Real alert volumes per coordinator are not known; the 30 to 60 figure is one supervisor&#x27;s estimate.</li><li>Whether the override-capture idea was shared with the Data Science team working on the care-gap flagging model, as the August 2025 session suggested, isn&#x27;t recorded.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Care Coordinator Supervisor on Queue Oversight</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P132 — Care Coordinator Supervisor (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). This participant is new to the research: a different person from P79, the supervisor in the 2025-08-26 alert-triage test. They did not take part in any earlier session. No real patient or staff identities are represented; t ent person from p79, the supervisor in the 2025-08-26 alert-triage test. they did not take part in any earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-05-12-interview-cdi-specialist-documentation-gaps", "kind": "raw", "title": "Interview — CDI Specialist on Documentation Gaps in AI-Drafted Notes", "date": "2026-05-12", "type": "interview", "status": "raw", "tags": ["him", "coding", "documentation", "ai-generated-content", "workflow", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-05-12-interview-cdi-specialist-documentation-gaps/session-notes.md", "corrections": [], "html": "<h1>Interview — CDI Specialist on Documentation Gaps in AI-Drafted Notes</h1>\n<h2>Objective</h2>\n<p>Understand how scribe-drafted notes have changed clinical documentation integrity (CDI) review since the ambient scribe went GA in January 2026, and how a CDI specialist would want the AI coding-suggestion concept (July 2025 prototype, not built or piloted) to behave when the documentation behind a code is incomplete.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> Participant does concurrent and retrospective CDI review on inpatient and some outpatient encounters and writes physician queries. They work alongside the coding team but sit in a separate queue.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(documentation gaps)</em> Scribe-drafted notes are fluent and well organized, so they read as complete. What&#x27;s missing (acuity, severity, the clinical indicators that support a diagnosis, the link between conditions) is harder to spot than in a sparse typed note, where a gap was obvious at a glance. They said a scribe-drafted note now takes a more deliberate read, by their own informal count a few extra minutes per note, because they can no longer rely on a note &quot;looking thin&quot; to tell them where to look.</li><li><strong>[MEDIUM]</strong> <em>(queries)</em> Wants the coding-suggestion concept to suggest queries, not codes, when the documentation is incomplete. Their worry is that a suggested code on an under-specified note pushes the coder either to an unspecified code or toward a leading query. They&#x27;d want a draft query that states the clinical indicators found and asks the physician to clarify, in non-leading language Compliance has approved.</li><li><strong>[LOW]</strong> <em>(workflow)</em> There is no hand-off signal between CDI and coding. Coders can&#x27;t see that a CDI query is already open on an encounter, so an encounter sometimes gets coded before the answer comes back, or the physician gets a second, near-duplicate query from the coder. They described this as an annoyance that predates the scribe, not something GA caused.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The note sounds finished. That&#x27;s the problem. It reads like a really good note, and then you go looking for the acuity and it&#x27;s just not in there.&quot;</p><p>— Clinical Documentation Integrity Specialist, P123</p></blockquote>\n<blockquote><p>&quot;Don&#x27;t hand me a code. Hand me the question I should be asking the doctor.&quot;</p><p>— Clinical Documentation Integrity Specialist, P123</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>For under-specified documentation, have the coding-suggestion concept output a draft query routed to CDI instead of a code, with query wording reviewed by Compliance so it stays non-leading.</li><li>Share CDI&#x27;s list of the specificity elements most often missing from scribe-drafted notes with the ambient scribe team, alongside the coders&#x27; list.</li><li>Separately from any AI work, look at a simple &quot;query open&quot; indicator on the encounter that coders can see.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm with Compliance which query templates are already approved, and whether AI-drafted query text would need its own review.</li><li>Get CDI query counts for the months before and after GA.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — CDI Specialist on Documentation Gaps in AI-Drafted Notes</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P123 — Clinical Documentation Integrity Specialist (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2025-07-29). No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — cdi specialist on documentation gaps in ai-drafted notes him coding documentation ai-generated-content workflow project-him coding-suggestion-panel interview — cdi specialist on documentation gaps in ai-drafted notes objective understand how scribe-drafted notes have changed clinical documentation integrity (cdi) review since the ambient scribe went ga in january 2026, and how a cdi specialist would want the ai coding-suggestion concept (july 2025 prototype, not built or piloted) to behave when the documentation behind a code is incomplete. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: participant does concurrent and retrospective with query wording reviewed by compliance so it stays non-leading. share cdi&#x27;s list of the specificity elements most often missing from scribe-drafted notes with the ambient scribe team, alongside the coders&#x27; list. separately from any ai work, look at a simple &quot;query open&quot; indicator on the encounter that coders can see. follow-ups / open questions confirm with compliance which query templates are already approved, and whether ai-drafted query text would need its own review. get cdi query counts for the months before and after ga. related synthesized into: him-coding-and-billing.md participants participants — interview — cdi specialist on documentation gaps in ai-drafted notes count: 1 roles: p123 — clinical documentation integrity specialist (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2025-07-29). no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-06-02-interview-him-specialist-roi-ai-drafted-notes", "kind": "raw", "title": "Interview — HIM Specialist on Releasing AI-Drafted Notes", "date": "2026-06-02", "type": "interview", "status": "raw", "tags": ["him", "release-of-information", "phi", "legal-record", "sensitive-notes", "ai-generated-content", "project-him"], "related_components": ["roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-06-02-interview-him-specialist-roi-ai-drafted-notes/session-notes.md", "corrections": [], "html": "<h1>Interview — HIM Specialist on Releasing AI-Drafted Notes</h1>\n<h2>Objective</h2>\n<p>Understand how releasing records that contain scribe-drafted notes has changed day-to-day release of information (ROI) work since the ambient scribe went GA in January 2026: what the specialist thinks counts as the released legal record, what new redaction work the scribe has created, and what they would still expect from a redaction-assistance tool. The participant is an HIM specialist doing ROI fulfillment. They have the same role label as P69 in the July 2025 contextual inquiry but are a different person, and did not take part in that session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; no ROI redaction tool has been built or piloted either. 42 CFR Part 2 handling is still fully manual. The participant does first-pass review and redaction on ROI requests and passes anything that needs Part 2 handling to the second-level review described in the March 2026 supervisor interview.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(legal record)</em> The specialist isn&#x27;t sure what the released legal record is for a scribe-drafted note. They release the signed note as it appears in the chart, but they&#x27;ve heard the scribe keeps generation metadata somewhere (a draft, a transcript, or both, they weren&#x27;t sure) and don&#x27;t know whether that is part of the designated record set, whether a requester or an attorney could ask for it, or who would decide. Nobody has given ROI guidance on it since GA. They have had one request from an attorney&#x27;s office that asked for &quot;all versions and drafts&quot; of a visit note; it was escalated to the supervisor and they didn&#x27;t hear how it was resolved.</li><li><strong>[HIGH]</strong> <em>(sensitive notes)</em> The scribe captures things said in passing that a physician typing their own note would usually have left out, for example a patient mentioning a family member&#x27;s diagnosis or a relative&#x27;s substance use, or a side comment about a partner. These end up in the signed note and have to be found and redacted before release, page by page, because they&#x27;re not in a predictable section. By their own informal estimate, they find something like this in &quot;maybe one in five or six&quot; scribe-drafted notes in a typical release, though they said that was a guess and depends heavily on the clinic. This is separate from Part 2: most of what they redact here isn&#x27;t Part 2 content, but some of it could be, which pushes the request into second-level review.</li><li><strong>[MEDIUM]</strong> <em>(trust)</em> Asked about redaction assistance, they reaffirmed the July 2025 position: highlighting what might need redaction would help, especially for the incidental content above, but a person has to make the redaction and do the final release. They&#x27;d want to see why something was flagged. They were more skeptical than they expected to be about the tool missing things: &quot;it&#x27;s the stuff it doesn&#x27;t flag that I&#x27;d lose sleep over.&quot;</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;When somebody asks for the record, I send the signed note. But if there&#x27;s a draft sitting behind it that the scribe made, is that the record too? I genuinely don&#x27;t know, and I don&#x27;t think anybody&#x27;s told us.&quot;</p><p>— HIM Specialist (Release of Information), P124</p></blockquote>\n<blockquote><p>&quot;The scribe writes down everything. Mom&#x27;s diagnosis, the brother&#x27;s drinking, whatever came up while they were talking. Now that&#x27;s in the chart, and I&#x27;m the one who has to catch it before it goes out the door.&quot;</p><p>— HIM Specialist (Release of Information), P124</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Ask Legal/Compliance to state whether scribe generation metadata (drafts, transcripts, provenance) is part of the designated record set or legal record, and give ROI written guidance. Add this to the still-pending ratification of the CMIO&#x27;s August 2025 attestation model.</li><li>Share examples of incidental third-party and sensitive content captured by the scribe with the ambient scribe team, as input to what the drafting step leaves out of the note.</li><li>If ROI redaction assistance is scoped, keep it suggest-only with a human doing the redaction and final release, show why each item was flagged, and test specifically for missed incidental content, not only Part 2 content.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How was the &quot;all versions and drafts&quot; attorney request resolved, and by whom?</li><li>Does the scribe retain a transcript or draft after the note is signed, and for how long?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — HIM Specialist on Releasing AI-Drafted Notes</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P124 — HIM Specialist (Release of Information) (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2026-03-31). This participant is a different person from P69, the HIM specialist in the 2025-07-15 contextual inquiry, despite the same role label. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — him specialist on releasing ai-drafted notes him release-of-information phi legal-record sensitive-notes ai-generated-content project-him roi-redaction-tool interview — him specialist on releasing ai-drafted notes objecti
