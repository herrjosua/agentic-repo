 low vision, P103</p></blockquote>\n<blockquote><p>&quot;Those little icons in the alert list, I hit the wrong one probably one in four times. On a good day.&quot;</p><p>— Clinician, limited fine motor control, P105</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Fix touch target sizing on the alert triage icons as a priority, since it directly affects a live Compass AI feature (linking to August findings).</li><li>Implement support for OS-level dynamic text sizing; this is likely a systemic app issue, not specific to any one screen.</li><li>Note the recurring color-only status pattern (now found in 3 separate audits: legacy console, design system, mobile app) as a candidate for a single, org-wide design system fix rather than three separate ones.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm whether the color-only status issue has a single shared root component across surfaces, which would make for one fix instead of three.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/accessibility-cross-cutting.md\">accessibility-cross-cutting.md</a></li></ul><h2>Participants</h2><h1>Participants — Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Clinician (low vision)</li><li>Clinician (limited fine motor control, uses stylus)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "accessibility audit — mobile clinician app (low vision & motor impairment focus) accessibility mobile low-vision motor-impairment project-cross-cutting mobile-app-alert-list alert-triage-queue accessibili </strong> <em>(awareness gap)</em> Only 34% of non-clinical staff reported being aware Compass AI initiatives were underway at all, versus 71% of clinical staff — suggesting internal communications have been clinically focused and may need broadening if non-clinical rollouts (e.g., scheduling) proceed.</li><li><strong>[MEDIUM]</strong> <em>(sentiment trend (directional, not causal))</em> Among clinical respondents, favorable sentiment toward AI-assisted documentation was somewhat higher than the March-ish baseline period, though this survey used different question wording than February&#x27;s, so it&#x27;s directional context rather than a clean comparison.</li><li><strong>[LOW]</strong> <em>(top requested feature)</em> When asked what AI feature they&#x27;d most want next, &#x27;appointment scheduling help&#x27; was the top write-in among non-clinical/admin staff, and &#x27;documentation time savings&#x27; remained the top pick among clinical staff — consistent with priorities identified all year.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I hear about this AI stuff from clinical friends but nobody&#x27;s told admin staff what&#x27;s actually happening or if it affects us.&quot;</p><p>— Non-clinical/administrative staff, P112 (survey open-ended)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Broaden internal communications about Compass AI to non-clinical staff specifically before any admin-facing pilot (e.g., scheduling chatbot) goes live, given the awareness gap found here.</li><li>If a clean sentiment trend is wanted for 2026 reporting, re-run the exact February nursing survey instrument rather than a new pulse survey, to get a true apples-to-apples comparison.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Decide with leadership whether the September burnout survey or a repeat of the February survey is the better instrument for the planned 6-month post-GA comparison.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/rollout-and-change-management.md\">rollout-and-change-management.md</a></li></ul><h2>Participants</h2><h1>Participants — Survey — All-Staff AI Readiness Pulse Survey</h1>\n<p><strong>Count:</strong> 421</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Clinical staff (various)</li><li>Non-clinical/administrative staff</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "survey — all-staff ai readiness pulse survey survey organizational-readiness pulse year-end project-cross-cutting patient-chatbot-widget survey — all-staff ai readiness pulse survey objective take an org-wide temperature check on ai readiness/sentiment heading into 2026, as input to roadmap prioritization and communications planning. method method: org-wide anonymous pulse survey, 10 questions researcher: priya patel full participant roster: see participants.md in this folder key findings [medium] (awareness gap) only 34% of non-clinical staff reported being aware compass ai initiatives were underway at all, versus 71% of clinical staff — suggesting internal communications have been clinically focused and may need broadening if non-clinical rollouts (e.g., scheduling) proceed. [medium] (sentiment trend (directional, not causal)) among clinical respondents, favorable sentiment toward ai-assisted documentation was somewhat higher than the march-ish baseline period, though this survey used different question wording than february&#x27;s, so it&#x27;s directional context rather than a clean comparison. [low] (top requested feature) when asked what ai feature they&#x27;d most want next, &#x27;appointment scheduling help&#x27; was the top write-in among non-clinical/admin staff, and &#x27;documentation time savings&#x27; remained the top pick among clinical staff — consistent with priorities identified all year. representative quotes &quot;i hear about this ai stuff from clinical friends but nobody&#x27;s told admin staff what&#x27;s actually happening or if it affects us.&quot; — non-clinical/administrative staff, p112 (survey open-ended) recommendations broaden internal communications about compass ai to non-clinical staff specifically before any admin-facing pilot (e.g., scheduling chatbot) goes live, given the awareness gap found here. if a clean sentiment trend is wanted for 2026 reporting, re-run the exact february nursing survey instrument rather than a new pulse survey, to get a true apples-to-apples comparison. follow-ups / open questions decide with leadership whether the september burnout survey or a repeat of the february survey is the better instrument for the planned 6-month post-ga comparison. related synthesized into: rollout-and-change-management.md participants participants — survey — all-staff ai readiness pulse survey count: 421 roles: clinical staff (various) non-clinical/administrative staff researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-12-16-stakeholder-interview-executive-steering-committee-retro", "kind": "raw", "title": "Executive Steering Committee — Year-End Retro & 2026 Roadmap Input", "date": "2025-12-16", "type": "interview", "status": "raw", "tags": ["executive", "retro", "roadmap", "year-end", "governance", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md", "corrections": [], "html": "<h1>Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</h1>\n<h2>Objective</h2>\n<p>Close out the year with the same executive group (plus two additions) from the January kickoff to review what research found, what shipped, and what should be prioritized in 2026.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Group interview/retro, 90 min, 4 executives</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(shared metrics gap partially closed)</em> The group agreed, informally, to adopt &#x27;documentation time saved&#x27; and &#x27;PHI incidents (target: zero)&#x27; as the two headline metrics going into 2026 — resolving the shared-metrics gap flagged as a finding back in January, though it&#x27;s not yet been formally written into any governance document.</li><li><strong>[MEDIUM]</strong> <em>(recurring platform debt surfaced)</em> The CIO specifically called out the color-only status indicator issue (found independently in 3 separate 2025 audits) as an example of the kind of small, recurring finding that research should flag as a pattern, not just three separate tickets — asked for a standing &#x27;cross-cutting findings&#x27; section in future reporting.</li><li><strong>[LOW]</strong> <em>(scope discipline praised)</em> VP Clinical Informatics specifically praised the decision to keep behavioral health and complex prior-auth cases out of scope for 2025, saying the discipline of &#x27;not doing it&#x27; was as valuable as anything shipped.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;A year ago we couldn&#x27;t agree on what success even meant. Now we at least agree on the two numbers we&#x27;re arguing about. That&#x27;s real progress.&quot;</p><p>— Chief Information Officer, P01 (returning from January)</p></blockquote>\n<blockquote><p>&quot;The stuff you told us not to build yet mattered as much as the stuff you told us to build.&quot;</p><p>— VP Clinical Informatics, P02 (returning from January)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Formalize the two agreed 2026 headline metrics in an actual governance document before Q1 2026 planning locks, so the informal agreement here doesn&#x27;t get lost.</li><li>Introduce a standing &#x27;cross-cutting findings&#x27; section in the research repo/reporting specifically to surface patterns like the color-only status issue across otherwise-separate sessions.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Draft the formal metrics document and route for exec sign-off in January 2026.</li><li>Retrofit a &#x27;cross-cutting findings&#x27; index into the research repo covering 2025 (e.g., color-only status, transparency/citation requests, Part 2 flagging gap).</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</h1>\n<p><strong>Count:</strong> 4</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Chief Information Officer</li><li>VP Clinical Informatics</li><li>Chief Privacy Officer</li><li>Chief Medical Information Officer</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "executive steering committee — year-end retro & 2026 roadmap input executive retro roadmap year-end governance project-cross-cutting executive steering &#x27;cross-cutting findings&#x27; section in the research repo/reporting specifically to surface patterns like the color-only status issue across otherwise-separate sessions. follow-ups / open questions draft the formal metrics document and route for exec sign-off in january 2026. retrofit a &#x27;cross-cutting findings&#x27; index into the research repo covering 2025 (e.g., color-only status, transparency/citation requests, part 2 flagging gap). related synthesized into: governance-and-phi.md participants participants — executive steering committee — year-end retro &amp; 2026 roadmap input count: 4 roles: chief information officer vp clinical informatics chief privacy officer chief medical information officer researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2026-01-13-usability-test-ambient-scribe-ga-release-candidate", "kind": "raw", "title": "Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)", "date": "2026-01-13", "type": "usability-test", "status": "raw", "tags": ["ambient-scribe", "usability", "documentation", "ga-release", "longitudinal", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md", "corrections": [], "html": "<h1>Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</h1>\n<h2>Objective</h2>\n<p>Final validation pass on the ambient scribe before GA release, testing the v0.3 confidence-indicator concept (from September&#x27;s recommendation) and confirming readiness against the full history of prior findings.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, simulated + 2 real (consented) low-acuity encounters, 45 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[LOW]</strong> <em>(confidence indicator (positive))</em> The new per-line confidence highlighting (low-confidence transcription shown in a subtle underline) was well received and, notably, 4 of 6 participants said it let them skim high-confidence lines for the first time across the whole testing history — the first session where reduced line-by-line reading was observed.</li><li><strong>[MEDIUM]</strong> <em>(sound-alike medication errors)</em> Still present in 1 of 6 sessions despite the pronunciation dictionary work referenced in September; team should treat this as an ongoing monitoring item post-GA rather than a pre-GA blocker, given the confidence indicator now flags it for review anyway.</li><li><strong>[MEDIUM]</strong> <em>(training readiness)</em> Participants who&#x27;d been through the champion-model style training pilot (per October&#x27;s recommendation) reported higher initial comfort than those who hadn&#x27;t, though this wasn&#x27;t a controlled comparison.</li><li><strong>[LOW]</strong> <em>(phi-handling (confirmed stable))</em> Draft-retention/auto-expiry behavior (fixed in v0.2) remains stable and correctly documented for audit purposes; no new PHI-handling issues found.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;This is the first time I actually skimmed a section instead of reading every word, because it showed me exactly where to look instead.&quot;</p><p>— Physician, Internal Medicine, P09 (returning from v0.1 and v0.2)</p></blockquote>\n<blockquote><p>&quot;I went through the champion training last month and honestly walked in already comfortable. That part worked.&quot;</p><p>— Nurse Practitioner, P118 (new participant)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Approve for GA release; the critical (Feb) and high (Feb, Sept) findings across this tool&#x27;s full testing history are resolved or actively monitored, and the confidence-indicator concept appears to be the trust-building lever the team was looking for since September.</li><li>Continue tracking sound-alike medication errors as a post-GA metric rather than delaying release further for a low-frequency, now-flagged issue.</li><li>Use this session as the evidence base for the CIO&#x27;s requested &#x27;documentation time saved&#x27; 2026 headline metric baseline measurement.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Set up post-GA monitoring dashboard for sound-alike medication error rate.</li><li>Feed this session&#x27;s time data into the formal 2026 metrics document (per December retro action item).</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</h1>\n<p><strong>Count:</strong> 6</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician (Family Medicine)</li><li>Physician (Internal Medicine)</li><li>Nurse Practitioner</li><li>Physician Assistant</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ambient ai scribe ga release candidate (final validation) ambient-scribe usability documentation ga-release longitudinal project-ambient-scribe ambient-scribe-widget encounter-v ipant) recommendations approve for ga release; the critical (feb) and high (feb, sept) findings across this tool&#x27;s full testing history are resolved or actively monitored, and the confidence-indicator concept appears to be the trust-building lever the team was looking for since september. continue tracking sound-alike medication errors as a post-ga metric rather than delaying release further for a low-frequency, now-flagged issue. use this session as the evidence base for the cio&#x27;s requested &#x27;documentation time saved&#x27; 2026 headline metric baseline measurement. follow-ups / open questions set up post-ga monitoring dashboard for sound-alike medication error rate. feed this session&#x27;s time data into the formal 2026 metrics document (per december retro action item). related synthesized into: ambient-scribe.md participants participants — usability test — ambient ai scribe ga release candidate (final validation) count: 6 roles: physician (family medicine) physician (internal medicine) nurse practitioner physician assistant researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2026-01-19-onboarding-usability-test", "kind": "raw", "title": "Onboarding usability test — session notes", "date": "2026-01-19", "type": "usability-test", "status": "raw", "tags": ["onboarding", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-01-19-onboarding-usability-test/session-notes.md", "corrections": [], "html": "<p><strong>Researcher:</strong> Priya Patel</p>\n<h2>Session 1 — Jan 19</h2>\n<p>Participant paused ~15s at step 3 (&quot;Connect calendar&quot;), said &quot;wait, do I have to do this?&quot; before proceeding. Completed step without connecting a real calendar (used the skip-adjacent &quot;I&#x27;ll do this later&quot; affordance, which doesn&#x27;t actually exist — participant tried clicking the step label itself as an exit).</p>\n<h2>Session 2 — Jan 20</h2>\n<p>Attempted to skip step 2 directly, assuming it was optional. Backed out when the &quot;required&quot; indicator appeared, expressed mild frustration (&quot;could&#x27;ve told me that up front&quot;).</p>\n<h2>Session 3 — Jan 21</h2>\n<p>Same step 3 hesitation as session 1. When asked directly, said: &quot;I guess I&#x27;m worried this is going to email my whole team before I&#x27;m ready.&quot;</p>\n<h2>Sessions 4–6 (Jan 22–23)</h2>\n<p>Consistent with sessions 1–3: step 3 wording read as optional by all participants; none independently identified it as required without hitting the &quot;required&quot; state first.</p><h2>Participants</h2><p><strong>Researcher:</strong> Priya Patel</p>\n<p>6 participants, all first-time Fernway workspace admins hired within the last 90 days. Company sizes ranged 10–200 employees, mix of industries. Recruited via existing customer outreach list, screened for &quot;has not previously completed Fernway onboarding themselves.&quot;</p>", "searchText": "onboarding usability test — session notes onboarding project-onboarding researcher: priya patel session 1 — jan 19 participant paused ~15s at step 3 (&quot;connect calendar&quot;), said &quot;wait, do i have to do this?&quot; before proceeding. completed step without connecting a real calendar (used the skip-adjacent &quot;i&#x27;ll do this later&quot; affordance, which doesn&#x27;t actually exist — participant tried clicking the step label itself as an exit). session 2 — jan 20 attempted to skip step 2 directly, assuming it was optional. backed out when the &quot;required&quot; indicator appeared, expressed mild frustration (&quot;could&#x27;ve told me that up front&quot;). session 3 — jan 21 same step 3 hesitation as session 1. when asked directly, said: &quot;i guess i&#x27;m worried this is going to email my whole team before i&#x27;m ready.&quot; sessions 4–6 (jan 22–23) consistent with sessions 1–3: step 3 wording read as optional by all participants; none independently identified it as required without hitting the &quot;required&quot; state first. participants researcher: priya patel 6 participants, all first-time fernway workspace admins hired within the last 90 days. company sizes ranged 10–200 employees, mix of industries. recruited via existing customer outreach list, screened for &quot;has not previously completed fernway onboarding themselves.&quot;"}, {"id": "raw:2026-01-27-dashboard-review-ambient-scribe-ga-adoption", "kind": "raw", "title": "Dashboard review — Ambient scribe GA candidate adoption", "date": "2026-01-27", "type": "analytics", "status": "raw", "tags": ["ambient-scribe", "ga-release", "dashboard", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-01-27-dashboard-review-ambient-scribe-ga-adoption/session-notes.md", "corrections": [], "html": "<h1>Dashboard review — Ambient scribe GA candidate adoption</h1>\n<h2>Objective</h2>\n<p>Manually review the internal usage dashboard for the ambient scribe GA release candidate to see whether adoption and engagement patterns in real usage match what the GA-candidate usability round found — particularly whether the per-line confidence highlighting is actually changing reviewing behavior at scale, not just in the moderated session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Manual dashboard review (no moderated session, no participants) — internal analytics dashboard covering the first 4 weeks of GA-candidate rollout</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> none — this is an analytics review, not a research session; see <code>participants.md</code> in this folder for why</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(trust)</em> Clinicians who were shown confidence highlighting skim high-confidence lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the usability round&#x27;s finding that visible uncertainty, not raw accuracy, changes reviewing behavior.</li><li><strong>[LOW]</strong> <em>(adoption)</em> Adoption is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments, worth understanding qualitatively rather than assuming it&#x27;s a training gap.</li></ul>\n<h2>Recommendations</h2>\n<ol><li>Feed this dashboard pattern back into <code>findings/ambient-scribe.md</code> as corroborating evidence for the confidence-highlighting result, rather than treating it as a separate finding.</li><li>Consider a short follow-up interview round specifically on the physician/resident adoption gap.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Is the physician/resident adoption gap explained by workflow differences, trust, or something else entirely? Dashboard data alone can&#x27;t answer this.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Dashboard review — Ambient scribe GA candidate adoption</h1>\n<p><strong>Count:</strong> N/A</p>\n<p><strong>Roles:</strong> N/A — this session has no research participants. It&#x27;s a manual review of aggregate, de-identified usage data from the internal analytics dashboard, not a moderated or observed session. This file exists only to keep the folder shape consistent with every other <code>raw/</code> session for indexing purposes.</p>\n<p><strong>Researcher:</strong> Priya Patel</p>", "searchText": "dashboard review — ambient scribe ga candidate adoption ambient-scribe ga-release dashboard project-ambient-scribe ambient-scribe-widget dashboard review — ambient scribe ga candidate adoption objective manually review the internal usage dashboard for the ambient scribe ga release candidate to see whether adoption and engagement patterns in real usage match what the ga-candidate usability round found — particularly whether the per-line confidence highlighting is actually changing reviewing behavior at scale, not just in the moderated session. method method: manual dashboard review (no moderated session, no participants) — internal analytics dashboard covering the first 4 weeks of ga-candidate rollout researcher: priya patel full participant roster: none — this is an analytics review, not a research session; see participants.md in this folder for why key findings [medium] (trust) clinicians who were shown confidence highlighting skim high-confidence lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the usability round&#x27;s finding that visible uncertainty, not raw accuracy, changes reviewing behavior. [low] (adoption) adoption is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments, worth understanding qualitatively rather than assuming it&#x27;s a training gap. recommendations feed this dashboard pattern back into findings/ambient-scribe.md as corroborating evidence for the confidence-highlighting result, rather than treating it as a separate finding. consider a short follow-up interview round specifically on the physician/resident adoption gap. follow-ups / open questions is the physician/resident adoption gap explained by workflow differences, trust, or something else entirely? dashboard data alone can&#x27;t answer this. related synthesized into: ambient-scribe.md participants participants — dashboard review — ambient scribe ga candidate adoption count: n/a roles: n/a — this session has no research participants. it&#x27;s a manual review of aggregate, de-identified usage data from the internal analytics dashboard, not a moderated or observed session. this file exists only to keep the folder shape consistent with every other raw/ session for indexing purposes. researcher: priya patel"}, {"id": "raw:2026-02-10-ambient-scribe-medication-flag-concept", "kind": "raw", "title": "Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept", "date": "2026-02-10", "type": "usability-test", "status": "raw", "tags": ["ambient-scribe", "usability", "medication-safety", "documentation", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md", "corrections": [], "html": "<h1>Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept</h1>\n<h2>Objective</h2>\n<p>The GA-candidate round (2026-01-13) recommended treating sound-alike medication errors as an ongoing post-GA monitoring item rather than a launch blocker, since the existing <code>confidence-highlighted</code> variant already surfaces them as generically low-confidence. This session tests an early concept that goes one step further: a <em>distinct</em> flag specifically for suspected sound-alike medication names, visually separate from the general low-confidence underline, to see whether participants notice and act on it differently than they do on ordinary low-confidence text.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, 6 simulated encounters seeded with known sound-alike pairs (e.g. hydralazine/hydroxyzine, clonidine/Klonopin), 40 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(flag recognized correctly)</em> 5 of 6 participants correctly identified the medication-specific flag (a distinct amber pill-shaped badge, vs. the generic low-confidence underline) as &quot;different from the usual low-confidence thing&quot; within the first two encounters, without being told the distinction existed.</li><li><strong>[MEDIUM]</strong> <em>(over-trust risk)</em> 2 participants said the badge&#x27;s specificity made them <em>more</em> likely to treat unflagged medication lines as automatically correct — the opposite of the intended effect, and worth watching as adoption scales.</li><li><strong>[LOW]</strong> <em>(placement)</em> Badge placement inline with the medication name (vs. in a right-hand margin, tested as an alternate) was preferred 5:1 — participants didn&#x27;t want to look away from the text to check a flag.</li><li><strong>[LOW]</strong> <em>(false positive tolerance)</em> One deliberately-seeded false positive (a real but unusual drug name) was accepted by all 6 participants as &quot;worth a second look, not annoying&quot; — suggests some over-flagging is tolerable if the badge is visually light.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;That&#x27;s different from the fuzzy-underline stuff — this one&#x27;s telling me specifically &#x27;check the</p><p>drug name,&#x27; which is exactly what I&#x27;d want flagged.&quot;</p><p>— Physician, Internal Medicine, P22</p></blockquote>\n<blockquote><p>&quot;If it&#x27;s not flagged, I might just... trust it more than I should. That&#x27;s on me, but it&#x27;s worth</p><p>knowing the tool does that to people.&quot;</p><p>— Nurse Practitioner, P24</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Build the distinct medication-safety flag as its own variant, inline with the medication name, separate from generic confidence highlighting.</li><li>Before rollout, pair the flag with brief onboarding copy or training-pilot messaging that explicitly counters the over-trust-on-unflagged-lines risk surfaced by 2 of 6 participants — don&#x27;t let the flag imply &quot;anything unflagged is guaranteed correct.&quot;</li><li>Feed the false-positive tolerance finding to whoever tunes the sound-alike detection threshold — participants have headroom for a few extra false positives in exchange for not missing a real one.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Needs a larger-N validation pass before this moves from concept test to build-ready spec.</li><li>Over-trust-on-unflagged risk should be checked again once the post-GA monitoring dashboard (recommended 2026-01-13) has real error-rate data to compare against self-reported behavior.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe-post-ga-refinements.md\">ambient-scribe-post-ga-refinements.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept</h1>\n<p><strong>Count:</strong> 6</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician</li><li>Nurse Practitioner</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Drawn from the existing GA-candidate cohort (2026-01-13) plus 2 new participants, screened for regularly reviewing ambient-scribe drafts containing prescribed medications. No real patient or staff identities are recorded here; session-notes.md uses session-scoped fictional/anonymized participant IDs (e.g. P22) instead of names.</p>", "searchText": "usability test — ambient scribe sound-alike medication flag concept ambient-scribe usability medication-safety documentation project-ambient-scribe ambient-scribe-widget usability test — ambient scribe sound-alike medication flag concept objective the ga-candidate round (2026-01-13) recommended treating sound-alike medication errors as an ongoing post-ga monitoring item rather than a launch blocker, since the existing confidence-highlighted variant already surfaces them as generically low-confidence. this session tests an early concept that goes one step further: a distinct flag specifically for suspected sound-alike medication names, visually separate from the general low-confidence underline, to see whether participants notice and act on it differently than they do on ordinary low-confidence text. method method: moderated usability test, 6 simulated encounters seeded with known sound-alike pairs (e.g. hydralazine/hydroxyzine, clonidine/klonopin), 40 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (flag recognized correctly) 5 of 6 participants correctly identified the medication-specific flag (a distinct amber pill-shaped badge, vs. the generic low-confidence underline) as &quot;different from the usual low-confidence thing&quot; within the first two encounters, without being told the distinction existed. [medium] (over-trust risk) 2 participants said the badge&#x27;s specificity made them more likely to treat unflagged medication lines as automatically correct — the opposite of the intended effect, and worth watching as adoption scales. [low] (placement) badge placement inline with the medication name (vs. in a right-hand margin, tested as an alternate) was preferred 5:1 — participants didn&#x27;t want to look away from the text to check a flag. [low] (false positive tolerance) one deliberately-seeded false positive (a real but unusual drug name) was accepted by all 6 participants as &quot;worth a second look, not annoying&quot; — suggests some over-flagging is tolerable if the badge is visually light. representative quotes &quot;that&#x27;s different from the fuzzy-underline stuff — this one&#x27;s telling me specifically &#x27;check the drug name,&#x27; which is exactly what i&#x27;d want flagged.&quot; — physician, internal medicine, p22 &quot;if it&#x27;s not flagged, i might just... trust it more than i should. that&#x27;s on me, but it&#x27;s worth knowing the tool does that to people.&quot; — nurse practitioner, p24 recommendations build the distinct medication-safety flag as its own variant, inline with the medication name, separate from generic confidence highlighting. before rollout, pair the flag with brief onboarding copy or training-pilot messaging that explicitly counters the over-trust-on-unflagged-lines risk surfaced by 2 of 6 participants — don&#x27;t let the flag imply &quot;anything unflagged is guaranteed correct.&quot; feed the false-positive tolerance finding to whoever tunes the sound-alike detection threshold — participants have headroom for a few extra false positives in exchange for not missing a real one. follow-ups / open questions needs a larger-n validation pass before this moves from concept test to build-ready spec. over-trust-on-unflagged risk should be checked again once the post-ga monitoring dashboard (recommended 2026-01-13) has real error-rate data to compare against self-reported behavior. related synthesized into: ambient-scribe-post-ga-refinements.md participants participants — usability test — ambient scribe sound-alike medication flag concept count: 6 roles: physician nurse practitioner researcher: priya patel recruitment note: drawn from the existing ga-candidate cohort (2026-01-13) plus 2 new participants, screened for regularly reviewing ambient-scribe drafts containing prescribed medications. no real patient or staff identities are recorded here; session-notes.md uses session-scoped fictional/anonymized participant ids (e.g. p22) instead of names."}, {"id": "raw:2026-02-17-session-lock-during-dictation", "kind": "raw", "title": "Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation", "date": "2026-02-17", "type": "contextual-inquiry", "status": "raw", "tags": ["ambient-scribe", "sso", "mfa", "authentication", "phi", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-02-17-session-lock-during-dictation/session-notes.md", "corrections": [{"path": "raw/2026-02-17-session-lock-during-dictation/correction-2026-09-27.md", "date": "2026-09-27", "title": "Correction — Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation"}, {"path": "raw/2026-02-17-session-lock-during-dictation/correction-2026-10-13.md", "date": "2026-10-13", "title": "Correction — Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation (participant ID)"}], "html": "<h1>Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation</h1>\n<h2>Objective</h2>\n<p><code>encounter-view.md</code>&#x27;s component notes flag the <code>locked</code> state&#x27;s interaction with an in-progress ambient scribe recording as an open edge case, raised as a side note in the 2025-05-20 SSO/MFA interview but never directly studied. This session shadows clinicians through their normal SSO/MFA idle-timeout window while actively dictating, to observe what actually happens today and what they expect/want instead.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Contextual inquiry / shadowing, 5 clinicians observed through at least one natural idle-timeout event during a real or simulated dictation session, plus 1 IT Security stakeholder interviewed on the technical constraints</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[CRITICAL]</strong> <em>(silent draft loss)</em> In the current build, a session lock mid-recording simply freezes the ambient-scribe widget with no message; 4 of 5 clinicians assumed the draft was lost and started re-dictating from scratch after re-authenticating, even though the draft is server-side and actually survives the lock.</li><li><strong>[HIGH]</strong> <em>(no explicit paused state)</em> There is no visual distinction between &quot;recording,&quot; &quot;frozen because locked,&quot; and &quot;actually stopped&quot; — participants could not tell which state they were in without asking a shadowing observer.</li><li><strong>[MEDIUM]</strong> <em>(re-auth friction stacks)</em> Clinicians already re-authenticate frequently for unrelated reasons (badge-tap SSO renewals); a lock during dictation is perceived as &quot;one more annoying re-login,&quot; not as a distinct, expected safety behavior — this framing gap likely drives the abandon-and-redictate behavior above as much as the missing UI does.</li><li><strong>[LOW]</strong> <em>(IT Security confirms feasibility)</em> IT Security confirmed the 10-minute idle timeout is not adjustable per-feature, but confirmed an explicit &quot;paused, draft preserved&quot; UI state is technically straightforward to add without changing the timeout policy itself.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I genuinely thought I&#x27;d lost it. I&#x27;ve just gotten used to starting over when the screen locks,</p><p>so I didn&#x27;t even try to check.&quot;</p><p>— Physician, Family Medicine, P31</p></blockquote>\n<blockquote><p>&quot;If it said &#x27;paused, nothing lost, just log back in,&#x27; I&#x27;d believe it and wait. Right now it just</p><p>looks broken.&quot;</p><p>— Nurse Practitioner, P33</p></blockquote>\n<blockquote><p>&quot;The timeout window itself is a hard policy constraint, but what the screen tells the clinician</p><p>during that window is entirely a product decision — that part isn&#x27;t locked down.&quot;</p><p>— IT Security stakeholder</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Add an explicit &quot;paused — draft preserved, re-authenticate to resume&quot; state to the <code>encounter-view</code>/<code>ambient-scribe-widget</code> lock interaction, replacing the current silent freeze.</li><li>Do not attempt to change or extend the idle-timeout policy itself — per IT Security, treat it as fixed and solve this entirely at the UI-messaging layer.</li><li>Pair the new state with brief messaging that reframes the lock as an expected safety behavior rather than an unrelated login interruption, to counter the &quot;one more annoying re-login&quot; framing found here.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm with IT Security whether the same &quot;paused, preserved&quot; messaging pattern should extend to other session-timeout-adjacent surfaces beyond ambient scribe.</li><li>Re-test the abandon-and-redictate behavior once the explicit paused state ships, to confirm it actually changes clinician behavior and not just their stated understanding.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe-post-ga-refinements.md\">ambient-scribe-post-ga-refinements.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation</h1>\n<p><strong>Count:</strong> 5</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician</li><li>Nurse Practitioner</li><li>IT Security</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> 4 clinicians recruited from regular ambient-scribe users on units with known short idle-timeout windows; 1 IT Security stakeholder recruited directly for technical context rather than shadowed. No real patient or staff identities are recorded here; session-notes.md uses session-scoped fictional/anonymized participant IDs (e.g. P31) instead of names.</p><h2>Correction (2026-09-27)</h2><p>Filed 2026-09-27 as <code>correction-2026-09-27.md</code> in this session's folder. The original notes above are unchanged.</p><p>Corrects <code>session-notes.md</code> in this folder. That file is left unedited (<code>raw/</code> is append-only).  to check.&quot;</p><p>— Physician, Family Medicine, P31</p></blockquote>\n<p>P31 was already assigned to the IT Security Engineer in <code>raw/2025-05-20-interview-it-security-sso-mfa-modernization/session-notes.md:36,39</code>, and this session doesn&#x27;t mark the physician as returning, so they are different people.</p>\n<p><strong>Correct ID:</strong> Physician, Family Medicine, P119.</p>", "searchText": "contextual inquiry — session lock during active ambient scribe dictation ambient-scribe sso mfa authentication phi project-ambient-scribe ambient-scribe-widget encounter-view contextual inquiry — session lock during active ambient scribe dictation objective encounter-view.md &#x27;s component notes flag the locked state&#x27;s interaction with an in-progress ambient scribe recording as an open edge case, raised as a side note in the 2025-05-20 sso/mfa interview but never directly studied. this session shadows clinicians through their normal sso/mfa idle-timeout window while actively dictating, to observe what actually happens today and what they expect/want instead. method method: contextual inquiry / shadowing, 5 clinicians observed through at least one natural idle-timeout event during a real or simulated dictation session, plus 1 it security stakeholder interviewed on the technical constraints researcher: priya patel full participant roster: see participants.md in this folder key findings [critical] (silent draft loss) in the current build, a session lock mid-recording simply freezes the ambient-scribe widget with no message; 4 of 5 clinicians assumed the draft was lost and started re-dictating from scratch after re-authenticating, even though the draft is server-side and actually survives the lock. [high] (no explicit paused state) there is no visual distinction between &quot;recording,&quot; &quot;frozen because locked,&quot; and &quot;actually stopped&quot; — participants could not tell which state they were in without asking a shadowing observer. [medi bandon-and-redictate behavior once the explicit paused state ships, to confirm it actually changes clinician behavior and not just their stated understanding. related synthesized into: ambient-scribe-post-ga-refinements.md participants participants — contextual inquiry — session lock during active ambient scribe dictation count: 5 roles: physician nurse practitioner it security researcher: priya patel recruitment note: 4 clinicians recruited from regular ambient-scribe users on units with known short idle-timeout windows; 1 it security stakeholder recruited directly for technical context rather than shadowed. no real patient or staff identities are recorded here; session-notes.md uses session-scoped fictional/anonymized participant ids (e.g. p31) instead of names. correction (2026-09-27) filed 2026-09-27 as correction-2026-09-27.md in this session's folder. the original notes above are unchanged. corrects session-notes.md in this folder. that file is left unedited ( raw/ is append-only). correction (2026-09-27): participant count session-notes.md says: contextual inquiry / shadowing, 5 clinicians observed through at least one natural idle-timeout event during a real or simulated dictation session, plus 1 it security stakeholder interviewed on the technical constraints participants.md says: count: 5 recruitment note: 4 clinicians recruited from regular ambient-scribe users on units with known short idle-timeout windows; 1 it security stakeholder recruited directly for technical context rather than shadowed. correct count: 5 participants in total, made up of 4 clinicians who were shadowed and 1 it security stakeholder who was interviewed but not shadowed. the session notes counted the it security stakeholder as a fifth clinician. participants.md is the more precise source. correction (2026-09-27): draft-loss result session-notes.md says &quot;4 of 5 clinicians assumed the draft was lost.&quot; only the 4 shadowed clinicians went through a lock during dictation, so this means all 4 clinicians assumed the draft was lost and started dictating again after they re-authenticated. correction (2026-10-13) filed 2026-10-13 as correction-2026-10-13.md in this session's folder. the original notes above are unchanged. corrects session-notes.md in this folder. that file is left unedited ( raw/ is append-only). this adds to correction-2026-09-27.md ; it doesn&#x27;t replace it. correction (2026-10-13): p31 session-notes.md (lines 54-56) says: &quot;i genuinely thought i&#x27;d lost it. i&#x27;ve just gotten used to starting over when the screen locks, so i didn&#x27;t even try to check.&quot; — physician, family medicine, p31 p31 was already assigned to the it security engineer in raw/2025-05-20-interview-it-security-sso-mfa-modernization/session-notes.md:36,39 , and this session doesn&#x27;t mark the physician as returning, so they are different people. correct id: physician, family medicine, p119."}, {"id": "raw:2026-03-03-interview-care-coordinator-chart-review-scribe-notes", "kind": "raw", "title": "Interview — Care Coordinator on Chart Review of Scribe-Drafted Notes", "date": "2026-03-03", "type": "interview", "status": "raw", "tags": ["care-coordination", "chart-review", "ambient-scribe", "ai-generated-content", "workflow", "project-care-coordination"], "related_components": ["chart-review-summary-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-03-03-interview-care-coordinator-chart-review-scribe-notes/session-notes.md", "corrections": [], "html": "<h1>Interview — Care Coordinator on Chart Review of Scribe-Drafted Notes</h1>\n<h2>Objective</h2>\n<p>Two months after the ambient scribe went GA in January 2026, understand how pre-outreach chart review has changed for a care coordinator now that many of the visit notes they read are scribe-drafted, and whether the &quot;what changed since last review&quot; idea from the January 2025 baseline still describes what they need. Care coordinators don&#x27;t use the scribe themselves; they read the signed notes clinicians produce with it.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a care coordinator on an ambulatory primary care team who makes outreach calls to a panel of patients and reviews each chart before calling. They did not take part in the January 2025 baseline or the August 2025 alert-triage test. The chart-review summary panel (&quot;what changed since last review&quot;) is still a concept and hasn&#x27;t been built; they were described the idea in this session, not shown screens.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(scribe-drafted notes)</em> Since GA, the visit notes they read before an outreach call are longer and more conversational than the notes clinicians used to type. What they need for the call (the plan, follow-up items, medication changes) is in there but takes longer to find, so they now jump straight to the plan and the medication list and only read the rest if something there doesn&#x27;t make sense. They put the extra time at &quot;a couple of extra minutes&quot; on complex patients. This is their informal impression, not something timed in this session.</li><li><strong>[MEDIUM]</strong> <em>(what changed)</em> Without being prompted with the January 2025 quote, they asked for a view of &quot;what changed since my last outreach call&quot;. They anchored it on their own last contact with the patient, not on the patient&#x27;s last visit, because a patient may have had several visits, results or medication changes since the coordinator last spoke with them. This refines the &quot;what changed since last review&quot; concept: the reference point that matters to them is the coordinator&#x27;s last contact.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The notes are longer now. It&#x27;s all in there, it just reads like a conversation, so I skip to the plan and the med list and work backwards if I have to.&quot;</p><p>— Care Coordinator, P130</p></blockquote>\n<blockquote><p>&quot;I don&#x27;t need to know what happened at the last visit. I need to know what happened since the last time I talked to them.&quot;</p><p>— Care Coordinator, P130</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Anchor the chart-review summary concept on the coordinator&#x27;s last outreach contact, not only on the last visit, and test both anchors when the concept is next put in front of coordinators.</li><li>Share with the ambient scribe team that downstream readers who aren&#x27;t clinicians (coordinators, as well as coders) rely on the plan and medication sections being easy to find in scribe-drafted notes.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How much longer chart review takes on scribe-drafted notes is not measured. The January 2025 baseline&#x27;s 8-14 minutes per patient hasn&#x27;t been re-timed since GA; a timed observation would be needed to check the &quot;couple of extra minutes&quot; impression.</li><li>Does &quot;last outreach contact&quot; exist as a recorded event anywhere a summary could read it, or only in the coordinator&#x27;s own notes and the shared spreadsheet?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Care Coordinator on Chart Review of Scribe-Drafted Notes</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P130 — Care Coordinator (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). This participant is new to the research and did not take part in either earlier session. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — care coordinator on chart review of scribe-drafted notes care-coordination chart-review ambient-scribe ai-generated-content workflow project-care-coordination chart-review-summary-panel interview — care coordinator on chart review of scribe-drafted notes objective two months after the ambient scribe went ga in january 2026, understand how pre-outreach chart review has changed for a care coordinator now that many of the visit notes they read are scribe-drafted, and whether the &quot;what changed since last review&quot; idea from the january 2025 baseline still describes what they need. care coordinators don&#x27;t use the scribe themselves; they read the signed notes clinicians produce with it. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a care coordinator on an ambulatory primary care team who makes outreach calls to a panel of patients and reviews each chart before calling. they did not take part in the january 2025 baseline or the august 2025 alert-triage test. the chart-review summary panel (&quot;what changed since last review&quot;) is still a concept and hasn&#x27;t been built; they were described the idea in this session, not shown screens. key findings [high] (scribe-drafted notes) since ga, the visit notes they read before an outreach call are longer and more conversational than the notes clinicians used to type. what they need for the call (the plan, follow-up items, medication changes) is in there but takes longer to find, so they now jump straight to the plan and the medication list and only read the rest if something there doesn&#x27;t make sense. they put the extra time at &quot;a couple of extra minutes&quot; on complex patients. this is their informal impression, not something timed in this session. [medium] (what changed) without being prompted with the january 2025 quote, they asked for a view of &quot;what changed since my last outreach call&quot;. they anchored it on their own last contact with the patient, not on the patient&#x27;s last visit, because a patient may have had several visits, results or medication changes since the coordinator last spoke with them. this refines the &quot;what changed since last review&quot; concept: the reference point that matters to them is the coordinator&#x27;s last contact. representative quotes &quot;the notes are longer now. it&#x27;s all in there, it just reads like a conversation, so i skip to the plan and the med list and work backwards if i have to.&quot; — care coordinator, p130 &quot;i don&#x27;t need to know what happened at the last visit. i need to know what happened since the last time i talked to them.&quot; — care coordinator, p130 recommendations anchor the chart-review summary concept on the coordinator&#x27;s last outreach contact, not only on the last visit, and test both anchors when the concept is next put in front of coordinators. share with the ambient scribe team that downstream readers who aren&#x27;t clinicians (coordinators, as well as coders) rely on the plan and medication sections being easy to find in scribe-drafted notes. follow-ups / open questions how much longer chart review takes on scribe-drafted notes is not measured. the january 2025 baseline&#x27;s 8-14 minutes per patient hasn&#x27;t been re-timed since ga; a timed observation would be needed to check the &quot;couple of extra minutes&quot; impression. does &quot;last outreach contact&quot; exist as a recorded event anywhere a summary could read it, or only in the coordinator&#x27;s own notes and the shared spreadsheet? related synthesized into: care-coordination-triage.md participants participants — interview — care coordinator on chart review of scribe-drafted notes count: 1 roles: p130 — care coordinator (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). this participant is new to the research and did not take part in either earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes", "kind": "raw", "title": "Interview — Medical Coder on Coding from AI-Drafted Notes", "date": "2026-03-10", "type": "interview", "status": "raw", "tags": ["him", "coding", "documentation", "ai-generated-content", "trust-in-ai", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes/session-notes.md", "corrections": [], "html": "<h1>Interview — Medical Coder on Coding from AI-Drafted Notes</h1>\n<h2>Objective</h2>\n<p>Two months after the ambient scribe went GA in January 2026, understand how coding from scribe-drafted notes differs from coding notes the physician typed, and what a coder would expect from the AI coding-suggestion concept (tested as a prototype in July 2025, not built or piloted) now that much of the documentation it would read is itself AI-drafted.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> Participant codes outpatient and some inpatient encounters daily and has coded from scribe-drafted notes since GA. They did not take part in the July 2025 usability test; their view of the coding-suggestion concept comes from a walkthrough of the July 2025 screens during this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(documentation gaps)</em> Scribe-drafted notes often capture what was discussed in the visit but leave out the specificity coding depends on: laterality, acute vs. chronic, type or stage (they gave heart failure type and CKD stage as examples), and the &quot;due to&quot; link between two conditions. When it&#x27;s missing the coder has two options, query the physician or code to the unspecified level, and they said they are doing both more often than with notes physicians typed from their own templates. They noted the July 2025 prototype&#x27;s mismatches were mostly at the specificity level too, and expect a suggester reading these notes to hit the same wall.</li><li><strong>[MEDIUM]</strong> <em>(trust in AI-drafted notes)</em> Nothing in the signed note shows which sentences the scribe drafted and which the physician typed or edited. When a sentence looks off (e.g., a diagnosis in the assessment that nothing else in the note supports), the coder can&#x27;t tell whether it&#x27;s a documentation problem worth a query or something the scribe picked up from the conversation that the physician didn&#x27;t catch at sign-off. They weren&#x27;t asking for a marker on the permanent chart, just &quot;something I can see while I&#x27;m coding&quot;.</li><li><strong>[MEDIUM]</strong> <em>(query volume)</em> Coder&#x27;s impression is that queries back to physicians have gone up since GA, and that physicians are slower to answer queries about notes &quot;they didn&#x27;t really write&quot;. This is qualitative only: they had no count, and no department query data was reviewed in this session.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I&#x27;m coding off what the doctor says happened. Now I read a sentence and I honestly don&#x27;t know if the doctor said it or the scribe thing filled it in. Who wrote this? I can&#x27;t tell you, and I&#x27;m the one putting a code on it.&quot;</p><p>— Medical Coder (certified), P120</p></blockquote>\n<blockquote><p>&quot;If the suggester is reading the same notes I&#x27;m reading, it&#x27;s going to land on unspecified too. It&#x27;ll just get there faster than me.&quot;</p><p>— Medical Coder (certified), P120</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Collect the specificity elements coders most often query on scribe-drafted notes (laterality, acuity, type/stage, condition linkage) and share them with the ambient scribe team as input to the drafting prompts and note structure.</li><li>For the coding-suggestion concept, design for under-specified input: when the note doesn&#x27;t support a specific code, the tool should say so rather than quietly suggest the unspecified code.</li><li>Raise with Compliance whether scribe-drafted vs. clinician-edited provenance could be shown in the coding view only, consistent with the CMIO&#x27;s August 2025 model of no marker on the permanent chart.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Get actual physician query counts from HIM leadership for the months before and after GA, to check the coder&#x27;s impression.</li><li>Find out whether the scribe&#x27;s generation metadata is captured at sentence level, and whether it could reach the coding workflow at all.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Medical Coder on Coding from AI-Drafted Notes</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P120 — Medical Coder (certified) (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2025-07-29). No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — medical coder on coding from ai-drafted notes him coding documentation ai-generated-content trust-in-ai project-him coding-suggestion-panel interview — medical coder on coding from ai-drafted notes objective two months after the ambient scribe went ga in january 2026, understand how coding from scribe-drafted notes differs from coding notes the physician typed, and what a coder would expect from the ai coding-suggestion concept (tested as a prototype in july 2025, not built or piloted) now that much of the documentation it would read is itself ai-drafted. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: participant codes outpatient and some inpatient encounters daily and has coded from scribe-drafted notes since ga. they did not take part in the july 2025 usability test; their view of the coding-suggestion concept comes from a walkthrough of the july 2025 screens during this session. key findings [high] (documentation gaps) scribe-drafted notes often capture what was discussed in the visit but leave out the specificity coding depends on: laterality, acute vs. chronic, type or stage (they gave heart failure type and ckd stage as examples), and the &quot;due to&quot; link between two conditions. when it&#x27;s missing the coder has two options, query the physician or code to the unspecified level, and they said they are doing both more often than with notes physicians typed from their own templates. they noted the july 2025 prototype&#x27;s mismatches were mostly at the specificity level too, and expect a suggester reading these notes to hit the same wall. [medium] (trust in ai-drafted notes) nothing in the signed note shows which sentences the scribe drafted and which the physician typed or edited. when a sentence looks off (e.g., a diagnosis in the assessment that nothing else in the note supports), the coder can&#x27;t tell whether it&#x27;s a documentation problem worth a query or something the scribe picked up from the conversation that the physician didn&#x27;t catch at sign-off. they weren&#x27;t asking for a marker on the permanent chart, just &quot;something i can see while i&#x27;m coding&quot;. [medium] (query volume) coder&#x27;s impression is that queries back to physicians have gone up since ga, and that physicians are slower to answer queries about notes &quot;they didn&#x27;t really write&quot;. this is qualitative only: they had no count, and no department query data was reviewed in this session. representative quotes &quot;i&#x27;m coding off what the doctor says happened. now i read a sentence and i honestly don&#x27;t know if the doctor said it or the scribe thing filled it in. who wrote this? i can&#x27;t tell you, and i&#x27;m the one putting a code on it.&quot; — medical coder (certified), p120 &quot;if the suggester is reading the same notes i&#x27;m reading, it&#x27;s going to land on unspecified too. it&#x27;ll just get there faster than me.&quot; — medical coder (certified), p120 recommendations collect the specificity elements coders most often query on scribe-drafted notes (laterality, acuity, type/stage, condition linkage) and share them with the ambient scribe team as input to the drafting prompts and note structure. for the coding-suggestion concept, design for under-specified input: when the note doesn&#x27;t support a specific code, the tool should say so rather than quietly suggest the unspecified code. raise with compliance whether scribe-drafted vs. clinician-edited provenance could be shown in the coding view only, consistent with the cmio&#x27;s august 2025 model of no marker on the permanent hether the February 2025 nursing survey&#x27;s top concern (&quot;losing my clinical narrative voice&quot;) means the same thing to a nurse who now reads scribe-drafted notes every day.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a registered nurse in an ambulatory primary care clinic, mid-career. After a visit they make callbacks (results, medication questions), give patients follow-up instructions and act on orders, all from the provider&#x27;s signed visit note, which since GA is often scribe-drafted. They don&#x27;t use the scribe themselves. They did not take part in any earlier session, including the February 2025 nursing survey; they are not P41, the outpatient clinic nurse quoted in that survey.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(plan section)</em> What they act on is the plan section: the follow-up interval, the medication change, what to tell the patient. In scribe-drafted notes the plan is usually there, but sometimes part of it is said in the conversation and written up in the body of the note rather than the plan, so they now read the whole note before a callback instead of going straight to the plan. They described this as &quot;a few times a week&quot; an instruction they almost missed; that is their informal impression, not a count. If the plan is incomplete, they message the provider before calling the patient, which delays the callback.</li><li><strong>[MEDIUM]</strong> <em>(voice)</em> For them, the &quot;voice&quot; concern is about other people&#x27;s notes, not their own. They can tell which notes are scribe-drafted because they read more like a conversation and less like the provider they know, and that makes it harder to tell what the provider actually meant to emphasise. They did not worry about their own voice, because the scribe doesn&#x27;t draft nursing notes. This complicates the February 2025 survey&#x27;s finding, which framed the concern as nurses losing their own narrative voice.</li><li><strong>[MEDIUM]</strong> <em>(trust)</em> They don&#x27;t know which parts of a signed note the provider edited and which the scribe drafted, and they assume the provider read it all. They said they would not change how they act on a note if they knew, but they would know where to ask questions. This is a stated expectation; no alternative view was shown.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I live in the plan. If it said &#x27;come back in two weeks&#x27; in the conversation and the plan doesn&#x27;t say it, the patient&#x27;s going to ask me and I won&#x27;t know.&quot;</p><p>— Registered Nurse (primary care clinic), P138</p></blockquote>\n<blockquote><p>&quot;It&#x27;s not my voice I&#x27;m worried about, the scribe doesn&#x27;t write my notes. It&#x27;s that I can&#x27;t hear the doctor in theirs anymore.&quot;</p><p>— Registered Nurse (primary care clinic), P138</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Share with the ambient scribe team that nurses act on the plan section of scribe-drafted notes, so follow-up intervals, medication changes and patient instructions said during the visit need to reach the plan, not only the body.</li><li>When the survey&#x27;s &quot;voice&quot; concern is next cited, say whose voice: for this nurse it was the provider&#x27;s, in notes the nurse reads but didn&#x27;t write.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often plan items land outside the plan section in scribe-drafted notes is not measured; &quot;a few times a week&quot; is one nurse&#x27;s impression.</li><li>Whether other clinic nurses read the whole note or only the plan is not known; this is one interview.</li><li>Whether nurses would use a marker of which parts the provider edited is untested; no such marker exists.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe-post-ga-refinements.md\">ambient-scribe-post-ga-refinements.md</a>, <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Clinic Nurse on Reading Scribe-Drafted Visit Notes</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P138 — Registered Nurse (primary care clinic) (nurse)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via ambulatory clinic nursing contacts. This participant is new to the research and did not take part in any earlier session, including the February 2025 nursing survey; they are not P41, the outpatient clinic nurse quoted there. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — clinic nurse on reading scribe-drafted visit notes nursing ambient-scribe documentation trust-in-ai project-ambient-scribe interview — clinic nurse on reading scribe-drafted visit notes objective two months after the ambient scribe went ga in january 2026, understand how a clinic nurse works from visit notes the scribe drafted for someone else. the scribe drafts visit notes for physicians, nps and pas only; nurses don&#x27;t use it for their own documentation, and nurse charting is still manual. earlier ambient-scribe research tested the people who dictate and sign the note. this session asked about the people who read the signed note afterwards and act on it, and whether the february 2025 nursing survey&#x27;s top concern (&quot;losing my clinical narrative voice&quot;) means the same thing to a nurse who now reads scribe-drafted notes every day. method method: 1:1 interview, 45 min researcher: p
