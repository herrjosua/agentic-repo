 familiarity.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a float pool care coordinator who covers several teams. They are a different person from P05, the float pool coordinator in the January 2025 baseline and the April 2026 interview. They read the signed visit notes clinicians produce, including scribe-drafted ones, but don&#x27;t use the scribe themselves. Alerts still arrive in each team&#x27;s chronological queue; the AI-ranked queue hasn&#x27;t been built. They reacted to a description of the ranked queue, not to screens. They did not take part in any earlier session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(no combined view)</em> On a typical shift they cover several teams and switch between each team&#x27;s own alert queue, with no view that brings the queues together. They keep track of where they are in each queue themselves. This is their account of their own practice; nothing was observed or measured in this session.</li><li><strong>[MEDIUM]</strong> <em>(float vs continuity)</em> They would accept a ranked queue as a starting point, because as a float coordinator they don&#x27;t have the patient history that team coordinators use to reorder alerts. P05 said something related in April 2026: when floating, they work the queue strictly in order and leave reprioritising to the team&#x27;s own coordinators. These are two voices from float coordinators, set against team coordinators (P81 in 2025, P134 in August 2026) who lean on knowing their patients. At n=2 this is a contrast worth testing, not a pattern.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I&#x27;m in three or four queues a shift, and I&#x27;m flipping between them. There&#x27;s no one place that shows me all of it.&quot;</p><p>— Care Coordinator (float pool), P136</p></blockquote>\n<blockquote><p>&quot;I don&#x27;t know these patients&#x27; history, so honestly a ranking would be a better start than what I&#x27;ve got. I&#x27;d still check it.&quot;</p><p>— Care Coordinator (float pool), P136</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Explore a combined queue view for coordinators who cover more than one team, and test it with float pool coordinators.</li><li>When the ranked queue is next tested, include both float and team coordinators so the float-versus-continuity contrast can be checked with more than two float voices.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How many teams a float coordinator typically covers in a shift is not measured; this is one coordinator&#x27;s account.</li><li>How accurate the 2025 ranking is, and what it was based on, are still not documented, so it isn&#x27;t known whether accepting it as a starting point is safe.</li><li>How often coordinators would follow a ranked order without their own judgement has not been measured, for float coordinators or anyone else.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Float Pool Care Coordinator on Covering Several Teams</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P136 — Care Coordinator (float pool) (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions. The participant is a float pool coordinator who covers several teams. They are a different person from P05, the float pool coordinator in earlier sessions. They are new to the research and did not take part in any earlier session. No real patient or staff identities are represented; the rdinators. these are two voices from float coordinators, set against team coordinators (p81 in 2025, p134 in august 2026) who lean on knowing their patients. at n=2 this is a contrast worth testing, not a pattern. representative quotes &quot;i&#x27;m in three or four queues a shift, and i&#x27;m flipping between them. there&#x27;s no one place that shows me all of it.&quot; — care coordinator (float pool), p136 &quot;i don&#x27;t know these patients&#x27; history, so honestly a ranking would be a better start than what i&#x27;ve got. i&#x27;d still check it.&quot; — care coordinator (float pool), p136 recommendations explore a combined queue view for coordinators who cover more than one team, and test it with float pool coordinators. when the ranked queue is next tested, include both float and team coordinators so the float-versus-continuity contrast can be checked with more than two float voices. follow-ups / open questions how many teams a float coordinator typically covers in a shift is not measured; this is one coordinator&#x27;s account. how accurate the 2025 ranking is, and what it was based on, are still not documented, so it isn&#x27;t known whether accepting it as a starting point is safe. how often coordinators would follow a ranked order without their own judgement has not been measured, for float coordinators or anyone else. related synthesized into: care-coordination-triage.md participants participants — interview — float pool care coordinator on covering several teams count: 1 roles: p136 — care coordinator (float pool) (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions. the participant is a float pool coordinator who covers several teams. they are a different person from p05, the float pool coordinator in earlier sessions. they are new to the research and did not take part in any earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-09-08-interview-him-specialist-roi-request-turnaround", "kind": "raw", "title": "Interview — HIM Specialist on ROI Request Turnaround", "date": "2026-09-08", "type": "interview", "status": "raw", "tags": ["him", "release-of-information", "phi", "workflow", "42-cfr-part-2", "project-him"], "related_components": ["roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-09-08-interview-him-specialist-roi-request-turnaround/session-notes.md", "corrections": [], "html": "<h1>Interview — HIM Specialist on ROI Request Turnaround</h1>\n<h2>Objective</h2>\n<p>Understand what drives release of information (ROI) turnaround from the point of view of a specialist working the queue, how it differs by who is asking, and whether the suggest-only position on redaction assistance from July 2025 still holds when a specialist thinks about volume. The participant is an HIM specialist doing ROI fulfillment. They have the same role label as P69 (July 2025 contextual inquiry) and P124 (June 2026 interview), but they are a different person from both and took part in neither session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted. No ROI redaction tool has been built or piloted either. 42 CFR Part 2 handling is still fully manual. The participant does intake and first-pass review and redaction on ROI requests, and passes anything that needs Part 2 handling to the second-level review the March 2026 supervisor described. They have released records containing scribe-drafted notes since GA.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(redaction)</em> They hold the suggest-only position: a person redacts and a person releases, with no auto-release. Within that, they would accept a tool that pre-highlighted possible redactions across a batch of requests at once, but only for low-risk request types. Their example was a patient asking for their own visit notes or test results, where nothing is going to a third party. Each record would still be opened, checked and released by a specialist. They would not want batch pre-highlighting on attorney or insurer requests, or anything that might involve Part 2, and said those should stay one at a time.</li><li><strong>[MEDIUM]</strong> <em>(turnaround)</em> Turnaround depends mostly on who is asking, not on how long the record is. By their own informal estimate, a patient request for their own recent records is usually out &quot;within a few days&quot;. Insurer requests take about a week, because they need checking against the authorization and are often for long date ranges. Attorney requests are the slowest, &quot;often two weeks or more&quot;, because of authorization checks, broad &quot;complete record&quot; scopes, and a higher chance of Part 2 content going to second-level review. These are their impressions, not counts. They fit the March 2026 supervisor&#x27;s point that the backlog sits with Part 2 review, and add that attorney requests feed that queue more than other types.</li><li><strong>[LOW]</strong> <em>(portal)</em> Since patients could download more of their own records through the patient portal, they&#x27;ve noticed fewer simple patient requests for recent visit notes and results coming to ROI, though they couldn&#x27;t say how many. What&#x27;s left of patient requests tends to be older records or things the portal doesn&#x27;t show. They didn&#x27;t think it had made a noticeable difference to the overall backlog, which is driven by third-party requests.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;For a patient asking for their own notes, sure, run the whole batch and highlight what I should look at. I&#x27;ll still open every one and I&#x27;ll still be the one who hits send. Attorney requests, no. Those I do one at a time.&quot;</p><p>— HIM Specialist (Release of Information), P128</p></blockquote>\n<blockquote><p>&quot;It&#x27;s not how thick the chart is, it&#x27;s who&#x27;s asking. A patient&#x27;s done in a few days. An insurer&#x27;s about a week. An attorney? Two weeks if I&#x27;m lucky, because there&#x27;s always something that has to go up for the second look.&quot;</p><p>— HIM Specialist (Release of Information), P128</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>If ROI redaction assistance is scoped, keep it suggest-only with a human releasing each record. Treat batch pre-highlighting for low-risk, patient-directed request types as a possible first scope, and exclude third-party and possible Part 2 requests from batch handling.</li><li>Report ROI turnaround by requester type (patient, insurer, attorney, other) rather than as one figure, so the effect of any change can be seen where the backlog actually is.</li><li>Check how much patient request volume the portal has absorbed before using overall request volume to size any tool.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Pull system-of-record turnaround by requester type to check the informal estimates. This adds to the still-open request for ROI volume and turnaround data from July 2025 and March 2026.</li><li>What share of attorney requests go to second-level Part 2 review compared with other requester types?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — HIM Specialist on ROI Request Turnaround</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P128 — HIM Specialist (Release of Information) (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2026-03-31, 2026-06-02). This participant is a different person from P69 (2025-07-15) and P124 (2026-06-02), despite the same role label. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — him specialist on roi request turnaround him release-of-information phi workflow 42-cfr-part-2 project-him roi-redaction-tool interview — him specialist on roi request turnaround objective understand what drives release of information (roi) turnaround from the point of view of a specialist working the queue, how it differs by who is asking, and whether the suggest-only position on redaction assistance from july 2025 still holds when a specialist thinks about volume. the participant is an him specialist doing roi fulfillment. they have the same role label as p69 (july 2025 contextual inquiry) and p124 (june 2026 interview), but they are a different person from both and took part in neither session. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the ai coding-suggestion tool is still a concept from july 2025 and has not been built or piloted. no roi redaction tool has been built or piloted either. 42 cfr part 2 handling is still fully manual. the participant does intake and first-pass review and redaction on roi requests, and passes anything that needs part 2 handling to the second-level review the march 2026 supervisor described. they have released records containing scribe-drafted notes since ga. key findings [high] (redaction) they hold the suggest-only position: a person redacts and a person releases, with no auto-release. within that, they would accept a tool that pre-highlighted possible redactions across a batch of requests at once, but only for low-risk request types. their example was a patient asking for their own visit notes or test results, where nothing is going to a third party. each record would still be opened, checked and released by a specialist. they would not want batch pre-highlighting on attorney or insurer requests, or anything that might involve part 2, and said those should stay one at a time. [medium] (turnaround) turnaround depends mostly on who is asking, not on how long the record is. by their own informal estimate, a patient request for their own recent records is usually out &quot;within a few days&quot;. insurer requests take about a week, because they need checking against the authorization and are often for long date ranges. attorney requests are the slowest, &quot;often two weeks or more&quot;, because of authorization checks, broad &quot;complete record&quot; scopes, and a higher chance of part 2 content going to second-level review. these are their impressions, not counts. they fit the march 2026 supervisor&#x27;s point that the backlog sits with part 2 review, and add that attorney requests feed that queue more than other types. [low] (portal) since patients could download more of their own records through the patient portal, they&#x27;ve noticed fewer simple patient requests for recent visit notes and results coming to roi, though they couldn&#x27;t say how many. what&#x27;s left of patient requests tends to be older records or things the portal doesn&#x27;t show. they didn&#x27;t think it had made a noticeable difference to the overall backlog, which is driven by third-party requests. representative quotes &quot;for a patient asking for their own notes, sure, run the whole batch and highlight what i should look at. i&#x27;ll still open every one and i&#x27;ll still be the one who hits send. attorney requests, no. those i do one at a time.&quot; — him specialist (release of information), p128 &quot;it&#x27;s not how thick the chart is, it&#x27;s who&#x27;s asking. a patient&#x27;s done in a few days. an insurer&#x27;s about a week. an attorney? two weeks if i&#x27;m lucky, because there&#x27;s always something that has to go up for the second look.&quot; — him specialist (release of information), p128 recommendations if roi redaction assistance is scoped, keep it suggest-only with a human releasing each record. treat batch pre-highlighting for low-risk, patient-directed request types as a possible first scope, and exclude third-party and possible part 2 requests from batch handling. report roi turnaround by requester type (patient, insurer, attorney, other) rather than as one figure, so the effect of any change can be seen where the backlog actually is. check how much patient request volume the portal has absorbed before using overall request volume to size any tool. follow-ups / open questions pull system-of-record turnaround by requester type to check the informal estimates. this adds to the still-open request for roi volume and turnaround data from july 2025 and march 2026. what share of attorney requests go to second-level part 2 review compared with other requester types? related synthesized into: him-coding-and-billing.md , scope-boundaries-and-workflow-fit.md participants participants — interview — him specialist on roi request turnaround count: 1 roles: p128 — him specialist (release of information) (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2026-03-31, 2026-06-02). this participant is a different person from p69 (2025-07-15) and p124 (2026-06-02), despite the same role label. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-09-15-interview-infusion-nurse-medication-changes-in-scribe-notes", "kind": "raw", "title": "Interview — Infusion Nurse on Medication Changes in Scribe-Drafted Notes", "date": "2026-09-15", "type": "interview", "status": "raw", "tags": ["nursing", "ambient-scribe", "medication-safety", "documentation", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-09-15-interview-infusion-nurse-medication-changes-in-scribe-notes/session-notes.md", "corrections": [], "html": "<h1>Interview — Infusion Nurse on Medication Changes in Scribe-Drafted Notes</h1>\n<h2>Objective</h2>\n<p>The medication thread in <code>ambient-scribe-post-ga-refinements.md</code> rests on a concept test of a distinct sound-alike medication flag with the people who review and sign scribe drafts: physicians and NPs (2026-02-10-ambient-scribe-medication-flag-concept/participants.md). Nobody who reads a signed, scribe-drafted note and then gives the medication has been asked about it. This session asked an infusion nurse how they check medication changes in the treating provider&#x27;s visit note before they administer, and what, if anything, they see on medication lines in a signed note.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a registered nurse in an ambulatory infusion clinic, mid-career. Patients come in for scheduled infusions, and before starting one the nurse checks the infusion order against the treating provider&#x27;s most recent visit note, which since the January 2026 GA is often scribe-drafted. The scribe drafts visit notes for physicians, NPs and PAs only; the participant doesn&#x27;t use it, and their own charting is manual. They did not take part in any earlier session. They are not P138, the primary care clinic nurse interviewed in March 2026, and they don&#x27;t do care coordination or post-discharge calls. The distinct medication flag is recorded in the corpus as a concept test (2026-02-10) and a wireframe in review (<code>wireframes/ambient-scribe-medication-flag.md</code>), whose hover copy reads &quot;verify before signing&quot;; nothing was shown in this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(checking before administering)</em> Before every infusion they compare the order with the treating provider&#x27;s latest visit note, looking for a medication change: a changed dose, a held infusion, a premedication added or stopped, or a lab value that has to be checked first. They give the medication from the order, not the note; the note is how they find out whether the order still reflects what was decided at the visit. When the two disagree, they hold the infusion and contact the provider before starting. In scribe-drafted notes they sometimes find a change in the body of the note, written up from the conversation, rather than in the plan, or worded so that they can&#x27;t tell whether it was decided (&quot;we&#x27;ll probably bring the dose down&quot;). They recalled holding an infusion to check for this reason &quot;maybe once or twice a month&quot; since GA; that is an informal recollection, not a count, and they couldn&#x27;t say how many of those came from the scribe&#x27;s drafting and how many from the provider. This is the same pattern of plan items landing in the body that the March 2026 clinic nurse described (2026-03-17-interview-clinic-nurse-reading-scribe-drafted-notes/session-notes.md:30), in a different setting: here the cost is a delayed infusion before administration, not a delayed callback.</li><li><strong>[MEDIUM]</strong> <em>(the flag and readers)</em> The medication flag has so far been designed and tested for the person signing the note. This nurse reads the note after it is signed and acts on its medication lines. In the signed notes they read, they said they have not seen any marking on medication lines, neither a flag nor an underline; that is what they see, not a statement of how the product behaves. Their working assumption is that every medication line in a signed note was checked by the provider. That is a reader&#x27;s version of the over-trust risk the concept test found in 2 of 6 signers, who trusted unflagged lines more: a reader who never sees a flag treats every signed line as checked. They said that if a line had been flagged and the provider then confirmed or changed it, they would want to know, because that is the line they would check against the order first. That is an expectation; no such view exists. This extends the medication-flag finding to readers who didn&#x27;t write the note.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I don&#x27;t hang anything off the note, I hang it off the order. The note is how I find out if the order&#x27;s still right.&quot;</p><p>— Registered Nurse (infusion clinic), P143</p></blockquote>\n<blockquote><p>&quot;If it&#x27;s signed, I assume they checked the meds. I&#x27;ve never seen anything on a med line that tells me different.&quot;</p><p>— Registered Nurse (infusion clinic), P143</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Share with the ambient scribe team that medication changes decided at the visit need to reach the plan section as decided changes, because infusion nurses check them against the order before administering.</li><li>When the medication flag&#x27;s design is next reviewed, include nurses who read signed notes and give the medication as a user group, and decide explicitly whether anything about a flag, and what the signer did with it, should reach them. Don&#x27;t assume either answer.</li><li>Keep this evidence separate from the care coordination evidence on after-visit summaries: this is the visit note checked against the order before administration, not the summary a patient takes home.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Whether the medication flag, or any confidence marking, stays visible after a note is signed is not recorded in the corpus and was not settled here. This nurse has not seen any marking on signed notes, which says what they see, not how the product behaves; and the corpus records the distinct flag only as a concept test and a wireframe in review.</li><li>How often an infusion is held because the note and the order disagree is not measured; &quot;once or twice a month&quot; is one nurse&#x27;s recollection, and how many of those trace back to scribe drafting is not known.</li><li>Whether other infusion nurses, or nurses in other clinics, check the note against the order the same way is not known; this is one interview.</li><li>How often the after-visit summary misses medication changes remains open in the care coordination evidence; it was not discussed here.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe-post-ga-refinements.md\">ambient-scribe-post-ga-refinements.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Infusion Nurse on Medication Changes in Scribe-Drafted Notes</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P143 — Registered Nurse (infusion clinic) (nurse)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via ambulatory infusion clinic nursing contacts. This participant is new to the research and did not take part in any earlier session. They are not P138, the primary care clinic nurse from March 2026, and not a care coordinator. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — infusion nurse on medication changes in scribe-drafted notes nursing ambient-scribe medication-safety documentation project-ambient-scribe interview — infusion nurse on medication changes in scribe-drafted notes objective the medication thread in ambient-scribe-post-ga-refinements.md rests on a concept test of a distinct sound-alike medication flag with the people who review and sign scribe drafts: physicians and nps (2026-02-10-ambient-scribe-medication-flag-concept/participants.md). nobody who reads a signed, scribe-drafted note and then gives the medication has been asked about it. this session asked an infusion nurse how they check medication changes in the treating provider&#x27;s visit note before they administer, and what, if anything, they see on medication lines in a signed note. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a registered nurse in an ambulatory infusion clinic, mid-career. patients come in for scheduled infusions, and before starting one the nurse checks the infusion order against the treating provider&#x27;s most recent visit note, which since the january 2026 ga is often scribe-drafted. the scribe drafts visit notes for physicians, nps and pas only; the participant doesn&#x27;t use it, and their own charting is manual. they did not take part in any earlier session. they are not p138, the primary care clinic nurse interviewed in march 2026, and they don&#x27;t do care coordination or post-discharge calls. the distinct medication flag is recorded in the corpus as a concept test (2026-02-10) and a wireframe in review ( wireframes/ambient-scribe-medication-flag.md ), whose hover copy reads &quot;verify before signing&quot;; nothing was shown in this session. key findings [high] (checking before administering) before every infusion been flagged and the provider then confirmed or changed it, they would want to know, because that is the line they would check against the order first. that is an expectation; no such view exists. this extends the medication-flag finding to readers who didn&#x27;t write the note. representative quotes &quot;i don&#x27;t hang anything off the note, i hang it off the order. the note is how i find out if the order&#x27;s still right.&quot; — registered nurse (infusion clinic), p143 &quot;if it&#x27;s signed, i assume they checked the meds. i&#x27;ve never seen anything on a med line that tells me different.&quot; — registered nurse (infusion clinic), p143 recommendations share with the ambient scribe team that medication changes decided at the visit need to reach the plan section as decided changes, because infusion nurses check them against the order before administering. when the medication flag&#x27;s design is next reviewed, include nurses who read signed notes and give the medication as a user group, and decide explicitly whether anything about a flag, and what the signer did with it, should reach them. don&#x27;t assume either answer. keep this evidence separate from the care coordination evidence on after-visit summaries: this is the visit note checked against the order before administration, not the summary a patient takes home. follow-ups / open questions whether the medication flag, or any confidence marking, stays visible after a note is signed is not recorded in the corpus and was not settled here. this nurse has not seen any marking on signed notes, which says what they see, not how the product behaves; and the corpus records the distinct flag only as a concept test and a wireframe in review. how often an infusion is held because the note and the order disagree is not measured; &quot;once or twice a month&quot; is one nurse&#x27;s recollection, and how many of those trace back to scribe drafting is not known. whether other infusion nurses, or nurses in other clinics, check the note against the order the same way is not known; this is one interview. how often the after-visit summary misses medication changes remains open in the care coordination evidence; it was not discussed here. related synthesized into: ambient-scribe-post-ga-refinements.md participants participants — interview — infusion nurse on medication changes in scribe-drafted notes count: 1 roles: p143 — registered nurse (infusion clinic) (nurse) researcher: priya patel recruitment note: recruited via ambulatory infusion clinic nursing contacts. this participant is new to the research and did not take part in any earlier session. they are not p138, the primary care clinic nurse from march 2026, and not a care coordinator. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-09-17-interview-utilization-review-nurse-citation-checking", "kind": "raw", "title": "Interview — Utilization Review Nurse on Checking Citations", "date": "2026-09-17", "type": "interview", "status": "raw", "tags": ["nursing", "prior-auth", "utilization-management", "trust-in-ai", "project-prior-auth"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-09-17-interview-utilization-review-nurse-citation-checking/session-notes.md", "corrections": [], "html": "<h1>Interview — Utilization Review Nurse on Checking Citations</h1>\n<h2>Objective</h2>\n<p><code>prior-authorization.md</code> says nurses want inline citations to the chart text behind each part of the draft, and that in v2 the citations were used rather than ignored, with 3 of 4 participants clicking into at least one citation before accepting (<code>findings/prior-authorization.md</code>:30-34). Both claims come from the April 2025 v1 and November 2025 v2 tests, whose participants asked for the citations or tested them. This session asked a utilization review nurse who joined the department after both tests, and has only ever used the panel in the pilot, whether they want the citations and how they check them, and how they handle the cases the panel doesn&#x27;t take, including claim denials and calls with the health plan.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> A limited pilot of the prior-auth drafting panel has run in the utilization review department since early 2026, on straightforward cases only; complex cases stay manual. The pilot is not generally available and has not reached other departments. The panel shows inline citations to the chart entries behind each part of the draft. The participant joined the department after the November 2025 v2 test and did not take part in any earlier session, so nothing here speaks to v1 or v2. They use the panel on their own straightforward cases. They are not P19, the utilization review nurse from v1 and June 2026, and not P17, the utilization review supervisor from v1 and v2. No pilot outcomes data was reviewed in this session, and the written straightforward-case definition was not reviewed either.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(citations as the way to read a draft)</em> They want the citations, and don&#x27;t think of them as an added feature: they have never used a draft without them, and opening them is how they read a draft at all. On each case they open the citation behind every criterion the request has to meet and read the chart entry it points to. What they check is whether that entry says what the draft says it says, not only that it exists; their example was a cited note that supports a symptom the draft describes as ongoing, when the note is months old. On their informal impression, most drafts need no change after checking and some need a sentence reworded; they kept no count. This confirms <code>prior-authorization.md</code>:30-34 for a nurse who wasn&#x27;t in v1 or v2: the citations are wanted and used in pilot work, not only in testing. It also complicates the v2 measure: &quot;clicked into at least one citation&quot; records that a citation was opened, not what the nurse checked once it was.</li><li><strong>[MEDIUM]</strong> <em>(manual cases, claim denials and calls)</em> Cases outside the pilot&#x27;s straightforward scope they do by hand from the start. For a request that follows a claim denial, they begin from the denial letter&#x27;s stated reason and then gather the chart evidence that answers it; in their view a draft built from the chart would start in the wrong place, because the reason is in the letter, not the chart. Before a call with the health plan about a case, they prepare by hand too, keeping their own list of chart references to have open during the call. They described the calls as the hardest part of the week to plan for, but gave no time figure. For a straightforward case that the health plan later asks about, they said they find the evidence again from scratch; they didn&#x27;t know whether a submitted request keeps the panel&#x27;s citations.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I&#x27;ve never had a draft without them. The citations aren&#x27;t extra, they&#x27;re how I read the thing.&quot;</p><p>— Utilization Review Nurse, P144</p></blockquote>\n<blockquote><p>&quot;A denial comes with a reason, and the reason&#x27;s in the letter, not the chart. So I start from the letter and go find what answers it.&quot;</p><p>— Utilization Review Nurse, P144</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>When <code>prior-authorization.md</code> is next revised, note that the citation requirement holds for a nurse who joined during the pilot, and that what they check is whether the cited text supports the draft&#x27;s wording.</li><li>If citation use is measured in the pilot, record what nurses check in a citation, not only whether they open one.</li><li>Ask the pilot team whether a submitted request keeps its citations, so a nurse can reuse them if the health plan asks about the case later.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How the pilot is performing is not known: no outcomes data (time, accuracy, claim denials) is recorded in the corpus, none was reviewed here, and the participant had not seen any figures. The only time figures on record are v1&#x27;s estimate and v2&#x27;s measurement on 2 straightforward test cases.</li><li>Whether a submitted request keeps its citations is not known; the participant didn&#x27;t know.</li><li>How many drafts need changing after the citations are checked is not counted; &quot;most&quot; needing no change is one nurse&#x27;s impression.</li><li>Whether other pilot users check citations the same way is not known; this is one interview.</li><li>Whether drafting could help with requests that follow a claim denial is untested; the participant does them by hand, and nothing here supports bringing them into the pilot.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/prior-authorization.md\">prior-authorization.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Utilization Review Nurse on Checking Citations</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P144 — Utilization Review Nurse (nurse)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via utilization review department contacts. This participant is new to the research and did not take part in any earlier session: they joined the department after the April 2025 v1 and November 2025 v2 tests. They are not P19, the utilization review nurse from v1 and June 2026, and not P17, the utilization review supervisor from v1 and v2. They use the drafting panel in the department&#x27;s limited pilot. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — utilization review nurse on checking citations nursing prior-auth utilization-management trust-in-ai project-prior-auth prior-auth-drafting-panel interview — utilization review nurse on checking citations objective prior-authorization.md says nurses want inline citations to the chart text behind each part of the draft, and that in v2 the citations were used rather than ignored, with 3 of 4 participants clicking into at least one citation before accepting ( findings/prior-authorization.md :30-34). both claims come from the april 2025 v1 and november 2025 v2 tests, whose participants asked for the citations or tested them. this session asked a utilization review nurse who joined the department after both tests, and has only ever used the panel in the pilot, whether they want the citations and how they check them, and how they handle the cases the panel doesn&#x27;t take, including claim denials and calls with the health plan. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: a limited pilot of the prior-auth drafting panel has run in the utilization review department since early 2026, on straightforward cases only; complex cases stay manual. the pilot is not generally available and has not reached other departments. the panel shows inline citations to the chart entries behind each part of the draft. the participant joined the department after the november 2025 v2 test and did not take part in any earlier session, so nothing here speaks to v1 or v2. they use the panel on their own straightforward cases. they are not p19, the utilization review nurse from v1 and june 2026, and not p17, the utilization review supervisor from v1 and v2. no pilot outcomes data was reviewed in this session, and the written straightforward-case definition was not reviewed either. key findings [medium] (citations as the way to read a draft) they want the citations, and don&#x27;t think of them as an added feature: they have never used a draft without them, and opening them is how they read a draft at all. on each case they open the citation behind every criterion the request has to meet and read the chart entry it points to. what they check is whether that entry says what the draft says it says, not only that it exists; their example was a cited note that supports a symptom the draft describes as ongoing, when the note is months old. on their informal impression, most drafts need no change after checking and some need a sentence reworded; they kept no count. this confirms prior-authorization.md :30-34 for a nurse who wasn&#x27;t in v1 or v2: the citations are wanted and used in pilot work, not only in testing. it also complicates the v2 measure: &quot;clicked into at least one citation&quot; records that a citation was opened, not what the nurse checked once it was. [medium] (manual cases, claim denials and calls) cases outside the pilot&#x27;s straightforward scope they do by hand from the start. for a request that follows a claim denial, they begin from the denial letter&#x27;s stated reason and then gather the chart evidence that answers it; in their view a draft built from the chart would start in the wrong place, because the reason is in the letter, not the chart. before a call with the health plan about a case, they prepare by hand too, keeping their own list of chart references to have open during the call. they described the calls as the hardest part of the week to plan for, but gave no time figure. for a straightforward case that the health plan later asks about, they said they find the evidence again from scratch; they didn&#x27;t know whether a submitted request keeps the panel&#x27;s citations. representative quotes &quot;i&#x27;ve never had a draft without them. the citations aren&#x27;t extra, they&#x27;re how i read the thing.&quot; — utilization review nurse, p144 &quot;a denial comes with a reason, and the reason&#x27;s in the letter, not the chart. so i start from the letter and go find what answers it.&quot; — utilization review nurse, p144 recommendations when prior-authorization.md is next revised, note that the citation requirement holds for a nurse who joined during the pilot, and that what they check is whether the cited text supports the draft&#x27;s wording. if citation use is measured in the pilot, record what nurses check in a citation, not only whether they open one. ask the pilot team whether a submitted request keeps its citations, so a nurse can reuse them if the health plan asks about the case later. follow-ups / open questions how the pilot is performing is not known: no outcomes data (time, accuracy, claim denials) is recorded in the corpus, none was reviewed here, and the participant had not seen any figures. the only time figures on record are v1&#x27;s estimate and v2&#x27;s measurement on 2 straightforward test cases. whether a submitted request keeps its citations is not known; the participant didn&#x27;t know. how many drafts need changing after the citations are checked is not counted; &quot;most&quot; needing no change is one nurse&#x27;s impression. whether other pilot users check citations the same way is not known; this is one interview. whether drafting could help with requests that follow a claim denial is untested; the participant does them by hand, and nothing here supports bringing them into the pilot. related synthesized into: prior-authorization.md participants participants — interview — utilization review nurse on checking citations count: 1 roles: p144 — utilization review nurse (nurse) researcher: priya patel recruitment note: recruited via utilization review department contacts. this participant is new to the research and did not take part in any earlier session: they joined the department after the april 2025 v1 and november 2025 v2 tests. they are not p19, the utilization review nurse from v1 and june 2026, and not p17, the utilization review supervisor from v1 and v2. they use the drafting panel in the department&#x27;s limited pilot. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-09-22-interview-returning-internal-medicine-physician-edits-and-trust-over-time", "kind": "raw", "title": "Interview — Returning Internal Medicine Physician on Edits and Trust Over Time", "date": "2026-09-22", "type": "interview", "status": "raw", "tags": ["ambient-scribe", "trust-in-ai", "longitudinal", "documentation", "clinician-workflow", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-09-22-interview-returning-internal-medicine-physician-edits-and-trust-over-time/session-notes.md", "corrections": [], "html": "<h1>Interview — Returning Internal Medicine Physician on Edits and Trust Over Time</h1>\n<h2>Objective</h2>\n<p>The participant is P09, returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate. In the v0.1 test they said they had to read every word anyway (2025-02-25-usability-test-ambient-scribe-v01/session-notes.md:36-37). In the v0.2 test they said they still read every line, and that getting it right once didn&#x27;t mean they trusted it yet (2025-09-23-usability-test-ambient-scribe-v02/session-notes.md:36-37). At the GA release-candidate round they said it was the first time they had skimmed a section instead of reading every word, because it showed them where to look (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:36-37); that round recorded 4 of 6 participants saying the per-line underline let them skim high-confidence lines (same file, :30). This interview is in September 2026. The questions were what they edit in drafts now, what they read in full and what they skim, and what in their account has changed or stayed the same since January.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is an internal medicine physician in an ambulatory clinic. They have used the ambient scribe since the January 2026 GA. The scribe drafts the visit note only; they review the draft, correct single lines in place, and sign. Low-confidence transcription is shown with a subtle underline. Their earlier sessions were moderated usability tests; this is an interview about their own practice, nothing was shown or observed, and what they describe can&#x27;t be compared directly with what those tests recorded. The researcher did not share what other participants had said.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(order of events)</em> In their account, most of their edits now are not misheard words. The draft sometimes gets the order of events in the history wrong: which symptom came first, or how long ago something started. Those lines are usually not underlined, because each word was heard clearly. They put it at &quot;a few notes most weeks&quot;, an informal impression, not a count.</li><li><strong>[MEDIUM]</strong> <em>(what they skim)</em> They still skim history sections where nothing is underlined on routine follow-up visits, and read the assessment and plan in full on every draft. In January they said the underline let them skim a section for the first time (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:36); what they read in full that day is not recorded, so the two can&#x27;t be compared line by line.</li><li><strong>[MEDIUM]</strong> <em>(new problems)</em> After catching, during review in the spring, a draft whose history put two symptoms in the wrong order with nothing underlined, they began reading the whole history whenever a visit is about a new problem. That is their account of a change in their own practice since January, not an observed change.</li><li><strong>[MEDIUM]</strong> <em>(trust by section)</em> Asked whether they trust the scribe more than in January, they said it depends on the section: they rely on it to have heard the words, and they check that the history and the plan say what happened and what they decided. They did not describe their trust as having grown overall, and this interview does not measure trust.</li><li><strong>[LOW]</strong> <em>(edit count)</em> They put their edits at &quot;one or two on most notes&quot;, an informal estimate.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;It hears the words. What I check is whether the story&#x27;s in the right order.&quot;</p><p>— Physician, Internal Medicine, P09 (returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate)</p></blockquote>\n<blockquote><p>&quot;Do I trust it more than in January? For some sections. Not the plan, and not the history of a new problem.&quot;</p><p>— Physician, Internal Medicine, P09 (returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Share with the ambient scribe team that, in this physician&#x27;s account, the order of events in the history is where drafts go wrong without being underlined, because each word is heard clearly.</li><li>When drafts are evaluated, check the sequence of events in the history against the visit, not only word accuracy.</li><li>If the team wants to know whether review habits change over time, plan a measure for it; one returning participant&#x27;s account can&#x27;t show a trend.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often the order of events is wrong is not measured; &quot;a few notes most weeks&quot; is one physician&#x27;s impression.</li><li>Whether other clinicians read the history in full for new problems is not known; this is one interview.</li><li>Whether skimming has changed since January is not measured; the January round was a moderated test and this is an interview.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier sessions: <a href=\"../2025-02-25-usability-test-ambient-scribe-v01/session-notes.md\">2025-02-25 v0.1 usability test</a>, <a href=\"../2025-09-23-usability-test-ambient-scribe-v02/session-notes.md\">2025-09-23 v0.2 usability test</a>, <a href=\"../2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">2026-01-13 GA release candidate</a></li><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Returning Internal Medicine Physician on Edits and Trust Over Time</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P09 — Physician, Internal Medicine (physician), returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recontacted from the GA release-candidate usability test. The participant is P09, returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate, where they took part in January 2026; they also took part in the v0.1 and v0.2 usability tests (2025-02-25-usability-test-ambient-scribe-v01, 2025-09-23-usability-test-ambient-scribe-v02). This interview is in September 2026. No real patient or staff identities are represented; the participant ID is a fictional label from the globa t the history of a new problem.&quot; — physician, internal medicine, p09 (returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate) recommendations share with the ambient scribe team that, in this physician&#x27;s account, the order of events in the history is where drafts go wrong without being underlined, because each word is heard clearly. when drafts are evaluated, check the sequence of events in the history against the visit, not only word accuracy. if the team wants to know whether review habits change over time, plan a measure for it; one returning participant&#x27;s account can&#x27;t show a trend. follow-ups / open questions how often the order of events is wrong is not measured; &quot;a few notes most weeks&quot; is one physician&#x27;s impression. whether other clinicians read the history in full for new problems is not known; this is one interview. whether skimming has changed since january is not measured; the january round was a moderated test and this is an interview. related earlier sessions: 2025-02-25 v0.1 usability test , 2025-09-23 v0.2 usability test , 2026-01-13 ga release candidate synthesized into: ambient-scribe.md participants participants — interview — returning internal medicine physician on edits and trust over time count: 1 roles: p09 — physician, internal medicine (physician), returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate researcher: priya patel recruitment note: recontacted from the ga release-candidate usability test. the participant is p09, returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate, where they took part in january 2026; they also took part in the v0.1 and v0.2 usability tests (2025-02-25-usability-test-ambient-scribe-v01, 2025-09-23-usability-test-ambient-scribe-v02). this interview is in september 2026. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-09-29-interview-care-coordinator-referral-follow-up", "kind": "raw", "title": "Interview — Specialty Clinic Care Coordinator on Referral Follow-up", "date": "2026-09-29", "type": "interview", "status": "raw", "tags": ["care-coordination", "chart-review", "scheduling", "legacy", "alert-fatigue", "project-care-coordination"], "related_components": ["chart-review-summary-panel", "alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-09-29-interview-care-coordinator-referral-follow-up/session-notes.md", "corrections": [], "html": "<h1>Interview — Specialty Clinic Care Coordinator on Referral Follow-up</h1>\n<h2>Objective</h2>\n<p>Understand how a care coordinator on a specialty clinic team follows up referrals, where the time goes, and what a &#x27;what changed&#x27; view would need to cover for them, following up the January 2025 baseline&#x27;s recommendation to scope early AI work around &#x27;what changed since last review&#x27;.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a care coordinator on a specialty clinic team whose main work is following up referrals. They read the signed visit notes clinicians produce, including scribe-drafted ones, but don&#x27;t use the scribe themselves. Alerts still arrive in the chronological queue; the AI-ranked queue hasn&#x27;t been built. The chart-review summary panel is still a concept and wasn&#x27;t shown in this session. They did not take part in any earlier session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(confirming referrals)</em> Their biggest time sink is confirming in the legacy scheduling tool whether a referred appointment actually happened. Overdue-referral alerts are often already resolved by the time they reach them, because the appointment took place but the alert wasn&#x27;t cleared, so they spend time checking alerts that need no action. This is their account; nothing was timed and no alert data was reviewed in this session.</li><li><strong>[MEDIUM]</strong> <em>(what changed)</em> A &#x27;what changed&#x27; view would need to cover appointments and results, not just medications. For referral follow-up, a new appointment or a returned result is usually the change that matters. This extends the January 2025 baseline&#x27;s &#x27;what changed since last review&#x27; idea, which grew out of medication changes.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Most of my day is going into the scheduling system to see if they actually went. Half the overdue alerts, they already did.&quot;</p><p>— Care Coordinator, P137</p></blockquote>\n<blockquote><p>&quot;Meds are only part of it. For me, what changed means did they get seen, and did the results come back.&quot;</p><p>— Care Coordinator, P137</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>When the chart-review summary concept is next tested, check whether it can show appointment status from the legacy scheduling tool, so referral follow-up doesn&#x27;t need a separate lookup.</li><li>Scope &#x27;what changed&#x27; to include appointments and results as well as medications, and test that scope with coordinators who do referral follow-up.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How many overdue-referral alerts are already resolved when a coordinator reaches them is not measured; this is one coordinator&#x27;s account.</li><li>How often after-visit summaries miss changes is still not measured beyond the January 2025 baseline&#x27;s account.</li><li>Real-world triage speed, with or without a ranked queue, has not been measured.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Specialty Clinic Care Coordinator on Referral Follow-up</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P137 — Care Coordinator (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions. The participant works on a specialty clinic team and mainly follows up referrals. They are new to the research and did not take part in any earlier session. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — specialty clinic care coordinator on referral follow-up care-coordination chart-review scheduling legacy alert-fatigue project-care-coordination chart-review-summary-panel alert-triage-queue interview — specialty clinic care coordinator on referral follow-up objective understand how a care coordinator on a specialty clinic team follows up referrals, where the time goes, and what a &#x27;what changed&#x27; view would need to cover for them, following up the january 2025 baseline&#x27;s recommendation to scope early ai work around &#x27;what changed since last review&#x27;. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a care coordinator on a specialty clinic team whose main work is following up referrals. they read the signed visit notes clinicians produce, including scribe-drafted ones, but don&#x27;t use the scribe themselves. alerts still arrive in the chronological queue; the ai-ranked queue hasn&#x27;t been built. the chart-review summary panel is still a concept and wasn&#x27;t shown in this session. they did not take part in any earlier session. key findings [high] (confirming referrals) their biggest time sink is confirming in the legacy scheduling tool whether a referred appointment actually happened. overdue-referral alerts are often already resolved by the time they reach them, because the appointment took place but the alert wasn&#x27;t cleared, so they spend time checking alerts that need no action. this is their account; nothing was timed and no alert data was reviewed in this session. [medium] (what changed) a &#x27;what changed&#x27; view would need to cover appointments and results, not just medications. for referral follow-up, a new appointment or a returned result is usually the change that matters. this extends the january 2025 baseline&#x27;s &#x27;what changed since last review&#x27; idea, which grew out of medication changes. representative quotes &quot;most of my day is going into the scheduling system to see if they actually went. half the overdue alerts, they already did.&quot; — care coordinator, p137 &quot;meds are only part of it. for me, what changed means did they get seen, and did the results come back.&quot; — care coordinator, p137 recommendations when the chart-review summary concept is next tested, check whether it can show appointment status from the legacy scheduling tool, so referral follow-up doesn&#x27;t need a separate lookup. scope &#x27;what changed&#x27; to include appointments and results as well as medications, and test that scope with coordinators who do referral follow-up. follow-ups / open questions how many overdue-referral alerts are already resolved when a coordinator reaches them is not measured; this is one coordinator&#x27;s account. how often after-visit summaries miss changes is still not measured beyond the january 2025 baseline&#x27;s account. real-world triage speed, with or without a ranked queue, has not been measured. related synthesized into: care-coordination-triage.md participants participants — interview — specialty clinic care coordinator on referral follow-up count: 1 roles: p137 — care coordinator (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions. the participant works on a specialty clinic team and mainly follows up referrals. they are new to the research and did not take part in any earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-10-06-interview-senior-medical-coder-ai-suggestions-concept", "kind": "raw", "title": "Interview — Senior Medical Coder on AI Coding Suggestions", "date": "2026-10-06", "type": "interview", "status": "raw", "tags": ["him", "coding", "trust-in-ai", "audit-trail", "ai-generated-content", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-10-06-interview-senior-medical-coder-ai-suggestions-concept/session-notes.md", "corrections": [], "html": "<h1>Interview — Senior Medical Coder on AI Coding Suggestions</h1>\n<h2>Objective</h2>\n<p>Get a senior coder&#x27;s first reaction to the AI coding-suggestion concept (July 2025 prototype, not built or piloted), seen with fresh eyes, now that coders have been coding from scribe-drafted notes for most of 2026. The question was what would have to be true before a senior coder would use it at all. The participant is a different person from P71, the senior coder in the July 2025 usability test, and from P120 (March 2026 interview). They did not take part in the July 2025 session or any earlier session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; 42 CFR Part 2 handling is still manual. The participant is a senior coder who handles complex inpatient and outpatient encounters, answers other coders&#x27; questions and has supported responses to external audits. They have coded from scribe-drafted notes since GA. They had not seen the July 2025 screens before; they reacted to a walkthrough of them during this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(audit posture)</em> Before anything else, they wanted it to be clear that the coder makes every coding decision and the tool only suggests. They would want a visible, per-code record of what was suggested and what the coder did with it (accepted, edited or overridden), which they could see themselves while coding, not only something auditors could pull later. They called this the precondition for using the tool at all, not a feature to add later. It matches what the July 2025 senior coder and the April 2026 coding auditor asked for, reached independently.</li><li><strong>[MEDIUM]</strong> <em>(citations)</em> A source citation for every suggested code was non-negotiable for them: the sentence or sentences in the note that support the code, including the specificity. A code without a citation is one they would not accept, however likely it looked. Because so much of the documentation is now scribe-drafted, they said the citation is also how they&#x27;d check that the note actually supports the code and that the suggester isn&#x27;t just echoing a sentence the physician didn&#x27;t catch at sign-off.</li><li><strong>[MEDIUM]</strong> <em>(speed)</em> Told about the July 2025 estimate of 2-3 minutes saved per simple chart, they said a saving like that matters only if checking a suggestion stays quicker than coding the chart themselves. If they have to open every citation, compare it with the note and then record why they changed a code, they expect the saving to &quot;mostly disappear&quot; on anything but the simplest visits. They saw this as an informal guess, not something they&#x27;d measured.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The tool can suggest whatever it wants. I&#x27;m the one who codes. If the screen doesn&#x27;t show that, code by code, I&#x27;m not touching it.&quot;</p><p>— Medical Coder (senior), P129</p></blockquote>\n<blockquote><p>&quot;No citation, no code. I don&#x27;t care how confident it looks. Show me where in the note it&#x27;s coming from, because half the time now nobody typed that note.&quot;</p><p>— Medical Coder (senior), P129</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Keep the per-code suggested / accepted / edited / overridden record as a release-blocking requirement, and make it visible to the coder in the coding view as well as to auditors and supervisors.</li><li>Require a source-text citation, down to the specificity level, for every suggested code. Don&#x27;t show a suggestion that has no citation. This is consistent with the transparency pattern from prior-auth research.</li><li>In any pilot, measure the time to review a suggestion, citation check included, not only the end-to-end time per chart, so the 2-3 minute estimate is checked against how coders actually review.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How long does a citation check take in practice? This could be timed in a future test of the concept screens.</li><li>Would senior coders accept a lighter review path for simple charts if sampling caught problems, or is per-code review a hard line?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/prior-authorization.md\">prior-authorization.md</a></li></ul><h2>Participants</h2><h1>Participants — In
