into: scope-boundaries-and-workflow-fit.md participants participants — interview — returning ed intake nurse on interruptions and downtime count: 1 roles: p21 — ed intake nurse (nurse), returning from 2025-04-22-contextual-inquiry-ed-intake-shadowing researcher: priya patel recruitment note: recontacted from the april 2025 ed intake shadowing. the participant is p21, returning from 2025-04-22-contextual-inquiry-ed-intake-shadowing, where they were shadowed in april 2025; this interview is in april 2026. they still work ed intake. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-04-16-interview-care-coordinator-transitions-medication-changes", "kind": "raw", "title": "Interview — Transitions-of-Care Coordinator on Medication Changes after Discharge", "date": "2026-04-16", "type": "interview", "status": "raw", "tags": ["care-coordination", "medication-safety", "chart-review", "alert-triage", "workflow", "project-care-coordination"], "related_components": ["alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-04-16-interview-care-coordinator-transitions-medication-changes/session-notes.md", "corrections": [], "html": "<h1>Interview — Transitions-of-Care Coordinator on Medication Changes after Discharge</h1>\n<h2>Objective</h2>\n<p>Understand how a transitions-of-care coordinator, who follows patients from an inpatient discharge to home, handles medication changes on post-discharge calls, given the January 2025 baseline&#x27;s finding that coordinators distrust the EHR&#x27;s after-visit summaries for missing changed medications. A second question was how discharge alerts fit the alert queue, given the August 2025 finding that the AI ranking weighted recency more heavily than coordinators&#x27; sense of clinical risk.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant makes follow-up calls to patients after an inpatient discharge. Discharge alerts reach them through the same chronological queue other coordinators use; the AI-ranked queue tested in August 2025 hasn&#x27;t been built. They did not take part in any earlier session. They read the discharge note and the clinicians&#x27; signed notes, some of them scribe-drafted since GA, but don&#x27;t use the scribe.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(medication changes)</em> On post-discharge calls, the discharge paperwork the patient has and the current medication list sometimes disagree. When they do, the coordinator reads the discharge note itself and calls the clinic to confirm before going through medications with the patient. They recalled the after-visit summary leaving out a medication change &quot;a few times this year&quot;, but they kept no log, couldn&#x27;t say how many and couldn&#x27;t say how many summaries were correct. This is a recollection, not a rate, and it doesn&#x27;t answer the baseline&#x27;s question of how often the AVS misses medication changes.</li><li><strong>[MEDIUM]</strong> <em>(alert timing)</em> For discharge alerts, they said time since discharge <em>is</em> the clinical risk: the first days at home are when a missed medication change or a missed follow-up matters most, so a recent discharge should rise to the top. This refines rather than contradicts the August 2025 finding that the model weighted recency more heavily than coordinators&#x27; sense of clinical risk: for this alert type, recency and risk point the same way, so the right ranking signal depends on the alert type.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;If the paperwork and the med list don&#x27;t match, I don&#x27;t pick one. I read the discharge note and I call the clinic, and then I call the patient.&quot;</p><p>— Care Coordinator (transitions of care), P131</p></blockquote>\n<blockquote><p>&quot;For a discharge, newer is worse. The first few days home are when things go wrong.&quot;</p><p>— Care Coordinator (transitions of care), P131</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Don&#x27;t treat recency as a single global weight in any ranking model: test whether coordinators&#x27; risk judgement differs by alert type, with discharge alerts as one case where recency and risk line up.</li><li>Keep the medication reconciliation step human on post-discharge calls; nothing here supports summarising medication changes for coordinators without the discharge note alongside.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often the AVS misses medication changes is still not known. This interview adds a recollection, not a rate; closing it needs incident or complaint logs, or a chart audit comparing summaries with reconciled medication lists.</li><li>Which other alert types, if any, behave like discharge alerts? Not covered in this session.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Transitions-of-Care Coordinator on Medication Changes after Discharge</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P131 — Care Coordinator (transitions of care) (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). This participant is new to the research and did not take part in either earlier session. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — transitions-of-care coordinator on medication changes after discharge care-coordination medication-safety chart-review alert-triage workflow project-care-coordination alert-triage-queue interview — transitions-of-care coordinator on medication changes after discharge objective understand how a transitions-of-care coordinator, who follows patients from an inpatient discharge to home, handles medication changes on post-discharge calls, given the january 2025 baseline&#x27;s finding that coordinators distrust the ehr&#x27;s after-visit summaries for missing changed medications. a second question was how discharge alerts fit the alert queue, given the august 2025 finding that the ai ranking weighted recency more heavily than coordinators&#x27; sense of clinical risk. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant makes follow-up calls to patients after an inpatient discharge. discharge alerts reach them through the same chronological queue other coordinators use; the ai-ranked queue tested in august 2025 hasn&#x27;t been built. they did not take part in any earlier session. they read the discharge note and the clinicians&#x27; signed notes, some of them scribe-drafted since ga, but don&#x27;t use the scribe. key findings [high] (medication changes) on post-discharge calls, the discharge paperwork the patient has and the current medication list sometimes disagree. when they do, the coordinator reads the discharge note itself and calls the clinic to confirm before going through medications with the patient. they recalled the after-visit summary leaving out a medication change &quot;a few times this year&quot;, but they kept no log, couldn&#x27;t say how many and couldn&#x27;t say how many summaries were correct. this is a recollection, not a rate, and it doesn&#x27;t answer the baseline&#x27;s question of how often the avs misses medication changes. [medium] (alert timing) for discharge alerts, they said time since discharge is the clinical risk: the first days at home are when a missed medication change or a missed follow-up matters most, so a recent discharge should rise to the top. this refines rather than contradicts the august 2025 finding that the model weighted recency more heavily than coordinators&#x27; sense of clinical risk: for this alert type, recency and risk point the same way, so the right ranking signal depends on the alert type. representative quotes &quot;if the paperwork and the med list don&#x27;t match, i don&#x27;t pick one. i read the discharge note and i call the clinic, and then i call the patient.&quot; — care coordinator (transitions of care), p131 &quot;for a discharge, newer is worse. the first few days home are when things go wrong.&quot; — care coordinator (transitions of care), p131 recommendations don&#x27;t treat recency as a single global weight in any ranking model: test whether coordinators&#x27; risk judgement differs by alert type, with discharge alerts as one case where recency and risk line up. keep the medication reconciliation step human on post-discharge calls; nothing here supports summarising medication changes for coordinators without the discharge note alongside. follow-ups / open questions how often the avs misses medication changes is still not known. this interview adds a recollection, not a rate; closing it needs incident or complaint logs, or a chart audit comparing summaries with reconciled medication lists. which other alert types, if any, behave like discharge alerts? not covered in this session. related synthesized into: care-coordination-triage.md participants participants — interview — transitions-of-care coordinator on medication changes after discharge count: 1 roles: p131 — care coordinator (transitions of care) (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). this participant is new to the research and did not take part in either earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-04-21-interview-coding-auditor-override-audit-trail", "kind": "raw", "title": "Interview — Coding Auditor on Override Tracking and Audit Trail", "date": "2026-04-21", "type": "interview", "status": "raw", "tags": ["him", "coding", "audit-trail", "compliance", "governance", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-04-21-interview-coding-auditor-override-audit-trail/session-notes.md", "corrections": [], "html": "<h1>Interview — Coding Auditor on Override Tracking and Audit Trail</h1>\n<h2>Objective</h2>\n<p>Follow up on the July 2025 recommendation to bring Compliance into the audit-log design for the AI coding-suggestion concept: understand what an internal coding auditor would need in order to audit, and defend, codes produced with AI assistance. The concept has not been built or piloted; the participant responded to the July 2025 screens and the accept/override tracking described there.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> Participant does internal retrospective coding audits (sample-based review of coded encounters) and supports responses to external audits and claim denials.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[CRITICAL]</strong> <em>(audit trail)</em> The auditor said they could not defend a code in an external audit, or on a claim denial appeal, without a per-code record of what the tool suggested, what the coder accepted, what the coder overrode and what they changed it to, and who did it and when. A flag saying &quot;AI assistance was used&quot; on the encounter isn&#x27;t enough. Without the per-code record they would recommend Compliance not sign off on the tool going live.</li><li><strong>[HIGH]</strong> <em>(governance)</em> Wants generation metadata (the suggestion, the source text it cited, the model version and, for the note itself, which parts were scribe-drafted) visible to coding auditors, not internal-only in the sense of &quot;only IT can pull it&quot;. They had no objection to keeping it off the permanent chart, in line with the CMIO&#x27;s attestation model, but said &quot;internal&quot; has to include the people who audit the codes.</li><li><strong>[MEDIUM]</strong> <em>(sampling)</em> For at least the first year they would audit AI-accepted codes at a higher rate than codes the coder entered themselves, as an informal starting point &quot;maybe double the usual sample&quot;. They would focus on suggestions accepted without any edit and on unspecified codes. They would also compare acceptance and override rates across coders: someone who accepts nearly everything would be a reason to look closer, not a sign of efficiency.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;When I pull a chart the question is always the same: who picked this code, and why. If the answer is &#x27;the system suggested it and somebody clicked accept,&#x27; I can&#x27;t stand behind that in front of anyone.&quot;</p><p>— Coding Auditor, P122</p></blockquote>\n<blockquote><p>&quot;I don&#x27;t need it on the chart. I need it somewhere I can actually see it. &#x27;Internal&#x27; can&#x27;t mean only IT can get to it.&quot;</p><p>— Coding Auditor, P122</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Make the per-code suggested / accepted / overridden record (with user and timestamp) a release-blocking requirement for the coding-suggestion concept, and spec it jointly with Compliance and coding audit.</li><li>Add the question of who can access the internal audit log to the still-pending Legal/Compliance ratification of the CMIO&#x27;s attestation model. The model says where the metadata lives, not who can read it.</li><li>Design the audit log so it can be filtered by acceptance status (accepted as suggested, edited, overridden) to support targeted sampling.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Who owns access to the internal audit log the CMIO&#x27;s model describes, and does it already exist for scribe-drafted notes?</li><li>Confirm with Compliance whether a higher audit rate for AI-accepted codes would need to be written into coding audit policy.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Coding Auditor on Override Tracking and Audit Trail</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P122 — Coding Auditor (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2025-07-29). No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — coding auditor on override tracking and audit trail him coding audit-trail compliance governance project-him coding-suggestion-panel interview — coding auditor on override tracking and audit trail objective follow up on the july 2025 recommendation to bring compliance into the audit-log design for the ai coding-suggestion concept: understand what an internal coding auditor would need in order to audit, and defend, codes produced with ai assistance. the concept has not been built or piloted; the participant responded to the july 2025 screens and the accept/override tracking described there. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: participant does internal retrospective coding audits (sample-based review of coded encounters) and supports responses to external audits and claim denials. key findings [critical] (audit trail) the auditor said they could not defend a code in an external audit, or on a claim denial appeal, without a per-code record of what the tool suggested, what the coder accepted, what the coder overrode and what they changed it to, and who did it and when. a flag saying &quot;ai assistance was used&quot; on the encounter isn&#x27;t enough. without the per-code record they would recommend compliance not sign off on the tool going live. [high] (governance) wants generation metadata (the suggestion, the source text it cited, the model version and, for the note itself, which parts were scribe-drafted) visible to coding auditors, not internal-only in the sense of &quot;only it can pull it&quot;. they had no objection to keeping it off the permanent chart, in line with the cmio&#x27;s attestation model, but said &quot;internal&quot; has to include the people who audit the codes. [medium] (sampling) for at least the first year they would audit ai-accepted codes at a higher rate than codes the coder entered themselves, as an informal starting point &quot;maybe double the usual sample&quot;. they would focus on suggestions accepted without any edit and on unspecified codes. they would also compare acceptance and override rates across coders: someone who accepts nearly everything would be a reason to look closer, not a sign of efficiency. representative quotes &quot;when i pull a chart the question is always the same: who picked this code, and why. if the answer is &#x27;the system suggested it and somebody clicked accept,&#x27; i can&#x27;t stand behind that in front of anyone.&quot; — coding auditor, p122 &quot;i don&#x27;t need it on the chart. i need it somewhere i can actually see it. &#x27;internal&#x27; can&#x27;t mean only it can get to it.&quot; — coding auditor, p122 recommendations make the per-code suggested / accepted / overridden record (with user and timestamp) a release-blocking requirement for the coding-suggestion concept, and spec it jointly with compliance and coding audit. add the question of who can access the internal audit log to the still-pending legal/compliance ratification of the cmio&#x27;s attestation model. the model says where the metadata lives, not who can read it. design the audit log so it can be filtered by acceptance status (accepted as suggested, edited, overridden) to support targeted sampling. follow-ups / open questions who owns access to the internal audit log the cmio&#x27;s model describes, and does it already exist for scribe-drafted notes? confirm with compliance whether a higher audit rate for ai-accepted codes would need to be written into coding audit policy. related synthesized into: him-coding-and-billing.md , governance-and-phi.md participants participants — interview — coding auditor on override tracking and audit trail count: 1 roles: p122 — coding auditor (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2025-07-29). no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-04-28-interview-nurse-practitioner-session-lock-shared-workstations", "kind": "raw", "title": "Interview — Nurse Practitioner on Session Lock and Shared Exam-Room Workstations", "date": "2026-04-28", "type": "interview", "status": "raw", "tags": ["ambient-scribe", "sso", "authentication", "clinician-workflow", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-04-28-interview-nurse-practitioner-session-lock-shared-workstations/session-notes.md", "corrections": [], "html": "<h1>Interview — Nurse Practitioner on Session Lock and Shared Exam-Room Workstations</h1>\n<h2>Objective</h2>\n<p>The 2026-02-17 contextual inquiry found that a session lock during active dictation freezes the ambient-scribe widget with no message, and that all 4 shadowed clinicians assumed the draft was lost and started dictating again, although the draft survives server-side (2026-02-17-session-lock-during-dictation/session-notes.md:38-41, read with correction-2026-09-27.md in that folder). A recovery flow with an explicit paused, draft-preserved state is designed but has not shipped. That session did not look at exam-room workstations shared by several clinicians. This session asked a primary care nurse practitioner, two months later, what a lock looks like in their visits and how a shared workstation affects it.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a nurse practitioner in an ambulatory primary care clinic, about five years in that role. They use the ambient scribe for most visits. Exam rooms in their clinic have a workstation that clinicians share across the day, signing in with a badge tap. The idle timeout is 10 minutes and is not adjustable per feature (2026-02-17-session-lock-during-dictation/session-notes.md:49-50). The paused state has not shipped, so a lock still freezes the widget with no message. They did not take part in any earlier session, including the 2026-02-17 inquiry. This is an interview about their own practice; nothing was shown or observed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(lock during a visit)</em> A lock happens to them when they step away from the workstation to the exam table within the room, typically for the physical exam, and the idle timeout fires while the scribe is listening. When they come back the widget looks frozen and shows no message. Their practice is to re-authenticate and scroll through the draft to see what is still there before they say anything more. They described learning this after re-dictating a visit summary early on and then finding the original draft intact; that is their account of their own practice, not an observed change. They put locks at &quot;most afternoons, at least once&quot;, an informal impression.</li><li><strong>[HIGH]</strong> <em>(shared workstations)</em> Two or more clinicians use the same exam-room workstation on a clinic day, each signing in with a badge tap. They do not know what happens to their in-progress draft if a colleague signs in on that workstation while their session is locked, and they did not want to find out with a patient&#x27;s visit. So they stop the scribe before leaving a room, even mid-visit, and start it again when they return. That avoids the question but splits one visit across several recordings, which they then have to read as one draft. How the product behaves in that case is not recorded in the corpus and was not settled here.</li><li><strong>[MEDIUM]</strong> <em>(framing)</em> They described the lock as one more sign-in in a day full of them, not as a safety behavior. That matches the framing the 2026-02-17 inquiry recorded (&quot;one more annoying re-login&quot;, 2026-02-17-session-lock-during-dictation/session-notes.md:45-48); it is this participant&#x27;s own description, and the earlier finding was not put to them.</li><li><strong>[MEDIUM]</strong> <em>(what would help)</em> Asked what they would want to see after a lock, without being shown anything, they said a message that the draft is saved and whose session it belongs to. That is an expectation; the paused state has not shipped and was not shown.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I come back from the exam table and it&#x27;s just sitting there. No message. I badge back in and scroll through before I say another word.&quot;</p><p>— Nurse Practitioner (primary care), P148</p></blockquote>\n<blockquote><p>&quot;Two of us use that room. I don&#x27;t know what happens to my recording if someone else taps in, so I stop it before I walk out.&quot;</p><p>— Nurse Practitioner (primary care), P148</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Add the shared exam-room workstation to the review of the paused-state recovery flow: what a clinician sees after a lock when a colleague has signed in on the same workstation.</li><li>Make sure the paused-state message says whose draft is preserved, not only that a draft is.</li><li>When the paused state ships, re-test whether clinicians still stop the scribe before leaving a shared room, as well as whether they still re-dictate.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>What happens to an in-progress draft when another clinician signs in on the same workstation during a lock is not recorded in the corpus and was not settled here.</li><li>How often locks interrupt a visit is not measured; &quot;most afternoons, at least once&quot; is one nurse practitioner&#x27;s impression.</li><li>Whether other clinicians stop the scribe before leaving a shared room is not known; this is one interview.</li><li>Whether the paused state changes behavior can only be tested once it ships, as the 2026-02-17 inquiry already noted.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier sessions: <a href=\"../2026-02-17-session-lock-during-dictation/session-notes.md\">2026-02-17 session lock contextual inquiry</a> and its <a href=\"../2026-02-17-session-lock-during-dictation/correction-2026-09-27.md\">correction</a></li><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a>, <a href=\"../../../design-tokens/components/encounter-view.md\">encounter-view component Notes</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Nurse Practitioner on Session Lock and Shared Exam-Room Workstations</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P148 — Nurse Practitioner (primary care) (app)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via primary care clinic contacts, from clinicians who use the ambient scribe in shared exam rooms. This participant is new to the research and did not take part in any earlier session, including the 2026-02-17 session-lock contextual inquiry. They are not P24, P29, P33, P91 or P118, the nurse practitioners quoted in earlier sessions. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — nurse practitioner on session lock and shared exam-room workstations ambient-scribe sso authentication clinician-workflow project-ambient-scribe ambient-scribe-widget encounter-view interview — nurse practitioner on session lock and shared exam-room workstations objective the 2026-02-17 contextual inquiry found that a session lock during active dictation freezes the ambient-scribe widget with no message, and that all 4 shadowed clinicians assumed the draft was lost and started dictating again, although the draft survives server-side (2026-02-17-session-lock-during-dictation/session-notes.md:38-41, read with correction-2026-09-27.md in that folder). a recovery flow with an explicit paused, draft-preserved state is designed but has not shipped. that session did not look at exam-room workstations shared by several clinicians. this session asked a primary care nurse practitioner, two months later, what a lock looks like in their visits and how a shared workstation affects it. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a nurse practitioner in an ambulatory primary care clinic, about five years in that role. they use the ambient scribe for most visits. exam rooms in their clinic have a workstation that clinicians share across the day, signing in with a badge tap. the idle timeout is 10 minutes and is not adjustable per feature (2026-02-17-session-lock-during-dictation/session-notes.md:49-50). the paused state has not shipped, so a lock still freezes the widget with no message. they did not take part in any earlier session, including the 2026-02-17 inquiry. this is an interview about their own practice; nothing was shown or observed. key findings [high] (lock during a visit) a lock happens to them when they step away from the workstation to the exam table within the room, typically for the physical exam, and the idle timeout fires while the scribe is listening. when they come back the widget looks frozen and shows no message. their practice is to re-authenticate and scroll through the draft to see what is still there before they say anything more. they described learning this after re-dictating a visit summary early on and then finding the original draft intact; that is their account of their own practice, not an observed change. they put locks at &quot;most afternoons, at least once&quot;, an informal impression. [high] (shared workstations) two or more clinicians use the same exam-room workstation on a clinic day, each signing in with a badge tap. they do not know what happens to their in-progress draft if a colleague signs in on that workstation while their session is locked, and they did not want to find out with a patient&#x27;s visit. so they stop the scribe before leaving a room, even mid-visit, and start it again when they return. that avoids the question but splits one visit across several recordings, which they then have to read as one draft. how the product behaves in that case is not recorded in the corpus and was not settled here. [medium] (framing) they described the lock as one more sign-in in a day full of them, not as a safety behavior. that matches the framing the 2026-02-17 inquiry recorded (&quot;one more annoying re-login&quot;, 2026-02-17-session-lock-during-dictation/session-notes.md:45-48); it is this participant&#x27;s own description, and the earlier finding was not put to them. [medium] (what would help) asked what they would want to see after a lock, without being shown anything, they said a message that the draft is saved and whose session it belongs to. that is an expectation; the paused state has not shipped and was not shown. representative quotes &quot;i come back from the exam table and it&#x27;s just sitting there. no message. i badge back in and scroll through before i say another word.&quot; — nurse practitioner (primary care), p148 &quot;two of us use that room. i don&#x27;t know what happens to my recording if someone else taps in, so i stop it before i walk out.&quot; — nurse practitioner (primary care), p148 recommendations add the shared exam-room workstation to the review of the paused-state recovery flow: what a clinician sees after a lock when a colleague has signed in on the same workstation. make sure the paused-state message says whose draft is preserved, not only that a draft is. when the paused state ships, re-test whether clinicians still stop the scribe before leaving a shared room, as well as whether they still re-dictate. follow-ups / open questions what happens to an in-progress draft when another clinician signs in on the same workstation during a lock is not recorded in the corpus and was not settled here. how often locks interrupt a visit is not measured; &quot;most afternoons, at least once&quot; is one nurse practitioner&#x27;s impression. whether other clinicians stop the scribe before leaving a shared room is not known; this is one interview. whether the paused state changes behavior can only be tested once it ships, as the 2026-02-17 inquiry already noted. related earlier sessions: 2026-02-17 session lock contextual inquiry and its correction synthesized into: ambient-scribe.md , encounter-view component notes participants participants — interview — nurse practitioner on session lock and shared exam-room workstations count: 1 roles: p148 — nurse practitioner (primary care) (app) researcher: priya patel recruitment note: recruited via primary care clinic contacts, from clinicians who use the ambient scribe in shared exam rooms. this participant is new to the research and did not take part in any earlier session, including the 2026-02-17 session-lock contextual inquiry. they are not p24, p29, p33, p91 or p118, the nurse practitioners quoted in earlier sessions. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-05-05-interview-care-coordinator-supervisor-queue-oversight", "kind": "raw", "title": "Interview — Care Coordinator Supervisor on Queue Oversight", "date": "2026-05-05", "type": "interview", "status": "raw", "tags": ["care-coordination", "alert-triage", "alert-fatigue", "trust-in-ai", "audit-trail", "project-care-coordination"], "related_components": ["alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-05-05-interview-care-coordinator-supervisor-queue-oversight/session-notes.md", "corrections": [], "html": "<h1>Interview — Care Coordinator Supervisor on Queue Oversight</h1>\n<h2>Objective</h2>\n<p>Get a care coordinator supervisor&#x27;s view of what oversight they would need if alerts were AI-ranked, following up the August 2025 supervisor&#x27;s concern that speed gains could mask rubber-stamping, and the override-reason capture designed after that test. The participant is a different person from P79, the supervisor in the August 2025 test.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant leads an ambulatory care coordination team. Their team works the chronological queue; the AI-ranked queue hasn&#x27;t been built, and the override-reason capture wireflow is designed and in review, not built. They had not seen the August 2025 screens before; they reacted to a description of the ranked queue and the override-reason flow in this session. They did not take part in any earlier session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(oversight)</em> If alerts were AI-ranked, they would want a record of the order each coordinator was shown and what the coordinator did with each alert, so they could look back at a case when something went wrong. They would also use override reasons for coaching, to see how a coordinator is judging risk, not only for model tuning. That raises a question the current design doesn&#x27;t settle: the wireflow logs reasons for model-tuning review and says they are &quot;not surfaced to other coordinators&quot;, but doesn&#x27;t say whether supervisors see them.</li><li><strong>[MEDIUM]</strong> <em>(alert volume)</em> They estimated that heavy days run &quot;maybe 30 to 60 alerts&quot; per coordinator, and that many of them are administrative rather than clinical. This is their informal estimate; no queue data was reviewed in this session.</li><li><strong>[MEDIUM]</strong> <em>(rubber-stamping)</em> They shared the August 2025 supervisor&#x27;s worry that a ranked order could be followed without judgement, but said they&#x27;d only know if it was happening by looking at what coordinators did with the order. This is a perspective, not a measurement; nothing about how often coordinators follow a ranking has been measured.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;If something goes wrong, I need to see what order they were shown and what they did with it. Otherwise I&#x27;m coaching blind.&quot;</p><p>— Care Coordinator Supervisor, P132</p></blockquote>\n<blockquote><p>&quot;The reasons are the useful part for me. They tell me how someone&#x27;s thinking about risk.&quot;</p><p>— Care Coordinator Supervisor, P132</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Decide who can see override reasons (model-tuning review only, or supervisors as well) before the reason-capture wireflow leaves review, and say so in the design.</li><li>If a ranked queue is piloted, record the order shown and each coordinator&#x27;s action, so rubber-stamping can be looked for in data rather than assumed.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often coordinators would follow a ranked order without judgement is not measured, and can&#x27;t be until something is built and logged.</li><li>Real alert volumes per coordinator are not known; the 30 to 60 figure is one supervisor&#x27;s estimate.</li><li>Whether the override-capture idea was shared with the Data Science team working on the care-gap flagging model, as the August 2025 session suggested, isn&#x27;t recorded.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Care Coordinator Supervisor on Queue Oversight</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P132 — Care Coordinator Supervisor (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). This participant is new to the research: a different person from P79, the supervisor in the 2025-08-26 alert-triage test. They did not take part in any earlier session. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — care coordinator supervisor on queue oversight care-coordination alert-triage alert-fatigue trust-in-ai audit-trail project-care-coordination alert-triage-queue interview — care coordinator supervisor on queue oversight objective get a care coordinator supervisor&#x27;s view of what oversight they would need if alerts were ai-ranked, following up the august 2025 supervisor&#x27;s concern that speed gains could mask rubber-stamping, and the override-reason capture designed after that test. the participant is a different person from p79, the supervisor in the august 2025 test. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant leads an ambulatory care coordination team. their team works the chronological queue; the ai-ranked queue hasn&#x27;t been built, and the override-reason capture wireflow is designed and in review, not built. they had not seen the august 2025 screens before; they reacted to a description of the ranked queue and the override-reason flow in this session. they did not take part in any earlier session. key findings [high] (oversight) if alerts were ai-ranked, they would want a record of the order each coordinator was shown and what the coordinator did with each alert, so they could look back at a case  working on the care-gap flagging model, as the august 2025 session suggested, isn&#x27;t recorded. related synthesized into: care-coordination-triage.md participants participants — interview — care coordinator supervisor on queue oversight count: 1 roles: p132 — care coordinator supervisor (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions (2025-01-29, 2025-08-26). this participant is new to the research: a different person from p79, the supervisor in the 2025-08-26 alert-triage test. they did not take part in any earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-05-12-interview-cdi-specialist-documentation-gaps", "kind": "raw", "title": "Interview — CDI Specialist on Documentation Gaps in AI-Drafted Notes", "date": "2026-05-12", "type": "interview", "status": "raw", "tags": ["him", "coding", "documentation", "ai-generated-content", "workflow", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-05-12-interview-cdi-specialist-documentation-gaps/session-notes.md", "corrections": [], "html": "<h1>Interview — CDI Specialist on Documentation Gaps in AI-Drafted Notes</h1>\n<h2>Objective</h2>\n<p>Understand how scribe-drafted notes have changed clinical documentation integrity (CDI) review since the ambient scribe went GA in January 2026, and how a CDI specialist would want the AI coding-suggestion concept (July 2025 prototype, not built or piloted) to behave when the documentation behind a code is incomplete.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> Participant does concurrent and retrospective CDI review on inpatient and some outpatient encounters and writes physician queries. They work alongside the coding team but sit in a separate queue.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(documentation gaps)</em> Scribe-drafted notes are fluent and well organized, so they read as complete. What&#x27;s missing (acuity, severity, the clinical indicators that support a diagnosis, the link between conditions) is harder to spot than in a sparse typed note, where a gap was obvious at a glance. They said a scribe-drafted note now takes a more deliberate read, by their own informal count a few extra minutes per note, because they can no longer rely on a note &quot;looking thin&quot; to tell them where to look.</li><li><strong>[MEDIUM]</strong> <em>(queries)</em> Wants the coding-suggestion concept to suggest queries, not codes, when the documentation is incomplete. Their worry is that a suggested code on an under-specified note pushes the coder either to an unspecified code or toward a leading query. They&#x27;d want a draft query that states the clinical indicators found and asks the physician to clarify, in non-leading language Compliance has approved.</li><li><strong>[LOW]</strong> <em>(workflow)</em> There is no hand-off signal between CDI and coding. Coders can&#x27;t see that a CDI query is already open on an encounter, so an encounter sometimes gets coded before the answer comes back, or the physician gets a second, near-duplicate query from the coder. They described this as an annoyance that predates the scribe, not something GA caused.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The note sounds finished. That&#x27;s the problem. It reads like a really good note, and then you go looking for the acuity and it&#x27;s just not in there.&quot;</p><p>— Clinical Documentation Integrity Specialist, P123</p></blockquote>\n<blockquote><p>&quot;Don&#x27;t hand me a code. Hand me the question I should be asking the doctor.&quot;</p><p>— Clinical Documentation Integrity Specialist, P123</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>For under-specified documentation, have the coding-suggestion concept output a draft query routed to CDI instead of a code, with query wording reviewed by Compliance so it stays non-leading.</li><li>Share CDI&#x27;s list of the specificity elements most often missing from scribe-drafted notes with the ambient scribe team, alongside the coders&#x27; list.</li><li>Separately from any AI work, look at a simple &quot;query open&quot; indicator on the encounter that coders can see.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm with Compliance which query templates are already approved, and whether AI-drafted query text would need its own review.</li><li>Get CDI query counts for the months before and after GA.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — CDI Specialist on Documentation Gaps in AI-Drafted Notes</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P123 — Clinical Documentation Integrity Specialist (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2025-07-29). No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — cdi specialist on documentation gaps in ai-drafted notes him coding documentation ai-generated-content workflow project-him coding-suggestion-panel interview — cdi specialist on documentation ga . representative quotes &quot;the note sounds finished. that&#x27;s the problem. it reads like a really good note, and then you go looking for the acuity and it&#x27;s just not in there.&quot; — clinical documentation integrity specialist, p123 &quot;don&#x27;t hand me a code. hand me the question i should be asking the doctor.&quot; — clinical documentation integrity specialist, p123 recommendations for under-specified documentation, have the coding-suggestion concept output a draft query routed to cdi instead of a code, with query wording reviewed by compliance so it stays non-leading. share cdi&#x27;s list of the specificity elements most often missing from scribe-drafted notes with the ambient scribe team, alongside the coders&#x27; list. separately from any ai work, look at a simple &quot;query open&quot; indicator on the encounter that coders can see. follow-ups / open questions confirm with compliance which query templates are already approved, and whether ai-drafted query text would need its own review. get cdi query counts for the months before and after ga. related synthesized into: him-coding-and-billing.md participants participants — interview — cdi specialist on documentation gaps in ai-drafted notes count: 1 roles: p123 — clinical documentation integrity specialist (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2025-07-29). no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-05-19-interview-ed-charge-nurse-shift-oversight", "kind": "raw", "title": "Interview — ED Charge Nurse on Shift Oversight", "date": "2026-05-19", "type": "interview", "status": "raw", "tags": ["nursing", "ed", "high-acuity", "workflow", "documentation", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-05-19-interview-ed-charge-nurse-shift-oversight/session-notes.md", "corrections": [], "html": "<h1>Interview — ED Charge Nurse on Shift Oversight</h1>\n<h2>Objective</h2>\n<p>The ED intake boundary in <code>scope-boundaries-and-workflow-fit.md</code> rests on one intake nurse during peak hours (2025-04-22). This session asked a charge nurse, who oversees the whole department across a shift, whether that boundary describes the ED as a whole or only intake at peak, and where, if anywhere, they could see an AI assist fitting in their own work.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a senior ED nurse who works as charge nurse on evening shifts: bed assignments, staffing, flow, and the end-of-shift handoff to the next charge nurse. Nurse charting in the ED is manual; the ambient scribe drafts notes for physicians, NPs and PAs only. They did not take part in any earlier session. They are not P21, the ED intake nurse from the April 2025 shadowing, and not P97, the behavioral health unit charge nurse from October 2025.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(peak vs off-peak)</em> They split the shift into peak, when nothing that needs attention can be added, and the hours after it, when there is time to catch up. When the existing ED intake boundary was described to them, they agreed it holds at peak, and said it holds for charge work at peak too, but did not think it describes the whole shift. This refines the ED boundary: it covers intake during peak, not the ED at every hour.</li><li><strong>[MEDIUM]</strong> <em>(after the shift)</em> Where they could see an assist fitting is after peak: pulling together the end-of-shift handoff (who is boarding, who is waiting on a bed, what is still pending) from what is already in the chart, for them to check and correct. They put assembling it by hand at &quot;twenty minutes on a bad night&quot;; that is an informal estimate, not timed. This is an expectation of something that doesn&#x27;t exist; nothing was shown in this session.</li><li><strong>[LOW]</strong> <em>(documentation)</em> Catching up on their own charting after peak is routine for the ED nurses they supervise. They did not think AI drafting of nursing notes would help at peak, for the same reason as intake: nobody could review it then.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;At seven o&#x27;clock, no, nothing new, intake can&#x27;t take anything at that hour. At one in the morning I&#x27;ve got time to look at something.&quot;</p><p>— Charge Nurse (emergency department), P139</p></blockquote>\n<blockquote><p>&quot;If it could pull together who&#x27;s boarding and what&#x27;s still pending, and I fix what&#x27;s wrong, that&#x27;s my handoff. That I&#x27;d look at.&quot;</p><p>— Charge Nurse (emergency department), P139</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>State the ED boundary as peak-specific (intake, and charge work, during peak) rather than ED-wide, so it isn&#x27;t read as ruling out off-peak work.</li><li>If ED work is revisited, treat an end-of-shift handoff summary for the charge nurse as a candidate to explore, separately from intake.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How long assembling the charge handoff takes is not measured; &quot;twenty minutes on a bad night&quot; is one charge nurse&#x27;s estimate.</li><li>Whether day-shift charge nurses, or other EDs, split the shift the same way is not known; this is one interview.</li><li>What causes the system slowness the April 2025 session reported is still open; it was not discussed here.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — ED Charge Nurse on Shift Oversight</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P139 — Charge Nurse (emergency department) (nurse)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via emergency department nursing contacts, consistent with the April 2025 ED intake shadowing. This participant is new to the research. They are not P21, the ED intake nurse from that session, and not P97, the behavioral health unit charge nurse from October 2025. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — ed charge nurse on shift oversight nursing ed high-acuity workflow documentation project-cross-cutting interview — ed charge nurse on shift oversight objective the ed intake boundary in scope-boundaries-and-workflow-fit.md rests on one intake nurse during peak hours (2025-04-22). this session asked a charge nurse, who oversees the whole department across a shift, whether that boundary describes the ed as a whole or only intake at peak, and where, if anywhere, they could see an ai assist fitting in their own work. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a senior ed nurse who works as charge nurse on evening shifts: bed assignments, staffing, flow, and the end-of-shift handoff to the next charge nurse. nurse charting in the ed is manual; the ambient scribe drafts notes for physicians, nps and pas only. they did not take part in any earlier session. they are not p21, the ed intake nurse from the april 2025 shadowing, and not p97, the behavioral health unit charge nurse from october 2025. key findings [medium] (peak vs off-peak) they split the shift into peak, when nothing that needs attention can be added, and the hours after it, when there is time to catch up. when the existing ed intake boundary was described to them, they agreed it holds at peak, and said it holds for charge work at peak too, but did not think it describes the whole shift. this refines the ed boundary: it covers intake during peak, not the ed at every hour. [medium] (after the shift) where they could see an assist fitting is after peak: pulling together the end-of-shift handoff (who is boarding, who is waiting on a bed, what is still pending) from what is already in the chart, for them to check and correct. they put assembling it by hand at &quot;twenty minutes on a bad night&quot;; that is an informal estimate, not timed. this is an expectation of something that doesn&#x27;t exist; nothing was shown in this session. [low] (documentation) catching up on their own charting after peak is routine for the ed nurses they supervise. they did not think ai drafting of nursing notes would help at peak, for the same reason as intake: nobody could review it then. representative quotes &quot;at seven o&#x27;clock, no, nothing new, intake can&#x27;t take anything at that hour. at one in the morning i&#x27;ve got time to look at something.&quot; — charge nurse (emergency department), p139 &quot;if it could pull together who&#x27;s boarding and what&#x27;s still pending, and i fix what&#x27;s wrong, that&#x27;s my handoff. that i&#x27;d look at.&quot; — charge nurse (emergency department), p139 recommendations state the ed boundary as peak-specific (intake, and charge work, during peak) rather than ed-wide, so it isn&#x27;t read as ruling out off-peak work. if ed work is revisited, treat an end-of-shift handoff summary for the charge nurse as a candidate to explore, separately from intake. follow-ups / open questions how long assembling the charge handoff takes is not measured; &quot;twenty minutes on a bad night&quot; is one charge nurse&#x27;s estimate. whether day-shift charge nurses, or other eds, split the shift the same way is not known; this is one interview. what causes the system slowness the april 2025 session reported is still open; it was not discussed here. related synthesized into: scope-boundaries-and-workflow-fit.md participants participants — interview — ed charge nurse on shift oversight count: 1 roles: p139 — charge nurse (emergency department) (nurse) researcher: priya patel recruitment note: recruited via emergency department nursing contacts, consistent with the april 2025 ed intake shadowing. this participant is new to the research. they are not p21, the ed intake nurse from that session, and not p97, the behavioral health unit charge nurse from october 2025. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-05-26-interview-returning-nurse-practitioner-training-and-review-habits", "kind": "raw", "title": "Interview — Returning Nurse Practitioner on Champion Training and Review Habits", "date": "2026-05-26", "type": "interview", "status": "raw", "tags": ["ambient-scribe", "training", "rollout", "trust-in-ai", "longitudinal", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-05-26-interview-returning-nurse-practitioner-training-and-review-habits/session-notes.md", "corrections": [], "html": "<h1>Interview — Returning Nurse Practitioner on Champion Training and Review Habits</h1>\n<h2>Objective</h2>\n<p>At the GA release-candidate round, this participant said they had been through the champion training the month before and &quot;walked in already comfortable&quot; (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:39). That round found that participants who had been through the champion-model style training pilot reported higher initial comfort than those who hadn&#x27;t, though it wasn&#x27;t a controlled comparison (same file, :32). The participant is P118, returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate; this interview is in May 2026. The questions were what the training did and didn&#x27;t prepare them for once they used the scribe every day, and how they review drafts today.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a nurse practitioner in an ambulatory clinic who has used the ambient scribe since the January 2026 GA. They review and sign their own visit notes. They went through the champion training pilot before the January 2026 round; how clinicians who started using the scribe after GA were trained is not recorded in the corpus, and they did not know. This is an interview about their own practice; nothing was shown or observed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(training into practice)</em> In their account, the pilot training prepared them for the controls, for correcting a single line in place, and for what the underline means, and the first weeks after GA went smoothly for them. That is consistent with what they said in January (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:39). What it didn&#x27;t prepare them for were visits unlike the practice visits in the training: several people talking, a visit interrupted partway through, or a patient raising a second problem at the door. They learned to handle those drafts by using the scribe. This is one participant&#x27;s account and says nothing about how much the training helped compared with no training.</li><li><strong>[MEDIUM]</strong> <em>(review habits)</em> They read the assessment and plan in full on every draft. History sections they skim where nothing is underlined. They put their review at &quot;a minute or two a note&quot; on a routine visit, an informal estimate. The January round recorded 4 of 6 participants saying the underline let them skim (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:30) without saying who, so this can&#x27;t be compared with what this participant did in January, and it isn&#x27;t described here as a change.</li><li><strong>[LOW]</strong> <em>(peer questions)</em> Colleagues who started using the scribe after GA ask them how to correct a line or what the underline means. They described this as informal and did not describe any formal role.</li><li><strong>[LOW]</strong> <em>(nurse practitioner use)</em> They did not describe anything about the scribe that works differently for them as a nurse practitioner. Whether NPs review drafts differently from physicians is not something one interview can show.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The training got me comfortable with the buttons. What it couldn&#x27;t show me was a visit where three people are talking and the patient remembers a second problem at the door.&quot;</p><p>— Nurse Practitioner, P118 (returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate)</p></blockquote>\n<blockquote><p>&quot;I read the plan every time. The history I&#x27;ll skim if nothing&#x27;s underlined.&quot;</p><p>— Nurse Practitioner, P118 (returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>In any later ambient-scribe training, include practice with drafts from visits that don&#x27;t go to plan: several speakers, interruptions, a second problem raised at the end.</li><li>Record how clinicians who start using the scribe after GA are trained, so any later comparison of trained and untrained clinicians rests on a known basis.</li><li>Note that informal peer questions are reaching pilot-trained clinicians; if that support is expected of them, it needs time set aside for it.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How clinicians who started using the scribe after GA were trained is not recorded in the corpus.</li><li>Whether pilot-trained clinicians are more comfortable than others is still not a controlled comparison; the January round said so, and one returning participant can&#x27;t settle it.</li><li>How long draft review takes is not measured; &quot;a minute or two a note&quot; is one nurse practitioner&#x27;s estimate.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier session: <a href=\"../2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">2026-01-13 GA release candidate</a></li><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a>, <a href=\"../../findings/rollout-and-change-management.md\">rollout-and-change-management.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Returning Nurse Practitioner on Champion Training and Review Habits</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P118 — Nurse Practitioner (app), returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recontacted from the GA release-candidate usability test. The participant is P118, returning from 2026-01-13-usability-test-ambient-scribe-ga-release-candidate, where they took part in January 2026 after going through the champion training pilot; this interview is in May 2026. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview
