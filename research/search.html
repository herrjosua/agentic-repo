measured. representative quotes &quot;the evening used to be writing. now it&#x27;s mostly reading what it wrote and signing, and then the messages.&quot; — physician (family medicine), p150 &quot;right after the visit i remember what we said. by the evening i&#x27;m checking it against a memory that&#x27;s gone fuzzy.&quot; — physician (family medicine), p150 recommendations treat this interview as context for the repeat of the september 2025 survey, not as a measure. whether after-hours charting has changed since ga needs that repeat, which the baseline recommended and which is not recorded in the corpus. share with the ambient scribe team that, in this physician&#x27;s account, a draft reviewed hours after the visit gets a weaker check, because the check depends on memory of the visit. in later after-hours questions, ask about patient messages and test results as well as notes, since this physician placed much of their evening work there. follow-ups / open questions whether after-hours charting has changed since ga is not measured; this is one physician&#x27;s informal account, and no repeat of the september 2025 survey is recorded in the corpus. how their evening time divides between notes, messages and results is not measured. whether other physicians, or nps and pas, describe the same pattern is not known; this is one interview. related earlier session: 2025-09-09 documentation burden baseline survey synthesized into: clinician-experience-documentation-burden.md participants participants — interview — family physician on after-hours charting since ga count: 1 roles: p150 — physician (family medicine) (physician) researcher: priya patel recruitment note: recruited via primary care clinic physician contacts, from clinicians who opted in to the ambient scribe after the january 2026 ga. this participant is new to the research and did not take part in any earlier session. they are not p09, p11, p22, p27, p84, p119, p146, p147 or p149. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-07-07-interview-care-coordinator-override-reason-capture", "kind": "raw", "title": "Interview — Returning Care Coordinator on Override-Reason Capture", "date": "2026-07-07", "type": "interview", "status": "raw", "tags": ["care-coordination", "alert-triage", "trust-in-ai", "workflow", "project-care-coordination"], "related_components": ["alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-07-07-interview-care-coordinator-override-reason-capture/session-notes.md", "corrections": [], "html": "<h1>Interview — Returning Care Coordinator on Override-Reason Capture</h1>\n<h2>Objective</h2>\n<p>Get a reaction to the override-reason capture screens (<code>wireflows/alert-triage-override-reason-capture.md</code>) from a coordinator who asked for exactly this kind of capture. The participant is P81, returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination (August 2025); this interview is in July 2026. In that test they said they wanted to tell the ranking &quot;this one&#x27;s more urgent because I know this patient&#x27;s history&quot; and had nowhere to put it. The question was whether the reason list and the flow fit the reasons they actually have.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant reacted to the in-review wireflow screens: the &quot;Override&quot; action on a ranked queue item, the reason-capture modal (patient-history risk / recency not clinically relevant / other + free text) and the skip-reason branch. The wireflow is designed and in review, not built, and the AI-ranked queue hasn&#x27;t been built; their team still works the chronological queue.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(reason list)</em> Their most common reason for moving an alert is something the patient or a family member said on the phone that isn&#x27;t in the chart yet. That reason isn&#x27;t in the list. Looking at the screens, they said they would pick &quot;other&quot; most of the time, so the reason the capture most needs to collect would land in the least useful bucket.</li><li><strong>[MEDIUM]</strong> <em>(effort)</em> They would give a reason if it took one tap. They would not type free text on every override, and expected that on a busy day they would skip the modal rather than type. This is what they said they would do; nothing was observed in use.</li><li><strong>[MEDIUM]</strong> <em>(feedback loop)</em> If they never saw any effect from the reasons they gave, they said they would stop giving them after a while. The wireflow logs reasons for model-tuning review and doesn&#x27;t show coordinators anything back.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Half the time it&#x27;s something the daughter told me on the phone yesterday. That&#x27;s not in the chart yet, and it&#x27;s not on your list, so I&#x27;d be hitting &#x27;other&#x27; all day.&quot;</p><p>— Care Coordinator, P81 (returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination)</p></blockquote>\n<blockquote><p>&quot;One tap, fine. But if I never see it change anything, I&#x27;ll stop bothering.&quot;</p><p>— Care Coordinator, P81 (returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Add a one-tap reason for information from the patient or family that isn&#x27;t in the chart yet, before the wireflow leaves review.</li><li>Keep every reason one tap, with free text optional, so a busy coordinator doesn&#x27;t skip the modal altogether.</li><li>Decide how coordinators will see that their reasons are used, and say so in the design.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often overrides would fall under &quot;other&quot; with the current list is not known; this is one coordinator&#x27;s expectation.</li><li>Whether a feedback loop would keep coordinators giving reasons is untested.</li><li>How the 2025 ranking weighted its inputs, and how accurate it is, are still not documented.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Returning Care Coordinator on Override-Reason Capture</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P81 — Care Coordinator (care-coordinator), returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recontacted from the August 2025 alert-triage usability test. The participant is P81, returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination (August 2025); this interview is in July 2026. They are still a care coordinator. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — returning care coordinator on override-reason capture care-coordination alert-triage trust-in-ai workflow project-care-coordination alert-triage-queue interview — returning care coordinator on override-reason capture objective get a reaction to the override-reason capture screens ( wireflows/alert-triage-override-reason-capture.md ) from a coordinator who asked for exactly this kind of capture. the participant is p81, returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination (august 2025); this interview is in july 2026. in that test they said they wanted to tell the ranking &quot;this one&#x27;s more urgent because i know this patient&#x27;s history&quot; and had nowhere to put it. the question was whether the reason list and the flow fit the reasons they actually have. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant reacted to the in-review wireflow screens: the &quot;override&quot; action on a ranked queue item, the reason-capture modal (patient-history risk / recency not clinically relevant / other + free text) and the skip-reason branch. the wireflow is designed and in review, not built, and the ai-ranked queue hasn&#x27;t been built; their team still works the chronological queue. key findings [high] (reason list) their most common reason for moving an alert is something the patient or a family member said on the phone that isn&#x27;t in the chart yet. that reason isn&#x27;t in the list. looking at the screens, they said they would pick &quot;other&quot; most of the time, so the reason the capture most needs to collect would land in the least useful bucket. [medium] (effort) they would give a reason if it took one tap. they would not type free text on every override, and expected that on a busy day they would skip the modal rather than type. this is what they said they would do; nothing was observed in use. [medium] (feedback loop) if they never saw any effect from the reasons they gave, they said they would stop giving them after a while. the wireflow logs reasons for model-tuning review and doesn&#x27;t show coordinators anything back. representative quotes &quot;half the time it&#x27;s something the daughter told me on the phone yesterday. that&#x27;s not in the chart yet, and it&#x27;s not on your list, so i&#x27;d be hitting &#x27;other&#x27; all day.&quot; — care coordinator, p81 (returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination) &quot;one tap, fine. but if i never see it change anything, i&#x27;ll stop bothering.&quot; — care coordinator, p81 (returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination) recommendations add a one-tap reason for information from the patient or family that isn&#x27;t in the chart yet, before the wireflow leaves review. keep every reason one tap, with free text optional, so a busy coordinator doesn&#x27;t skip the modal altogether. decide how coordinators will see that their reasons are used, and say so in the design. follow-ups / open questions how often overrides would fall under &quot;other&quot; with the current list is not known; this is one coordinator&#x27;s expectation. whether a feedback loop would keep coordinators giving reasons is untested. how the 2025 ranking weighted its inputs, and how accurate it is, are still not documented. related synthesized into: care-coordination-triage.md participants participants — interview — returning care coordinator on override-reason capture count: 1 roles: p81 — care coordinator (care-coordinator), returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination researcher: priya patel recruitment note: recontacted from the august 2025 alert-triage usability test. the participant is p81, returning from 2025-08-26-usability-test-alert-triage-ai-care-coordination (august 2025); this interview is in july 2026. they are still a care coordinator. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-07-14-interview-revenue-cycle-analyst-claim-denials", "kind": "raw", "title": "Interview — Revenue Cycle Analyst on Claim Denials and Coding", "date": "2026-07-14", "type": "interview", "status": "raw", "tags": ["him", "billing", "coding", "compliance", "audit-trail", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-07-14-interview-revenue-cycle-analyst-claim-denials/session-notes.md", "corrections": [], "html": "<h1>Interview — Revenue Cycle Analyst on Claim Denials and Coding</h1>\n<h2>Objective</h2>\n<p>Bring a revenue cycle view into the HIM research: understand where claim denials actually come from on the billing side, how coding contributes, and what a revenue cycle analyst would expect from the AI coding-suggestion concept (July 2025 prototype, not built or piloted) if it were ever built.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; 42 CFR Part 2 handling is still manual. The participant works claim denials and claim-edit review on the billing side and routes coding-related denials back to HIM. They had not seen the July 2025 screens before this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(claim denials)</em> In their experience, coding-related claim denials almost never come from the wrong code category. They come from specificity: an unspecified diagnosis where the coverage policy wants a specified one, a missing laterality or a diagnosis that doesn&#x27;t support the medical necessity of the procedure billed. By their own informal estimate &quot;most&quot; of the coding-related denials they work, &quot;probably two-thirds or more&quot;, are specificity problems, but they stressed they had no report in front of them. They said this is the same gap coders and CDI described, seen from the claim end, and that it hasn&#x27;t improved since the scribe went GA.</li><li><strong>[MEDIUM]</strong> <em>(audit)</em> When they review a claim edit or work a denial, they want to see whether a code was suggested by a tool and accepted, or entered by the coder. Today they can see who coded the encounter but nothing about how. If a suggester went live, they&#x27;d want that visible in claim-edit review so they can tell whether a pattern of denials is coming from the tool or from a particular coder, which supports the coding auditor&#x27;s per-code record from April 2026.</li><li><strong>[LOW]</strong> <em>(metrics)</em> Time saved per chart would matter much less to revenue cycle than the denial rate. A tool that made coding faster but held the denial rate flat wouldn&#x27;t be worth much to them, and one that pushed more charts to unspecified codes faster could make it worse. They&#x27;d want any pilot measured on denials and rework, not only coder throughput.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;It&#x27;s almost never the wrong family of codes. It&#x27;s that it&#x27;s unspecified, or it&#x27;s missing the side, or the diagnosis doesn&#x27;t hold up the procedure. That&#x27;s what bounces. The category&#x27;s fine.&quot;</p><p>— Revenue Cycle Analyst (Billing), P126</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>If the coding-suggestion concept is pursued, design and evaluate it against specificity, not only category match; the July 2025 test&#x27;s 14-of-20 match rate counted specificity mismatches as misses, which is the right bar for revenue cycle.</li><li>Include &quot;suggested and accepted&quot; vs. &quot;entered by coder&quot; in what claim-edit review can see, alongside the per-code audit record.</li><li>Define pilot success metrics with revenue cycle: coding-related denial rate and rework, with throughput as a secondary measure.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Pull a real breakdown of coding-related claim denials by reason to check the informal &quot;two-thirds or more&quot; estimate.</li><li>Has the coding-related denial rate moved since the scribe went GA in January 2026?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Revenue Cycle Analyst on Claim Denials and Coding</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P126 — Revenue Cycle Analyst (Billing) (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, who referred us to the billing team for a revenue cycle perspective on coding. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — revenue cycle analyst on claim denials and coding him billing coding compliance audit-trail project-him coding-suggestion-panel interview — revenue cycle analyst on claim denials and coding objective bring a revenue cycle view into the him research: understand where claim denials actually come from on the billing side, how coding contributes, and what a revenue cycle analyst would expect from the ai coding-suggestion concept (july 2025 prototype, not built or piloted) if it were ever built. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the ai coding-suggestion tool is still a concept from july 2025 and has not been built or piloted; 42 cfr part 2 handling is still manual. the participant works claim denials and claim-edit review on the billing side and routes coding-related denials back to him. they had not seen the july 2025 screens before this session. key findings [high] (claim denials) in their experience, coding-related claim denials almost never come from the wrong code category. they come from specificity: an unspecified diagnosis where the coverage policy wants a specified one, a missing laterality or a diagnosis that doesn&#x27;t support the medical necessity of the procedure billed. by their own informal estimate &quot;most&quot; of the coding-related denials they work, &quot;probably two-thirds or more&quot;, are specificity problems, but they stressed they had no report in front of them. they said this is the same gap coders and cdi described, seen from the claim end, and that it hasn&#x27;t improved since the scribe went ga. [medium] (audit) when they review a claim edit or work a denial, they want to see whether a code was suggested by a tool and accepted, or entered by the coder. today they can see who coded the encounter but nothing about how. if a suggester went live, they&#x27;d want that visible in claim-edit review so they can tell whether a pattern of denials is coming from the tool or from a particular coder, which supports the coding auditor&#x27;s per-code record from april 2026. [low] (metrics) time saved per chart would matter much less to revenue cycle than the denial rate. a tool that made coding faster but held the denial rate flat wouldn&#x27;t be worth much to them, and one that pushed more charts to unspecified codes faster could make it worse. they&#x27;d want any pilot measured on denials and rework, not only coder throughput. representative quotes &quot;it&#x27;s almost never the wrong family of codes. it&#x27;s that it&#x27;s unspecified, or it&#x27;s missing the side, or the diagnosis doesn&#x27;t hold up the procedure. that&#x27;s what bounces. the category&#x27;s fine.&quot; — revenue cycle analyst (billing), p126 recommendations if the coding-suggestion concept is pursued, design and evaluate it against specificity, not only category match; the july 2025 test&#x27;s 14-of-20 match rate counted specificity mismatches as misses, which is the right bar for revenue cycle. include &quot;suggested and accepted&quot; vs. &quot;entered by coder&quot; in what claim-edit review can see, alongside the per-code audit record. define pilot success metrics with revenue cycle: coding-related denial rate and rework, with throughput as a secondary measure. follow-ups / open questions pull a real breakdown of coding-related claim denials by reason to check the informal &quot;two-thirds or more&quot; estimate. has the coding-related denial rate moved since the scribe went ga in january 2026? related synthesized into: him-coding-and-billing.md participants participants — interview — revenue cycle analyst on claim denials and coding count: 1 roles: p126 — revenue cycle analyst (billing) (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, who referred us to the billing team for a revenue cycle perspective on coding. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-07-21-interview-med-surg-night-nurse-charting-load", "kind": "raw", "title": "Interview — Med-Surg Night Nurse on Charting Load", "date": "2026-07-21", "type": "interview", "status": "raw", "tags": ["nursing", "documentation-burden", "burnout", "clinician-workflow", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-07-21-interview-med-surg-night-nurse-charting-load/session-notes.md", "corrections": [], "html": "<h1>Interview — Med-Surg Night Nurse on Charting Load</h1>\n<h2>Objective</h2>\n<p>The documentation-burden finding quantifies after-hours charting for physicians only: the September 2025 baseline found 64% of physician respondents regularly finishing documentation after clinic hours, at a self-reported 1.2 hours a day (2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md:30). Nothing in the corpus describes the same thing for nurses beyond the February 2025 nursing survey&#x27;s attitudes and one respondent&#x27;s wish to get &quot;out of the room 10 minutes faster to chart&quot; (2025-02-11-survey-nursing-attitudes-ai-documentation/session-notes.md:37). This session asked an inpatient nurse whether their charting runs past the end of their shift, why, and what they expect of AI drafting nursing notes, which doesn&#x27;t exist.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a registered nurse on an inpatient medical-surgical unit, working twelve-hour night shifts, about two years in; they finished unit orientation as a new graduate. Their charting is manual. The ambient scribe, GA since January 2026, drafts notes for physicians, NPs and PAs only, and no nurse uses it for their own documentation, so everything they said about AI drafting nursing notes is an expectation, not experience. They did not take part in any earlier session, including the February 2025 nursing survey.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(after-shift charting)</em> Their charting regularly continues after the shift ends. They hand off at the end of the night, then stay at a workstation to finish notes they could not complete during the shift. They put it at &quot;most shifts, thirty to forty-five minutes&quot;; that is an informal self-estimate, not timed or logged. The notes left over are mostly the narrative parts and the end-of-shift reassessments, because the start of the night is admissions and the early morning is medication passes and labs, and charting is what gets deferred whenever a patient needs something.</li><li><strong>[MEDIUM]</strong> <em>(burden beyond physicians)</em> This extends the documentation-burden finding to registered nurses qualitatively: one nurse describes after-shift charting as routine on their unit. It does not supply a nurse figure. The September 2025 figures (52%, 64%, 1.2 hours a day) are physician-only and should not be read as describing nurses; this interview&#x27;s thirty to forty-five minutes is one nurse&#x27;s estimate and isn&#x27;t comparable to them. They linked the after-shift time to how tired they are at the end of a run of nights, but described it as fatigue, not burnout, and no burnout measure was used.</li><li><strong>[LOW]</strong> <em>(tenure and skepticism)</em> Asked about years of experience, they offered their own view as a newer nurse: they haven&#x27;t settled into a way of charting yet, which might make them more open to a draft, but it also means they would check every word, because they don&#x27;t yet trust themselves to spot what a draft got wrong. This is one newer nurse&#x27;s view. It does not answer the February 2025 survey&#x27;s open question on whether skepticism correlates with tenure, which needs the survey cross-tab.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Report&#x27;s done and I&#x27;m still at the workstation finishing my notes. Day shift is already running the floor around me.&quot;</p><p>— Registered Nurse (medical-surgical), P141</p></blockquote>\n<blockquote><p>&quot;I&#x27;m new enough that I don&#x27;t have a way of charting yet. Maybe that makes me more open to it. It also means I&#x27;d read every word, because I don&#x27;t trust myself to know what it got wrong.&quot;</p><p>— Registered Nurse (medical-surgical), P141</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>When the documentation-burden finding is next revised, note that after-shift charting is also reported by nurses, qualitatively, and keep the September figures labelled as physician-only.</li><li>If nurse documentation burden needs a number, measure it directly (the September baseline&#x27;s registered nurse responses reported separately, if they exist, or time logs), rather than extending the physician figures.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How much time nurses spend charting after their shift is not measured; &quot;thirty to forty-five minutes&quot; is one nurse&#x27;s estimate, on one unit.</li><li>The September 2025 baseline&#x27;s roster lists registered nurses among its respondents, but its notes report the burnout and after-hours figures for physicians only; whether nurse results exist is not recorded.</li><li>Whether skepticism varies with tenure is still open; the February 2025 survey&#x27;s cross-tab hasn&#x27;t been run, and one interview can&#x27;t answer it.</li><li>Whether day-shift nurses on the same unit chart after their shift too is not known.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Med-Surg Night Nurse on Charting Load</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P141 — Registered Nurse (medical-surgical) (nurse)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via inpatient medical-surgical nursing contacts. This participant is new to the research and did not take part in any earlier session, including the February 2025 nursing survey. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — med-surg night nurse on charting load nursing documentation-burden burnout clinician-workflow project-cross-cutting interview — med-surg night nurse on charting load objective the documentation-burden finding quantifies after-hours charting for physicians only: the september 2025 baseline found 64% of physician respondents regularly finishing documentation after clinic r-shift charting as routine on their unit. it does not supply a nurse figure. the september 2025 figures (52%, 64%, 1.2 hours a day) are physician-only and should not be read as describing nurses; this interview&#x27;s thirty to forty-five minutes is one nurse&#x27;s estimate and isn&#x27;t comparable to them. they linked the after-shift time to how tired they are at the end of a run of nights, but described it as fatigue, not burnout, and no burnout measure was used. [low] (tenure and skepticism) asked about years of experience, they offered their own view as a newer nurse: they haven&#x27;t settled into a way of charting yet, which might make them more open to a draft, but it also means they would check every word, because they don&#x27;t yet trust themselves to spot what a draft got wrong. this is one newer nurse&#x27;s view. it does not answer the february 2025 survey&#x27;s open question on whether skepticism correlates with tenure, which needs the survey cross-tab. representative quotes &quot;report&#x27;s done and i&#x27;m still at the workstation finishing my notes. day shift is already running the floor around me.&quot; — registered nurse (medical-surgical), p141 &quot;i&#x27;m new enough that i don&#x27;t have a way of charting yet. maybe that makes me more open to it. it also means i&#x27;d read every word, because i don&#x27;t trust myself to know what it got wrong.&quot; — registered nurse (medical-surgical), p141 recommendations when the documentation-burden finding is next revised, note that after-shift charting is also reported by nurses, qualitatively, and keep the september figures labelled as physician-only. if nurse documentation burden needs a number, measure it directly (the september baseline&#x27;s registered nurse responses reported separately, if they exist, or time logs), rather than extending the physician figures. follow-ups / open questions how much time nurses spend charting after their shift is not measured; &quot;thirty to forty-five minutes&quot; is one nurse&#x27;s estimate, on one unit. the september 2025 baseline&#x27;s roster lists registered nurses among its respondents, but its notes report the burnout and after-hours figures for physicians only; whether nurse results exist is not recorded. whether skepticism varies with tenure is still open; the february 2025 survey&#x27;s cross-tab hasn&#x27;t been run, and one interview can&#x27;t answer it. whether day-shift nurses on the same unit chart after their shift too is not known. related synthesized into: clinician-experience-documentation-burden.md participants participants — interview — med-surg night nurse on charting load count: 1 roles: p141 — registered nurse (medical-surgical) (nurse) researcher: priya patel recruitment note: recruited via inpatient medical-surgical nursing contacts. this participant is new to the research and did not take part in any earlier session, including the february 2025 nursing survey. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-07-28-interview-orthopedics-physician-assistant-exam-findings-in-scribe-drafts", "kind": "raw", "title": "Interview — Orthopedics Physician Assistant on Exam Findings in Scribe Drafts", "date": "2026-07-28", "type": "interview", "status": "raw", "tags": ["ambient-scribe", "documentation", "clinician-workflow", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-07-28-interview-orthopedics-physician-assistant-exam-findings-in-scribe-drafts/session-notes.md", "corrections": [], "html": "<h1>Interview — Orthopedics Physician Assistant on Exam Findings in Scribe Drafts</h1>\n<h2>Objective</h2>\n<p>No physician assistant has been quoted in an earlier session. Physician assistants are listed on the rosters of the 2025-05-06 dashboard test, the 2025-09-09 baseline survey and the 2026-01-13 GA release-candidate test (participants.md:24, :23 and :25 in those folders), but no quote in any raw session is attributed to one. Laterality has come up only from the reader&#x27;s side: a medical coder said scribe-drafted notes often leave out the specificity coding depends on, laterality among it (2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes/session-notes.md:31), and a revenue cycle analyst named a missing laterality among the specificity problems behind coding-related claim denials in general, which they said hasn&#x27;t improved since the scribe went GA (2026-07-14-interview-revenue-cycle-analyst-claim-denials/session-notes.md:31). No raw session dated on or before this one mentions orthopedics, range of motion or exam measurements, and none asked the person who signs a draft how exam findings spoken during a hands-on exam come through. This session asked a physician assistant in an orthopedics clinic what is hard to get right in a visit-note draft when findings are spoken while their hands are busy, and what they check before they sign.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a physician assistant in an ambulatory orthopedics clinic, about six years in that role. They opted in to the ambient scribe after the January 2026 GA and use it for most visits. The scribe drafts the visit note only; they review the draft, correct single lines in place, and sign. Low-confidence transcription is shown with a subtle underline. Only the visit note was discussed. They did not take part in any earlier session. This is an interview about their own practice; nothing was shown or observed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(side)</em> They say findings out loud while examining, with their hands on the patient and their back to the workstation, and often say &quot;this knee&quot; or &quot;the other side&quot; rather than naming it; patients point and say &quot;this one&quot; too. In their account the draft sometimes leaves the side out of an exam line, or gives every line the side of the main complaint when they examined both. These lines are usually not underlined, because the words were heard clearly. Before signing they check the side on every exam line and in the assessment. They put &quot;a side to fix&quot; at &quot;maybe one note in ten&quot;, an informal impression, not a count.</li><li><strong>[HIGH]</strong> <em>(measurements)</em> Range of motion and other measurements come out in a run while they are holding the limb (&quot;flexion one-twenty, extension minus five&quot;). They said the draft sometimes attaches a number to the wrong movement or drops the minus, and only some of those lines are underlined. They check every number in the exam against what they found. Since GA they say each movement and its number as a pair, and name the side, so the draft has less to work out; that is their account of their own practice, not an observed change.</li><li><strong>[MEDIUM]</strong> <em>(what they check)</em> Their review has a fixed order: side first, then every number in the exam, then the assessment and plan. History sections they read more quickly. They put the review at &quot;a couple of minutes a note&quot; on a routine visit, an informal estimate.</li><li><strong>[LOW]</strong> <em>(physician assistant)</em> They did not describe anything about reviewing drafts that works differently for them as a physician assistant. Whether PAs review drafts differently from physicians or NPs is not something one interview can show.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;My hands are on the knee, not the keyboard. I say &#x27;this side&#x27;, and the draft has to work out which side that was.&quot;</p><p>— Physician Assistant (orthopedics clinic), P151</p></blockquote>\n<blockquote><p>&quot;Flexion one-twenty, extension minus five. If it drops the minus, the note says something I didn&#x27;t find.&quot;</p><p>— Physician Assistant (orthopedics clinic), P151</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Share with the ambient scribe team that, in this physician assistant&#x27;s account, the side and exam measurements are where exam lines go wrong without being underlined, because the words are heard clearly.</li><li>When drafts are evaluated, include hands-on exams where the side is said as &quot;this side&quot; and measurements are spoken in a run, and check side and numbers line by line.</li><li>In any later training for specialty clinics, include naming the side and saying each measurement with its movement; whether that reduces corrections is untested.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often the side or a measurement needs correcting is not measured; &quot;maybe one note in ten&quot; is one physician assistant&#x27;s impression.</li><li>Whether other PAs, NPs or physicians in orthopedics or other hands-on specialties see the same is not known; this is one interview.</li><li>Whether the laterality gaps a medical coder and a revenue cycle analyst described are the same gaps this participant corrects before signing is not known.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier sessions: <a href=\"../2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">2026-01-13 GA release candidate</a> (confidence underline), <a href=\"../2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes/session-notes.md\">2026-03-10 medical coder interview</a>, <a href=\"../2026-07-14-interview-revenue-cycle-analyst-claim-denials/session-notes.md\">2026-07-14 revenue cycle analyst interview</a></li><li>Synthesized into: <a href=\"../../finding -alert-volume/session-notes.md", "corrections": [], "html": "<h1>Interview — Complex Care Coordinator on Alert Volume</h1>\n<h2>Objective</h2>\n<p>Understand where alert noise comes from for a coordinator on a high-risk panel, and whether AI ranking addresses it, following up the August 2025 alert-triage test and the May 2026 supervisor&#x27;s estimate that many alerts are administrative rather than clinical.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a care coordinator on a complex care team with a high-risk panel. Their team works the chronological queue; the AI-ranked queue hasn&#x27;t been built. They reacted to a description of the ranked queue, not to screens. They did not take part in any earlier session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(repeat alerts)</em> For them, the main source of noise is repeat alerts for the same patient, more than the order the alerts come in. They would want alerts grouped by patient before any ranking is applied, so that they deal with one patient once rather than meeting them several times down the queue. This is their account; no queue data was reviewed in this session.</li><li><strong>[MEDIUM]</strong> <em>(patient history)</em> Their judgement of a patient&#x27;s risk leans on knowing that patient&#x27;s history, which a ranking based on the alert alone wouldn&#x27;t have. This is a second voice alongside P81&#x27;s 2025 comment about knowing a patient&#x27;s history, from a different coordinator on a different kind of panel.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;It&#x27;s not the order that gets me, it&#x27;s seeing the same patient four times. Put them together first, then rank them if you want.&quot;</p><p>— Care Coordinator (complex care), P134</p></blockquote>\n<blockquote><p>&quot;I know these patients. Half of deciding who&#x27;s at risk is knowing what happened to them last winter.&quot;</p><p>— Care Coordinator (complex care), P134</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Explore grouping alerts by patient as a step before ranking, and test it with coordinators on high-risk panels.</li><li>Keep patient history in view when ranking signals are next revisited, in line with the August 2025 recommendation.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How many alerts are repeats for the same patient is not measured; this is one coordinator&#x27;s account.</li><li>How the 2025 ranking was built and how accurate it is are still not documented, and whether the override-capture idea reached the data-science team isn&#x27;t recorded.</li><li>Real-world triage speed and how often coordinators would follow a ranked order without judgement are not measured.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Complex Care Coordinator on Alert Volume</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P134 — Care Coordinator (complex care) (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions. The participant works on a complex care team with a high-risk panel. They are new to the research and did not take part in any earlier session. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — complex care coordinator on alert volume care-coordination alert-triage alert-fatigue trust-in-ai project-care-coordinati n view when ranking signals are next revisited, in line with the august 2025 recommendation. follow-ups / open questions how many alerts are repeats for the same patient is not measured; this is one coordinator&#x27;s account. how the 2025 ranking was built and how accurate it is are still not documented, and whether the override-capture idea reached the data-science team isn&#x27;t recorded. real-world triage speed and how often coordinators would follow a ranked order without judgement are not measured. related synthesized into: care-coordination-triage.md participants participants — interview — complex care coordinator on alert volume count: 1 roles: p134 — care coordinator (complex care) (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions. the participant works on a complex care team with a high-risk panel. they are new to the research and did not take part in any earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-08-11-interview-him-supervisor-coding-team-oversight", "kind": "raw", "title": "Interview — HIM Supervisor on Coding Team Oversight", "date": "2026-08-11", "type": "interview", "status": "raw", "tags": ["him", "coding", "training", "workflow", "42-cfr-part-2", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-08-11-interview-him-supervisor-coding-team-oversight/session-notes.md", "corrections": [], "html": "<h1>Interview — HIM Supervisor on Coding Team Oversight</h1>\n<h2>Objective</h2>\n<p>Bring the view of someone who manages coders into the HIM research: how a supervisor sets productivity expectations, trains and monitors coders, and what they would expect to change if the AI coding-suggestion concept (July 2025 prototype, not built or piloted) were ever built. This follows the June 2026 coder interview, which recommended raising quotas with HIM leadership. The participant supervises a coding team. They have the same role label as P67 (July 2025 contextual inquiry) and P121 (March 2026 interview), but they are a different person from both and took part in neither session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; 42 CFR Part 2 handling is still manual. The participant supervises outpatient and inpatient coders, sets their daily productivity targets with HIM leadership, onboards new coders and reviews their early work. Their team has coded from scribe-drafted notes since GA. They had not seen the July 2025 screens before this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(productivity)</em> Their main worry about a coding suggester isn&#x27;t accuracy. It&#x27;s that leadership would raise coding targets as soon as it went live, on the assumption that AI saves time, before anyone has measured whether it does. They said targets went up once before when a new coding tool came in, and weren&#x27;t revisited when the expected gain didn&#x27;t show up on complex charts. They had heard the July 2025 &quot;2-3 minutes per simple chart&quot; estimate second-hand and were concerned it would be applied to every chart. If targets rose first, they expect coders to protect their numbers by accepting suggestions on simple charts, which is the habit the June 2026 coder described.</li><li><strong>[MEDIUM]</strong> <em>(training)</em> They said override behaviour would have to be trained and monitored as a skill, not left to habit. For new coders they would want to see, at least for the first months, how often each person accepts a suggestion unchanged versus edits or overrides it, and to review a sample of the unchanged ones. They saw this as a supervisor&#x27;s tool, not only an auditor&#x27;s, and said they can&#x27;t coach what they can&#x27;t see. Today they can only see finished codes, not how a coder got there.</li><li><strong>[MEDIUM]</strong> <em>(42 CFR Part 2)</em> Coders aren&#x27;t the Part 2 decision-makers, but they do see substance-use content in charts and need to know what not to copy into queries or notes to other teams. Part 2 training for coders still depends on memory and a printed sheet. It is a version of the sheet the ROI team uses, which the March 2026 supervisor described, adapted for coding, and nobody owns keeping it current. Nothing has changed since GA, though scribe-drafted notes capture more of that content.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The day this goes live, someone upstairs is going to bump the target, because &#x27;the AI does half of it now.&#x27; Nobody&#x27;s going to measure first. They never do.&quot;</p><p>— HIM Supervisor, P127</p></blockquote>\n<blockquote><p>&quot;I can teach someone to override a bad suggestion. What I can&#x27;t do is teach it once and assume it sticks. If I can&#x27;t see who&#x27;s accepting everything, I&#x27;m not supervising, I&#x27;m hoping.&quot;</p><p>— HIM Supervisor, P127</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>If the coding-suggestion concept is pursued, agree with HIM leadership in advance that productivity targets stay unchanged during any pilot. Revisit them only after measured time per chart, split by simple and complex charts, and alongside denial and rework rates.</li><li>Expose per-coder acceptance, edit and override rates to supervisors as well as coding auditors, to support training and coaching rather than only retrospective audit.</li><li>Add coding to the case for a structured 42 CFR Part 2 flag. Coders rely on the same memory and printed-sheet approach as ROI.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Which earlier tool rollout led to a target increase, and is there any before-and-after data on coder throughput from it?</li><li>Who owns the coding version of the Part 2 sheet, and when was it last updated?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — HIM Supervisor on Coding Team Oversight</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P127 — HIM Supervisor (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2026-03-31). This participant supervises a coding team and is a different person from P67 (2025-07-15) and P121 (2026-03-31), despite the same role label. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — him supervisor on coding team oversight him coding training workflow 42-cfr-part-2 project-him coding-suggestion-panel interview — him supervisor on coding team oversight objective bring the view of someone who manages coders into the him research: how a supervisor sets productivity expectations, trains and monitors coders, and what they would expect to change if the ai coding-suggestion concept (july 2025 prototype, not built or piloted) were ever built. this follows the june 2026 coder interview, which recommended raising quotas with him leadership. the participant supervises a coding team. they have the same role label as p67 (july 2025 contextual inquiry) and ontent in charts and need to know what not to copy into queries or notes to other teams. part 2 training for coders still depends on memory and a printed sheet. it is a version of the sheet the roi team uses, which the march 2026 supervisor described, adapted for coding, and nobody owns keeping it current. nothing has changed since ga, though scribe-drafted notes capture more of that content. representative quotes &quot;the day this goes live, someone upstairs is going to bump the target, because &#x27;the ai does half of it now.&#x27; nobody&#x27;s going to measure first. they never do.&quot; — him supervisor, p127 &quot;i can teach someone to override a bad suggestion. what i can&#x27;t do is teach it once and assume it sticks. if i can&#x27;t see who&#x27;s accepting everything, i&#x27;m not supervising, i&#x27;m hoping.&quot; — him supervisor, p127 recommendations if the coding-suggestion concept is pursued, agree with him leadership in advance that productivity targets stay unchanged during any pilot. revisit them only after measured time per chart, split by simple and complex charts, and alongside denial and rework rates. expose per-coder acceptance, edit and override rates to supervisors as well as coding auditors, to support training and coaching rather than only retrospective audit. add coding to the case for a structured 42 cfr part 2 flag. coders rely on the same memory and printed-sheet approach as roi. follow-ups / open questions which earlier tool rollout led to a target increase, and is there any before-and-after data on coder throughput from it? who owns the coding version of the part 2 sheet, and when was it last updated? related synthesized into: him-coding-and-billing.md participants participants — interview — him supervisor on coding team oversight count: 1 roles: p127 — him supervisor (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2026-03-31). this participant supervises a coding team and is a different person from p67 (2025-07-15) and p121 (2026-03-31), despite the same role label. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-08-18-interview-nurse-manager-unit-champions", "kind": "raw", "title": "Interview — Nurse Manager on Unit Champions", "date": "2026-08-18", "type": "interview", "status": "raw", "tags": ["nursing", "change-management", "rollout", "training", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-08-18-interview-nurse-manager-unit-champions/session-notes.md", "corrections": [], "html": "<h1>Interview — Nurse Manager on Unit Champions</h1>\n<h2>Objective</h2>\n<p><code>rollout-and-change-management.md</code> recommends a unit-champion model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time (<code>findings/rollout-and-change-management.md</code>:33-36). That recommendation comes from the training department (2025-10-21-interview-training-department-rollout-change-management). This session asked a nurse manager, who would have to release those nurses from the unit, what it takes to give a champion real practice time, and what they would need before they could release a nurse for training.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is the nurse manager of an inpatient medical-surgical unit: staffing, the schedule, and the unit&#x27;s training and competencies. No AI feature is used by the nurses on their unit; the ambient scribe, GA since January 2026, drafts notes for physicians, NPs and PAs only, and the champion-model training pilot mentioned in the scribe release-candidate test was one that test&#x27;s participants, physicians, NPs and PAs, had been through before it (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:32, :39). What they said draws on releasing nurses for other training, such as EHR updates and annual competencies, not on an AI rollout. They did not take part in any earlier session. They are not P99, the Director of Clinical Training &amp; Education interviewed in October 2025, and not P141, the medical-surgical night nurse interviewed in July 2026; whether P141 works on their unit was not asked.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(release time)</em> Staffing makes protected practice time hard to keep. Releasing a nurse for a training session means backfilling their assignment with a float nurse or overtime, and on a day when census is high or someone calls out, training is the first thing they cancel, because patient assignments can&#x27;t be. They agreed with the champion model in principle; the gap is that whether champions are &quot;given actual time to practice&quot; (2025-10-21-interview-training-department-rollout-change-management/session-notes.md:34) depends on the unit&#x27;s staffing on the day. This complicates the recommendation in <code>rollout-and-change-management.md</code>: the model assumes practice time is available, and on this unit it is the thing most likely to be lost. It is consistent with the finding&#x27;s advice to avoid flu season, which they also named as their hardest months to release anyone.</li><li><strong>[MEDIUM]</strong> <em>(what release needs)</em> What they said they would need to release a nurse: training dates known before they build the schedule, which they do about six weeks out (their description of their own practice); backfill paid from a training budget rather than the unit&#x27;s; sessions offered on nights and weekends too, because night nurses otherwise miss them; and champions given time on the schedule for supporting peers, not expected to do it on top of a full assignment.</li><li><strong>[LOW]</strong> <em>(choosing champions)</em> They would want to pick the champions with the training team rather than have them assigned, and said the nurses who volunteer first are not always the ones others go to for help. This came up once and wasn&#x27;t explored.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Everyone agrees on time to practice. Then census goes up at six in the morning and the first thing I cancel is the class.&quot;</p><p>— Nurse Manager (medical-surgical), P142</p></blockquote>\n<blockquote><p>&quot;Put it on the schedule when I build it and pay for the backfill. Then I can send somebody.&quot;</p><p>— Nurse Manager (medical-surgical), P142</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>When <code>rollout-and-change-management.md</code> is next revised, add release time as a condition of the unit-champion model: practice time has to be scheduled and backfilled in advance, not assumed.</li><li>For any future rollout that reaches nurses, agree training dates with unit managers before their schedule is built, and include night and weekend sessions.</li><li>Budget champion time for supporting peers as scheduled time, not extra work on a full assignment.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Whether the training department can fund backfill for practice time is not known; it was not discussed with the training department.</li><li>How often training is cancelled for staffing on this or other units is not measured; this is one manager&#x27;s account.</li><li>Whether the scribe&#x27;s champion-model training pilot kept its practice time is not recorded; none of this participant&#x27;s nurses took part in it.</li><li>Whether other nurse managers would release nurses on the same terms is not known; this is one interview.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/rollout-and-change-management.md\">rollout-and-change-management.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Nurse Manager on Unit Champions</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P142 — Nurse Manager (medical-surgical) (nurse)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via inpatient nursing leadership contacts. This participant is new to the research and did not take part in any earlier session. They are not P99, the Director of Clinical Training &amp; Education from October 2025, and not P141, the medical-surgical night nurse from July 2026. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — nurse manager on unit champions nursing change-management rollout training project-cross-cutting interview — nurse manager on unit champions objective rollout-and-change-management.md recommends a unit-champion model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time ( findings/rollout-and-change-management.md :33-36). that recommendation comes from the training department (2025-10-21-interview-training-department-rollout-change-management). this session asked a nurse manager, who would have to release those nurses from the unit, what it takes to give a champion real practice time, and what they would need before they could release a nurse for training. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is the nurse manager of an inpatient medical-surgical unit: staffing, the schedule, and the unit&#x27;s training and competencies. no ai feature is used by eekends too, because night nurses otherwise miss them; and champions given time on the schedule for supporting peers, not expected to do it on top of a full assignment. [low] (choosing champions) they would want to pick the champions with the training team rather than have them assigned, and said the nurses who volunteer first are not always the ones others go to for help. this came up once and wasn&#x27;t explored. representative quotes &quot;everyone agrees on time to practice. then census goes up at six in the morning and the first thing i cancel is the class.&quot; — nurse manager (medical-surgical), p142 &quot;put it on the schedule when i build it and pay for the backfill. then i can send somebody.&quot; — nurse manager (medical-surgical), p142 recommendations when rollout-and-change-management.md is next revised, add release time as a condition of the unit-champion model: practice time has to be scheduled and backfilled in advance, not assumed. for any future rollout that reaches nurses, agree training dates with unit managers before their schedule is built, and include night and weekend sessions. budget champion time for supporting peers as scheduled time, not extra work on a full assignment. follow-ups / open questions whether the training department can fund backfill for practice time is not known; it was not discussed with the training department. how often training is cancelled for staffing on this or other units is not measured; this is one manager&#x27;s account. whether the scribe&#x27;s champion-model training pilot kept its practice time is not recorded; none of this participant&#x27;s nurses took part in it. whether other nurse managers would release nurses on the same terms is not known; this is one interview. related synthesized into: rollout-and-change-management.md participants participants — interview — nurse manager on unit champions count: 1 roles: p142 — nurse manager (medical-surgical) (nurse) researcher: priya patel recruitment note: recruited via inpatient nursing leadership contacts. this participant is new to the research and did not take part in any earlier session. they are not p99, the director of clinical training &amp; education from october 2025, and not p141, the medical-surgical night nurse from july 2026. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-08-20-interview-care-coordinator-new-hire-shadowing", "kind": "raw", "title": "Interview — New Care Coordinator on Learning the Queue", "date": "2026-08-20", "type": "interview", "status": "raw", "tags": ["care-coordination", "alert-triage", "trust-in-ai", "training", "chart-review", "project-care-coordination"], "related_components": ["alert-triage-queue", "chart-review-summary-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-08-20-interview-care-coordinator-new-hire-shadowing/session-notes.md", "corrections": [], "html": "<h1>Interview — New Care Coordinator on Learning the Queue</h1>\n<h2>Objective</h2>\n<p>Understand how a care coordinator who is new to the role learns the team&#x27;s working conventions, and what an AI-ranked alert queue would mean for someone who doesn&#x27;t yet have the experience to judge it, following up the August 2025 alert-triage test and the undocumented colour-coding first described in the January 2025 baseline.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a care coordinator on an ambulatory team who has been in the role for under a year. They read the signed visit notes clinicians produce, including scribe-drafted ones, but don&#x27;t use the scribe themselves. Their team works the chronological queue; the AI-ranked queue hasn&#x27;t been built. They reacted to a description of the ranked queue, not to screens. They did not take part in any earlier session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(learning by shadowing)</em> They learned the team&#x27;s conventions, including what the shared spreadsheet&#x27;s colours mean and which alerts can safely wait, by shadowing experienced coordinators, with nothing written down to check against later. They thought a ranked queue might help newer coordinators most, because it would stand in for the judgement they haven&#x27;t built yet. But they said newer coordinators would also be the least able to tell when the ranking is wrong. This is their own reflection; nothing was observed or measured in this session.</li><li><strong>[MEDIUM]</strong> <em>(chart review time)</em> In their first months, chart review before an outreach call took them &quot;closer to 20 minutes at first&quot;, which is longer than the 8-14 minutes the January 2025 baseline described for experienced coordinators. They said it has come down since. This is an informal recollection, not a timed measurement.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Nobody gave me a list. I sat next to people for two weeks and picked up what the colours meant and which alerts could wait.&quot;</p><p>— Care Coordinator, P135</p></blockquote>\n<blockquote><p>&quot;A ranked list would&#x27;ve been great my first month. But I wouldn&#x27;t have known if it was wrong, and that&#x27;s the scary part.&quot;</p><p>— Care Coordinator, P135</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Treat newer coordinators as a distinct group when the ranked queue is next tested: check whether they can spot a wrong ranking, not just whether they work faster with one.</li><li>Write down the team conventions that are currently passed on by shadowing (colour meanings, which alerts can wait), so that any design that carries or replaces them has a source to work from.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How long chart review takes for coordinators in their first year is not measured; &quot;closer to 20 minutes at first&quot; is one coordinator&#x27;s recollection.</li><li>How accurate the 2025 ranking is, and what it was based on, are still not documented, so it isn&#x27;t known how often a newer coordinator would meet a wrong ranking.</li><li>How often coordinators would follow a ranked order without their own judgement has not been measured, for newer coordinators or anyone else.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — New Care Coordinator on Learning the Queue</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P135 — Care Coordinator (care-coordinator)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via care coordination team contacts, consistent with the prior care coordination sessions. The participant works on an ambulatory team and has been in the role for under a year. They are new to the research and did not take part in any earlier session. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — new care coordinator on learning the queue care-coordination alert-triage trust-in-ai training chart-review project-care-coordination alert-triage-queue chart-review-summary-panel interview — new care coordinator on learning the queue objective understand how a care coordinator who is new to the role learns the team&#x27;s working conventions, and what an ai-ranked alert queue would mean for someone who doesn&#x27;t yet have the experience to judge it, following up the august 2025 alert-triage test and the undocumented colour-coding first described in the january 2025 baseline. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a care coordinator on an ambulatory team who has been in the role for under a year. they read the signed visit notes clinicians produce, including scribe-drafted ones, but don&#x27;t use the scribe themselves. their team works the chronological queue; the ai-ranked queue hasn&#x27;t been built. they reacted to a description of the ranked queue, not to screens. they did not take part in any earlier session. key findings [high] (learning by shadowing) they learned the team&#x27;s conventions, including what the shared spreadsheet&#x27;s colours mean and which alerts can safely wait, by shadowing experienced coordinators, with nothing written down to check against later. they thought a ranked queue might help newer coordinators most, because it would stand in for the judgement they haven&#x27;t built yet. but they said newer coordinators would also be the least able to tell when the ranking is wrong. this is their own reflection; nothing was observed or measured in this session. [medium] (chart review time) in their first months, chart review before an outreach call took them &quot;closer to 20 minutes at first&quot;, which is longer than the 8-14 minutes the january 2025 baseline described for experienced coordinators. they said it has come down since. this is an informal recollection, not a timed measurement. representative quotes &quot;nobody gave me a list. i sat next to people for two weeks and picked up what the colours meant and which alerts could wait.&quot; — care coordinator, p135 &quot;a ranked list would&#x27;ve been great my first month. but i wouldn&#x27;t have known if it was wrong, and that&#x27;s the scary part.&quot; — care coordinator, p135 recommendations treat newer coordinators as a distinct group when the ranked queue is next tested: check whether they can spot a wrong ranking, not just whether they work faster with one. write down the team conventions that are currently passed on by shadowing (colour meanings, which alerts can wait), so that any design that carries or replaces them has a source to work from. follow-ups / open questions how long chart review takes for coordinators in their first year is not measured; &quot;closer to 20 minutes at first&quot; is one coordinator&#x27;s recollection. how accurate the 2025 ranking is, and what it was based on, are still not documented, so it isn&#x27;t known how often a newer coordinator would meet a wrong ranking. how often coordinators would follow a ranked order without their own judgement has not been measured, for newer coordinators or anyone else. related synthesized into: care-coordination-triage.md participants participants — interview — new care coordinator on learning the queue count: 1 roles: p135 — care coordinator (care-coordinator) researcher: priya patel recruitment note: recruited via care coordination team contacts, consistent with the prior care coordination sessions. the participant works on an ambulatory team and has been in the role for under a year. they are new to the research and did not take part in any earlier session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-08-25-interview-primary-care-physician-assistant-coder-and-cdi-queries", "kind": "raw", "title": "Interview — Primary Care Physician Assistant on Coder and CDI Queries", "date": "2026-08-25", "type": "interview", "status": "raw", "tags": ["ambient-scribe", "documentation", "coding", "clinician-workflow", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-08-25-interview-primary-care-physician-assistant-coder-and-cdi-queries/session-notes.md", "corrections": [], "html": "<h1>Interview — Primary Care Physician Assistant on Coder and CDI Queries</h1>\n<h2>Objective</h2>\n<p>Queries on notes have come up only from the HIM side. A medical coder said that when scribe-drafted notes leave out the specificity coding depends on, they either query the physician or code to the unspecified level, and that they are doing both more often than with notes physicians typed from their own templates (2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes/session-notes.md:31). The same coder&#x27;s impression, with no count, was that queries back to physicians have gone up since GA and that physicians are slower to answer queries about notes &quot;they didn&#x27;t really write&quot; (same file, :33). A CDI specialist who writes physician queries (2026-05-12-interview-cdi-specialist-documentation-gaps/session-notes.md:28) said that scribe-drafted notes read as complete, so what is missing from them is harder to spot (same file, :31), and that a physician sometimes gets a second, near-duplicate query from the coder when a CDI query is already open, an annoyance they said predates the scribe (same file, :33). Among raw sessions dated on or before 2026-08-25, queries are mentioned only in those two sessions and in the 2026-08-11 HIM supervisor interview (2026-08-11-interview-him-supervisor-coding-team-oversight/session-notes.md:33), and no session asked a physician, NP or PA what it is like to receive one. This session asked a physician assistant in an ambulatory primary care clinic, about seven months after the January 2026 GA, what the coder and CDI queries they receive on scribe-drafted notes ask for and how they answer them.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a physician assistant in an ambulatory primary care clinic, about eight years in that role. They opted in to the ambient scribe after the January 2026 GA and use it for most visits. The scribe drafts the visit note only; they review the draft, correct single lines in place, and sign. Low-confidence transcription is shown with a subtle underline. Only queries on visit notes were discussed. They did not take part in any earlier session, and the researcher did not share what other participants had said. This is an interview about their own practice; nothing was shown or observed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(what queries ask)</em> In their account, most of the queries they get on scribe-drafted notes ask for something they decided at the visit but that the signed note doesn&#x27;t state outright: whether a condition is acute or chronic, or whether one condition is due to another. The draft recorded the discussion around it, and they signed it without noticing the statement was missing. They put the queries at &quot;two or three a week&quot;, an informal impression, not a count.</li><li><strong>[HIGH]</strong> <em>(answering later)</em> Queries reach them days after the visit, sometimes more than a week. To answer one they reread the note and the chart. Because the note reads as complete, they can&#x27;t always tell from it whether a point was settled at the visit or only talked about, and they then depend on memory. When they can&#x27;t recall, they say so in the answer rather than guess. They said answering a query on a scribe-drafted note takes them longer than one on a note they typed themselves, because they first have to work out what the note means; that is their impression, and nothing was timed.</li><li><strong>[MEDIUM]</strong> <em>(what they check now)</em> Since the first queries came back, they check before signing that the assessment states acuity and any link between conditions, and add a short line of their own when the draft leaves it implied. That is their account of their own practice, not an observed change, and whether it has changed how many queries they get is not known.</li><li><strong>[MEDIUM]</strong> <em>(two queries)</em> Now and then they get two queries about the same visit, one from CDI and one from coding, asking nearly the same thing, and they answer both. They did not know whether the two teams can see each other&#x27;s queries.</li><li><strong>[LOW]</strong> <em>(physician assistant)</em> They did not describe anything about receiving or answering queries that works differently for them as a physician assistant. Whether queries reach PAs differently from physicians or NPs is not something one interview can show.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;At the visit I knew it was chronic. The note talks all around it and never says so, and a week later the query asks me which it is.&quot;</p><p>— Physician Assistant (primary care), P152</p></blockquote>\n<blockquote><p>&quot;If I can&#x27;t remember, I write that I can&#x27;t remember. I&#x27;m not going to guess at what I meant a week ago.&quot;</p><p>— Physician Assistant (primary care), P152</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Share with the ambient scribe team that, in this physician assistant&#x27;s account, the queries they receive on scribe-drafted notes mostly ask for acuity and for the link between conditions, which the draft records as discussion without stating.</li><li>When the specificity elements coders and CDI query most often are collected, ask signers as well which of those the draft tends to leave implied, so the list covers both sides of a query.</li><li>Get query counts and turnaround times, split by scribe-drafted and typed notes. The coder and CDI sessions asked for counts (2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes/session-notes.md:48; 2026-05-12-interview-cdi-specialist-documentation-gaps/session-notes.md:49), and none are recorded in raw on or before this session.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often queries come and how long they take to answer is not measured; &quot;two or three a week&quot; is one physician assistant&#x27;s impression.</li><li>Whether physicians and NPs receive the same kinds of queries on scribe-drafted notes is not known; this is one interview.</li><li>Whether checking acuity and condition links before signing changes how many queries come back is untested.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier sessions: <a href=\"../2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes/session-notes.md\">2026-03-10 medical coder interview</a>, <a href=\"../2026-05-12-interview-cdi-specialist-documentation-gaps/session-notes.md\">2026-05-12 CDI specialist interview</a>, <a href=\"../2026-08-11-interview-him-supervisor-coding-team-oversight/session-notes.md\">2026-08-11 HIM supervisor interview</a></li><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a>, <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Primary Care Physician Assistant on Coder and CDI Queries</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P152 — Physician Assistant (primary care) (app)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via primary care clinic contacts, from clinicians who opted in to the ambient scribe after the January 2026 GA. This participant is new to the research and did not take part in any earlier session. They are not P151, the physician assistant quoted earlier. No real patient or staff identities are represented; the participant ID is a fictional label from the global
