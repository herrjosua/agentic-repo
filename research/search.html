pped from about a week to closer to two (informal; 2026-03-31, medium). turnaround depends mostly on who is asking: &quot;within a few days&quot; for patients&#x27; own recent records, about a week for insurers and &quot;often two weeks or more&quot; for attorneys (all informal impressions; 2026-09-08, medium). whether scribe generation metadata is part of the released record is unresolved; see [governance-and-phi.md](governance-and-phi.md) (2026-06-02, high). part 2 knowledge still lives on a printed sheet. roi specialists identify part 2 records from memory and a printed sheet of clinics and note types, and send any substance-use mention to the stricter review to be safe (2026-03-31, high). coders use an adapted version of the same sheet to know what not to copy into queries, and nobody owns keeping it current (2026-08-11, medium). both said scribe-drafted notes can capture more of that content. evidence trail 2025-07-15 — contextual inquiry — health information management (release of information) ( contextual-inquiry ) 2025-07-29 — usability test — ai-assisted medical coding suggestions ( usability-test ) 2026-03-10 — interview — medical coder on coding from ai-drafted notes ( interview ) 2026-03-31 — interview — him supervisor on roi volume and part 2 handling ( interview ) 2026-04-21 — interview — coding auditor on override tracking and audit trail ( interview ) 2026-05-12 — interview — cdi specialist on documentation gaps in ai-drafted notes ( interview ) 2026-06-02 — interview — him specialist on releasing ai-drafted notes ( interview ) 2026-06-23 — interview — medical coder on review and override habits ( interview ) 2026-07-14 — interview — revenue cycle analyst on claim denials and coding ( interview ) 2026-08-11 — interview — him supervisor on coding team oversight ( interview ) 2026-09-08 — interview — him specialist on roi request turnaround ( interview ) 2026-10-06 — interview — senior medical coder on ai coding suggestions ( interview ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md) [ai-assisted prior authorization](prior-authorization.md) [scope boundaries &amp; workflow fit](scope-boundaries-and-workflow-fit.md)"}, {"id": "finding:onboarding", "kind": "finding", "title": "Onboarding flow — setup step confusion", "date": "2026-02-03", "type": "synthesis", "status": "synthesized", "tags": ["onboarding", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/onboarding.md", "corrections": [], "html": "<h2>Summary</h2>\n<p>New admins hesitate at, or attempt to skip, step 3 of the onboarding wizard (&quot;Connect calendar&quot;) because its wording implies the step is optional, when it&#x27;s actually required for later functionality. This is the most consistently observed friction point in first-time setup (all 6 sessions).</p>\n<p>A separate, related hesitation sits at step 4 (&quot;Invite your team&quot;): one admin (session 3) worried that invites would email the whole team before they were ready.</p>\n<h2>Step numbering</h2>\n<p>Steps are numbered per <code>user-flows/onboarding-flow.md</code>, where Signup is step 1: 1 Signup, 2 Basics, 3 Connect calendar, 4 Invite your team, 5 Preferences, 6 Review &amp; finish. Some early records counted from the first step after Signup — session 2&#x27;s raw notes call the calendar step &quot;step 2&quot;, and the sessions 1–3 topline originally called the invite step &quot;step 3&quot;. Those refer to the same steps as above: step 3 is always &quot;Connect calendar&quot;, and step 4 is always &quot;Invite your team&quot;.</p>\n<h2>Evidence</h2>\n<p>Sourced from <code>raw/2026-01-19-onboarding-usability-test/</code> — 6 participants, moderated usability sessions, Jan 19–23 2026. In sessions 1–3, 2 of 3 participants tried to skip step 3 (&quot;Connect calendar&quot;): session 1 tried to exit via the step label, and session 2 tried to skip it before hitting the &quot;required&quot; indicator. Sessions 4–6 read the step as optional in the same way. The step 4 invite hesitation comes from session 3 only (&quot;I&#x27;m worried this is going to email my whole team before I&#x27;m ready&quot;). The raw notes record it as the &quot;Same step 3 hesitation as session 1&quot;; it&#x27;s read as the invite step because of what the participant said (see <code>docs/ask-audit-2026-09-27.md</code>).</p>\n<p>See also <code>analytics/summaries/onboarding-funnel-dropoff.md</code>, which reports step 3 as the largest drop-off point. The underlying funnel export isn&#x27;t in the repo (there&#x27;s no <code>analytics/raw/</code> export), so it isn&#x27;t independent corroboration here.</p>\n<h2>Recommendation</h2>\n<p>Relabel step 3 to state clearly that calendar connection is required, and give visible feedback that invites (entered in step 4, &quot;Invite your team&quot;) aren&#x27;t sent until the whole wizard is submitted.</p>\n<h2>Status</h2>\n<p>Synthesized Feb 3, 2026, from sessions 1–6. Revisit after the step 3 wording change (proposed in <code>research-readouts/onboarding-flow-q1-readout.md</code>) ships and gets retested.</p>", "searchText": "onboarding flow — setup step confusion onboarding project-onboarding summary new admins hesitate at, or attempt to skip, step 3 of the onboarding wizard (&quot;connect calendar&quot;) because its wording implies the step is optional, when it&#x27;s actually required for later functionality. this is the most consistently observed friction point in first-time setup (all 6 sessions). a separate, related hesitation sits at step 4 (&quot;invite your team&quot;): one admin (session 3) worried that invites would email the whole team before they were ready. step numbering steps are numbered per user-flows/onboarding-flow.md , where signup is step 1: 1 signup, 2 basics, 3 connect calendar, 4 invite your team, 5 preferences, 6 review &amp; finish. some early records counted from the first step after signup — session 2&#x27;s raw notes call the calendar step &quot;step 2&quot;, and the sessions 1–3 topline originally called the invite step &quot;step 3&quot;. those refer to the same steps as above: step 3 is always &quot;connect calendar&quot;, and step 4 is always &quot;invite your team&quot;. evidence sourced from raw/2026-01-19-onboarding-usability-test/ — 6 participants, moderated usability sessions, jan 19–23 2026. in sessions 1–3, 2 of 3 participants tried to skip step 3 (&quot;connect calendar&quot;): session 1 tried to exit via the step label, and session 2 tried to skip it before hitting the &quot;required&quot; indicator. sessions 4–6 read the step as optional in the same way. the step 4 invite hesitation comes from session 3 only (&quot;i&#x27;m worried this is going to email my whole team before i&#x27;m ready&quot;). the raw notes record it as the &quot;same step 3 hesitation as session 1&quot;; it&#x27;s read as the invite step because of what the participant said (see docs/ask-audit-2026-09-27.md ). see also analytics/summaries/onboarding-funnel-dropoff.md , which reports step 3 as the largest drop-off point. the underlying funnel export isn&#x27;t in the repo (there&#x27;s no analytics/raw/ export), so it isn&#x27;t independent corroboration here. recommendation relabel step 3 to state clearly that calendar connection is required, and give visible feedback that invites (entered in step 4, &quot;invite your team&quot;) aren&#x27;t sent until the whole wizard is submitted. status synthesized feb 3, 2026, from sessions 1–6. revisit after the step 3 wording change (proposed in research-readouts/onboarding-flow-q1-readout.md ) ships and gets retested."}, {"id": "finding:patient-scheduling-chatbot", "kind": "finding", "title": "Patient Scheduling Chatbot", "date": "2025-06-17", "type": "synthesis", "status": "synthesized", "tags": ["chatbot", "patient-experience", "scheduling", "survey", "trust", "usability", "project-patient-chatbot"], "related_components": ["patient-chatbot-widget", "scheduling-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/patient-scheduling-chatbot.md", "corrections": [], "html": "<h1>Patient Scheduling Chatbot</h1>\n<h2>Overview</h2>\n<p>A patient-facing scheduling chatbot was scoped narrowly based on a trust survey (Jun 2025) and then usability tested against that scope (Jun 2025, two weeks later).</p>\n<ul><li><strong>The survey drew a sharp, useful line.</strong> 67% of patients were comfortable with an AI chatbot for scheduling/rescheduling, but comfort dropped to 22% when extended to symptom-related questions. This directly shaped the decision to scope the chatbot to logistics only and explicitly exclude symptom Q&amp;A from v1 — a scope decision the usability test then validated by not needing to test symptom-handling at all.</li><li><strong>The &quot;talk to a human&quot; escape hatch, identified as a trust prerequisite in the survey (41% of open-ended responses asked for it), failed discoverability testing.</strong> 3 of 8 usability test participants couldn&#x27;t find it — it existed only as a small text link. This is a case where a clearly-identified requirement from the survey wasn&#x27;t sufficiently weighted in the initial design.</li><li>Secondary findings: rescheduling had a lower task-success rate than new bookings (appointment-ID friction), and the bot&#x27;s &quot;overly cheerful&quot; tone was mismatched for patients scheduling around illness.</li></ul>\n<p>Recommendation: redesign the escape hatch as a persistent, prominent control (not a link) and re-test discoverability specifically before wider rollout. This chatbot would also be the non-clinical rollout most likely to run into the awareness gap noted in [rollout-and-change-management.md](rollout-and-change-management.md).</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-06-03</strong> — <a href=\"../raw/2025-06-03-survey-patient-portal-ai-chatbot-trust/session-notes.md\">Survey — Patient Trust in AI Chatbot for Scheduling</a> <em>(<code>survey</code>)</em></li><li><strong>2025-06-17</strong> — <a href=\"../raw/2025-06-17-usability-test-patient-chatbot-prototype/session-notes.md\">Usability Test — Patient Scheduling Chatbot Prototype</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Rollout &amp; Change Management](rollout-and-change-management.md)</li></ul>", "searchText": "patient scheduling chatbot chatbot patient-experience scheduling survey trust usability project-patient-chatbot patient-chatbot-widget scheduling-widget patient scheduling chatbot overview a patient-facing scheduling chatbot was scoped narrowly based on a trust survey (jun 2025) and then usability tested against that scope (jun 2025, two weeks later). the survey drew a sharp, useful line. 67% of patients were comfortable with an ai chatbot for scheduling/rescheduling, but comfort dropped to 22% when extended to symptom-related questions. this directly shaped the decision to scope the chatbot to logistics only and explicitly exclude symptom q&amp;a from v1 — a scope decision the usability test then validated by not needing to test symptom-handling at all. the &quot;talk to a human&quot; escape hatch, identified as a trust prerequisite in the survey (41% of open-ended responses asked for it), failed discoverability testing. 3 of 8 usability test participants couldn&#x27;t find it — it existed only as a small text link. this is a case where a clearly-identified requirement from the survey wasn&#x27;t sufficiently weighted in the initial design. secondary findings: rescheduling had a lower task-success rate than new bookings (appointment-id friction), and the bot&#x27;s &quot;overly cheerful&quot; tone was mismatched for patients scheduling around illness. recommendation: redesign the escape hatch as a persistent, prominent control (not a link) and re-test discoverability specifically before wider rollout. this chatbot would also be the non-clinical rollout most likely to run into the awareness gap noted in [rollout-and-change-management.md](rollout-and-change-management.md). evidence trail 2025-06-03 — survey — patient trust in ai chatbot for scheduling ( survey ) 2025-06-17 — usability test — patient scheduling chatbot prototype ( usability-test ) related findings [rollout &amp; change management](rollout-and-change-management.md)"}, {"id": "finding:prior-authorization", "kind": "finding", "title": "AI-Assisted Prior Authorization", "date": "2025-11-04", "type": "synthesis", "status": "synthesized", "tags": ["longitudinal", "prior-auth", "usability", "utilization-management", "v1", "v2", "project-prior-auth"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/prior-authorization.md", "corrections": [], "html": "<h1>AI-Assisted Prior Authorization</h1>\n<h2>Overview</h2>\n<p>AI-drafted prior authorization justifications were tested in two rounds (v1, Apr 2025; v2, Nov 2025) with the same utilization review nurse supervisor across both, which mattered for tracking whether fixes actually landed.</p>\n<ul><li><strong>v1</strong> surfaced a correctness bug (citing outdated diagnosis codes) serious enough that participants said it would likely cause payer denials — not a UX problem, a data-freshness/model fix. It also surfaced a durable requirement: nurses want inline citations to the specific chart text behind each suggestion (&quot;show your work&quot;), not just a black-box draft.</li><li><strong>v2</strong>, after both fixes landed, confirmed the outdated-code issue did not recur and that the citation feature is actively used (3 of 4 participants checked at least one citation before accepting) rather than being ignored as friction.</li><li><strong>Scope discipline held.</strong> After v1, the team limited pilot scope to &quot;straightforward&quot; cases, with the nursing supervisor helping define them, and kept complex cases out of that scope. v2 tested 2 straightforward and 2 complex cases, and confirmed complex cases still aren&#x27;t ready — validating that the scope limitation, not a rushed fix, was the right call. This same &quot;citation transparency&quot; requirement has since shown up independently in the medical coding work — see [him-coding-and-billing.md](him-coding-and-billing.md).</li><li><strong>Time savings:</strong> ~5 min vs. ~15 min manual for straightforward cases, confirmed (not just estimated) in v2.</li></ul>\n<p>Status: recommended for pilot expansion, strictly within the agreed straightforward-case scope.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-04-08</strong> — <a href=\"../raw/2025-04-08-usability-test-prior-auth-ai-v1/session-notes.md\">Usability Test — AI-Assisted Prior Authorization Drafting (v1)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-11-04</strong> — <a href=\"../raw/2025-11-04-usability-test-prior-auth-ai-v2/session-notes.md\">Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li></ul>", "searchText": "ai-assisted prior authorization longitudinal prior-auth usability utilization-management v1 v2 project-prior-auth prior-auth-drafting-panel ai-assisted prior authorization overview ai-drafted prior authorization justifications were tested in two rounds (v1, apr 2025; v2, nov 2025) with the same utilization review nurse supervisor across both, which mattered for tracking whether fixes actually landed. v1 surfaced a correctness bug (citing outdated diagnosis codes) serious enough that participants said it would likely cause payer denials — not a ux problem, a data-freshness/model fix. it also surfaced a durable requirement: nurses want inline citations to the specific chart text behind each suggestion (&quot;show your work&quot;), not just a black-box draft. v2 , after both fixes landed, confirmed the outdated-code issue did not recur and that the citation feature is actively used (3 of 4 participants checked at least one citation before accepting) rather than being ignored as friction. scope discipline held. after v1, the team limited pilot scope to &quot;straightforward&quot; cases, with the nursing supervisor helping define them, and kept complex cases out of that scope. v2 tested 2 straightforward and 2 complex cases, and confirmed complex cases still aren&#x27;t ready — validating that the scope limitation, not a rushed fix, was the right call. this same &quot;citation transparency&quot; requirement has since shown up independently in the medical coding work — see [him-coding-and-billing.md](him-coding-and-billing.md). time savings: ~5 min vs. ~15 min manual for straightforward cases, confirmed (not just estimated) in v2. status: recommended for pilot expansion, strictly within the agreed straightforward-case scope. evidence trail 2025-04-08 — usability test — ai-assisted prior authorization drafting (v1) ( usability-test ) 2025-11-04 — usability test — ai-assisted prior authorization drafting (v2, follow-up) ( usability-test ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md)"}, {"id": "finding:rollout-and-change-management", "kind": "finding", "title": "Rollout & Change Management", "date": "2025-12-02", "type": "synthesis", "status": "synthesized", "tags": ["change-management", "organizational-readiness", "pulse", "rollout", "survey", "training", "year-end", "project-cross-cutting"], "related_components": ["patient-chatbot-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/rollout-and-change-management.md", "corrections": [], "html": "<h1>Rollout &amp; Change Management</h1>\n<h2>Overview</h2>\n<p>Two sessions, five weeks apart at year-end, look at how Compass AI features actually get adopted once built: a training/change-management interview (Oct 2025) and an all-staff AI readiness pulse survey (Dec 2025).</p>\n<ul><li><strong>The training interview drew directly on a documented past failure.</strong> The 2022 CDS alert rollout — referenced independently by executives back in January (see [governance-and-phi.md](governance-and-phi.md)) — is treated as the cautionary tale: a single 20-minute training video with no hands-on practice, and adoption suffered. The Director of Training&#x27;s recommendation is a &quot;unit champion&quot; model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time, and to avoid rolling out during flu season (Nov-Feb) given historical attendance patterns.</li><li><strong>The December pulse survey found an awareness gap that changes rollout sequencing for non-clinical features specifically</strong>: only 34% of non-clinical/admin staff were aware Compass AI work was even underway, vs. 71% of clinical staff. This matters directly for the patient scheduling chatbot (see [patient-scheduling-chatbot.md](patient-scheduling-chatbot.md)), which is the first admin-facing, non-clinical feature nearing rollout — communications need to reach that audience before launch, not after.</li><li>The survey&#x27;s directional sentiment comparison to the February 2025 nursing attitudes survey is noted but flagged as not a clean apples-to-apples comparison (different question wording). The survey recommends re-running the exact February instrument if a clean trend is needed.</li></ul>\n<p>Recommendation: use the unit-champion training model for the ambient scribe GA rollout (avoiding flu-season timing), and run a dedicated non-clinical-staff communications push before the scheduling chatbot goes live.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-10-21</strong> — <a href=\"../raw/2025-10-21-interview-training-department-rollout-change-management/session-notes.md\">Interview — Training &amp; Education Dept on Rollout/Change Management Planning</a> <em>(<code>interview</code>)</em></li><li><strong>2025-12-02</strong> — <a href=\"../raw/2025-12-02-survey-allstaff-ai-readiness-pulse/session-notes.md\">Survey — All-Staff AI Readiness Pulse Survey</a> <em>(<code>survey</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li><li>[Ambient AI Scribe](ambient-scribe.md)</li></ul>", "searchText": "rollout & change management change-management organizational-readiness pulse rollout survey training year-end project-cross-cutting patient-chatbot-widget rollout &amp; change management overview two sessions, five weeks apart at year-end, look at how compass ai features actually get adopted once built: a training/change-management interview (oct 2025) and an all-staff ai readiness pulse survey (dec 2025). the training interview drew directly on a documented past failure. the 2022 cds alert rollout — referenced independently by executives back in january (see [governance-and-phi.md](governance-and-phi.md)) — is treated as the cautionary tale: a single 20-minute training video with no hands-on practice, and adoption suffered. the director of training&#x27;s recommendation is a &quot;unit champion&quot; model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time, and to avoid rolling out during flu season (nov-feb) given historical attendance patterns. the december pulse survey found an awareness gap that changes rollout sequencing for non-clinical features specifically : only 34% of non-clinical/admin staff were aware compass ai work was even underway, vs. 71% of clinical staff. this matters directly for the patient scheduling chatbot (see [patient-scheduling-chatbot.md](patient-scheduling-chatbot.md)), which is the first admin-facing, non-clinical feature nearing rollout — communications need to reach that audience before launch, not after. the survey&#x27;s directional sentiment comparison to the february 2025 nursing attitudes survey is noted but flagged as not a clean apples-to-apples comparison (different question wording). the survey recommends re-running the exact february instrument if a clean trend is needed. recommendation: use the unit-champion training model for the ambient scribe ga rollout (avoiding flu-season timing), and run a dedicated non-clinical-staff communications push before the scheduling chatbot goes live. evidence trail 2025-10-21 — interview — training &amp; education dept on rollout/change management planning ( interview ) 2025-12-02 — survey — all-staff ai readiness pulse survey ( survey ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md) [ambient ai scribe](ambient-scribe.md)"}, {"id": "finding:scope-boundaries-and-workflow-fit", "kind": "finding", "title": "Scope Boundaries & Workflow Fit", "date": "2026-09-08", "type": "synthesis", "status": "synthesized", "tags": ["42-cfr-part-2", "authentication", "baseline", "behavioral-health", "clinician-workflow", "ed", "high-acuity", "intake", "mfa", "phi", "security", "sensitive-notes", "sso", "workflow", "project-cross-cutting"], "related_components": ["ambient-scribe-widget", "ed-intake-form", "sso-mfa-login"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/scope-boundaries-and-workflow-fit.md", "corrections": [], "html": "<h1>Scope Boundaries &amp; Workflow Fit</h1>\n<h2>Overview</h2>\n<p>Three 2025 sessions, plus two 2026 HIM interviews that refine a release-of-information (ROI) boundary first set in the July 2025 HIM research, are grouped here because their common output was a &quot;don&#x27;t build this yet, or don&#x27;t build it here&quot; conclusion. The December executive retro praised this kind of scope discipline in general (&quot;The stuff you told us not to build yet mattered as much as the stuff you told us to build&quot;), but the only exclusions it named were behavioral health (covered below) and complex prior-auth cases (not part of this finding). It did not discuss the ED intake or SSO/MFA boundaries, or the ROI redaction boundary below, which dates from the July 2025 HIM research; only the 2026 evidence added to that boundary postdates the retro.</p>\n<ul><li><strong>ED intake (contextual inquiry, Apr 2025):</strong> peak-hour interruption frequency (every 2-4 minutes) makes any AI tool requiring sustained review attention a poor fit for ED intake nurses specifically during peak windows. The one positive signal — insurance-card-photo pre-fill for registration clerks — was carved out as a smaller, separate, lower-risk candidate instead.</li><li><strong>SSO/MFA modernization (interview, May 2025):</strong> independent of any AI feature, a planned 15-minute forced re-authentication conflicts with clinical ops&#x27; expectation of a 4-hour session — and nobody had yet defined what happens to an in-progress ambient scribe recording session if a forced re-auth interrupts it mid-visit. This was flagged as an unhandled edge case for the ambient scribe team (see [ambient-scribe.md](ambient-scribe.md)) rather than something to solve in this session. The 15-minute figure was a <em>planned</em> policy that was still disputed as of May</li></ul>\n<ol><li>By Feb 2026, IT Security described a 10-minute idle timeout as fixed policy (see [ambient-scribe-post-ga-refinements.md](ambient-scribe-post-ga-refinements.md)). The raw notes don&#x27;t say whether that settles this dispute or is a separate idle-lock setting.</li></ol>\n<ul><li><strong>Behavioral health (contextual inquiry, Oct 2025):</strong> reiterated, independently, the same &quot;no structured way to flag a 42 CFR Part 2-protected note&quot; platform gap first identified in the July HIM research (see [him-coding-and-billing.md](him-coding-and-billing.md)), which HIM found unchanged in March 2026 (2026-03-31, HIGH) — and added a harder constraint on top: any AI tool listening to or drafting behavioral health notes needs a dedicated legal/consent review that hasn&#x27;t started yet. This population was formally excluded from the near-term ambient scribe rollout as a result.</li><li><strong>ROI redaction (HIM research, Jul 2025; refined Mar and Sep 2026):</strong> the suggest-only boundary set in July 2025 (see [him-coding-and-billing.md](him-coding-and-billing.md)) held in 2026: a person redacts and a person releases every record. Within it, an ROI specialist would accept batch pre-highlighting only for low-risk requests where patients ask for their own records; attorney, insurer and possible Part 2 requests are excluded from batch handling and stay one at a time (2026-09-08, HIGH). An HIM supervisor said the backlog sits in the second-level Part 2 review queue rather than first-pass redaction, so any redaction assistance should be designed around that queue (2026-03-31, MEDIUM).</li></ul>\n<p>Recommendation: keep these four exclusions as explicit, documented scope boundaries in the 2026 roadmap rather than informal assumptions that could quietly erode. This is this finding&#x27;s recommendation, not a retro action item — the retro&#x27;s own recommendations were a formal metrics document and a cross-cutting findings section.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-04-22</strong> — <a href=\"../raw/2025-04-22-contextual-inquiry-ed-intake-shadowing/session-notes.md\">Contextual Inquiry — Emergency Department Intake Shadowing</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-05-20</strong> — <a href=\"../raw/2025-05-20-interview-it-security-sso-mfa-modernization/session-notes.md\">Interview — IT Security on SSO/MFA Modernization Impact</a> <em>(<code>interview</code>)</em></li><li><strong>2025-10-07</strong> — <a href=\"../raw/2025-10-07-contextual-inquiry-behavioral-health-sensitive-notes/session-notes.md\">Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-12-16</strong> — <a href=\"../raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md\">Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</a> <em>(<code>interview</code>)</em> — cited for the scope-discipline praise only</li><li><strong>2026-03-31</strong> — <a href=\"../raw/2026-03-31-interview-him-supervisor-roi-volume-and-part-2/session-notes.md\">Interview — HIM Supervisor on ROI Volume and Part 2 Handling</a> <em>(<code>interview</code>)</em></li><li><strong>2026-09-08</strong> — <a href=\"../raw/2026-09-08-interview-him-specialist-roi-request-turnaround/session-notes.md\">Interview — HIM Specialist on ROI Request Turnaround</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li></ul>", "searchText": "scope boundaries & workflow fit 42-cfr-part-2 authentication baseline behavioral-health clinician-workflow ed high-acuity intake mfa phi security sensitive-notes sso workflow project-cross-cutting ambient-scribe-widget ed-intake-form sso-mfa-login scope boundaries &amp; workflow fit overview three 2025 sessions, plus two 2026 him interviews that refine a release-of-information (roi) boundary first set in the july 2025 him research, are grouped here because their common output was a &quot;don&#x27;t build this yet, or don&#x27;t build it here&quot; conclusion. the december executive retro praised this kind of scope discipline in general (&quot;the stuff you told us not to build yet mattered as much as the stuff you told us to build&quot;), but the only exclusions it named were behavioral health (covered below) and complex prior-auth cases (not part of this finding). it did not discuss the ed intake or sso/mfa boundaries, or the roi redaction boundary below, which dates from the july 2025 him research; only the 2026 evidence added to that boundary postdates the retro. ed intake (contextual inquiry, apr 2025): peak-hour interruption frequency (every 2-4 minutes) makes any ai tool requiring sustained review attention a poor fit for ed intake nurses specifically during peak windows. the one positive signal — insurance-card-photo pre-fill for registration clerks — was carved out as a smaller, separate, lower-risk candidate instead. sso/mfa modernization (interview, may 2025): independent of any ai feature, a planned 15-minute forced re-authentication conflicts with clinical ops&#x27; expectation of a 4-hour session — and nobody had yet defined what happens to an in-progress ambient scribe recording session if a forced re-auth interrupts it mid-visit. this was flagged as an unhandled edge case for the ambient scribe team (see [ambient-scribe.md](ambient-scribe.md)) rather than something to solve in this session. the 15-minute figure was a planned policy that was still disputed as of may by feb 2026, it security described a 10-minute idle timeout as fixed policy (see [ambient-scribe-post-ga-refinements.md](ambient-scribe-post-ga-refinements.md)). the raw notes don&#x27;t say whether that settles this dispute or is a separate idle-lock setting. behavioral health (contextual inquiry, oct 2025): reiterated, independently, the same &quot;no structured way to flag a 42 cfr part 2-protected note&quot; platform gap first identified in the july him research (see [him-coding-and-billing.md](him-coding-and-billing.md)), which him found unchanged in march 2026 (2026-03-31, high) — and added a harder constraint on top: any ai tool listening to or drafting behavioral health notes needs a dedicated legal/consent review that hasn&#x27;t started yet. this population was formally excluded from the near-term ambient scribe rollout as a result. roi redaction (him research, jul 2025; refined mar and sep 2026): the suggest-only boundary set in july 2025 (see [him-coding-and-billing.md](him-coding-and-billing.md)) held in 2026: a person redacts and a person releases every record. within it, an roi specialist would accept batch pre-highlighting only for low-risk requests where patients ask for their own records; attorney, insurer and possible part 2 requests are excluded from batch handling and stay one at a time (2026-09-08, high). an him supervisor said the backlog sits in the second-level part 2 review queue rather than first-pass redaction, so any redaction assistance should be designed around that queue (2026-03-31, medium). recommendation: keep these four exclusions as explicit, documented scope boundaries in the 2026 roadmap rather than informal assumptions that could quietly erode. this is this finding&#x27;s recommendation, not a retro action item — the retro&#x27;s own recommendations were a formal metrics document and a cross-cutting findings section. evidence trail 2025-04-22 — contextual inquiry — emergency department intake shadowing ( contextual-inquiry ) 2025-05-20 — interview — it security on sso/mfa modernization impact ( interview ) 2025-10-07 — contextual inquiry — behavioral health unit, sensitive note handling ( contextual-inquiry ) 2025-12-16 — executive steering committee — year-end retro &amp; 2026 roadmap input ( interview ) — cited for the scope-discipline praise only 2026-03-31 — interview — him supervisor on roi volume and part 2 handling ( interview ) 2026-09-08 — interview — him specialist on roi request turnaround ( interview ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md)"}, {"id": "component:admin-console-grid", "kind": "component", "title": "Admin Console Data Grid (Legacy ExtJS)", "date": "Figma (via sync_fig on is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments.</li></ul>\n<h2>Open questions</h2>\n<ul><li>Is the physician/resident adoption gap a training gap, a trust gap, or a workflow difference? Dashboard data alone can&#x27;t answer this — flagged as a candidate for a short follow-up interview round.</li></ul>", "searchText": "ambient scribe ga candidate — first 4 weeks adoption topline ambient-scribe ga-release dashboard longitudinal project-ambient-scribe quick takeaways covers the first 4 weeks of ga-candidate rollout, per the 2026-01-27 dashboard review ( raw/2026-01-27-dashboard-review-ambient-scribe-ga-adoption/ ). clinicians shown confidence highlighting skim high-confidence lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the ga-candidate usability finding that visible uncertainty, not raw accuracy, changes reviewing behavior. adoption is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments. open questions is the physician/resident adoption gap a training gap, a trust gap, or a workflow difference? dashboard data alone can&#x27;t answer this — flagged as a candidate for a short follow-up interview round."}, {"id": "deliverable:topline-summaries/example-topline-summary", "kind": "deliverable", "title": "Onboarding Study — Session 1–3 Topline", "date": "2026-01-21", "type": "topline-summaries", "status": "final", "tags": ["onboarding", "usability", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../topline-summaries/example-topline-summary.md", "corrections": [], "html": "<h2>Quick takeaways</h2>\n<p>Sourced from <code>raw/2026-01-19-onboarding-usability-test/</code>, sessions 1–3.</p>\n<ul><li>1 of 3 (session 3) hesitated before inviting the team — worried invites would email the whole team before they were ready.</li><li>2 of 3 tried to skip step 3 (&quot;Connect calendar&quot;) entirely, assuming it was optional even though it&#x27;s required.</li></ul>\n<h2>Open questions</h2>\n<ul><li>Is the step-4 (invite) hesitation about wording, or about not trusting the system yet this early in the relationship? Watch for this in sessions 4–6.</li></ul>", "searchText": "onboarding study — session 1–3 topline onboarding usability project-onboarding quick takeaways sourced from raw/2026-01-19-onboarding-usability-test/ , sessions 1–3. 1 of 3 (session 3) hesitated before inviting the team — worried invites would email the whole team before they were ready. 2 of 3 tried to skip step 3 (&quot;connect calendar&quot;) entirely, assuming it was optional even though it&#x27;s required. open questions is the step-4 (invite) hesitation about wording, or about not trusting the system yet this early in the relationship? watch for this in sessions 4–6."}, {"id": "deliverable:research-readouts/onboarding-flow-q1-readout", "kind": "deliverable", "title": "Onboarding Flow — Q1 Readout", "date": "2026-02-02", "type": "research-readouts", "status": "final", "tags": ["onboarding", "readout", "q1", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../research-readouts/onboarding-flow-q1-readout.md", "corrections": [], "html": "<h2>Summary</h2>\n<p>Across all 6 onboarding usability sessions (Jan 19-23, 2026), the most consistently observed first-time-setup friction is step 3 (&quot;Connect calendar&quot;) reading as optional when it&#x27;s actually required — 2 of 3 participants in sessions 1-3 attempted to skip it outright, and sessions 4-6 read it as optional in the same way. The funnel summary (<code>analytics/summaries/onboarding-funnel-dropoff.md</code>) reports step 3 as the largest drop-off point, but the underlying export isn&#x27;t in the repo.</p>\n<h2>Key findings</h2>\n<ul><li>Step 3&#x27;s wording implies an optionality it doesn&#x27;t have — see finding <code>onboarding</code>.</li><li>The step 3 drop-off in the funnel summary is consistent with users misreading the step as optional; funnel data alone can&#x27;t show why users drop off.</li></ul>\n<h2>Recommendations</h2>\n<ol><li>Relabel step 3 to state plainly that calendar connection is required before later functionality works.</li><li>Give visible feedback that invites (entered in step 4, &quot;Invite your team&quot;) aren&#x27;t sent until the whole wizard is submitted — addressing a related hesitation seen in session 3.</li><li>Retest step 3 specifically once the wording change ships, per <code>research/findings/onboarding.md</code>&#x27;s status note.</li></ol>", "searchText": "onboarding flow — q1 readout onboarding readout q1 project-onboarding summary across all 6 onboarding usability sessions (jan 19-23, 2026), the most consistently observed first-time-setup friction is step 3 (&quot;connect calendar&quot;) reading as optional when it&#x27;s actually required — 2 of 3 participants in sessions 1-3 attempted to skip it outright, and sessions 4-6 read it as optional in the same way. the funnel summary ( analytics/summaries/onboarding-funnel-dropoff.md ) reports step 3 as the largest drop-off point, but the underlying export isn&#x27;t in the repo. key findings step 3&#x27;s wording implies an optionality it doesn&#x27;t have — see finding onboarding . the step 3 drop-off in the funnel summary is consistent with users misreading the step as optional; funnel data alone can&#x27;t show why users drop off. recommendations relabel step 3 to state plainly that calendar connection is required before later functionality works. give visible feedback that invites (entered in step 4, &quot;invite your team&quot;) aren&#x27;t sent until the whole wizard is submitted — addressing a related hesitation seen in session 3. retest step 3 specifically once the wording change ships, per research/findings/onboarding.md &#x27;s status note."}, {"id": "deliverable:heuristic-evaluations/ambient-scribe-encounter-view-pre-ga", "kind": "deliverable", "title": "Ambient Scribe Encounter-View — Heuristic Evaluation (Pre-GA)", "date": "2025-12-20", "type": "heuristic-evaluations", "status": "final", "tags": ["ambient-scribe", "heuristic-evaluation", "sso", "mfa", "documentation", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": "Jordan Lee", "reviewed_by": null, "path": "../heuristic-evaluations/ambient-scribe-encounter-view-pre-ga.md", "corrections": [], "html": "<h2>Scope</h2>\n<p>Expert review of <code>encounter-view</code> and <code>ambient-scribe-widget</code> against Nielsen&#x27;s heuristics, conducted ahead of the GA-candidate usability round to catch structural issues that moderated testing might miss until much later.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>Heuristic violated</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Session lock during active dictation gives no distinct state — reads identically to an idle timeout with nothing in progress</td><td>Visibility of system status</td><td>3</td><td><code>encounter-view</code>, locked state</td></tr><tr><td>The generic low-confidence underline is the only signal for both &quot;uncertain transcription&quot; and &quot;medication name worth double-checking&quot;</td><td>Recognition rather than recall</td><td>2</td><td><code>ambient-scribe-widget</code>, confidence-highlighted variant</td></tr><tr><td>No way to tell a paused-but-preserved draft from a discarded one without re-authenticating first</td><td>Visibility of system status</td><td>3</td><td><code>encounter-view</code>, locked state</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Prioritize the session-lock state — it&#x27;s a trust-eroding false signal, not a cosmetic gap, and this expert-review pass predates any direct observation of clinician impact. Flag the confidence-signal overload as worth a dedicated concept test before shipping any new flag type on top of the existing generic variant.</p>\n<h2>Related Findings</h2>\n<ul><li><a href=\"../research/findings/ambient-scribe-post-ga-refinements.md\">Ambient Scribe — Post-GA Refinements</a></li></ul>", "searchText": "ambient scribe encounter-view — heuristic evaluation (pre-ga) ambient-scribe heuristic-evaluation sso mfa documentation project-ambient-scribe scope expert review of encounter-view and ambient-scribe-widget against nielsen&#x27;s heuristics, conducted ahead of the ga-candidate usability round to catch structural issues that moderated testing might miss until much later. issues found issue heuristic violated severity location session lock during active dictation gives no distinct state — reads identically to an idle timeout with nothing in progress visibility of system status 3 encounter-view , locked state the generic low-confidence underline is the only signal for both &quot;uncertain transcription&quot; and &quot;medication name worth double-checking&quot; recognition rather than recall 2 ambient-scribe-widget , confidence-highlighted variant no way to tell a paused-but-preserved draft from a discarded one without re-authenticating first visibility of system status 3 encounter-view , locked state recommendations prioritize the session-lock state — it&#x27;s a trust-eroding false signal, not a cosmetic gap, and this expert-review pass predates any direct observation of clinician impact. flag the confidence-signal overload as worth a dedicated concept test before shipping any new flag type on top of the existing generic variant. related findings ambient scribe — post-ga refinements"}, {"id": "deliverable:heuristic-evaluations/example-heuristic-evaluation", "kind": "deliverable", "title": "Onboarding Wizard — Heuristic Evaluation", "date": "2026-02-05", "type": "heuristic-evaluations", "status": "final", "tags": ["onboarding", "heuristic-evaluation", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": "Jordan Lee", "reviewed_by": null, "path": "../heuristic-evaluations/example-heuristic-evaluation.md", "corrections": [], "html": "<h2>Scope</h2>\n<p>Full onboarding wizard, steps 1–6, desktop web only.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>Heuristic violated</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Step 3 wording implies &quot;connect calendar&quot; is optional when it&#x27;s required</td><td>Match between system and real world</td><td>3</td><td>Step 3</td></tr><tr><td>No way to go back without losing entered data</td><td>User control and freedom</td><td>3</td><td>Steps 2–5</td></tr><tr><td>Progress indicator doesn&#x27;t reflect actual step count on mobile</td><td>Consistency and standards</td><td>2</td><td>Sidebar, mobile view</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Prioritize the step 3 wording fix (matches usability study finding) and the back-navigation data-loss issue before the mobile indicator fix.</p>", "searchText": "onboarding wizard — heuristic evaluation onboarding heuristic-evaluation project-onboarding scope full onboarding wizard, steps 1–6, desktop web only. issues found issue heuristic violated severity location step 3 wording implies &quot;connect calendar&quot; is optional when it&#x27;s required match between system and real world 3 step 3 no way to go back without losing entered data user control and freedom 3 steps 2–5 progress indicator doesn&#x27;t reflect actual step count on mobile consistency and standards 2 sidebar, mobile view recommendations prioritize the step 3 wording fix (matches usability study finding) and the back-navigation data-loss issue before the mobile indicator fix."}, {"id": "deliverable:accessibility-screenings/example-accessibility-screening", "kind": "deliverable", "title": "Onboarding Wizard — Accessibility Screening", "date": "2026-02-06", "type": "accessibility-screenings", "status": "final", "tags": ["onboarding", "accessibility", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../accessibility-screenings/example-accessibility-screening.md", "corrections": [], "html": "<h2>Scope</h2>\n<p>Onboarding wizard, steps 1–6, screened against WCAG 2.1 AA using keyboard-only navigation and VoiceOver.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>WCAG criterion</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Calendar-connect button has no accessible label, reads as &quot;button&quot;</td><td>4.1.2 Name, Role, Value</td><td>High</td><td>Step 3</td></tr><tr><td>Focus order skips the &quot;Skip this step&quot; link</td><td>2.4.3 Focus Order</td><td>Medium</td><td>Step 3</td></tr><tr><td>Error message color contrast is 3.2:1, below the 4.5:1 minimum</td><td>1.4.3 Contrast (Minimum)</td><td>Medium</td><td>Steps 2, 4</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Fix the calendar-connect button label first — it&#x27;s a full blocker for screen-reader users completing the required step.</p>", "searchText": "onboarding wizard — accessibility screening onboarding accessibility project-onboarding scope onboarding wizard, steps 1–6, screened against wcag 2.1 aa using keyboard-only navigation and voiceover. issues found issue wcag criterion severity location calendar-connect button has no accessible label, reads as &quot;button&quot; 4.1.2 name, role, value high step 3 focus order skips the &quot;skip this step&quot; link 2.4.3 focus order medium step 3 error message color c rovisioning, and calendar OAuth.</p>\n<h2>Map</h2>\n<p>Signup form -&gt; Account Service (sync) -&gt; Workspace Provisioning (async, ~8s average) -&gt; Calendar OAuth (external, Google/Outlook) -&gt; Invite Service (sends on submit, not on step completion — this is the source of the step-4 (&quot;Invite your team&quot;) &quot;does this send now?&quot; confusion identified in the usability study).</p>", "searchText": "onboarding & account provisioning — service topology onboarding service-blueprint project-onboarding overview maps the onboarding wizard&#x27;s front-end steps against the backend services they trigger: account creation, workspace provisioning, and calendar oauth. map signup form -&gt; account service (sync) -&gt; workspace provisioning (async, ~8s average) -&gt; calendar oauth (external, google/outlook) -&gt; invite service (sends on submit, not on step completion — this is the source of the step-4 (&quot;invite your team&quot;) &quot;does this send now?&quot; confusion identified in the usability study)."}, {"id": "deliverable:service-topology/prior-auth-drafting-v2", "kind": "deliverable", "title": "AI-Assisted Prior Authorization Drafting — Service Topology (v2)", "date": "2025-11-20", "type": "service-topology", "status": "final", "tags": ["prior-auth", "utilization-management", "v2", "service-blueprint", "project-prior-auth"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../service-topology/prior-auth-drafting-v2.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Maps the <code>prior-auth-drafting-panel</code> front end against the backend it actually depends on, drawn up after v2 testing confirmed the citation feature is actively used rather than ignored as friction.</p>\n<h2>Map</h2>\n<p>Encounter chart -&gt; Chart-Data Service (pulls diagnosis/treatment history) -&gt; Drafting Model (generates justification text + inline citations back to specific chart spans) -&gt; Payer-Rules Lookup (validates against current, not cached, diagnosis codes — the fix that closed the v1 data-freshness bug) -&gt; UM Review Queue (nurse accepts/edits/rejects) -&gt; Submission Service. Citation links resolve to specific chart-text spans rather than section headers, which is why nurses could meaningfully check at least one citation before accepting in v2.</p>\n<p>Recommendation status: supports the &quot;pilot expansion&quot; recommendation in <code>prior-authorization.md</code> — the data-freshness fix is now a tracked backend dependency, not just a UI note, and should stay visible as one before expanding beyond straightforward cases.</p>", "searchText": "ai-assisted prior authorization drafting — service topology (v2) prior-auth utilization-management v2 service-blueprint project-prior-auth overview maps the prior-auth-drafting-panel front end against the backend it actually depends on, drawn up after v2 testing confirmed the citation feature is actively used rather than ignored as friction. map encounter chart -&gt; chart-data service (pulls diagnosis/treatment history) -&gt; drafting model (generates justification text + inline citations back to specific chart spans) -&gt; payer-rules lookup (validates against current, not cached, diagnosis codes — the fix that closed the v1 data-freshness bug) -&gt; um review queue (nurse accepts/edits/rejects) -&gt; submission service. citation links resolve to specific chart-text spans rather than section headers, which is why nurses could meaningfully check at least one citation before accepting in v2. recommendation status: supports the &quot;pilot expansion&quot; recommendation in prior-authorization.md — the data-freshness fix is now a tracked backend dependency, not just a ui note, and should stay visible as one before expanding beyond straightforward cases."}, {"id": "deliverable:personas/dana-overwhelmed-new-admin", "kind": "deliverable", "title": "Dana — The Overwhelmed New Admin", "date": "2026-02-12", "type": "personas", "status": "final", "tags": ["onboarding", "persona", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../personas/dana-overwhelmed-new-admin.md", "corrections": [], "html": "<h2>Summary</h2>\n<p>Dana, 34, Office Manager at a 40-person company. Just been handed Fernway setup as &quot;one more thing&quot; on top of her regular job. Not technical, but capable — she just doesn&#x27;t have time to figure things out by trial and error.</p>\n<h2>Goals</h2>\n<ul><li>Get the team up and running with minimal back-and-forth.</li><li>Avoid looking like she broke something in front of her team.</li></ul>\n<h2>Frustrations</h2>\n<ul><li>Steps that don&#x27;t clearly say what&#x27;s required vs. optional.</li><li>No way to preview what happens before committing to an action.</li></ul>\n<h2>Based on</h2>\n<p>Grounded in <code>research-plans/onboarding-usability-study-q1.md</code>, sessions 1–6.</p>", "searchText": "dana — the overwhelmed new admin onboarding persona project-onboarding summary dana, 34, office manager at a 40-person company. just been handed fernway setup as &quot;one more thing&quot; on top of her regular job. not technical, but capable — she just doesn&#x27;t have time to figure things out by trial and error. goals get the team up and running with minimal back-and-forth. avoid looking like she broke something in front of her team. frustrations steps that don&#x27;t clearly say what&#x27;s required vs. optional. no way to preview what happens before committing to an action. based on grounded in research-plans/onboarding-usability-study-q1.md , sessions 1–6."}, {"id": "deliverable:personas/physician-longitudinal-scribe-user", "kind": "deliverable", "title": "The Longitudinal Physician — Ambient Scribe", "date": "2026-02-26", "type": "personas", "status": "final", "tags": ["ambient-scribe", "persona", "longitudinal", "trust-in-ai", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../personas/physician-longitudinal-scribe-user.md", "corrections": [], "html": "<h1>The Longitudinal Physician — Ambient Scribe</h1>\n<h2>Summary</h2>\n<p><strong>Evidence basis:</strong> Observed (v0.1 to GA candidate, from P09 in <code>raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md:36-37</code>, <code>raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md:36-37</code> and <code>raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:36-37</code>); inferred (post-GA stage, second and third goals and both frustrations, from other participants in <code>raw/2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md:51-57</code> and <code>raw/2026-02-17-session-lock-during-dictation/session-notes.md:54-60</code>).</p>\n<p>Modeled on P09 (Internal Medicine), one of the 3 participants who returned from v0.1 for v0.2, and the one confirmed in all three ambient-scribe testing rounds — v0.1 (Feb 2025), v0.2 (Sep 2025), and the GA candidate (Jan 2026). Represents the clinician whose relationship with the tool has actually changed over a year of iteration, not a first-time impression.</p>\n<h2>Goals</h2>\n<ul><li>Trust the tool enough to stop reading every generated line, without trusting it blindly. <em>(P09, v0.1 to GA candidate)</em></li><li>Catch the specific error types that matter clinically (medication names) rather than treating all uncertainty as equally worth flagging. <em>(Inferred from P22, 2026-02-10; not observed for P09)</em></li><li>Not lose work to session/security interruptions that are unrelated to the clinical task. <em>(Inferred from P119 and P33, 2026-02-17; not observed for P09)</em></li></ul>\n<h2>What changed for this persona, round over round</h2>\n<ul><li><strong>v0.1 → v0.2:</strong> Accuracy improved, but reading behavior didn&#x27;t — still read every line, despite fewer errors to catch.</li><li><strong>v0.2 → GA candidate:</strong> The first behavior change came from <em>visible uncertainty</em> (per-line confidence highlighting), not from further accuracy gains — this persona began skimming high-confidence lines for the first time.</li><li><strong>Post-GA (Feb 2026, inferred from other participants):</strong> The next trust lever is specificity, not just visibility — a distinct medication-safety flag reads as more actionable than generic low confidence, but risks over-trusting anything left unflagged if that distinction isn&#x27;t actively managed in the UI. This is not P09&#x27;s observed experience: it comes from P22 and P24 in the 2026-02-10 concept test.</li></ul>\n<h2>Frustrations</h2>\n<ul><li>Generic &quot;low confidence&quot; signals don&#x27;t tell this persona <em>what kind</em> of thing to double-check. <em>(Inferred from P22, 2026-02-10)</em></li><li>Session locks during dictation currently look identical to data loss, which erodes trust in the tool independent of transcription accuracy itself. <em>(Inferred from P119 and P33, 2026-02-17)</em></li></ul>\n<h2>Based on</h2>\n<p>P09&#x27;s sessions in the three ambient-scribe test rounds (2025-02-25, 2025-09-23, 2026-01-13). The post-GA stage, the second and third goals and both frustrations come from other participants in the 2026-02-10 medication-flag concept test and the 2026-02-17 session-lock contextual inquiry; no raw session places P09 in either.</p>", "searchText": "the longitudinal physician — ambient scribe ambient-scribe persona longitudinal trust-in-ai project-ambient-scribe the longitudinal physician — ambient scribe summary evidence basis: observed (v0.1 to ga candidate, from p09 in raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md:36-37
