ing auditor agreed the metadata should stay off the permanent chart, but said &quot;internal&quot; has to include the people who audit codes, not only it (2026-04-21, high). they also want a per-code record of what an ai coding suggester suggested and what the coder did with it treated as release-blocking (critical; see [him-coding-and-billing.md](him-coding-and-billing.md)). an roi specialist didn&#x27;t know whether the scribe&#x27;s drafts or transcripts are part of the designated record set or legal record, or whether a requester could ask for them, and had had no roi guidance on it since ga. one attorney&#x27;s request for &quot;all versions and drafts&quot; of a visit note was escalated, and they didn&#x27;t hear how it was resolved (2026-06-02, high). two items still need to move from &quot;informally agreed in a meeting&quot; to an actual governance document: the 2026 headline metrics, and the ai-content attestation model. ratifying the attestation model now also has to settle who can read the internal audit log and whether scribe generation metadata is part of the designated record set. evidence trail 2025-01-14 — ai strategy kickoff — executive alignment interview ( interview ) 2025-03-24 — interview — privacy/compliance officer on de-identification &amp; audit trail requirements ( interview ) 2025-08-12 — interview — cmio on governance for ai-generated content in the legal record ( interview ) 2025-12-16 — executive steering committee — year-end retro &amp; 2026 roadmap input ( interview ) 2026-04-21 — interview — coding auditor on override tracking and audit trail ( interview ) 2026-06-02 — interview — him specialist on releasing ai-drafted notes ( interview ) related findings [ambient ai scribe](ambient-scribe.md) [scope boundaries &amp; workflow fit](scope-boundaries-and-workflow-fit.md) [ambient scribe — post-ga refinements](ambient-scribe-post-ga-refinements.md) [him: coding, billing &amp; release of information](him-coding-and-billing.md)"}, {"id": "finding:him-coding-and-billing", "kind": "finding", "title": "HIM: Coding, Billing & Release of Information", "date": "2026-10-06", "type": "synthesis", "status": "synthesized", "tags": ["42-cfr-part-2", "ai-generated-content", "audit-trail", "billing", "coding", "compliance", "documentation", "him", "phi", "release-of-information", "training", "trust-in-ai", "usability", "workflow", "project-him"], "related_components": ["coding-suggestion-panel", "roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/him-coding-and-billing.md", "corrections": [], "html": "<h1>HIM: Coding, Billing &amp; Release of Information</h1>\n<h2>Overview</h2>\n<p>Two contextual/usability sessions in HIM (July 2025) surfaced a shared theme — extremely low risk tolerance for anything that could look like automated judgment on a compliance-sensitive task — from two different angles: release-of-information redaction, and AI-assisted medical coding. Ten follow-up interviews (March–October 2026, after the ambient scribe&#x27;s January 2026 GA) refine both threads; see &quot;Since GA&quot; below.</p>\n<ul><li><strong>Release of information (contextual inquiry) is the higher-stakes of the two.</strong> Staff described ROI as the one area where a mistake has caused real incidents (wrong record released, or behavioral-health notes not correctly given the stricter 42 CFR Part 2 handling). Any AI assistance here would need to be &quot;suggest and highlight for human review only,&quot; never auto-redact-and-release. This session also surfaced a standalone platform gap — there&#x27;s no structured way to flag a note as Part 2-protected in the EHR — that recurred again independently in the October behavioral health research (see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md)) and was found unchanged in ROI (March 2026) and on the coding side (August 2026), making it a gap confirmed in three threads (ROI, behavioral health and coding) worth fixing regardless of any AI plans.</li><li><strong>AI-assisted coding suggestions (usability test) surfaced the same underlying concern in a different shape</strong>: the senior coder&#x27;s objection wasn&#x27;t accuracy (suggestions matched the coder&#x27;s own independent choice in 14 of 20 test scenarios) but audit posture — they wanted it explicit in the UI and audit log that the human coder made the final call, to avoid the suggestion looking like it steered toward upcoding. This is the same &quot;show your work&quot; / attribution-of-decision pattern seen in prior authorization testing (see [prior-authorization.md](prior-authorization.md)).</li></ul>\n<p>Recommendation: any AI feature touching this department needs an explicit, audit-log-visible human-decision boundary as a baseline requirement, not a design nicety — this shows up whether the task is redaction, coding, or (per the prior-auth findings) authorization drafting. The 2026 interviews show the boundary is necessary but not sufficient on its own: it has to come with productivity targets that don&#x27;t reward unreviewed acceptance, and with someone who can see each coder&#x27;s decisions (see below).</p>\n<h2>Since GA: 2026 Follow-up Interviews</h2>\n<p>Ten 1:1 interviews between March and October 2026 (P120–P129, each new to this research) revisited both threads after the ambient scribe went GA. Neither the coding suggester nor an ROI redaction tool has been built or piloted, so reactions to the suggester come from walkthroughs of the July 2025 screens. The only CRITICAL finding in the 2026 set is on coding: a coding auditor would recommend Compliance not sign off on the suggester without a per-code decision record (2026-04-21). That refines rather than replaces the ROI point above: the Part 2 incident exposure staff described in July 2025 still stands, and Part 2 handling is still fully manual. Every figure below is an informal participant estimate, not a count.</p>\n<ul><li><strong>Accept-by-default under productivity targets.</strong> A production coder said that on simple, single-diagnosis charts they would accept a suggested code as shown unless something jumped out, as they already do with prompts in their current tools, and tied this to the charts-per-hour quota rather than to trust in the tool (2026-06-23, HIGH). On complex charts they would ignore suggestions and code from the note, as coders said in July 2025 (2026-06-23, MEDIUM). A coding supervisor&#x27;s main worry was leadership raising targets as soon as a suggester went live, before anyone had measured the time saved, with the informal July 2025 estimate of 2–3 minutes per simple chart applied to every chart (2026-08-11, HIGH). A senior coder expected that saving to &quot;mostly disappear&quot; on all but the simplest visits once citation checks are included (informal guess; 2026-10-06, MEDIUM). The supervisor recommended keeping targets unchanged during any pilot and revisiting them only after measured time per chart, split by simple and complex charts, alongside claim denial and rework rates.</li><li><strong>A per-code decision record, visible to more than auditors.</strong> A coding auditor could not defend a code in an external audit or a claim denial appeal without a per-code record of what the tool suggested, what the coder accepted or overrode and what they changed it to, with user and timestamp; an encounter-level &quot;AI assistance was used&quot; flag isn&#x27;t enough, and they want the record treated as release-blocking (2026-04-21, CRITICAL). For at least the first year they would audit codes accepted without edits at a higher rate, &quot;maybe double the usual sample&quot; (informal; 2026-04-21, MEDIUM), and want the log filterable by acceptance status. A senior coder reached the same requirement independently, called it a precondition for using the tool at all, and wants it visible to the coder in the coding view (2026-10-06, HIGH). A supervisor wants per-coder accept, edit and override rates for training and coaching, not only audit (2026-08-11, MEDIUM), and a revenue cycle analyst wants &quot;suggested and accepted&quot; vs. &quot;entered by coder&quot; visible in claim-edit review (2026-07-14, MEDIUM). This splits July 2025&#x27;s accept/override into three outcomes: accepted, edited and overridden.</li><li><strong>Specificity, citations and scribe-drafted notes.</strong> A coder said scribe-drafted notes often leave out the specificity coding depends on (laterality, acute vs. chronic, type or stage, and the link between conditions), so they query physicians or code to the unspecified level more often than with physician-typed notes (2026-03-10, HIGH). A CDI specialist said these notes read as complete, which makes gaps harder to spot and costs &quot;a few extra minutes per note&quot; (informal; 2026-05-12, HIGH). A senior coder would not accept any suggested code without a source citation down to the specificity level, partly to check the suggester isn&#x27;t echoing a sentence the physician didn&#x27;t catch at sign-off (2026-10-06, MEDIUM). The production coder would open a citation only when a suggestion looked off, which means least often on the charts they&#x27;d accept by default (2026-06-23, MEDIUM). When the note doesn&#x27;t support a specific code, the tool should say so rather than quietly suggest the unspecified code (2026-03-10), or offer a draft, non-leading query for CDI instead of a code (2026-05-12, MEDIUM). Coders can&#x27;t see which sentences the scribe drafted while coding (2026-03-10, MEDIUM). The coder&#x27;s sense that physician queries have risen since GA is an impression; no query counts were reviewed (2026-03-10, MEDIUM).</li><li><strong>Claim denials.</strong> A revenue cycle analyst said coding-related claim denials almost never come from the wrong code category but from specificity: an unspecified diagnosis, a missing laterality or a diagnosis that doesn&#x27;t support the medical necessity of the procedure, which they put at &quot;probably two-thirds or more&quot; of those they work (informal, no report in front of them; 2026-07-14, HIGH). They would judge any pilot on the claim denial rate and rework, with coder throughput second (2026-07-14, LOW). Separately, coders can&#x27;t see that a CDI query is already open on an encounter, a gap that predates the scribe (2026-05-12, LOW).</li><li><strong>Release of information since GA.</strong> Two ROI specialists held the suggest-only position: a person redacts and a person releases (2026-06-02, MEDIUM; 2026-09-08, HIGH), and each flagged item should show why it was flagged (2026-06-02). One would accept batch pre-highlighting, but only for low-risk requests where patients ask for their own records, with every record still opened, checked and released by a specialist; attorney, insurer and possible Part 2 requests stay one at a time (2026-09-08, HIGH). Scribe-drafted notes capture incidental third-party and sensitive content said in passing, which has to be found and redacted page by page, in &quot;maybe one in five or six&quot; scribe-drafted notes (informal guess, varies by clinic; 2026-06-02, HIGH); the specialist worried most about what a tool wouldn&#x27;t flag. The backlog sits with the second-level Part 2 review, which only a few senior specialists can do, and turnaround on those requests has slipped from about a week to closer to two (informal; 2026-03-31, MEDIUM). Turnaround depends mostly on who is asking: &quot;within a few days&quot; for patients&#x27; own recent records, about a week for insurers and &quot;often two weeks or more&quot; for attorneys (all informal impressions; 2026-09-08, MEDIUM). Whether scribe generation metadata is part of the released record is unresolved; see [governance-and-phi.md](governance-and-phi.md) (2026-06-02, HIGH).</li><li><strong>Part 2 knowledge still lives on a printed sheet.</strong> ROI specialists identify Part 2 records from memory and a printed sheet of clinics and note types, and send any substance-use mention to the stricter review to be safe (2026-03-31, HIGH). Coders use an adapted version of the same sheet to know what not to copy into queries, and nobody owns keeping it current (2026-08-11, MEDIUM). Both said scribe-drafted notes can capture more of that content.</li></ul>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-07-15</strong> — <a href=\"../raw/2025-07-15-contextual-inquiry-him-release-of-information/session-notes.md\">Contextual Inquiry — Health Information Management (Release of Information)</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-07-29</strong> — <a href=\"../raw/2025-07-29-usability-test-ai-coding-billing-suggestions/session-notes.md\">Usability Test — AI-Assisted Medical Coding Suggestions</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-03-10</strong> — <a href=\"../raw/2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes/session-notes.md\">Interview — Medical Coder on Coding from AI-Drafted Notes</a> <em>(<code>interview</code>)</em></li><li><strong>2026-03-31</strong> — <a href=\"../raw/2026-03-31-interview-him-supervisor-roi-volume-and-part-2/session-notes.md\">Interview — HIM Supervisor on ROI Volume and Part 2 Handling</a> <em>(<code>interview</code>)</em></li><li><strong>2026-04-21</strong> — <a href=\"../raw/2026-04-21-interview-coding-auditor-override-audit-trail/session-notes.md\">Interview — Coding Auditor on Override Tracking and Audit Trail</a> <em>(<code>interview</code>)</em></li><li><strong>2026-05-12</strong> — <a href=\"../raw/2026-05-12-interview-cdi-specialist-documentation-gaps/session-notes.md\">Interview — CDI Specialist on Documentation Gaps in AI-Drafted Notes</a> <em>(<code>interview</code>)</em></li><li><strong>2026-06-02</strong> — <a href=\"../raw/2026-06-02-interview-him-specialist-roi-ai-drafted-notes/session-notes.md\">Interview — HIM Specialist on Releasing AI-Drafted Notes</a> <em>(<code>interview</code>)</em></li><li><strong>2026-06-23</strong> — <a href=\"../raw/2026-06-23-interview-medical-coder-review-override-habits/session-notes.md\">Interview — Medical Coder on Review and Override Habits</a> <em>(<code>interview</code>)</em></li><li><strong>2026-07-14</strong> — <a href=\"../raw/2026-07-14-interview-revenue-cycle-analyst-claim-denials/session-notes.md\">Interview — Revenue Cycle Analyst on Claim Denials and Coding</a> <em>(<code>interview</code>)</em></li><li><strong>2026-08-11</strong> — <a href=\"../raw/2026-08-11-interview-him-supervisor-coding-team-oversight/session-notes.md\">Interview — HIM Supervisor on Coding Team Oversight</a> <em>(<code>interview</code>)</em></li><li><strong>2026-09-08</strong> — <a href=\"../raw/2026-09-08-interview-him-specialist-roi-request-turnaround/session-notes.md\">Interview — HIM Specialist on ROI Request Turnaround</a> <em>(<code>interview</code>)</em></li><li><strong>2026-10-06</strong> — <a href=\"../raw/2026-10-06-interview-senior-medical-coder-ai-suggestions-concept/session-notes.md\">Interview — Senior Medical Coder on AI Coding Suggestions</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li><li>[AI-Assisted Prior Authorization](prior-authorization.md)</li><li>[Scope Boundaries &amp; Workflow Fit](scope-boundaries-and-workflow-fit.md)</li></ul>", "searchText": "him: coding, billing & release of information 42-cfr-part-2 ai-generated-content audit-trail billing coding compliance documentation him phi release-of-information training trust-in-ai usability workflow project-him coding-suggestion-panel roi-redaction-tool him: coding, billing &amp; release of information overview two contextual/usability sessions in him (july 2025) surfaced a shared theme — extremely low risk tolerance for anything that could look like automated judgment on a compliance m denials and coding ( interview ) 2026-08-11 — interview — him supervisor on coding team oversight ( interview ) 2026-09-08 — interview — him specialist on roi request turnaround ( interview ) 2026-10-06 — interview — senior medical coder on ai coding suggestions ( interview ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md) [ai-assisted prior authorization](prior-authorization.md) [scope boundaries &amp; workflow fit](scope-boundaries-and-workflow-fit.md)"}, {"id": "finding:onboarding", "kind": "finding", "title": "Onboarding flow — setup step confusion", "date": "2026-02-03", "type": "synthesis", "status": "synthesized", "tags": ["onboarding", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/onboarding.md", "corrections": [], "html": "<h2>Summary</h2>\n<p>New admins hesitate at, or attempt to skip, step 3 of the onboarding wizard (&quot;Connect calendar&quot;) because its wording implies the step is optional, when it&#x27;s actually required for later functionality. This is the most consistently observed friction point in first-time setup (all 6 sessions).</p>\n<p>A separate, related hesitation sits at step 4 (&quot;Invite your team&quot;): one admin (session 3) worried that invites would email the whole team before they were ready.</p>\n<h2>Step numbering</h2>\n<p>Steps are numbered per <code>user-flows/onboarding-flow.md</code>, where Signup is step 1: 1 Signup, 2 Basics, 3 Connect calendar, 4 Invite your team, 5 Preferences, 6 Review &amp; finish. Some early records counted from the first step after Signup — session 2&#x27;s raw notes call the calendar step &quot;step 2&quot;, and the sessions 1–3 topline originally called the invite step &quot;step 3&quot;. Those refer to the same steps as above: step 3 is always &quot;Connect calendar&quot;, and step 4 is always &quot;Invite your team&quot;.</p>\n<h2>Evidence</h2>\n<p>Sourced from <code>raw/2026-01-19-onboarding-usability-test/</code> — 6 participants, moderated usability sessions, Jan 19–23 2026. In sessions 1–3, 2 of 3 participants tried to skip step 3 (&quot;Connect calendar&quot;): session 1 tried to exit via the step label, and session 2 tried to skip it before hitting the &quot;required&quot; indicator. Sessions 4–6 read the step as optional in the same way. The step 4 invite hesitation comes from session 3 only (&quot;I&#x27;m worried this is going to email my whole team before I&#x27;m ready&quot;). The raw notes record it as the &quot;Same step 3 hesitation as session 1&quot;; it&#x27;s read as the invite step because of what the participant said (see <code>docs/ask-audit-2026-09-27.md</code>).</p>\n<p>See also <code>analytics/summaries/onboarding-funnel-dropoff.md</code>, which reports step 3 as the largest drop-off point. The underlying funnel export isn&#x27;t in the repo (there&#x27;s no <code>analytics/raw/</code> export), so it isn&#x27;t independent corroboration here.</p>\n<h2>Recommendation</h2>\n<p>Relabel step 3 to state clearly that calendar connection is required, and give visible feedback that invites (entered in step 4, &quot;Invite your team&quot;) aren&#x27;t sent until the whole wizard is submitted.</p>\n<h2>Status</h2>\n<p>Synthesized Feb 3, 2026, from sessions 1–6. Revisit after the step 3 wording change (proposed in <code>research-readouts/onboarding-flow-q1-readout.md</code>) ships and gets retested.</p>", "searchText": "onboarding flow — setup step confusion onboarding project-onboarding summary new admins hesitate at, or attempt to skip, step 3 of the onboarding wizard (&quot;connect calendar&quot;) because its wording implies the step is optional, when it&#x27;s actually required for later functionality. this is the most consistently observed friction point in first-time setup (all 6 sessions). a separate, related hesitation sits at step 4 (&quot;invite your team&quot;): one admin (session 3) worried that invites would email the whole team before they were ready. step numbering steps are numbered per user-flows/onboarding-flow.md , where signup is step 1: 1 signup, 2 basics, 3 connect calendar, 4 invite your team, 5 preferences, 6 review &amp; finish. some early records counted from the first step after signup — session 2&#x27;s raw notes call the calendar step &quot;step 2&quot;, and the sessions 1–3 topline originally called the invite step &quot;step 3&quot;. those refer to the same steps as above: step 3 is always &quot;connect calendar&quot;, and step 4 is always &quot;invite your team&quot;. evidence sourced from raw/2026-01-19-onboarding-usability-test/ — 6 participants, moderated usability sessions, jan 19–23 2026. in sessions 1–3, 2 of 3 participants tried to skip step 3 (&quot;connect calendar&quot;): session 1 tried to exit via the step label, and session 2 tried to skip it before hitting the &quot;required&quot; indicator. sessions 4–6 read the step as optional in the same way. the step 4 invite hesitation comes from session 3 only (&quot;i&#x27;m worried this is going to email my whole team before i&#x27;m ready&quot;). the raw notes record it as the &quot;same step 3 hesitation as session 1&quot;; it&#x27;s read as the invite step because of what the participant said (see docs/ask-audit-2026-09-27.md ). see also analytics/summaries/onboarding-funnel-dropoff.md , which reports step 3 as the largest drop-off point. the underlying funnel export isn&#x27;t in the repo (there&#x27;s no analytics/raw/ export), so it isn&#x27;t independent corroboration here. recommendation relabel step 3 to state clearly that calendar connection is required, and give visible feedback that invites (entered in step 4, &quot;invite your team&quot;) aren&#x27;t sent until the whole wizard is submitted. status synthesized feb 3, 2026, from sessions 1–6. revisit after the step 3 wording change (proposed in research-readouts/onboarding-flow-q1-readout.md ) ships and gets retested."}, {"id": "finding:patient-scheduling-chatbot", "kind": "finding", "title": "Patient Scheduling Chatbot", "date": "2025-06-17", "type": "synthesis", "status": "synthesized", "tags": ["chatbot", "patient-experience", "scheduling", "survey", "trust", "usability", "project-patient-chatbot"], "related_components": ["patient-chatbot-widget", "scheduling-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/patient-scheduling-chatbot.md", "corrections": [], "html": "<h1>Patient Scheduling Chatbot</h1>\n<h2>Overview</h2>\n<p>A patient-facing scheduling chatbot was scoped narrowly based on a trust survey (Jun 2025) and then usability tested against that scope (Jun 2025, two weeks later).</p>\n<ul><li><strong>The survey drew a sharp, useful line.</strong> 67% of patients were comfortable with an AI chatbot for scheduling/rescheduling, but comfort dropped to 22% when extended to symptom-related questions. This directly shaped the decision to scope the chatbot to logistics only and explicitly exclude symptom Q&amp;A from v1 — a scope decision the usability test then validated by not needing to test symptom-handling at all.</li><li><strong>The &quot;talk to a human&quot; escape hatch, identified as a trust prerequisite in the survey (41% of open-ended responses asked for it), failed discoverability testing.</strong> 3 of 8 usability test participants couldn&#x27;t find it — it existed only as a small text link. This is a case where a clearly-identified requirement from the survey wasn&#x27;t sufficiently weighted in the initial design.</li><li>Secondary findings: rescheduling had a lower task-success rate than new bookings (appointment-ID friction), and the bot&#x27;s &quot;overly cheerful&quot; tone was mismatched for patients scheduling around illness.</li></ul>\n<p>Recommendation: redesign the escape hatch as a persistent, prominent control (not a link) and re-test discoverability specifically before wider rollout. This chatbot would also be the non-clinical rollout most likely to run into the awareness gap noted in [rollout-and-change-management.md](rollout-and-change-management.md).</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-06-03</strong> — <a href=\"../raw/2025-06-03-survey-patient-portal-ai-chatbot-trust/session-notes.md\">Survey — Patient Trust in AI Chatbot for Scheduling</a> <em>(<code>survey</code>)</em></li><li><strong>2025-06-17</strong> — <a href=\"../raw/2025-06-17-usability-test-patient-chatbot-prototype/session-notes.md\">Usability Test — Patient Scheduling Chatbot Prototype</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Rollout &amp; Change Management](rollout-and-change-management.md)</li></ul>", "searchText": "patient scheduling chatbot chatbot patient-experience scheduling survey trust usability project-patient-chatbot patient-chatbot-widget scheduling-widget patient scheduling chatbot overview a patient-facing scheduling chatbot was scoped narrowly based on a trust survey (jun 2025) and then usability tested against that scope (jun 2025, two weeks later). the survey drew a sharp, useful line. 67% of patients were comfortable with an ai chatbot for scheduling/rescheduling, but comfort dropped to 22% when extended to symptom-related questions. this directly shaped the decision to scope the chatbot to logistics only and explicitly exclude symptom q&amp;a from v1 — a scope decision the usability test then validated by not needing to test symptom-handling at all. the &quot;talk to a human&quot; escape hatch, identified as a trust prerequisite in the survey (41% of open-ended responses asked for it), failed discoverability testing. 3 of 8 usability test participants couldn&#x27;t find it — it existed only as a small text link. this is a case where a clearly-identified requirement from the survey wasn&#x27;t sufficiently weighted in the initial design. secondary findings: rescheduling had a lower task-success rate than new bookings (appointment-id friction), and the bot&#x27;s &quot;overly cheerful&quot; tone was mismatched for patients scheduling around illness. recommendation: redesign the escape hatch as a persistent, prominent control (not a link) and re-test discoverability specifically before wider rollout. this chatbot would also be the non-clinical rollout most likely to run into the awareness gap noted in [rollout-and-change-management.md](rollout-and-change-management.md). evidence trail 2025-06-03 — survey — patient trust in ai chatbot for scheduling ( survey ) 2025-06-17 — usability test — patient scheduling chatbot prototype ( usability-test ) related findings [rollout &amp; change management](rollout-and-change-management.md)"}, {"id": "finding:prior-authorization", "kind": "finding", "title": "AI-Assisted Prior Authorization", "date": "2026-09-17", "type": "synthesis", "status": "synthesized", "tags": ["longitudinal", "nursing", "prior-auth", "trust-in-ai", "usability", "utilization-management", "v1", "v2", "project-prior-auth"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/prior-authorization.md", "corrections": [], "html": "<h1>AI-Assisted Prior Authorization</h1>\n<h2>Overview</h2>\n<p>AI-drafted prior authorization justifications were tested in two rounds (v1, Apr 2025; v2, Nov 2025) with the same utilization review nurse supervisor across both, which mattered for tracking whether fixes actually landed.</p>\n<ul><li><strong>v1</strong> surfaced a correctness bug (citing outdated diagnosis codes) serious enough that participants said it would likely cause payer denials — not a UX problem, a data-freshness/model fix. It also surfaced a durable requirement: nurses want inline citations to the specific chart text behind each suggestion (&quot;show your work&quot;), not just a black-box draft.</li><li><strong>v2</strong>, after both fixes landed, confirmed the outdated-code issue did not recur and that the citation feature is actively used (3 of 4 participants checked at least one citation before accepting) rather than being ignored as friction.</li><li><strong>Scope discipline held.</strong> After v1, the team limited pilot scope to &quot;straightforward&quot; cases, with the nursing supervisor helping define them, and kept complex cases out of that scope. v2 tested 2 straightforward and 2 complex cases, and confirmed complex cases still aren&#x27;t ready — validating that the scope limitation, not a rushed fix, was the right call. This same &quot;citation transparency&quot; requirement has since shown up independently in the medical coding work — see [him-coding-and-billing.md](him-coding-and-billing.md).</li><li><strong>Time savings:</strong> ~5 min vs. ~15 min manual for straightforward cases, confirmed (not just estimated) in v2.</li><li><strong>2026: the utilization review pilot, from two nurses in it.</strong> A limited pilot of the drafting panel has run in the utilization review department since early 2026, on straightforward cases only; complex cases stay manual, and it is not generally available or in other departments (2026-06-16). P19, returning from v1 (not v2), and P144, who joined the department after both tests, use it on their own straightforward cases; neither is the supervisor the tests followed. Figures are informal participant estimates. P19 described a straightforward case as &quot;one request, one current diagnosis, criteria we see every week&quot; and put roughly half of a week&#x27;s cases as looking like that at intake, but some stop being straightforward once they are into the chart, and they finish those by hand (2026-06-16, HIGH). So the scope holds as a rule, but in daily work the nurse applies it partway through a case, not in advance as in testing. Both nurses open citations on every case: P19 checks the diagnosis and the date of the most recent supporting note first (2026-06-16, MEDIUM), and P144 checks that each cited entry says what the draft says, not only that it exists (2026-09-17, MEDIUM). That supports the citation requirement outside testing, and shows that a count of citations opened, as in v2, doesn&#x27;t record what was checked. Requests following a claim denial, requests covering several services and long histories are still done by hand (2026-06-16, MEDIUM); P144 starts a claim-denial case from the denial letter&#x27;s reason and prepares calls with the health plan by hand (2026-09-17, MEDIUM). Still open: how the pilot is performing (no time, accuracy or claim-denial data is recorded; the only time figures remain v1&#x27;s estimate and v2&#x27;s measurement on 2 straightforward test cases), how often a case leaves the draft partway through, and whether a submitted request keeps its citations.</li></ul>\n<p>Status: v2 recommended pilot expansion, strictly within the agreed straightforward-case scope. A limited pilot on straightforward cases has run in the utilization review department since early 2026 (2026-06-16); whether it has expanded, and how it is performing, is not recorded.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-04-08</strong> — <a href=\"../raw/2025-04-08-usability-test-prior-auth-ai-v1/session-notes.md\">Usability Test — AI-Assisted Prior Authorization Drafting (v1)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-11-04</strong> — <a href=\"../raw/2025-11-04-usability-test-prior-auth-ai-v2/session-notes.md\">Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-06-16</strong> — <a href=\"../raw/2026-06-16-interview-utilization-review-nurse-case-scope/session-notes.md\">Interview — Returning Utilization Review Nurse on Pilot Case Scope</a> <em>(<code>interview</code>)</em></li><li><strong>2026-09-17</strong> — <a href=\"../raw/2026-09-17-interview-utilization-review-nurse-citation-checking/session-notes.md\">Interview — Utilization Review Nurse on Checking Citations</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li></ul>", "searchText": "ai-assisted prior authorization longitudinal nursing prior-auth trust-in-ai usability utilization-management v1 v2 project-prior-auth prior-auth-drafting-panel ai-assisted prior authorization overview ai-drafted prior authorization justifications were tested in two rounds (v1, apr 2025; v2, nov 2025) with the same utilization review nurse supervisor across both, which mattered for tracking whether fixes actually landed. v1 surfaced a correctness bug (citing outdated diagnosis codes) serious enough that participants said it would likely cause payer denials — not a ux problem, a data-freshness/model fix. it also surfaced a durable requirement: nurses want inline citations to the specific chart text behind each suggestion (&quot;show your work&quot;), not just a black-box draft. v2 , after both fixes landed, confirmed the outdated-code issue did not recur and that the citation feature is actively used (3 of 4 participants checked at least one citation before accepting) rather than being ignored as friction. scope discipline held. after v1, the team limited pilot scope to &quot;straightforward&quot; cases, with the nursing supervisor helping define them, and kept complex cases out of that scope. v2 tested 2 straightforward and 2 complex cases, and confirmed complex cases still aren&#x27;t ready — validating that the scope limitation, not a rushed fix, was the right call. this same &quot;citation transparency&quot; requirement has since shown up independently in the medical coding work — see [him-coding-and-billing.md](him-coding-and-billing.md). time eps its citations. status: v2 recommended pilot expansion, strictly within the agreed straightforward-case scope. a limited pilot on straightforward cases has run in the utilization review department since early 2026 (2026-06-16); whether it has expanded, and how it is performing, is not recorded. evidence trail 2025-04-08 — usability test — ai-assisted prior authorization drafting (v1) ( usability-test ) 2025-11-04 — usability test — ai-assisted prior authorization drafting (v2, follow-up) ( usability-test ) 2026-06-16 — interview — returning utilization review nurse on pilot case scope ( interview ) 2026-09-17 — interview — utilization review nurse on checking citations ( interview ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md)"}, {"id": "finding:rollout-and-change-management", "kind": "finding", "title": "Rollout & Change Management", "date": "2026-08-18", "type": "synthesis", "status": "synthesized", "tags": ["change-management", "nursing", "organizational-readiness", "pulse", "rollout", "survey", "training", "year-end", "project-cross-cutting"], "related_components": ["patient-chatbot-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/rollout-and-change-management.md", "corrections": [], "html": "<h1>Rollout &amp; Change Management</h1>\n<h2>Overview</h2>\n<p>Two sessions, five weeks apart at year-end, look at how Compass AI features actually get adopted once built: a training/change-management interview (Oct 2025) and an all-staff AI readiness pulse survey (Dec 2025). A 2026 interview with a nurse manager (Aug 2026) adds the view of the person who has to release staff for that training.</p>\n<ul><li><strong>The training interview drew directly on a documented past failure.</strong> The 2022 CDS alert rollout — referenced independently by executives back in January (see [governance-and-phi.md](governance-and-phi.md)) — is treated as the cautionary tale: a single 20-minute training video with no hands-on practice, and adoption suffered. The Director of Training&#x27;s recommendation is a &quot;unit champion&quot; model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time, and to avoid rolling out during flu season (Nov-Feb) given historical attendance patterns.</li><li><strong>Practice time depends on the unit&#x27;s staffing on the day.</strong> A medical-surgical nurse manager agreed with the champion model in principle, but releasing a nurse means backfilling their assignment with a float nurse or overtime, and on a high-census or call-out day training is the first thing they cancel (2026-08-18, MEDIUM). What they said they would need: training dates known before they build the schedule, about six weeks out (their description of their own practice); backfill paid from a training budget rather than the unit&#x27;s; night and weekend sessions; and champion time for supporting peers put on the schedule, not added to a full assignment (2026-08-18, MEDIUM). They also named flu season as their hardest months to release anyone. Their account draws on releasing nurses for other training, not on an AI rollout, and how often training is cancelled for staffing is not measured.</li><li><strong>The December pulse survey found an awareness gap that changes rollout sequencing for non-clinical features specifically</strong>: only 34% of non-clinical/admin staff were aware Compass AI work was even underway, vs. 71% of clinical staff. This matters directly for the patient scheduling chatbot (see [patient-scheduling-chatbot.md](patient-scheduling-chatbot.md)), which is the first admin-facing, non-clinical feature nearing rollout — communications need to reach that audience before launch, not after.</li><li>The survey&#x27;s directional sentiment comparison to the February 2025 nursing attitudes survey is noted but flagged as not a clean apples-to-apples comparison (different question wording). The survey recommends re-running the exact February instrument if a clean trend is needed.</li></ul>\n<p>Recommendation: use the unit-champion training model for the ambient scribe GA rollout (avoiding flu-season timing), and run a dedicated non-clinical-staff communications push before the scheduling chatbot goes live. One nurse manager&#x27;s account suggests that, for any later rollout that reaches nurses, champion practice time and backfill should be agreed with unit managers before their schedule is built (2026-08-18).</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-10-21</strong> — <a href=\"../raw/2025-10-21-interview-training-department-rollout-change-management/session-notes.md\">Interview — Training &amp; Education Dept on Rollout/Change Management Planning</a> <em>(<code>interview</code>)</em></li><li><strong>2025-12-02</strong> — <a href=\"../raw/2025-12-02-survey-allstaff-ai-readiness-pulse/session-notes.md\">Survey — All-Staff AI Readiness Pulse Survey</a> <em>(<code>survey</code>)</em></li><li><strong>2026-08-18</strong> — <a href=\"../raw/2026-08-18-interview-nurse-manager-unit-champions/session-notes.md\">Interview — Nurse Manager on Unit Champions</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li><li>[Ambient AI Scribe](ambient-scribe.md)</li></ul>", "searchText": "rollout & change management change-management nursing organizational-readiness pulse rollout survey training year-end project-cross-cutting patient-chatbot-widget rollout &amp; change management overview two sessions, five weeks apart at year-end, look at how compass ai features actually get adopted once built: a training/change-management interview (oct 2025) and an all-staff ai readiness pulse survey (dec 2025). a 2026 interview with a nurse manager (aug 2026) adds the view of the person who has to release staff for that training. e survey&#x27;s directional sentiment comparison to the february 2025 nursing attitudes survey is noted but flagged as not a clean apples-to-apples comparison (different question wording). the survey recommends re-running the exact february instrument if a clean trend is needed. recommendation: use the unit-champion training model for the ambient scribe ga rollout (avoiding flu-season timing), and run a dedicated non-clinical-staff communications push before the scheduling chatbot goes live. one nurse manager&#x27;s account suggests that, for any later rollout that reaches nurses, champion practice time and backfill should be agreed with unit managers before their schedule is built (2026-08-18). evidence trail 2025-10-21 — interview — training &amp; education dept on rollout/change management planning ( interview ) 2025-12-02 — survey — all-staff ai readiness pulse survey ( survey ) 2026-08-18 — interview — nurse manager on unit champions ( interview ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md) [ambient ai scribe](ambient-scribe.md)"}, {"id": "finding:scope-boundaries-and-workflow-fit", "kind": "finding", "title": "Scope Boundaries & Workflow Fit", "date": "2026-09-08", "type": "synthesis", "status": "synthesized", "tags": ["42-cfr-part-2", "authentication", "baseline", "behavioral-health", "clinician-workflow", "ed", "high-acuity", "intake", "mfa", "nursing", "phi", "security", "sensitive-notes", "sso", "workflow", "project-cross-cutting"], "related_components": ["ambient-scribe-widget", "ed-intake-form", "sso-mfa-login"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/scope-boundaries-and-workflow-fit.md", "corrections": [], "html": "<h1>Scope Boundaries &amp; Workflow Fit</h1>\n<h2>Overview</h2>\n<p>Three 2025 sessions, plus two 2026 HIM interviews that refine a release-of-information (ROI) boundary first set in the July 2025 HIM research and two 2026 ED nurse interviews that revisit the ED intake boundary, are grouped here because their common output was a &quot;don&#x27;t build this yet, or don&#x27;t build it here&quot; conclusion. The December executive retro praised this kind of scope discipline in general (&quot;The stuff you told us not to build yet mattered as much as the stuff you told us to build&quot;), but the only exclusions it named were behavioral health (covered below) and complex prior-auth cases (not part of this finding). It did not discuss the ED intake or SSO/MFA boundaries, or the ROI redaction boundary below, which dates from the July 2025 HIM research; only the 2026 evidence added to that boundary postdates the retro.</p>\n<ul><li><strong>ED intake (contextual inquiry, Apr 2025; revisited Apr and May 2026):</strong> peak-hour interruption frequency (every 2-4 minutes) makes any AI tool requiring sustained review attention a poor fit for ED intake nurses specifically during peak windows. The one positive signal — insurance-card-photo pre-fill for registration clerks — was carved out as a smaller, separate, lower-risk candidate instead. In April 2026 the intake nurse shadowed in 2025 described the interruptions as unchanged (their account, not a re-measurement) and would accept help that needs no review, but nothing they would have to read and approve between interruptions (2026-04-14, HIGH). They start the paper triage sheet at the top of every peak shift, so anything scoped here has to work alongside paper and survive re-entry from it; the 2025 notes don&#x27;t say when staff started it, so this isn&#x27;t evidence of a change (2026-04-14, MEDIUM). An ED charge nurse agreed the boundary holds at peak, for charge work too, but not across the whole shift: after peak they could see an assist pulling together the end-of-shift handoff for them to check (&quot;twenty minutes on a bad night&quot; by hand, informal; an expectation, nothing shown; 2026-05-19, MEDIUM). The boundary is peak-specific, not ED-wide. Whether the insurance-card pre-fill has been piloted is not recorded.</li><li><strong>SSO/MFA modernization (interview, May 2025):</strong> independent of any AI feature, a planned 15-minute forced re-authentication conflicts with clinical ops&#x27; expectation of a 4-hour session — and nobody had yet defined what happens to an in-progress ambient scribe recording session if a forced re-auth interrupts it mid-visit. This was flagged as an unhandled edge case for the ambient scribe team (see [ambient-scribe.md](ambient-scribe.md)) rather than something to solve in this session. The 15-minute figure was a <em>planned</em> policy that was still disputed as of May</li></ul>\n<ol><li>By Feb 2026, IT Security described a 10-minute idle timeout as fixed policy (see [ambient-scribe-post-ga-refinements.md](ambient-scribe-post-ga-refinements.md)). The raw notes don&#x27;t say whether that settles this dispute or is a separate idle-lock setting.</li></ol>\n<ul><li><strong>Behavioral health (contextual inquiry, Oct 2025):</strong> reiterated, independently, the same &quot;no structured way to flag a 42 CFR Part 2-protected note&quot; platform gap first identified in the July HIM research (see [him-coding-and-billing.md](him-coding-and-billing.md)), which HIM found unchanged in March 2026 (2026-03-31, HIGH) — and added a harder constraint on top: any AI tool listening to or drafting behavioral health notes needs a dedicated legal/consent review that hasn&#x27;t started yet. This population was formally excluded from the near-term ambient scribe rollout as a result.</li><li><strong>ROI redaction (HIM research, Jul 2025; refined Mar and Sep 2026):</strong> the suggest-only boundary set in July 2025 (see [him-coding-and-billing.md](him-coding-and-billing.md)) held in 2026: a person redacts and a person releases every record. Within it, an ROI specialist would accept batch pre-highlighting only for low-risk requests where patients ask for their own records; attorney, insurer and possible Part 2 requests are excluded from batch handling and stay one at a time (2026-09-08, HIGH). An HIM supervisor said the backlog sits in the second-level Part 2 review queue rather than first-pass redaction, so any redaction assistance should be designed around that queue (2026-03-31, MEDIUM).</li></ul>\n<p>Recommendation: keep these four exclusions as explicit, documented scope boundaries in the 2026 roadmap rather than informal assumptions that could quietly erode. This is this finding&#x27;s recommendation, not a retro action item — the retro&#x27;s own recommendations were a formal metrics document and a cross-cutting findings section.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-04-22</strong> — <a href=\"../raw/2025-04-22-contextual-inquiry-ed-intake-shadowing/session-notes.md\">Contextual Inquiry — Emergency Department Intake Shadowing</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-05-20</strong> — <a href=\"../raw/2025-05-20-interview-it-security-sso-mfa-modernization/session-notes.md\">Interview — IT Security on SSO/MFA Modernization Impact</a> <em>(<code>interview</code>)</em></li><li><strong>2025-10-07</strong> — <a href=\"../raw/2025-10-07-contextual-inquiry-behavioral-health-sensitive-notes/session-notes.md\">Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-12-16</strong> — <a href=\"../raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md\">Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</a> <em>(<code>interview</code>)</em> — cited for the scope-discipline praise only</li><li><strong>2026-03-31</strong> — <a href=\"../raw/2026-03-31-interview-him-supervisor-roi-volume-and-part-2/session-notes.md\">Interview — HIM Supervisor on ROI Volume and Part 2 Handling</a> <em>(<code>interview</code>)</em></li><li><strong>2026-04-14
