mpairment focus) ( accessibility-audit ) related findings (none currently linked)"}, {"id": "finding:ambient-scribe-post-ga-refinements", "kind": "finding", "title": "Ambient Scribe — Post-GA Refinements", "date": "2026-02-17", "type": "synthesis", "status": "synthesized", "tags": ["ambient-scribe", "medication-safety", "sso", "mfa", "phi", "longitudinal", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": "Jordan Lee", "path": "findings/ambient-scribe-post-ga-refinements.md", "corrections": [], "html": "<h1>Ambient Scribe — Post-GA Refinements</h1>\n<h2>Overview</h2>\n<p>Two follow-up threads opened by [ambient-scribe.md](ambient-scribe.md)&#x27;s GA-candidate round and by an open edge case noted directly in the <code>encounter-view</code> component — neither a launch blocker, both worth closing before they harden into permanent gaps.</p>\n<ul><li><strong>In a 6-person concept test, a distinct sound-alike-medication flag was recognized as different from generic confidence highlighting.</strong> The GA-candidate round treated sound-alike medication errors as an ongoing monitoring item, relying on the general <code>confidence-highlighted</code> variant to surface them. A concept test of a dedicated, visually distinct flag found 5 of 6 participants correctly recognized it as categorically different from generic low confidence — but also surfaced a new risk: 2 of 6 participants said the flag&#x27;s specificity made them trust <em>unflagged</em> medication lines more than they should. Any rollout needs to actively counter that over-trust framing, not just ship the flag.</li><li><strong>Session lock during active dictation currently reads as silent data loss, even though it isn&#x27;t.</strong> The <code>locked</code> state&#x27;s interaction with an in-progress recording was flagged as unresolved in <code>encounter-view</code>&#x27;s own notes, sourced from a May 2025 SSO/MFA interview side comment. Direct observation confirms the practical impact: all 4 shadowed clinicians assumed a locked session had destroyed their draft and restarted dictation from scratch, even though the draft is preserved server-side. IT Security confirmed the 10-minute idle-timeout policy itself is fixed, but an explicit &quot;paused, draft preserved&quot; state is a UI-only fix, not a policy change.</li><li>Both threads point the same direction: <strong>the underlying safety/reliability behavior is already correct (drafts are preserved; sound-alike names are technically detectable) — what&#x27;s missing is UI that tells the clinician that, specifically and distinctly, rather than relying on a generic low-confidence signal to carry two very different kinds of meaning.</strong></li></ul>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2026-02-10</strong> — <a href=\"../raw/2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md\">Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-02-17</strong> — <a href=\"../raw/2026-02-17-session-lock-during-dictation/session-notes.md\">Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation</a> <em>(<code>contextual-inquiry</code>)</em> — 5 participants: 4 shadowed clinicians plus 1 IT Security stakeholder (see the session&#x27;s <a href=\"../raw/2026-02-17-session-lock-during-dictation/correction-2026-09-27.md\">correction</a>; the session notes say &quot;5 clinicians&quot;)</li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li></ul>", "searchText": "ambient scribe — post-ga refinements ambient-scribe medication-safety sso mfa phi longitudinal project-ambient-scribe ambient-scribe-widget encounter-view ambient scribe — post-ga refinements overview two follow-up threads opened by [ambient-scribe.md](ambient-scribe.md)&#x27;s ga-candidate round and by an open edge case noted directly in the encounter-view component — neither a launch blocker, both worth closing before they harden into permanent gaps. in a 6-person concept test, a distinct sound-alike-medication flag was recognized as different from generic confidence highlighting. the ga-candidate round treated sound-alike medication errors as an ongoing monitoring item, relying on the general confidence-highlighted variant to surface them. a concept test of a dedicated, visually distinct flag found 5 of 6 participants correctly recognized it as categorically different from generic low confidence — but also surfaced a new risk: 2 of 6 participants said the flag&#x27;s specificity made them trust unflagged medication lines more than they should. any rollout needs to actively counter that over-trust framing, not just ship the flag. session lock during active dictation currently reads as silent data loss, even though it isn&#x27;t. the locked state&#x27;s interaction with an in-progress recording was flagged as unresolved in encounter-view &#x27;s own notes, sourced from a may 2025 sso/mfa interview side comment. direct observation confirms the practical impact: all 4 shadowed clinicians assumed a locked session had destroyed their draft and restarted dictation from scratch, even though the draft is preserved server-side. it security confirmed the 10-minute idle-timeout policy itself is fixed, but an explicit &quot;paused, draft preserved&quot; state is a ui-only fix, not a policy change. both threads point the same direction: the underlying safety/reliability behavior is already correct (drafts are preserved; sound-alike names are technically detectable) — what&#x27;s missing is ui that tells the clinician that, specifically and distinctly, rather than relying on a generic low-confidence signal to carry two very different kinds of meaning. evidence trail 2026-02-10 — usability test — ambient scribe sound-alike medication flag concept ( usability-test ) 2026-02-17 — contextual inquiry — session lock during active ambient scribe dictation ( contextual-inquiry ) — 5 participants: 4 shadowed clinicians plus 1 it security stakeholder (see the session&#x27;s correction ; the session notes say &quot;5 clinicians&quot;) related findings [ambient ai scribe](ambient-scribe.md) [ai governance, phi &amp; compliance](governance-and-phi.md)"}, {"id": "finding:ambient-scribe", "kind": "finding", "title": "Ambient AI Scribe", "date": "2026-01-13", "type": "synthesis", "status": "synthesized", "tags": ["ambient-scribe", "documentation", "ga-release", "longitudinal", "usability", "v0.1", "v0.2", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/ambient-scribe.md", "corrections": [], "html": "<h1>Ambient AI Scribe</h1>\n<h2>Overview</h2>\n<p>The ambient AI scribe has moved from a formative concept (v0.1, Feb 2025) through iteration (v0.2, Sep 2025) to a GA release candidate (Jan 2026). 3 of the original 5 participants returned for v0.2, and at least one (P09) also took part in the GA-candidate round, for longitudinal comparison.</p>\n<ul><li><strong>PHI handling:</strong> The critical draft-retention/audit gap found in v0.1 was fixed by v0.2 and has remained stable through the GA candidate — drafts auto-expire after 10 minutes of inactivity and the behavior is documented for Compliance. No PHI-handling issues have recurred since.</li><li><strong>Accuracy:</strong> Medication dosage errors dropped from 3/5 sessions (v0.1) to 1/5 (v0.2); the remaining error type is misheard similar-sounding drug names. The GA-candidate round recommended treating it as a post-GA monitoring item rather than a pre-GA blocker, and recommended a post-GA monitoring dashboard for it; the 2026-02-10 session still refers to that dashboard as recommended.</li><li><strong>Trust calibration was the hardest problem, and accuracy alone didn&#x27;t solve it.</strong> Returning participants read every line in both v0.1 and v0.2 despite the accuracy improvement between them — trust didn&#x27;t move with correctness. The GA-candidate round introduced per-line confidence highlighting, and for the first time participants reported actually skimming high-confidence lines. This is the strongest evidence so far that <em>visible uncertainty</em>, not raw accuracy, is the lever that changes reviewing behavior.</li><li><strong>Recommendation status:</strong> The GA-candidate session recommends GA release, with sound-alike medication errors tracked as a post-GA metric rather than delaying release.</li></ul>\n<p>Open thread: this tool&#x27;s rollout scope has been deliberately kept away from behavioral health / substance-use encounters — see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md).</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-02-25</strong> — <a href=\"../raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md\">Usability Test — Ambient AI Scribe Prototype v0.1</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-09-23</strong> — <a href=\"../raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md\">Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-01-13</strong> — <a href=\"../raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-01-27</strong> — <a href=\"../raw/2026-01-27-dashboard-review-ambient-scribe-ga-adoption/session-notes.md\">Dashboard review — Ambient scribe GA candidate adoption</a> <em>(<code>analytics</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li><li>[Clinician Experience &amp; Documentation Burden](clinician-experience-documentation-burden.md)</li><li>[Ambient Scribe — Post-GA Refinements](ambient-scribe-post-ga-refinements.md)</li></ul>", "searchText": "ambient ai scribe ambient-scribe documentation ga-release longitudinal usability v0.1 v0.2 project-ambient-scribe ambient-scribe-widget encounter-view ambient ai scribe overview the ambient ai scribe has moved from a formative concept (v0.1, feb 2025) through iteration (v0.2, sep 2025) to a ga release candidate (jan 2026). 3 of the original 5 participants returned for v0.2, and at least one (p09) also took part in the ga-candidate round, for longitudinal comparison. phi handling: the critical draft-retention/audit gap found in v0.1 was fixed by v0.2 and has remained stable through the ga candidate — drafts auto-expire after 10 minutes of inactivity and the behavior is documented for compliance. no phi-handling issues have recurred since. accuracy: medication dosage errors dropped from 3/5 sessions (v0.1) to 1/5 (v0.2); the remaining error type is misheard similar-sounding drug names. the ga-candidate round recommended treating it as a post-ga monitoring item rather than a pre-ga blocker, and recommended a post-ga monitoring dashboard for it; the 2026-02-10 session still refers to that dashboard as recommended. trust calibration was the hardest problem, and accuracy alone didn&#x27;t solve it. returning participants read every line in both v0.1 and v0.2 despite the accuracy improvement between them — trust didn&#x27;t move with correctness. the ga-candidate round introduced per-line confidence highlighting, and for the first time participants reported actually skimming high-confidence lines. this is the strongest evidence so far that visible uncertainty , not raw accuracy, is the lever that changes reviewing behavior. recommendation status: the ga-candidate session recommends ga release, with sound-alike medication errors tracked as a post-ga metric rather than delaying release. open thread: this tool&#x27;s rollout scope has been deliberately kept away from behavioral health / substance-use encounters — see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md). evidence trail 2025-02-25 — usability test — ambient ai scribe prototype v0.1 ( usability-test ) 2025-09-23 — usability test — ambient ai scribe prototype v0.2 (follow-up) ( usability-test ) 2026-01-13 — usability test — ambient ai scribe ga release candidate (final validation) ( usability-test ) 2026-01-27 — dashboard review — ambient scribe ga candidate adoption ( analytics ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md) [clinician experience &amp; documentation burden](clinician-experience-documentation-burden.md) [ambient scribe — post-ga refinements](ambient-scribe-post-ga-refinements.md)"}, {"id": "finding:care-coordination-triage", "kind": "finding", "title": "Care Coordination & Alert Triage", "date": "2025-08-26", "type": "synthesis", "status": "synthesized", "tags": ["alert-fatigue", "alert-triage", "baseline", "care-coordination", "chart-review", "usability", "workflow", "project-care-coordination"], "related_components": ["alert-triage-queue", "chart-review-summary-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/care-coordination-triage.md", "corrections": [], "html": "<h1>Care Coordination &amp; Alert Triage</h1>\n<h2>Overview</h2>\n<p>Two sessions bookend this topic: a baseline contextual inquiry of manual chart review (Jan 2025, before any AI concept existed) and a usability test of an AI-ranked alert triage queue (Aug 2025).</p>\n<ul><li><strong>The baseline recommended a narrow scope.</strong> Coordinators already distrusted the EHR&#x27;s auto-generated after-visit summaries, having caught them omitting recently changed medications twice in the past quarter. One coordinator (P05) said: &quot;If it could just tell me what changed since I last touched this chart, that alone would save me time. I don&#x27;t need it to think for me.&quot; The session recommended scoping an early AI concept around &#x27;what changed since last review&#x27; rather than full summarization.</li><li><strong>The AI-ranked queue was faster, but most participants disagreed with its ranking.</strong> In this simulated test, triage of a 20-item queue was faster with AI ranking present (avg 6.5 min) than with a chronological queue (avg 9 min), but 4 of 5 participants disagreed with the AI&#x27;s top-3 ranking on at least one of three test queues, generally because the model weighted recency more heavily than coordinators&#x27; own sense of clinical risk — echoing the alert-fatigue concern raised separately in the May clinician dashboard testing (see [clinician-experience-documentation-burden.md](clinician-experience-documentation-burden.md)). There was also no way to capture <em>why</em> a coordinator overrode a ranking, so that correction signal isn&#x27;t captured anywhere for future model improvement. Separately, the supervisor (P79) worried that speed gains could mask a coordinator rubber-stamping the AI order without real judgment: &quot;fast and wrong is worse than slow and right in this job.&quot; The study&#x27;s own recommendation adds that override-reason capture would give coordinators a sense of agency the current design lacks.</li><li><strong>This is also where the mobile accessibility touch-target finding lands</strong> — the alert-triage icon set audited in November is the same feature tested here in August (see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)).</li></ul>\n<p>Recommendation: add lightweight override-reason capture before further ranking-model tuning, and share it with whoever owns the care-gap flagging model tuning, since it&#x27;s likely the same underlying problem.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-01-29</strong> — <a href=\"../raw/2025-01-29-contextual-inquiry-chart-review-baseline/session-notes.md\">Contextual Inquiry — Manual Chart Review Baseline (Care Coordinators)</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-08-26</strong> — <a href=\"../raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md\">Usability Test — AI Alert Triage for Care Coordination</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-11-18</strong> — <a href=\"../raw/2025-11-18-accessibility-audit-mobile-clinician-app/session-notes.md\">Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</a> <em>(<code>accessibility-audit</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Clinician Experience &amp; Documentation Burden](clinician-experience-documentation-burden.md)</li></ul>", "searchText": "care coordination & alert triage alert-fatigue alert-triage baseline care-coordination chart-review usability workflow project-care-coordination alert-triage-queue chart-review-summary-panel care coordination &amp; alert triage overview two sessions bookend this topic: a baseline contextual inquiry of manual chart review (jan 2025, before any ai concept existed) and a usability test of an ai-ranked alert triage queue (aug 2025). the baseline recommended a narrow scope. coordinators already distrusted the ehr&#x27;s auto-generated after-visit summaries, having caught them omitting recently changed medications twice in the past quarter. one coordinator (p05) said: &quot;if it could just tell me what changed since i last touched this chart, that alone would save me time. i don&#x27;t need it to think for me.&quot; the session recommended scoping an early ai concept around &#x27;what changed since last review&#x27; rather than full summarization. the ai-ranked queue was faster, but most participants disagreed with its ranking. in this simulated test, triage of a 20-item queue was faster with ai ranking present (avg 6.5 min) than with a chronological queue (avg 9 min), but 4 of 5 participants disagreed with the ai&#x27;s top-3 ranking on at least one of three test queues, generally because the model weighted recency more heavily than coordinators&#x27; own sense of clinical risk — echoing the alert-fatigue concern raised separately in the may clinician dashboard testing (see [clinician-experience-documentation-burden.md](clinician-experience-documentation-burden.md)). there was also no way to capture why a coordinator overrode a ranking, so that correction signal isn&#x27;t captured anywhere for future model improvement. separately, the supervisor (p79) worried that speed gains could mask a coordinator rubber-stamping the ai order without real judgment: &quot;fast and wrong is worse than slow and right in this job.&quot; the study&#x27;s own recommendation adds that override-reason capture would give coordinators a sense of agency the current design lacks. this is also where the mobile accessibility touch-target finding lands — the alert-triage icon set audited in november is the same feature tested here in august (see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)). recommendation: add lightweight override-reason capture before further ranking-model tuning, and share it with whoever owns the care-gap flagging model tuning, since it&#x27;s likely the same underlying problem. evidence trail 2025-01-29 — contextual inquiry — manual chart review baseline (care coordinators) ( contextual-inquiry ) 2025-08-26 — usability test — ai alert triage for care coordination ( usability-test ) 2025-11-18 — accessibility audit — mobile clinician app (low vision &amp; motor impairment focus) ( accessibility-audit ) related findings [clinician experience &amp; documentation burden](clinician-experience-documentation-burden.md)"}, {"id": "finding:clinician-experience-documentation-burden", "kind": "finding", "title": "Clinician Experience & Documentation Burden", "date": "2025-09-09", "type": "synthesis", "status": "synthesized", "tags": ["baseline", "burnout", "clinician-experience", "dashboard", "documentation-burden", "information-architecture", "nursing", "survey", "trust-in-ai", "usability", "project-cross-cutting"], "related_components": ["ambient-scribe-widget", "care-gap-badge", "clinician-dashboard"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/clinician-experience-documentation-burden.md", "corrections": [], "html": "<h1>Clinician Experience &amp; Documentation Burden</h1>\n<h2>Overview</h2>\n<p>Three sessions trace clinician sentiment and documentation burden across the year: a nursing attitudes survey (Feb 2025, before AI framing was introduced), a clinician dashboard usability test (May 2025), and an org-wide burnout/documentation-burden baseline survey (Sep 2025, which explicitly referenced the AI initiative).</p>\n<ul><li><strong>The top volunteered concern was not accuracy or privacy — it was voice.</strong> In February, &quot;losing my clinical narrative voice / it will sound robotic&quot; was the most common open-ended concern among nurses — not accuracy or privacy as originally hypothesized.</li><li><strong>Documentation burden is real and quantifiable, not just anecdotal.</strong> The September baseline found documentation burden is physicians&#x27; #1 self-selected burnout driver (52%, ahead of patient volume at 31%), with 64% doing regular after-hours &quot;pajama time&quot; charting (avg. 1.2 hrs/day). The session recommends it as the official pre-AI baseline for measuring Compass AI&#x27;s impact at 6 and 12 months post-rollout. <strong>Caveat:</strong> the September survey mentioned the AI initiative explicitly in its framing, while the February survey didn&#x27;t — any comparison between the two datasets needs to account for that framing difference, not treat them as a clean before/after.</li><li><strong>Alert fatigue is an emerging risk, not yet realized.</strong> The May dashboard test found that 5 of 6 participants expected AI-flagged &quot;care gap&quot; badges to become background noise within a week if flagging precision isn&#x27;t improved — 2 of the 3 example flags shown were judged clinically low-value. The care-coordination alert triage testing later echoed this alert-fatigue concern (see [care-coordination-triage.md](care-coordination-triage.md)). That session judged the two &quot;likely the same underlying tuning problem&quot; — an inference it recommended sharing with the care-gap model&#x27;s Data Science team, not something either session tested.</li></ul>\n<p>Recommendation: do not ship the care-gap flagging feature until precision is validated against clinical review, and use the September survey as the fixed baseline instrument for future comparisons rather than re-wording the questions.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-02-11</strong> — <a href=\"../raw/2025-02-11-survey-nursing-attitudes-ai-documentation/session-notes.md\">Survey — Nursing Staff Attitudes Toward AI-Assisted Documentation</a> <em>(<code>survey</code>)</em></li><li><strong>2025-05-06</strong> — <a href=\"../raw/2025-05-06-usability-test-clinician-dashboard-redesign-v1/session-notes.md\">Usability Test — Clinician Dashboard Redesign (v1)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-09-09</strong> — <a href=\"../raw/2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md\">Survey — Clinician Burnout &amp; Documentation Burden Baseline</a> <em>(<code>survey</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[Care Coordination &amp; Alert Triage](care-coordination-triage.md)</li></ul>", "searchText": "clinician experience & documentation burden baseline burnout clinician-experience dashboard documentation-burden information-architecture nursing survey trust-in-ai usability project-cross-cutting ambient-scribe-widget care-gap-badge clinician-dashboard clinician experience &amp; documentation burden overview three sessions trace clinician sentiment and documentation burden across the year: a nursing attitudes survey (feb 2025, before ai framing was introduced), a clinician dashboard usability test (may 2025), and an org-wide burnout/documentation-burden baseline survey (sep 2025, which explicitly referenced the ai initiative). the top volunteered concern was not accuracy or privacy — it was voice. in february, &quot;losing my clinical narrative voice / it will sound robotic&quot; was the most common open-ended concern among nurses — not accuracy or privacy as originally hypothesized. documentation burden is real and quantifiable, not just anecdotal. the september baseline found documentation burden is physicians&#x27; #1 self-selected burnout driver (52%, ahead of patient volume at 31%), with 64% doing regular after-hours &quot;pajama time&quot; charting (avg. 1.2 hrs/day). the session recommends it as the official pre-ai baseline for measuring compass ai&#x27;s impact at 6 and 12 months post-rollout. caveat: the september survey mentioned the ai initiative explicitly in its framing, while the february survey didn&#x27;t — any comparison between the two datasets needs to account for that framing difference, not treat them as a clean before/after. alert fatigue is an emerging risk, not yet realized. the may dashboard test found that 5 of 6 participants expected ai-flagged &quot;care gap&quot; badges to become background noise within a week if flagging precision isn&#x27;t improved — 2 of the 3 example flags shown were judged clinically low-value. the care-coordination alert triage testing later echoed this alert-fatigue concern (see [care-coordination-triage.md](care-coordination-triage.md)). that session judged the two &quot;likely the same underlying tuning problem&quot; — an inference it recommended sharing with the care-gap model&#x27;s data science team, not something either session tested. recommendation: do not ship the care-gap flagging feature until precision is validated against clinical review, and use the september survey as the fixed baseline instrument for future comparisons rather than re-wording the questions. evidence trail 2025-02-11 — survey — nursing staff attitudes toward ai-assisted documentation ( survey ) 2025-05-06 — usability test — clinician dashboard redesign (v1) ( usability-test ) 2025-09-09 — survey — clinician burnout &amp; documentation burden baseline ( survey ) related findings [ambient ai scribe](ambient-scribe.md) [care coordination &amp; alert triage](care-coordination-triage.md)"}, {"id": "finding:governance-and-phi", "kind": "finding", "title": "AI Governance, PHI & Compliance", "date": "2026-06-02", "type": "synthesis", "status": "synthesized", "tags": ["ai-generated-content", "ai-strategy", "audit-trail", "cmio", "de-identification", "executive", "governance", "hipaa", "kickoff", "legal-record", "phi", "privacy", "retro", "roadmap", "year-end", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/governance-and-phi.md", "corrections": [], "html": "<h1>AI Governance, PHI &amp; Compliance</h1>\n<h2>Overview</h2>\n<p>This is the connective tissue for the whole program: four sessions across the year — two executive-level sessions, the initial kickoff (Jan 2025) and the year-end retro (Dec 2025), with a Privacy Officer interview (Mar 2025) and a CMIO interview (Aug 2025) in between. Two 2026 HIM interviews (Apr and Jun 2026) add to the open attestation question below.</p>\n<ul><li><strong>The shared-metrics gap identified in January was real and took all year to close.</strong> At kickoff, the CIO and VP Clinical Informatics couldn&#x27;t agree on what &quot;success&quot; meant. By December&#x27;s retro, the same two executives (plus Privacy and CMIO) had converged on two headline 2026 metrics: documentation time saved, and PHI incidents (target: zero). This is the single clearest before/after in the whole research program and should anchor how the 2026 roadmap is framed.</li><li><strong>De-identification and audit-trail requirements (Privacy Officer, Mar) turned out to be non-negotiable engineering constraints, not policy nice-to-haves</strong>: Safe Harbor-level de-identification for any fine-tuning/eval data, and model-version + input provenance logging for anything that becomes part of the legal record. These constraints were later validated as workable by the CMIO&#x27;s August interview, which proposed a concrete attestation model (once a clinician signs AI-assisted content, it carries the same liability as if they&#x27;d typed it, with generation metadata kept in an internal audit log only) — but that model still needs formal Legal/Compliance ratification, it is not yet policy.</li><li><strong>PHI-sensitivity-ordered rollout sequencing</strong> (lowest-sensitivity workflows first: scheduling → admin/coding → documentation → clinical-decision-adjacent) was proposed independently by executives in January and reaffirmed by the CMIO in August — it&#x27;s held up as a stable planning principle across two separate conversations eight months apart.</li><li><strong>A recurring cross-cutting finding was explicitly named as a category, not just fixed three times</strong>: the CIO used the color-only status indicator accessibility bug (found independently in three separate audits — see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)) as the example of a pattern research should flag as such, not file as three unrelated tickets.</li><li><strong>The attestation model says where generation metadata lives, not who can read it or whether it&#x27;s part of the record.</strong> A coding auditor agreed the metadata should stay off the permanent chart, but said &quot;internal&quot; has to include the people who audit codes, not only IT (2026-04-21, HIGH). They also want a per-code record of what an AI coding suggester suggested and what the coder did with it treated as release-blocking (CRITICAL; see [him-coding-and-billing.md](him-coding-and-billing.md)). An ROI specialist didn&#x27;t know whether the scribe&#x27;s drafts or transcripts are part of the designated record set or legal record, or whether a requester could ask for them, and had had no ROI guidance on it since GA. One attorney&#x27;s request for &quot;all versions and drafts&quot; of a visit note was escalated, and they didn&#x27;t hear how it was resolved (2026-06-02, HIGH).</li></ul>\n<p>Two items still need to move from &quot;informally agreed in a meeting&quot; to an actual governance document: the 2026 headline metrics, and the AI-content attestation model. Ratifying the attestation model now also has to settle who can read the internal audit log and whether scribe generation metadata is part of the designated record set.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-01-14</strong> — <a href=\"../raw/2025-01-14-stakeholder-interview-ai-strategy-kickoff/session-notes.md\">AI Strategy Kickoff — Executive Alignment Interview</a> <em>(<code>interview</code>)</em></li><li><strong>2025-03-24</strong> — <a href=\"../raw/2025-03-24-interview-privacy-officer-deidentification-requirements/session-notes.md\">Interview — Privacy/Compliance Officer on De-Identification &amp; Audit Trail Requirements</a> <em>(<code>interview</code>)</em></li><li><strong>2025-08-12</strong> — <a href=\"../raw/2025-08-12-interview-cmio-ai-generated-content-governance/session-notes.md\">Interview — CMIO on Governance for AI-Generated Content in the Legal Record</a> <em>(<code>interview</code>)</em></li><li><strong>2025-12-16</strong> — <a href=\"../raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md\">Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</a> <em>(<code>interview</code>)</em></li><li><strong>2026-04-21</strong> — <a href=\"../raw/2026-04-21-interview-coding-auditor-override-audit-trail/session-notes.md\">Interview — Coding Auditor on Override Tracking and Audit Trail</a> <em>(<code>interview</code>)</em></li><li><strong>2026-06-02</strong> — <a href=\"../raw/2026-06-02-interview-him-specialist-roi-ai-drafted-notes/session-notes.md\">Interview — HIM Specialist on Releasing AI-Drafted Notes</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[Scope Boundaries &amp; Workflow Fit](scope-boundaries-and-workflow-fit.md)</li><li>[Ambient Scribe — Post-GA Refinements](ambient-scribe-post-ga-refinements.md)</li><li>[HIM: Coding, Billing &amp; Release of Information](him-coding-and-billing.md)</li></ul>", "searchText": "ai governance, phi & compliance ai-generated-content ai-strategy audit-trail cmio de-identification executive governance hipaa kickoff legal-record phi privacy retro roadmap year-end project-cross-cutting ai governance, phi &amp; compliance overview this is the connective tissue for the whole program: four sessions across the year — two executive-level sessions, the initial kickoff (jan 2025) and the year-end retro (dec 2025), with a privacy officer interview (mar 2025) and a cmio interview (aug 2025) in between. two 2026 him interviews (apr and jun 2026) add to the open attestation question below. the shared-metrics gap identified in january was real and took all year to close. at kickoff, the cio and vp clinical informatics couldn&#x27;t agree on what &quot;success&quot; meant. by december&#x27;s retro, the same two executives (plus privacy and cmio) had converged on two headline 2026 metrics: documentation time saved, and phi incidents (target: zero). this is the single clearest before/after in the whole research program and should anchor how the 2026 roadmap is framed. de-identification and audit-trail requirements (privacy officer, mar) turned out to be non-negotiable engineering constraints, not policy nice-to-haves : safe harbor-level de-identification for any fine-tuning/eval data, and model-version + input provenance logging for anything that becomes part of the legal record. these constraints were later validated as workable by the cmio&#x27;s august interview, which proposed a concrete attestation model (once a clinician signs ai-assisted content, it carries the same liability as if they&#x27;d typed it, with generation metadata kept in an internal audit log only) — but that model still needs formal legal/compliance ratification, it is not yet policy. phi-sensitivity-ordered rollout sequencing (lowest-sensitivity workflows first: scheduling → admin/coding → documentation → clinical-decision-adjacent) was proposed independently by executives in january and reaffirmed by the cmio in august — it&#x27;s held up as a stable planning principle across two separate conversations eight months apart. a recurring cross-cutting finding was explicitly named as a category, not just fixed three times : the cio used the color-only status indicator accessibility bug (found independently in three separate audits — see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)) as the example of a pattern research should flag as such, not file as three unrelated tickets. the attestation model says where generation metadata lives, not who can read it or whether it&#x27;s part of the record. a coding auditor agreed the metadata should stay off the permanent chart, but said &quot;internal&quot; has to include the people who audit codes, not only it (2026-04-21, high). they also want a per-code record of what an ai coding suggester suggested and what the coder did with it treated as release-blocking (critical; see [him-coding-and-billing.md](him-coding-and-billing.md)). an roi specialist didn&#x27;t know whether the scribe&#x27;s drafts or transcripts are part of the designated record set or legal record, or whether a requester could ask for them, and had had no roi guidance on it since ga. one attorney&#x27;s request for &quot;all versions and drafts&quot; of a visit note was escalated, and they didn&#x27;t hear how it was resolved (2026-06-02, high). two items still need to move from &quot;informally agreed in a meeting&quot; to an actual governance document: the 2026 headline metrics, and the ai-content attestation model. ratifying the attestation model now also has to settle who can read the internal audit log and whether scribe generation metadata is part of the designated record set. evidence trail 2025-01-14 — ai strategy kickoff — executive alignment interview ( interview ) 2025-03-24 — interview — privacy/compliance officer on de-identification &amp; audit trail requirements ( interview ) 2025-08-12 — interview — cmio on governance for ai-generated content in the legal record ( interview ) 2025-12-16 — executive steering committee — year-end retro &amp; 2026 roadmap input ( interview ) 2026-04-21 — interview — coding auditor on override tracking and audit trail ( interview ) 2026-06-02 — interview — him specialist on releasing ai-drafted notes ( interview ) related findings [ambient ai scribe](ambient-scribe.md) [scope boundaries &amp; workflow fit](scope-boundaries-and-workflow-fit.md) [ambient scribe — post-ga refinements](ambient-scribe-post-ga-refinements.md) [him: coding, billing &amp; release of information](him-coding-and-billing.md)"}, {"id": "finding:him-coding-and-billing", "kind": "finding", "title": "HIM: Coding, Billing & Release of Information", "date": "2026-10-06", "type": "synthesis", "status": "synthesized", "tags": ["42-cfr-part-2", "ai-generated-content", "audit-trail", "billing", "coding", "compliance", "documentation", "him", "phi", "release-of-information", "training", "trust-in-ai", "usability", "workflow", "project-him"], "related_components": ["coding-suggestion-panel", "roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/him-coding-and-billing.md", "corrections": [], "html": "<h1>HIM: Coding, Billing &amp; Release of Information</h1>\n<h2>Overview</h2>\n<p>Two contextual/usability sessions in HIM (July 2025) surfaced a shared theme — extremely low risk tolerance for anything that could look like automated judgment on a compliance-sensitive task — from two different angles: release-of-information redaction, and AI-assisted medical coding. Ten follow-up interviews (March–October 2026, after the ambient scribe&#x27;s January 2026 GA) refine both threads; see &quot;Since GA&quot; below.</p>\n<ul><li><strong>Release of information (contextual inquiry) is the higher-stakes of the two.</strong> Staff described ROI as the one area where a mistake has caused real incidents (wrong record released, or behavioral-health notes not correctly given the stricter 42 CFR Part 2 handling). Any AI assistance here would need to be &quot;suggest and highlight for human review only,&quot; never auto-redact-and-release. This session also surfaced a standalone platform gap — there&#x27;s no structured way to flag a note as Part 2-protected in the EHR — that recurred again independently in the October behavioral health research (see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md)) and was found unchanged in ROI (March 2026) and on the coding side (August 2026), making it a gap confirmed in three threads (ROI, behavioral health and coding) worth fixing regardless of any AI plans.</li><li><strong>AI-assisted coding suggestions (usability test) surfaced the same underlying concern in a different shape</strong>: the senior coder&#x27;s objection wasn&#x27;t accuracy (suggestions matched the coder&#x27;s own independent choice in 14 of 20 test scenarios) but audit posture — they wanted it explicit in the UI and audit log that the human coder made the final call, to avoid the suggestion looking like it steered toward upcoding. This is the same &quot;show your work&quot; / attribution-of-decision pattern seen in prior authorization testing (see [prior-authorization.md](prior-authorization.md)).</li></ul>\n<p>Recommendation: any AI feature touching this department needs an explicit, audit-log-visible human-decision boundary as a baseline requirement, not a design nicety — this shows up whether the task is redaction, coding, or (per the prior-auth findings) authorization drafting. The 2026 interviews show the boundary is necessary but not sufficient on its own: it has to come with productivity targets that don&#x27;t reward unreviewed acceptance, and with someone who can see each coder&#x27;s decisions (see below).</p>\n<h2>Since GA: 2026 Follow-up Interviews</h2>\n<p>Ten 1:1 interviews between March and October 2026 (P120–P129, each new to this research) revisited both threads after the ambient scribe went GA. Neither the coding suggester nor an ROI redaction tool has been built or piloted, so reactions to the suggester come from walkthroughs of the July 2025 screens. The only CRITICAL finding in the 2026 set is on coding: a coding auditor would recommend Compliance not sign off on the suggester without a per-code decision record (2026-04-21). That refines rather than replaces the ROI point above: the Part 2 incident exposure staff described in July 2025 still stands, and Part 2 handling is still fully manual. Every figure below is an informal participant estimate, not a count.</p>\n<ul><li><strong>Accept-by-default under productivity targets.</strong> A production coder said that on simple, single-diagnosis charts they would accept a suggested code as shown unless something jumped out, as they already do with prompts in their current tools, and tied this to the charts-per-hour quota rather than to trust in the tool (2026-06-23, HIGH). On complex charts they would ignore suggestions and code from the note, as coders said in July 2025 (2026-06-23, MEDIUM). A coding supervisor&#x27;s main worry was leadership raising targets as soon as a suggester went live, before anyone had measured the time saved, with the informal July 2025 estimate of 2–3 minutes per simple chart applied to every chart (2026-08-11, HIGH). A senior coder expected that saving to &quot;mostly disappear&quot; on all but the simplest visits once citation checks are included (informal guess; 2026-10-06, MEDIUM). The supervisor recommended keeping targets unchanged during any pilot and revisiting them only after measured time per chart, split by simple and complex charts, alongside claim denial and rework rates.</li><li><strong>A per-code decision record, visible to more than auditors.</strong> A coding auditor could not defend a code in an external audit or a claim denial appeal without a per-code record of what the tool suggested, what the coder accepted or overrode and what they changed it to, with user and timestamp; an encounter-level &quot;AI assistance was used&quot; flag isn&#x27;t enough, and they want the record treated as release-blocking (2026-04-21, CRITICAL). For at least the first year they would audit codes accepted without edits at a higher rate, &quot;maybe double the usual sample&quot; (informal; 2026-04-21, MEDIUM), and want the log filterable by acceptance status. A senior coder reached the same requirement independently, called it a precondition for using the tool at all, and wants it visible to the coder in the coding view (2026-10-06, HIGH). A supervisor wants per-coder accept, edit and override rates for training and coaching, not only audit (2026-08-11, MEDIUM), and a revenue cycle analyst wants &quot;suggested and accepted&quot; vs. &quot;entered by coder&quot; visible in claim-edit review (2026-07-14, MEDIUM). This splits July 2025&#x27;s accept/override into three outcomes: accepted, edited and overridden.</li><li><strong>Specificity, citations and scribe-drafted notes.</strong> A coder said scribe-drafted notes often leave out the specificity coding depends on (laterality, acute vs. chronic, type or stage, and the link between conditions), so they query physicians or code to the unspecified level more often than with physician-typed notes (2026-03-10, HIGH). A CDI specialist said these notes read as complete, which makes gaps harder to spot and costs &quot;a few extra minutes per note&quot; (informal; 2026-05-12, HIGH). A senior coder would not accept any suggested code without a source citation down to the specificity level, partly to check the suggester isn&#x27;t echoing a sentence the physician didn&#x27;t catch at sign-off (2026-10-06, MEDIUM). The production coder would open a citation only when a suggestion looked off, which means least often on the charts they&#x27;d accept by default (2026-06-23, MEDIUM). When the note doesn&#x27;t support a specific code, the tool should say so rather than quietly suggest the unspecified code (2026-03-10), or offer a draft, non-leading query for CDI instead of a code (2026-05-12, MEDIUM). Coders can&#x27;t see which sentences the scribe drafted while coding (2026-03-10, MEDIUM). The coder&#x27;s sense that physician queries have risen since GA is an impression; no query counts were reviewed (2026-03-10, MEDIUM).</li><li><strong>Claim denials.</strong> A revenue cycle analyst said coding-related claim denials almost never come from the wrong code category but from specificity: an unspecified diagnosis, a missing laterality or a diagnosis that doesn&#x27;t support the medical necessity of the procedure, which they put at &quot;probably two-thirds or more&quot; of those they work (informal, no report in front of them; 2026-07-14, HIGH). They would judge any pilot on the claim denial rate and rework, with coder throughput second (2026-07-14, LOW). Separately, coders can&#x27;t see that a CDI query is already open on an encounter, a gap that predates the scribe (2026-05-12, LOW).</li><li><strong>Release of information since GA.</strong> Two ROI specialists held the suggest-only position: a person redacts and a person releases (2026-06-02, MEDIUM; 2026-09-08, HIGH), and each flagged item should show why it was flagged (2026-06-02). One would accept batch pre-highlighting, but only for low-risk requests where patients ask for their own records, with every record still opened, checked and released by a specialist; attorney, insurer and possible Part 2 requests stay one at a time (2026-09-08, HIGH). Scribe-drafted notes capture incidental third-party and sensitive content said in passing, which has to be found and redacted page by page, in &quot;maybe one in five or six&quot; scribe-drafted notes (informal guess, varies by clinic; 2026-06-02, HIGH); the specialist worried most about what a tool wouldn&#x27;t flag. The backlog sits with the second-level Part 2 review, which only a few senior specialists can do, and turnaround on those requests has slipped from about a week to closer to two (informal; 2026-03-31, MEDIUM). Turnaround depends mostly on who is asking: &quot;within a few days&quot; for patients&#x27; own recent records, about a week for insurers and &quot;often two weeks or more&quot; for attorneys (all informal impressions; 2026-09-08, MEDIUM). Whether scribe generation metadata is part of the released record is unresolved; see [governance-and-phi.md](governance-and-phi.md) (2026-06-02, HIGH).</li><li><strong>Part 2 knowledge still lives on a printed sheet.</strong> ROI specialists identify Part 2 records from memory and a printed sheet of clinics and note types, and send any substance-use mention to the stricter review to be safe (2026-03-31, HIGH). Coders use an adapted version of the same sheet to know what not to copy into queries, and nobody owns keeping it current (2026-08-11, MEDIUM). Both said scribe-drafted notes can capture more of that content.</li></ul>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-07-15</strong> — <a href=\"../raw/2025-07-15-contextual-inquiry-him-release-of-information/session-notes.md\">Contextual Inquiry — Health Information Management (Release of Information)</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-07-29</strong> — <a href=\"../raw/2025-07-29-usability-test-ai-coding-billing-suggestions/session-notes.md\">Usability Test — AI-Assisted Medical Coding Suggestions</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-03-10</strong> — <a href=\"../raw/2026-03-10-interview-medical-coder-coding-from-ai-drafted-notes/session-notes.md\">Interview — Medical Coder on Coding from AI-Drafted Notes</a> <em>(<code>interview</code>)</em></li><li><strong>2026-03-31</strong> — <a href=\"../raw/2026-03-31-interview-him-supervisor-roi-volume-and-part-2/session-notes.md\">Interview — HIM Supervisor on ROI Volume and Part 2 Handling</a> <em>(<code>interview</code>)</em></li><li><strong>2026-04-21</strong> — <a href=\"../raw/2026-04-21-interview-coding-auditor-override-audit-trail/session-notes.md\">Interview — Coding Auditor on Override Tracking and Audit Trail</a> <em>(<code>interview</code>)</em></li><li><strong>2026-05-12</strong> — <a href=\"../raw/2026-05-12-interview-cdi-specialist-documentation-gaps/session-notes.md\">Interview — CDI Specialist on Documentation Gaps in AI-Drafted Notes</a> <em>(<code>interview</code>)</em></li><li><strong>2026-06-02</strong> — <a href=\"../raw/2026-06-02-interview-him-specialist-roi-ai-drafted-notes/session-notes.md\">Interview — HIM Specialist on Releasing AI-Drafted Notes</a> <em>(<code>interview</code>)</em></li><li><strong>2026-06-23</strong> — <a href=\"../raw/2026-06-23-interview-medical-coder-review-override-habits/session-notes.md\">Interview — Medical Coder on Review and Override Habits</a> <em>(<code>interview</code>)</em></li><li><strong>2026-07-14</strong> — <a href=\"../raw/2026-07-14-interview-revenue-cycle-analyst-claim-denials/session-notes.md\">Interview — Revenue Cycle Analyst on Claim Denials and Coding</a> <em>(<code>interview</code>)</em></li><li><strong>2026-08-11</strong> — <a href=\"../raw/2026-08-11-interview-him-supervisor-coding-team-oversight/session-notes.md\">Interview — HIM Supervisor on Coding Team Oversight</a> <em>(<code>interview</code>)</em></li><li><strong>2026-09-08</strong> — <a href=\"../raw/2026-09-08-interview-him-specialist-roi-request-turnaround/session-notes.md\">Interview — HIM Specialist on ROI Request Turnaround</a> <em>(<code>interview</code>)</em></li><li><strong>2026-10-06</strong> — <a href=\"../raw/2026-10-06-interview-senior-medical-coder-ai-suggestions-concept/session-notes.md\">Interview — Senior Medical Coder on AI Coding Suggestions</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li><li>[AI-Assisted Prior Authorization](prior-authorization.md)</li><li>[Scope Boundaries &amp; Workflow Fit](scope-boundaries-and-workflow-fit.md)</li></ul>", "searchText": "him: coding, billing & release of information 42-cfr-part-2 ai-generated-content audit-trail billing coding compliance documentation him phi release-of-information training trust-in-ai usability workflow project-him coding-suggestion-panel roi-redaction-tool him: coding, billing &amp; release of information overview two contextual/usability sessions in him (july 2025) surfaced a shared theme — extremely low risk tolerance for anything that could look like automated judgment on a compliance-sensitive task — from two different angles: release-of-information redaction, and ai-assisted medical coding. ten follow-up interviews (march–october 2026, after the ambient scribe&#x27;s january 2026 ga) refine both threads; see &quot;since ga&quot; below. release of information (contextual
