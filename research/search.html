) is unresolved as of the 2025-05-20 interview, as is the behavior of an in-progress ambient scribe recording session on forced re-auth."}, {"id": "analytics:onboarding-funnel-dropoff", "kind": "analytics", "title": "Onboarding funnel — drop-off analysis", "date": "2026-01-28", "type": "synthesis", "status": "synthesized", "tags": ["onboarding", "funnel"], "related_components": [], "severity": {}, "path": "../analytics/summaries/onboarding-funnel-dropoff.md", "html": "<h2>Summary</h2>\n<p>Step 3 (\"Connect calendar\") is the single largest drop-off point in the onboarding funnel, accounting for a larger share of incomplete signups than any other step.</p>\n<h2>Data</h2>\n<p>Sourced from the Jan 2026 onboarding funnel export (platform analytics, not included in this fictional dataset — a real repo would keep the untouched export under <code>analytics/raw/2026-01-onboarding-funnel-export/</code>).</p>\n<h2>Interpretation</h2>\n<p>Drop-off concentrated at step 3 independently corroborates the usability study's finding (<code>research/findings/onboarding.md</code>) that step 3's wording is misread as optional — this isn't users abandoning due to task difficulty, it's users not realizing the step is required and exiting instead of completing it.</p>", "searchText": "onboarding funnel — drop-off analysis onboarding funnel summary step 3 (\"connect calendar\") is the single largest drop-off point in the onboarding funnel, accounting for a larger share of incomplete signups than any other step. data sourced from the jan 2026 onboarding funnel export (platform analytics, not included in this fictional dataset — a real repo would keep the untouched export under analytics/raw/2026-01-onboarding-funnel-export/ ). interpretation drop-off concentrated at step 3 independently corroborates the usability study's finding ( research/findings/onboarding.md ) that step 3's wording is misread as optional — this isn't users abandoning due to task difficulty, it's users not realizing the step is required and exiting instead of completing it."}, {"id": "deliverable:research-plans/onboarding-usability-study-q1", "kind": "deliverable", "title": "Onboarding Usability Study — Q1", "date": "2026-01-12", "type": "research-plans", "status": "final", "tags": ["onboarding", "usability", "q1"], "related_components": [], "severity": {}, "path": "../research-plans/onboarding-usability-study-q1.md", "html": "<h2>Objectives</h2>\n<p>Understand where new workspace admins get stuck during first-time setup, and whether the current 6-step onboarding wizard matches how admins actually think about the task.</p>\n<h2>Method</h2>\n<p>Moderated remote usability sessions, 45 minutes each, think-aloud protocol. Sample: 6 participants, all first-time Fernway admins hired within the last 90 days, mix of company sizes (10–200 employees).</p>\n<h2>Timeline</h2>\n<ul><li>Recruiting: Jan 12–16</li><li>Sessions: Jan 19–23</li><li>Synthesis: Jan 26–30</li></ul>\n<h2>Related</h2>\n<p>See <code>facilitation-guides/onboarding-usability-guide.md</code> for the session script.</p>", "searchText": "onboarding usability study — q1 onboarding usability q1 objectives understand where new workspace admins get stuck during first-time setup, and whether the current 6-step onboarding wizard matches how admins actually think about the task. method moderated remote usability sessions, 45 minutes each, think-aloud protocol. sample: 6 participants, all first-time fernway admins hired within the last 90 days, mix of company sizes (10–200 employees). timeline recruiting: jan 12–16 sessions: jan 19–23 synthesis: jan 26–30 related see facilitation-guides/onboarding-usability-guide.md for the session script."}, {"id": "deliverable:facilitation-guides/onboarding-usability-guide", "kind": "deliverable", "title": "Onboarding Usability Study — Facilitation Guide", "date": "2026-01-16", "type": "facilitation-guides", "status": "final", "tags": ["onboarding", "usability"], "related_components": [], "severity": {}, "path": "../facilitation-guides/onboarding-usability-guide.md", "html": "<h2>Warm-up</h2>\n<ul><li>Tell me about your role and how long you've been using Fernway.</li><li>Walk me through the last time you set up a new workspace for your team.</li></ul>\n<h2>Core questions</h2>\n<ul><li>(Task) Imagine you just signed up — walk me through what you'd do first.</li><li>What does \"workspace\" mean to you before you've used the product?</li><li>At each step: what do you expect to happen next, before you click?</li></ul>\n<h2>Wrap-up</h2>\n<ul><li>What was the most confusing part of getting set up?</li><li>If you could change one thing about this flow, what would it be?</li><li>Thanks — anything you'd like to add that we didn't cover?</li></ul>", "searchText": "onboarding usability study — facilitation guide onboarding usability warm-up tell me about your role and how long you've been using fernway. walk me through the last time you set up a new workspace for your team. core questions (task) imagine you just signed up — walk me through what you'd do first. what does \"workspace\" mean to you before you've used the product? at each step: what do you expect to happen next, before you click? wrap-up what was the most confusing part of getting set up? if you could change one thing about this flow, what would it be? thanks — anything you'd like to add that we didn't cover?"}, {"id": "deliverable:topline-summaries/example-topline-summary", "kind": "deliverable", "title": "Onboarding Study — Session 1–3 Topline", "date": "2026-01-21", "type": "topline-summaries", "status": "final", "tags": ["onboarding", "usability"], "related_components": [], "severity": {}, "path": "../topline-summaries/example-topline-summary.md", "html": "<h2>Quick takeaways</h2>\n<ul><li>All 3 participants paused at step 3 (\"Invite your team\") — unsure whether</li></ul>\n<p>invites send immediately or wait until setup is finished.</p>\n<ul><li>2 of 3 tried to skip step 2 (\"Connect calendar\") entirely, assuming it was</li></ul>\n<p>optional even though it's required.</p>\n<ul><li>Nobody read the sidebar progress indicator — all navigated by scrolling.</li></ul>\n<h2>Open questions</h2>\n<ul><li>Is the step-3 hesitation about wording, or about not trusting the system</li></ul>\n<p>yet this early in the relationship? Watch for this in sessions 4–6.</p>", "searchText": "onboarding study — session 1–3 topline onboarding usability quick takeaways all 3 participants paused at step 3 (\"invite your team\") — unsure whether invites send immediately or wait until setup is finished. 2 of 3 tried to skip step 2 (\"connect calendar\") entirely, assuming it was optional even though it's required. nobody read the sidebar progress indicator — all navigated by scrolling. open questions is the step-3 hesitation about wording, or about not trusting the system yet this early in the relationship? watch for this in sessions 4–6."}, {"id": "deliverable:research-readouts/example-research-readout", "kind": "deliverable", "title": "Onboarding Flow — Q1 Readout", "date": "2026-02-03", "type": "research-readouts", "status": "final", "tags": ["onboarding", "readout", "q1"], "related_components": [], "severity": {}, "path": "../research-readouts/example-research-readout.md", "html": "<h2>Summary</h2>\n<p>New admins drop off most at the calendar-connection step, not because the step is hard, but because it's unclear it's required. Funnel data confirms the same step as the largest single drop-off point.</p>\n<h2>Key findings</h2>\n<ul><li>Step 3 wording implies optionality it doesn't have — see finding</li></ul>\n<p><code>onboarding</code>.</p>\n<ul><li>Progress indicator is present but unused; participants navigate by scroll,</li></ul>\n<p>not by the indicator.</p>\n<h2>Recommendations</h2>\n<ul><li>Relabel step 3 to state clearly that calendar connection is required.</li><li>Consider removing the sidebar progress indicator or replacing it with</li></ul>\n<p>inline step numbers, since it isn't being used as designed.</p>", "searchText": "onboarding flow — q1 readout onboarding readout q1 summary new admins drop off most at the calendar-connection step, not because the step is hard, but because it's unclear it's required. funnel data confirms the same step as the largest single drop-off point. key findings step 3 wording implies optionality it doesn't have — see finding onboarding . progress indicator is present but unused; participants navigate by scroll, not by the indicator. recommendations relabel step 3 to state clearly that calendar connection is required. consider removing the sidebar progress indicator or replacing it with inline step numbers, since it isn't being used as designed."}, {"id": "deliverable:heuristic-evaluations/example-heuristic-evaluation", "kind": "deliverable", "title": "Onboarding Wizard — Heuristic Evaluation", "date": "2026-02-05", "type": "heuristic-evaluations", "status": "final", "tags": ["onboarding", "heuristic-evaluation"], "related_components": [], "severity": {}, "path": "../heuristic-evaluations/example-heuristic-evaluation.md", "html": "<h2>Scope</h2>\n<p>Full onboarding wizard, steps 1–6, desktop web only.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>Heuristic violated</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Step 3 wording implies \"connect calendar\" is optional when it's required</td><td>Match between system and real world</td><td>3</td><td>Step 3</td></tr><tr><td>No way to go back without losing entered data</td><td>User control and freedom</td><td>3</td><td>Steps 2–5</td></tr><tr><td>Progress indicator doesn't reflect actual step count on mobile</td><td>Consistency and standards</td><td>2</td><td>Sidebar, mobile view</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Prioritize the step 3 wording fix (matches usability study finding) and the back-navigation data-loss issue before the mobile indicator fix.</p>", "searchText": "onboarding wizard — heuristic evaluation onboarding heuristic-evaluation scope full onboarding wizard, steps 1–6, desktop web only. issues found issue heuristic violated severity location step 3 wording implies \"connect calendar\" is optional when it's required match between system and real world 3 step 3 no way to go back without losing entered data user control and freedom 3 steps 2–5 progress indicator doesn't reflect actual step count on mobile consistency and standards 2 sidebar, mobile view recommendations prioritize the step 3 wording fix (matches usability study finding) and the back-navigation data-loss issue before the mobile indicator fix."}, {"id": "deliverable:accessibility-screenings/example-accessibility-screening", "kind": "deliverable", "title": "Onboarding Wizard — Accessibility Screening", "date": "2026-02-06", "type": "accessibility-screenings", "status": "final", "tags": ["onboarding", "accessibility"], "related_components": [], "severity": {}, "path": "../accessibility-screenings/example-accessibility-screening.md", "html": "<h2>Scope</h2>\n<p>Onboarding wizard, steps 1–6, screened against WCAG 2.1 AA using keyboard-only navigation and VoiceOver.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>WCAG criterion</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Calendar-connect button has no accessible label, reads as \"button\"</td><td>4.1.2 Name, Role, Value</td><td>High</td><td>Step 3</td></tr><tr><td>Focus order skips the \"Skip this step\" link</td><td>2.4.3 Focus Order</td><td>Medium</td><td>Step 3</td></tr><tr><td>Error message color contrast is 3.2:1, below the 4.5:1 minimum</td><td>1.4.3 Contrast (Minimum)</td><td>Medium</td><td>Steps 2, 4</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Fix the calendar-connect button label first — it's a full blocker for screen-reader users completing the required step.</p>", "searchText": "onboarding wizard — accessibility screening onboarding accessibility scope onboarding wizard, steps 1–6, screened against wcag 2.1 aa using keyboard-only navigation and voiceover. issues found issue wcag criterion severity location calendar-connect button has no accessible label, reads as \"button\" 4.1.2 name, role, value high step 3 focus order skips the \"skip this step\" link 2.4.3 focus order medium step 3 error message color contrast is 3.2:1, below the 4.5:1 minimum 1.4.3 contrast (minimum) medium steps 2, 4 recommendations fix the calendar-connect button label first — it's a full blocker for screen-reader users completing the required step."}, {"id": "deliverable:service-topology/example-service-topology", "kind": "deliverable", "title": "Onboarding & Account Provisioning — Service Topology", "date": "2026-02-10", "type": "service-topology", "status": "in-review", "tags": ["onboarding", "service-blueprint"], "related_components": [], "severity": {}, "path": "../service-topology/example-service-topology.md", "html": "<h2>Overview</h2>\n<p>Maps the onboarding wizard's front-end steps against the backend services they trigger: account creation, workspace provisioning, and calendar OAuth.</p>\n<h2>Map</h2>\n<p>Signup form -&gt; Account Service (sync) -&gt; Workspace Provisioning (async, ~8s average) -&gt; Calendar OAuth (external, Google/Outlook) -&gt; Invite Service (sends on submit, not on step completion — this is the source of the step-3 \"does this send now?\" confusion identified in the usability study).</p>", "searchText": "onboarding & account provisioning — service topology onboarding service-blueprint overview maps the onboarding wizard's front-end steps against the backend services they trigger: account creation, workspace provisioning, and calendar oauth. map signup form -&gt; account service (sync) -&gt; workspace provisioning (async, ~8s average) -&gt; calendar oauth (external, google/outlook) -&gt; invite service (sends on submit, not on step completion — this is the source of the step-3 \"does this send now?\" confusion identified in the usability study)."}, {"id": "deliverable:personas/dana-overwhelmed-new-admin", "kind": "deliverable", "title": "Dana — The Overwhelmed New Admin", "date": "2026-02-12", "type": "personas", "status": "final", "tags": ["onboarding", "persona"], "related_components": [], "severity": {}, "path": "../personas/dana-overwhelmed-new-admin.md", "html": "<h2>Summary</h2>\n<p>Dana, 34, Office Manager at a 40-person company. Just been handed Fernway setup as \"one more thing\" on top of her regular job. Not technical, but capable — she just doesn't have time to figure things out by trial and error.</p>\n<h2>Goals</h2>\n<ul><li>Get the team up and running with minimal back-and-forth.</li><li>Avoid looking like she broke something in front of her team.</li></ul>\n<h2>Frustrations</h2>\n<ul><li>Steps that don't clearly say what's required vs. optional.</li><li>No way to preview what happens before committing to an action.</li></ul>\n<h2>Based on</h2>\n<p>Grounded in <code>research-plans/onboarding-usability-study-q1.md</code>, sessions 1–6.</p>", "searchText": "dana — the overwhelmed new admin onboarding persona summary dana, 34, office manager at a 40-person company. just been handed fernway setup as \"one more thing\" on top of her regular job. not technical, but capable — she just doesn't have time to figure things out by trial and error. goals get the team up and running with minimal back-and-forth. avoid looking like she broke something in front of her team. frustrations steps that don't clearly say what's required vs. optional. no way to preview what happens before committing to an action. based on grounded in research-plans/onboarding-usability-study-q1.md , sessions 1–6."}, {"id": "deliverable:mental-models/example-mental-model", "kind": "deliverable", "title": "Workspace Setup — Mental Model", "date": "2026-02-13", "type": "mental-models", "status": "in-review", "tags": ["onboarding", "mental-model"], "related_components": [], "severity": {}, "path": "../mental-models/example-mental-model.md", "html": "<h2>Overview</h2>\n<p>Covers how new admins conceptualize \"setting up a workspace\" before they've used Fernway, versus how the system actually models the task.</p>\n<h2>Model</h2>\n<p>Admins think of setup as one task with optional extras (\"connect stuff if I want to\"). The system actually models it as a required linear sequence where several \"extras\" (like calendar connection) gate later functionality. This mismatch is the root cause behind the step-3 confusion seen across research.</p>", "searchText": "workspace setup — mental model onboarding mental-model overview covers how new admins conceptualize \"setting up a workspace\" before they've used fernway, versus how the system actually models the task. model admins think of setup as one task with optional extras (\"connect stuff if i want to\"). the system actually models it as a required linear sequence where several \"extras\" (like calendar connection) gate later functionality. this mismatch is the root cause behind the step-3 confusion seen across research."}, {"id": "deliverable:mindsets/example-mindset", "kind": "deliverable", "title": "Time-Pressed First-Time Admin", "date": "2026-02-13", "type": "mindsets", "status": "final", "tags": ["onboarding", "mindset"], "related_components": [], "severity": {}, "path": "../mindsets/example-mindset.md", "html": "<h2>Overview</h2>\n<p>Not a persona — a mindset that shows up across multiple admin personas. Defined by low time budget and a \"just get it done\" orientation, regardless of technical skill level.</p>\n<h2>Implications</h2>\n<p>Design for skimmability over completeness: fewer required decisions, clearer signaling of what's mandatory, and no dead-ends that force starting over.</p>", "searchText": "time-pressed first-time admin onboarding mindset overview not a persona — a mindset that shows up across multiple admin personas. defined by low time budget and a \"just get it done\" orientation, regardless of technical skill level. implications design for skimmability over completeness: fewer required decisions, clearer signaling of what's mandatory, and no dead-ends that force starting over."}, {"id": "deliverable:journey-maps/example-journey-map", "kind": "deliverable", "title": "New Admin Onboarding — Journey Map", "date": "2026-02-14", "type": "journey-maps", "status": "final", "tags": ["onboarding", "journey-map"], "related_components": [], "severity": {}, "path": "../journey-maps/example-journey-map.md", "html": "<h2>Overview</h2>\n<p>Follows Dana from receiving the \"set up Fernway\" task through first successful workspace creation.</p>\n<h2>Stages</h2>\n<ol><li><strong>Signup</strong> — Confident, low effort.</li><li><strong>Step 1–2 (Basics, Calendar)</strong> — Still confident; pauses briefly at</li></ol>\n<p>calendar connection, unsure if required, proceeds anyway.</p>\n<ol><li><strong>Step 3 (Invite team)</strong> — Anxious — worried invites are sending before</li></ol>\n<p>she's ready. Stalls here longest of any step.</p>\n<ol><li><strong>Step 4–5 (Preferences, Review)</strong> — Relief; the hard part felt over.</li><li><strong>Completion</strong> — Mild surprise the setup is actually done — no strong</li></ol>\n<p>confirmation moment.</p>", "searchText": "new admin onboarding — journey map onboarding journey-map overview follows dana from receiving the \"set up fernway\" task through first successful workspace creation. stages signup — confident, low effort. step 1–2 (basics, calendar) — still confident; pauses briefly at calendar connection, unsure if required, proceeds anyway. step 3 (invite team) — anxious — worried invites are sending before she's ready. stalls here longest of any step. step 4–5 (preferences, review) — relief; the hard part felt over. completion — mild surprise the setup is actually done — no strong confirmation moment."}, {"id": "deliverable:thumbnails/example-thumbnail", "kind": "deliverable", "title": "Workspace Setup Screen — Thumbnail Explorations", "date": "2026-02-17", "type": "thumbnails", "status": "draft", "tags": ["onboarding", "thumbnails"], "related_components": [], "severity": {}, "path": "../thumbnails/example-thumbnail.md", "html": "<h2>Concept</h2>\n<p>Six quick sketches exploring how to make it clear that invites don't send until the whole wizard is submitted.</p>\n<h2>Options considered</h2>\n<ol><li>Explicit \"Invites will send when you finish setup\" banner — carried forward.</li><li>A draft/preview list with a visible \"not sent yet\" state — carried forward.</li><li>Moving invites to the very last step — dropped, breaks existing step order</li></ol>\n<p>research already validated elsewhere.</p>", "searchText": "workspace setup screen — thumbnail explorations onboarding thumbnails concept six quick sketches exploring how to make it clear that invites don't send until the whole wizard is submitted. options considered explicit \"invites will send when you finish setup\" banner — carried forward. a draft/preview list with a visible \"not sent yet\" state — carried forward. moving invites to the very last step — dropped, breaks existing step order research already validated elsewhere."}, {"id": "deliverable:wireframes/workspace-setup-step3", "kind": "deliverable", "title": "Workspace Setup — Step 3 Wireframe", "date": "2026-02-19", "type": "wireframes", "status": "in-review", "tags": ["onboarding", "wireframe"], "related_components": [], "severity": {}, "path": "../wireframes/workspace-setup-step3.md", "html": "<h2>Overview</h2>\n<p>Lo-fi layout for the reworked step 3, incorporating the \"not sent yet\" banner and draft invite list from the thumbnail exploration.</p>\n<h2>Notes</h2>\n<p>Banner sits above the invite input, persistent until submit. Draft list shows entered emails with a \"Draft — not sent\" tag next to each.</p>", "searchText": "workspace setup — step 3 wireframe onboarding wireframe overview lo-fi layout for the reworked step 3, incorporating the \"not sent yet\" banner and draft invite list from the thumbnail exploration. notes banner sits above the invite input, persistent until submit. draft list shows entered emails with a \"draft — not sent\" tag next to each."}, {"id": "deliverable:user-flows/onboarding-flow", "kind": "deliverable", "title": "Onboarding Flow — v2", "date": "2026-02-20", "type": "user-flows", "status": "in-review", "tags": ["onboarding", "user-flow"], "related_components": [], "severity": {}, "path": "../user-flows/onboarding-flow.md", "html": "<h2>Overview</h2>\n<p>Signup through first workspace created, v2 (post-research revisions).</p>\n<h2>Steps</h2>\n<ol><li>Signup</li><li>Basics (workspace name, team size)</li><li>Calendar connect (now clearly marked required)</li><li>Invite team (now shows draft/not-sent state)</li><li>Preferences</li><li>Review &amp; finish</li></ol>", "searchText": "onboarding flow — v2 onboarding user-flow overview signup through first workspace created, v2 (post-research revisions). steps signup basics (workspace name, team size) calendar connect (now clearly marked required) invite team (now shows draft/not-sent state) preferences review &amp; finish"}, {"id": "deliverable:wireflows/example-wireflow", "kind": "deliverable", "title": "Onboarding Flow — Step 3 Wireflow", "date": "2026-02-21", "type": "wireflows", "status": "draft", "tags": ["onboarding", "wireflow"], "related_components": [], "severity": {}, "path": "../wireflows/example-wireflow.md", "html": "<h2>Overview</h2>\n<p>Combines the step 3 flow logic with its wireframe, including the branch where a user tries to skip and sees the \"required\" messaging instead.</p>\n<h2>Flow + screens</h2>\n<p>Step 2 complete -&gt; Step 3 loads (draft list empty) -&gt; user adds email(s) -&gt; \"Draft — not sent\" tag appears -&gt; user clicks Next -&gt; Step 4. Skip attempt branch: user clicks \"Skip\" -&gt; inline message explains why it can't be skipped -&gt; returns to Step 3.</p>", "searchText": "onboarding flow — step 3 wireflow onboarding wireflow overview combines the step 3 flow logic with its wireframe, including the branch where a user tries to skip and sees the \"required\" messaging instead. flow + screens step 2 complete -&gt; step 3 loads (draft list empty) -&gt; user adds email(s) -&gt; \"draft — not sent\" tag appears -&gt; user clicks next -&gt; step 4. skip attempt branch: user clicks \"skip\" -&gt; inline message explains why it can't be skipped -&gt; returns to step 3."}, {"id": "deliverable:storyboards/example-storyboard", "kind": "deliverable", "title": "Dana's Monday Morning Setup", "date": "2026-02-24", "type": "storyboards", "status": "draft", "tags": ["onboarding", "storyboard"], "related_components": [], "severity": {}, "path": "../storyboards/example-storyboard.md", "html": "<h2>Scenario</h2>\n<p>Dana has 15 minutes between meetings and has been asked to \"just get Fernway set up\" before the team's first call. She's setting up on her laptop while half-watching Slack.</p>\n<h2>Panels</h2>\n<ol><li>Dana opens the signup link from an email, still reading a Slack message.</li><li>She breezes through steps 1–2, barely reading.</li><li>Step 3 — she stops, phone buzzes, she hesitates before adding real emails.</li><li>She adds one test email first to see what happens (current design gives</li></ol>\n<p>her no way to do this safely).</p>\n<ol><li>Relief when nothing sends immediately — but she wasn't sure until then.</li></ol>", "searchText": "dana's monday morning setup onboarding storyboard scenario dana has 15 minutes between meetings and has been asked to \"just get fernway set up\" before the team's first call. she's setting up on her laptop while half-watching slack. panels dana opens the signup link from an email, still reading a slack message. she breezes through steps 1–2, barely reading. step 3 — she stops, phone buzzes, she hesitates before adding real emails. she adds one test email first to see what happens (current design gives her no way to do this safely). relief when nothing sends immediately — but she wasn't sure until then."}, {"id": "deliverable:mockups/example-mockups", "kind": "deliverable", "title": "Workspace Setup — Step 3 Mockup", "date": "2026-02-26", "type": "mockups", "status": "in-review", "tags": ["onboarding", "mockup"], "related_components": [], "severity": {}, "path": "../mockups/example-mockups.md", "html": "<h2>Overview</h2>\n<p>Hi-fi visual design for the reworked step 3, matching the wireframe and brand style guide.</p>\n<h2>Notes</h2>\n<p>Banner uses the \"info\" token color from the design system, not \"warning\" — this isn't an error state, just a clarification.</p>", "searchText": "workspace setup — step 3 mockup onboarding mockup overview hi-fi visual design for the reworked step 3, matching the wireframe and brand style guide. notes banner uses the \"info\" token color from the design system, not \"warning\" — this isn't an error state, just a clarification."}, {"id": "deliverable:prototypes/example-prototype", "kind": "deliverable", "title": "Onboarding Flow v2 — Click-through", "date": "2026-02-27", "type": "prototypes", "status": "final", "tags": ["onboarding", "prototype"], "related_components": [], "severity": {}, "path": "../prototypes/example-prototype.md", "html": "<p>Click-through prototype covering the full reworked onboarding flow, steps 1–6, including the step 3 draft/not-sent state. Used for the Feb 28 stakeholder walkthrough and as the reference for the v2 usability re-test.</p>", "searchText": "onboarding flow v2 — click-through onboarding prototype click-through prototype covering the full reworked onboarding flow, steps 1–6, including the step 3 draft/not-sent state. used for the feb 28 stakeholder walkthrough and as the reference for the v2 usability re-test."}, {"id": "deliverable:design-system/example-design-system", "kind": "deliverable", "title": "Design System — v3.2 Snapshot", "date": "2026-02-28", "type": "design-system", "status": "final", "tags": ["design-system"], "related_components": [], "severity": {}, "path": "../design-system/example-design-system.md", "html": "<h2>Overview</h2>\n<p>Snapshot of the component library as of v3.2, covering the components used in the onboarding v2 redesign (banner, draft-tag, stepper).</p>\n<h2>Components</h2>\n<p>Banner (info/warning/error variants), Draft Tag, Stepper (desktop + mobile variants — mobile variant updated post accessibility screening).</p>", "searchText": "design system — v3.2 snapshot design-system overview snapshot of the component library as of v3.2, covering the components used in the onboarding v2 redesign (banner, draft-tag, stepper). components banner (info/warning/error variants), draft tag, stepper (desktop + mobile variants — mobile variant updated post accessibility screening)."}, {"id": "deliverable:style-guide/foundations-v3", "kind": "deliverable", "title": "Style Guide — Foundations v3", "date": "2026-02-28", "type": "style-guide", "status": "final", "tags": ["style-guide"], "related_components": [], "severity": {}, "path": "../style-guide/foundations-v3.md", "html": "<h2>Overview</h2>\n<p>Foundational tokens referenced by the onboarding v2 mockups — colors, type scale, spacing.</p>\n<h2>Foundations</h2>\n<p>Info color updated this version (previously too close to the warning color in contrast testing — see accessibility screening for the related contrast issue on error messages).</p>", "searchText": "style guide — foundations v3 style-guide overview foundational tokens referenced by the onboarding v2 mockups — colors, type scale, spacing. foundations info color updated this version (previously too close to the warning color in contrast testing — see accessibility screening for the related contrast issue on error messages)."}]</script>
<script>
(function () {
  const records = JSON.parse(document.getElementById('research-data').textContent);
  const TYPE_LABELS = {"usability-test": "Usability test", "interview": "Interview", "survey": "Survey", "contextual-inquiry": "Contextual inquiry", "accessibility-audit": "Accessibility audit", "analytics": "Analytics", "analytics-summary": "Analytics summary", "synthesis": "Synthesis", "research-plans": "Research plan", "facilitation-guides": "Facilitation guide", "topline-summaries": "Topline summary", "research-readouts": "Research readout", "heuristic-evaluations": "Heuristic evaluation", "accessibility-screenings": "Accessibility screening", "service-topology": "Service topology", "personas": "Persona", "mental-models": "Mental model", "mindsets": "Mindset", "journey-maps": "Journey map", "thumbnails": "Thumbnail", "wireframes": "Wireframe", "user-flows": "User flow", "wireflows": "Wireflow", "storyboards": "Storyboard", "mockups": "Mockup", "prototypes": "Prototype", "design-system": "Design system", "style-guide": "Style guide"};
  const KIND_LABELS = { raw: 'Sessions', finding: 'Findings', component: 'Components', analytics: 'Analytics', deliverable: 'Deliverables' };
  const KIND_COLORS = { raw: 'var(--kind-raw)', finding: 'var(--kind-finding)', component: 'var(--kind-component)', analytics: 'var(--kind-analytics)', deliverable: 'var(--kind-deliverable)' };
  const SEV_COLORS = { critical: 'var(--sev-critical)', high: 'var(--sev-high)', medium: 'var(--sev-medium)', low: 'var(--sev-low)' };

  const state = {
    query: '',
    kinds: new Set(['raw', 'finding', 'component', 'analytics', 'deliverable']),
    types: new Set(),
    tags: new Set(),
    openId: null,
  };

  const allKinds = ['raw', 'finding', 'component', 'analytics', 'deliverable'];
  const allTypes = [...new Set(records.map(r => r.type).filter(Boolean))].sort();
  const allTags = [...new Set(records.flatMap(r => r.tags))].sort();
  state.types = new Set(allTypes);

  function countFor(predicate) {
    return records.filter(predicate).length;
  }

  function renderKindFilters() {
    const el = document.getElementById('kind-filters');
    el.innerHTML = allKinds.map(k => {
      const count = countFor(r => r.kind === k);
      const checked = state.kinds.has(k) ? 'checked' : '';
      return `<label class="filter-row"><input type="checkbox" data-kind="${k}" ${checked}>${KIND_LABELS[k]}<span class="count">${count}</span></label>`;
    }).join('');
    el.querySelectorAll('input[data-kind]').forEach(input => {
      input.addEventListener('change', () => {
        const k = input.getAttribute('data-kind');
        if (input.checked) state.kinds.add(k); else state.kinds.delete(k);
        render();
      });
    });
  }

  function renderTypeFilters() {
    const el = document.getElementById('type-filters');
    el.innerHTML = allTypes.map(t => {
      const count = countFor(r => r.type === t);
      const checked = state.types.has(t) ? 'checked' : '';
      return `<label class="filter-row"><input type="checkbox" data-type="${t}" ${checked}>${TYPE_LABELS[t] || t}<span class="count">${count}</span></label>`;
    }).join('');
    el.querySelectorAll('input[data-type]').forEach(input => {
      input.addEventListener('change', () => {
        const t = input.getAttribute('data-type');
        if (input.checked) state.types.add(t); else state.types.delete(t);
        render();
      });
    });
  }

  function renderTagFilters() {
    const el = document.getElementById('tag-filters');
    el.innerHTML = allTags.map(tag => {
      const active = state.tags.has(tag) ? 'active' : '';
      return `<button type="button" class="tag-chip ${active}" data-tag="${tag}">${tag}</button>`;
    }).join('');
    el.querySelectorAll('.tag-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.getAttribute('data-tag');
        if (state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
        render();
      });
    });
  }

  function matches(record) {
    if (!state.kinds.has(record.kind)) return false;
    if (record.type && allTypes.includes(record.type) && !state.types.has(record.type)) return false;
    if (state.tags.size > 0 && ![...state.tags].every(t => record.tags.includes(t))) return false;
    if (state.query && !record.searchText.includes(state.query)) return false;
    return true;
  }

  function severityDots(sev) {
    if (!sev) return '';
    const order = ['critical', 'high', 'medium', 'low'];
    const dots = order.filter(k => sev[k] > 0).map(k => `<span title="${sev[k]} ${k}" style="background:${SEV_COLORS[k]}"></span>`);
    return dots.length ? `<div class="sev-dots">${dots.join('')}</div>` : '';
  }

  function renderResults() {
    const filtered = records.filter(matches).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const list = document.getElementById('results-list');
    const emptyState = document.getElementById('empty-state');
    document.getElementById('result-count').textContent = `${filtered.length} of ${records.length}`;

    if (filtered.length === 0) {
      list.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    list.innerHTML = filtered.map(r => {
      const isOpen = state.openId === r.id;
      return `
        <li>
          <div class="result-row" data-id="${r.id}">
            <div class="result-meta">
              <span class="kind-dot" style="background:${KIND_COLORS[r.kind]}"></span>${r.date || ''}
              ${severityDots(r.severity)}
            </div>
            <div>
              <p class="result-title">${r.title}</p>
              <div class="result-tags">
                ${r.type ? `<span class="type-label">${TYPE_LABELS[r.type] || r.type}</span>` : ''}
                ${r.tags.join(', ')}
              </div>
            </div>
            <div class="result-detail ${isOpen ? 'open' : ''}" id="detail-${cssEscape(r.id)}">
              <div class="result-detail-inner">
                ${isOpen ? r.html : ''}
                ${isOpen ? `<a class="source-link" href="${r.path}">Open source file: ${r.path}</a>` : ''}
              </div>
            </div>
          </div>
        </li>`;
    }).join('');

    list.querySelectorAll('.result-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('a')) return; // let source-file links navigate normally
        const id = row.getAttribute('data-id');
        state.openId = state.openId === id ? null : id;
        render();
        if (state.openId) {
          const el = document.getElementById(`detail-${cssEscape(state.openId)}`);
          if (el && typeof el.scrollIntoView === 'function') {
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }
      });
    });
  }

  function cssEscape(s) { return s.replace(/[^a-zA-Z0-9_-]/g, '_'); }

  function render() {
    renderKindFilters();
    renderTypeFilters();
    renderTagFilters();
    renderResults();
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('reset-filters').addEventListener('click', () => {
    state.query = '';
    state.kinds = new Set(allKinds);
    state.types = new Set(allTypes);
    state.tags = new Set();
    state.openId = null;
    document.getElementById('search-input').value = '';
    render();
  });

  render();
})();
</script>
