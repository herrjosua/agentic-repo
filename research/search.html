adjacent surfaces beyond ambient scribe. re-test the abandon-and-redictate behavior once the explicit paused state ships, to confirm it actually changes clinician behavior and not just their stated understanding. related synthesized into: ambient-scribe-post-ga-refinements.md participants participants — contextual inquiry — session lock during active ambient scribe dictation count: 5 roles: physician nurse practitioner it security researcher: priya patel recruitment note: 4 clinicians recruited from regular ambient-scribe users on units with known short idle-timeout windows; 1 it security stakeholder recruited directly for technical context rather than shadowed. no real patient or staff identities are recorded here; session-notes.md uses session-scoped fictional/anonymized participant ids (e.g. p31) instead of names."}, {"id": "finding:accessibility-cross-cutting", "kind": "finding", "title": "Accessibility (Cross-Cutting)", "date": "2025-11-18", "type": "synthesis", "status": "synthesized", "tags": ["accessibility", "components", "design-system", "extjs", "legacy", "low-vision", "mobile", "motor-impairment", "section-508", "wcag"], "related_components": ["admin-console-grid", "alert-triage-queue", "design-system-form-field", "design-system-modal", "mobile-app-alert-list"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/accessibility-cross-cutting.md", "html": "<h1>Accessibility (Cross-Cutting)</h1>\n<h2>Overview</h2>\n<p>Three independent WCAG 2.1 AA audits across the year — the legacy ExtJS admin console (Mar 2025), the new design system component library (Jul 2025), and the mobile clinician app (Nov 2025) — turned up one recurring pattern worth calling out on its own, separate from each audit&#x27;s other findings.</p>\n<ul><li><strong>The same color-only status indicator (red/yellow/green dots, no text/pattern alternative) appears in all three surfaces audited this year.</strong> This was flagged as a likely single shared root component rather than three separate bugs, and the CIO cited it at the December executive retro as the example of what a &quot;cross-cutting findings&quot; reporting category should look like going forward (see [governance-and-phi.md](governance-and-phi.md)).</li><li><strong>Progress is visible surface-by-surface even though the pattern repeats</strong>: the modal keyboard-trap issue found in the legacy console (Mar) was already fixed by the time the new design system&#x27;s modal component was audited (Jul), though that same audit surfaced a <em>new</em> issue (form-field error association) not present in the legacy system.</li><li><strong>The mobile app audit (Nov) connects directly to a live Compass AI feature</strong>: undersized touch targets (32×32px vs. the 44×44px minimum) were found specifically on the alert-triage icon set, which is the same feature usability-tested in August — see [care-coordination-triage.md](care-coordination-triage.md). This is a case where an accessibility defect and a usability finding land on the exact same component from two different research methods.</li></ul>\n<p>Recommendation: treat the color-only status pattern as a single design-system-level fix rather than three surface-level tickets, and confirm whether a shared component is in fact the common root cause.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-03-10</strong> — <a href=\"../raw/2025-03-10-accessibility-audit-legacy-extjs-admin-console/session-notes.md\">Accessibility Audit — Legacy Admin Console (ExtJS)</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2025-07-01</strong> — <a href=\"../raw/2025-07-01-accessibility-audit-new-design-system-components/session-notes.md\">Accessibility Audit — New Design System Component Library</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2025-11-18</strong> — <a href=\"../raw/2025-11-18-accessibility-audit-mobile-clinician-app/session-notes.md\">Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</a> <em>(<code>accessibility-audit</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>(none currently linked)</li></ul>", "searchText": "accessibility (cross-cutting) accessibility components design-system extjs legacy low-vision mobile motor-impairment section-508 wcag admin-console-grid alert-triage-queue design-system-form-field design-system-modal mobile-app-alert-list accessibility (cross-cutting) overview three independent wcag 2.1 aa audits across the year — the legacy extjs admin console (mar 2025), the new design system component library (jul 2025), and the mobile clinician app (nov 2025) — turned up one recurring pattern worth calling out on its own, separate from each audit&#x27;s other findings. the same color-only status indicator (red/yellow/green dots, no text/pattern alternative) appears in all three surfaces audited this year. this was flagged as a likely single shared root component rather than three separate bugs, and the cio cited it at the december executive retro as the example of what a &quot;cross-cutting findings&quot; reporting category should look like going forward (see [governance-and-phi.md](governance-and-phi.md)). progress is visible surface-by-surface even though the pattern repeats : the modal keyboard-trap issue found in the legacy console (mar) was already fixed by the time the new design system&#x27;s modal component was audited (jul), though that same audit surfaced a new issue (form-field error association) not present in the legacy system. the mobile app audit (nov) connects directly to a live compass ai feature : undersized touch targets (32×32px vs. the 44×44px minimum) were found specifically on the alert-triage icon set, which is the same feature usability-tested in august — see [care-coordination-triage.md](care-coordination-triage.md). this is a case where an accessibility defect and a usability finding land on the exact same component from two different research methods. recommendation: treat the color-only status pattern as a single design-system-level fix rather than three surface-level tickets, and confirm whether a shared component is in fact the common root cause. evidence trail 2025-03-10 — accessibility audit — legacy admin console (extjs) ( accessibility-audit ) 2025-07-01 — accessibility audit — new design system component library ( accessibility-audit ) 2025-11-18 — accessibility audit — mobile clinician app (low vision &amp; motor impairment focus) ( accessibility-audit ) related findings (none currently linked)"}, {"id": "finding:ambient-scribe-post-ga-refinements", "kind": "finding", "title": "Ambient Scribe — Post-GA Refinements", "date": "2026-02-17", "type": "synthesis", "status": "synthesized", "tags": ["ambient-scribe", "medication-safety", "sso", "mfa", "phi", "longitudinal"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": "Jordan Lee", "path": "findings/ambient-scribe-post-ga-refinements.md", "html": "<h1>Ambient Scribe — Post-GA Refinements</h1>\n<h2>Overview</h2>\n<p>Two follow-up threads opened by [ambient-scribe.md](ambient-scribe.md)&#x27;s GA-candidate round and by an open edge case noted directly in the <code>encounter-view</code> component — neither a launch blocker, both worth closing before they harden into permanent gaps.</p>\n<ul><li><strong>A distinct sound-alike-medication flag outperforms generic confidence highlighting for this specific error class.</strong> The GA-candidate round treated sound-alike medication errors as an ongoing monitoring item, relying on the general <code>confidence-highlighted</code> variant to surface them. A concept test of a dedicated, visually distinct flag found 5 of 6 participants correctly recognized it as categorically different from generic low confidence — but also surfaced a new risk: 2 of 6 participants said the flag&#x27;s specificity made them trust <em>unflagged</em> medication lines more than they should. Any rollout needs to actively counter that over-trust framing, not just ship the flag.</li><li><strong>Session lock during active dictation currently reads as silent data loss, even though it isn&#x27;t.</strong> The <code>locked</code> state&#x27;s interaction with an in-progress recording was flagged as unresolved in <code>encounter-view</code>&#x27;s own notes, sourced from a May 2025 SSO/MFA interview side comment. Direct observation confirms the practical impact: 4 of 5 clinicians assumed a locked session had destroyed their draft and restarted dictation from scratch, even though the draft is preserved server-side. IT Security confirmed the idle-timeout policy itself is fixed, but an explicit &quot;paused, draft preserved&quot; state is a UI-only fix, not a policy change.</li><li>Both threads point the same direction: <strong>the underlying safety/reliability behavior is already correct (drafts are preserved; sound-alike names are technically detectable) — what&#x27;s missing is UI that tells the clinician that, specifically and distinctly, rather than relying on a generic low-confidence signal to carry two very different kinds of meaning.</strong></li></ul>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2026-02-10</strong> — <a href=\"../raw/2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md\">Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-02-17</strong> — <a href=\"../raw/2026-02-17-session-lock-during-dictation/session-notes.md\">Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation</a> <em>(<code>contextual-inquiry</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li></ul>", "searchText": "ambient scribe — post-ga refinements ambient-scribe medication-safety sso mfa phi longitudinal ambient-scribe-widget encounter-view ambient scribe — post-ga refinements overview two follow-up threads opened by [ambient-scribe.md](ambient-scribe.md)&#x27;s ga-candidate round and by an open edge case noted directly in the encounter-view component — neither a launch blocker, both worth closing before they harden into permanent gaps. a distinct sound-alike-medication flag outperforms generic confidence highlighting for this specific error class. the ga-candidate round treated sound-alike medication errors as an ongoing monitoring item, relying on the general confidence-highlighted variant to surface them. a concept test of a dedicated, visually distinct flag found 5 of 6 participants correctly recognized it as categorically different from generic low confidence — but also surfaced a new risk: 2 of 6 participants said the flag&#x27;s specificity made them trust unflagged medication lines more than they should. any rollout needs to actively counter that over-trust framing, not just ship the flag. session lock during active dictation currently reads as silent data loss, even though it isn&#x27;t. the locked state&#x27;s interaction with an in-progress recording was flagged as unresolved in encounter-view &#x27;s own notes, sourced from a may 2025 sso/mfa interview side comment. direct observation confirms the practical impact: 4 of 5 clinicians assumed a locked session had destroyed their draft and restarted dictation from scratch, even though the draft is preserved server-side. it security confirmed the idle-timeout policy itself is fixed, but an explicit &quot;paused, draft preserved&quot; state is a ui-only fix, not a policy change. both threads point the same direction: the underlying safety/reliability behavior is already correct (drafts are preserved; sound-alike names are technically detectable) — what&#x27;s missing is ui that tells the clinician that, specifically and distinctly, rather than relying on a generic low-confidence signal to carry two very different kinds of meaning. evidence trail 2026-02-10 — usability test — ambient scribe sound-alike medication flag concept ( usability-test ) 2026-02-17 — contextual inquiry — session lock during active ambient scribe dictation ( contextual-inquiry ) related findings [ambient ai scribe](ambient-scribe.md) [ai governance, phi &amp; compliance](governance-and-phi.md)"}, {"id": "finding:ambient-scribe", "kind": "finding", "title": "Ambient AI Scribe", "date": "2026-01-13", "type": "synthesis", "status": "synthesized", "tags": ["ambient-scribe", "documentation", "ga-release", "longitudinal", "usability", "v0.1", "v0.2"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/ambient-scribe.md", "html": "<h1>Ambient AI Scribe</h1>\n<h2>Overview</h2>\n<p>The ambient AI scribe has moved from a formative concept (v0.1, Feb 2025) through iteration (v0.2, Sep 2025) to a GA release candidate (Jan 2026), with 3 of the original 5 physician participants retained across all three rounds for longitudinal comparison.</p>\n<ul><li><strong>PHI handling:</strong> The critical draft-retention/audit gap found in v0.1 was fixed by v0.2 and has remained stable through the GA candidate — drafts auto-expire after 10 minutes of inactivity and the behavior is documented for Compliance. No PHI-handling issues have recurred since.</li><li><strong>Accuracy:</strong> Medication dosage errors dropped from 3/5 sessions (v0.1) to 1/5 (v0.2), driven by fixing outright garbling; the remaining error class is specifically sound-alike medication names, which is now a tracked, monitored issue rather than a blocker.</li><li><strong>Trust calibration was the hardest problem, and accuracy alone didn&#x27;t solve it.</strong> Returning participants read every line in both v0.1 and v0.2 despite the accuracy improvement between them — trust didn&#x27;t move with correctness. The GA-candidate round introduced per-line confidence highlighting, and for the first time participants reported actually skimming high-confidence lines. This is the strongest evidence so far that <em>visible uncertainty</em>, not raw accuracy, is the lever that changes reviewing behavior.</li><li><strong>Recommendation status:</strong> Approved for GA release. Sound-alike medication errors move to post-GA monitoring rather than blocking launch.</li></ul>\n<p>Open thread: this tool&#x27;s rollout scope has been deliberately kept away from behavioral health / substance-use encounters — see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md).</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-02-25</strong> — <a href=\"../raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md\">Usability Test — Ambient AI Scribe Prototype v0.1</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-09-23</strong> — <a href=\"../raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md\">Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-01-13</strong> — <a href=\"../raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li><li>[Clinician Experience &amp; Documentation Burden](clinician-experience-documentation-burden.md)</li><li>[Ambient Scribe — Post-GA Refinements](ambient-scribe-post-ga-refinements.md)</li></ul>", "searchText": "ambient ai scribe ambient-scribe documentation ga-release longitudinal usability v0.1 v0.2 ambient-scribe-widget encounter-view ambient ai scribe overview the ambient ai scribe has moved from a formative concept (v0.1, feb 2025) through iteration (v0.2, sep 2025) to a ga release candidate (jan 2026), with 3 of the original 5 physician participants retained across all three rounds for longitudinal comparison. phi handling: the critical draft-retention/audit gap found in v0.1 was fixed by v0.2 and has remained stable through the ga candidate — drafts auto-expire after 10 minutes of inactivity and the behavior is documented for compliance. no phi-handling issues have recurred since. accuracy: medication dosage errors dropped from 3/5 sessions (v0.1) to 1/5 (v0.2), driven by fixing outright garbling; the remaining error class is specifically sound-alike medication names, which is now a tracked, monitored issue rather than a blocker. trust calibration was the hardest problem, and accuracy alone didn&#x27;t solve it. returning participants read every line in both v0.1 and v0.2 despite the accuracy improvement between them — trust didn&#x27;t move with correctness. the ga-candidate round introduced per-line confidence highlighting, and for the first time participants reported actually skimming high-confidence lines. this is the strongest evidence so far that visible uncertainty , not raw accuracy, is the lever that changes reviewing behavior. recommendation status: approved for ga release. sound-alike medication errors move to post-ga monitoring rather than blocking launch. open thread: this tool&#x27;s rollout scope has been deliberately kept away from behavioral health / substance-use encounters — see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md). evidence trail 2025-02-25 — usability test — ambient ai scribe prototype v0.1 ( usability-test ) 2025-09-23 — usability test — ambient ai scribe prototype v0.2 (follow-up) ( usability-test ) 2026-01-13 — usability test — ambient ai scribe ga release candidate (final validation) ( usability-test ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md) [clinician experience &amp; documentation burden](clinician-experience-documentation-burden.md) [ambient scribe — post-ga refinements](ambient-scribe-post-ga-refinements.md)"}, {"id": "finding:care-coordination-triage", "kind": "finding", "title": "Care Coordination & Alert Triage", "date": "2025-08-26", "type": "synthesis", "status": "synthesized", "tags": ["alert-fatigue", "alert-triage", "baseline", "care-coordination", "chart-review", "usability", "workflow"], "related_components": ["alert-triage-queue", "chart-review-summary-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/care-coordination-triage.md", "html": "<h1>Care Coordination &amp; Alert Triage</h1>\n<h2>Overview</h2>\n<p>Two sessions bookend this topic: a baseline contextual inquiry of manual chart review (Jan 2025, before any AI concept existed) and a usability test of an AI-ranked alert triage queue (Aug 2025).</p>\n<ul><li><strong>The baseline shaped what got built.</strong> Coordinators explicitly said they didn&#x27;t want full AI summarization (they already distrust the EHR&#x27;s existing auto-summary tool after it missed medication changes twice) — what they wanted was &quot;what changed since I last looked.&quot; The August alert-triage concept is a variant of that same idea applied to alert prioritization rather than chart summarization.</li><li><strong>The triage ranking works, but not for the reason initially expected.</strong> It was faster (6.5 min vs. 9 min to clear a 20-item queue), but 4 of 5 participants disagreed with at least one ranking decision, generally because the model weighted recency over coordinators&#x27; own sense of patient-history-driven risk — echoing the alert-fatigue concern raised separately in the May clinician dashboard testing (see [clinician-experience-documentation-burden.md](clinician-experience-documentation-burden.md)). There was also no way to capture <em>why</em> a coordinator overrode a ranking, which both loses a model-improvement signal and undercuts the sense of agency the supervisor specifically flagged as a risk (fast-but-wrong being worse than slow-but-right in this workflow).</li><li><strong>This is also where the mobile accessibility touch-target finding lands</strong> — the alert-triage icon set audited in November is the same feature tested here in August (see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)).</li></ul>\n<p>Recommendation: add lightweight override-reason capture before further ranking-model tuning, and share it with whoever owns the care-gap flagging model tuning, since it&#x27;s likely the same underlying problem.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-01-29</strong> — <a href=\"../raw/2025-01-29-contextual-inquiry-chart-review-baseline/session-notes.md\">Contextual Inquiry — Manual Chart Review Baseline (Care Coordinators)</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-08-26</strong> — <a href=\"../raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md\">Usability Test — AI Alert Triage for Care Coordination</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Clinician Experience &amp; Documentation Burden](clinician-experience-documentation-burden.md)</li></ul>", "searchText": "care coordination & alert triage alert-fatigue alert-triage baseline care-coordination chart-review usability workflow alert-triage-queue chart-review-summary-panel care coordination &amp; alert triage overview two sessions bookend this topic: a baseline contextual inquiry of manual chart review (jan 2025, before any ai concept existed) and a usability test of an ai-ranked alert triage queue (aug 2025). the baseline shaped what got built. coordinators explicitly said they didn&#x27;t want full ai summarization (they already distrust the ehr&#x27;s existing auto-summary tool after it missed medication changes twice) — what they wanted was &quot;what changed since i last looked.&quot; the august alert-triage concept is a variant of that same idea applied to alert prioritization rather than chart summarization. the triage ranking works, but not for the reason initially expected. it was faster (6.5 min vs. 9 min to clear a 20-item queue), but 4 of 5 participants disagreed with at least one ranking decision, generally because the model weighted recency over coordinators&#x27; own sense of patient-history-driven risk — echoing the alert-fatigue concern raised separately in the may clinician dashboard testing (see [clinician-experience-documentation-burden.md](clinician-experience-documentation-burden.md)). there was also no way to capture why a coordinator overrode a ranking, which both loses a model-improvement signal and undercuts the sense of agency the supervisor specifically flagged as a risk (fast-but-wrong being worse than slow-but-right in this workflow). this is also where the mobile accessibility touch-target finding lands — the alert-triage icon set audited in november is the same feature tested here in august (see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)). recommendation: add lightweight override-reason capture before further ranking-model tuning, and share it with whoever owns the care-gap flagging model tuning, since it&#x27;s likely the same underlying problem. evidence trail 2025-01-29 — contextual inquiry — manual chart review baseline (care coordinators) ( contextual-inquiry ) 2025-08-26 — usability test — ai alert triage for care coordination ( usability-test ) related findings [clinician experience &amp; documentation burden](clinician-experience-documentation-burden.md)"}, {"id": "finding:clinician-experience-documentation-burden", "kind": "finding", "title": "Clinician Experience & Documentation Burden", "date": "2025-09-09", "type": "synthesis", "status": "synthesized", "tags": ["baseline", "burnout", "clinician-experience", "dashboard", "documentation-burden", "information-architecture", "nursing", "survey", "trust-in-ai", "usability"], "related_components": ["ambient-scribe-widget", "care-gap-badge", "clinician-dashboard"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/clinician-experience-documentation-burden.md", "html": "<h1>Clinician Experience &amp; Documentation Burden</h1>\n<h2>Overview</h2>\n<p>Three sessions trace clinician sentiment and documentation burden across the year: a nursing attitudes survey (Feb 2025, before AI framing was introduced), a clinician dashboard usability test (May 2025), and an org-wide burnout/documentation-burden baseline survey (Sep 2025, which explicitly referenced the AI initiative).</p>\n<ul><li><strong>The top volunteered concern was not accuracy or privacy — it was voice.</strong> In February, &quot;losing my clinical narrative voice / it will sound robotic&quot; was the most common open-ended concern among nurses, ahead of accuracy or trust concerns that were originally hypothesized to dominate.</li><li><strong>Documentation burden is real and quantifiable, not just anecdotal.</strong> The September baseline found documentation burden is physicians&#x27; #1 self-selected burnout driver (52%, ahead of patient volume at 31%), with 64% doing regular after-hours &quot;pajama time&quot; charting (avg. 1.2 hrs/day). This is now the official pre-AI baseline for measuring Compass AI&#x27;s impact at 6 and 12 months post-GA. <strong>Caveat:</strong> the September survey mentioned the AI initiative explicitly in its framing, while the February survey didn&#x27;t — any comparison between the two datasets needs to account for that framing difference, not treat them as a clean before/after.</li><li><strong>Alert fatigue is an emerging risk, not yet realized.</strong> The May dashboard test found that 5 of 6 participants expected AI-flagged &quot;care gap&quot; badges to become background noise within a week if flagging precision isn&#x27;t improved — 2 of the 3 example flags shown were judged clinically low-value. This is the same alert-fatigue pattern later confirmed in the care-coordination alert triage testing (see [care-coordination-triage.md](care-coordination-triage.md)), suggesting it&#x27;s a property of how these flagging models are currently tuned generally, not a one-off UI problem.</li></ul>\n<p>Recommendation: do not ship the care-gap flagging feature until precision is validated against clinical review, and use the September survey as the fixed baseline instrument for future comparisons rather than re-wording the questions.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-02-11</strong> — <a href=\"../raw/2025-02-11-survey-nursing-attitudes-ai-documentation/session-notes.md\">Survey — Nursing Staff Attitudes Toward AI-Assisted Documentation</a> <em>(<code>survey</code>)</em></li><li><strong>2025-05-06</strong> — <a href=\"../raw/2025-05-06-usability-test-clinician-dashboard-redesign-v1/session-notes.md\">Usability Test — Clinician Dashboard Redesign (v1)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-09-09</strong> — <a href=\"../raw/2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md\">Survey — Clinician Burnout &amp; Documentation Burden Baseline</a> <em>(<code>survey</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[Care Coordination &amp; Alert Triage](care-coordination-triage.md)</li></ul>", "searchText": "clinician experience & documentation burden baseline burnout clinician-experience dashboard documentation-burden information-architecture nursing survey trust-in-ai usability ambient-scribe-widget care-gap-badge clinician-dashboard clinician experience &amp; documentation burden overview three sessions trace clinician sentiment and documentation burden across the year: a nursing attitudes survey (feb 2025, before ai framing was introduced), a clinician dashboard usability test (may 2025), and an org-wide burnout/documentation-burden baseline survey (sep 2025, which explicitly referenced the ai initiative). the top volunteered concern was not accuracy or privacy — it was voice. in february, &quot;losing my clinical narrative voice / it will sound robotic&quot; was the most common open-ended concern among nurses, ahead of accuracy or trust concerns that were originally hypothesized to dominate. documentation burden is real and quantifiable, not just anecdotal. the september baseline found documentation burden is physicians&#x27; #1 self-selected burnout driver (52%, ahead of patient volume at 31%), with 64% doing regular after-hours &quot;pajama time&quot; charting (avg. 1.2 hrs/day). this is now the official pre-ai baseline for measuring compass ai&#x27;s impact at 6 and 12 months post-ga. caveat: the september survey mentioned the ai initiative explicitly in its framing, while the february survey didn&#x27;t — any comparison between the two datasets needs to account for that framing difference, not treat them as a clean before/after. alert fatigue is an emerging risk, not yet realized. the may dashboard test found that 5 of 6 participants expected ai-flagged &quot;care gap&quot; badges to become background noise within a week if flagging precision isn&#x27;t improved — 2 of the 3 example flags shown were judged clinically low-value. this is the same alert-fatigue pattern later confirmed in the care-coordination alert triage testing (see [care-coordination-triage.md](care-coordination-triage.md)), suggesting it&#x27;s a property of how these flagging models are currently tuned generally, not a one-off ui problem. recommendation: do not ship the care-gap flagging feature until precision is validated against clinical review, and use the september survey as the fixed baseline instrument for future comparisons rather than re-wording the questions. evidence trail 2025-02-11 — survey — nursing staff attitudes toward ai-assisted documentation ( survey ) 2025-05-06 — usability test — clinician dashboard redesign (v1) ( usability-test ) 2025-09-09 — survey — clinician burnout &amp; documentation burden baseline ( survey ) related findings [ambient ai scribe](ambient-scribe.md) [care coordination &amp; alert triage](care-coordination-triage.md)"}, {"id": "finding:governance-and-phi", "kind": "finding", "title": "AI Governance, PHI & Compliance", "date": "2025-12-16", "type": "synthesis", "status": "synthesized", "tags": ["ai-generated-content", "ai-strategy", "audit-trail", "cmio", "de-identification", "executive", "governance", "hipaa", "kickoff", "legal-record", "phi", "privacy", "retro", "roadmap", "year-end"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/governance-and-phi.md", "html": "<h1>AI Governance, PHI &amp; Compliance</h1>\n<h2>Overview</h2>\n<p>This is the connective tissue for the whole program: four executive-level sessions across the year, from initial kickoff (Jan 2025) to year-end retro (Dec 2025), plus a Privacy Officer interview (Mar 2025) and a CMIO interview (Aug 2025) in between.</p>\n<ul><li><strong>The shared-metrics gap identified in January was real and took all year to close.</strong> At kickoff, the CIO and VP Clinical Informatics couldn&#x27;t agree on what &quot;success&quot; meant. By December&#x27;s retro, the same two executives (plus Privacy and CMIO) had converged on two headline 2026 metrics: documentation time saved, and PHI incidents (target: zero). This is the single clearest before/after in the whole research program and should anchor how the 2026 roadmap is framed.</li><li><strong>De-identification and audit-trail requirements (Privacy Officer, Mar) turned out to be non-negotiable engineering constraints, not policy nice-to-haves</strong>: Safe Harbor-level de-identification for any fine-tuning/eval data, and model-version + input provenance logging for anything that becomes part of the legal record. These constraints were later validated as workable by the CMIO&#x27;s August interview, which proposed a concrete attestation model (once a clinician signs AI-assisted content, it carries the same liability as if they&#x27;d typed it, with generation metadata kept in an internal audit log only) — but that model still needs formal Legal/Compliance ratification, it is not yet policy.</li><li><strong>PHI-sensitivity-ordered rollout sequencing</strong> (lowest-sensitivity workflows first: scheduling → admin/coding → documentation → clinical-decision-adjacent) was proposed independently by executives in January and reaffirmed by the CMIO in August — it&#x27;s held up as a stable planning principle across two separate conversations eight months apart.</li><li><strong>A recurring cross-cutting finding was explicitly named as a category, not just fixed three times</strong>: the CIO used the color-only status indicator accessibility bug (found independently in three separate audits — see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)) as the example of a pattern research should flag as such, not file as three unrelated tickets.</li></ul>\n<p>Two items still need to move from &quot;informally agreed in a meeting&quot; to an actual governance document: the 2026 headline metrics, and the AI-content attestation model.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-01-14</strong> — <a href=\"../raw/2025-01-14-stakeholder-interview-ai-strategy-kickoff/session-notes.md\">AI Strategy Kickoff — Executive Alignment Interview</a> <em>(<code>interview</code>)</em></li><li><strong>2025-03-24</strong> — <a href=\"../raw/2025-03-24-interview-privacy-officer-deidentification-requirements/session-notes.md\">Interview — Privacy/Compliance Officer on De-Identification &amp; Audit Trail Requirements</a> <em>(<code>interview</code>)</em></li><li><strong>2025-08-12</strong> — <a href=\"../raw/2025-08-12-interview-cmio-ai-generated-content-governance/session-notes.md\">Interview — CMIO on Governance for AI-Generated Content in the Legal Record</a> <em>(<code>interview</code>)</em></li><li><strong>2025-12-16</strong> — <a href=\"../raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md\">Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[Scope Boundaries &amp; Workflow Fit](scope-boundaries-and-workflow-fit.md)</li><li>[Ambient Scribe — Post-GA Refinements](ambient-scribe-post-ga-refinements.md)</li></ul>", "searchText": "ai governance, phi & compliance ai-generated-content ai-strategy audit-trail cmio de-identification executive governance hipaa kickoff legal-record phi privacy retro roadmap year-end ai governance, phi &amp; compliance overview this is the connective tissue for the whole program: four executive-level sessions across the year, from initial kickoff (jan 2025) to year-end retro (dec 2025), plus a privacy officer interview (mar 2025) and a cmio interview (aug 2025) in between. the shared-metrics gap identified in january was real and took all year to close. at kickoff, the cio and vp clinical informatics couldn&#x27;t agree on what &quot;success&quot; meant. by december&#x27;s retro, the same two executives (plus privacy and cmio) had converged on two headline 2026 metrics: documentation time saved, and phi incidents (target: zero). this is the single clearest before/after in the whole research program and should anchor how the 2026 roadmap is framed. de-identification and audit-trail requirements (privacy officer, mar) turned out to be non-negotiable engineering constraints, not policy nice-to-haves : safe harbor-level de-identification for any fine-tuning/eval data, and model-version + input provenance logging for anything that becomes part of the legal record. these constraints were later validated as workable by the cmio&#x27;s august interview, which proposed a concrete attestation model (once a clinician signs ai-assisted content, it carries the same liability as if they&#x27;d typed it, with generation metadata kept in an internal audit log only) — but that model still needs formal legal/compliance ratification, it is not yet policy. phi-sensitivity-ordered rollout sequencing (lowest-sensitivity workflows first: scheduling → admin/coding → documentation → clinical-decision-adjacent) was proposed independently by executives in january and reaffirmed by the cmio in august — it&#x27;s held up as a stable planning principle across two separate conversations eight months apart. a recurring cross-cutting finding was explicitly named as a category, not just fixed three times : the cio used the color-only status indicator accessibility bug (found independently in three separate audits — see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)) as the example of a pattern research should flag as such, not file as three unrelated tickets. two items still need to move from &quot;informally agreed in a meeting&quot; to an actual governance document: the 2026 headline metrics, and the ai-content attestation model. evidence trail 2025-01-14 — ai strategy kickoff — executive alignment interview ( interview ) 2025-03-24 — interview — privacy/compliance officer on de-identification &amp; audit trail requirements ( interview ) 2025-08-12 — interview — cmio on governance for ai-generated content in the legal record ( interview ) 2025-12-16 — executive steering committee — year-end retro &amp; 2026 roadmap input ( interview ) related findings [ambient ai scribe](ambient-scribe.md) [scope boundaries &amp; workflow fit](scope-boundaries-and-workflow-fit.md) [ambient scribe — post-ga refinements](ambient-scribe-post-ga-refinements.md)"}, {"id": "finding:him-coding-and-billing", "kind": "finding", "title": "HIM: Coding, Billing & Release of Information", "date": "2025-07-29", "type": "synthesis", "status": "synthesized", "tags": ["billing", "coding", "compliance", "him", "phi", "release-of-information", "usability", "workflow"], "related_components": ["coding-suggestion-panel", "roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/him-coding-and-billing.md", "html": "<h1>HIM: Coding, Billing &amp; Release of Information</h1>\n<h2>Overview</h2>\n<p>Two contextual/usability sessions in HIM (July 2025) surfaced a shared theme — extremely low risk tolerance for anything that could look like automated judgment on a compliance-sensitive task — from two different angles: release-of-information redaction, and AI-assisted medical coding.</p>\n<ul><li><strong>Release of information (contextual inquiry) is the higher-stakes of the two.</strong> Staff described ROI as the one area where a mistake has caused real incidents (wrong record released, or behavioral-health notes not correctly given the stricter 42 CFR Part 2 handling). Any AI assistance here would need to be &quot;suggest and highlight for human review only,&quot; never auto-redact-and-release. This session also surfaced a standalone platform gap — there&#x27;s no structured way to flag a note as Part 2-protected in the EHR — that recurred again independently in the October behavioral health research (see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md)), making it a two-source-confirmed gap worth fixing regardless of any AI plans.</li><li><strong>AI-assisted coding suggestions (usability test) surfaced the same underlying concern in a different shape</strong>: the senior coder&#x27;s objection wasn&#x27;t accuracy (14/20 suggestions matched independent human judgment) but audit posture — she wanted it explicit in the UI and audit log that the human coder made the final call, to avoid the suggestion looking like it steered toward upcoding. This is the same &quot;show your work&quot; / attribution-of-decision pattern seen in prior authorization testing (see [prior-authorization.md](prior-authorization.md)).</li></ul>\n<p>Recommendation: any AI feature touching this department needs an explicit, audit-log-visible human-decision boundary as a baseline requirement, not a design nicety — this shows up whether the task is redaction, coding, or (per the prior-auth findings) authorization drafting.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-07-15</strong> — <a href=\"../raw/2025-07-15-contextual-inquiry-him-release-of-information/session-notes.md\">Contextual Inquiry — Health Information Management (Release of Information)</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-07-29</strong> — <a href=\"../raw/2025-07-29-usability-test-ai-coding-billing-suggestions/session-notes.md\">Usability Test — AI-Assisted Medical Coding Suggestions</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li></ul>", "searchText": "him: coding, billing & release of information billing coding compliance him phi release-of-information usability workflow coding-suggestion-panel roi-redaction-tool him: coding, billing &amp; release of information overview two contextual/usability sessions in him (july 2025) surfaced a shared theme — extremely low risk tolerance for anything that could look like automated judgment on a compliance-sensitive task — from two different angles: release-of-information redaction, and ai-assisted medical coding. release of information (contextual inquiry) is the higher-stakes of the two. staff described roi as the one area where a mistake has caused real incidents (wrong record released, or behavioral-health notes not correctly given the stricter 42 cfr part 2 handling). any ai assistance here would need to be &quot;suggest and highlight for human review only,&quot; never auto-redact-and-release. this session also surfaced a standalone platform gap — there&#x27;s no structured way to flag a note as part 2-protected in the ehr — that recurred again independently in the october behavioral health research (see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md)), making it a two-source-confirmed gap worth fixing regardless of any ai plans. ai-assisted coding suggestions (usability test) surfaced the same underlying concern in a different shape : the senior coder&#x27;s objection wasn&#x27;t accuracy (14/20 suggestions matched independent human judgment) but audit posture — she wanted it explicit in the ui and audit log that the human coder made the final call, to avoid the suggestion looking like it steered toward upcoding. this is the same &quot;show your work&quot; / attribution-of-decision pattern seen in prior authorization testing (see [prior-authorization.md](prior-authorization.md)). recommendation: any ai feature touching this department needs an explicit, audit-log-visible human-decision boundary as a baseline requirement, not a design nicety — this shows up whether the task is redaction, coding, or (per the prior-auth findings) authorization drafting. evidence trail 2025-07-15 — contextual inquiry — health information management (release of information) ( contextual-inquiry ) 2025-07-29 — usability test — ai-assisted medical coding suggestions ( usability-test ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md)"}, {"id": "finding:onboarding", "kind": "finding", "title": "Onboarding flow — setup step confusion", "date": "2026-02-03", "type": "synthesis", "status": "synthesized", "tags": ["onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/onboarding.md", "html": "<h2>Summary</h2>\n<p>New admins hesitate at, or attempt to skip, step 3 of the onboarding wizard (&quot;Connect calendar&quot;) because its wording implies the step is optional, when it&#x27;s actually required for later functionality. This is the largest single source of friction in first-time setup.</p>\n<h2>Evidence</h2>\n<p>Sourced from <code>raw/2026-01-19-onboarding-usability-test/</code> — 6 participants, moderated usability sessions, Jan 19–23 2026. All 3 participants observed in sessions 1–3 paused at step 3; 2 of 3 attempted to skip it outright.</p>\n<p>Corroborated by funnel data — see <code>analytics/summaries/onboarding-funnel-dropoff.md</code>, which independently shows step 3 as the largest drop-off point.</p>\n<h2>Recommendation</h2>\n<p>Relabel step 3 to state clearly that calendar connection is required, and give visible feedback that invites (entered later, in step 4) aren&#x27;t sent until the whole wizard is submitted.</p>\n<h2>Status</h2>\n<p>Synthesized Feb 3, 2026, from sessions 1–6. Revisit after the step 3 wording change (proposed in <code>research-readouts/onboarding-flow-q1-readout.md</code>) ships and gets retested.</p>", "searchText": "onboarding flow — setup step confusion onboarding summary new admins hesitate at, or attempt to skip, step 3 of the onboarding wizard (&quot;connect calendar&quot;) because its wording implies the step is optional, when it&#x27;s actually required for later functionality. this is the largest single source of friction in first-time setup. evidence sourced from raw/2026-01-19-onboarding-usability-test/ — 6 participants, moderated usability sessions, jan 19–23 2026. all 3 participants observed in sessions 1–3 paused at step 3; 2 of 3 attempted to skip it outright. corroborated by funnel data — see analytics/summaries/onboarding-funnel-dropoff.md , which independently shows step 3 as the largest drop-off point. recommendation relabel step 3 to state clearly that calendar connection is required, and give visible feedback that invites (entered later, in step 4) aren&#x27;t sent until the whole wizard is submitted. status synthesized feb 3, 2026, from sessions 1–6. revisit after the step 3 wording change (proposed in research-readouts/onboarding-flow-q1-readout.md ) ships and gets retested."}, {"id": "finding:patient-scheduling-chatbot", "kind": "finding", "title": "Patient Scheduling Chatbot", "date": "2025-06-17", "type": "synthesis", "status": "synthesized", "tags": ["chatbot", "patient-experience", "scheduling", "survey", "trust", "usability"], "related_components": ["patient-chatbot-widget", "scheduling-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/patient-scheduling-chatbot.md", "html": "<h1>Patient Scheduling Chatbot</h1>\n<h2>Overview</h2>\n<p>A patient-facing scheduling chatbot was scoped narrowly based on a trust survey (Jun 2025) and then usability tested against that scope (Jun 2025, two weeks later).</p>\n<ul><li><strong>The survey drew a sharp, useful line.</strong> 67% of patients were comfortable with an AI chatbot for scheduling/rescheduling, but comfort dropped to 22% when extended to symptom-related questions. This directly shaped the decision to scope the chatbot to logistics only and explicitly exclude symptom Q&amp;A from v1 — a scope decision the usability test then validated by not needing to test symptom-handling at all.</li><li><strong>The &quot;talk to a human&quot; escape hatch, identified as a trust prerequisite in the survey (41% of open-ended responses asked for it), failed discoverability testing.</strong> 3 of 8 usability test participants couldn&#x27;t find it — it existed only as a small text link. This is a case where a clearly-identified requirement from the survey wasn&#x27;t sufficiently weighted in the initial design.</li><li>Secondary findings: rescheduling had a lower task-success rate than new bookings (appointment-ID friction), and the bot&#x27;s &quot;overly cheerful&quot; tone was mismatched for patients scheduling around illness.</li></ul>\n<p>Recommendation: redesign the escape hatch as a persistent, prominent control (not a link) and re-test discoverability specifically before wider rollout. This chatbot would also be the non-clinical rollout most likely to run into the awareness gap noted in [rollout-and-change-management.md](rollout-and-change-management.md).</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-06-03</strong> — <a href=\"../raw/2025-06-03-survey-patient-portal-ai-chatbot-trust/session-notes.md\">Survey — Patient Trust in AI Chatbot for Scheduling</a> <em>(<code>survey</code>)</em></li><li><strong>2025-06-17</strong> — <a href=\"../raw/2025-06-17-usability-test-patient-chatbot-prototype/session-notes.md\">Usability Test — Patient Scheduling Chatbot Prototype</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Rollout &amp; Change Management](rollout-and-change-management.md)</li></ul>", "searchText": "patient scheduling chatbot chatbot patient-experience scheduling survey trust usability patient-chatbot-widget scheduling-widget patient scheduling chatbot overview a patient-facing scheduling chatbot was scoped narrowly based on a trust survey (jun 2025) and then usability tested against that scope (jun 2025, two weeks later). the survey drew a sharp, useful line. 67% of patients were comfortable with an ai chatbot for scheduling/rescheduling, but comfort dropped to 22% when extended to symptom-related questions. this directly shaped the decision to scope the chatbot to logistics only and explicitly exclude symptom q&amp;a from v1 — a scope decision the usability test then validated by not needing to test symptom-handling at all. the &quot;talk to a human&quot; escape hatch, identified as a trust prerequisite in the survey (41% of open-ended responses asked for it), failed discoverability testing. 3 of 8 usability test participants couldn&#x27;t find it — it existed only as a small text link. this is a case where a clearly-identified requirement from the survey wasn&#x27;t sufficiently weighted in the initial design. secondary findings: rescheduling had a lower task-success rate than new bookings (appointment-id friction), and the bot&#x27;s &quot;overly cheerful&quot; tone was mismatched for patients scheduling around illness. recommendation: redesign the escape hatch as a persistent, prominent control (not a link) and re-test discoverability specifically before wider rollout. this chatbot would also be the non-clinical rollout most likely to run into the awareness gap noted in [rollout-and-change-management.md](rollout-and-change-management.md). evidence trail 2025-06-03 — survey — patient trust in ai chatbot for scheduling ( survey ) 2025-06-17 — usability test — patient scheduling chatbot prototype ( usability-test ) related findings [rollout &amp; change management](rollout-and-change-management.md)"}, {"id": "finding:prior-authorization", "kind": "finding", "title": "AI-Assisted Prior Authorization", "date": "2025-11-04", "type": "synthesis", "status": "synthesized", "tags": ["longitudinal", "prior-auth", "usability", "utilization-management", "v1", "v2"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/prior-authorization.md", "html": "<h1>AI-Assisted Prior Authorization</h1>\n<h2>Overview</h2>\n<p>AI-drafted prior authorization justifications were tested in two rounds (v1, Apr 2025; v2, Nov 2025) with the same utilization review nurse supervisor across both, which mattered for tracking whether fixes actually landed.</p>\n<ul><li><strong>v1</strong> surfaced a correctness bug (citing outdated diagnosis codes) serious enough that participants said it would likely cause payer denials — not a UX problem, a data-freshness/model fix. It also surfaced a durable requirement: nurses want inline citations to the specific chart text behind each suggestion (&quot;show your work&quot;), not just a black-box draft.</li><li><strong>v2</strong>, after both fixes landed, confirmed the outdated-code issue did not recur and that the citation feature is actively used (3 of 4 participants checked at least one citation before accepting) rather than being ignored as friction.</li><li><strong>Scope discipline held.</strong> The team deliberately limited v1 testing to &quot;straightforward&quot; cases (defined jointly with the nursing supervisor) and kept complex cases out of scope. v2 confirmed complex cases still aren&#x27;t ready — validating that the scope limitation, not a rushed fix, was the right call. This same &quot;citation transparency&quot; requirement has since shown up independently in the medical coding work — see [him-coding-and-billing.md](him-coding-and-billing.md).</li><li><strong>Time savings:</strong> ~5 min vs. ~15 min manual for straightforward cases, confirmed (not just estimated) in v2.</li></ul>\n<p>Status: recommended for pilot expansion, strictly within the agreed straightforward-case scope.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-04-08</strong> — <a href=\"../raw/2025-04-08-usability-test-prior-auth-ai-v1/session-notes.md\">Usability Test — AI-Assisted Prior Authorization Drafting (v1)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-11-04</strong> — <a href=\"../raw/2025-11-04-usability-test-prior-auth-ai-v2/session-notes.md\">Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)</a> <em>(<code>usability-test</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li></ul>", "searchText": "ai-assisted prior authorization longitudinal prior-auth usability utilization-management v1 v2 prior-auth-drafting-panel ai-assisted prior authorization overview ai-drafted prior authorization justifications were tested in two rounds (v1, apr 2025; v2, nov 2025) with the same utilization review nurse supervisor across both, which mattered for tracking whether fixes actually landed. v1 surfaced a correctness bug (citing outdated diagnosis codes) serious enough that participants said it would likely cause payer denials — not a ux problem, a data-freshness/model fix. it also surfaced a durable requirement: nurses want inline citations to the specific chart text behind each suggestion (&quot;show your work&quot;), not just a black-box draft. v2 , after both fixes landed, confirmed the outdated-code issue did not recur and that the citation feature is actively used (3 of 4 participants checked at least one citation before accepting) rather than being ignored as friction. scope discipline held. the team deliberately limited v1 testing to &quot;straightforward&quot; cases (defined jointly with the nursing supervisor) and kept complex cases out of scope. v2 confirmed complex cases still aren&#x27;t ready — validating that the scope limitation, not a rushed fix, was the right call. this same &quot;citation transparency&quot; requirement has since shown up independently in the medical coding work — see [him-coding-and-billing.md](him-coding-and-billing.md). time savings: ~5 min vs. ~15 min manual for straightforward cases, confirmed (not just estimated) in v2. status: recommended for pilot expansion, strictly within the agreed straightforward-case scope. evidence trail 2025-04-08 — usability test — ai-assisted prior authorization drafting (v1) ( usability-test ) 2025-11-04 — usability test — ai-assisted prior authorization drafting (v2, follow-up) ( usability-test ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md)"}, {"id": "finding:rollout-and-change-management", "kind": "finding", "title": "Rollout & Change Management", "date": "2025-12-02", "type": "synthesis", "status": "synthesized", "tags": ["change-management", "organizational-readiness", "pulse", "rollout", "survey", "training", "year-end"], "related_components": ["patient-chatbot-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/rollout-and-change-management.md", "html": "<h1>Rollout &amp; Change Management</h1>\n<h2>Overview</h2>\n<p>Two sessions, five weeks apart at year-end, look at how Compass AI features actually get adopted once built: a training/change-management interview (Oct 2025) and an all-staff AI readiness pulse survey (Dec 2025).</p>\n<ul><li><strong>The training interview drew directly on a documented past failure.</strong> The 2022 CDS alert rollout — referenced independently by executives back in January (see [governance-and-phi.md](governance-and-phi.md)) — is treated as the cautionary tale: a single 20-minute training video with no hands-on practice, and adoption suffered. The Director of Training&#x27;s recommendation is a &quot;unit champion&quot; model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time, and to avoid rolling out during flu season (Nov-Feb) given historical attendance patterns.</li><li><strong>The December pulse survey found an awareness gap that changes rollout sequencing for non-clinical features specifically</strong>: only 34% of non-clinical/admin staff were aware Compass AI work was even underway, vs. 71% of clinical staff. This matters directly for the patient scheduling chatbot (see [patient-scheduling-chatbot.md](patient-scheduling-chatbot.md)), which is the first admin-facing, non-clinical feature nearing rollout — communications need to reach that audience before launch, not after.</li><li>The survey&#x27;s directional sentiment comparison to the September burnout survey is noted but flagged as not a clean apples-to-apples comparison (different question wording).</li></ul>\n<p>Recommendation: use the unit-champion training model for the ambient scribe GA rollout (avoiding flu-season timing), and run a dedicated non-clinical-staff communications push before the scheduling chatbot goes live.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-10-21</strong> — <a href=\"../raw/2025-10-21-interview-training-department-rollout-change-management/session-notes.md\">Interview — Training &amp; Education Dept on Rollout/Change Management Planning</a> <em>(<code>interview</code>)</em></li><li><strong>2025-12-02</strong> — <a href=\"../raw/2025-12-02-survey-allstaff-ai-readiness-pulse/session-notes.md\">Survey — All-Staff AI Readiness Pulse Survey</a> <em>(<code>survey</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li><li>[Ambient AI Scribe](ambient-scribe.md)</li></ul>", "searchText": "rollout & change management change-management organizational-readiness pulse rollout survey training year-end patient-chatbot-widget rollout &amp; change management overview two sessions, five weeks apart at year-end, look at how compass ai features actually get adopted once built: a training/change-management interview (oct 2025) and an all-staff ai readiness pulse survey (dec 2025). the training interview drew directly on a documented past failure. the 2022 cds alert rollout — referenced independently by executives back in january (see [governance-and-phi.md](governance-and-phi.md)) — is treated as the cautionary tale: a single 20-minute training video with no hands-on practice, and adoption suffered. the director of training&#x27;s recommendation is a &quot;unit champion&quot; model (1-2 respected staff per unit, trained early and deeply) plus mandatory hands-on practice time, and to avoid rolling out during flu season (nov-feb) given historical attendance patterns. the december pulse survey found an awareness gap that changes rollout sequencing for non-clinical features specifically : only 34% of non-clinical/admin staff were aware compass ai work was even underway, vs. 71% of clinical staff. this matters directly for the patient scheduling chatbot (see [patient-scheduling-chatbot.md](patient-scheduling-chatbot.md)), which is the first admin-facing, non-clinical feature nearing rollout — communications need to reach that audience before launch, not after. the survey&#x27;s directional sentiment comparison to the september burnout survey is noted but flagged as not a clean apples-to-apples comparison (different question wording). recommendation: use the unit-champion training model for the ambient scribe ga rollout (avoiding flu-season timing), and run a dedicated non-clinical-staff communications push before the scheduling chatbot goes live. evidence trail 2025-10-21 — interview — training &amp; education dept on rollout/change management planning ( interview ) 2025-12-02 — survey — all-staff ai readiness pulse survey ( survey ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md) [ambient ai scribe](ambient-scribe.md)"}, {"id": "finding:scope-boundaries-and-workflow-fit", "kind": "finding", "title": "Scope Boundaries & Workflow Fit", "date": "2025-10-07", "type": "synthesis", "status": "synthesized", "tags": ["42-cfr-part-2", "authentication", "baseline", "behavioral-health", "clinician-workflow", "ed", "high-acuity", "intake", "mfa", "phi", "security", "sensitive-notes", "sso", "workflow"], "related_components": ["ambient-scribe-widget", "ed-intake-form", "sso-mfa-login"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/scope-boundaries-and-workflow-fit.md", "html": "<h1>Scope Boundaries &amp; Workflow Fit</h1>\n<h2>Overview</h2>\n<p>Three sessions across the year are grouped here because their common output was a &quot;don&#x27;t build this yet, or don&#x27;t build it here&quot; conclusion — which the December executive retro specifically praised as valuable in its own right.</p>\n<ul><li><strong>ED intake (contextual inquiry, Apr 2025):</strong> peak-hour interruption frequency (every 2-4 minutes) makes any AI tool requiring sustained review attention a poor fit for ED intake nurses specifically during peak windows. The one positive signal — insurance-card-photo pre-fill for registration clerks — was carved out as a smaller, separate, lower-risk candidate instead.</li><li><strong>SSO/MFA modernization (interview, May 2025):</strong> independent of any AI feature, a planned 15-minute forced re-authentication conflicts with clinical ops&#x27; expectation of a 4-hour session — and nobody had yet defined what happens to an in-progress ambient scribe recording session if a forced re-auth interrupts it mid-visit. This was flagged as an unhandled edge case for the ambient scribe team (see [ambient-scribe.md](ambient-scribe.md)) rather than something to solve in this session.</li><li><strong>Behavioral health (contextual inquiry, Oct 2025):</strong> reiterated, independently, the same &quot;no structured way to flag a 42 CFR Part 2-protected note&quot; platform gap first identified in the July HIM research (see [him-coding-and-billing.md](him-coding-and-billing.md)) — and added a harder constraint on top: any AI tool listening to or drafting behavioral health notes needs a dedicated legal/consent review that hasn&#x27;t started yet. This population was formally excluded from the near-term ambient scribe rollout as a result.</li></ul>\n<p>Recommendation: keep these three exclusions as explicit, documented scope boundaries in the 2026 roadmap (per the December retro) rather than informal assumptions that could quietly erode.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>
