ording is misread as optional — this isn&#x27;t users abandoning due to task difficulty, it&#x27;s users not realizing the step is required and exiting instead of completing it.</p>", "searchText": "onboarding funnel — drop-off analysis onboarding funnel project-onboarding summary step 3 (&quot;connect calendar&quot;) is the single largest drop-off point in the onboarding funnel, accounting for a larger share of incomplete signups than any other step. data sourced from the jan 2026 onboarding funnel export (platform analytics, not included in this fictional dataset — a real repo would keep the untouched export under analytics/raw/2026-01-onboarding-funnel-export/ ). interpretation drop-off concentrated at step 3 independently corroborates the usability study&#x27;s finding ( research/findings/onboarding.md ) that step 3&#x27;s wording is misread as optional — this isn&#x27;t users abandoning due to task difficulty, it&#x27;s users not realizing the step is required and exiting instead of completing it."}, {"id": "deliverable:research-plans/onboarding-usability-study-q1", "kind": "deliverable", "title": "Onboarding Usability Study — Q1", "date": "2026-01-12", "type": "research-plans", "status": "final", "tags": ["onboarding", "usability", "q1", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../research-plans/onboarding-usability-study-q1.md", "corrections": [], "html": "<h2>Objectives</h2>\n<p>Understand where new workspace admins get stuck during first-time setup, and whether the current 6-step onboarding wizard matches how admins actually think about the task.</p>\n<h2>Method</h2>\n<p>Moderated remote usability sessions, 45 minutes each, think-aloud protocol. Sample: 6 participants, all first-time Fernway admins hired within the last 90 days, mix of company sizes (10–200 employees).</p>\n<h2>Timeline</h2>\n<ul><li>Recruiting: Jan 12–16</li><li>Sessions: Jan 19–23</li><li>Synthesis: Jan 26–30</li></ul>\n<h2>Related</h2>\n<p>See <code>facilitation-guides/onboarding-usability-guide.md</code> for the session script.</p>", "searchText": "onboarding usability study — q1 onboarding usability q1 project-onboarding objectives understand where new workspace admins get stuck during first-time setup, and whether the current 6-step onboarding wizard matches how admins actually think about the task. method moderated remote usability sessions, 45 minutes each, think-aloud protocol. sample: 6 participants, all first-time fernway admins hired within the last 90 days, mix of company sizes (10–200 employees). timeline recruiting: jan 12–16 sessions: jan 19–23 synthesis: jan 26–30 related see facilitation-guides/onboarding-usability-guide.md for the session script."}, {"id": "deliverable:facilitation-guides/onboarding-usability-guide", "kind": "deliverable", "title": "Onboarding Usability Study — Facilitation Guide", "date": "2026-01-16", "type": "facilitation-guides", "status": "final", "tags": ["onboarding", "usability", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../facilitation-guides/onboarding-usability-guide.md", "corrections": [], "html": "<h2>Warm-up</h2>\n<ul><li>Tell me about your role and how long you&#x27;ve been using Fernway.</li><li>Walk me through the last time you set up a new workspace for your team.</li></ul>\n<h2>Core questions</h2>\n<ul><li>(Task) Imagine you just signed up — walk me through what you&#x27;d do first.</li><li>What does &quot;workspace&quot; mean to you before you&#x27;ve used the product?</li><li>At each step: what do you expect to happen next, before you click?</li></ul>\n<h2>Wrap-up</h2>\n<ul><li>What was the most confusing part of getting set up?</li><li>If you could change one thing about this flow, what would it be?</li><li>Thanks — anything you&#x27;d like to add that we didn&#x27;t cover?</li></ul>", "searchText": "onboarding usability study — facilitation guide onboarding usability project-onboarding warm-up tell me about your role and how long you&#x27;ve been using fernway. walk me through the last time you set up a new workspace for your team. core questions (task) imagine you just signed up — walk me through what you&#x27;d do first. what does &quot;workspace&quot; mean to you before you&#x27;ve used the product? at each step: what do you expect to happen next, before you click? wrap-up what was the most confusing part of getting set up? if you could change one thing about this flow, what would it be? thanks — anything you&#x27;d like to add that we didn&#x27;t cover?"}, {"id": "deliverable:topline-summaries/ambient-scribe-ga-adoption-first-4-weeks", "kind": "deliverable", "title": "Ambient Scribe GA Candidate — First 4 Weeks Adoption Topline", "date": "2026-01-28", "type": "topline-summaries", "status": "final", "tags": ["ambient-scribe", "ga-release", "dashboard", "longitudinal", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../topline-summaries/ambient-scribe-ga-adoption-first-4-weeks.md", "corrections": [], "html": "<h2>Quick takeaways</h2>\n<p>Covers the first 4 weeks of GA-candidate rollout, per the 2026-01-27 dashboard review (<code>raw/2026-01-27-dashboard-review-ambient-scribe-ga-adoption/</code>).</p>\n<ul><li>Clinicians shown confidence highlighting skim high-confidence lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the GA-candidate usability finding that visible uncertainty, not raw accuracy, changes reviewing behavior.</li><li>Adoption is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments.</li></ul>\n<h2>Open questions</h2>\n<ul><li>Is the physician/resident adoption gap a training gap, a trust gap, or a workflow difference? Dashboard data alone can&#x27;t answer this — flagged as a candidate for a short follow-up interview round.</li></ul>", "searchText": "ambient scribe ga candidate — first 4 weeks adoption topline ambient-scribe ga-release dashboard longitudinal project-ambient-scribe quick takeaways covers the first 4 weeks of ga-candidate rollout, per the 2026-01-27 dashboard review ( raw/2026-01-27-dashboard-review-ambient-scribe-ga-adoption/ ). clinicians shown confidence highlighting skim high-confidence lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the ga-candidate usability finding that visible uncertainty, not raw accuracy, changes reviewing behavior. adoption is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments. open questions is the physician/resident adoption gap a training gap, a trust gap, or a workflow difference? dashboard data alone can&#x27;t answer this — flagged as a candidate for a short follow-up interview round."}, {"id": "deliverable:topline-summaries/example-topline-summary", "kind": "deliverable", "title": "Onboarding Study — Session 1–3 Topline", "date": "2026-01-21", "type": "topline-summaries", "status": "final", "tags": ["onboarding", "usability", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../topline-summaries/example-topline-summary.md", "corrections": [], "html": "<h2>Quick takeaways</h2>\n<p>Sourced from <code>raw/2026-01-19-onboarding-usability-test/</code>, sessions 1–3.</p>\n<ul><li>1 of 3 (session 3) hesitated before inviting the team — worried invites would email the whole team before they were ready.</li><li>2 of 3 tried to skip step 3 (&quot;Connect calendar&quot;) entirely, assuming it was optional even though it&#x27;s required.</li></ul>\n<h2>Open questions</h2>\n<ul><li>Is the step-4 (invite) hesitation about wording, or about not trusting the system yet this early in the relationship? Watch for this in sessions 4–6.</li></ul>", "searchText": "onboarding study — session 1–3 topline onboarding usability project-onboarding quick takeaways sourced from raw/2026-01-19-onboarding-usability-test/ , sessions 1–3. 1 of 3 (session 3) hesitated before inviting the team — worried invites would email the whole team before they were ready. 2 of 3 tried to skip step 3 (&quot;connect calendar&quot;) entirely, assuming it was optional even though it&#x27;s required. open questions is the step-4 (invite) hesitation about wording, or about not trusting the system yet this early in the relationship? watch for this in sessions 4–6."}, {"id": "deliverable:research-readouts/onboarding-flow-q1-readout", "kind": "deliverable", "title": "Onboarding Flow — Q1 Readout", "date": "2026-02-02", "type": "research-readouts", "status": "final", "tags": ["onboarding", "readout", "q1", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../research-readouts/onboarding-flow-q1-readout.md", "corrections": [], "html": "<h2>Summary</h2>\n<p>Across all 6 onboarding usability sessions (Jan 19-23, 2026), the most consistently observed first-time-setup friction is step 3 (&quot;Connect calendar&quot;) reading as optional when it&#x27;s actually required — 2 of 3 participants in sessions 1-3 attempted to skip it outright, and sessions 4-6 read it as optional in the same way. The funnel summary (<code>analytics/summaries/onboarding-funnel-dropoff.md</code>) reports step 3 as the largest drop-off point, but the underlying export isn&#x27;t in the repo.</p>\n<h2>Key findings</h2>\n<ul><li>Step 3&#x27;s wording implies an optionality it doesn&#x27;t have — see finding <code>onboarding</code>.</li><li>The step 3 drop-off in the funnel summary is consistent with users misreading the step as optional; funnel data alone can&#x27;t show why users drop off.</li></ul>\n<h2>Recommendations</h2>\n<ol><li>Relabel step 3 to state plainly that calendar connection is required before later functionality works.</li><li>Give visible feedback that invites (entered in step 4, &quot;Invite your team&quot;) aren&#x27;t sent until the whole wizard is submitted — addressing a related hesitation seen in session 3.</li><li>Retest step 3 specifically once the wording change ships, per <code>research/findings/onboarding.md</code>&#x27;s status note.</li></ol>", "searchText": "onboarding flow — q1 readout onboarding readout q1 project-onboarding summary across all 6 onboarding usability sessions (jan 19-23, 2026), the most consistently observed first-time-setup friction is step 3 (&quot;connect calendar&quot;) reading as optional when it&#x27;s actually required — 2 of 3 participants in sessions 1-3 attempted to skip it outright, and sessions 4-6 read it as optional in the same way. the funnel summary ( analytics/summaries/onboarding-funnel-dropoff.md ) reports step 3 as the largest drop-off point, but the underlying export isn&#x27;t in the repo. key findings step 3&#x27;s wording implies an optionality it doesn&#x27;t have — see finding onboarding . the step 3 drop-off in the funnel summary is consistent with users misreading the step as optional; funnel data alone can&#x27;t show why users drop off. recommendations relabel step 3 to state plainly that calendar connection is required before later functionality works. give visible feedback that invites (entered in step 4, &quot;invite your team&quot;) aren&#x27;t sent until the whole wizard is submitted — addressing a related hesitation seen in session 3. retest step 3 specifically once the wording change ships, per research/findings/onboarding.md &#x27;s status note."}, {"id": "deliverable:heuristic-evaluations/ambient-scribe-encounter-view-pre-ga", "kind": "deliverable", "title": "Ambient Scribe Encounter-View — Heuristic Evaluation (Pre-GA)", "date": "2025-12-20", "type": "heuristic-evaluations", "status": "final", "tags": ["ambient-scribe", "heuristic-evaluation", "sso", "mfa", "documentation", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": "Jordan Lee", "reviewed_by": null, "path": "../heuristic-evaluations/ambient-scribe-encounter-view-pre-ga.md", "corrections": [], "html": "<h2>Scope</h2>\n<p>Expert review of <code>encounter-view</code> and <code>ambient-scribe-widget</code> against Nielsen&#x27;s heuristics, conducted ahead of the GA-candidate usability round to catch structural issues that moderated testing might miss until much later.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>Heuristic violated</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Session lock during active dictation gives no distinct state — reads identically to an idle timeout with nothing in progress</td><td>Visibility of system status</td><td>3</td><td><code>encounter-view</code>, locked state</td></tr><tr><td>The generic low-confidence underline is the only signal for both &quot;uncertain transcription&quot; and &quot;medication name worth double-checking&quot;</td><td>Recognition rather than recall</td><td>2</td><td><code>ambient-scribe-widget</code>, confidence-highlighted variant</td></tr><tr><td>No way to tell a paused-but-preserved draft from a discarded one without re-authenticating first</td><td>Visibility of system status</td><td>3</td><td><code>encounter-view</code>, locked state</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Prioritize the session-lock state — it&#x27;s a trust-eroding false signal, not a cosmetic gap, and this expert-review pass predates any direct observation of clinician impact. Flag the confidence-signal overload as worth a dedicated concept test before shipping any new flag type on top of the existing generic variant.</p>\n<h2>Related Findings</h2>\n<ul><li><a href=\"../research/findings/ambient-scribe-post-ga-refinements.md\">Ambient Scribe — Post-GA Refinements</a></li></ul>", "searchText": "ambient scribe encounter-view — heuristic evaluation (pre-ga) ambient-scribe heuristic-evaluation sso mfa documentation project-ambient-scribe scope expert review of encounter-view and ambient-scribe-widget against nielsen&#x27;s heuristics, conducted ahead of the ga-candidate usability round to catch structural issues that moderated testing might miss until much later. issues found issue heuristic violated severity location session lock during active dictation gives no distinct state — reads identically to an idle timeout with nothing in progress visibility of system status 3 encounter-view , locked state the generic low-confidence underline is the only signal for both &quot;uncertain transcription&quot; and &quot;medication name worth double-checking&quot; recognition rather than recall 2 ambient-scribe-widget , confidence-highlighted variant no way to tell a paused-but-preserved draft from a discarded one without re-authenticating first visibility of system status 3 encounter-view , locked state recommendations prioritize the session-lock state — it&#x27;s a trust-eroding false signal, not a cosmetic gap, and this expert-review pass predates any direct observation of clinician impact. flag the confidence-signal overload as worth a dedicated concept test before shipping any new flag type on top of the existing generic variant. related findings ambient scribe — post-ga refinements"}, {"id": "deliverable:heuristic-evaluations/example-heuristic-evaluation", "kind": "deliverable", "title": "Onboarding Wizard — Heuristic Evaluation", "date": "2026-02-05", "type": "heuristic-evaluations", "status": "final", "tags": ["onboarding", "heuristic-evaluation", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": "Jordan Lee", "reviewed_by": null, "path": "../heuristic-evaluations/example-heuristic-evaluation.md", "corrections": [], "html": "<h2>Scope</h2>\n<p>Full onboarding wizard, steps 1–6, desktop web only.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>Heuristic violated</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Step 3 wording implies &quot;connect calendar&quot; is optional when it&#x27;s required</td><td>Match between system and real world</td><td>3</td><td>Step 3</td></tr><tr><td>No way to go back without losing entered data</td><td>User control and freedom</td><td>3</td><td>Steps 2–5</td></tr><tr><td>Progress indicator doesn&#x27;t reflect actual step count on mobile</td><td>Consistency and standards</td><td>2</td><td>Sidebar, mobile view</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Prioritize the step 3 wording fix (matches usability study finding) and the back-navigation data-loss issue before the mobile indicator fix.</p>", "searchText": "onboarding wizard — heuristic evaluation onboarding heuristic-evaluation project-onboarding scope full onboarding wizard, steps 1–6, desktop web only. issues found issue heuristic violated severity location step 3 wording implies &quot;connect calendar&quot; is optional when it&#x27;s required match between system and real world 3 step 3 no way to go back without losing entered data user control and freedom 3 steps 2–5 progress indicator doesn&#x27;t reflect actual step count on mobile consistency and standards 2 sidebar, mobile view recommendations prioritize the step 3 wording fix (matches usability study finding) and the back-navigation data-loss issue before the mobile indicator fix."}, {"id": "deliverable:accessibility-screenings/example-accessibility-screening", "kind": "deliverable", "title": "Onboarding Wizard — Accessibility Screening", "date": "2026-02-06", "type": "accessibility-screenings", "status": "final", "tags": ["onboarding", "accessibility", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../accessibility-screenings/example-accessibility-screening.md", "corrections": [], "html": "<h2>Scope</h2>\n<p>Onboarding wizard, steps 1–6, screened against WCAG 2.1 AA using keyboard-only navigation and VoiceOver.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>WCAG criterion</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Calendar-connect button has no accessible label, reads as &quot;button&quot;</td><td>4.1.2 Name, Role, Value</td><td>High</td><td>Step 3</td></tr><tr><td>Focus order skips the &quot;Skip this step&quot; link</td><td>2.4.3 Focus Order</td><td>Medium</td><td>Step 3</td></tr><tr><td>Error message color contrast is 3.2:1, below the 4.5:1 minimum</td><td>1.4.3 Contrast (Minimum)</td><td>Medium</td><td>Steps 2, 4</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Fix the calendar-connect button label first — it&#x27;s a full blocker for screen-reader users completing the required step.</p>", "searchText": "onboarding wizard — accessibility screening onboarding accessibility project-onboarding scope onboarding wizard, steps 1–6, screened against wcag 2.1 aa using keyboard-only navigation and voiceover. issues found issue wcag criterion severity location calendar-connect button has no accessible label, reads as &quot;button&quot; 4.1.2 name, role, value high step 3 focus order skips the &quot;skip this step&quot; link 2.4.3 focus order medium step 3 error message color contrast is 3.2:1, below the 4.5:1 minimum 1.4.3 contrast (minimum) medium steps 2, 4 recommendations fix the calendar-connect button label first — it&#x27;s a full blocker for screen-reader users completing the required step."}, {"id": "deliverable:accessibility-screenings/status-indicator-remediation-screening", "kind": "deliverable", "title": "Care-Gap Badge & Alert Triage Queue — Status-Indicator Screening", "date": "2026-01-08", "type": "accessibility-screenings", "status": "final", "tags": ["accessibility", "wcag", "section-508", "components", "care-coordination", "alert-triage", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../accessibility-screenings/status-indicator-remediation-screening.md", "corrections": [], "html": "<h2>Scope</h2>\n<p>Targeted WCAG 2.1 AA re-screening of the two live components carrying the color-only status-dot pattern named as a likely shared root cause in the Nov 2025 cross-cutting accessibility review: <code>care-gap-badge</code> (clinician dashboard) and <code>alert-triage-queue</code> (care coordination).</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>WCAG criterion</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Both components render status as color-only dots (red/yellow/green) with no text or pattern alternative — confirmed as the same underlying markup pattern, not just a visual coincidence</td><td>1.4.1 Use of Color</td><td>High</td><td><code>care-gap-badge</code>, <code>alert-triage-queue</code></td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Confirmed: one shared root cause, not three independent bugs. Fix at the design-system level rather than patching each surface separately — see <code>design-system/v4-1-status-indicator-component.md</code> for the resulting shared component.</p>\n<h2>Related Findings</h2>\n<ul><li><a href=\"../research/findings/accessibility-cross-cutting.md\">Accessibility (Cross-Cutting)</a></li><li><a href=\"../research/findings/care-coordination-triage.md\">Care Coordination &amp; Alert Triage</a></li></ul>", "searchText": "care-gap badge & alert triage queue — status-indicator screening accessibility wcag section-508 components care-coordination alert-triage project-cross-cutting scope targeted wcag 2.1 aa re-screening of the two live components carrying the color-only status-dot pattern named as a likely shared root cause in the nov 2025 cross-cutting accessibility review: care-gap-badge (clinician dashboard) and alert-triage-queue (care coordination). issues found issue wcag criterion severity location both components render status as color-only dots (red/yellow/green) with no text or pattern alternative — confirmed as the same underlying markup pattern, not just a visual coincidence 1.4.1 use of color high care-gap-badge , alert-triage-queue recommendations confirmed: one shared root cause, not three independent bugs. fix at the design-system level rather than patching each surface separately — see design-system/v4-1-status-indicator-component.md for the resulting shared component. related findings accessibility (cross-cutting) care coordination &amp; alert triage"}, {"id": "deliverable:service-topology/example-service-topology", "kind": "deliverable", "title": "Onboarding & Account Provisioning — Service Topology", "date": "2026-02-10", "type": "service-topology", "status": "in-review", "tags": ["onboarding", "service-blueprint", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../service-topology/example-service-topology.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Maps the onboarding wizard&#x27;s front-end steps against the backend services they trigger: account creation, workspace provisioning, and calendar OAuth.</p>\n<h2>Map</h2>\n<p>Signup form -&gt; Account Service (sync) -&gt; Workspace Provisioning (async, ~8s average) -&gt; Calendar OAuth (external, Google/Outlook) -&gt; Invite Service (sends on submit, not on step completion — this is the source of the step-4 (&quot;Invite your team&quot;) &quot;does this send now?&quot; confusion identified in the usability study).</p>", "searchText": "onboarding & account provisioning — service topology onboarding service-blueprint project-onboarding overview maps the onboarding wizard&#x27;s front-end steps against the backend services they trigger: account creation, workspace provisioning, and calendar oauth. map signup form -&gt; account service (sync) -&gt; workspace provisioning (async, ~8s average) -&gt; calendar oauth (external, google/outlook) -&gt; invite service (sends on submit, not on step completion — this is the source of the step-4 (&quot;invite your team&quot;) &quot;does this send now?&quot; confusion identified in the usability study)."}, {"id": "deliverable:service-topology/prior-auth-drafting-v2", "kind": "deliverable", "title": "AI-Assisted Prior Authorization Drafting — Service Topology (v2)", "date": "2025-11-20", "type": "service-topology", "status": "final", "tags": ["prior-auth", "utilization-management", "v2", "service-blueprint", "project-prior-auth"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../service-topology/prior-auth-drafting-v2.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Maps the <code>prior-auth-drafting-panel</code> front end against the backend it actually depends on, drawn up after v2 testing confirmed the citation feature is actively used rather than ignored as friction.</p>\n<h2>Map</h2>\n<p>Encounter chart -&gt; Chart-Data Service (pulls diagnosis/treatment history) -&gt; Drafting Model (generates justification text + inline citations back to specific chart spans) -&gt; Payer-Rules Lookup (validates against current, not cached, diagnosis codes — the fix that closed the v1 data-freshness bug) -&gt; UM Review Queue (nurse accepts/edits/rejects) -&gt; Submission Service. Citation links resolve to specific chart-text spans rather than section headers, which is why nurses could meaningfully check at least one citation before accepting in v2.</p>\n<p>Recommendation status: supports the &quot;pilot expansion&quot; recommendation in <code>prior-authorization.md</code> — the data-freshness fix is now a tracked backend dependency, not just a UI note, and should stay visible as one before expanding beyond straightforward cases.</p>", "searchText": "ai-assisted prior authorization drafting — service topology (v2) prior-auth utilization-management v2 service-blueprint project-prior-auth overview maps the prior-auth-drafting-panel front end against the backend it actually depends on, drawn up after v2 testing confirmed the citation feature is actively used rather than ignored as friction. map encounter chart -&gt; chart-data service (pulls diagnosis/treatment history) -&gt; drafting model (generates justification text + inline citations back to specific chart spans) -&gt; payer-rules lookup (validates against current, not cached, diagnosis codes — the fix that closed the v1 data-freshness bug) -&gt; um review queue (nurse accepts/edits/rejects) -&gt; submission service. citation links resolve to specific chart-text spans rather than section headers, which is why nurses could meaningfully check at least one citation before accepting in v2. recommendation status: supports the &quot;pilot expansion&quot; recommendation in prior-authorization.md — the data-freshness fix is now a tracked backend dependency, not just a ui note, and should stay visible as one before expanding beyond straightforward cases."}, {"id": "deliverable:personas/dana-overwhelmed-new-admin", "kind": "deliverable", "title": "Dana — The Overwhelmed New Admin", "date": "2026-02-12", "type": "personas", "status": "final", "tags": ["onboarding", "persona", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../personas/dana-overwhelmed-new-admin.md", "corrections": [], "html": "<h2>Summary</h2>\n<p>Dana, 34, Office Manager at a 40-person company. Just been handed Fernway setup as &quot;one more thing&quot; on top of her regular job. Not technical, but capable — she just doesn&#x27;t have time to figure things out by trial and error.</p>\n<h2>Goals</h2>\n<ul><li>Get the team up and running with minimal back-and-forth.</li><li>Avoid looking like she broke something in front of her team.</li></ul>\n<h2>Frustrations</h2>\n<ul><li>Steps that don&#x27;t clearly say what&#x27;s required vs. optional.</li><li>No way to preview what happens before committing to an action.</li></ul>\n<h2>Based on</h2>\n<p>Grounded in <code>research-plans/onboarding-usability-study-q1.md</code>, sessions 1–6.</p>", "searchText": "dana — the overwhelmed new admin onboarding persona project-onboarding summary dana, 34, office manager at a 40-person company. just been handed fernway setup as &quot;one more thing&quot; on top of her regular job. not technical, but capable — she just doesn&#x27;t have time to figure things out by trial and error. goals get the team up and running with minimal back-and-forth. avoid looking like she broke something in front of her team. frustrations steps that don&#x27;t clearly say what&#x27;s required vs. optional. no way to preview what happens before committing to an action. based on grounded in research-plans/onboarding-usability-study-q1.md , sessions 1–6."}, {"id": "deliverable:personas/physician-longitudinal-scribe-user", "kind": "deliverable", "title": "The Longitudinal Physician — Ambient Scribe", "date": "2026-02-26", "type": "personas", "status": "final", "tags": ["ambient-scribe", "persona", "longitudinal", "trust-in-ai", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../personas/physician-longitudinal-scribe-user.md", "corrections": [], "html": "<h1>The Longitudinal Physician — Ambient Scribe</h1>\n<h2>Summary</h2>\n<p><strong>Evidence basis:</strong> Observed (v0.1 to GA candidate, from P09 in <code>raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md:36-37</code>, <code>raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md:36-37</code> and <code>raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:36-37</code>); inferred (post-GA stage, second and third goals and both frustrations, from other participants in <code>raw/2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md:51-57</code> and <code>raw/2026-02-17-session-lock-during-dictation/session-notes.md:54-60</code>).</p>\n<p>Modeled on P09 (Internal Medicine), one of the 3 participants who returned from v0.1 for v0.2, and the one confirmed in all three ambient-scribe testing rounds — v0.1 (Feb 2025), v0.2 (Sep 2025), and the GA candidate (Jan 2026). Represents the clinician whose relationship with the tool has actually changed over a year of iteration, not a first-time impression.</p>\n<h2>Goals</h2>\n<ul><li>Trust the tool enough to stop reading every generated line, without trusting it blindly. <em>(P09, v0.1 to GA candidate)</em></li><li>Catch the specific error types that matter clinically (medication names) rather than treating all uncertainty as equally worth flagging. <em>(Inferred from P22, 2026-02-10; not observed for P09)</em></li><li>Not lose work to session/security interruptions that are unrelated to the clinical task. <em>(Inferred from P119 and P33, 2026-02-17; not observed for P09)</em></li></ul>\n<h2>What changed for this persona, round over round</h2>\n<ul><li><strong>v0.1 → v0.2:</strong> Accuracy improved, but reading behavior didn&#x27;t — still read every line, despite fewer errors to catch.</li><li><strong>v0.2 → GA candidate:</strong> The first behavior change came from <em>visible uncertainty</em> (per-line confidence highlighting), not from further accuracy gains — this persona began skimming high-confidence lines for the first time.</li><li><strong>Post-GA (Feb 2026, inferred from other participants):</strong> The next trust lever is specificity, not just visibility — a distinct medication-safety flag reads as more actionable than generic low confidence, but risks over-trusting anything left unflagged if that distinction isn&#x27;t actively managed in the UI. This is not P09&#x27;s observed experience: it comes from P22 and P24 in the 2026-02-10 concept test.</li></ul>\n<h2>Frustrations</h2>\n<ul><li>Generic &quot;low confidence&quot; signals don&#x27;t tell this persona <em>what kind</em> of thing to double-check. <em>(Inferred from P22, 2026-02-10)</em></li><li>Session locks during dictation currently look identical to data loss, which erodes trust in the tool independent of transcription accuracy itself. <em>(Inferred from P119 and P33, 2026-02-17)</em></li></ul>\n<h2>Based on</h2>\n<p>P09&#x27;s sessions in the three ambient-scribe test rounds (2025-02-25, 2025-09-23, 2026-01-13). The post-GA stage, the second and third goals and both frustrations come from other participants in the 2026-02-10 medication-flag concept test and the 2026-02-17 session-lock contextual inquiry; no raw session places P09 in either.</p>", "searchText": "the longitudinal physician — ambient scribe ambient-scribe persona longitudinal trust-in-ai project-ambient-scribe the longitudinal physician — ambient scribe summary evidence basis: observed (v0.1 to ga candidate, from p09 in raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md:36-37 , raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md:36-37 and raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:36-37 ); inferred (post-ga stage, second and third goals and both frustrations, from other participants in raw/2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md:51-57 and raw/2026-02-17-session-lock-during-dictation/session-notes.md:54-60 ). modeled on p09 (internal medicine), one of the 3 participants who returned from v0.1 for v0.2, and the one confirmed in all three ambient-scribe testing rounds — v0.1 (feb 2025), v0.2 (sep 2025), and the ga candidate (jan 2026). represents the clinician whose relationship with the tool has actually changed over a year of iteration, not a first-time impression. goals trust the tool enough to stop reading every generated line, without trusting it blindly. (p09, v0.1 to ga candidate) catch the specific error types that matter clinically (medication names) rather than treating all uncertainty as equally worth flagging. (inferred from p22, 2026-02-10; not observed for p09) not lose work to session/security interruptions that are unrelated to the clinical task. (inferred from p119 and p33, 2026-02-17; not observed for p09) what changed for this persona, round over round v0.1 → v0.2: accuracy improved, but reading behavior didn&#x27;t — still read every line, despite fewer errors to catch. v0.2 → ga candidate: the first behavior change came from visible uncertainty (per-line confidence highlighting), not from further accuracy gains — this persona began skimming high-confidence lines for the first time. post-ga (feb 2026, inferred from other participants): the next trust lever is specificity, not just visibility — a distinct medication-safety flag reads as more actionable than generic low confidence, but risks over-trusting anything left unflagged if that distinction isn&#x27;t actively managed in the ui. this is not p09&#x27;s observed experience: it comes from p22 and p24 in the 2026-02-10 concept test. frustrations generic &quot;low confidence&quot; signals don&#x27;t tell this persona what kind of thing to double-check. (inferred from p22, 2026-02-10) session locks during dictation currently look identical to data loss, which erodes trust in the tool independent of transcription accuracy itself. (inferred from p119 and p33, 2026-02-17) based on p09&#x27;s sessions in the three ambient-scribe test rounds (2025-02-25, 2025-09-23, 2026-01-13). the post-ga stage, the second and third goals and both frustrations come from other participants in the 2026-02-10 medication-flag concept test and the 2026-02-17 session-lock contextual inquiry; no raw session places p09 in either."}, {"id": "deliverable:mental-models/care-coordinator-alert-ranking", "kind": "deliverable", "title": "Care Coordinators' Mental Model of Alert Ranking", "date": "2025-09-05", "type": "mental-models", "status": "final", "tags": ["care-coordination", "alert-triage", "alert-fatigue", "workflow", "project-care-coordination"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../mental-models/care-coordinator-alert-ranking.md", "corrections": [], "html": "<h2>Overview</h2>\n<p><strong>Evidence basis:</strong> Mixed. Observed (what coordinators said about ranking and patient history, from P81 in <code>raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md:37</code> and <code>raw/2026-07-07-interview-care-coordinator-override-reason-capture/session-notes.md:30-38</code>, P134 in <code>raw/2026-08-04-interview-care-coordinator-complex-care-alert-volume/session-notes.md:30-37</code>, and the float-pool counterpoint from P05 in <code>raw/2026-04-07-interview-care-coordinator-float-pool-system-familiarity/session-notes.md:33</code> and P136 in <code>raw/2026-09-01-interview-care-coordinator-float-pool-coverage/session-notes.md:31,37</code>); inferred (the model itself, built from the ranking disagreements and override gap in <code>raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md:28-30,37</code>; how coordinators think about ranking is the designer&#x27;s reading, not something participants were asked).</p>\n<p>Covers how care coordinators conceptualize &quot;ranking&quot; in the alert-triage queue versus what they saw it do, drawn from the Aug 2025 usability test&#x27;s override-disagreement pattern.</p>\n<h2>Model</h2>\n<p>The designer&#x27;s paraphrase of the coordinator view: the system should defer to the coordinator&#x27;s sense of a patient&#x27;s history-driven risk — an experience-weighted judgment call. In 2025 this rested on one coordinator, P81: &quot;I wanted to tell it &#x27;no, this one&#x27;s more urgent because I know this patient&#x27;s history,&#x27; but there was nowhere to put that.&quot; It now rests on two team coordinators. In 2026, P81 said their most common reason for moving an alert is something the patient or a family member said on the phone that isn&#x27;t in the chart yet, and P134, on a complex care team with a high-risk panel, said &quot;half of deciding who&#x27;s at risk is knowing what happened to them last winter&quot; (both observed: what they said, not measured). Participants saw the ranking weight recency more heavily than their own sense of clinical risk; 4 of 5 disagreed with the AI&#x27;s top-3 ranking on at least one of three test queues. There&#x27;s no way for a coordinator&#x27;s override to feed back into the ranking. Triage of a 20-item queue was still faster with the AI ranking than with a chronological queue in this simulated test (avg 6.5 min vs. 9 min).</p>\n<h2>Float-pool counterpoint</h2>\n<p>The model assumes the coordinator has a patient&#x27;s history to weigh against the ranking. Float coordinators often don&#x27;t. P05, floating in 2026, works the current chronological queue strictly in order and leaves reprioritising to the team&#x27;s own coordinators, and P136 would accept a ranked queue as a starting point because they lack that history, while still checking it (both observed: what they said about their own practice). Inferred: for float coordinators the ranking may stand in for the history-driven judgement this model describes, rather than compete with it. That is two voices on each side (P81 and P134 against P05 and P136), so it is a contrast worth testing, not a pattern.</p>", "searchText": "care coordinators' mental model of alert ranking care-coordination alert-triage alert-fatigue workflow project-care-coordination overview evidence basis: mixed. observed (what coordinators said about ranking and patient history, from p81 in raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md:37 and raw/2026-07-07-interview-care-coordinator-override-reason-capture/session-notes.md:30-38 , p134 in raw/2026-08-04-interview-care-coordinator-complex-care-alert-volume/session-notes.md:30-37 , and the float-pool counterpoint from p05 in raw/2026-04-07-interview-care-coordinator-float-pool-system-familiarity/session-notes.md:33 and p136 in raw/2026-09-01-interview-care-coordinator-float-pool-coverage/session-notes.md:31,37 ); inferred (the model itself, built from the ranking disagreements and override gap in raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md:28-30,37 ; how coordinators think about ranking is the designer&#x27;s reading, not something participants were asked). covers how care coordinators conceptualize &quot;ranking&quot; in the alert-triage queue versus what they saw it do, drawn from the aug 2025 usability test&#x27;s override-disagreement pattern. model the designer&#x27;s paraphrase of the coordinator view: the system should defer to the coordinator&#x27;s sense of a patient&#x27;s history-driven risk — an experience-weighted judgment call. in 2025 this rested on one coordinator, p81: &quot;i wanted to tell it &#x27;no, this one&#x27;s more urgent because
