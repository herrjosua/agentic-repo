tive&#x27;s substance use, or a side comment about a partner. these end up in the signed note and have to be found and redacted before release, page by page, because they&#x27;re not in a predictable section. by their own informal estimate, they find something like this in &quot;maybe one in five or six&quot; scribe-drafted notes in a typical release, though they said that was a guess and depends heavily on the clinic. this is separate from part 2: most of what they redact here isn&#x27;t part 2 content, but some of it could be, which pushes the request into second-level review. [medium] (trust) asked about redaction assistance, they reaffirmed the july 2025 position: highlighting what might need redaction would help, especially for the incidental content above, but a person has to make the redaction and do the final release. they&#x27;d want to see why something was flagged. they were more skeptical than they expected to be about the tool missing things: &quot;it&#x27;s the stuff it doesn&#x27;t flag that i&#x27;d lose sleep over.&quot; representative quotes &quot;when somebody asks for the record, i send the signed note. but if there&#x27;s a draft sitting behind it that the scribe made, is that the record too? i genuinely don&#x27;t know, and i don&#x27;t think anybody&#x27;s told us.&quot; — him specialist (release of information), p124 &quot;the scribe writes down everything. mom&#x27;s diagnosis, the brother&#x27;s drinking, whatever came up while they were talking. now that&#x27;s in the chart, and i&#x27;m the one who has to catch it before it goes out the door.&quot; — him specialist (release of information), p124 recommendations ask legal/compliance to state whether scribe generation metadata (drafts, transcripts, provenance) is part of the designated record set or legal record, and give roi written guidance. add this to the still-pending ratification of the cmio&#x27;s august 2025 attestation model. share examples of incidental third-party and sensitive content captured by the scribe with the ambient scribe team, as input to what the drafting step leaves out of the note. if roi redaction assistance is scoped, keep it suggest-only with a human doing the redaction and final release, show why each item was flagged, and test specifically for missed incidental content, not only part 2 content. follow-ups / open questions how was the &quot;all versions and drafts&quot; attorney request resolved, and by whom? does the scribe retain a transcript or draft after the note is signed, and for how long? related synthesized into: him-coding-and-billing.md , governance-and-phi.md participants participants — interview — him specialist on releasing ai-drafted notes count: 1 roles: p124 — him specialist (release of information) (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2026-03-31). this participant is a different person from p69, the him specialist in the 2025-07-15 contextual inquiry, despite the same role label. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-06-23-interview-medical-coder-review-override-habits", "kind": "raw", "title": "Interview — Medical Coder on Review and Override Habits", "date": "2026-06-23", "type": "interview", "status": "raw", "tags": ["him", "coding", "trust-in-ai", "audit-trail", "workflow", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-06-23-interview-medical-coder-review-override-habits/session-notes.md", "corrections": [], "html": "<h1>Interview — Medical Coder on Review and Override Habits</h1>\n<h2>Objective</h2>\n<p>Understand how a production coder actually reviews and overrides prompts from the tools they already use, and what that suggests about how they would treat suggestions from the AI coding-suggestion concept if it were ever built. The question behind it is whether the human-final-decision model from July 2025 holds up under productivity quotas, or whether accept-by-default would set in on simple charts.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; 42 CFR Part 2 handling is still manual. The participant codes mostly outpatient encounters under a daily productivity quota and has coded from scribe-drafted notes since GA. They have not used the suggester; their expectations come from a walkthrough of the July 2025 screens during this session and from how they use the prompts and edits in their current coding tools.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(override habits)</em> On simple charts they already click through the prompts their current tools raise (edit warnings, &quot;are you sure&quot; checks) without reading most of them, because the quota is counted in charts per hour and the prompts are usually right or irrelevant. They expect they would do the same with a suggester: on a simple, single-diagnosis visit the suggested code would probably be accepted as shown unless something jumped out. They said this plainly and without much discomfort, and connected it to the quota, not to trust in the tool.</li><li><strong>[MEDIUM]</strong> <em>(complex charts)</em> On complex, multi-diagnosis charts they said they would ignore suggestions and code from the note as they do now, because checking someone else&#x27;s list takes longer than building their own. This matches what coders said in the July 2025 test about complex charts.</li><li><strong>[MEDIUM]</strong> <em>(citations)</em> They liked the idea of the source-text citation for each suggested code, but said they would open it only when a suggestion looks off: an unexpected code, an unusual specificity level or a code they wouldn&#x27;t have thought of. On a routine chart where the suggestion matches what they expected, they wouldn&#x27;t check it. They pointed out that this means the citation gets looked at least on exactly the charts where they&#x27;d be accepting by default.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Honestly? If it&#x27;s a simple visit and the code looks right, I&#x27;m clicking accept. I&#x27;ve got a number to hit by the end of the day. The quota wins. It always wins.&quot;</p><p>— Medical Coder, P125</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Don&#x27;t assume the human-final-decision model guarantees review. Design for accept-by-default on simple charts, and take that into account in the audit sampling the coding auditor proposed in April 2026 (higher sampling of codes accepted without edits).</li><li>Raise with HIM leadership whether productivity quotas would need adjusting for charts coded with AI assistance, so the quota doesn&#x27;t reward unreviewed acceptance.</li><li>Test whether surfacing the citation inline, rather than behind a click, changes how often coders read it on routine charts.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How are current quotas set, and do they differ for inpatient and outpatient coders?</li><li>Is there existing data on how often coders dismiss prompts in the current tools without changing anything?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Medical Coder on Review and Override Habits</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P125 — Medical Coder (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-29, 2026-03-10). The participant did not take part in the July 2025 usability test. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — medical coder on review and override habits him coding trust-in-ai audit-trail workflow project-him coding-suggestion-panel interview — medical coder on review and override habits objective understand how a production coder actually reviews and overrides prompts from the tools they already use, and what that suggests about how they would treat suggestions from the ai coding-suggestion concept if it were ever built. the question behind it is whether the human-final-decision model from july 2025 holds up under productivity quotas, or whether accept-by-default would set in on simple charts. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the ai coding-suggestion tool is still a concept from july 2025 and has not been built or piloted; 42 cfr part 2 handling is still manual. the participant codes mostly outpatient encounters under a daily productivity quota and has coded from scribe-drafted notes since ga. they have not used the suggester; their expectations come from a walkthrough of the july 2025 screens during this session and from how they use the prompts and edits in their current coding tools. key findings [high] (override habits) on simple charts they already click through the prompts their current tools raise (edit warnings, &quot;are you sure&quot; checks) without reading most of them, because the quota is counted in charts per hour and the prompts are usually right or irrelevant. they expect they would do the same with a suggester: on a simple, single-diagnosis visit the suggested code would probably be accepted as shown unless something jumped out. they said this plainly and without much discomfort, and connected it to the quota, not to trust in the tool. [medium] (complex charts) on complex, multi-diagnosis charts they said they would ignore suggestions and code from the note as they do now, because checking someone else&#x27;s list takes longer than building their own. this matches what coders said in the july 2025 test about complex charts. [medium] (citations) they liked the idea of the source-text citation for each suggested code, but said they would open it only when a suggestion looks off: an unexpected code, an unusual specificity level or a code they wouldn&#x27;t have thought of. on a routine chart where the suggestion matches what they expected, they wouldn&#x27;t check it. they pointed out that this means the citation gets looked at least on exactly the charts where they&#x27;d be accepting by default. representative quotes &quot;honestly? if it&#x27;s a simple visit and the code looks right, i&#x27;m clicking accept. i&#x27;ve got a number to hit by the end of the day. the quota wins. it always wins.&quot; — medical coder, p125 recommendations don&#x27;t assume the human-final-decision model guarantees review. design for accept-by-default on simple charts, and take that into account in the audit sampling the coding auditor proposed in april 2026 (higher sampling of codes accepted without edits). raise with him leadership whether productivity quotas would need adjusting for charts coded with ai assistance, so the quota doesn&#x27;t reward unreviewed acceptance. test whether surfacing the citation inline, rather than behind a click, changes how often coders read it on routine charts. follow-ups / open questions how are current quotas set, and do they differ for inpatient and outpatient coders? is there existing data on how often coders dismiss prompts in the current tools without changing anything? related synthesized into: him-coding-and-billing.md participants participants — interview — medical coder on review and override habits count: 1 roles: p125 — medical coder (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-29, 2026-03-10). the participant did not take part in the july 2025 usability test. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-07-14-interview-revenue-cycle-analyst-claim-denials", "kind": "raw", "title": "Interview — Revenue Cycle Analyst on Claim Denials and Coding", "date": "2026-07-14", "type": "interview", "status": "raw", "tags": ["him", "billing", "coding", "compliance", "audit-trail", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-07-14-interview-revenue-cycle-analyst-claim-denials/session-notes.md", "corrections": [], "html": "<h1>Interview — Revenue Cycle Analyst on Claim Denials and Coding</h1>\n<h2>Objective</h2>\n<p>Bring a revenue cycle view into the HIM research: understand where claim denials actually come from on the billing side, how coding contributes, and what a revenue cycle analyst would expect from the AI coding-suggestion concept (July 2025 prototype, not built or piloted) if it were ever built.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; 42 CFR Part 2 handling is still manual. The participant works claim denials and claim-edit review on the billing side and routes coding-related denials back to HIM. They had not seen the July 2025 screens before this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(claim denials)</em> In their experience, coding-related claim denials almost never come from the wrong code category. They come from specificity: an unspecified diagnosis where the coverage policy wants a specified one, a missing laterality or a diagnosis that doesn&#x27;t support the medical necessity of the procedure billed. By their own informal estimate &quot;most&quot; of the coding-related denials they work, &quot;probably two-thirds or more&quot;, are specificity problems, but they stressed they had no report in front of them. They said this is the same gap coders and CDI described, seen from the claim end, and that it hasn&#x27;t improved since the scribe went GA.</li><li><strong>[MEDIUM]</strong> <em>(audit)</em> When they review a claim edit or work a denial, they want to see whether a code was suggested by a tool and accepted, or entered by the coder. Today they can see who coded the encounter but nothing about how. If a suggester went live, they&#x27;d want that visible in claim-edit review so they can tell whether a pattern of denials is coming from the tool or from a particular coder, which supports the coding auditor&#x27;s per-code record from April 2026.</li><li><strong>[LOW]</strong> <em>(metrics)</em> Time saved per chart would matter much less to revenue cycle than the denial rate. A tool that made coding faster but held the denial rate flat wouldn&#x27;t be worth much to them, and one that pushed more charts to unspecified codes faster could make it worse. They&#x27;d want any pilot measured on denials and rework, not only coder throughput.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;It&#x27;s almost never the wrong family of codes. It&#x27;s that it&#x27;s unspecified, or it&#x27;s missing the side, or the diagnosis doesn&#x27;t hold up the procedure. That&#x27;s what bounces. The category&#x27;s fine.&quot;</p><p>— Revenue Cycle Analyst (Billing), P126</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>If the coding-suggestion concept is pursued, design and evaluate it against specificity, not only category match; the July 2025 test&#x27;s 14-of-20 match rate counted specificity mismatches as misses, which is the right bar for revenue cycle.</li><li>Include &quot;suggested and accepted&quot; vs. &quot;entered by coder&quot; in what claim-edit review can see, alongside the per-code audit record.</li><li>Define pilot success metrics with revenue cycle: coding-related denial rate and rework, with throughput as a secondary measure.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Pull a real breakdown of coding-related claim denials by reason to check the informal &quot;two-thirds or more&quot; estimate.</li><li>Has the coding-related denial rate moved since the scribe went GA in January 2026?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Revenue Cycle Analyst on Claim Denials and Coding</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P126 — Revenue Cycle Analyst (Billing) (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, who referred us to the billing team for a revenue cycle perspective on coding. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — revenue cycle analyst on claim denials and coding him billing coding compliance audit-trail project-him coding-suggestion-panel interview — revenue cycle analyst on claim denials and coding objective bring a revenue cycle view into the him research: understand where claim denials actually come from on the billing side, how coding contributes, and what a revenue cycle analyst would expect from the ai coding-suggestion concept (july 2025 prototype, not built or piloted) if it were ever built. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the ai coding-suggestion tool is still a concept from july 2025 and has not been built or piloted; 42 cfr part 2 handling is still manual. the participant works claim denials and claim-edit review on the billing side and routes coding-related denials back to him. they had not seen the july 2025 screens before this session. key findings [high] (claim denials) in their experience, coding-related claim denials almost never come from the wrong code category. they come from specificity: an unspecified diagnosis where the coverage policy wants a specified one, a missing laterality or a diagnosis that doesn&#x27;t support the medical necessity of the procedure billed. by their own informal estimate &quot;most&quot; of the coding-related denials they work, &quot;probably two-thirds or more&quot;, are specificity problems, but they stressed they had no report in front of them. they said this is the same gap coders and cdi described, seen from the claim end, and that it hasn&#x27;t improved since the scribe went ga. [medium] (audit) when they review a claim edit or work a denial, they want to see whether a code was suggested by a tool and accepted, or entered by the coder. today they can see who coded the encounter but nothing about how. if a suggester went live, they&#x27;d want that visible in claim-edit review so they can tell whether a pattern of denials is coming from the tool or from a particular coder, which supports the coding auditor&#x27;s per-code record from april 2026. [low] (metrics) time saved per chart would matter much less to revenue cycle than the denial rate. a tool that made coding faster but held the denial rate flat wouldn&#x27;t be worth much to them, and one that pushed more charts to unspecified codes faster could make it worse. they&#x27;d want any pilot measured on denials and rework, not only coder throughput. representative quotes &quot;it&#x27;s almost never the wrong family of codes. it&#x27;s that it&#x27;s unspecified, or it&#x27;s missing the side, or the diagnosis doesn&#x27;t hold up the procedure. that&#x27;s what bounces. the category&#x27;s fine.&quot; — revenue cycle analyst (billing), p126 recommendations if the coding-suggestion concept is pursued, design and evaluate it against specificity, not only category match; the july 2025 test&#x27;s 14-of-20 match rate counted specificity mismatches as misses, which is the right bar for revenue cycle. include &quot;suggested and accepted&quot; vs. &quot;entered by coder&quot; in what claim-edit review can see, alongside the per-code audit record. define pilot success metrics with revenue cycle: coding-related denial rate and rework, with throughput as a secondary measure. follow-ups / open questions pull a real breakdown of coding-related claim denials by reason to check the informal &quot;two-thirds or more&quot; estimate. has the coding-related denial rate moved since the scribe went ga in january 2026? related synthesized into: him-coding-and-billing.md participants participants — interview — revenue cycle analyst on claim denials and coding count: 1 roles: p126 — revenue cycle analyst (billing) (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, who referred us to the billing team for a revenue cycle perspective on coding. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-08-11-interview-him-supervisor-coding-team-oversight", "kind": "raw", "title": "Interview — HIM Supervisor on Coding Team Oversight", "date": "2026-08-11", "type": "interview", "status": "raw", "tags": ["him", "coding", "training", "workflow", "42-cfr-part-2", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-08-11-interview-him-supervisor-coding-team-oversight/session-notes.md", "corrections": [], "html": "<h1>Interview — HIM Supervisor on Coding Team Oversight</h1>\n<h2>Objective</h2>\n<p>Bring the view of someone who manages coders into the HIM research: how a supervisor sets productivity expectations, trains and monitors coders, and what they would expect to change if the AI coding-suggestion concept (July 2025 prototype, not built or piloted) were ever built. This follows the June 2026 coder interview, which recommended raising quotas with HIM leadership. The participant supervises a coding team. They have the same role label as P67 (July 2025 contextual inquiry) and P121 (March 2026 interview), but they are a different person from both and took part in neither session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; 42 CFR Part 2 handling is still manual. The participant supervises outpatient and inpatient coders, sets their daily productivity targets with HIM leadership, onboards new coders and reviews their early work. Their team has coded from scribe-drafted notes since GA. They had not seen the July 2025 screens before this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(productivity)</em> Their main worry about a coding suggester isn&#x27;t accuracy. It&#x27;s that leadership would raise coding targets as soon as it went live, on the assumption that AI saves time, before anyone has measured whether it does. They said targets went up once before when a new coding tool came in, and weren&#x27;t revisited when the expected gain didn&#x27;t show up on complex charts. They had heard the July 2025 &quot;2-3 minutes per simple chart&quot; estimate second-hand and were concerned it would be applied to every chart. If targets rose first, they expect coders to protect their numbers by accepting suggestions on simple charts, which is the habit the June 2026 coder described.</li><li><strong>[MEDIUM]</strong> <em>(training)</em> They said override behaviour would have to be trained and monitored as a skill, not left to habit. For new coders they would want to see, at least for the first months, how often each person accepts a suggestion unchanged versus edits or overrides it, and to review a sample of the unchanged ones. They saw this as a supervisor&#x27;s tool, not only an auditor&#x27;s, and said they can&#x27;t coach what they can&#x27;t see. Today they can only see finished codes, not how a coder got there.</li><li><strong>[MEDIUM]</strong> <em>(42 CFR Part 2)</em> Coders aren&#x27;t the Part 2 decision-makers, but they do see substance-use content in charts and need to know what not to copy into queries or notes to other teams. Part 2 training for coders still depends on memory and a printed sheet. It is a version of the sheet the ROI team uses, which the March 2026 supervisor described, adapted for coding, and nobody owns keeping it current. Nothing has changed since GA, though scribe-drafted notes capture more of that content.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The day this goes live, someone upstairs is going to bump the target, because &#x27;the AI does half of it now.&#x27; Nobody&#x27;s going to measure first. They never do.&quot;</p><p>— HIM Supervisor, P127</p></blockquote>\n<blockquote><p>&quot;I can teach someone to override a bad suggestion. What I can&#x27;t do is teach it once and assume it sticks. If I can&#x27;t see who&#x27;s accepting everything, I&#x27;m not supervising, I&#x27;m hoping.&quot;</p><p>— HIM Supervisor, P127</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>If the coding-suggestion concept is pursued, agree with HIM leadership in advance that productivity targets stay unchanged during any pilot. Revisit them only after measured time per chart, split by simple and complex charts, and alongside denial and rework rates.</li><li>Expose per-coder acceptance, edit and override rates to supervisors as well as coding auditors, to support training and coaching rather than only retrospective audit.</li><li>Add coding to the case for a structured 42 CFR Part 2 flag. Coders rely on the same memory and printed-sheet approach as ROI.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Which earlier tool rollout led to a target increase, and is there any before-and-after data on coder throughput from it?</li><li>Who owns the coding version of the Part 2 sheet, and when was it last updated?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — HIM Supervisor on Coding Team Oversight</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P127 — HIM Supervisor (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2026-03-31). This participant supervises a coding team and is a different person from P67 (2025-07-15) and P121 (2026-03-31), despite the same role label. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — him supervisor on coding team oversight him coding training workflow 42-cfr-part-2 project-him coding-suggestion-panel interview — him supervisor on coding team oversight objective bring the view of someone who manages coders into the him research: how a supervisor sets productivity expectations, trains and monitors coders, and what they would expect to change if the ai coding-suggestion concept (july 2025 prototype, not built or piloted) were ever built. this follows the june 2026 coder interview, which recommended raising quotas with him leadership. the participant supervises a coding team. they have the same role label as p67 (july 2025 contextual inquiry) and p121 (march 2026 interview), but they are a different person from both and took part in neither session. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the ai coding-suggestion tool is still a concept from july 2025 and has not been built or piloted; 42 cfr part 2 handling is still manual. the participant supervises outpatient and inpatient coders, sets their daily productivity targets with him leadership, onboards new coders and reviews their early work. their team has coded from scribe-drafted notes since ga. they had not seen the july 2025 screens before this session. key findings [high] (productivity) their main worry about a coding suggester isn&#x27;t accuracy. it&#x27;s that leadership would raise coding targets as soon as it went live, on the assumption that ai saves time, before anyone has measured whether it does. they said targets went up once before when a new coding tool came in, and weren&#x27;t revisited when the expected gain didn&#x27;t show up on complex charts. they had heard the july 2025 &quot;2-3 minutes per simple chart&quot; estimate second-hand and were concerned it would be applied to every chart. if targets rose first, they expect coders to protect their numbers by accepting suggestions on simple charts, which is the habit the june 2026 coder described. [medium] (training) they said override behaviour would have to be trained and monitored as a skill, not left to habit. for new coders they would want to see, at least for the first months, how often each person accepts a suggestion unchanged versus edits or overrides it, and to review a sample of the unchanged ones. they saw this as a supervisor&#x27;s tool, not only an auditor&#x27;s, and said they can&#x27;t coach what they can&#x27;t see. today they can only see finished codes, not how a coder got there. [medium] (42 cfr part 2) coders aren&#x27;t the part 2 decision-makers, but they do see substance-use content in charts and need to know what not to copy into queries or notes to other teams. part 2 training for coders still depends on memory and a printed sheet. it is a version of the sheet the roi team uses, which the march 2026 supervisor described, adapted for coding, and nobody owns keeping it current. nothing has changed since ga, though scribe-drafted notes capture more of that content. representative quotes &quot;the day this goes live, someone upstairs is going to bump the target, because &#x27;the ai does half of it now.&#x27; nobody&#x27;s going to measure first. they never do.&quot; — him supervisor, p127 &quot;i can teach someone to override a bad suggestion. what i can&#x27;t do is teach it once and assume it sticks. if i can&#x27;t see who&#x27;s accepting everything, i&#x27;m not supervising, i&#x27;m hoping.&quot; — him supervisor, p127 recommendations if the coding-suggestion concept is pursued, agree with him leadership in advance that productivity targets stay unchanged during any pilot. revisit them only after measured time per chart, split by simple and complex charts, and alongside denial and rework rates. expose per-coder acceptance, edit and override rates to supervisors as well as coding auditors, to support training and coaching rather than only retrospective audit. add coding to the case for a structured 42 cfr part 2 flag. coders rely on the same memory and printed-sheet approach as roi. follow-ups / open questions which earlier tool rollout led to a target increase, and is there any before-and-after data on coder throughput from it? who owns the coding version of the part 2 sheet, and when was it last updated? related synthesized into: him-coding-and-billing.md participants participants — interview — him supervisor on coding team oversight count: 1 roles: p127 — him supervisor (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2026-03-31). this participant supervises a coding team and is a different person from p67 (2025-07-15) and p121 (2026-03-31), despite the same role label. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-09-08-interview-him-specialist-roi-request-turnaround", "kind": "raw", "title": "Interview — HIM Specialist on ROI Request Turnaround", "date": "2026-09-08", "type": "interview", "status": "raw", "tags": ["him", "release-of-information", "phi", "workflow", "42-cfr-part-2", "project-him"], "related_components": ["roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-09-08-interview-him-specialist-roi-request-turnaround/session-notes.md", "corrections": [], "html": "<h1>Interview — HIM Specialist on ROI Request Turnaround</h1>\n<h2>Objective</h2>\n<p>Understand what drives release of information (ROI) turnaround from the point of view of a specialist working the queue, how it differs by who is asking, and whether the suggest-only position on redaction assistance from July 2025 still holds when a specialist thinks about volume. The participant is an HIM specialist doing ROI fulfillment. They have the same role label as P69 (July 2025 contextual inquiry) and P124 (June 2026 interview), but they are a different person from both and took part in neither session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted. No ROI redaction tool has been built or piloted either. 42 CFR Part 2 handling is still fully manual. The participant does intake and first-pass review and redaction on ROI requests, and passes anything that needs Part 2 handling to the second-level review the March 2026 supervisor described. They have released records containing scribe-drafted notes since GA.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(redaction)</em> They hold the suggest-only position: a person redacts and a person releases, with no auto-release. Within that, they would accept a tool that pre-highlighted possible redactions across a batch of requests at once, but only for low-risk request types. Their example was a patient asking for their own visit notes or test results, where nothing is going to a third party. Each record would still be opened, checked and released by a specialist. They would not want batch pre-highlighting on attorney or insurer requests, or anything that might involve Part 2, and said those should stay one at a time.</li><li><strong>[MEDIUM]</strong> <em>(turnaround)</em> Turnaround depends mostly on who is asking, not on how long the record is. By their own informal estimate, a patient request for their own recent records is usually out &quot;within a few days&quot;. Insurer requests take about a week, because they need checking against the authorization and are often for long date ranges. Attorney requests are the slowest, &quot;often two weeks or more&quot;, because of authorization checks, broad &quot;complete record&quot; scopes, and a higher chance of Part 2 content going to second-level review. These are their impressions, not counts. They fit the March 2026 supervisor&#x27;s point that the backlog sits with Part 2 review, and add that attorney requests feed that queue more than other types.</li><li><strong>[LOW]</strong> <em>(portal)</em> Since patients could download more of their own records through the patient portal, they&#x27;ve noticed fewer simple patient requests for recent visit notes and results coming to ROI, though they couldn&#x27;t say how many. What&#x27;s left of patient requests tends to be older records or things the portal doesn&#x27;t show. They didn&#x27;t think it had made a noticeable difference to the overall backlog, which is driven by third-party requests.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;For a patient asking for their own notes, sure, run the whole batch and highlight what I should look at. I&#x27;ll still open every one and I&#x27;ll still be the one who hits send. Attorney requests, no. Those I do one at a time.&quot;</p><p>— HIM Specialist (Release of Information), P128</p></blockquote>\n<blockquote><p>&quot;It&#x27;s not how thick the chart is, it&#x27;s who&#x27;s asking. A patient&#x27;s done in a few days. An insurer&#x27;s about a week. An attorney? Two weeks if I&#x27;m lucky, because there&#x27;s always something that has to go up for the second look.&quot;</p><p>— HIM Specialist (Release of Information), P128</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>If ROI redaction assistance is scoped, keep it suggest-only with a human releasing each record. Treat batch pre-highlighting for low-risk, patient-directed request types as a possible first scope, and exclude third-party and possible Part 2 requests from batch handling.</li><li>Report ROI turnaround by requester type (patient, insurer, attorney, other) rather than as one figure, so the effect of any change can be seen where the backlog actually is.</li><li>Check how much patient request volume the portal has absorbed before using overall request volume to size any tool.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Pull system-of-record turnaround by requester type to check the informal estimates. This adds to the still-open request for ROI volume and turnaround data from July 2025 and March 2026.</li><li>What share of attorney requests go to second-level Part 2 review compared with other requester types?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — HIM Specialist on ROI Request Turnaround</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P128 — HIM Specialist (Release of Information) (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2026-03-31, 2026-06-02). This participant is a different person from P69 (2025-07-15) and P124 (2026-06-02), despite the same role label. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — him specialist on roi request turnaround him release-of-information phi workflow 42-cfr-part-2 project-him roi-redaction-tool interview — him specialist on roi request turnaround objective understand what drives release of information (roi) turnaround from the point of view of a specialist working the que owest, &quot;often two weeks or more&quot;, because of authorization checks, broad &quot;complete record&quot; scopes, and a higher chance of part 2 content going to second-level review. these are their impressions, not counts. they fit the march 2026 supervisor&#x27;s point that the backlog sits with part 2 review, and add that attorney requests feed that queue more than other types. [low] (portal) since patients could download more of their own records through the patient portal, they&#x27;ve noticed fewer simple patient requests for recent visit notes and results coming to roi, though they couldn&#x27;t say how many. what&#x27;s left of patient requests tends to be older records or things the portal doesn&#x27;t show. they didn&#x27;t think it had made a noticeable difference to the overall backlog, which is driven by third-party requests. representative quotes &quot;for a patient asking for their own notes, sure, run the whole batch and highlight what i should look at. i&#x27;ll still open every one and i&#x27;ll still be the one who hits send. attorney requests, no. those i do one at a time.&quot; — him specialist (release of information), p128 &quot;it&#x27;s not how thick the chart is, it&#x27;s who&#x27;s asking. a patient&#x27;s done in a few days. an insurer&#x27;s about a week. an attorney? two weeks if i&#x27;m lucky, because there&#x27;s always something that has to go up for the second look.&quot; — him specialist (release of information), p128 recommendations if roi redaction assistance is scoped, keep it suggest-only with a human releasing each record. treat batch pre-highlighting for low-risk, patient-directed request types as a possible first scope, and exclude third-party and possible part 2 requests from batch handling. report roi turnaround by requester type (patient, insurer, attorney, other) rather than as one figure, so the effect of any change can be seen where the backlog actually is. check how much patient request volume the portal has absorbed before using overall request volume to size any tool. follow-ups / open questions pull system-of-record turnaround by requester type to check the informal estimates. this adds to the still-open request for roi volume and turnaround data from july 2025 and march 2026. what share of attorney requests go to second-level part 2 review compared with other requester types? related synthesized into: him-coding-and-billing.md , scope-boundaries-and-workflow-fit.md participants participants — interview — him specialist on roi request turnaround count: 1 roles: p128 — him specialist (release of information) (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2026-03-31, 2026-06-02). this participant is a different person from p69 (2025-07-15) and p124 (2026-06-02), despite the same role label. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-10-06-interview-senior-medical-coder-ai-suggestions-concept", "kind": "raw", "title": "Interview — Senior Medical Coder on AI Coding Suggestions", "date": "2026-10-06", "type": "interview", "status": "raw", "tags": ["him", "coding", "trust-in-ai", "audit-trail", "ai-generated-content", "project-him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-10-06-interview-senior-medical-coder-ai-suggestions-concept/session-notes.md", "corrections": [], "html": "<h1>Interview — Senior Medical Coder on AI Coding Suggestions</h1>\n<h2>Objective</h2>\n<p>Get a senior coder&#x27;s first reaction to the AI coding-suggestion concept (July 2025 prototype, not built or piloted), seen with fresh eyes, now that coders have been coding from scribe-drafted notes for most of 2026. The question was what would have to be true before a senior coder would use it at all. The participant is a different person from P71, the senior coder in the July 2025 usability test, and from P120 (March 2026 interview). They did not take part in the July 2025 session or any earlier session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The AI coding-suggestion tool is still a concept from July 2025 and has not been built or piloted; 42 CFR Part 2 handling is still manual. The participant is a senior coder who handles complex inpatient and outpatient encounters, answers other coders&#x27; questions and has supported responses to external audits. They have coded from scribe-drafted notes since GA. They had not seen the July 2025 screens before; they reacted to a walkthrough of them during this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(audit posture)</em> Before anything else, they wanted it to be clear that the coder makes every coding decision and the tool only suggests. They would want a visible, per-code record of what was suggested and what the coder did with it (accepted, edited or overridden), which they could see themselves while coding, not only something auditors could pull later. They called this the precondition for using the tool at all, not a feature to add later. It matches what the July 2025 senior coder and the April 2026 coding auditor asked for, reached independently.</li><li><strong>[MEDIUM]</strong> <em>(citations)</em> A source citation for every suggested code was non-negotiable for them: the sentence or sentences in the note that support the code, including the specificity. A code without a citation is one they would not accept, however likely it looked. Because so much of the documentation is now scribe-drafted, they said the citation is also how they&#x27;d check that the note actually supports the code and that the suggester isn&#x27;t just echoing a sentence the physician didn&#x27;t catch at sign-off.</li><li><strong>[MEDIUM]</strong> <em>(speed)</em> Told about the July 2025 estimate of 2-3 minutes saved per simple chart, they said a saving like that matters only if checking a suggestion stays quicker than coding the chart themselves. If they have to open every citation, compare it with the note and then record why they changed a code, they expect the saving to &quot;mostly disappear&quot; on anything but the simplest visits. They saw this as an informal guess, not something they&#x27;d measured.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The tool can suggest whatever it wants. I&#x27;m the one who codes. If the screen doesn&#x27;t show that, code by code, I&#x27;m not touching it.&quot;</p><p>— Medical Coder (senior), P129</p></blockquote>\n<blockquote><p>&quot;No citation, no code. I don&#x27;t care how confident it looks. Show me where in the note it&#x27;s coming from, because half the time now nobody typed that note.&quot;</p><p>— Medical Coder (senior), P129</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Keep the per-code suggested / accepted / edited / overridden record as a release-blocking requirement, and make it visible to the coder in the coding view as well as to auditors and supervisors.</li><li>Require a source-text citation, down to the specificity level, for every suggested code. Don&#x27;t show a suggestion that has no citation. This is consistent with the transparency pattern from prior-auth research.</li><li>In any pilot, measure the time to review a suggestion, citation check included, not only the end-to-end time per chart, so the 2-3 minute estimate is checked against how coders actually review.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How long does a citation check take in practice? This could be timed in a future test of the concept screens.</li><li>Would senior coders accept a lighter review path for simple charts if sampling caught problems, or is per-code review a hard line?</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/prior-authorization.md\">prior-authorization.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Senior Medical Coder on AI Coding Suggestions</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P129 — Medical Coder (senior) (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, who referred us to a senior coder who had not seen the coding-suggestion concept before. This participant is new to the research: a different person from P71, the senior coder in the 2025-07-29 usability test, and from P120 (2026-03-10). They did not take part in the July 2025 session. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — senior medical coder on ai coding suggestions him coding trust-in-ai audit-trail ai-generated-content project-him coding-suggestion-panel interview — senior medical coder on ai coding suggestions objective get a senior coder&#x27;s first reaction to the ai coding-suggestion concept (july 2025 prototype, not built or piloted), seen with fresh eyes, now that coders have been coding from scribe-drafted notes for most of 2026. the question was what would have to be true before a senior coder would use it at all. the participant is a different person from p71, the senior coder in the july 2025 usability test, and from p120 (march 2026 interview). they did not take part in the july 2025 session or any earlier session. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the ai coding-suggestion tool is still a concept from july 2025 and has not been built or piloted; 42 cfr part 2 handling is still manual. the participant is a senior coder who handles complex inpatient and outpatient encounters, answers other coders&#x27; questions and has supported responses to external audits. they have coded from scribe-drafted notes since ga. they had not seen the july 2025 screens before; they reacted to a walkthrough of them during this session. key findings [high] (audit posture) before anything else, they wanted it to be clear that the coder makes every coding decision and the tool only suggests. they would want a visible, per-code record of what was suggested and what the coder did with it (accepted, edited or overridden), which they could see themselves while coding, not only something auditors could pull later. they called this the precondition for using the tool at all, not a feature to add later. it matches what the july 2025 senior coder and the april 2026 coding auditor asked for, reached independently. [medium] (citations) a source citation for every suggested code was non-negotiable for them: the sentence or sentences in the note that support the code, including the specificity. a code without a citation is one they would not accept, however likely it looked. because so much of the documentation is now scribe-drafted, they said the citation is also how they&#x27;d check that the note actually supports the code and that the suggester isn&#x27;t just echoing a sentence the physician didn&#x27;t catch at sign-off. [medium] (speed) told about the july 2025 estimate of 2-3 minutes saved per simple chart, they said a saving like that matters only if checking a suggestion stays quicker than coding the chart themselves. if they have to open every citation, compare it with the note and then record why they changed a code, they expect the saving to &quot;mostly disappear&quot; on anything but the simplest visits. they saw this as an informal guess, not something they&#x27;d measured. representative quotes &quot;the tool can suggest whatever it wants. i&#x27;m the one who codes. if the screen doesn&#x27;t show that, code by code, i&#x27;m not touching it.&quot; — medical coder (senior), p129 &quot;no citation, no code. i don&#x27;t care how confident it looks. show me where in the note it&#x27;s coming from, because half the time now nobody typed that note.&quot; — medical coder (senior), p129 recommendations keep the per-code suggested / accepted / edited / overridden record as a release-blocking requirement, and make it visible to the coder in the coding view as well as to auditors and supervisors. require a source-text citation, down to the specificity level, for every suggested code. don&#x27;t show a suggestion that has no citation. this is consistent with the transparency pattern from prior-auth research. in any pilot, measure the time to review a suggestion, citation check included, not only the end-to-end time per chart, so the 2-3 minute estimate is checked against how coders actually review. follow-ups / open questions how long does a citation check take in practice? this could be timed in a future test of the concept screens. would senior coders accept a lighter review path for simple charts if sampling caught problems, or is per-code review a hard line? related synthesized into: him-coding-and-billing.md , prior-authorization.md participants participants — interview — senior medical coder on ai coding suggestions count: 1 roles: p129 — medical coder (senior) (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, who referred us to a senior coder who had not seen the coding-suggestion concept before. this participant is new to the research: a different person from p71, the senior coder in the 2025-07-29 usability test, and from p120 (2026-03-10). they did not take part in the july 2025 session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "finding:accessibility-cross-cutting", "kind": "finding", "title": "Accessibility (Cross-Cutting)", "date": "2025-11-18", "type": "synthesis", "status": "synthesized", "tags": ["accessibility", "components", "design-system", "extjs", "legacy", "low-vision", "mobile", "motor-impairment", "section-508", "wcag", "project-cross-cutting"], "related_components": ["admin-console-grid", "alert-triage-queue", "design-system-form-field", "design-system-modal", "mobile-app-alert-list"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/accessibility-cross-cutting.md", "corrections": [], "html": "<h1>Accessibility (Cross-Cutting)</h1>\n<h2>Overview</h2>\n<p>Three independent WCAG 2.1 AA audits across the year — the legacy ExtJS admin console (Mar 2025), the new design system component library (Jul 2025), and the mobile clinician app (Nov 2025) — turned up one recurring pattern worth calling out on its own, separate from each audit&#x27;s other findings.</p>\n<ul><li><strong>The same color-only status indicator (red/yellow/green dots, no text/pattern alternative) appears in all three surfaces audited this year.</strong> This was flagged as a likely single shared root component rather than three separate bugs, and the CIO cited it at the December executive retro as the example of what a &quot;cross-cutting findings&quot; reporting category should look like going forward (see [governance-and-phi.md](governance-and-phi.md)).</li><li><strong>Progress is visible surface-by-surface even though the pattern repeats</strong>: the modal keyboard-trap issue found in the legacy console (Mar) was already fixed by the time the new design system&#x27;s modal component was audited (Jul), though that same audit surfaced a <em>new</em> issue (form-field error association) not present in the legacy system.</li><li><strong>The mobile app audit (Nov) connects directly to a live Compass AI feature</strong>: undersized touch targets (32×32px vs. the 44×44px minimum) were found specifically on the alert-triage icon set, which is the same feature usability-tested in August — see [care-coordination-triage.md](care-coordination-triage.md). This is a case where an accessibility defect and a usability finding land on the exact same component from two different research methods.</li></ul>\n<p>Recommendation: treat the color-only status pattern as a single design-system-level fix rather than three surface-level tickets, and confirm whether a shared component is in fact the common root cause.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-03-10</strong> — <a href=\"../raw/2025-03-10-accessibility-audit-legacy-extjs-admin-console/session-notes.md\">Accessibility Audit — Legacy Admin Console (ExtJS)</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2025-07-01</strong> — <a href=\"../raw/2025-07-01-accessibility-audit-new-design-system-components/session-notes.md\">Accessibility Audit — New Design System Component Library</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2025-11-18</strong> — <a href=\"../raw/2025-11-18-accessibility-audit-mobile-clinician-app/session-notes.md\">Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</a> <em>(<code>accessibility-audit</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>(none currently linked)</li></ul>", "searchText": "accessibility (cross-cutting) accessibility components design-system extjs legacy low-vision mobile motor-impairment section-508 wcag project-cross-cutting admin-console-grid alert-triage-queue design-system-form-field design-system-modal mobile-app-alert-list accessibility (cross-cutting) overview three independent
