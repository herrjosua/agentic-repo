<style>
  :root {
    --bg: #F7F8F9;
    --surface: #FFFFFF;
    --text-primary: #1C1F23;
    --text-secondary: #454B52;
    --border: #C7CCD1;
    --border-subtle: #EDEFF1;
    --accent: #1F52B3;
    --accent-hover: #173F8A;
    --accent-tint: #EBF3FE;
    --kind-raw: #1F52B3;
    --kind-finding: #146B64;
    --kind-component: #9A5E0D;
    --kind-analytics: #6B4FA0;
    --kind-deliverable: #2F7D4F;
    --sev-critical: #C33A2E;
    --sev-high: #C77B12;
    --sev-medium: #2B6CE0;
    --sev-low: #767E87;
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text-primary);
    font-family: var(--serif); font-size: 16px; line-height: 1.55;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  header {
    padding: 28px 32px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 {
    margin: 0 0 4px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em;
  }
  header p.tagline {
    margin: 0; color: var(--text-secondary); font-size: 14px; font-family: var(--mono);
  }

  .search-bar { padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .search-bar input[type="search"] {
    width: 100%; max-width: 640px; padding: 10px 14px; font-size: 15px;
    font-family: var(--serif); border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text-primary);
  }
  .search-bar input[type="search"]::placeholder { color: var(--text-secondary); }

  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 130px); }

  aside {
    padding: 24px; border-right: 1px solid var(--border); background: var(--surface);
  }
  aside h2 {
    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--text-secondary); margin: 20px 0 8px;
  }
  aside h2:first-child { margin-top: 0; }
  .filter-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 0;
    font-family: var(--mono); font-size: 13px; cursor: pointer;
  }
  .filter-row input[type="checkbox"] { accent-color: var(--accent); }
  .filter-row .count { color: var(--text-secondary); margin-left: auto; }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-chip {
    font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary);
    cursor: pointer; line-height: 1.4;
  }
  .tag-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  #reset-filters {
    margin-top: 20px; font-family: var(--mono); font-size: 12px; color: var(--accent);
    background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline;
  }

  main { padding: 24px 32px; }
  .result-count { font-family: var(--mono); font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }

  ul.results { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border-subtle); }
  .result-row {
    border-bottom: 1px solid var(--border-subtle); padding: 14px 4px; cursor: pointer;
    display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: start;
  }
  .result-row:hover { background: var(--accent-tint); }
  .result-meta { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); padding-top: 2px; }
  .result-meta .kind-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    vertical-align: middle; position: relative; top: -1px;
  }
  .sev-dots { margin-top: 6px; display: flex; gap: 4px; }
  .sev-dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
  .result-title { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
  .result-tags { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }
  .result-tags .type-label { color: var(--text-primary); font-weight: 600; margin-right: 8px; }

  .result-detail {
    grid-column: 1 / -1; padding: 16px 0 4px 0; max-width: 720px;
    overflow: hidden; max-height: 0; transition: max-height 0.25s ease;
  }
  .result-detail.open { max-height: 4000px; }
  .result-detail-inner { padding-top: 8px; border-top: 1px dashed var(--border); }
  .result-detail h1 { font-size: 20px; }
  .result-detail h2 { font-size: 16px; margin-top: 20px; }
  .result-detail blockquote {
    margin: 12px 0; padding: 4px 16px; border-left: 3px solid var(--border); color: var(--text-secondary);
  }
  .result-detail table { border-collapse: collapse; font-size: 14px; margin: 12px 0; }
  .result-detail th, .result-detail td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .result-detail code { font-family: var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  .source-link { display: inline-block; margin-top: 12px; font-family: var(--mono); font-size: 12px; }

  .empty-state { padding: 40px 4px; color: var(--text-secondary); max-width: 520px; }
  .empty-state h3 { font-family: var(--serif); font-size: 18px; color: var(--text-primary); margin-bottom: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .result-detail { transition: none; }
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); }
    .result-row { grid-template-columns: 1fr; }
    .result-meta { display: flex; gap: 10px; }
  }
</style>

<script id="research-data" type="application/json">[{"id": "raw:2025-04-22-contextual-inquiry-ed-intake-shadowing", "kind": "raw", "title": "Contextual Inquiry — Emergency Department Intake Shadowing", "date": "2025-04-22", "type": "contextual-inquiry", "status": "raw", "tags": ["ed", "intake", "workflow", "high-acuity", "baseline"], "related_components": ["ed-intake-form"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-04-22-contextual-inquiry-ed-intake-shadowing/session-notes.md", "html": "<h1>Contextual Inquiry — Emergency Department Intake Shadowing</h1>\n<h2>Objective</h2>\n<p>Observe real-time intake workflow under peak load to assess where, if anywhere, an AI tool could realistically fit without adding cognitive burden during high-acuity moments.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> In-person shadowing during peak hours (4-7pm), 2 sessions</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(interruption tolerance)</em> Intake staff are interrupted every 2-4 minutes on average during peak hours (paged, walked up to, or called over); any AI tool requiring sustained attention to review/correct output is unlikely to be used in this specific role during peak windows.</li><li><strong>[MEDIUM]</strong> <em>(triage priority)</em> Registration/demographic data entry is frequently completed after the clinical triage, not before, contradicting the originally assumed &#x27;intake happens first&#x27; workflow model.</li><li><strong>[MEDIUM]</strong> <em>(paper backup)</em> Staff keep a physical paper triage sheet as backup &#x27;in case the system is slow,&#x27; which happens often enough (self-reported several times a shift) that any AI feature needs to survive or gracefully degrade during system slowness.</li><li><strong>[LOW]</strong> <em>(positive signal)</em> Registration clerk expressed interest in AI that could pre-fill demographic fields from insurance card photo capture, since that specific task is high-volume and low-judgment.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;You can build the smartest tool in the world, but if I have three people yelling for me at once, I am not sitting there reviewing an AI&#x27;s homework.&quot;</p><p>— ED Intake Nurse, P21</p></blockquote>\n<blockquote><p>&quot;Just let me snap a photo of the insurance card and stop making me type the same sixteen fields for the hundredth time tonight.&quot;</p><p>— ED Registration Clerk, P23</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Deprioritize any AI feature aimed at ED intake nurses specifically during peak hours; if pursued, target low-attention, high-volume tasks like the clerk&#x27;s insurance-card idea instead.</li><li>Any AI feature in this environment must have a clearly tested degraded/offline mode given frequent system slowness.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Talk to IT about actual system slowness frequency/root cause — is it a known, trackable issue?</li><li>Explore insurance-card OCR pre-fill as a smaller, separate low-risk pilot candidate.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Emergency Department Intake Shadowing</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>ED Intake Nurse</li><li>ED Registration Clerk</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "contextual inquiry — emergency department intake shadowing ed intake workflow high-acuity baseline ed-intake-form contextual inquiry — emergency department intake shadowing objective observe real-time intake workflow under peak load to assess where, if anywhere, an ai tool could realistically fit without adding cognitive burden during high-acuity moments. method method: in-person shadowing during peak hours (4-7pm), 2 sessions researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (interruption tolerance) intake staff are interrupted every 2-4 minutes on average during peak hours (paged, walked up to, or called over); any ai tool requiring sustained attention to review/correct output is unlikely to be used in this specific role during peak windows. [medium] (triage priority) registration/demographic data entry is frequently completed after the clinical triage, not before, contradicting the originally assumed &#x27;intake happens first&#x27; workflow model. [medium] (paper backup) staff keep a physical paper triage sheet as backup &#x27;in case the system is slow,&#x27; which happens often enough (self-reported several times a shift) that any ai feature needs to survive or gracefully degrade during system slowness. [low] (positive signal) registration clerk expressed interest in ai that could pre-fill demographic fields from insurance card photo capture, since that specific task is high-volume and low-judgment. representative quotes &quot;you can build the smartest tool in the world, but if i have three people yelling for me at once, i am not sitting there reviewing an ai&#x27;s homework.&quot; — ed intake nurse, p21 &quot;just let me snap a photo of the insurance card and stop making me type the same sixteen fields for the hundredth time tonight.&quot; — ed registration clerk, p23 recommendations deprioritize any ai feature aimed at ed intake nurses specifically during peak hours; if pursued, target low-attention, high-volume tasks like the clerk&#x27;s insurance-card idea instead. any ai feature in this environment must have a clearly tested degraded/offline mode given frequent system slowness. follow-ups / open questions talk to it about actual system slowness frequency/root cause — is it a known, trackable issue? explore insurance-card ocr pre-fill as a smaller, separate low-risk pilot candidate. related synthesized into: scope-boundaries-and-workflow-fit.md participants participants — contextual inquiry — emergency department intake shadowing count: 2 roles: ed intake nurse ed registration clerk researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-05-06-usability-test-clinician-dashboard-redesign-v1", "kind": "raw", "title": "Usability Test — Clinician Dashboard Redesign (v1)", "date": "2025-05-06", "type": "usability-test", "status": "raw", "tags": ["dashboard", "usability", "clinician-experience", "information-architecture"], "related_components": ["clinician-dashboard", "care-gap-badge"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-05-06-usability-test-clinician-dashboard-redesign-v1/session-notes.md", "html": "<h1>Usability Test — Clinician Dashboard Redesign (v1)</h1>\n<h2>Objective</h2>\n<p>Test a redesigned clinician home dashboard that surfaces AI-flagged items (abnormal results, care gaps) alongside the standard patient list, to see if the new information hierarchy helps or adds noise.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, task-based, 50 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(alert fatigue)</em> 5 of 6 participants said the new AI-flagged &#x27;care gap&#x27; badges would likely become background noise within a week if the flagging threshold isn&#x27;t tuned, since 2 of the 3 example flags shown were judged clinically low-value.</li><li><strong>[MEDIUM]</strong> <em>(information architecture)</em> Participants generally liked having flags inline with the patient list rather than in a separate panel, but wanted a way to dismiss/snooze a flag per patient.</li><li><strong>[MEDIUM]</strong> <em>(trust)</em> Participants wanted to know the flag&#x27;s underlying logic (&#x27;why is this flagged?&#x27;) available on hover/click, not just the flag itself.</li><li><strong>[MEDIUM]</strong> <em>(visual design)</em> Badge color scheme was confused with existing acuity color-coding already used elsewhere in the EHR, creating a risk of misreading a documentation-quality flag as a clinical-acuity flag.</li><li><strong>[LOW]</strong> <em>(positive signal)</em> Participants responded well to the reduced number of clicks to get from dashboard to chart (2 clicks vs. 4 in the current system).</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;If two out of three of these flags are junk, I&#x27;m going to start ignoring all of them, including the one that actually matters. That&#x27;s worse than no flag at all.&quot;</p><p>— Physician, P27</p></blockquote>\n<blockquote><p>&quot;Don&#x27;t reuse red/yellow/green for this. That already means something else to me on this exact screen.&quot;</p><p>— Nurse Practitioner, P29</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Do not ship the care-gap flagging feature until precision is meaningfully improved and validated against clinical review, given the explicit alert-fatigue risk raised.</li><li>Change the flag badge visual system to something clearly distinct from the existing acuity color convention.</li><li>Add a &#x27;why flagged&#x27; explanation and per-flag dismiss/snooze control before next round of testing.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Get current false-positive rate on the care-gap model from Data Science before scheduling v2 testing.</li><li>Coordinate with design system team on a non-conflicting badge treatment.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Clinician Dashboard Redesign (v1)</h1>\n<p><strong>Count:</strong> 6</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician</li><li>Physician</li><li>Nurse Practitioner</li><li>Physician Assistant</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — clinician dashboard redesign (v1) dashboard usability clinician-experience information-architecture clinician-dashboard care-gap-badge usability test — clinician dashboard redesign (v1) objective test a redesigned clinician home dashboard that surfaces ai-flagged items (abnormal results, care gaps) alongside the standard patient list, to see if the new information hierarchy helps or adds noise. method method: moderated usability test, task-based, 50 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (alert fatigue) 5 of 6 participants said the new ai-flagged &#x27;care gap&#x27; badges would likely become background noise within a week if the flagging threshold isn&#x27;t tuned, since 2 of the 3 example flags shown were judged clinically low-value. [medium] (information architecture) participants generally liked having flags inline with the patient list rather than in a separate panel, but wanted a way to dismiss/snooze a flag per patient. [medium] (trust) participants wanted to know the flag&#x27;s underlying logic (&#x27;why is this flagged?&#x27;) available on hover/click, not just the flag itself. [medium] (visual design) badge color scheme was confused with existing acuity color-coding already used elsewhere in the ehr, creating a risk of misreading a documentation-quality flag as a clinical-acuity flag. [low] (positive signal) participants responded well to the reduced number of clicks to get from dashboard to chart (2 clicks vs. 4 in the current system). representative quotes &quot;if two out of three of these flags are junk, i&#x27;m going to start ignoring all of them, including the one that actually matters. that&#x27;s worse than no flag at all.&quot; — physician, p27 &quot;don&#x27;t reuse red/yellow/green for this. that already means something else to me on this exact screen.&quot; — nurse practitioner, p29 recommendations do not ship the care-gap flagging feature until precision is meaningfully improved and validated against clinical review, given the explicit alert-fatigue risk raised. change the flag badge visual system to something clearly distinct from the existing acuity color convention. add a &#x27;why flagged&#x27; explanation and per-flag dismiss/snooze control before next round of testing. follow-ups / open questions get current false-positive rate on the care-gap model from data science before scheduling v2 testing. coordinate with design system team on a non-conflicting badge treatment. related synthesized into: clinician-experience-documentation-burden.md participants participants — usability test — clinician dashboard redesign (v1) count: 6 roles: physician physician nurse practitioner physician assistant researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-05-20-interview-it-security-sso-mfa-modernization", "kind": "raw", "title": "Interview — IT Security on SSO/MFA Modernization Impact", "date": "2025-05-20", "type": "interview", "status": "raw", "tags": ["security", "sso", "mfa", "authentication", "clinician-workflow"], "related_components": ["sso-mfa-login", "ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-05-20-interview-it-security-sso-mfa-modernization/session-notes.md", "html": "<h1>Interview — IT Security on SSO/MFA Modernization Impact</h1>\n<h2>Objective</h2>\n<p>Understand planned SSO/MFA changes and their anticipated impact on clinical workflow before any AI feature is layered on top of authentication-dependent sessions.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 40 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(session timeout)</em> Planned MFA rollout would introduce a shared-workstation re-authentication requirement every 15 minutes, down from the current 4 hours — flagged internally as likely to cause clinician pushback based on prior rollout feedback, independent of any AI feature.</li><li><strong>[MEDIUM]</strong> <em>(badge-tap workflow)</em> Most units already use badge-tap proximity login for shared workstations; new MFA plan hasn&#x27;t yet been confirmed to work with the existing badge-tap hardware.</li><li><strong>[MEDIUM]</strong> <em>(AI session risk)</em> If an AI ambient scribe session is mid-recording when a forced re-auth occurs, current design has no defined behavior — could lose the in-progress draft.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Security wants 15 minutes, clinical ops wants 4 hours, and nobody&#x27;s told me yet who wins that argument, but I have to build for one of them.&quot;</p><p>— IT Security Engineer, P31</p></blockquote>\n<blockquote><p>&quot;Nobody&#x27;s asked what happens to an active AI recording session if the screen locks mid-visit. That&#x27;s going to be a real incident the first time it happens.&quot;</p><p>— IT Security Engineer, P31</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Flag the ambient-scribe-mid-recording + forced-reauth interaction to the ambient scribe engineering team immediately as an unhandled edge case.</li><li>Push for a joint decision meeting between Security and Clinical Ops on the session timeout conflict before MFA rollout, independent of Compass AI.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm badge-tap hardware compatibility with new MFA plan.</li><li>Get the ambient scribe team&#x27;s answer on session-loss behavior into a future usability test script.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — IT Security on SSO/MFA Modernization Impact</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>IT Security Engineer</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "interview — it security on sso/mfa modernization impact security sso mfa authentication clinician-workflow sso-mfa-login ambient-scribe-widget interview — it security on sso/mfa modernization impact objective understand planned sso/mfa changes and their anticipated impact on clinical workflow before any ai feature is layered on top of authentication-dependent sessions. method method: 1:1 interview, 40 min researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (session timeout) planned mfa rollout would introduce a shared-workstation re-authentication requirement every 15 minutes, down from the current 4 hours — flagged internally as likely to cause clinician pushback based on prior rollout feedback, independent of any ai feature. [medium] (badge-tap workflow) most units already use badge-tap proximity login for shared workstations; new mfa plan hasn&#x27;t yet been confirmed to work with the existing badge-tap hardware. [medium] (ai session risk) if an ai ambient scribe session is mid-recording when a forced re-auth occurs, current design has no defined behavior — could lose the in-progress draft. representative quotes &quot;security wants 15 minutes, clinical ops wants 4 hours, and nobody&#x27;s told me yet who wins that argument, but i have to build for one of them.&quot; — it security engineer, p31 &quot;nobody&#x27;s asked what happens to an active ai recording session if the screen locks mid-visit. that&#x27;s going to be a real incident the first time it happens.&quot; — it security engineer, p31 recommendations flag the ambient-scribe-mid-recording + forced-reauth interaction to the ambient scribe engineering team immediately as an unhandled edge case. push for a joint decision meeting between security and clinical ops on the session timeout conflict before mfa rollout, independent of compass ai. follow-ups / open questions confirm badge-tap hardware compatibility with new mfa plan. get the ambient scribe team&#x27;s answer on session-loss behavior into a future usability test script. related synthesized into: scope-boundaries-and-workflow-fit.md participants participants — interview — it security on sso/mfa modernization impact count: 1 roles: it security engineer researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-06-03-survey-patient-portal-ai-chatbot-trust", "kind": "raw", "title": "Survey — Patient Trust in AI Chatbot for Scheduling", "date": "2025-06-03", "type": "survey", "status": "raw", "tags": ["survey", "patient-experience", "chatbot", "trust", "scheduling"], "related_components": ["patient-chatbot-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-06-03-survey-patient-portal-ai-chatbot-trust/session-notes.md", "html": "<h1>Survey — Patient Trust in AI Chatbot for Scheduling</h1>\n<h2>Objective</h2>\n<p>Gauge patient comfort with an AI chatbot handling appointment scheduling and basic pre-visit questions, ahead of building a prototype.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Online survey via patient portal, 9 questions, incentivized ($10 gift card)</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(trust threshold)</em> 67% of respondents were comfortable with an AI chatbot for scheduling/rescheduling specifically, but comfort dropped to 22% when the question extended to &#x27;answering questions about my symptoms.&#x27;</li><li><strong>[MEDIUM]</strong> <em>(transparency ask)</em> Open-ended responses frequently (41% of those who answered) asked for a clear, easy way to reach &#x27;a real person&#x27; if the bot couldn&#x27;t help — treated as a trust prerequisite, not a nice-to-have.</li><li><strong>[LOW]</strong> <em>(age variance)</em> Comfort with the chatbot skewed higher among respondents who self-reported as under 45, consistent with general digital-trust patterns, not a novel finding but worth noting for pilot recruitment.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Booking an appointment, sure, a robot&#x27;s fine. Asking it if my chest pain is serious? Absolutely not.&quot;</p><p>— Patient portal user, P44 (survey open-ended)</p></blockquote>\n<blockquote><p>&quot;As long as I can type &#x27;human please&#x27; and get one, I don&#x27;t mind trying the bot first.&quot;</p><p>— Patient portal user, P58 (survey open-ended)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Scope the chatbot&#x27;s initial functionality strictly to scheduling/logistics; explicitly exclude symptom-related Q&amp;A from v1 given the sharp trust drop-off.</li><li>Design a highly visible, low-friction &#x27;talk to a person&#x27; escape hatch as a core requirement, not an afterthought.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Usability test the escape-hatch design specifically once a prototype exists.</li><li>Consider a targeted follow-up with the 45+ demographic to understand specific hesitations.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/patient-scheduling-chatbot.md\">patient-scheduling-chatbot.md</a></li></ul><h2>Participants</h2><h1>Participants — Survey — Patient Trust in AI Chatbot for Scheduling</h1>\n<p><strong>Count:</strong> 310</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Patient portal user (general population)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "survey — patient trust in ai chatbot for scheduling survey patient-experience chatbot trust scheduling patient-chatbot-widget survey — patient trust in ai chatbot for scheduling objective gauge patient comfort with an ai chatbot handling appointment scheduling and basic pre-visit questions, ahead of building a prototype. method method: online survey via patient portal, 9 questions, incentivized ($10 gift card) researcher: priya patel full participant roster: see participants.md in this folder key findings [medium] (trust threshold) 67% of respondents were comfortable with an ai chatbot for scheduling/rescheduling specifically, but comfort dropped to 22% when the question extended to &#x27;answering questions about my symptoms.&#x27; [medium] (transparency ask) open-ended responses frequently (41% of those who answered) asked for a clear, easy way to reach &#x27;a real person&#x27; if the bot couldn&#x27;t help — treated as a trust prerequisite, not a nice-to-have. [low] (age variance) comfort with the chatbot skewed higher among respondents who self-reported as under 45, consistent with general digital-trust patterns, not a novel finding but worth noting for pilot recruitment. representative quotes &quot;booking an appointment, sure, a robot&#x27;s fine. asking it if my chest pain is serious? absolutely not.&quot; — patient portal user, p44 (survey open-ended) &quot;as long as i can type &#x27;human please&#x27; and get one, i don&#x27;t mind trying the bot first.&quot; — patient portal user, p58 (survey open-ended) recommendations scope the chatbot&#x27;s initial functionality strictly to scheduling/logistics; explicitly exclude symptom-related q&amp;a from v1 given the sharp trust drop-off. design a highly visible, low-friction &#x27;talk to a person&#x27; escape hatch as a core requirement, not an afterthought. follow-ups / open questions usability test the escape-hatch design specifically once a prototype exists. consider a targeted follow-up with the 45+ demographic to understand specific hesitations. related synthesized into: patient-scheduling-chatbot.md participants participants — survey — patient trust in ai chatbot for scheduling count: 310 roles: patient portal user (general population) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-06-17-usability-test-patient-chatbot-prototype", "kind": "raw", "title": "Usability Test — Patient Scheduling Chatbot Prototype", "date": "2025-06-17", "type": "usability-test", "status": "raw", "tags": ["chatbot", "usability", "patient-experience", "scheduling"], "related_components": ["patient-chatbot-widget", "scheduling-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-06-17-usability-test-patient-chatbot-prototype/session-notes.md", "html": "<h1>Usability Test — Patient Scheduling Chatbot Prototype</h1>\n<h2>Objective</h2>\n<p>Test the scheduling-only chatbot prototype&#x27;s usability and confirm the &#x27;talk to a person&#x27; escape hatch is discoverable and effective.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated remote usability test, task-based, 30 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(discoverability)</em> 3 of 8 participants did not find the &#x27;talk to a person&#x27; option when asked to try to reach a human, even though it existed — it was placed in a small text link below the main chat input.</li><li><strong>[MEDIUM]</strong> <em>(task success)</em> Rescheduling an existing appointment had a lower success rate (5/8) than booking a new one (7/8), largely due to the bot asking for an appointment ID participants didn&#x27;t have handy.</li><li><strong>[MEDIUM]</strong> <em>(tone)</em> Several participants (4/8) described the bot&#x27;s tone as &#x27;overly cheerful&#x27; given they were often scheduling around being unwell, which felt mismatched.</li><li><strong>[MEDIUM]</strong> <em>(confidence signaling)</em> Participants couldn&#x27;t tell when the bot was confident vs. guessing; one participant proceeded with an incorrect date because the bot stated it &#x27;confidently.&#x27;</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I looked right past that little link. If I hadn&#x27;t been told it existed, I never would have found it.&quot;</p><p>— Patient, P61</p></blockquote>\n<blockquote><p>&quot;It kept saying &#x27;Great!&#x27; and &#x27;Awesome!&#x27; while I&#x27;m trying to reschedule because I&#x27;m sick. Just... tone it down a little.&quot;</p><p>— Patient, P64</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Redesign the &#x27;talk to a person&#x27; affordance as a persistent, visually prominent button rather than a small inline link.</li><li>For rescheduling, let the bot look up appointments by name/date instead of requiring an appointment ID.</li><li>Revisit the bot&#x27;s tone/copy to be more neutral, especially for interactions likely tied to illness.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Partner with UX writing on a tone pass before next round.</li><li>Re-test discoverability of the escape hatch after the redesign specifically.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/patient-scheduling-chatbot.md\">patient-scheduling-chatbot.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Patient Scheduling Chatbot Prototype</h1>\n<p><strong>Count:</strong> 8</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Patient (recruited via portal panel)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — patient scheduling chatbot prototype chatbot usability patient-experience scheduling patient-chatbot-widget scheduling-widget usability test — patient scheduling chatbot prototype objective test the scheduling-only chatbot prototype&#x27;s usability and confirm the &#x27;talk to a person&#x27; escape hatch is discoverable and effective. method method: moderated remote usability test, task-based, 30 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (discoverability) 3 of 8 participants did not find the &#x27;talk to a person&#x27; option when asked to try to reach a human, even though it existed — it was placed in a small text link below the main chat input. [medium] (task success) rescheduling an existing appointment had a lower success rate (5/8) than booking a new one (7/8), largely due to the bot asking for an appointment id participants didn&#x27;t have handy. [medium] (tone) several participants (4/8) described the bot&#x27;s tone as &#x27;overly cheerful&#x27; given they were often scheduling around being unwell, which felt mismatched. [medium] (confidence signaling) participants couldn&#x27;t tell when the bot was confident vs. guessing; one participant proceeded with an incorrect date because the bot stated it &#x27;confidently.&#x27; representative quotes &quot;i looked right past that little link. if i hadn&#x27;t been told it existed, i never would have found it.&quot; — patient, p61 &quot;it kept saying &#x27;great!&#x27; and &#x27;awesome!&#x27; while i&#x27;m trying to reschedule because i&#x27;m sick. just... tone it down a little.&quot; — patient, p64 recommendations redesign the &#x27;talk to a person&#x27; affordance as a persistent, visually prominent button rather than a small inline link. for rescheduling, let the bot look up appointments by name/date instead of requiring an appointment id. revisit the bot&#x27;s tone/copy to be more neutral, especially for interactions likely tied to illness. follow-ups / open questions partner with ux writing on a tone pass before next round. re-test discoverability of the escape hatch after the redesign specifically. related synthesized into: patient-scheduling-chatbot.md participants participants — usability test — patient scheduling chatbot prototype count: 8 roles: patient (recruited via portal panel) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-07-01-accessibility-audit-new-design-system-components", "kind": "raw", "title": "Accessibility Audit — New Design System Component Library", "date": "2025-07-01", "type": "accessibility-audit", "status": "raw", "tags": ["accessibility", "wcag", "design-system", "components"], "related_components": ["design-system-form-field", "design-system-modal"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-07-01-accessibility-audit-new-design-system-components/session-notes.md", "html": "<h1>Accessibility Audit — New Design System Component Library</h1>\n<h2>Objective</h2>\n<p>Audit the new component library (buttons, form fields, modals, data tables) intended to replace legacy ExtJS components across Compass AI interfaces, before wide adoption.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Manual WCAG 2.1 AA audit + automated scan (axe), component-by-component</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(form validation)</em> Inline error messages on form fields are not programmatically associated with their inputs (missing aria-describedby), so screen reader users aren&#x27;t told which field has an error or why.</li><li><strong>[MEDIUM]</strong> <em>(focus visibility)</em> Custom-styled buttons have a focus outline that fails the 3:1 non-text contrast requirement against the button&#x27;s own background in the &#x27;primary&#x27; variant.</li><li><strong>[MEDIUM]</strong> <em>(modal)</em> New modal component correctly traps focus and supports Esc to close (improvement over the legacy console audited in March), but does not return focus to the triggering element on close.</li><li><strong>[LOW]</strong> <em>(documentation)</em> Component documentation site doesn&#x27;t yet include accessibility usage notes for engineers implementing the components.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;The good news is the modal problem from the legacy audit is actually fixed here. The bad news is we found a new one in forms.&quot;</p><p>— Accessibility Specialist (internal), Internal SME</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Fix the form-field error association before the library is adopted broadly — this is a common, high-impact pattern used everywhere.</li><li>Add accessibility usage notes to component documentation as components are adopted, not retroactively.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Re-audit after fixes land, focused specifically on forms and focus-return behavior.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/accessibility-cross-cutting.md\">accessibility-cross-cutting.md</a></li></ul><h2>Participants</h2><h1>Participants — Accessibility Audit — New Design System Component Library</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Accessibility Specialist (internal)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "accessibility audit — new design system component library accessibility wcag design-system components design-system-form-field design-system-modal accessibility audit — new design system component library objective audit the new component library (buttons, form fields, modals, data tables) intended to replace legacy extjs components across compass ai interfaces, before wide adoption. method method: manual wcag 2.1 aa audit + automated scan (axe), component-by-component researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (form validation) inline error messages on form fields are not programmatically associated with their inputs (missing aria-describedby), so screen reader users aren&#x27;t told which field has an error or why. [medium] (focus visibility) custom-styled buttons have a focus outline that fails the 3:1 non-text contrast requirement against the button&#x27;s own background in the &#x27;primary&#x27; variant. [medium] (modal) new modal component correctly traps focus and supports esc to close (improvement over the legacy console audited in march), but does not return focus to the triggering element on close. [low] (documentation) component documentation site doesn&#x27;t yet include accessibility usage notes for engineers implementing the components. representative quotes &quot;the good news is the modal problem from the legacy audit is actually fixed here. the bad news is we found a new one in forms.&quot; — accessibility specialist (internal), internal sme recommendations fix the form-field error association before the library is adopted broadly — this is a common, high-impact pattern used everywhere. add accessibility usage notes to component documentation as components are adopted, not retroactively. follow-ups / open questions re-audit after fixes land, focused specifically on forms and focus-return behavior. related synthesized into: accessibility-cross-cutting.md participants participants — accessibility audit — new design system component library count: 1 roles: accessibility specialist (internal) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-07-15-contextual-inquiry-him-release-of-information", "kind": "raw", "title": "Contextual Inquiry — Health Information Management (Release of Information)", "date": "2025-07-15", "type": "contextual-inquiry", "status": "raw", "tags": ["him", "release-of-information", "phi", "workflow", "compliance"], "related_components": ["roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-07-15-contextual-inquiry-him-release-of-information/session-notes.md", "html": "<h1>Contextual Inquiry — Health Information Management (Release of Information)</h1>\n<h2>Objective</h2>\n<p>Understand the current release-of-information (ROI) workflow to evaluate whether AI could help identify and redact PHI in records being released, without introducing compliance risk.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> In-person shadowing, 2 sessions x 2 hours</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(liability sensitivity)</em> Staff described ROI as the single area where a mistake (releasing the wrong record, or failing to redact substance-use or behavioral-health notes protected under stricter rules) has caused real incidents in the past and is treated with extreme caution — any AI assistance here would need an unusually high accuracy bar and human final sign-off, no exceptions.</li><li><strong>[HIGH]</strong> <em>(42 CFR Part 2 awareness)</em> Specialists manually flag behavioral health and substance use disorder notes for a stricter, separate redaction process (per 42 CFR Part 2), a distinction that isn&#x27;t currently represented as structured data anywhere in the EHR — it lives in staff training and memory.</li><li><strong>[MEDIUM]</strong> <em>(volume)</em> ROI requests have grown ~18% year over year per the supervisor&#x27;s informal tracking, driving interest in any tool that reduces manual redaction time, but not at the cost of the accuracy bar above.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;This is the department where a mistake doesn&#x27;t just look bad, it can be a federal violation. I need to see exactly what an AI redacted and why before I&#x27;d ever trust it.&quot;</p><p>— HIM Supervisor, P67</p></blockquote>\n<blockquote><p>&quot;Nothing in the system tells you &#x27;hey, this note needs Part 2 handling.&#x27; You just have to know. That&#x27;s scary when we train someone new.&quot;</p><p>— HIM Specialist, P69</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>If AI redaction assistance is pursued, scope it as a &#x27;suggest and highlight for human review&#x27; tool only, never auto-redact-and-release, given the stated risk tolerance.</li><li>Separately from AI: recommend flagging 42 CFR Part 2-protected note types as structured metadata in the EHR, which would benefit this workflow regardless of any AI tool and reduce reliance on institutional memory.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Get actual (not informal) ROI volume and error/incident trend data from HIM leadership.</li><li>Check whether 42 CFR Part 2 flagging as structured metadata is already on any other team&#x27;s roadmap.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Health Information Management (Release of Information)</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>HIM Specialist (Release of Information)</li><li>HIM Supervisor</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "contextual inquiry — health information management (release of information) him release-of-information phi workflow compliance roi-redaction-tool contextual inquiry — health information management (release of information) objective understand the current release-of-information (roi) workflow to evaluate whether ai could help identify and redact phi in records being released, without introducing compliance risk. method method: in-person shadowing, 2 sessions x 2 hours researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (liability sensitivity) staff described roi as the single area where a mistake (releasing the wrong record, or failing to redact substance-use or behavioral-health notes protected under stricter rules) has caused real incidents in the past and is treated with extreme caution — any ai assistance here would need an unusually high accuracy bar and human final sign-off, no exceptions. [high] (42 cfr part 2 awareness) specialists manually flag behavioral health and substance use disorder notes for a stricter, separate redaction process (per 42 cfr part 2), a distinction that isn&#x27;t currently represented as structured data anywhere in the ehr — it lives in staff training and memory. [medium] (volume) roi requests have grown ~18% year over year per the supervisor&#x27;s informal tracking, driving interest in any tool that reduces manual redaction time, but not at the cost of the accuracy bar above. representative quotes &quot;this is the department where a mistake doesn&#x27;t just look bad, it can be a federal violation. i need to see exactly what an ai redacted and why before i&#x27;d ever trust it.&quot; — him supervisor, p67 &quot;nothing in the system tells you &#x27;hey, this note needs part 2 handling.&#x27; you just have to know. that&#x27;s scary when we train someone new.&quot; — him specialist, p69 recommendations if ai redaction assistance is pursued, scope it as a &#x27;suggest and highlight for human review&#x27; tool only, never auto-redact-and-release, given the stated risk tolerance. separately from ai: recommend flagging 42 cfr part 2-protected note types as structured metadata in the ehr, which would benefit this workflow regardless of any ai tool and reduce reliance on institutional memory. follow-ups / open questions get actual (not informal) roi volume and error/incident trend data from him leadership. check whether 42 cfr part 2 flagging as structured metadata is already on any other team&#x27;s roadmap. related synthesized into: him-coding-and-billing.md participants participants — contextual inquiry — health information management (release of information) count: 2 roles: him specialist (release of information) him supervisor researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-07-29-usability-test-ai-coding-billing-suggestions", "kind": "raw", "title": "Usability Test — AI-Assisted Medical Coding Suggestions", "date": "2025-07-29", "type": "usability-test", "status": "raw", "tags": ["coding", "billing", "usability", "him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-07-29-usability-test-ai-coding-billing-suggestions/session-notes.md", "html": "<h1>Usability Test — AI-Assisted Medical Coding Suggestions</h1>\n<h2>Objective</h2>\n<p>Test an AI tool that suggests ICD-10/CPT codes based on chart documentation, to see if it speeds up coding without introducing compliance risk (upcoding/downcoding).</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, 5 chart scenarios, 60 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(compliance risk perception)</em> Senior coder immediately flagged that an AI suggesting codes could be seen as steering toward upcoding if not carefully positioned, and wanted explicit documentation that the human coder made the final call, not the AI, in case of an audit.</li><li><strong>[MEDIUM]</strong> <em>(accuracy)</em> Suggested codes matched the coder&#x27;s own independent choice in 14 of 20 test scenarios across participants; mismatches were mostly specificity-level (e.g., unspecified vs. specified diagnosis) rather than category-level.</li><li><strong>[MEDIUM]</strong> <em>(workflow fit)</em> Coders wanted suggestions ranked/justified with the specific chart text that supports each code, similar to the transparency ask seen in the prior-auth testing.</li><li><strong>[MEDIUM]</strong> <em>(speed)</em> Estimated time savings of 2-3 minutes per chart for straightforward cases; negligible or negative for complex multi-diagnosis charts where coders said they&#x27;d ignore the tool anyway.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I don&#x27;t mind a second opinion. I do mind if it looks like the machine picked the code and I just clicked &#x27;accept&#x27; — that&#x27;s an audit nightmare waiting to happen.&quot;</p><p>— Medical Coder (certified, senior), P71</p></blockquote>\n<blockquote><p>&quot;Show me the sentence in the note that made you suggest that code. If you can&#x27;t, I don&#x27;t trust it.&quot;</p><p>— Medical Coder, P73</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Ensure the UI and underlying audit log make it unambiguous that the human coder is the final decision-maker, with explicit accept/override tracking per code.</li><li>Add source-text citation for every suggested code, mirroring the transparency pattern requested in prior-auth and chart-review research.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Loop in Compliance on the audit-log design specifically for this feature given the upcoding sensitivity raised.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — AI-Assisted Medical Coding Suggestions</h1>\n<p><strong>Count:</strong> 4</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Medical Coder</li><li>Medical Coder (certified, senior)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ai-assisted medical coding suggestions coding billing usability him coding-suggestion-panel usability test — ai-assisted medical coding suggestions objective test an ai tool that suggests icd-10/cpt codes based on chart documentation, to see if it speeds up coding without introducing compliance risk (upcoding/downcoding). method method: moderated usability test, 5 chart scenarios, 60 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (compliance risk perception) senior coder immediately flagged that an ai suggesting codes could be seen as steering toward upcoding if not carefully positioned, and wanted explicit documentation that the human coder made the final call, not the ai, in case of an audit. [medium] (accuracy) suggested codes matched the coder&#x27;s own independent choice in 14 of 20 test scenarios across participants; mismatches were mostly specificity-level (e.g., unspecified vs. specified diagnosis) rather than category-level. [medium] (workflow fit) coders wanted suggestions ranked/justified with the specific chart text that supports each code, similar to the transparency ask seen in the prior-auth testing. [medium] (speed) estimated time savings of 2-3 minutes per chart for straightforward cases; negligible or negative for complex multi-diagnosis charts where coders said they&#x27;d ignore the tool anyway. representative quotes &quot;i don&#x27;t mind a second opinion. i do mind if it looks like the machine picked the code and i just clicked &#x27;accept&#x27; — that&#x27;s an audit nightmare waiting to happen.&quot; — medical coder (certified, senior), p71 &quot;show me the sentence in the note that made you suggest that code. if you can&#x27;t, i don&#x27;t trust it.&quot; — medical coder, p73 recommendations ensure the ui and underlying audit log make it unambiguous that the human coder is the final decision-maker, with explicit accept/override tracking per code. add source-text citation for every suggested code, mirroring the transparency pattern requested in prior-auth and chart-review research. follow-ups / open questions loop in compliance on the audit-log design specifically for this feature given the upcoding sensitivity raised. related synthesized into: him-coding-and-billing.md participants participants — usability test — ai-assisted medical coding suggestions count: 4 roles: medical coder medical coder (certified, senior) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-08-12-interview-cmio-ai-generated-content-governance", "kind": "raw", "title": "Interview — CMIO on Governance for AI-Generated Content in the Legal Record", "date": "2025-08-12", "type": "interview", "status": "raw", "tags": ["governance", "legal-record", "cmio", "ai-generated-content"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-08-12-interview-cmio-ai-generated-content-governance/session-notes.md", "html": "<h1>Interview — CMIO on Governance for AI-Generated Content in the Legal Record</h1>\n<h2>Objective</h2>\n<p>Understand the CMIO&#x27;s position on how AI-generated content (scribe drafts, coding suggestions, prior-auth drafts) should be treated once accepted into the legal medical record.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(attestation model)</em> CMIO wants any AI-generated content, once a clinician accepts/signs it, to carry the same attestation weight and liability as if they typed it themselves — no separate &#x27;AI-assisted&#x27; watermark visible in the permanent record, though the generation metadata should exist in an internal audit log (echoing the Privacy Officer&#x27;s March requirement).</li><li><strong>[MEDIUM]</strong> <em>(review fatigue tradeoff)</em> CMIO is aware this creates tension with the earlier finding that clinicians currently over-review AI output line-by-line — he sees that as an acceptable, even desirable, transitional state rather than a bug to eliminate quickly.</li><li><strong>[MEDIUM]</strong> <em>(rollout sequencing)</em> Prefers rolling out AI features in order of PHI sensitivity, lowest first (scheduling, then admin/coding, then documentation, then anything clinical-decision-adjacent), which aligns with the CIO/VP&#x27;s January framing.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Once a doctor signs it, it&#x27;s theirs. I don&#x27;t want a permanent asterisk on the chart that says &#x27;a robot helped.&#x27; I do want to know that internally if something ever goes wrong.&quot;</p><p>— Chief Medical Information Officer, P75</p></blockquote>\n<blockquote><p>&quot;I&#x27;d rather they over-check it for the first year than under-check it and we find out the hard way.&quot;</p><p>— Chief Medical Information Officer, P75</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Confirm this attestation model with Legal/Compliance formally — it&#x27;s a policy decision, not just a UX one, and should be documented before it&#x27;s assumed as a design constraint.</li><li>Use the CMIO&#x27;s PHI-sensitivity-ordered rollout sequence as an explicit input to the 2026 roadmap prioritization.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Schedule a joint session with Legal, Compliance, and the CMIO to formally ratify the attestation model.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — CMIO on Governance for AI-Generated Content in the Legal Record</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Chief Medical Information Officer</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "interview — cmio on governance for ai-generated content in the legal record governance legal-record cmio ai-generated-content interview — cmio on governance for ai-generated content in the legal record objective understand the cmio&#x27;s position on how ai-generated content (scribe drafts, coding suggestions, prior-auth drafts) should be treated once accepted into the legal medical record. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (attestation model) cmio wants any ai-generated content, once a clinician accepts/signs it, to carry the same attestation weight and liability as if they typed it themselves — no separate &#x27;ai-assisted&#x27; watermark visible in the permanent record, though the generation metadata should exist in an internal audit log (echoing the privacy officer&#x27;s march requirement). [medium] (review fatigue tradeoff) cmio is aware this creates tension with the earlier finding that clinicians currently over-review ai output line-by-line — he sees that as an acceptable, even desirable, transitional state rather than a bug to eliminate quickly. [medium] (rollout sequencing) prefers rolling out ai features in order of phi sensitivity, lowest first (scheduling, then admin/coding, then documentation, then anything clinical-decision-adjacent), which aligns with the cio/vp&#x27;s january framing. representative quotes &quot;once a doctor signs it, it&#x27;s theirs. i don&#x27;t want a permanent asterisk on the chart that says &#x27;a robot helped.&#x27; i do want to know that internally if something ever goes wrong.&quot; — chief medical information officer, p75 &quot;i&#x27;d rather they over-check it for the first year than under-check it and we find out the hard way.&quot; — chief medical information officer, p75 recommendations confirm this attestation model with legal/compliance formally — it&#x27;s a policy decision, not just a ux one, and should be documented before it&#x27;s assumed as a design constraint. use the cmio&#x27;s phi-sensitivity-ordered rollout sequence as an explicit input to the 2026 roadmap prioritization. follow-ups / open questions schedule a joint session with legal, compliance, and the cmio to formally ratify the attestation model. related synthesized into: governance-and-phi.md participants participants — interview — cmio on governance for ai-generated content in the legal record count: 1 roles: chief medical information officer researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-08-26-usability-test-alert-triage-ai-care-coordination", "kind": "raw", "title": "Usability Test — AI Alert Triage for Care Coordination", "date": "2025-08-26", "type": "usability-test", "status": "raw", "tags": ["alert-triage", "usability", "care-coordination", "alert-fatigue"], "related_components": ["alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md", "html": "<h1>Usability Test — AI Alert Triage for Care Coordination</h1>\n<h2>Objective</h2>\n<p>Test whether an AI-prioritized alert queue (ranking care coordination alerts by urgency) actually improves triage speed/accuracy over the current chronological queue.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, simulated alert queue, 45 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(ranking trust)</em> 4 of 5 participants disagreed with the AI&#x27;s top-3 ranking on at least one of three test queues, generally because the model weighted &#x27;recency&#x27; more heavily than coordinators&#x27; own sense of clinical risk — echoes the alert-fatigue concern from the May dashboard testing.</li><li><strong>[HIGH]</strong> <em>(override friction)</em> When participants disagreed with the ranking, there was no way to note why they reprioritized, meaning that correction signal isn&#x27;t captured anywhere for future model improvement.</li><li><strong>[MEDIUM]</strong> <em>(speed)</em> Despite ranking disagreements, participants still completed triage of a 20-item queue faster with AI ranking present (avg 6.5 min) vs. chronological (avg 9 min) in this simulated test.</li><li><strong>[MEDIUM]</strong> <em>(supervisor concern)</em> Supervisor worried that speed gains could mask a coordinator rubber-stamping the AI order without real judgment, similar to the concern raised by the prior-auth supervisor in April.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;It&#x27;s fast, I&#x27;ll give it that. But fast and wrong is worse than slow and right in this job.&quot;</p><p>— Care Coordinator Supervisor, P79</p></blockquote>\n<blockquote><p>&quot;I wanted to tell it &#x27;no, this one&#x27;s more urgent because I know this patient&#x27;s history,&#x27; but there was nowhere to put that.&quot;</p><p>— Care Coordinator, P81</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Add a lightweight &#x27;why did you reprioritize&#x27; capture on override, both to improve the model and to give coordinators a sense of agency the current design lacks.</li><li>Investigate incorporating patient history/continuity signals into ranking logic, not just recency, before wider testing.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Share the override-capture idea with the Data Science team working on the care-gap flagging model (May findings) — likely the same underlying tuning problem.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — AI Alert Triage for Care Coordination</h1>\n<p><strong>Count:</strong> 5</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Care Coordinator</li><li>Care Coordinator</li><li>Care Coordinator Supervisor</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ai alert triage for care coordination alert-triage usability care-coordination alert-fatigue alert-triage-queue usability test — ai alert triage for care coordination objective test whether an ai-prioritized alert queue (ranking care coordination alerts by urgency) actually improves triage speed/accuracy over the current chronological queue. method method: moderated usability test, simulated alert queue, 45 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (ranking trust) 4 of 5 participants disagreed with the ai&#x27;s top-3 ranking on at least one of three test queues, generally because the model weighted &#x27;recency&#x27; more heavily than coordinators&#x27; own sense of clinical risk — echoes the alert-fatigue concern from the may dashboard testing. [high] (override friction) when participants disagreed with the ranking, there was no way to note why they reprioritized, meaning that correction signal isn&#x27;t captured anywhere for future model improvement. [medium] (speed) despite ranking disagreements, participants still completed triage of a 20-item queue faster with ai ranking present (avg 6.5 min) vs. chronological (avg 9 min) in this simulated test. [medium] (supervisor concern) supervisor worried that speed gains could mask a coordinator rubber-stamping the ai order without real judgment, similar to the concern raised by the prior-auth supervisor in april. representative quotes &quot;it&#x27;s fast, i&#x27;ll give it that. but fast and wrong is worse than slow and right in this job.&quot; — care coordinator supervisor, p79 &quot;i wanted to tell it &#x27;no, this one&#x27;s more urgent because i know this patient&#x27;s history,&#x27; but there was nowhere to put that.&quot; — care coordinator, p81 recommendations add a lightweight &#x27;why did you reprioritize&#x27; capture on override, both to improve the model and to give coordinators a sense of agency the current design lacks. investigate incorporating patient history/continuity signals into ranking logic, not just recency, before wider testing. follow-ups / open questions share the override-capture idea with the data science team working on the care-gap flagging model (may findings) — likely the same underlying tuning problem. related synthesized into: care-coordination-triage.md participants participants — usability test — ai alert triage for care coordination count: 5 roles: care coordinator care coordinator care coordinator supervisor researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-09-09-survey-clinician-burnout-documentation-burden-baseline", "kind": "raw", "title": "Survey — Clinician Burnout & Documentation Burden Baseline", "date": "2025-09-09", "type": "survey", "status": "raw", "tags": ["survey", "burnout", "documentation-burden", "baseline"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md", "html": "<h1>Survey — Clinician Burnout &amp; Documentation Burden Baseline</h1>\n<h2>Objective</h2>\n<p>Establish a pre-AI-rollout baseline of self-reported burnout and documentation burden, so future surveys can measure whether Compass AI tools move the needle.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Anonymous org-wide survey, 15 questions (validated burnout subscale + custom documentation items)</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(documentation as burnout driver)</em> Documentation burden ranked as the #1 self-selected contributor to burnout among physicians specifically (52%), ahead of patient volume (31%) and administrative meetings (12%).</li><li><strong>[MEDIUM]</strong> <em>(after-hours charting)</em> 64% of physician respondents report regularly completing documentation after clinic hours (&#x27;pajama time&#x27;), averaging a self-reported 1.2 hours/day.</li><li><strong>[MEDIUM]</strong> <em>(baseline caution)</em> Respondents were told this survey relates to a future AI initiative, which may have primed more favorable-than-baseline attitudes toward documentation-reducing tools — worth noting as a methodological caveat for anyone comparing to the February nursing survey, which didn&#x27;t mention AI in its framing.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I love this job. I do not love finishing my notes at 9pm after my kids are in bed. If AI fixes that, I&#x27;m in.&quot;</p><p>— Physician, P84 (survey open-ended)</p></blockquote>\n<blockquote><p>&quot;Just don&#x27;t let &#x27;AI will fix documentation&#x27; become the excuse to skip fixing the actual EHR problems underneath it.&quot;</p><p>— Nurse Practitioner, P91 (survey open-ended)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Use this survey as the official baseline metric for measuring Compass AI&#x27;s impact on documentation burden and after-hours charting in future re-surveys (e.g., 6 and 12 months post-rollout).</li><li>Note the framing caveat explicitly in any report comparing this dataset to the February nursing survey.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Schedule a repeat of this exact survey instrument 6 months after ambient scribe GA rollout for comparison.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Survey — Clinician Burnout &amp; Documentation Burden Baseline</h1>\n<p><strong>Count:</strong> 287</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician</li><li>Nurse Practitioner</li><li>Physician Assistant</li><li>Registered Nurse</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "survey — clinician burnout & documentation burden baseline survey burnout documentation-burden baseline ambient-scribe-widget survey — clinician burnout &amp; documentation burden baseline objective establish a pre-ai-rollout baseline of self-reported burnout and documentation burden, so future surveys can measure whether compass ai tools move the needle. method method: anonymous org-wide survey, 15 questions (validated burnout subscale + custom documentation items) researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (documentation as burnout driver) documentation burden ranked as the #1 self-selected contributor to burnout among physicians specifically (52%), ahead of patient volume (31%) and administrative meetings (12%). [medium] (after-hours charting) 64% of physician respondents report regularly completing documentation after clinic hours (&#x27;pajama time&#x27;), averaging a self-reported 1.2 hours/day. [medium] (baseline caution) respondents were told this survey relates to a future ai initiative, which may have primed more favorable-than-baseline attitudes toward documentation-reducing tools — worth noting as a methodological caveat for anyone comparing to the february nursing survey, which didn&#x27;t mention ai in its framing. representative quotes &quot;i love this job. i do not love finishing my notes at 9pm after my kids are in bed. if ai fixes that, i&#x27;m in.&quot; — physician, p84 (survey open-ended) &quot;just don&#x27;t let &#x27;ai will fix documentation&#x27; become the excuse to skip fixing the actual ehr problems underneath it.&quot; — nurse practitioner, p91 (survey open-ended) recommendations use this survey as the official baseline metric for measuring compass ai&#x27;s impact on documentation burden and after-hours charting in future re-surveys (e.g., 6 and 12 months post-rollout). note the framing caveat explicitly in any report comparing this dataset to the february nursing survey. follow-ups / open questions schedule a repeat of this exact survey instrument 6 months after ambient scribe ga rollout for comparison. related synthesized into: clinician-experience-documentation-burden.md participants participants — survey — clinician burnout &amp; documentation burden baseline count: 287 roles: physician nurse practitioner physician assistant registered nurse researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-09-23-usability-test-ambient-scribe-v02", "kind": "raw", "title": "Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)", "date": "2025-09-23", "type": "usability-test", "status": "raw", "tags": ["ambient-scribe", "usability", "documentation", "v0.2", "longitudinal"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by"
