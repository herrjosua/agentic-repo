eduling, let the bot look up appointments by name/date instead of requiring an appointment ID.</li><li>Revisit the bot's tone/copy to be more neutral, especially for interactions likely tied to illness.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Partner with UX writing on a tone pass before next round.</li><li>Re-test discoverability of the escape hatch after the redesign specifically.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/patient-scheduling-chatbot.md\">patient-scheduling-chatbot.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Patient Scheduling Chatbot Prototype</h1>\n<p><strong>Count:</strong> 8</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Patient (recruited via portal panel)</li></ul>\n<p><strong>Researcher:</strong> M. Okafor</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — patient scheduling chatbot prototype chatbot usability patient-experience scheduling patient-chatbot-widget scheduling-widget usability test — patient scheduling chatbot prototype objective test the scheduling-only chatbot prototype's usability and confirm the 'talk to a person' escape hatch is discoverable and effective. method method: moderated remote usability test, task-based, 30 min/session researcher: m. okafor full participant roster: see participants.md in this folder key findings [high] (discoverability) 3 of 8 participants did not find the 'talk to a person' option when asked to try to reach a human, even though it existed — it was placed in a small text link below the main chat input. [medium] (task success) rescheduling an existing appointment had a lower success rate (5/8) than booking a new one (7/8), largely due to the bot asking for an appointment id participants didn't have handy. [medium] (tone) several participants (4/8) described the bot's tone as 'overly cheerful' given they were often scheduling around being unwell, which felt mismatched. [medium] (confidence signaling) participants couldn't tell when the bot was confident vs. guessing; one participant proceeded with an incorrect date because the bot stated it 'confidently.' representative quotes \"i looked right past that little link. if i hadn't been told it existed, i never would have found it.\" — patient, p61 \"it kept saying 'great!' and 'awesome!' while i'm trying to reschedule because i'm sick. just... tone it down a little.\" — patient, p64 recommendations redesign the 'talk to a person' affordance as a persistent, visually prominent button rather than a small inline link. for rescheduling, let the bot look up appointments by name/date instead of requiring an appointment id. revisit the bot's tone/copy to be more neutral, especially for interactions likely tied to illness. follow-ups / open questions partner with ux writing on a tone pass before next round. re-test discoverability of the escape hatch after the redesign specifically. related synthesized into: patient-scheduling-chatbot.md participants participants — usability test — patient scheduling chatbot prototype count: 8 roles: patient (recruited via portal panel) researcher: m. okafor recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-07-01-accessibility-audit-new-design-system-components", "kind": "raw", "title": "Accessibility Audit — New Design System Component Library", "date": "2025-07-01", "type": "accessibility-audit", "status": "raw", "tags": ["accessibility", "wcag", "design-system", "components"], "related_components": ["design-system-form-field", "design-system-modal"], "severity": {}, "path": "raw/2025-07-01-accessibility-audit-new-design-system-components/session-notes.md", "html": "<h1>Accessibility Audit — New Design System Component Library</h1>\n<h2>Objective</h2>\n<p>Audit the new component library (buttons, form fields, modals, data tables) intended to replace legacy ExtJS components across Compass AI interfaces, before wide adoption.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Manual WCAG 2.1 AA audit + automated scan (axe), component-by-component</li><li><strong>Researcher:</strong> J. Alvarez</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(form validation)</em> Inline error messages on form fields are not programmatically associated with their inputs (missing aria-describedby), so screen reader users aren't told which field has an error or why.</li><li><strong>[MEDIUM]</strong> <em>(focus visibility)</em> Custom-styled buttons have a focus outline that fails the 3:1 non-text contrast requirement against the button's own background in the 'primary' variant.</li><li><strong>[MEDIUM]</strong> <em>(modal)</em> New modal component correctly traps focus and supports Esc to close (improvement over the legacy console audited in March), but does not return focus to the triggering element on close.</li><li><strong>[LOW]</strong> <em>(documentation)</em> Component documentation site doesn't yet include accessibility usage notes for engineers implementing the components.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"The good news is the modal problem from the legacy audit is actually fixed here. The bad news is we found a new one in forms.\"</p><p>— Accessibility Specialist (internal), Internal SME</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Fix the form-field error association before the library is adopted broadly — this is a common, high-impact pattern used everywhere.</li><li>Add accessibility usage notes to component documentation as components are adopted, not retroactively.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Re-audit after fixes land, focused specifically on forms and focus-return behavior.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/accessibility-cross-cutting.md\">accessibility-cross-cutting.md</a></li></ul><h2>Participants</h2><h1>Participants — Accessibility Audit — New Design System Component Library</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Accessibility Specialist (internal)</li></ul>\n<p><strong>Researcher:</strong> J. Alvarez</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "accessibility audit — new design system component library accessibility wcag design-system components design-system-form-field design-system-modal accessibility audit — new design system component library objective audit the new component library (buttons, form fields, modals, data tables) intended to replace legacy extjs components across compass ai interfaces, before wide adoption. method method: manual wcag 2.1 aa audit + automated scan (axe), component-by-component researcher: j. alvarez full participant roster: see participants.md in this folder key findings [high] (form validation) inline error messages on form fields are not programmatically associated with their inputs (missing aria-describedby), so screen reader users aren't told which field has an error or why. [medium] (focus visibility) custom-styled buttons have a focus outline that fails the 3:1 non-text contrast requirement against the button's own background in the 'primary' variant. [medium] (modal) new modal component correctly traps focus and supports esc to close (improvement over the legacy console audited in march), but does not return focus to the triggering element on close. [low] (documentation) component documentation site doesn't yet include accessibility usage notes for engineers implementing the components. representative quotes \"the good news is the modal problem from the legacy audit is actually fixed here. the bad news is we found a new one in forms.\" — accessibility specialist (internal), internal sme recommendations fix the form-field error association before the library is adopted broadly — this is a common, high-impact pattern used everywhere. add accessibility usage notes to component documentation as components are adopted, not retroactively. follow-ups / open questions re-audit after fixes land, focused specifically on forms and focus-return behavior. related synthesized into: accessibility-cross-cutting.md participants participants — accessibility audit — new design system component library count: 1 roles: accessibility specialist (internal) researcher: j. alvarez recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-07-15-contextual-inquiry-him-release-of-information", "kind": "raw", "title": "Contextual Inquiry — Health Information Management (Release of Information)", "date": "2025-07-15", "type": "contextual-inquiry", "status": "raw", "tags": ["him", "release-of-information", "phi", "workflow", "compliance"], "related_components": ["roi-redaction-tool"], "severity": {}, "path": "raw/2025-07-15-contextual-inquiry-him-release-of-information/session-notes.md", "html": "<h1>Contextual Inquiry — Health Information Management (Release of Information)</h1>\n<h2>Objective</h2>\n<p>Understand the current release-of-information (ROI) workflow to evaluate whether AI could help identify and redact PHI in records being released, without introducing compliance risk.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> In-person shadowing, 2 sessions x 2 hours</li><li><strong>Researcher:</strong> M. Okafor</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(liability sensitivity)</em> Staff described ROI as the single area where a mistake (releasing the wrong record, or failing to redact substance-use or behavioral-health notes protected under stricter rules) has caused real incidents in the past and is treated with extreme caution — any AI assistance here would need an unusually high accuracy bar and human final sign-off, no exceptions.</li><li><strong>[HIGH]</strong> <em>(42 CFR Part 2 awareness)</em> Specialists manually flag behavioral health and substance use disorder notes for a stricter, separate redaction process (per 42 CFR Part 2), a distinction that isn't currently represented as structured data anywhere in the EHR — it lives in staff training and memory.</li><li><strong>[MEDIUM]</strong> <em>(volume)</em> ROI requests have grown ~18% year over year per the supervisor's informal tracking, driving interest in any tool that reduces manual redaction time, but not at the cost of the accuracy bar above.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"This is the department where a mistake doesn't just look bad, it can be a federal violation. I need to see exactly what an AI redacted and why before I'd ever trust it.\"</p><p>— HIM Supervisor, P67</p></blockquote>\n<blockquote><p>\"Nothing in the system tells you 'hey, this note needs Part 2 handling.' You just have to know. That's scary when we train someone new.\"</p><p>— HIM Specialist, P69</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>If AI redaction assistance is pursued, scope it as a 'suggest and highlight for human review' tool only, never auto-redact-and-release, given the stated risk tolerance.</li><li>Separately from AI: recommend flagging 42 CFR Part 2-protected note types as structured metadata in the EHR, which would benefit this workflow regardless of any AI tool and reduce reliance on institutional memory.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Get actual (not informal) ROI volume and error/incident trend data from HIM leadership.</li><li>Check whether 42 CFR Part 2 flagging as structured metadata is already on any other team's roadmap.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Health Information Management (Release of Information)</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>HIM Specialist (Release of Information)</li><li>HIM Supervisor</li></ul>\n<p><strong>Researcher:</strong> M. Okafor</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "contextual inquiry — health information management (release of information) him release-of-information phi workflow compliance roi-redaction-tool contextual inquiry — health information management (release of information) objective understand the current release-of-information (roi) workflow to evaluate whether ai could help identify and redact phi in records being released, without introducing compliance risk. method method: in-person shadowing, 2 sessions x 2 hours researcher: m. okafor full participant roster: see participants.md in this folder key findings [high] (liability sensitivity) staff described roi as the single area where a mistake (releasing the wrong record, or failing to redact substance-use or behavioral-health notes protected under stricter rules) has caused real incidents in the past and is treated with extreme caution — any ai assistance here would need an unusually high accuracy bar and human final sign-off, no exceptions. [high] (42 cfr part 2 awareness) specialists manually flag behavioral health and substance use disorder notes for a stricter, separate redaction process (per 42 cfr part 2), a distinction that isn't currently represented as structured data anywhere in the ehr — it lives in staff training and memory. [medium] (volume) roi requests have grown ~18% year over year per the supervisor's informal tracking, driving interest in any tool that reduces manual redaction time, but not at the cost of the accuracy bar above. representative quotes \"this is the department where a mistake doesn't just look bad, it can be a federal violation. i need to see exactly what an ai redacted and why before i'd ever trust it.\" — him supervisor, p67 \"nothing in the system tells you 'hey, this note needs part 2 handling.' you just have to know. that's scary when we train someone new.\" — him specialist, p69 recommendations if ai redaction assistance is pursued, scope it as a 'suggest and highlight for human review' tool only, never auto-redact-and-release, given the stated risk tolerance. separately from ai: recommend flagging 42 cfr part 2-protected note types as structured metadata in the ehr, which would benefit this workflow regardless of any ai tool and reduce reliance on institutional memory. follow-ups / open questions get actual (not informal) roi volume and error/incident trend data from him leadership. check whether 42 cfr part 2 flagging as structured metadata is already on any other team's roadmap. related synthesized into: him-coding-and-billing.md participants participants — contextual inquiry — health information management (release of information) count: 2 roles: him specialist (release of information) him supervisor researcher: m. okafor recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-07-29-usability-test-ai-coding-billing-suggestions", "kind": "raw", "title": "Usability Test — AI-Assisted Medical Coding Suggestions", "date": "2025-07-29", "type": "usability-test", "status": "raw", "tags": ["coding", "billing", "usability", "him"], "related_components": ["coding-suggestion-panel"], "severity": {}, "path": "raw/2025-07-29-usability-test-ai-coding-billing-suggestions/session-notes.md", "html": "<h1>Usability Test — AI-Assisted Medical Coding Suggestions</h1>\n<h2>Objective</h2>\n<p>Test an AI tool that suggests ICD-10/CPT codes based on chart documentation, to see if it speeds up coding without introducing compliance risk (upcoding/downcoding).</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, 5 chart scenarios, 60 min/session</li><li><strong>Researcher:</strong> J. Alvarez</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(compliance risk perception)</em> Senior coder immediately flagged that an AI suggesting codes could be seen as steering toward upcoding if not carefully positioned, and wanted explicit documentation that the human coder made the final call, not the AI, in case of an audit.</li><li><strong>[MEDIUM]</strong> <em>(accuracy)</em> Suggested codes matched the coder's own independent choice in 14 of 20 test scenarios across participants; mismatches were mostly specificity-level (e.g., unspecified vs. specified diagnosis) rather than category-level.</li><li><strong>[MEDIUM]</strong> <em>(workflow fit)</em> Coders wanted suggestions ranked/justified with the specific chart text that supports each code, similar to the transparency ask seen in the prior-auth testing.</li><li><strong>[MEDIUM]</strong> <em>(speed)</em> Estimated time savings of 2-3 minutes per chart for straightforward cases; negligible or negative for complex multi-diagnosis charts where coders said they'd ignore the tool anyway.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"I don't mind a second opinion. I do mind if it looks like the machine picked the code and I just clicked 'accept' — that's an audit nightmare waiting to happen.\"</p><p>— Medical Coder (certified, senior), P71</p></blockquote>\n<blockquote><p>\"Show me the sentence in the note that made you suggest that code. If you can't, I don't trust it.\"</p><p>— Medical Coder, P73</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Ensure the UI and underlying audit log make it unambiguous that the human coder is the final decision-maker, with explicit accept/override tracking per code.</li><li>Add source-text citation for every suggested code, mirroring the transparency pattern requested in prior-auth and chart-review research.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Loop in Compliance on the audit-log design specifically for this feature given the upcoding sensitivity raised.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — AI-Assisted Medical Coding Suggestions</h1>\n<p><strong>Count:</strong> 4</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Medical Coder</li><li>Medical Coder (certified, senior)</li></ul>\n<p><strong>Researcher:</strong> J. Alvarez</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ai-assisted medical coding suggestions coding billing usability him coding-suggestion-panel usability test — ai-assisted medical coding suggestions objective test an ai tool that suggests icd-10/cpt codes based on chart documentation, to see if it speeds up coding without introducing compliance risk (upcoding/downcoding). method method: moderated usability test, 5 chart scenarios, 60 min/session researcher: j. alvarez full participant roster: see participants.md in this folder key findings [high] (compliance risk perception) senior coder immediately flagged that an ai suggesting codes could be seen as steering toward upcoding if not carefully positioned, and wanted explicit documentation that the human coder made the final call, not the ai, in case of an audit. [medium] (accuracy) suggested codes matched the coder's own independent choice in 14 of 20 test scenarios across participants; mismatches were mostly specificity-level (e.g., unspecified vs. specified diagnosis) rather than category-level. [medium] (workflow fit) coders wanted suggestions ranked/justified with the specific chart text that supports each code, similar to the transparency ask seen in the prior-auth testing. [medium] (speed) estimated time savings of 2-3 minutes per chart for straightforward cases; negligible or negative for complex multi-diagnosis charts where coders said they'd ignore the tool anyway. representative quotes \"i don't mind a second opinion. i do mind if it looks like the machine picked the code and i just clicked 'accept' — that's an audit nightmare waiting to happen.\" — medical coder (certified, senior), p71 \"show me the sentence in the note that made you suggest that code. if you can't, i don't trust it.\" — medical coder, p73 recommendations ensure the ui and underlying audit log make it unambiguous that the human coder is the final decision-maker, with explicit accept/override tracking per code. add source-text citation for every suggested code, mirroring the transparency pattern requested in prior-auth and chart-review research. follow-ups / open questions loop in compliance on the audit-log design specifically for this feature given the upcoding sensitivity raised. related synthesized into: him-coding-and-billing.md participants participants — usability test — ai-assisted medical coding suggestions count: 4 roles: medical coder medical coder (certified, senior) researcher: j. alvarez recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-08-12-interview-cmio-ai-generated-content-governance", "kind": "raw", "title": "Interview — CMIO on Governance for AI-Generated Content in the Legal Record", "date": "2025-08-12", "type": "interview", "status": "raw", "tags": ["governance", "legal-record", "cmio", "ai-generated-content"], "related_components": [], "severity": {}, "path": "raw/2025-08-12-interview-cmio-ai-generated-content-governance/session-notes.md", "html": "<h1>Interview — CMIO on Governance for AI-Generated Content in the Legal Record</h1>\n<h2>Objective</h2>\n<p>Understand the CMIO's position on how AI-generated content (scribe drafts, coding suggestions, prior-auth drafts) should be treated once accepted into the legal medical record.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> M. Okafor</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(attestation model)</em> CMIO wants any AI-generated content, once a clinician accepts/signs it, to carry the same attestation weight and liability as if they typed it themselves — no separate 'AI-assisted' watermark visible in the permanent record, though the generation metadata should exist in an internal audit log (echoing the Privacy Officer's March requirement).</li><li><strong>[MEDIUM]</strong> <em>(review fatigue tradeoff)</em> CMIO is aware this creates tension with the earlier finding that clinicians currently over-review AI output line-by-line — he sees that as an acceptable, even desirable, transitional state rather than a bug to eliminate quickly.</li><li><strong>[MEDIUM]</strong> <em>(rollout sequencing)</em> Prefers rolling out AI features in order of PHI sensitivity, lowest first (scheduling, then admin/coding, then documentation, then anything clinical-decision-adjacent), which aligns with the CIO/VP's January framing.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"Once a doctor signs it, it's theirs. I don't want a permanent asterisk on the chart that says 'a robot helped.' I do want to know that internally if something ever goes wrong.\"</p><p>— Chief Medical Information Officer, P75</p></blockquote>\n<blockquote><p>\"I'd rather they over-check it for the first year than under-check it and we find out the hard way.\"</p><p>— Chief Medical Information Officer, P75</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Confirm this attestation model with Legal/Compliance formally — it's a policy decision, not just a UX one, and should be documented before it's assumed as a design constraint.</li><li>Use the CMIO's PHI-sensitivity-ordered rollout sequence as an explicit input to the 2026 roadmap prioritization.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Schedule a joint session with Legal, Compliance, and the CMIO to formally ratify the attestation model.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — CMIO on Governance for AI-Generated Content in the Legal Record</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Chief Medical Information Officer</li></ul>\n<p><strong>Researcher:</strong> M. Okafor</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "interview — cmio on governance for ai-generated content in the legal record governance legal-record cmio ai-generated-content interview — cmio on governance for ai-generated content in the legal record objective understand the cmio's position on how ai-generated content (scribe drafts, coding suggestions, prior-auth drafts) should be treated once accepted into the legal medical record. method method: 1:1 interview, 45 min researcher: m. okafor full participant roster: see participants.md in this folder key findings [high] (attestation model) cmio wants any ai-generated content, once a clinician accepts/signs it, to carry the same attestation weight and liability as if they typed it themselves — no separate 'ai-assisted' watermark visible in the permanent record, though the generation metadata should exist in an internal audit log (echoing the privacy officer's march requirement). [medium] (review fatigue tradeoff) cmio is aware this creates tension with the earlier finding that clinicians currently over-review ai output line-by-line — he sees that as an acceptable, even desirable, transitional state rather than a bug to eliminate quickly. [medium] (rollout sequencing) prefers rolling out ai features in order of phi sensitivity, lowest first (scheduling, then admin/coding, then documentation, then anything clinical-decision-adjacent), which aligns with the cio/vp's january framing. representative quotes \"once a doctor signs it, it's theirs. i don't want a permanent asterisk on the chart that says 'a robot helped.' i do want to know that internally if something ever goes wrong.\" — chief medical information officer, p75 \"i'd rather they over-check it for the first year than under-check it and we find out the hard way.\" — chief medical information officer, p75 recommendations confirm this attestation model with legal/compliance formally — it's a policy decision, not just a ux one, and should be documented before it's assumed as a design constraint. use the cmio's phi-sensitivity-ordered rollout sequence as an explicit input to the 2026 roadmap prioritization. follow-ups / open questions schedule a joint session with legal, compliance, and the cmio to formally ratify the attestation model. related synthesized into: governance-and-phi.md participants participants — interview — cmio on governance for ai-generated content in the legal record count: 1 roles: chief medical information officer researcher: m. okafor recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-08-26-usability-test-alert-triage-ai-care-coordination", "kind": "raw", "title": "Usability Test — AI Alert Triage for Care Coordination", "date": "2025-08-26", "type": "usability-test", "status": "raw", "tags": ["alert-triage", "usability", "care-coordination", "alert-fatigue"], "related_components": ["alert-triage-queue"], "severity": {}, "path": "raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md", "html": "<h1>Usability Test — AI Alert Triage for Care Coordination</h1>\n<h2>Objective</h2>\n<p>Test whether an AI-prioritized alert queue (ranking care coordination alerts by urgency) actually improves triage speed/accuracy over the current chronological queue.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, simulated alert queue, 45 min/session</li><li><strong>Researcher:</strong> J. Alvarez</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(ranking trust)</em> 4 of 5 participants disagreed with the AI's top-3 ranking on at least one of three test queues, generally because the model weighted 'recency' more heavily than coordinators' own sense of clinical risk — echoes the alert-fatigue concern from the May dashboard testing.</li><li><strong>[HIGH]</strong> <em>(override friction)</em> When participants disagreed with the ranking, there was no way to note why they reprioritized, meaning that correction signal isn't captured anywhere for future model improvement.</li><li><strong>[MEDIUM]</strong> <em>(speed)</em> Despite ranking disagreements, participants still completed triage of a 20-item queue faster with AI ranking present (avg 6.5 min) vs. chronological (avg 9 min) in this simulated test.</li><li><strong>[MEDIUM]</strong> <em>(supervisor concern)</em> Supervisor worried that speed gains could mask a coordinator rubber-stamping the AI order without real judgment, similar to the concern raised by the prior-auth supervisor in April.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"It's fast, I'll give it that. But fast and wrong is worse than slow and right in this job.\"</p><p>— Care Coordinator Supervisor, P79</p></blockquote>\n<blockquote><p>\"I wanted to tell it 'no, this one's more urgent because I know this patient's history,' but there was nowhere to put that.\"</p><p>— Care Coordinator, P81</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Add a lightweight 'why did you reprioritize' capture on override, both to improve the model and to give coordinators a sense of agency the current design lacks.</li><li>Investigate incorporating patient history/continuity signals into ranking logic, not just recency, before wider testing.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Share the override-capture idea with the Data Science team working on the care-gap flagging model (May findings) — likely the same underlying tuning problem.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — AI Alert Triage for Care Coordination</h1>\n<p><strong>Count:</strong> 5</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Care Coordinator</li><li>Care Coordinator</li><li>Care Coordinator Supervisor</li></ul>\n<p><strong>Researcher:</strong> J. Alvarez</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ai alert triage for care coordination alert-triage usability care-coordination alert-fatigue alert-triage-queue usability test — ai alert triage for care coordination objective test whether an ai-prioritized alert queue (ranking care coordination alerts by urgency) actually improves triage speed/accuracy over the current chronological queue. method method: moderated usability test, simulated alert queue, 45 min/session researcher: j. alvarez full participant roster: see participants.md in this folder key findings [high] (ranking trust) 4 of 5 participants disagreed with the ai's top-3 ranking on at least one of three test queues, generally because the model weighted 'recency' more heavily than coordinators' own sense of clinical risk — echoes the alert-fatigue concern from the may dashboard testing. [high] (override friction) when participants disagreed with the ranking, there was no way to note why they reprioritized, meaning that correction signal isn't captured anywhere for future model improvement. [medium] (speed) despite ranking disagreements, participants still completed triage of a 20-item queue faster with ai ranking present (avg 6.5 min) vs. chronological (avg 9 min) in this simulated test. [medium] (supervisor concern) supervisor worried that speed gains could mask a coordinator rubber-stamping the ai order without real judgment, similar to the concern raised by the prior-auth supervisor in april. representative quotes \"it's fast, i'll give it that. but fast and wrong is worse than slow and right in this job.\" — care coordinator supervisor, p79 \"i wanted to tell it 'no, this one's more urgent because i know this patient's history,' but there was nowhere to put that.\" — care coordinator, p81 recommendations add a lightweight 'why did you reprioritize' capture on override, both to improve the model and to give coordinators a sense of agency the current design lacks. investigate incorporating patient history/continuity signals into ranking logic, not just recency, before wider testing. follow-ups / open questions share the override-capture idea with the data science team working on the care-gap flagging model (may findings) — likely the same underlying tuning problem. related synthesized into: care-coordination-triage.md participants participants — usability test — ai alert triage for care coordination count: 5 roles: care coordinator care coordinator care coordinator supervisor researcher: j. alvarez recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-09-09-survey-clinician-burnout-documentation-burden-baseline", "kind": "raw", "title": "Survey — Clinician Burnout & Documentation Burden Baseline", "date": "2025-09-09", "type": "survey", "status": "raw", "tags": ["survey", "burnout", "documentation-burden", "baseline"], "related_components": ["ambient-scribe-widget"], "severity": {}, "path": "raw/2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md", "html": "<h1>Survey — Clinician Burnout &amp; Documentation Burden Baseline</h1>\n<h2>Objective</h2>\n<p>Establish a pre-AI-rollout baseline of self-reported burnout and documentation burden, so future surveys can measure whether Compass AI tools move the needle.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Anonymous org-wide survey, 15 questions (validated burnout subscale + custom documentation items)</li><li><strong>Researcher:</strong> M. Okafor</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(documentation as burnout driver)</em> Documentation burden ranked as the #1 self-selected contributor to burnout among physicians specifically (52%), ahead of patient volume (31%) and administrative meetings (12%).</li><li><strong>[MEDIUM]</strong> <em>(after-hours charting)</em> 64% of physician respondents report regularly completing documentation after clinic hours ('pajama time'), averaging a self-reported 1.2 hours/day.</li><li><strong>[MEDIUM]</strong> <em>(baseline caution)</em> Respondents were told this survey relates to a future AI initiative, which may have primed more favorable-than-baseline attitudes toward documentation-reducing tools — worth noting as a methodological caveat for anyone comparing to the February nursing survey, which didn't mention AI in its framing.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"I love this job. I do not love finishing my notes at 9pm after my kids are in bed. If AI fixes that, I'm in.\"</p><p>— Physician, P84 (survey open-ended)</p></blockquote>\n<blockquote><p>\"Just don't let 'AI will fix documentation' become the excuse to skip fixing the actual EHR problems underneath it.\"</p><p>— Nurse Practitioner, P91 (survey open-ended)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Use this survey as the official baseline metric for measuring Compass AI's impact on documentation burden and after-hours charting in future re-surveys (e.g., 6 and 12 months post-rollout).</li><li>Note the framing caveat explicitly in any report comparing this dataset to the February nursing survey.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Schedule a repeat of this exact survey instrument 6 months after ambient scribe GA rollout for comparison.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Survey — Clinician Burnout &amp; Documentation Burden Baseline</h1>\n<p><strong>Count:</strong> 287</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician</li><li>Nurse Practitioner</li><li>Physician Assistant</li><li>Registered Nurse</li></ul>\n<p><strong>Researcher:</strong> M. Okafor</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "survey — clinician burnout & documentation burden baseline survey burnout documentation-burden baseline ambient-scribe-widget survey — clinician burnout &amp; documentation burden baseline objective establish a pre-ai-rollout baseline of self-reported burnout and documentation burden, so future surveys can measure whether compass ai tools move the needle. method method: anonymous org-wide survey, 15 questions (validated burnout subscale + custom documentation items) researcher: m. okafor full participant roster: see participants.md in this folder key findings [high] (documentation as burnout driver) documentation burden ranked as the #1 self-selected contributor to burnout among physicians specifically (52%), ahead of patient volume (31%) and administrative meetings (12%). [medium] (after-hours charting) 64% of physician respondents report regularly completing documentation after clinic hours ('pajama time'), averaging a self-reported 1.2 hours/day. [medium] (baseline caution) respondents were told this survey relates to a future ai initiative, which may have primed more favorable-than-baseline attitudes toward documentation-reducing tools — worth noting as a methodological caveat for anyone comparing to the february nursing survey, which didn't mention ai in its framing. representative quotes \"i love this job. i do not love finishing my notes at 9pm after my kids are in bed. if ai fixes that, i'm in.\" — physician, p84 (survey open-ended) \"just don't let 'ai will fix documentation' become the excuse to skip fixing the actual ehr problems underneath it.\" — nurse practitioner, p91 (survey open-ended) recommendations use this survey as the official baseline metric for measuring compass ai's impact on documentation burden and after-hours charting in future re-surveys (e.g., 6 and 12 months post-rollout). note the framing caveat explicitly in any report comparing this dataset to the february nursing survey. follow-ups / open questions schedule a repeat of this exact survey instrument 6 months after ambient scribe ga rollout for comparison. related synthesized into: clinician-experience-documentation-burden.md participants participants — survey — clinician burnout &amp; documentation burden baseline count: 287 roles: physician nurse practitioner physician assistant registered nurse researcher: m. okafor recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-09-23-usability-test-ambient-scribe-v02", "kind": "raw", "title": "Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)", "date": "2025-09-23", "type": "usability-test", "status": "raw", "tags": ["ambient-scribe", "usability", "documentation", "v0.2", "longitudinal"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "path": "raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md", "html": "<h1>Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)</h1>\n<h2>Objective</h2>\n<p>Re-test the ambient scribe after v0.1 fixes (medication dosage accuracy, inline correction, auto-listening, and the draft-retention/Security review from February) to see whether the critical and high findings were resolved.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, simulated patient encounters, 45 min/session — follow-up with 3 returning + 2 new participants</li><li><strong>Researcher:</strong> M. Okafor</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[LOW]</strong> <em>(phi-handling (resolved))</em> The draft-retention issue from v0.1 (critical finding, Feb) has been fixed — drafts now auto-expire from the editable state after 10 minutes of inactivity and the behavior is documented for Compliance; verified in all 5 sessions.</li><li><strong>[MEDIUM]</strong> <em>(accuracy (improved but not resolved))</em> Medication dosage errors dropped from 3/5 to 1/5 sessions — a clear improvement, but the remaining error type (misheard similar-sounding drug names) is a known class of error the team should track going forward.</li><li><strong>[HIGH]</strong> <em>(trust calibration (unchanged))</em> Despite accuracy improvements, all 5 participants still read every line before accepting — the returning 3 participants said their behavior from v0.1 hadn't changed at all in the interim, suggesting trust doesn't shift from accuracy improvements alone without something like a track record or confidence indicator.</li><li><strong>[MEDIUM]</strong> <em>(interaction (resolved))</em> In-place line correction (requested in v0.1) works well; all participants successfully corrected a wrong line without regenerating the full note.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"It's better, no question. But I still read every line, same as last time. Getting it right once doesn't mean I trust it yet.\"</p><p>— Physician, Internal Medicine, P09 (returning from v0.1)</p></blockquote>\n<blockquote><p>\"The fix where I can just click and edit one line? That's the difference between me using this and not.\"</p><p>— Physician, Family Medicine, P11 (returning from v0.1)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Since accuracy fixes alone haven't shifted trust/skim behavior, explore an explicit confidence indicator per line (e.g., highlighting low-confidence transcriptions) as the next trust-building lever, rather than continuing to chase raw accuracy alone.</li><li>Add a specific test/tracking metric for similar-sounding medication name errors going forward, since it's now the dominant remaining error type.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Design and test a per-line confidence indicator concept for v0.3.</li><li>Check with engineering whether a medication name pronunciation dictionary/fine-tune could reduce the sound-alike error class.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)</h1>\n<p><strong>Count:</strong> 5</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician (Family Medicine)</li><li>Physician (Internal Medicine)</li><li>Nurse Practitioner</li></ul>\n<p><strong>Researcher:</strong> M. Okafor</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ambient ai scribe prototype v0.2 (follow-up) ambient-scribe usability documentation v0.2 longitudinal ambient-scribe-widget encounter-view usability test — ambient ai scribe prototype v0.2 (follow-up) objective re-test the ambient scribe after v0.1 fixes (medication dosage accuracy, inline correction, auto-listening, and the draft-retention/security review from february) to see whether the critical and high findings were resolved. method method: moderated usability test, simulated patient encounters, 45 min/session — follow-up with 3 returning + 2 new participants researcher: m. okafor full participant roster: see participants.md in this folder key findings [low] (phi-handling (resolved)) the draft-retention issue from v0.1 (critical finding, feb) has been fixed — drafts now auto-expire from the editable state after 10 minutes of inactivity and the behavior is documented for compliance; verified in all 5 sessions. [medium] (accuracy (improved but not resolved)) medication dosage errors dropped from 3/5 to 1/5 sessions — a clear improvement, but the remaining error type (misheard similar-sounding drug names) is a known class of error the team should track going forward. [high] (trust calibration (unchanged)) despite accuracy improvements, all 5 participants still read every line before accepting — the returning 3 participants said their behavior from v0.1 hadn't changed at all in the interim, suggesting trust doesn't shift from accuracy improvements alone without something like a track record or confidence indicator. [medium] (interaction (resolved)) in-place line correction (requested in v0.1) works well; all participants successfully corrected a wrong line without regenerating the full note. representative quotes \"it's better, no question. but i still read every line, same as last time. getting it right once doesn't mean i trust it yet.\" — physician, internal medicine, p09 (returning from v0.1) \"the fix where i can just click and edit one line? that's the difference between me using this and not.\" — physician, family medicine, p11 (returning from v0.1) recommendations since accuracy fixes alone haven't shifted trust/skim behavior, explore an explicit confidence indicator per line (e.g., highlighting low-confidence transcriptions) as the next trust-building lever, rather than continuing to chase raw accuracy alone. add a specific test/tracking metric for similar-sounding medication name errors going forward, since it's now the dominant remaining error type. follow-ups / open questions design and test a per-line confidence indicator concept for v0.3. check with engineering whether a medication name pronunciation dictionary/fine-tune could reduce the sound-alike error class. related synthesized into: ambient-scribe.md participants participants — usability test — ambient ai scribe prototype v0.2 (follow-up) count: 5 roles: physician (family medicine) physician (internal medicine) nurse practitioner researcher: m. okafor recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-10-07-contextual-inquiry-behavioral-health-sensitive-notes", "kind": "raw", "title": "Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling", "date": "2025-10-07", "type": "contextual-inquiry", "status": "raw", "tags": ["behavioral-health", "42-cfr-part-2", "phi", "sensitive-notes"], "related_components": ["ambient-scribe-widget"], "severity": {}, "path": "raw/2025-10-07-contextual-inquiry-behavioral-health-sensitive-notes/session-notes.md", "html": "<h1>Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling</h1>\n<h2>Objective</h2>\n<p>Understand how behavioral health documentation is currently handled given its extra legal protections, to determine whether/how any Compass AI documentation tools (like the ambient scribe) could safely extend here, if at all.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> In-person shadowing + informal interview, 1 session, 2 hours</li><li><strong>Researcher:</strong> J. Alvarez</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(scope caution)</em> Clinician was firm that any AI tool listening to or drafting behavioral health session notes raises consent and 42 CFR Part 2 questions well beyond what's been addressed for general medical encounters so far — this population should not be included in any near-term ambient scribe rollout without a dedicated legal/consent review.</li><li><strong>[HIGH]</strong> <em>(existing gap)</em> Reiterates the July HIM finding: there is still no structured way to flag a note as Part-2 protected in the EHR, which independently limits any AI feature's ability to know to treat such notes differently even if it wanted to.</li><li><strong>[MEDIUM]</strong> <em>(documentation style)</em> Behavioral health notes are more narrative and clinically nuanced than typical med-surg notes, which the clinician felt would be especially hard for a generic ambient scribe to draft accurately even setting aside the legal question.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"I'm not against AI. I'm against AI listening to a session about someone's substance use history before we've even figured out how to flag that note as protected in the first place.\"</p><p>— Behavioral Health Clinician, P95</p></blockquote>\n<blockquote><p>\"You'd need a completely separate conversation with legal before this unit is anywhere near a pilot.\"</p><p>— Behavioral Health Unit Charge Nurse, P97</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Formally exclude behavioral health and substance use encounters from any ambient scribe pilot scope until a dedicated legal/consent review is completed — recommend this be an explicit, documented scope boundary in the 2026 roadmap, not just an informal assumption.</li><li>Escalate the recurring 'no structured way to flag Part 2 notes' finding (now raised independently in two separate research threads, HIM in July and here) as a standalone platform gap worth fixing regardless of AI plans.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm with Legal whether a consent review for this population is even on a timeline, or needs to be requested.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Behavioral Health Clinician</li><li>Behavioral Health Unit Charge Nurse</li></ul>\n<p><strong>Researcher:</strong> J. Alvarez</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "contextual inquiry — behavioral health unit, sensitive note handling behavioral-health 42-cfr-part-2 phi sensitive-notes ambient-scribe-widget contextual inquiry — behavioral health unit, sensitive note handling objective understand how behavioral health documentation is currently handled given its extra legal protections, to determine whether/how any compass ai documentation tools (like the ambient scribe) could safely extend here, if at all. method method: in-person shadowing + informal interview, 1 session, 2 hours researcher: j. alvarez full participant roster: see participants.md in this folder key findings [high] (scope caution) clinician was firm that any ai tool listening to or drafting behavioral health session notes raises consent and 42 cfr part 2 questions well beyond what's been addressed for general medical encounters so far — this population should not be included in any near-term ambient scribe rollout without a dedicated legal/consent review. [high] (existing gap) reiterates the july him finding: there is still no structured way to flag a note as part-2 protected in the ehr, which independently limits any ai feature's ability to know to treat such notes differently even if it wanted to. [medium] (documentation style) behavioral health notes are more narrative and clinically nuanced than typical med-surg notes, which the clinician felt would be especially hard for a generic ambient scribe to draft accurately even setting aside the legal question. representative quotes \"i'm not against ai. i'm against ai listening to a session about someone's substance use history before we've even figured out how to flag that note as protected in the first place.\" — behavioral health clinician, p95 \"you'd need a completely separate conversation with legal before this unit is anywhere near a pilot.\" — behavioral health unit charge nurse, p97 recommendations formally exclude behavioral health and substance use encounters from any ambient scribe pilot scope until a dedicated legal/consent review is completed — recommend this be an explicit, documented scope boundary in the 2026 roadmap, not just an informal assumption. escalate the recurring 'no structured way to flag part 2 notes' finding (now raised independently in two separate research threads, him in july and here) as a standalone platform gap worth fixing regardless of ai plans. follow-ups / open questions confirm with legal whether a consent review for this population is even on a timeline, or needs to be requested. related synthesized into: scope-boundaries-and-workflow-fit.md participants participants — contextual inquiry — behavioral health unit, sensitive note handling count: 2 roles: behavioral health clinician behavioral health unit charge nurse researcher: j. alvarez recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-10-21-interview-training-department-rollout-change-management", "kind": "raw", "title": "Interview — Training & Education Dept on Rollout/Change Management Planning", "date": "2025-10-21", "type": "interview", "status": "raw", "tags": ["change-management", "training", "rollout"], "related_components": [], "severity": {}, "path": "raw/2025-10-21-interview-training-department-rollout-change-management/session-notes.md", "html": "<h1>Interview — Training &amp; Education Dept on Rollout/Change Management Planning</h1>\n<h2>Objective</h2>\n<p>Understand what a realistic training/rollout plan looks like for the first Compass AI features going to general availability, drawing on lessons from past rollouts.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 40 min</li><li><strong>Researcher:</strong> M. Okafor</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(past rollout lesson)</em> Director pointed to the 2022 CDS alert rollout (also referenced by executives in January) as a cautionary tale specifically because training was a single 20-minute video with no hands-on practice, and adoption suffered as a result — she wants any Compass AI rollout to include live, hands-on sessions instead.</li><li><strong>[MEDIUM]</strong> <em>(champion model)</em> Prefers a 'unit champion' model (1-2 respected staff per unit trained early and deeply, who then support peers) over an all-at-once broadcast rollout, based on past success with an unrelated EHR module rollout in 2023.</li><li><strong>[LOW]</strong> <em>(timing sensitivity)</em> Flagged that rolling out during flu season (Nov-Feb) has historically correlated with poor training attendance and should be avoided if possible for the ambient scribe GA rollout.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"We already know what doesn't work. A video nobody watches and hoping for the best. I don't want to repeat 2022.\"</p><p>— Director of Clinical Training &amp; Education, P99</p></blockquote>\n<blockquote><p>\"Give me two respected nurses per unit, trained early and given actual time to practice, and they'll do more for adoption than any all-staff email ever will.\"</p><p>— Director of Clinical Training &amp; Education, P99</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Build the ambient scribe GA rollout plan around the unit-champion model, and explicitly avoid flu-season timing given the historical attendance pattern.</li><li>Include hands-on practice time in training, not just a recorded overview, directly addressing the 2022 lesson learned.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Get the actual 2022 CDS rollout adoption numbers if they exist, to quantify the lesson rather than rely on recollection.</li><li>Identify candidate unit champions once the GA rollout unit list is finalized.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/rollout-and-change-management.md\">rollout-and-change-management.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Training &amp; Education Dept on Rollout/Change Management Planning</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Director of Clinical Training &amp; Education</li></ul>\n<p><strong>Researcher:</strong> M. Okafor</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "interview — training & education dept on rollout/change management planning change-management training rollout interview — training &amp; education dept on rollout/change management planning objective understand what a realistic training/rollout plan looks like for the first compass ai features going to general availability, drawing on lessons from past rollouts. method method: 1:1 interview, 40 min researcher: m. okafor full participant roster: see participants.md in this folder key findings [medium] (past rollout lesson) director pointed to the 2022 cds alert rollout (also referenced by executives in january) as a cautionary tale specifically because training was a single 20-minute video with no hands-on practice, and adoption suffered as a result — she wants any compass ai rollout to include live, hands-on sessions instead. [medium] (champion model) prefers a 'unit champion' model (1-2 respected staff per unit trained early and deeply, who then support peers) over an all-at-once broadcast rollout, based on past success with an unrelated ehr module rollout in 2023. [low] (timing sensitivity) flagged that rolling out during flu season (nov-feb) has historically correlated with poor training attendance and should be avoided if possible for the ambient scribe ga rollout. representative quotes \"we already know what doesn't work. a video nobody watches and hoping for the best. i don't want to repeat 2022.\" — director of clinical training &amp; education, p99 \"give me two respected nurses per unit, trained early and given actual time to practice, and they'll do more for adoption than any all-staff email ever will.\" — director of clinical training &amp; education, p99 recommendations build the ambient scribe ga rollout plan around the unit-champion model, and explicitly avoid flu-season timing given the historical attendance pattern. include hands-on practice time in training, not just a recorded overview, directly addressing the 2022 lesson learned. follow-ups / open questions get the actual 2022 cds rollout adoption numbers if they exist, to quantify the lesson rather than rely on recollection. identify candidate unit champions once the ga rollout unit list is finalized. related synthesized into: rollout-and-change-management.md participants participants — interview — training &amp; education dept on rollout/change management planning count: 1 roles: director of clinical training &amp; education researcher: m. okafor recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-11-04-usability-test-prior-auth-ai-v2", "kind": "raw", "title": "Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)", "date": "2025-11-04", "type": "usability-test", "status": "raw", "tags": ["prior-auth", "usability", "utilization-management", "v2", "longitudinal"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "path": "raw/2025-11-04-usability-test-prior-auth-ai-v2/session-notes.md", "html": "<h1>Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)</h1>\n<h2>Objective</h2>\n<p>Re-test the prior authorization tool after the outdated-diagnosis-code fix and addition of inline source citations (from April findings), scoped to the 'straightforward' case definition the supervisor helped define.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, 4 case scenarios (2 straightforward, 2 complex), 60 min/session</li><li><strong>Researcher:</strong> J. Alvarez</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[LOW]</strong> <em>(accuracy (resolved))</em> The outdated diagnosis code issue from v1 did not recur in any of the 4 test cases; citations now correctly reference the most recent active diagnosis.</li><li><strong>[LOW]</strong> <em>(transparency (resolved))</em> Inline source citations were well-received and used actively — 3 of 4 participants clicked into at least one citation to verify before accepting, which participants described as appropriately fast rather than as friction.</li><li><strong>[MEDIUM]</strong> <em>(scope boundary)</em> On the 2 complex cases (intentionally outside the agreed 'straightforward' scope), the tool still struggled, confirming the supervisor's April instinct that scope limitation was the right call rather than something to fix immediately.</li><li><strong>[MEDIUM]</strong> <em>(time savings (confirmed))</em> For straightforward cases, drafting time was confirmed at ~5 minutes vs. ~15 minutes manual, consistent with April's estimate, now measured directly rather than estimated.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"This is what I wanted in April. It shows its work, it got the codes right, and it didn't try to be a hero on the complicated case — it basically said 'this one's harder, take the wheel.'\"</p><p>— Utilization Review Nurse (supervisor), P17 (returning from v1)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Recommend this tool for pilot expansion within the agreed straightforward-case scope; do not expand scope to complex cases without a separate, dedicated round of model work and testing.</li><li>Use the clear before/after (v1 to v2) data here as a model for how to communicate iterative improvement to executives, tying back to the January request for shared success metrics.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Define what 'pilot expansion' means concretely — how many nurses, how many weeks, what's the go/no-go metric.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/prior-authorization.md\">prior-authorization.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)</h1>\n<p><strong>Count:</strong> 4</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Utilization Review Nurse</li><li>Utilization Review Nurse</li><li>Utilization Review Nurse (supervisor)</li></ul>\n<p><strong>Researcher:</strong> J. Alvarez</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ai-assisted prior authorization drafting (v2, follow-up) prior-auth usability utilization-management v2 longitudinal prior-auth-drafting-panel usability test — ai-assisted prior authorization drafting (v2, follow-up) objective re-test the prior authorization tool after the outdated-diagnosis-code fix and addition of inline source citations (from april findings), scoped to the 'straightforward' case definition the supervisor helped define. method method: moderated usability test, 4 case scenarios (2 straightforward, 2 complex), 60 min/session researcher: j. alvarez full participant roster: see participants.md in this folder key findings [low] (accuracy (resolved)) the outdated diagnosis code issue from v1 did not recur in any of the 4 test cases; citations now correctly reference the most recent active diagnosis. [low] (transparency (resolved)) inline source citations were well-received and used actively — 3 of 4 participants clicked into at least one citation to verify before accepting, which participants described as appropriately fast rather than as friction. [medium] (scope boundary) on the 2 complex cases (intentionally outside the agreed 'straightforward' scope), the tool still struggled, confirming the supervisor's april instinct that scope limitation was the right call rather than something to fix immediately. [medium] (time savings (confirmed)) for straightforward cases, drafting time was confirmed at ~5 minutes vs. ~15 minutes manual, consistent with april's estimate, now measured directly rather than estimated. representative quotes \"this is what i wanted in april. it shows its work, it got the codes right, and it didn't try to be a hero on the complicated case — it basically said 'this one's harder, take the wheel.'\" — utilization review nurse (supervisor), p17 (returning from v1) recommendations recommend this tool for pilot expansion within the agreed straightforward-case scope; do not expand scope to complex cases without a separate, dedicated round of model work and testing. use the clear before/after (v1 to v2) data here as a model for how to communicate iterative improvement to executives, tying back to the january request for shared success metrics. follow-ups / open questions define what 'pilot expansion' means concretely — how many nurses, how many weeks, what's the go/no-go metric. related synthesized into: prior-authorization.md participants participants — usability test — ai-assisted prior authorization drafting (v2, follow-up) count: 4 roles: utilization review nurse utilization review nurse utilization review nurse (supervisor) researcher: j. alvarez recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-11-18-accessibility-audit-mobile-clinician-app", "kind": "raw", "title": "Accessibility Audit — Mobile Clinician App (Low Vision & Motor Impairment Focus)", "date": "2025-11-18", "type": "accessibility-audit", "status": "raw", "tags": ["accessibility", "mobile", "low-vision", "motor-impairment"], "related_components": ["mobile-app-alert-list", "alert-triage-queue"], "severity": {}, "path": "raw/2025-11-18-accessibility-audit-mobile-clinician-app/session-notes.md", "html": "<h1>Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</h1>\n<h2>Objective</h2>\n<p>Assess mobile clinician app accessibility for low vision and motor impairment specifically, ahead of the app becoming a secondary surface for Compass AI features like alert triage.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Manual audit + 2 participant walkthroughs (low vision, limited fine motor control), iOS + Android</li><li><strong>Researcher:</strong> J. Alvarez</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(touch target size)</em> Several action icons in the alert triage list (a Compass AI surface, per the August findings) are 32x32px, below the 44x44px minimum recommended for reliable use by the motor-impairment participant, who mis-tapped adjacent icons repeatedly.</li><li><strong>[HIGH]</strong> <em>(text scaling)</em> App text does not respect the OS-level dynamic text size setting; the low-vision participant's usual 200% system text setting had no effect within the app, forcing reliance on pinch-zoom which broke the layout.</li><li><strong>[MEDIUM]</strong> <em>(voiceover labeling)</em> Several icon-only buttons lack accessible labels, announced only as 'button' by VoiceOver.</li><li><strong>[MEDIUM]</strong> <em>(color-only status)</em> Same red/yellow/green-only status pattern flagged in the March legacy audit also appears here, suggesting it may be a broader design system gap rather than isolated to one surface.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"I set my phone to 200% text everywhere else. In this app it's like that setting doesn't exist.\"</p><p>— Clinician, low vision, P103</p></blockquote>\n<blockquote><p>\"Those little icons in the alert list, I hit the wrong one probably one in four times. On a good day.\"</p><p>— Clinician, limited fine motor control, P105</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Fix touch target sizing on the alert triage icons as a priority, since it directly affects a live Compass AI feature (linking to August findings).</li><li>Implement support for OS-level dynamic text sizing; this is likely a systemic app issue, not specific to any one screen.</li><li>Note the recurring color-only status pattern (now found in 3 separate audits: legacy console, design system, mobile app) as a candidate for a single, org-wide design system fix rather than three separate ones.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm whether the color-only status issue has a single shared root component across surfaces, which would make for one fix instead of three.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/accessibility-cross-cutting.md\">accessibility-cross-cutting.md</a></li></ul><h2>Participants</h2><h1>Participants — Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Clinician (low vision)</li><li>Clinician (limited fine motor control, uses stylus)</li></ul>\n<p><strong>Researcher:</strong> J. Alvarez</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "accessibility audit — mobile clinician app (low vision & motor impairment focus) accessibility mobile low-vision motor-impairment mobile-app-alert-list alert-triage-queue accessibility audit — mobile clinician app (low vision &amp; motor impairment focus) objective assess mobile clinician app accessibility for low vision and motor impairment specifically, ahead of the app becoming a secondary surface for compass ai features like alert triage. method method: manual audit + 2 participant walkthroughs (low vision, limited fine motor control), ios + android researcher: j. alvarez full participant roster: see participants.md in this folder key findings [high] (touch target size) several action icons in the alert triage list (a compass ai surface, per the august findings) are 32x32px, below the 44x44px minimum recommended for reliable use by the motor-impairment participant, who mis-tapped adjacent icons repeatedly. [high] (text scaling) app text does not respect the os-level dynamic text size setting; the low-vision participant's usual 200% system text setting had no effect within the app, forcing reliance on pinch-zoom which broke the layout. [medium] (voiceover labeling) several icon-only buttons lack accessible labels, announced only as 'button' by voiceover. [medium] (color-only status) same red/yellow/green-only status pattern flagged in the march legacy audit also appears here, suggesting it may be a broader design system gap rather than isolated to one surface. representative quotes \"i set my phone to 200% text everywhere else. in this app it's like that setting doesn't exist.\" — clinician, low vision, p103 \"those little icons in the alert list, i hit the wrong one probably one in four times. on a good day.\" — clinician, limited fine motor control, p105 recommendations fix touch target sizing on the alert triage icons as a priority, since it directly affects a live compass ai feature (linking to august findings). implement support for os-level dynamic text sizing; this is likely a systemic app issue, not specific to any one screen. note the recurring color-only status pattern (now found in 3 separate audits: legacy console, design system, mobile app) as a candidate for a single, org-wide design system fix rather than three separate ones. follow-ups / open questions confirm whether the color-only status issue has a single shared root component across surfaces, which would make for one fix instead of three. related synthesized into: accessibility-cross-cutting.md participants participants — accessibility audit — mobile clinician app (low vision &amp; motor impairment focus) count: 2 roles: clinician (low vision) clinician (limited fine motor control, uses stylus) researcher: j. alvarez recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-12-02-survey-allstaff-ai-readiness-pulse", "kind": "raw", "title": "Survey — All-Staff AI Readiness Pulse Survey", "date": "2025-12-02", "type": "survey", "status": "raw", "tags": ["survey", "organizational-readiness", "pulse", "year-end"], "related_components": ["patient-chatbot-widget"], "severity": {}, "path": "raw/2025-12-02-survey-allstaff-ai-readiness-pulse/session-notes.md", "html": "<h1>Survey — All-Staff AI Readiness Pulse Survey</h1>\n<h2>Objective</h2>\n<p>Take an org-wide temperature check on AI readiness/sentiment heading into 2026, as input to roadmap prioritization and communications planning.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Org-wide anonymous pulse survey, 10 questions</li><li><strong>Researcher:</strong> M. Okafor</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(awareness gap)</em> Only 34% of non-clinical staff reported being aware Compass AI initiatives were underway at all, versus 71% of clinical staff — suggesting internal communications have been clinically focused and may need broadening if non-clinical rollouts (e.g., scheduling) proceed.</li><li><strong>[MEDIUM]</strong> <em>(sentiment trend (directional, not causal))</em> Among clinical respondents, favorable sentiment toward AI-assisted documentation was somewhat higher than the March-ish baseline period, though this survey used different question wording than February's, so it's directional context rather than a clean comparison.</li><li><strong>[LOW]</strong> <em>(top requested feature)</em> When asked what AI feature they'd most want next, 'appointment scheduling help' was the top write-in among non-clinical/admin staff, and 'documentation time savings' remained the top pick among clinical staff — consistent with priorities identified all year.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>\"I hear about this AI stuff from clinical friends but nobody's told admin staff what's actually happening or if it affects us.\"</p><p>— Non-clinical/administrative staff, P112 (survey open-ended)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Broaden internal communications about Compass AI to non-clinical staff specifically before any admin-facing pilot (e.g., scheduling chatbot) goes live, given the awareness gap found here.</li><li>If a clean sentiment trend is wanted for 2026 reporting, re-run the exact February nursing survey instrument rather than a new pulse survey, to get a true apples-to-appl
