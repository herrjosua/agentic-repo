t&#x27;s history-driven risk — an experience-weighted judgment call. This rests on one coordinator, P81: &quot;I wanted to tell it &#x27;no, this one&#x27;s more urgent because I know this patient&#x27;s history,&#x27; but there was nowhere to put that.&quot; Participants saw the ranking weight recency more heavily than their own sense of clinical risk; 4 of 5 disagreed with the AI&#x27;s top-3 ranking on at least one of three test queues. There&#x27;s no way for a coordinator&#x27;s override to feed back into the ranking. Triage of a 20-item queue was still faster with the AI ranking than with a chronological queue in this simulated test (avg 6.5 min vs. 9 min).</p>", "searchText": "care coordinators' mental model of alert ranking care-coordination alert-triage alert-fatigue workflow project-care-coordination overview evidence basis: inferred. built from the ranking disagreements and override gap in raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md:28-30,37 ; how coordinators think about ranking is the designer&#x27;s reading, not something participants were asked. covers how care coordinators conceptualize &quot;ranking&quot; in the alert-triage queue versus what they saw it do, drawn from the aug 2025 usability test&#x27;s override-disagreement pattern. model the designer&#x27;s paraphrase of the coordinator view: the system should defer to the coordinator&#x27;s sense of a patient&#x27;s history-driven risk — an experience-weighted judgment call. this rests on one coordinator, p81: &quot;i wanted to tell it &#x27;no, this one&#x27;s more urgent because i know this patient&#x27;s history,&#x27; but there was nowhere to put that.&quot; participants saw the ranking weight recency more heavily than their own sense of clinical risk; 4 of 5 disagreed with the ai&#x27;s top-3 ranking on at least one of three test queues. there&#x27;s no way for a coordinator&#x27;s override to feed back into the ranking. triage of a 20-item queue was still faster with the ai ranking than with a chronological queue in this simulated test (avg 6.5 min vs. 9 min)."}, {"id": "deliverable:mental-models/example-mental-model", "kind": "deliverable", "title": "Workspace Setup — Mental Model", "date": "2026-02-13", "type": "mental-models", "status": "in-review", "tags": ["onboarding", "mental-model", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../mental-models/example-mental-model.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Covers how new admins conceptualize &quot;setting up a workspace&quot; before they&#x27;ve used Fernway, versus how the system actually models the task.</p>\n<h2>Model</h2>\n<p>Admins think of setup as one task with optional extras (&quot;connect stuff if I want to&quot;). The system actually models it as a required linear sequence where several &quot;extras&quot; (like calendar connection) gate later functionality. This mismatch is the root cause behind the step-3 confusion seen across research.</p>", "searchText": "workspace setup — mental model onboarding mental-model project-onboarding overview covers how new admins conceptualize &quot;setting up a workspace&quot; before they&#x27;ve used fernway, versus how the system actually models the task. model admins think of setup as one task with optional extras (&quot;connect stuff if i want to&quot;). the system actually models it as a required linear sequence where several &quot;extras&quot; (like calendar connection) gate later functionality. this mismatch is the root cause behind the step-3 confusion seen across research."}, {"id": "deliverable:mindsets/example-mindset", "kind": "deliverable", "title": "Time-Pressed First-Time Admin", "date": "2026-02-13", "type": "mindsets", "status": "final", "tags": ["onboarding", "mindset", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../mindsets/example-mindset.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Not a persona — a mindset that shows up across multiple admin personas. Defined by low time budget and a &quot;just get it done&quot; orientation, regardless of technical skill level.</p>\n<h2>Implications</h2>\n<p>Design for skimmability over completeness: fewer required decisions, clearer signaling of what&#x27;s mandatory, and no dead-ends that force starting over.</p>", "searchText": "time-pressed first-time admin onboarding mindset project-onboarding overview not a persona — a mindset that shows up across multiple admin personas. defined by low time budget and a &quot;just get it done&quot; orientation, regardless of technical skill level. implications design for skimmability over completeness: fewer required decisions, clearer signaling of what&#x27;s mandatory, and no dead-ends that force starting over."}, {"id": "deliverable:mindsets/skeptical-verifier", "kind": "deliverable", "title": "The Skeptical Verifier", "date": "2025-12-01", "type": "mindsets", "status": "final", "tags": ["trust-in-ai", "ambient-scribe", "prior-auth", "coding", "him", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../mindsets/skeptical-verifier.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Not a persona — an attitudinal segment that recurs across physicians, nurses, and HIM coders regardless of department or identity, first named explicitly as a pattern in <code>him-coding-and-billing.md</code>&#x27;s &quot;show your work&quot; observation.</p>\n<h2>Implications</h2>\n<p>Doesn&#x27;t want AI output hidden or auto-applied — wants citations, confidence signals, or an audit-visible human-decision boundary before trusting a draft, whether that draft is a prior-auth justification, a coding suggestion, or a transcribed note. Design response should default to visible, checkable provenance rather than trying to earn trust through accuracy alone — this echoes the ambient-scribe finding that accuracy improvements alone didn&#x27;t change reading behavior for this same kind of user.</p>", "searchText": "the skeptical verifier trust-in-ai ambient-scribe prior-auth coding him project-cross-cutting overview not a persona — an attitudinal segment that recurs across physicians, nurses, and him coders regardless of department or identity, first named explicitly as a pattern in him-coding-and-billing.md &#x27;s &quot;show your work&quot; observation. implications doesn&#x27;t want ai output hidden or auto-applied — wants citations, confidence signals, or an audit-visible human-decision boundary before trusting a draft, whether that draft is a prior-auth justification, a coding suggestion, or a transcribed note. design response should default to visible, checkable provenance rather than trying to earn trust through accuracy alone — this echoes the ambient-scribe finding that accuracy improvements alone didn&#x27;t change reading behavior for this same kind of user."}, {"id": "deliverable:journey-maps/example-journey-map", "kind": "deliverable", "title": "New Admin Onboarding — Journey Map", "date": "2026-02-14", "type": "journey-maps", "status": "final", "tags": ["onboarding", "journey-map", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../journey-maps/example-journey-map.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Follows Dana from receiving the &quot;set up Fernway&quot; task through first successful workspace creation.</p>\n<h2>Stages</h2>\n<ol><li><strong>Step 1 (Signup)</strong> — Confident, low effort.</li><li><strong>Steps 2–3 (Basics, Connect calendar)</strong> — Still confident; pauses briefly at calendar connection, unsure if required, proceeds anyway.</li><li><strong>Step 4 (Invite your team)</strong> — Anxious — worried invites are sending before she&#x27;s ready. Stalls here longest of any step.</li><li><strong>Steps 5–6 (Preferences, Review &amp; finish)</strong> — Relief; the hard part felt over.</li><li><strong>Completion</strong> — Mild surprise the setup is actually done — no strong confirmation moment.</li></ol>", "searchText": "new admin onboarding — journey map onboarding journey-map project-onboarding overview follows dana from receiving the &quot;set up fernway&quot; task through first successful workspace creation. stages step 1 (signup) — confident, low effort. steps 2–3 (basics, connect calendar) — still confident; pauses briefly at calendar connection, unsure if required, proceeds anyway. step 4 (invite your team) — anxious — worried invites are sending before she&#x27;s ready. stalls here longest of any step. steps 5–6 (preferences, review &amp; finish) — relief; the hard part felt over. completion — mild surprise the setup is actually done — no strong confirmation moment."}, {"id": "deliverable:journey-maps/longitudinal-physician-ambient-scribe", "kind": "deliverable", "title": "The Longitudinal Physician — Ambient Scribe Journey (v0.1 to Post-GA)", "date": "2026-02-27", "type": "journey-maps", "status": "final", "tags": ["ambient-scribe", "persona", "journey-map", "longitudinal", "trust-in-ai", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../journey-maps/longitudinal-physician-ambient-scribe.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Follows the longitudinal physician persona, modeled on participant P09 in the three ambient-scribe test rounds (v0.1, v0.2, GA candidate). The post-GA stage is not P09&#x27;s observed experience: it is inferred from other participants in the 2026-02-10 and 2026-02-17 sessions.</p>\n<h2>Stages</h2>\n<ol><li><strong>v0.1 (Feb 2025)</strong> — Skeptical, reads every generated line: &quot;I have to read every word anyway right now, so where&#x27;s the time savings?&quot; Across the round, medication dosages were missed or garbled in 3 of 5 sessions, which physicians called disqualifying for direct sign-off.</li><li><strong>v0.2 (Sep 2025)</strong> — Errors drop, but reading behavior doesn&#x27;t — still reads every line despite the accuracy gain: &quot;It&#x27;s better, no question. But I still read every line, same as last time. Getting it right once doesn&#x27;t mean I trust it yet.&quot;</li><li><strong>GA Candidate (Jan 2026)</strong> — Per-line confidence highlighting introduces the first behavior change: begins skimming high-confidence lines for the first time. Sound-alike medication names are still a known, monitored gap.</li><li><strong>Post-GA (Feb 2026, inferred from other participants)</strong> — The dedicated medication-safety flag reads as more actionable than generic confidence highlighting — but only if unflagged lines don&#x27;t get over-trusted as a result. Session lock during dictation remains a trust risk entirely unrelated to transcription quality: clinicians assumed their draft was lost when it wasn&#x27;t (&quot;I genuinely thought I&#x27;d lost it&quot;).</li></ol>", "searchText": "the longitudinal physician — ambient scribe journey (v0.1 to post-ga) ambient-scribe persona journey-map longitudinal trust-in-ai project-ambient-scribe overview follows the longitudinal physician persona, modeled on participant p09 in the three ambient-scribe test rounds (v0.1, v0.2, ga candidate). the post-ga stage is not p09&#x27;s observed experience: it is inferred from other participants in the 2026-02-10 and 2026-02-17 sessions. stages v0.1 (feb 2025) — skeptical, reads every generated line: &quot;i have to read every word anyway right now, so where&#x27;s the time savings?&quot; across the round, medication dosages were missed or garbled in 3 of 5 sessions, which physicians called disqualifying for direct sign-off. v0.2 (sep 2025) — errors drop, but reading behavior doesn&#x27;t — still reads every line despite the accuracy gain: &quot;it&#x27;s better, no question. but i still read every line, same as last time. getting it right once doesn&#x27;t mean i trust it yet.&quot; ga candidate (jan 2026) — per-line confidence highlighting introduces the first behavior change: begins skimming high-confidence lines for the first time. sound-alike medication names are still a known, monitored gap. post-ga (feb 2026, inferred from other participants) — the dedicated medication-safety flag reads as more actionable than generic confidence highlighting — but only if unflagged lines don&#x27;t get over-trusted as a result. session lock during dictation remains a trust risk entirely unrelated to transcription quality: clinicians assumed their draft was lost when it wasn&#x27;t (&quot;i genuinely thought i&#x27;d lost it&quot;)."}, {"id": "deliverable:thumbnails/example-thumbnail", "kind": "deliverable", "title": "Workspace Setup Screen — Thumbnail Explorations", "date": "2026-02-17", "type": "thumbnails", "status": "draft", "tags": ["onboarding", "thumbnails", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../thumbnails/example-thumbnail.md", "corrections": [], "html": "<h2>Concept</h2>\n<p>Six quick sketches exploring how to make it clear that invites don&#x27;t send until the whole wizard is submitted.</p>\n<h2>Options considered</h2>\n<ol><li>Explicit &quot;Invites will send when you finish setup&quot; banner — carried forward.</li><li>A draft/preview list with a visible &quot;not sent yet&quot; state — carried forward.</li><li>Moving invites to the very last step — dropped, breaks existing step order research already validated elsewhere.</li></ol>", "searchText": "workspace setup screen — thumbnail explorations onboarding thumbnails project-onboarding concept six quick sketches exploring how to make it clear that invites don&#x27;t send until the whole wizard is submitted. options considered explicit &quot;invites will send when you finish setup&quot; banner — carried forward. a draft/preview list with a visible &quot;not sent yet&quot; state — carried forward. moving invites to the very last step — dropped, breaks existing step order research already validated elsewhere."}, {"id": "deliverable:thumbnails/medication-flag-placement-explorations", "kind": "deliverable", "title": "Sound-Alike Medication Flag — Placement Explorations", "date": "2026-02-08", "type": "thumbnails", "status": "final", "tags": ["ambient-scribe", "medication-safety", "thumbnails", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../thumbnails/medication-flag-placement-explorations.md", "corrections": [], "html": "<h2>Concept</h2>\n<p>Quick sketches exploring where the sound-alike-medication flag should sit relative to the medication name, ahead of the 2026-02-10 concept test.</p>\n<h2>Options considered</h2>\n<ol><li>Inline pill immediately after the medication name — carried forward; won 5:1 in testing since participants didn&#x27;t want to look away from the text.</li><li>Right-hand margin badge, mirroring the layout of other dashboard flags — tested, lost; required a separate glance that broke reading flow.</li><li>Modal interrupt on encountering a flagged line — dropped before testing; too disruptive for a signal meant to prompt verification, not force a stop.</li></ol>", "searchText": "sound-alike medication flag — placement explorations ambient-scribe medication-safety thumbnails project-ambient-scribe concept quick sketches exploring where the sound-alike-medication flag should sit relative to the medication name, ahead of the 2026-02-10 concept test. options considered inline pill immediately after the medication name — carried forward; won 5:1 in testing since participants didn&#x27;t want to look away from the text. right-hand margin badge, mirroring the layout of other dashboard flags — tested, lost; required a separate glance that broke reading flow. modal interrupt on encountering a flagged line — dropped before testing; too disruptive for a signal meant to prompt verification, not force a stop."}, {"id": "deliverable:wireframes/ambient-scribe-medication-flag", "kind": "deliverable", "title": "Ambient Scribe — Sound-Alike Medication Flag", "date": "2026-02-24", "type": "wireframes", "status": "in-review", "tags": ["ambient-scribe", "medication-safety", "wireframe", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../wireframes/ambient-scribe-medication-flag.md", "corrections": [], "html": "<h1>Ambient Scribe — Sound-Alike Medication Flag</h1>\n<h2>Description</h2>\n<p>Lo-fi layout for the distinct sound-alike-medication flag validated in the 2026-02-10 concept test. Applies to the <code>ambient-scribe-widget</code> component&#x27;s draft-review surface, inside the <code>encounter-view</code> screen. Separate from the existing generic <code>confidence-highlighted</code> variant — this flag reads specifically as &quot;check this drug name,&quot; not &quot;low confidence generally.&quot;</p>\n<h2>Details</h2>\n<ul><li><strong>Placement:</strong> inline, immediately after the medication name — tested 5:1 over a right-hand margin badge, since participants didn&#x27;t want to look away from the text.</li><li><strong>Visual treatment:</strong> small amber pill-shaped badge, distinct in shape and color from the existing subtle low-confidence underline, so the two signals are never visually conflated.</li><li><strong>Copy:</strong> short on-hover/on-tap label — &quot;Possible sound-alike medication name — verify before signing&quot; — worded to prompt verification, not to assert an error.</li><li><strong>Adjacent messaging (new):</strong> a one-time inline tip, shown the first time a clinician encounters the flag, stating that lines <em>without</em> this flag still warrant normal review — directly addressing the over-trust-on-unflagged-lines risk found in 2 of 6 concept-test participants.</li><li><strong>Open item:</strong> false-positive tolerance testing (2026-02-10) suggests the underlying detection threshold can run looser than strict-precision defaults without frustrating clinicians — final threshold tuning is an engineering/detection decision, not a layout decision, and is out of scope for this wireframe.</li></ul>", "searchText": "ambient scribe — sound-alike medication flag ambient-scribe medication-safety wireframe project-ambient-scribe ambient scribe — sound-alike medication flag description lo-fi layout for the distinct sound-alike-medication flag validated in the 2026-02-10 concept test. applies to the ambient-scribe-widget component&#x27;s draft-review surface, inside the encounter-view screen. separate from the existing generic confidence-highlighted variant — this flag reads specifically as &quot;check this drug name,&quot; not &quot;low confidence generally.&quot; details placement: inline, immediately after the medication name — tested 5:1 over a right-hand margin badge, since participants didn&#x27;t want to look away from the text. visual treatment: small amber pill-shaped badge, distinct in shape and color from the existing subtle low-confidence underline, so the two signals are never visually conflated. copy: short on-hover/on-tap label — &quot;possible sound-alike medication name — verify before signing&quot; — worded to prompt verification, not to assert an error. adjacent messaging (new): a one-time inline tip, shown the first time a clinician encounters the flag, stating that lines without this flag still warrant normal review — directly addressing the over-trust-on-unflagged-lines risk found in 2 of 6 concept-test participants. open item: false-positive tolerance testing (2026-02-10) suggests the underlying detection threshold can run looser than strict-precision defaults without frustrating clinicians — final threshold tuning is an engineering/detection decision, not a layout decision, and is out of scope for this wireframe."}, {"id": "deliverable:wireframes/workspace-setup-step4-invite-team", "kind": "deliverable", "title": "Workspace Setup — Step 4 (Invite Your Team) Wireframe", "date": "2026-02-19", "type": "wireframes", "status": "in-review", "tags": ["onboarding", "wireframe", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../wireframes/workspace-setup-step4-invite-team.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Lo-fi layout for the reworked step 4 (&quot;Invite your team&quot;), incorporating the &quot;not sent yet&quot; banner and draft invite list from the thumbnail exploration.</p>\n<h2>Notes</h2>\n<p>Banner sits above the invite input, persistent until submit. Draft list shows entered emails with a &quot;Draft — not sent&quot; tag next to each.</p>", "searchText": "workspace setup — step 4 (invite your team) wireframe onboarding wireframe project-onboarding overview lo-fi layout for the reworked step 4 (&quot;invite your team&quot;), incorporating the &quot;not sent yet&quot; banner and draft invite list from the thumbnail exploration. notes banner sits above the invite input, persistent until submit. draft list shows entered emails with a &quot;draft — not sent&quot; tag next to each."}, {"id": "deliverable:user-flows/ambient-scribe-session-lock-recovery", "kind": "deliverable", "title": "Ambient Scribe — Session Lock Recovery", "date": "2026-02-25", "type": "user-flows", "status": "in-review", "tags": ["ambient-scribe", "sso", "mfa", "user-flow", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": "Jordan Lee", "path": "../user-flows/ambient-scribe-session-lock-recovery.md", "corrections": [], "html": "<h1>Ambient Scribe — Session Lock Recovery</h1>\n<h2>Description</h2>\n<p><strong>Evidence basis:</strong> Observed. The problem this flow responds to is from <code>raw/2026-02-17-session-lock-during-dictation/session-notes.md:38-51</code>, read with that folder&#x27;s <code>correction-2026-09-27.md:40-43</code>; the framing note&#x27;s cause is the session&#x27;s own &quot;likely&quot; inference (<code>:45-48</code>). The flow itself is a design response and hasn&#x27;t been tested.</p>\n<p>Response to the 2026-02-17 contextual inquiry finding that a session lock mid-recording currently reads as silent draft loss. Covers the <code>encounter-view</code>/<code>ambient-scribe-widget</code> interaction from the moment the idle timeout fires through resumed dictation, replacing today&#x27;s silent freeze with an explicit state. Per IT Security (interviewed in that session), the 10-minute idle-timeout policy itself is fixed and out of scope — this flow only changes what the UI communicates during that window, not when it triggers.</p>\n<h2>Details</h2>\n<ol><li><strong>Recording (normal state)</strong> — <code>ambient-scribe-widget</code> in <code>recording</code> state, <code>encounter-view</code> in <code>default</code> state, unchanged from today.</li><li><strong>Idle timeout fires → Paused (new state)</strong> — <code>encounter-view</code> moves to <code>locked</code>; <code>ambient-scribe-widget</code> moves to a new <code>paused-preserved</code> state showing &quot;Session paused — your draft is saved. Re-authenticate to resume.&quot; Recording audio stops; draft is not discarded client- or server-side. This replaces today&#x27;s silent freeze, which all 4 observed clinicians misread as data loss (see <code>research/raw/2026-02-17-session-lock-during-dictation/correction-2026-09-27.md</code>).</li><li><strong>Re-authenticate → Resume</strong> — on successful SSO/MFA re-auth, <code>encounter-view</code> returns to <code>default</code>, <code>ambient-scribe-widget</code> returns to <code>recording</code> (if the clinician chooses to continue) or <code>reviewing-draft</code> (if they&#x27;d rather review what&#x27;s captured so far first). The preserved draft is visible immediately on return — no re-dictation needed.</li></ol>\n<ul><li><strong>Explicitly out of scope:</strong> changing the idle-timeout duration, or any cross-feature timeout behavior beyond ambient scribe (flagged as a follow-up question in the source session, not resolved here).</li><li><strong>Framing note carried from research:</strong> copy in step 2 should read as an expected safety behavior, not an unrelated login interruption — the source session found clinicians already re-authenticate frequently for unrelated reasons and perceive a lock during dictation as &quot;one more annoying re-login,&quot; which it judged likely drives the abandon-and-redictate behavior as much as the missing UI does.</li></ul>", "searchText": "ambient scribe — session lock recovery ambient-scribe sso mfa user-flow project-ambient-scribe ambient scribe — session lock recovery description evidence basis: observed. the problem this flow responds to is from raw/2026-02-17-session-lock-during-dictation/session-notes.md:38-51 , read with that folder&#x27;s correction-2026-09-27.md:40-43 ; the framing note&#x27;s cause is the session&#x27;s own &quot;likely&quot; inference ( :45-48 ). the flow itself is a design response and hasn&#x27;t been tested. response to the 2026-02-17 contextual inquiry finding that a session lock mid-recording currently reads as silent draft loss. covers the encounter-view / ambient-scribe-widget interaction from the moment the idle timeout fires through resumed dictation, replacing today&#x27;s silent freeze with an explicit state. per it security (interviewed in that session), the 10-minute idle-timeout policy itself is fixed and out of scope — this flow only changes what the ui communicates during that window, not when it triggers. details recording (normal state) — ambient-scribe-widget in recording state, encounter-view in default state, unchanged from today. idle timeout fires → paused (new state) — encounter-view moves to locked ; ambient-scribe-widget moves to a new paused-preserved state showing &quot;session paused — your draft is saved. re-authenticate to resume.&quot; recording audio stops; draft is not discarded client- or server-side. this replaces today&#x27;s silent freeze, which all 4 observed clinicians misread as data loss (see research/raw/2026-02-17-session-lock-during-dictation/correction-2026-09-27.md ). re-authenticate → resume — on successful sso/mfa re-auth, encounter-view returns to default , ambient-scribe-widget returns to recording (if the clinician chooses to continue) or reviewing-draft (if they&#x27;d rather review what&#x27;s captured so far first). the preserved draft is visible immediately on return — no re-dictation needed. explicitly out of scope: changing the idle-timeout duration, or any cross-feature timeout behavior beyond ambient scribe (flagged as a follow-up question in the source session, not resolved here). framing note carried from research: copy in step 2 should read as an expected safety behavior, not an unrelated login interruption — the source session found clinicians already re-authenticate frequently for unrelated reasons and perceive a lock during dictation as &quot;one more annoying re-login,&quot; which it judged likely drives the abandon-and-redictate behavior as much as the missing ui does."}, {"id": "deliverable:user-flows/onboarding-flow", "kind": "deliverable", "title": "Onboarding Flow — v2", "date": "2026-02-20", "type": "user-flows", "status": "in-review", "tags": ["onboarding", "user-flow", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../user-flows/onboarding-flow.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Signup through first workspace created, v2 (post-research revisions).</p>\n<h2>Steps</h2>\n<p>Canonical step numbering for the onboarding wizard — Signup counts as step 1. Other onboarding records use these numbers.</p>\n<ol><li>Step 1 — Signup</li><li>Step 2 — Basics (workspace name, team size)</li><li>Step 3 — Connect calendar (now clearly marked required)</li><li>Step 4 — Invite your team (now shows draft/not-sent state)</li><li>Step 5 — Preferences</li><li>Step 6 — Review &amp; finish</li></ol>", "searchText": "onboarding flow — v2 onboarding user-flow project-onboarding overview signup through first workspace created, v2 (post-research revisions). steps canonical step numbering for the onboarding wizard — signup counts as step 1. other onboarding records use these numbers. step 1 — signup step 2 — basics (workspace name, team size) step 3 — connect calendar (now clearly marked required) step 4 — invite your team (now shows draft/not-sent state) step 5 — preferences step 6 — review &amp; finish"}, {"id": "deliverable:wireflows/alert-triage-override-reason-capture", "kind": "deliverable", "title": "Alert Triage Override — Reason-Capture Wireflow", "date": "2025-09-15", "type": "wireflows", "status": "in-review", "tags": ["care-coordination", "alert-triage", "alert-fatigue", "wireflow", "workflow", "project-care-coordination"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../wireflows/alert-triage-override-reason-capture.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Combines the override-reason-capture flow logic with its screens, directly answering the Aug 2025 usability test&#x27;s recommendation that overrides currently lose the &quot;why&quot;. The study recommended capturing it both to improve the model and to give coordinators a sense of agency the current design lacks. The study&#x27;s supervisor raised a separate concern: that speed gains could mask coordinators rubber-stamping the AI order without real judgment.</p>\n<h2>Flow + screens</h2>\n<p><code>alert-triage-queue</code> (ranked list) -&gt; coordinator disagrees with a rank -&gt; taps &quot;Override&quot; -&gt; reason-capture modal opens (short reason list: patient-history risk / recency not clinically relevant / other + free text) -&gt; confirm -&gt; queue re-sorts, overridden item shows a small &quot;reviewed&quot; marker -&gt; reason logged for model-tuning review, not surfaced to other coordinators. Skip-reason branch: coordinator dismisses the modal without selecting a reason -&gt; override still applies, but is flagged in the model-tuning log as &quot;reason not captured&quot; rather than silently treated the same as a reasoned override.</p>", "searchText": "alert triage override — reason-capture wireflow care-coordination alert-triage alert-fatigue wireflow workflow project-care-coordination overview combines the override-reason-capture flow logic with its screens, directly answering the aug 2025 usability test&#x27;s recommendation that overrides currently lose the &quot;why&quot;. the study recommended capturing it both to improve the model and to give coordinators a sense of agency the current design lacks. the study&#x27;s supervisor raised a separate concern: that speed gains could mask coordinators rubber-stamping the ai order without real judgment. flow + screens alert-triage-queue (ranked list) -&gt; coordinator disagrees with a rank -&gt; taps &quot;override&quot; -&gt; reason-capture modal opens (short reason list: patient-history risk / recency not clinically relevant / other + free text) -&gt; confirm -&gt; queue re-sorts, overridden item shows a small &quot;reviewed&quot; marker -&gt; reason logged for model-tuning review, not surfaced to other coordinators. skip-reason branch: coordinator dismisses the modal without selecting a reason -&gt; override still applies, but is flagged in the model-tuning log as &quot;reason not captured&quot; rather than silently treated the same as a reasoned override."}, {"id": "deliverable:wireflows/example-wireflow", "kind": "deliverable", "title": "Onboarding Flow — Step 4 (Invite Your Team) Wireflow", "date": "2026-02-21", "type": "wireflows", "status": "draft", "tags": ["onboarding", "wireflow", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../wireflows/example-wireflow.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Combines the step 4 (&quot;Invite your team&quot;) flow logic with its wireframe, including the branch where a user skips the step. Only step 3 (&quot;Connect calendar&quot;) is required — see <code>user-flows/onboarding-flow.md</code> — so step 4 can be skipped.</p>\n<h2>Flow + screens</h2>\n<p>Step 3 complete -&gt; Step 4 loads (draft list empty) -&gt; user adds email(s) -&gt; &quot;Draft — not sent&quot; tag appears -&gt; user clicks Next -&gt; Step 5. Skip branch: user clicks &quot;Skip&quot; -&gt; Step 5, with no invites drafted or sent.</p>", "searchText": "onboarding flow — step 4 (invite your team) wireflow onboarding wireflow project-onboarding overview combines the step 4 (&quot;invite your team&quot;) flow logic with its wireframe, including the branch where a user skips the step. only step 3 (&quot;connect calendar&quot;) is required — see user-flows/onboarding-flow.md — so step 4 can be skipped. flow + screens step 3 complete -&gt; step 4 loads (draft list empty) -&gt; user adds email(s) -&gt; &quot;draft — not sent&quot; tag appears -&gt; user clicks next -&gt; step 5. skip branch: user clicks &quot;skip&quot; -&gt; step 5, with no invites drafted or sent."}, {"id": "deliverable:storyboards/ed-intake-peak-hour-interruption", "kind": "deliverable", "title": "ED Intake Nurse — Peak-Hour Interruption Storyboard", "date": "2025-05-01", "type": "storyboards", "status": "final", "tags": ["ed", "high-acuity", "intake", "workflow", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../storyboards/ed-intake-peak-hour-interruption.md", "corrections": [], "html": "<h2>Scenario</h2>\n<p>A registration clerk and an intake nurse work a peak-hour ED shift where interruptions land every 2-4 minutes — call lights, incoming ambulance radio traffic, a physician question mid-registration.</p>\n<h2>Panels</h2>\n<ol><li>Nurse starts intake on a new patient; gets interrupted by a bedside alarm two questions in.</li><li>Returns, has lost track of where she was in the form — a tool requiring sustained review attention would compound this, not help it.</li><li>Registration clerk, a lower-acuity task, snaps a photo of an insurance card — pre-fill happens instantly, no sustained attention required.</li><li>Contrast panel: the clerk&#x27;s task fits an AI assist well; the nurse&#x27;s doesn&#x27;t — not because of the AI&#x27;s quality, but because of the interruption rate itself.</li><li>Recommendation callout: carve out insurance-card pre-fill as a smaller, separate, lower-risk feature; leave ED intake nursing out of near-term rollout.</li></ol>", "searchText": "ed intake nurse — peak-hour interruption storyboard ed high-acuity intake workflow project-cross-cutting scenario a registration clerk and an intake nurse work a peak-hour ed shift where interruptions land every 2-4 minutes — call lights, incoming ambulance radio traffic, a physician question mid-registration. panels nurse starts intake on a new patient; gets interrupted by a bedside alarm two questions in. returns, has lost track of where she was in the form — a tool requiring sustained review attention would compound this, not help it. registration clerk, a lower-acuity task, snaps a photo of an insurance card — pre-fill happens instantly, no sustained attention required. contrast panel: the clerk&#x27;s task fits an ai assist well; the nurse&#x27;s doesn&#x27;t — not because of the ai&#x27;s quality, but because of the interruption rate itself. recommendation callout: carve out insurance-card pre-fill as a smaller, separate, lower-risk feature; leave ed intake nursing out of near-term rollout."}, {"id": "deliverable:storyboards/example-storyboard", "kind": "deliverable", "title": "Dana's Monday Morning Setup", "date": "2026-02-24", "type": "storyboards", "status": "draft", "tags": ["onboarding", "storyboard", "project-onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../storyboards/example-storyboard.md", "corrections": [], "html": "<h2>Scenario</h2>\n<p>Dana has 15 minutes between meetings and has been asked to &quot;just get Fernway set up&quot; before the team&#x27;s first call. She&#x27;s setting up on her laptop while half-watching Slack.</p>\n<h2>Panels</h2>\n<ol><li>Dana opens the signup link from an email, still reading a Slack message.</li><li>She breezes through steps 1–3 (signup, basics, calendar), barely reading.</li><li>Step 4 (&quot;Invite your team&quot;) — she stops, phone buzzes, she hesitates before adding real emails.</li><li>She adds one test email first to see what happens (current design gives her no way to do this safely).</li><li>Relief when nothing sends immediately — but she wasn&#x27;t sure until then.</li></ol>", "searchText": "dana's monday morning setup onboarding storyboard project-onboarding scenario dana has 15 minutes between meetings and has been asked to &quot;just get fernway set up&quot; before the team&#x27;s first call. she&#x27;s setting up on her laptop while half-watching slack. panels dana opens the signup link from an email, still reading a slack message. she breezes through steps 1–3 (signup, basics, calendar), barely reading. step 4 (&quot;invite your team&quot;) — she stops, phone buzzes, she hesitates before adding real emails. she adds one test email first to see what happens (current design gives her no way to do this safely). relief when nothing sends immediately — but she wasn&#x27;t sure until then."}, {"id": "deliverable:mockups/confidence-highlighted-draft-review", "kind": "deliverable", "title": "Confidence-Highlighted Draft Review — Hi-Fi Mockup (GA Candidate)", "date": "2026-01-05", "type": "mockups", "status": "final", "tags": ["ambient-scribe", "trust-in-ai", "documentation", "project-ambient-scribe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../mockups/confidence-highlighted-draft-review.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Hi-fi visual design for per-line confidence highlighting in the draft-review surface, built for the Jan 2026 GA-candidate round — the feature that produced the program&#x27;s clearest trust-calibration result to date (visible uncertainty, not raw accuracy, changed reviewing behavior).</p>\n<h2>Notes</h2>\n<p>Two-state treatment, as tested in the 2026-01-13 GA-candidate round: high-confidence line </p>", "searchText": "design system — v4.1 snapshot (shared status-indicator component) design-system accessibility wcag components project-design-system overview snapshot of the shared component library as of v4.1, adding a single status-indicator component (icon + text-label variants: needs-attention / in-progress / resolved) to replace the color-only status-dot markup in the two live components confirmed in accessibility-screenings/status-indicator-remediation-screening.md ( care-gap-badge and alert-triage-queue ) — the shared root behind the color-only pattern found in all three 2025 accessibility audits (legacy console, design system library, mobile app). components status-indicator (new) — replaces the bespoke dot markup in care-gap-badge and alert-triage-queue ; the legacy extjs admin console&#x27;s instance is tracked separately since that console isn&#x27;t built on this component library. icon+text pairing keeps the at-a-glance scannability color gave without relying on color alone, satisfying 1.4.1. note: no compass-ai-specific style guide exists yet to link here as related_style_guide — style-guide/ currently only holds the unrelated fernway foundations doc — so that field is left blank pending one."}, {"id": "deliverable:style-guide/foundations-v3", "kind": "deliverable", "title": "Style Guide — Foundations v3", "date": "2026-02-28", "type": "style-guide", "status": "final", "tags": ["style-guide", "project-design-system"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../style-guide/foundations-v3.md", "corrections": [], "html": "<h2>Overview</h2>\n<p>Foundational tokens referenced by the onboarding v2 mockups — colors, type scale, spacing.</p>\n<h2>Foundations</h2>\n<p>Info color updated this version (previously too close to the warning color in contrast testing — see accessibility screening for the related contrast issue on error messages).</p>", "searchText": "style guide — foundations v3 style-guide project-design-system overview foundational tokens referenced by the onboarding v2 mockups — colors, type scale, spacing. foundations info color updated this version (previously too close to the warning color in contrast testing — see accessibility screening for the related contrast issue on error messages)."}]</script>
<script>
(function () {
  const records = JSON.parse(document.getElementById('research-data').textContent);
  const TYPE_LABELS = {"usability-test": "Usability test", "interview": "Interview", "survey": "Survey", "contextual-inquiry": "Contextual inquiry", "accessibility-audit": "Accessibility audit", "analytics": "Analytics", "analytics-summary": "Analytics summary", "synthesis": "Synthesis", "research-plans": "Research plan", "facilitation-guides": "Facilitation guide", "topline-summaries": "Topline summary", "research-readouts": "Research readout", "heuristic-evaluations": "Heuristic evaluation", "accessibility-screenings": "Accessibility screening", "service-topology": "Service topology", "personas": "Persona", "mental-models": "Mental model", "mindsets": "Mindset", "journey-maps": "Journey map", "thumbnails": "Thumbnail", "wireframes": "Wireframe", "user-flows": "User flow", "wireflows": "Wireflow", "storyboards": "Storyboard", "mockups": "Mockup", "prototypes": "Prototype", "design-system": "Design system", "style-guide": "Style guide"};
  const KIND_LABELS = { raw: 'Sessions', finding: 'Findings', component: 'Components', analytics: 'Analytics', deliverable: 'Deliverables' };
  const KIND_COLORS = { raw: 'var(--kind-raw)', finding: 'var(--kind-finding)', component: 'var(--kind-component)', analytics: 'var(--kind-analytics)', deliverable: 'var(--kind-deliverable)' };
  const SEV_COLORS = { critical: 'var(--sev-critical)', high: 'var(--sev-high)', medium: 'var(--sev-medium)', low: 'var(--sev-low)' };

  const state = {
    query: '',
    kinds: new Set(['raw', 'finding', 'component', 'analytics', 'deliverable']),
    types: new Set(),
    tags: new Set(),
    openId: null,
  };

  const allKinds = ['raw', 'finding', 'component', 'analytics', 'deliverable'];
  const allTypes = [...new Set(records.map(r => r.type).filter(Boolean))].sort();
  const allTags = [...new Set(records.flatMap(r => r.tags))].sort();
  state.types = new Set(allTypes);

  function countFor(predicate) {
    return records.filter(predicate).length;
  }

  function renderKindFilters() {
    const el = document.getElementById('kind-filters');
    el.innerHTML = allKinds.map(k => {
      const count = countFor(r => r.kind === k);
      const checked = state.kinds.has(k) ? 'checked' : '';
      return `<label class="filter-row"><input type="checkbox" data-kind="${k}" ${checked}>${KIND_LABELS[k]}<span class="count">${count}</span></label>`;
    }).join('');
    el.querySelectorAll('input[data-kind]').forEach(input => {
      input.addEventListener('change', () => {
        const k = input.getAttribute('data-kind');
        if (input.checked) state.kinds.add(k); else state.kinds.delete(k);
        render();
      });
    });
  }

  function renderTypeFilters() {
    const el = document.getElementById('type-filters');
    el.innerHTML = allTypes.map(t => {
      const count = countFor(r => r.type === t);
      const checked = state.types.has(t) ? 'checked' : '';
      return `<label class="filter-row"><input type="checkbox" data-type="${t}" ${checked}>${TYPE_LABELS[t] || t}<span class="count">${count}</span></label>`;
    }).join('');
    el.querySelectorAll('input[data-type]').forEach(input => {
      input.addEventListener('change', () => {
        const t = input.getAttribute('data-type');
        if (input.checked) state.types.add(t); else state.types.delete(t);
        render();
      });
    });
  }

  function renderTagFilters() {
    const el = document.getElementById('tag-filters');
    el.innerHTML = allTags.map(tag => {
      const active = state.tags.has(tag) ? 'active' : '';
      return `<button type="button" class="tag-chip ${active}" data-tag="${tag}">${tag}</button>`;
    }).join('');
    el.querySelectorAll('.tag-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.getAttribute('data-tag');
        if (state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
        render();
      });
    });
  }

  function matches(record) {
    if (!state.kinds.has(record.kind)) return false;
    if (record.type && allTypes.includes(record.type) && !state.types.has(record.type)) return false;
    if (state.tags.size > 0 && ![...state.tags].every(t => record.tags.includes(t))) return false;
    if (state.query && !record.searchText.includes(state.query)) return false;
    return true;
  }

  function severityDots(sev) {
    if (!sev) return '';
    const order = ['critical', 'high', 'medium', 'low'];
    const dots = order.filter(k => sev[k] > 0).map(k => `<span title="${sev[k]} ${k}" style="background:${SEV_COLORS[k]}"></span>`);
    return dots.length ? `<div class="sev-dots">${dots.join('')}</div>` : '';
  }

  function renderResults() {
    const filtered = records.filter(matches).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const list = document.getElementById('results-list');
    const emptyState = document.getElementById('empty-state');
    document.getElementById('result-count').textContent = `${filtered.length} of ${records.length}`;

    if (filtered.length === 0) {
      list.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    list.innerHTML = filtered.map(r => {
      const isOpen = state.openId === r.id;
      return `
        <li>
          <div class="result-row" data-id="${r.id}">
            <div class="result-meta">
              <span class="kind-dot" style="background:${KIND_COLORS[r.kind]}"></span>${r.date || ''}
              ${severityDots(r.severity)}
            </div>
            <div>
              <p class="result-title">${r.title}</p>
              <div class="result-tags">
                ${r.type ? `<span class="type-label">${TYPE_LABELS[r.type] || r.type}</span>` : ''}
                ${r.tags.join(', ')}
              </div>
            </div>
            <div class="result-detail ${isOpen ? 'open' : ''}" id="detail-${cssEscape(r.id)}">
              <div class="result-detail-inner">
                ${isOpen ? r.html : ''}
                ${isOpen ? `<a class="source-link" href="${r.path}">Open source file: ${r.path}</a>` : ''}
              </div>
            </div>
          </div>
        </li>`;
    }).join('');

    list.querySelectorAll('.result-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('a')) return; // let source-file links navigate normally
        const id = row.getAttribute('data-id');
        state.openId = state.openId === id ? null : id;
        render();
        if (state.openId) {
          const el = document.getElementById(`detail-${cssEscape(state.openId)}`);
          if (el && typeof el.scrollIntoView === 'function') {
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }
      });
    });
  }

  function cssEscape(s) { return s.replace(/[^a-zA-Z0-9_-]/g, '_'); }

  function render() {
    renderKindFilters();
    renderTypeFilters();
    renderTagFilters();
    renderResults();
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('reset-filters').addEventListener('click', () => {
    state.query = '';
    state.kinds = new Set(allKinds);
    state.types = new Set(allTypes);
    state.tags = new Set();
    state.openId = null;
    document.getElementById('search-input').value = '';
    render();
  });

  render();
})();
</script>
