would know where to ask questions. this is a stated expectation; no alternative view was shown. representative quotes &quot;i live in the plan. if it said &#x27;come back in two weeks&#x27; in the conversation and the plan doesn&#x27;t say it, the patient&#x27;s going to ask me and i won&#x27;t know.&quot; — registered nurse (primary care clinic), p138 &quot;it&#x27;s not my voice i&#x27;m worried about, the scribe doesn&#x27;t write my notes. it&#x27;s that i can&#x27;t hear the doctor in theirs anymore.&quot; — registered nurse (primary care clinic), p138 recommendations share with the ambient scribe team that nurses act on the plan section of scribe-drafted notes, so follow-up intervals, medication changes and patient instructions said during the visit need to reach the plan, not only the body. when the survey&#x27;s &quot;voice&quot; concern is next cited, say whose voice: for this nurse it was the provider&#x27;s, in notes the nurse reads but didn&#x27;t write. follow-ups / open questions how often plan items land outside the plan section in scribe-drafted notes is not measured; &quot;a few times a week&quot; is one nurse&#x27;s impression. whether other clinic nurses read the whole note or only the plan is not known; this is one interview. whether nurses would use a marker of which parts the provider edited is untested; no such marker exists. related synthesized into: ambient-scribe-post-ga-refinements.md , clinician-experience-documentation-burden.md participants participants — interview — clinic nurse on reading scribe-drafted visit notes count: 1 roles: p138 — registered nurse (primary care clinic) (nurse) researcher: priya patel recruitment note: recruited via ambulatory clinic nursing contacts. this participant is new to the research and did not take part in any earlier session, including the february 2025 nursing survey; they are not p41, the outpatient clinic nurse quoted there. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-03-19-interview-primary-care-physician-incidental-content-at-sign-off", "kind": "raw", "title": "Interview — Primary Care Physician on Incidental Content in Scribe Drafts", "date": "2026-03-19", "type": "interview", "status": "raw", "tags": ["ambient-scribe", "documentation", "phi", "privacy", "clinician-workflow", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-03-19-interview-primary-care-physician-incidental-content-at-sign-off/session-notes.md", "corrections": [], "html": "<h1>Interview — Primary Care Physician on Incidental Content in Scribe Drafts</h1>\n<h2>Objective</h2>\n<p>Earlier ambient-scribe research looked at what the scribe gets wrong: medication dosages and sound-alike drug names, and whether clinicians trust the draft enough to skim it. Two sessions touched on what the scribe takes in more broadly. In an October 2025 contextual inquiry, a behavioral health clinician said that any AI tool listening to or drafting behavioral health session notes raises consent and 42 CFR Part 2 questions (2025-10-07-contextual-inquiry-behavioral-health-sensitive-notes/session-notes.md:28); the exclusion of that population from the near-term ambient scribe rollout is recorded in the scope-boundaries finding (scope-boundaries-and-workflow-fit.md:72-74). A care coordinator said the visit notes they read since GA are longer and more conversational than the notes clinicians used to type (2026-03-03-interview-care-coordinator-chart-review-scribe-notes/session-notes.md:31). Neither asked the person signing a draft about content the scribe writes down correctly but that doesn&#x27;t belong in a visit note: small talk, a patient&#x27;s remarks about other people, side conversations with a family member in the room. This session asked a primary care physician, two months after the January 2026 GA, what of that kind ends up in their drafts and what they remove before they sign.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is an internal medicine physician in an ambulatory primary care clinic, mid-career. They opted in to the ambient scribe after the January 2026 GA and use it for most of their visits. The scribe drafts visit notes for physicians, NPs and PAs; the clinician reviews the draft, corrects single lines in place, and signs. Low-confidence transcription is shown with a subtle underline. They did not take part in any earlier session. This is an interview about their own practice; nothing was shown or observed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(incidental content)</em> Their drafts regularly contain things that were said in the room but that they would not have written themselves: small talk at the start of the visit, a patient&#x27;s remarks about a relative&#x27;s health, comments made by a family member who came to the visit, and their own asides (&quot;let me pull up your labs&quot;). They remove these line by line with the in-place edit before signing. They put it at &quot;most visits, a line or two&quot;, an informal impression, not a count.</li><li><strong>[MEDIUM]</strong> <em>(not underlined)</em> The underline marks lines where the scribe was unsure what it heard. Incidental content is usually transcribed accurately, so it is not underlined, and nothing in the draft points them to it. It also doesn&#x27;t land in a predictable section: they have found it in the history of present illness and in the social history. To catch it they read the whole draft, including sections where nothing is underlined. That is one physician&#x27;s practice; whether others do the same is not known.</li><li><strong>[MEDIUM]</strong> <em>(judgement)</em> What counts as incidental is a judgement call. A remark about stress at home can be clinically relevant and stay in the note; the same remark in passing about someone else is removed. They would not want the scribe to remove anything on its own. They could see value in it pointing out lines that might not belong, as long as they decide. That is an expectation; nothing was shown.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;It writes down everything that was said, not everything that matters. The sister&#x27;s surgery is in my note until I take it out.&quot;</p><p>— Physician (Internal Medicine), P146</p></blockquote>\n<blockquote><p>&quot;The underline tells me where it wasn&#x27;t sure what it heard. It heard the small talk perfectly, so nothing tells me to look there.&quot;</p><p>— Physician (Internal Medicine), P146</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Share with the ambient scribe team that the confidence underline doesn&#x27;t help with incidental content, because that content is usually transcribed accurately; reviewing for it means reading the whole draft.</li><li>If anything is designed for this, explore pointing out lines that may not belong in the note rather than removing them, so the clinician makes the call.</li><li>Keep this separate from the transcription-confidence work: it is about what belongs in the note, not whether it was heard correctly.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often drafts contain incidental content is not measured; &quot;most visits, a line or two&quot; is one physician&#x27;s impression.</li><li>Whether other physicians, NPs and PAs remove the same kinds of content, and how long it takes them, is not known; this is one interview.</li><li>What happens to text a clinician removes before signing is not recorded in the her than removing them, so the clinician makes the call. keep this separate from the transcription-confidence work: it is about what belongs in the note, not whether it was heard correctly. follow-ups / open questions how often drafts contain incidental content is not measured; &quot;most visits, a line or two&quot; is one physician&#x27;s impression. whether other physicians, nps and pas remove the same kinds of content, and how long it takes them, is not known; this is one interview. what happens to text a clinician removes before signing is not recorded in the corpus and was not discussed in this session. related earlier sessions: 2025-09-23 v0.2 usability test (in-place line correction), 2025-10-07 behavioral health contextual inquiry , 2026-01-13 ga release candidate (confidence underline), 2026-03-03 care coordinator interview synthesized into: ambient-scribe.md participants participants — interview — primary care physician on incidental content in scribe drafts count: 1 roles: p146 — physician (internal medicine) (physician) researcher: priya patel recruitment note: recruited via primary care clinic physician contacts, from clinicians who opted in to the ambient scribe after the january 2026 ga. this participant is new to the research and did not take part in any earlier session. they are not p09, p11, p22 or p119, the physicians in the earlier ambient-scribe sessions. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-03-24-interview-family-physician-plan-and-medication-changes-at-sign-off", "kind": "raw", "title": "Interview — Family Physician on the Plan Section and Medication Changes at Sign-Off", "date": "2026-03-24", "type": "interview", "status": "raw", "tags": ["ambient-scribe", "documentation", "medication-safety", "clinician-workflow", "trust-in-ai", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-03-24-interview-family-physician-plan-and-medication-changes-at-sign-off/session-notes.md", "corrections": [], "html": "<h1>Interview — Family Physician on the Plan Section and Medication Changes at Sign-Off</h1>\n<h2>Objective</h2>\n<p>Earlier ambient-scribe sessions tested medication accuracy in drafts: dosage errors in v0.1 and v0.2, sound-alike drug names at the GA release candidate, and a concept for a distinct sound-alike medication flag (2026-02-10). The plan section has so far come up only from the reader&#x27;s side: a care coordinator goes straight to the plan and the medication list in the visit notes they read before an outreach call (2026-03-03-interview-care-coordinator-chart-review-scribe-notes/session-notes.md:31, :43), and the 2026-03-17 clinic nurse interview (2026-03-17-interview-clinic-nurse-reading-scribe-drafted-notes) heard that plan items sometimes land in the body of the note rather than the plan (2026-03-17-interview-clinic-nurse-reading-scribe-drafted-notes/session-notes.md:30). None of those sessions asked the person who signs the draft how they check the plan section, where decisions made during the visit, including medication changes, are supposed to end up. This session asked a family physician, two months after the January 2026 GA, how they check the plan and the medication lines in a draft before they sign.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a family medicine physician in an ambulatory primary care clinic, mid-career. They opted in to the ambient scribe after the January 2026 GA. The scribe drafts the visit note only; the clinician enters orders, including medication orders, separately. Low-confidence transcription is shown with a subtle underline. The distinct sound-alike medication flag tested on 2026-02-10 has not shipped; there is no distinct medication marking beyond the confidence underline. They did not take part in any earlier session. This is an interview about their own practice; nothing was shown or observed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(plan section)</em> When a decision is talked through over several minutes, the draft sometimes puts the reasoning in the assessment and only part of the decision in the plan, or leaves a follow-up interval in the body of the note. Before signing they read the plan against what they remember deciding and move or add items by hand. They put it at &quot;a couple of times on a full clinic day&quot;, an informal impression, not a count.</li><li><strong>[HIGH]</strong> <em>(medication changes)</em> They enter medication orders themselves, so they know what they decided; the question at sign-off is whether the note says the same thing. Their main check is that every medication change in the plan matches the order they placed, and that it is written as a decision. When the draft words a change tentatively, as it was discussed rather than as it was decided, they rewrite it. They said they make this check on every medication line, underlined or not.</li><li><strong>[MEDIUM]</strong> <em>(sound-alike names)</em> They recalled one sound-alike drug name since GA, glyburide written where glipizide had been said, and said it was underlined. It is one recollection, not a rate; the GA release-candidate round records sound-alike names as a known, monitored error type (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:31). They said they would check medication lines against the order whether or not anything marked them, because a wrong name can be heard confidently.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I put the order in myself, so I know what I decided. The question is whether the note says the same thing.&quot;</p><p>— Physician (Family Medicine), P147</p></blockquote>\n<blockquote><p>&quot;&#x27;We talked about lowering the dose&#x27; isn&#x27;t a plan. I change it to what we actually did.&quot;</p><p>— Physician (Family Medicine), P147</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Share with the ambient scribe team that decisions made during the visit, especially medication changes and follow-up intervals, need to reach the plan section, worded as decisions.</li><li>When drafts are evaluated, check the plan section&#x27;s completeness against what was decided in the visit, not only transcription accuracy.</li><li>When the distinct medication flag&#x27;s design is next reviewed, note that this physician checks every medication line against the order regardless of marking; whether a flag would change that is untested.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How often plan items land outside the plan section is not measured; &quot;a couple of times on a full clinic day&quot; is one physician&#x27;s impression.</li><li>Whether NPs and PAs, or other physicians, check the plan and medication lines the same way is not known; this is one interview.</li><li>Whether the distinct medication flag would change how signers check medication lines is untested; it has not shipped.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier sessions: <a href=\"../2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">2026-01-13 GA release candidate</a>, <a href=\"../2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md\">2026-02-10 medication flag concept</a>, <a href=\"../2026-03-03-interview-care-coordinator-chart-review-scribe-notes/session-notes.md\">2026-03-03 care coordinator interview</a>, <a href=\"../2026-03-17-interview-clinic-nurse-reading-scribe-drafted-notes/session-notes.md\">2026-03-17 clinic nurse interview</a></li><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Family Physician on the Plan Section and Medication Changes at Sign-Off</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P147 — Physician (Family Medicine) (physician)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via primary care clinic physician contacts, from clinicians who opted in to the ambient scribe after the January 2026 GA. This participant is new to the research and did not take part in any earlier session. They are not P09, P11, P22, P119 or P146, the physicians in the earlier ambient-scribe sessions. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — family physician on the plan section and medication changes at sign-off ambient-scribe documentation medication-safety clinician-workflow trust-in-ai project-ambient-scribe ambient-scribe-widget interview — family physician on the plan section and medication changes at sign-off objective earlier ambient-scribe sessions tested medication accuracy in drafts: dosage errors in v0.1 and v0.2, sound-alike drug names at the ga release candidate, and a concept for a distinct sound-alike medication flag (2026-02-10). the plan section has so far come up only from the reader&#x27;s side: a care coordinator goes straight to the plan and the medication list in the visit notes they read before an outreach call (2026-03-03-interview-care-coordinator-chart-review-scribe-notes/session-notes.md:31, :43), and the 2026-03-17 clinic nurse interview (2026-03-17-interview-clinic-nurse-reading-scribe-drafted-notes) heard that plan items sometimes land in the body of the note rather than the plan (2026-03-17-interview-clinic-nu said they make this check on every medication line, underlined or not. [medium] (sound-alike names) they recalled one sound-alike drug name since ga, glyburide written where glipizide had been said, and said it was underlined. it is one recollection, not a rate; the ga release-candidate round records sound-alike names as a known, monitored error type (2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md:31). they said they would check medication lines against the order whether or not anything marked them, because a wrong name can be heard confidently. representative quotes &quot;i put the order in myself, so i know what i decided. the question is whether the note says the same thing.&quot; — physician (family medicine), p147 &quot;&#x27;we talked about lowering the dose&#x27; isn&#x27;t a plan. i change it to what we actually did.&quot; — physician (family medicine), p147 recommendations share with the ambient scribe team that decisions made during the visit, especially medication changes and follow-up intervals, need to reach the plan section, worded as decisions. when drafts are evaluated, check the plan section&#x27;s completeness against what was decided in the visit, not only transcription accuracy. when the distinct medication flag&#x27;s design is next reviewed, note that this physician checks every medication line against the order regardless of marking; whether a flag would change that is untested. follow-ups / open questions how often plan items land outside the plan section is not measured; &quot;a couple of times on a full clinic day&quot; is one physician&#x27;s impression. whether nps and pas, or other physicians, check the plan and medication lines the same way is not known; this is one interview. whether the distinct medication flag would change how signers check medication lines is untested; it has not shipped. related earlier sessions: 2026-01-13 ga release candidate , 2026-02-10 medication flag concept , 2026-03-03 care coordinator interview , 2026-03-17 clinic nurse interview synthesized into: ambient-scribe.md participants participants — interview — family physician on the plan section and medication changes at sign-off count: 1 roles: p147 — physician (family medicine) (physician) researcher: priya patel recruitment note: recruited via primary care clinic physician contacts, from clinicians who opted in to the ambient scribe after the january 2026 ga. this participant is new to the research and did not take part in any earlier session. they are not p09, p11, p22, p119 or p146, the physicians in the earlier ambient-scribe sessions. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-03-31-interview-him-supervisor-roi-volume-and-part-2", "kind": "raw", "title": "Interview — HIM Supervisor on ROI Volume and Part 2 Handling", "date": "2026-03-31", "type": "interview", "status": "raw", "tags": ["him", "release-of-information", "42-cfr-part-2", "workflow", "compliance", "project-him"], "related_components": ["roi-redaction-tool"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-03-31-interview-him-supervisor-roi-volume-and-part-2/session-notes.md", "corrections": [], "html": "<h1>Interview — HIM Supervisor on ROI Volume and Part 2 Handling</h1>\n<h2>Objective</h2>\n<p>Revisit release of information (ROI) eight months after the July 2025 contextual inquiry: how request volume and turnaround stand now, whether anything has changed in how 42 CFR Part 2 records are handled, and whether the ambient scribe going GA in January 2026 has changed the work. The participant is a different HIM supervisor from the one in the July 2025 session (P67).</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> Participant supervises ROI request intake and fulfillment and does second-level Part 2 review themselves. Part 2 handling is still fully manual; no ROI redaction tool has been built or piloted.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(42 CFR Part 2)</em> Part 2 records are still identified from memory. There is still no structured flag in the EHR, and nothing has changed since July 2025. Newer specialists work from a printed sheet of the clinics and note types that &quot;usually&quot; need Part 2 handling and ask a senior specialist when unsure. Because nothing says which notes actually come from a Part 2 program, staff send any substance-use mention to the stricter review to be safe, wherever the note came from. The supervisor said scribe-drafted notes from general medical visits sometimes capture that part of the conversation in more detail than a physician would have typed, so specialists now read those notes more closely.</li><li><strong>[MEDIUM]</strong> <em>(volume)</em> By their own informal count, ROI requests are up &quot;somewhere around a quarter&quot; on a year ago. That differs from the ~18% year-over-year figure the other supervisor gave in July 2025. This supervisor counts every request received, re-requests and follow-ups from requesters chasing a late response included, which may explain part of the gap. Both figures are informal and neither has been checked against system data.</li><li><strong>[MEDIUM]</strong> <em>(turnaround)</em> The backlog is concentrated in requests that need Part 2 review, not routine ones. They named four drivers: only a few senior specialists can do the second-level Part 2 review; released records are longer because scribe-drafted notes are longer, so page-by-page review takes more time; re-requests add intake work for requests already in the queue; and one open specialist position. By their own informal count, turnaround on requests that need Part 2 review has slipped from about a week to closer to two.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Part 2 is still tribal knowledge. It&#x27;s in my head, it&#x27;s in the heads of two or three people on my team, and it&#x27;s on a sheet taped up by the printer. That&#x27;s the system.&quot;</p><p>— HIM Supervisor, P121</p></blockquote>\n<blockquote><p>&quot;The easy requests go out fine. What&#x27;s stuck is anything that needs the second look for Part 2, because there&#x27;s only a couple of us who can do it, and everything just piles up behind us.&quot;</p><p>— HIM Supervisor, P121</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Re-escalate the structured Part 2 flag as a standalone platform gap. It has now come up in three separate sessions (HIM in July 2025, behavioral health in October 2025, and here), and nothing has changed.</li><li>If ROI redaction assistance is scoped later, treat the second-level Part 2 review queue as the bottleneck to design around, not first-pass redaction.</li><li>Pull system-of-record ROI volume and turnaround data. This was an open follow-up in July 2025 and is still outstanding.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Reconcile the two informal volume estimates (~18% in July 2025, roughly a quarter here) against actual request counts, and agree on whether re-requests count as requests.</li><li>Check whether pages per released record can be measured before and after GA, to test the &quot;notes are longer now&quot; impression.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/him-coding-and-billing.md\">him-coding-and-billing.md</a>, <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — HIM Supervisor on ROI Volume and Part 2 Handling</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P121 — HIM Supervisor (him-coder)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via HIM department contacts, consistent with the prior HIM sessions (2025-07-15, 2025-07-29). No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — him supervisor on roi volume and part 2 handling him release-of-information 42-cfr-part-2 workflow compliance project-him roi-redaction-tool interview — him supervisor on roi volume and part 2 handling objective revisit release of information (roi) eight months after the july 2025 contextual inquiry: how request volume and turnaround stand now, whether anything has changed in how 42 cfr part 2 records are handled, and whether the ambient scribe going ga in january 2026 has changed the work. the participant is a different him supervisor from the one in the july 2025 session (p67). method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: participant supervises roi request intake and fulfillment and does second-level part 2 review themselves. part 2 handling is still fully manual; no roi redaction tool has been built or piloted. key findings [high] (42 cfr part 2) part 2 records are still identified from memory. there is still no structured flag in the ehr, and nothing has changed since july 2025. newer specialists work from a printed sheet of the clinics and note types that &quot;usually&quot; need part 2 handling and ask a senior specialist when unsure. because nothing says which notes actually come from a part 2 program, staff send any substance-use mention to the stricter review to be safe, wherever the note came from. the supervisor said scribe-drafted notes from general medical visits sometimes capture that part of the conversation in more detail than a physician would have typed, so specialists now read those notes more closely. [medium] (volume) by their own informal count, roi requests are up &quot;somewhere around a quarter&quot; on a year ago. that differs from the ~18% year-over-year figure the other supervisor gave in july 2025. this supervisor counts every request received, re-requests and follow-ups from requesters chasing a late response included, which may explain part of the gap. both figures are informal and neither has been checked against system data. [medium] (turnaround) the backlog is concentrated in requests that need part 2 review, not routine ones. they named four drivers: only a few senior specialists can do the second-level part 2 review; released records are longer because scribe-drafted notes are longer, so page-by-page review takes more time; re-requests add intake work for requests already in the queue; and one open specialist position. by their own informal count, turnaround on requests that need part 2 review has slipped from about a week to closer to two. representative quotes &quot;part 2 is still tribal knowledge. it&#x27;s in my head, it&#x27;s in the heads of two or three people on my team, and it&#x27;s on a sheet taped up by the printer. that&#x27;s the system.&quot; — him supervisor, p121 &quot;the easy requests go out fine. what&#x27;s stuck is anything that needs the second look for part 2, because there&#x27;s only a couple of us who can do it, and everything just piles up behind us.&quot; — him supervisor, p121 recommendations re-escalate the structured part 2 flag as a standalone platform gap. it has now come up in three separate sessions (him in july 2025, behavioral health in october 2025, and here), and nothing has changed. if roi redaction assistance is scoped later, treat the second-level part 2 review queue as the bottleneck to design around, not first-pass redaction. pull system-of-record roi volume and turnaround data. this was an open follow-up in july 2025 and is still outstanding. follow-ups / open questions reconcile the two informal volume estimates (~18% in july 2025, roughly a quarter here) against actual request counts, and agree on whether re-requests count as requests. check whether pages per released record can be measured before and after ga, to test the &quot;notes are longer now&quot; impression. related synthesized into: him-coding-and-billing.md , scope-boundaries-and-workflow-fit.md participants participants — interview — him supervisor on roi volume and part 2 handling count: 1 roles: p121 — him supervisor (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, consistent with the prior him sessions (2025-07-15, 2025-07-29). no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-04-07-interview-care-coordinator-float-pool-system-familiarity", "kind": "raw", "title": "Interview — Float-Pool Care Coordinator on System Familiarity", "date": "2026-04-07", "type": "interview", "status": "raw", "tags": ["care-coordination", "chart-review", "alert-triage", "workflow", "project-care-coordination"], "related_components": ["chart-review-summary-panel", "alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-04-07-interview-care-coordinator-float-pool-system-familiarity/session-notes.md", "corrections": [], "html": "<h1>Interview — Float-Pool Care Coordinator on System Familiarity</h1>\n<h2>Objective</h2>\n<p>Follow up the January 2025 baseline&#x27;s open question on float-pool coordinators, who &quot;may have different pain points due to less system familiarity&quot;. The participant is P05, returning from 2025-01-29-contextual-inquiry-chart-review-baseline, where they were shadowed in January 2025; this interview is in April 2026. The question was what covering for different teams does to chart review and alert triage, and whether their own 2025 request (&quot;what changed since I last touched this chart&quot;) still fits how they work.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant still works in the float pool, covering ambulatory care coordination teams when their own coordinators are out. Alerts still arrive in the chronological queue; the AI-ranked queue tested in August 2025 hasn&#x27;t been built, and they did not take part in that test. The chart-review summary panel is still a concept.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(float pool)</em> Each team they cover keeps its own version of the shared spreadsheet, with its own columns and its own colour-coding, and none of it is written down. They spend the start of a covering shift working out that team&#x27;s conventions, from the sheet itself or by asking whoever is on the team that day, before they can trust what the sheet is telling them about a patient. This is the undocumented-workaround pattern from the January 2025 baseline, seen from the side of the person who has to read it.</li><li><strong>[MEDIUM]</strong> <em>(what changed)</em> &quot;Since I last touched this chart&quot; doesn&#x27;t fit floating, because on a covering shift they have often never touched the chart. What they want is &quot;what changed since the team&#x27;s last contact&quot; with the patient, whoever made it. This refines their own January 2025 request rather than replacing it: the reference point is the last contact by anyone on the care team.</li><li><strong>[MEDIUM]</strong> <em>(alert triage)</em> When floating, they work the alert queue strictly in order. They said they don&#x27;t know the patients well enough to move one alert above another on history, so they leave reprioritising to the team&#x27;s own coordinators when they&#x27;re back. This is their account of their own practice; nothing was observed or measured in this session.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Every team has their own sheet and their own colours. The first half hour of a covering day is me figuring out what yellow means on this team.&quot;</p><p>— Care Coordinator (float pool), P05 (returning from 2025-01-29-contextual-inquiry-chart-review-baseline)</p></blockquote>\n<blockquote><p>&quot;When I&#x27;m covering, I haven&#x27;t touched the chart. I need to know what&#x27;s changed since anybody on the team last talked to this person.&quot;</p><p>— Care Coordinator (float pool), P05 (returning from 2025-01-29-contextual-inquiry-chart-review-baseline)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>In the chart-review summary concept, support &quot;since the team&#x27;s last contact&quot; as well as &quot;since my last contact&quot;, so it works for covering coordinators.</li><li>Treat each team&#x27;s spreadsheet conventions as something the design has to account for (or replace), not a single shared convention.</li><li>When AI ranking is next tested, include float-pool coordinators specifically, since they may rely on the ranked order differently from coordinators who know the patients.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How many teams&#x27; spreadsheet conventions differ, and how much, is not known; this is one coordinator&#x27;s account.</li><li>Would a covering coordinator follow an AI-ranked order more closely than a team&#x27;s own coordinator does? Not tested; the August 2025 test did not separate float-pool participants.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2> d in august 2025 hasn&#x27;t been built, and they did not take part in that test. the chart-review summary panel is still a concept. key findings [high] (float pool) each team they cover keeps its own version of the shared spreadsheet, with its own columns and its own colour-coding, and none of it is written down. they spend the start of a covering shift working out that team&#x27;s conventions, from the sheet itself or by asking whoever is on the team that day, before they can trust what the sheet is telling them about a patient. this is the undocumented-workaround pattern from the january 2025 baseline, seen from the side of the person who has to read it. [medium] (what changed) &quot;since i last touched this chart&quot; doesn&#x27;t fit floating, because on a covering shift they have often never touched the chart. what they want is &quot;what changed since the team&#x27;s last contact&quot; with the patient, whoever made it. this refines their own january 2025 request rather than replacing it: the reference point is the last contact by anyone on the care team. [medium] (alert triage) when floating, they work the alert queue strictly in order. they said they don&#x27;t know the patients well enough to move one alert above another on history, so they leave reprioritising to the team&#x27;s own coordinators when they&#x27;re back. this is their account of their own practice; nothing was observed or measured in this session. representative quotes &quot;every team has their own sheet and their own colours. the first half hour of a covering day is me figuring out what yellow means on this team.&quot; — care coordinator (float pool), p05 (returning from 2025-01-29-contextual-inquiry-chart-review-baseline) &quot;when i&#x27;m covering, i haven&#x27;t touched the chart. i need to know what&#x27;s changed since anybody on the team last talked to this person.&quot; — care coordinator (float pool), p05 (returning from 2025-01-29-contextual-inquiry-chart-review-baseline) recommendations in the chart-review summary concept, support &quot;since the team&#x27;s last contact&quot; as well as &quot;since my last contact&quot;, so it works for covering coordinators. treat each team&#x27;s spreadsheet conventions as something the design has to account for (or replace), not a single shared convention. when ai ranking is next tested, include float-pool coordinators specifically, since they may rely on the ranked order differently from coordinators who know the patients. follow-ups / open questions how many teams&#x27; spreadsheet conventions differ, and how much, is not known; this is one coordinator&#x27;s account. would a covering coordinator follow an ai-ranked order more closely than a team&#x27;s own coordinator does? not tested; the august 2025 test did not separate float-pool participants. related synthesized into: care-coordination-triage.md participants participants — interview — float-pool care coordinator on system familiarity count: 1 roles: p05 — care coordinator (float pool) (care-coordinator), returning from 2025-01-29-contextual-inquiry-chart-review-baseline researcher: priya patel recruitment note: recontacted from the january 2025 baseline. the participant is p05, returning from 2025-01-29-contextual-inquiry-chart-review-baseline, where they were shadowed in january 2025; this interview is in april 2026. they are still in the float pool. they did not take part in the 2025-08-26 alert-triage test. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-04-14-interview-ed-intake-nurse-interruptions-and-downtime", "kind": "raw", "title": "Interview — Returning ED Intake Nurse on Interruptions and Downtime", "date": "2026-04-14", "type": "interview", "status": "raw", "tags": ["nursing", "ed", "intake", "high-acuity", "workflow", "project-cross-cutting"], "related_components": ["ed-intake-form"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-04-14-interview-ed-intake-nurse-interruptions-and-downtime/session-notes.md", "corrections": [], "html": "<h1>Interview — Returning ED Intake Nurse on Interruptions and Downtime</h1>\n<h2>Objective</h2>\n<p>Check whether the ED intake boundary in <code>scope-boundaries-and-workflow-fit.md</code> still holds, with the nurse whose shadowing it rests on. The participant is P21, returning from 2025-04-22-contextual-inquiry-ed-intake-shadowing, where they were shadowed during peak hours in April 2025; this interview is in April 2026. That session found intake staff interrupted every 2-4 minutes at peak and a paper triage sheet kept as backup for when the system is slow. The questions were whether either has changed, and whether any AI help that needs reviewing could fit intake at peak.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant still works ED intake, including the late-afternoon and evening peak. Intake documentation is still entered by hand in the intake form; no AI feature is scoped against it. The ambient scribe, GA since January 2026, drafts notes for physicians, NPs and PAs only and isn&#x27;t used at intake. This is an interview about their own practice; nothing was observed in this session.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(interruption tolerance)</em> At peak, nothing that needs sustained review would fit intake. They described the interruptions as unchanged since the April 2025 shadowing (&quot;constant, same as when you were here&quot;); this is their account, not a re-measurement of the 2-4 minute figure. They were open to help that needs no review, such as fields that fill themselves and can be ignored, but not to anything they would have to read and approve between interruptions. This confirms the ED intake boundary and the ED intake storyboard.</li><li><strong>[MEDIUM]</strong> <em>(paper backup)</em> The paper triage sheet is still in use. They start one at the beginning of every peak shift whether or not the system is slow, because by the time it is slow it is too late to start one. The April 2025 notes record the sheet as a backup kept &quot;in case the system is slow&quot; (2025-04-22-contextual-inquiry-ed-intake-shadowing/session-notes.md:31) but don&#x27;t say when staff started it, so this is not evidence of a change since 2025. They gave no new estimate of how often the system is slow (the 2025 notes have staff self-reporting it several times a shift) and did not know what causes it. Any AI feature at intake would still need to degrade to paper without losing what was already entered.</li><li><strong>[LOW]</strong> <em>(re-entry)</em> After a slow spell, they re-enter what is on the paper sheet into the intake form, usually after peak. They saw that re-entry, not intake itself, as the part of the shift where a tool might help, because it happens when things are quieter.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Same as when you were here. If I have to read it and click OK, it&#x27;s not happening between ambulances.&quot;</p><p>— ED Intake Nurse, P21 (returning from 2025-04-22-contextual-inquiry-ed-intake-shadowing)</p></blockquote>\n<blockquote><p>&quot;I start the paper sheet at the top of every shift. By the time the system&#x27;s crawling, it&#x27;s too late to start one.&quot;</p><p>— ED Intake Nurse, P21 (returning from 2025-04-22-contextual-inquiry-ed-intake-shadowing)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Keep the ED intake boundary as it is: no AI feature at intake during peak that needs review attention.</li><li>Treat the paper sheet as part of the intake workflow, not a fallback, when scoping anything for this setting: any feature has to work alongside it and survive re-entry from it.</li><li>If ED intake is revisited, look at post-peak re-entry from the paper sheet as a separate, lower-pressure task.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>What causes the system slowness, and how often it happens, is still not known; the April 2025 question to IT is unanswered in the corpus, and the only frequency on record is the 2025 staff self-report (several times a shift).</li><li>Whether the insurance-card photo pre-fill for registration clerks has been piloted is not recorded; it was not discussed with this participant.</li><li>Whether the 2-4 minute interruption figure still holds would need another peak-hour observation.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Returning ED Intake Nurse on Interruptions and Downtime</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P21 — ED Intake Nurse (nurse), returning from 2025-04-22-contextual-inquiry-ed-intake-shadowing</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recontacted from the April 2025 ED intake shadowing. The participant is P21, returning from 2025-04-22-contextual-inquiry-ed-intake-shadowing, where they were shadowed in April 2025; this interview is in April 2026. They still work ED intake. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — returning ed intake nurse on interruptions and downtime nursing ed intake high-acuity workflow project-cross-cutting ed-intake-form interview — returning ed intake nurse on interruptions and downtime objective check whether
