otes since ga. they had not seen the july 2025 screens before; they reacted to a walkthrough of them during this session. key findings [high] (audit posture) before anything else, they wanted it to be clear that the coder makes every coding decision and the tool only suggests. they would want a visible, per-code record of what was suggested and what the coder did with it (accepted, edited or overridden), which they could see themselves while coding, not only something auditors could pull later. they called this the precondition for using the tool at all, not a feature to add later. it matches what the july 2025 senior coder and the april 2026 coding auditor asked for, reached independently. [medium] (citations) a source citation for every suggested code was non-negotiable for them: the sentence or sentences in the note that support the code, including the specificity. a code without a citation is one they would not accept, however likely it looked. because so much of the documentation is now scribe-drafted, they said the citation is also how they&#x27;d check that the note actually supports the code and that the suggester isn&#x27;t just echoing a sentence the physician didn&#x27;t catch at sign-off. [medium] (speed) told about the july 2025 estimate of 2-3 minutes saved per simple chart, they said a saving like that matters only if checking a suggestion stays quicker than coding the chart themselves. if they have to open every citation, compare it with the note and then record why they changed a code, they expect the saving to &quot;mostly disappear&quot; on anything but the simplest visits. they saw this as an informal guess, not something they&#x27;d measured. representative quotes &quot;the tool can suggest whatever it wants. i&#x27;m the one who codes. if the screen doesn&#x27;t show that, code by code, i&#x27;m not touching it.&quot; — medical coder (senior), p129 &quot;no citation, no code. i don&#x27;t care how confident it looks. show me where in the note it&#x27;s coming from, because half the time now nobody typed that note.&quot; — medical coder (senior), p129 recommendations keep the per-code suggested / accepted / edited / overridden record as a release-blocking requirement, and make it visible to the coder in the coding view as well as to auditors and supervisors. require a source-text citation, down to the specificity level, for every suggested code. don&#x27;t show a suggestion that has no citation. this is consistent with the transparency pattern from prior-auth research. in any pilot, measure the time to review a suggestion, citation check included, not only the end-to-end time per chart, so the 2-3 minute estimate is checked against how coders actually review. follow-ups / open questions how long does a citation check take in practice? this could be timed in a future test of the concept screens. would senior coders accept a lighter review path for simple charts if sampling caught problems, or is per-code review a hard line? related synthesized into: him-coding-and-billing.md , prior-authorization.md participants participants — interview — senior medical coder on ai coding suggestions count: 1 roles: p129 — medical coder (senior) (him-coder) researcher: priya patel recruitment note: recruited via him department contacts, who referred us to a senior coder who had not seen the coding-suggestion concept before. this participant is new to the research: a different person from p71, the senior coder in the 2025-07-29 usability test, and from p120 (2026-03-10). they did not take part in the july 2025 session. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-10-08-interview-internal-medicine-resident-opting-in-to-the-scribe", "kind": "raw", "title": "Interview — Internal Medicine Resident on Opting In to the Scribe", "date": "2026-10-08", "type": "interview", "status": "raw", "tags": ["ambient-scribe", "rollout", "change-management", "clinician-workflow", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-10-08-interview-internal-medicine-resident-opting-in-to-the-scribe/session-notes.md", "corrections": [], "html": "<h1>Interview — Internal Medicine Resident on Opting In to the Scribe</h1>\n<h2>Objective</h2>\n<p>The 2026-01-27 review of the ambient scribe usage dashboard, covering the first four weeks of GA-candidate rollout, found attending physicians opting in at a noticeably higher rate than residents in the same departments (2026-01-27-dashboard-review-ambient-scribe-ga-adoption/session-notes.md:37-39). It recommended a short follow-up interview round on the physician/resident adoption gap (same file, :44) and asked whether the gap is explained by workflow differences, trust, or something else, which dashboard data alone can&#x27;t answer (same file, :47-48). No other raw session dated on or before this one mentions residents (the only matches are that file&#x27;s :38, :44 and :47), and no earlier session interviewed a resident. This session asked one internal medicine resident, about nine months after the January 2026 GA, when and why they opted in to the ambient scribe. It is one resident&#x27;s account and can&#x27;t explain the gap the dashboard showed. Phase 4 has no inpatient, ED or behavioral health sessions, so whether and how residents use the scribe in those settings stays an open gap.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is an internal medicine resident who sees patients in an ambulatory internal medicine clinic on set half-days. They opted in to the ambient scribe in spring 2026, some months after the January 2026 GA, and use it for some of their clinic visits. The scribe drafts the visit note only; they review the draft, correct single lines in place, and sign. How attendings review resident notes was not discussed. Only clinic visits were discussed. They did not take part in any earlier session, and the researcher did not share what other participants had said. This is an interview about their own practice; nothing was shown or observed.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(waiting)</em> They did not opt in at GA. In their account, writing their own notes in their first months in clinic was how they worked out their assessment of a patient, and they did not want a draft doing that for them while they were still learning it. They did not describe doubts about the draft&#x27;s accuracy as the reason. This is one resident&#x27;s reason; whether other residents waited for the same reason is not known.</li><li><strong>[MEDIUM]</strong> <em>(opting in)</em> They opted in once they felt settled in writing notes and wanted to keep up on half-days that ran late. They put that at &quot;about three months into clinic&quot;, an informal recollection.</li><li><strong>[MEDIUM]</strong> <em>(which visits)</em> They use the scribe mostly for follow-up visits on problems they already know. For a new problem they write the assessment themselves, or rewrite the draft&#x27;s assessment before signing. That is their description of their own practice; how often they do each was not discussed.</li><li><strong>[LOW]</strong> <em>(how they heard)</em> What they knew about the scribe before opting in came from seeing attendings in their clinic use it. They did not know of any training or introduction aimed at residents.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Writing the assessment is how I work out what I think. I didn&#x27;t want something else writing it while I was still learning that.&quot;</p><p>— Physician (Internal Medicine resident), P153</p></blockquote>\n<blockquote><p>&quot;For a follow-up on a problem I know, the draft is fine. A new problem, I still write the assessment myself.&quot;</p><p>— Physician (Internal Medicine resident), P153</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>When resident adoption is next looked at, ask about note writing as part of training alongside workflow and trust; this resident&#x27;s reason for waiting was learning to write notes, not doubt about the draft&#x27;s accuracy.</li><li>Interview more residents, including in other departments, before drawing conclusions about the adoption gap; this is one resident.</li><li>Record how residents are offered the scribe and any training for them; the corpus has nothing on it.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Why residents opted in less often in the first four weeks is still not known; one resident&#x27;s account can&#x27;t explain it.</li><li>Whether residents use the scribe in inpatient, ED or behavioral health settings is not known; Phase 4 has no sessions in those settings, and the gap stays open.</li><li>How attendings review scribe-drafted resident notes was not discussed and is not recorded in the corpus.</li></ul>\n<h2>Related</h2>\n<ul><li>Earlier session: <a href=\"../2026-01-27-dashboard-review-ambient-scribe-ga-adoption/session-notes.md\">2026-01-27 GA adoption dashboard review</a></li><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Internal Medicine Resident on Opting In to the Scribe</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P153 — Physician (Internal Medicine resident) (physician)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via internal medicine clinic contacts, from clinicians who opted in to the ambient scribe after the January 2026 GA. This participant is a resident, new to the research, and did not take part in any earlier session. They are not P09, P11, P22, P27, P84, P119, P146, P147, P149 or P150, the physicians in earlier sessions. No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</p>", "searchText": "interview — internal medicine resident on opting in to the scribe ambient-scribe rollout change-management clinician-workflow project-ambient-scribe ambient-scribe-widget interview — internal medicine resident on opting in to the scribe objective the 2026-01-27 review of the ambient scribe usage dashboard, covering the first four weeks of ga-candidate rollout, found attending physicians opting in at a noticeably higher rate than residents in the same departments (2026-01-27-dashboard-review-ambient-scribe-ga-adoption/session-notes.md:37-39). it recommended a short follow-up interview round on the physician/resident adoption gap (same file, :44) and asked whether the gap is explained by workflow differences, trust, or something else, which dashboard data alone can&#x27;t answer (same file, :47-48). no other raw session dated on or before this one mentions residents (the only matches are that file&#x27;s :38, :44 and :47), and no earlier session interviewed a resident. this session asked one internal medicine resident, about nine months after the january 2026 ga, when and why they opted in to the ambient scribe. it is one resident&#x27;s account and can&#x27;t explain the gap the dashboard showed. phase 4 has no inpatient, ed or behavioral health sessions, so whether and how residents use the scribe in those settings stays an open gap. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is an internal medicine resident who sees patients in an ambulatory internal medicine clinic on set half-days. they opted in to the ambient scribe in spring 2026, some months after the january 2026 ga, and use it for some of their clinic visits. the scribe drafts the visit note only; they review the draft, correct single lines in place, and sign. how attendings review resident notes was not discussed. only clinic visits were discussed. they did not take part in any earlier session, and the researcher did not share what other participants had said. this is an interview about their own practice; nothing was shown or observed. key findings [medium] (waiting) they did not opt in at ga. in their account, writing their own notes in their first months in clinic was how they worked out their assessment of a patient, and they did not want a draft doing that for them while they were still learning it. they did not describe doubts about the draft&#x27;s accuracy as the reason. this is one resident&#x27;s reason; whether other residents waited for the same reason is not known. [medium] (opting in) they opted in once they felt settled in writing notes and wanted to keep up on half-days that ran late. they put that at &quot;about three months into clinic&quot;, an informal recollection. [medium] (which visits) they use the scribe mostly for follow-up visits on problems they already know. for a new problem they write the assessment themselves, or rewrite the draft&#x27;s assessment before signing. that is their description of their own practice; how often they do each was not discussed. [low] (how they heard) what they knew about the scribe before opting in came from seeing attendings in their clinic use it. they did not know of any training or introduction aimed at residents. representative quotes &quot;writing the assessment is how i work out what i think. i didn&#x27;t want something else writing it while i was still learning that.&quot; — physician (internal medicine resident), p153 &quot;for a follow-up on a problem i know, the draft is fine. a new problem, i still write the assessment myself.&quot; — physician (internal medicine resident), p153 recommendations when resident adoption is next looked at, ask about note writing as part of training alongside workflow and trust; this resident&#x27;s reason for waiting was learning to write notes, not doubt about the draft&#x27;s accuracy. interview more residents, including in other departments, before drawing conclusions about the adoption gap; this is one resident. record how residents are offered the scribe and any training for them; the corpus has nothing on it. follow-ups / open questions why residents opted in less often in the first four weeks is still not known; one resident&#x27;s account can&#x27;t explain it. whether residents use the scribe in inpatient, ed or behavioral health settings is not known; phase 4 has no sessions in those settings, and the gap stays open. how attendings review scribe-drafted resident notes was not discussed and is not recorded in the corpus. related earlier session: 2026-01-27 ga adoption dashboard review synthesized into: ambient-scribe.md participants participants — interview — internal medicine resident on opting in to the scribe count: 1 roles: p153 — physician (internal medicine resident) (physician) researcher: priya patel recruitment note: recruited via internal medicine clinic contacts, from clinicians who opted in to the ambient scribe after the january 2026 ga. this participant is a resident, new to the research, and did not take part in any earlier session. they are not p09, p11, p22, p27, p84, p119, p146, p147, p149 or p150, the physicians in earlier sessions. no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "raw:2026-10-13-interview-telemetry-nurse-start-of-shift-chart-review", "kind": "raw", "title": "Interview — Telemetry Nurse on Start-of-Shift Chart Review", "date": "2026-10-13", "type": "interview", "status": "raw", "tags": ["nursing", "chart-review", "clinician-workflow", "information-architecture", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-10-13-interview-telemetry-nurse-start-of-shift-chart-review/session-notes.md", "corrections": [], "html": "<h1>Interview — Telemetry Nurse on Start-of-Shift Chart Review</h1>\n<h2>Objective</h2>\n<p>The information-architecture evidence in <code>clinician-experience-documentation-burden.md</code> comes from the May 2025 dashboard test, whose roster lists physicians, a nurse practitioner and a physician assistant but no nurses; participants there preferred flags inline with the patient list over a separate panel (2025-05-06-usability-test-clinician-dashboard-redesign-v1/session-notes.md:31). The nurse sessions since then cover the handoff narrative (ICU, May 2026) and after-shift charting (medical-surgical, July 2026), but none describes how an inpatient nurse reviews the chart when they pick up their patients. This session asked a telemetry nurse how they review the chart at the start of a day shift, and what they would expect of an AI chart summary, which doesn&#x27;t exist.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 45 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li><li><strong>Context:</strong> The participant is a registered nurse on a step-down telemetry unit, working day shift, mid-career. Their charting is manual and no AI feature is used in their own work; the ambient scribe, GA since January 2026, drafts notes for physicians, NPs and PAs only. Everything they said about an AI chart summary is an expectation, not experience: the only summary concept in the corpus, the chart-review summary panel, is unbuilt and was scoped for care coordinators, and it was not described or shown in this session. They did not take part in any earlier session. They are not P141, the medical-surgical night nurse interviewed in July 2026, and not P140, the ICU nurse interviewed in May 2026.</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(start-of-shift order)</em> They review each patient&#x27;s chart in a fixed order, around the verbal report from the night nurse: the report first, then active orders, the medications due in the first hours of the shift, overnight telemetry events and vital-sign trends, the latest labs, then the night nurse&#x27;s narrative note, and the provider progress notes last, if there is time. The order follows what could hurt the patient soonest, not the chart&#x27;s sections, so they open several screens per patient to assemble it. They put it at &quot;about five minutes a patient, more for a new admission&quot; on a typical assignment of four; that is an informal estimate, not timed.</li><li><strong>[MEDIUM]</strong> <em>(expectation of an AI summary)</em> What they would expect of a summary at the start of a shift: items ordered by what needs action first (medications due, telemetry events, pending labs, new orders), each linked to where it came from in the chart, and a plain statement of what the summary covered, because a summary that leaves things out without saying so would send them back through the whole chart. They would not want it to replace the night nurse&#x27;s narrative, which they read anyway because it carries what the night nurse was worried about. This is an expectation of a tool that doesn&#x27;t exist; nothing was shown.</li><li><strong>[LOW]</strong> <em>(where it sits)</em> They would want any summary next to the patient list they start the shift from, not in a separate place they have to go looking for. This is consistent with the May 2025 dashboard test&#x27;s preference for information inline with the patient list, and adds a nurse view to it; it came up once and wasn&#x27;t explored.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I go in the order things can hurt somebody. What&#x27;s due, what the monitor caught overnight, then labs. Progress notes are last, if I get to them.&quot;</p><p>— Registered Nurse (telemetry), P145</p></blockquote>\n<blockquote><p>&quot;If it summarizes, it has to tell me what it didn&#x27;t look at. Otherwise I&#x27;m going through the whole chart again anyway.&quot;</p><p>— Registered Nurse (telemetry), P145</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>When <code>clinician-experience-documentation-burden.md</code> is next revised, add a nurse view to its information-architecture evidence: at the start of a shift, this nurse orders chart review by what needs action soonest, not by chart section.</li><li>If an AI chart summary for inpatient nurses is ever scoped, test ordering by time to action, links back to the source, a statement of what it covered, and keeping the night nurse&#x27;s narrative as written rather than summarized.</li><li>Keep this separate from the care coordinators&#x27; &quot;what changed&quot; concept: this nurse&#x27;s needs come from a shift handoff, and nothing here was tested against that concept.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>How long start-of-shift chart review takes is not measured; &quot;about five minutes a patient&quot; is one nurse&#x27;s estimate, on one unit.</li><li>Whether night-shift nurses, or nurses on other units, review the chart in the same order is not known; this is one interview.</li><li>Whether a summary would save time or add another screen to check is untested; no such summary exists.</li><li>Whether the provider notes they read are scribe-drafted didn&#x27;t come up and is not known.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Telemetry Nurse on Start-of-Shift Chart Review</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>P145 — Registered Nurse (telemetry) (nurse)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Recruited via inpatient nursing contacts. This participant is new to the research and did not take part in any earlier session. They are not P141, the medical-surgical night nurse from July</p>\n<ol><li>No real patient or staff identities are represented; the participant ID is a fictional label from the global sequence in <code>research/participants.yml</code>.</li></ol>", "searchText": "interview — telemetry nurse on start-of-shift chart review nursing chart-review clinician-workflow information-architecture project-cross-cutting interview — telemetry nurse on start-of-shift chart review objective the information-architecture evidence in clinician-experience-documentation-burden.md comes from the may 2025 dashboard test, whose roster lists physicians, a nurse practitioner and a physician assistant but no nurses; participants there preferred flags inline with the patient list over a separate panel (2025-05-06-usability-test-clinician-dashboard-redesign-v1/session-notes.md:31). the nurse sessions since then cover the handoff narrative (icu, may 2026) and after-shift charting (medical-surgical, july 2026), but none describes how an inpatient nurse reviews the chart when they pick up their patients. this session asked a telemetry nurse how they review the chart at the start of a day shift, and what they would expect of an ai chart summary, which doesn&#x27;t exist. method method: 1:1 interview, 45 min researcher: priya patel full participant roster: see participants.md in this folder context: the participant is a registered nurse on a step-down telemetry unit, working day shift, mid-career. their charting is manual and no ai feature is used in their own work; the ambient scribe, ga since january 2026, drafts notes for physicians, nps and pas only. everything they said about an ai chart summary is an expectation, not experience: the only summary concept in the corpus, the chart-review summary panel, is unbuilt and was scoped for care coordinators, and it was not described or shown in this session. they did not take part in any earlier session. they are not p141, the medical-surgical night nurse interviewed in july 2026, and not p140, the icu nurse interviewed in may 2026. key findings [medium] (start-of-shift order) they review each patient&#x27;s chart in a fixed order, around the verbal report from the night nurse: the report first, then active orders, the medications due in the first hours of the shift, overnight telemetry events and vital-sign trends, the latest labs, then the night nurse&#x27;s narrative note, and the provider progress notes last, if there is time. the order follows what could hurt the patient soonest, not the chart&#x27;s sections, so they open several screens per patient to assemble it. they put it at &quot;about five minutes a patient, more for a new admission&quot; on a typical assignment of four; that is an informal estimate, not timed. [medium] (expectation of an ai summary) what they would expect of a summary at the start of a shift: items ordered by what needs action first (medications due, telemetry events, pending labs, new orders), each linked to where it came from in the chart, and a plain statement of what the summary covered, because a summary that leaves things out without saying so would send them back through the whole chart. they would not want it to replace the night nurse&#x27;s narrative, which they read anyway because it carries what the night nurse was worried about. this is an expectation of a tool that doesn&#x27;t exist; nothing was shown. [low] (where it sits) they would want any summary next to the patient list they start the shift from, not in a separate place they have to go looking for. this is consistent with the may 2025 dashboard test&#x27;s preference for information inline with the patient list, and adds a nurse view to it; it came up once and wasn&#x27;t explored. representative quotes &quot;i go in the order things can hurt somebody. what&#x27;s due, what the monitor caught overnight, then labs. progress notes are last, if i get to them.&quot; — registered nurse (telemetry), p145 &quot;if it summarizes, it has to tell me what it didn&#x27;t look at. otherwise i&#x27;m going through the whole chart again anyway.&quot; — registered nurse (telemetry), p145 recommendations when clinician-experience-documentation-burden.md is next revised, add a nurse view to its information-architecture evidence: at the start of a shift, this nurse orders chart review by what needs action soonest, not by chart section. if an ai chart summary for inpatient nurses is ever scoped, test ordering by time to action, links back to the source, a statement of what it covered, and keeping the night nurse&#x27;s narrative as written rather than summarized. keep this separate from the care coordinators&#x27; &quot;what changed&quot; concept: this nurse&#x27;s needs come from a shift handoff, and nothing here was tested against that concept. follow-ups / open questions how long start-of-shift chart review takes is not measured; &quot;about five minutes a patient&quot; is one nurse&#x27;s estimate, on one unit. whether night-shift nurses, or nurses on other units, review the chart in the same order is not known; this is one interview. whether a summary would save time or add another screen to check is untested; no such summary exists. whether the provider notes they read are scribe-drafted didn&#x27;t come up and is not known. related synthesized into: clinician-experience-documentation-burden.md participants participants — interview — telemetry nurse on start-of-shift chart review count: 1 roles: p145 — registered nurse (telemetry) (nurse) researcher: priya patel recruitment note: recruited via inpatient nursing contacts. this participant is new to the research and did not take part in any earlier session. they are not p141, the medical-surgical night nurse from july no real patient or staff identities are represented; the participant id is a fictional label from the global sequence in research/participants.yml ."}, {"id": "finding:accessibility-cross-cutting", "kind": "finding", "title": "Accessibility (Cross-Cutting)", "date": "2025-11-18", "type": "synthesis", "status": "synthesized", "tags": ["accessibility", "components", "design-system", "extjs", "legacy", "low-vision", "mobile", "motor-impairment", "section-508", "wcag", "project-cross-cutting"], "related_components": ["admin-console-grid", "alert-triage-queue", "design-system-form-field", "design-system-modal", "mobile-app-alert-list"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/accessibility-cross-cutting.md", "corrections": [], "html": "<h1>Accessibility (Cross-Cutting)</h1>\n<h2>Overview</h2>\n<p>Three independent WCAG 2.1 AA audits across the year — the legacy ExtJS admin console (Mar 2025), the new design system component library (Jul 2025), and the mobile clinician app (Nov 2025) — turned up one recurring pattern worth calling out on its own, separate from each audit&#x27;s other findings.</p>\n<ul><li><strong>The same color-only status indicator (red/yellow/green dots, no text/pattern alternative) appears in all three surfaces audited this year.</strong> This was flagged as a likely single shared root component rather than three separate bugs, and the CIO cited it at the December executive retro as the example of what a &quot;cross-cutting findings&quot; reporting category should look like going forward (see [governance-and-phi.md](governance-and-phi.md)).</li><li><strong>Progress is visible surface-by-surface even though the pattern repeats</strong>: the modal keyboard-trap issue found in the legacy console (Mar) was already fixed by the time the new design system&#x27;s modal component was audited (Jul), though that same audit surfaced a <em>new</em> issue (form-field error association) not present in the legacy system.</li><li><strong>The mobile app audit (Nov) connects directly to a live Compass AI feature</strong>: undersized touch targets (32×32px vs. the 44×44px minimum) were found specifically on the alert-triage icon set, which is the same feature usability-tested in August — see [care-coordination-triage.md](care-coordination-triage.md). This is a case where an accessibility defect and a usability finding land on the exact same component from two different research methods.</li></ul>\n<p>Recommendation: treat the color-only status pattern as a single design-system-level fix rather than three surface-level tickets, and confirm whether a shared component is in fact the common root cause.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-03-10</strong> — <a href=\"../raw/2025-03-10-accessibility-audit-legacy-extjs-admin-console/session-notes.md\">Accessibility Audit — Legacy Admin Console (ExtJS)</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2025-07-01</strong> — <a href=\"../raw/2025-07-01-accessibility-audit-new-design-system-components/session-notes.md\">Accessibility Audit — New Design System Component Library</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2025-11-18</strong> — <a href=\"../raw/2025-11-18-accessibility-audit-mobile-clinician-app/session-notes.md\">Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</a> <em>(<code>accessibility-audit</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>(none currently linked)</li></ul>", "searchText": "accessibility (cross-cutting) accessibility components design-system extjs legacy low-vision mobile motor-impairment section-508 wcag project-cross-cutting admin-console-grid alert-triage-queue design-system-form-field design-system-modal mobile-app-alert-list accessibility (cross-cutting) overview three independent wcag 2.1 aa audits across the year — the legacy extjs admin console (mar 2025), the new design system component library (jul 2025), and the mobile clinician app (nov 2025) — turned up one recurring pattern worth calling out on its own, separate from each audit&#x27;s other findings. the same color-only status indicator (red/yellow/green dots, no text/pattern alternative) appears in all three surfaces audited this year. this was flagged as a likely single shared root component rather than three separate bugs, and the cio cited it at the december executive retro as the example of what a &quot;cross-cutting findings&quot; reporting category should look like going forward (see [governance-and-phi.md](governance-and-phi.md)). progress is visible surface-by-surface even though the pattern repeats : the modal keyboard-trap issue found in the legacy console (mar) was already fixed by the time the new design system&#x27;s modal component was audited (jul), though that same audit surfaced a new issue (form-field error association) not present in the legacy system. the mobile app audit (nov) connects directly to a live compass ai feature : undersized touch targets (32×32px vs. the 44×44px minimum) were found specifically on the alert-triage icon set, which is the same feature usability-tested in august — see [care-coordination-triage.md](care-coordination-triage.md). this is a case where an accessibility defect and a usability finding land on the exact same component from two different research methods. recommendation: treat the color-only status pattern as a single design-system-level fix rather than three surface-level tickets, and confirm whether a shared component is in fact the common root cause. evidence trail 2025-03-10 — accessibility audit — legacy admin console (extjs) ( accessibility-audit ) 2025-07-01 — accessibility audit — new design system component library ( accessibility-audit ) 2025-11-18 — accessibility audit — mobile clinician app (low vision &amp; motor impairment focus) ( accessibility-audit ) related findings (none currently linked)"}, {"id": "finding:ambient-scribe-post-ga-refinements", "kind": "finding", "title": "Ambient Scribe — Post-GA Refinements", "date": "2026-02-17", "type": "synthesis", "status": "synthesized", "tags": ["ambient-scribe", "medication-safety", "sso", "mfa", "phi", "longitudinal", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": "Jordan Lee", "path": "findings/ambient-scribe-post-ga-refinements.md", "corrections": [], "html": "<h1>Ambient Scribe — Post-GA Refinements</h1>\n<h2>Overview</h2>\n<p>Two follow-up threads opened by [ambient-scribe.md](ambient-scribe.md)&#x27;s GA-candidate round and by an open edge case noted directly in the <code>encounter-view</code> component — neither a launch blocker, both worth closing before they harden into permanent gaps.</p>\n<ul><li><strong>In a 6-person concept test, a distinct sound-alike-medication flag was recognized as different from generic confidence highlighting.</strong> The GA-candidate round treated sound-alike medication errors as an ongoing monitoring item, relying on the general <code>confidence-highlighted</code> variant to surface them. A concept test of a dedicated, visually distinct flag found 5 of 6 participants correctly recognized it as categorically different from generic low confidence — but also surfaced a new risk: 2 of 6 participants said the flag&#x27;s specificity made them trust <em>unflagged</em> medication lines more than they should. Any rollout needs to actively counter that over-trust framing, not just ship the flag.</li><li><strong>Session lock during active dictation currently reads as silent data loss, even though it isn&#x27;t.</strong> The <code>locked</code> state&#x27;s interaction with an in-progress recording was flagged as unresolved in <code>encounter-view</code>&#x27;s own notes, sourced from a May 2025 SSO/MFA interview side comment. Direct observation confirms the practical impact: all 4 shadowed clinicians assumed a locked session had destroyed their draft and restarted dictation from scratch, even though the draft is preserved server-side. IT Security confirmed the 10-minute idle-timeout policy itself is fixed, but an explicit &quot;paused, draft preserved&quot; state is a UI-only fix, not a policy change.</li><li>Both threads point the same direction: <strong>the underlying safety/reliability behavior is already correct (drafts are preserved; sound-alike names are technically detectable) — what&#x27;s missing is UI that tells the clinician that, specifically and distinctly, rather than relying on a generic low-confidence signal to carry two very different kinds of meaning.</strong></li></ul>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2026-02-10</strong> — <a href=\"../raw/2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md\">Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-02-17</strong> — <a href=\"../raw/2026-02-17-session-lock-during-dictation/session-notes.md\">Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation</a> <em>(<code>contextual-inquiry</code>)</em> — 5 participants: 4 shadowed clinicians plus 1 IT Security stakeholder (see the session&#x27;s <a href=\"../raw/2026-02-17-session-lock-during-dictation/correction-2026-09-27.md\">correction</a>; the session notes say &quot;5 clinicians&quot;)</li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li> detectable) — what&#x27;s missing is ui that tells the clinician that, specifically and distinctly, rather than relying on a generic low-confidence signal to carry two very different kinds of meaning. evidence trail 2026-02-10 — usability test — ambient scribe sound-alike medication flag concept ( usability-test ) 2026-02-17 — contextual inquiry — session lock during active ambient scribe dictation ( contextual-inquiry ) — 5 participants: 4 shadowed clinicians plus 1 it security stakeholder (see the session&#x27;s correction ; the session notes say &quot;5 clinicians&quot;) related findings [ambient ai scribe](ambient-scribe.md) [ai governance, phi &amp; compliance](governance-and-phi.md)"}, {"id": "finding:ambient-scribe", "kind": "finding", "title": "Ambient AI Scribe", "date": "2026-01-13", "type": "synthesis", "status": "synthesized", "tags": ["ambient-scribe", "documentation", "ga-release", "longitudinal", "usability", "v0.1", "v0.2", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/ambient-scribe.md", "corrections": [], "html": "<h1>Ambient AI Scribe</h1>\n<h2>Overview</h2>\n<p>The ambient AI scribe has moved from a formative concept (v0.1, Feb 2025) through iteration (v0.2, Sep 2025) to a GA release candidate (Jan 2026). 3 of the original 5 participants returned for v0.2, and at least one (P09) also took part in the GA-candidate round, for longitudinal comparison.</p>\n<ul><li><strong>PHI handling:</strong> The critical draft-retention/audit gap found in v0.1 was fixed by v0.2 and has remained stable through the GA candidate — drafts auto-expire after 10 minutes of inactivity and the behavior is documented for Compliance. No PHI-handling issues have recurred since.</li><li><strong>Accuracy:</strong> Medication dosage errors dropped from 3/5 sessions (v0.1) to 1/5 (v0.2); the remaining error type is misheard similar-sounding drug names. The GA-candidate round recommended treating it as a post-GA monitoring item rather than a pre-GA blocker, and recommended a post-GA monitoring dashboard for it; the 2026-02-10 session still refers to that dashboard as recommended.</li><li><strong>Trust calibration was the hardest problem, and accuracy alone didn&#x27;t solve it.</strong> Returning participants read every line in both v0.1 and v0.2 despite the accuracy improvement between them — trust didn&#x27;t move with correctness. The GA-candidate round introduced per-line confidence highlighting, and for the first time participants reported actually skimming high-confidence lines. This is the strongest evidence so far that <em>visible uncertainty</em>, not raw accuracy, is the lever that changes reviewing behavior.</li><li><strong>Recommendation status:</strong> The GA-candidate session recommends GA release, with sound-alike medication errors tracked as a post-GA metric rather than delaying release.</li></ul>\n<p>Open thread: this tool&#x27;s rollout scope has been deliberately kept away from behavioral health / substance-use encounters — see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md).</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-02-25</strong> — <a href=\"../raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md\">Usability Test — Ambient AI Scribe Prototype v0.1</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-09-23</strong> — <a href=\"../raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md\">Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-01-13</strong> — <a href=\"../raw/2026-01-13-usability-test-ambient-scribe-ga-release-candidate/session-notes.md\">Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2026-01-27</strong> — <a href=\"../raw/2026-01-27-dashboard-review-ambient-scribe-ga-adoption/session-notes.md\">Dashboard review — Ambient scribe GA candidate adoption</a> <em>(<code>analytics</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[AI Governance, PHI &amp; Compliance](governance-and-phi.md)</li><li>[Clinician Experience &amp; Documentation Burden](clinician-experience-documentation-burden.md)</li><li>[Ambient Scribe — Post-GA Refinements](ambient-scribe-post-ga-refinements.md)</li></ul>", "searchText": "ambient ai scribe ambient-scribe documentation ga-release longitudinal usability v0.1 v0.2 project-ambient-scribe ambient-scribe-widget encounter-view ambient ai scribe overview the ambient ai scribe has moved from a formative concept (v0.1, feb 2025) through iteration (v0.2, sep 2025) to a ga release candidate (jan 2026). 3 of the original 5 participants returned for v0.2, and at least one (p09) also took part in the ga-candidate round, for longitudinal comparison. phi handling: the critical draft-retention/audit gap found in v0.1 was fixed by v0.2 and has remained stable through the ga candidate — drafts auto-expire after 10 minutes of inactivity and the behavior is documented for compliance. no phi-handling issues have recurred since. accuracy: medication dosage errors dropped from 3/5 sessions (v0.1) to 1/5 (v0.2); the remaining error type is misheard similar-sounding drug names. the ga-candidate round recommended treating it as a post-ga monitoring item rather than a pre-ga blocker, and recommended a post-ga monitoring dashboard for it; the 2026-02-10 session still refers to that dashboard as recommended. trust calibration was the hardest problem, and accuracy alone didn&#x27;t solve it. returning participants read every line in both v0.1 and v0.2 despite the accuracy improvement between them — trust didn&#x27;t move with correctness. the ga-candidate round introduced per-line confidence highlighting, and for the first time participants reported actually skimming high-confidence lines. this is the strongest evidence so far that visible uncertainty , not raw accuracy, is the lever that changes reviewing behavior. recommendation status: the ga-candidate session recommends ga release, with sound-alike medication errors tracked as a post-ga metric rather than delaying release. open thread: this tool&#x27;s rollout scope has been deliberately kept away from behavioral health / substance-use encounters — see [scope-boundaries-and-workflow-fit.md](scope-boundaries-and-workflow-fit.md). evidence trail 2025-02-25 — usability test — ambient ai scribe prototype v0.1 ( usability-test ) 2025-09-23 — usability test — ambient ai scribe prototype v0.2 (follow-up) ( usability-test ) 2026-01-13 — usability test — ambient ai scribe ga release candidate (final validation) ( usability-test ) 2026-01-27 — dashboard review — ambient scribe ga candidate adoption ( analytics ) related findings [ai governance, phi &amp; compliance](governance-and-phi.md) [clinician experience &amp; documentation burden](clinician-experience-documentation-burden.md) [ambient scribe — post-ga refinements](ambient-scribe-post-ga-refinements.md)"}, {"id": "finding:care-coordination-triage", "kind": "finding", "title": "Care Coordination & Alert Triage", "date": "2026-09-29", "type": "synthesis", "status": "synthesized", "tags": ["alert-fatigue", "alert-triage", "ambient-scribe", "baseline", "care-coordination", "chart-review", "medication-safety", "scheduling", "training", "usability", "workflow", "project-care-coordination"], "related_components": ["alert-triage-queue", "chart-review-summary-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/care-coordination-triage.md", "corrections": [], "html": "<h1>Care Coordination &amp; Alert Triage</h1>\n<h2>Overview</h2>\n<p>Two sessions bookend this topic: a baseline contextual inquiry of manual chart review (Jan 2025, before any AI concept existed) and a usability test of an AI-ranked alert triage queue (Aug 2025).</p>\n<ul><li><strong>The baseline recommended a narrow scope.</strong> Coordinators already distrusted the EHR&#x27;s auto-generated after-visit summaries, having caught them omitting recently changed medications twice in the past quarter. One coordinator (P05) said: &quot;If it could just tell me what changed since I last touched this chart, that alone would save me time. I don&#x27;t need it to think for me.&quot; The session recommended scoping an early AI concept around &#x27;what changed since last review&#x27; rather than full summarization.</li><li><strong>The AI-ranked queue was faster, but most participants disagreed with its ranking.</strong> In this simulated test, triage of a 20-item queue was faster with AI ranking present (avg 6.5 min) than with a chronological queue (avg 9 min), but 4 of 5 participants disagreed with the AI&#x27;s top-3 ranking on at least one of three test queues, generally because the model weighted recency more heavily than coordinators&#x27; own sense of clinical risk — echoing the alert-fatigue concern raised separately in the May clinician dashboard testing (see [clinician-experience-documentation-burden.md](clinician-experience-documentation-burden.md)). There was also no way to capture <em>why</em> a coordinator overrode a ranking, so that correction signal isn&#x27;t captured anywhere for future model improvement. Separately, the supervisor (P79) worried that speed gains could mask a coordinator rubber-stamping the AI order without real judgment: &quot;fast and wrong is worse than slow and right in this job.&quot; The study&#x27;s own recommendation adds that override-reason capture would give coordinators a sense of agency the current design lacks.</li><li><strong>This is also where the mobile accessibility touch-target finding lands</strong> — the alert-triage icon set audited in November is the same feature tested here in August (see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)).</li></ul>\n<p>Recommendation: add lightweight override-reason capture before further ranking-model tuning, and share it with whoever owns the care-gap flagging model tuning, since it&#x27;s likely the same underlying problem.</p>\n<h2>Since GA: 2026 Coordinator Interviews</h2>\n<p>Ten 1:1 interviews between March and September 2026 revisited both threads after the ambient scribe went GA: eight with coordinators new to this research (P130–P137) and two with returning participants, P05 from the January 2025 baseline and P81 from the August 2025 test. Neither the AI-ranked queue nor the chart-review summary panel has been built, and the override-reason wireflow is still in review, so reactions come from descriptions of the ranked queue and, in one session, the wireflow screens. Coordinators read clinicians&#x27; signed notes, including scribe-drafted ones, but don&#x27;t use the scribe themselves (2026-03-03). Every figure below is an informal participant estimate or recollection, not a count or a rate.</p>\n<ul><li><strong>Float pool versus continuity.</strong> Two float coordinators lack the patient history that team coordinators use to reorder alerts. P05 works the current chronological queue strictly in order when floating and leaves reprioritising to the team&#x27;s own coordinators (2026-04-07, MEDIUM), and P136 would accept a ranked queue as a starting point while still checking it (2026-09-01, MEDIUM). On the other side, two team coordinators lean on knowing their patients: P81&#x27;s August 2025 comment about a patient&#x27;s history, and P134 on a high-risk panel (2026-08-04, MEDIUM). That is two voices on each side: a contrast worth testing, not a pattern. P136 also switches between several team queues in a shift with no combined view (2026-09-01, HIGH).</li><li><strong>The right ranking signal depends on the alert type.</strong> For discharge alerts, a transitions of care coordinator said time since discharge <em>is</em> the clinical risk, because the first days at home are when a missed change matters most (2026-04-16, MEDIUM). This refines rather than contradicts the August 2025 finding that the model weighted recency more heavily than coordinators&#x27; sense of clinical risk: for this alert type, recency and risk point the same way.</li><li><strong>Repeat alerts and volume.</strong> For a complex care coordinator, the main noise is repeat alerts for the same patient, more than the order alerts arrive in, and they would group alerts by patient before any ranking is applied (2026-08-04, HIGH). A supervisor put heavy days at &quot;maybe 30 to 60 alerts&quot; per coordinator, many of them administrative rather than clinical (informal estimate; 2026-05-05, MEDIUM).</li><li><strong>Override reasons.</strong> Looking at the in-review wireflow, P81 said their most common reason for moving an alert, something the patient or a family member said on the phone that isn&#x27;t in the chart yet, is missing from the reason list, so it would land in &quot;other&quot; (2026-07-07, HIGH). They would give a reason in one tap but not type free text on every override, and would stop giving reasons if they never saw any effect from them (2026-07-07, MEDIUM). A supervisor would use reasons for coaching as well as model tuning, and wants a record of the order each coordinator was shown and what they did with it (2026-05-05, HIGH). That raises who sees the reasons, which the wireflow doesn&#x27;t settle: it logs them for model-tuning review, &quot;not surfaced to other coordinators&quot;, and says nothing about supervisors.</li><li><strong>What &quot;what changed&quot; is anchored on.</strong> Two coordinators moved the reference point away from &quot;since I last touched this chart&quot;. P130 anchored it on their own last outreach call rather than the patient&#x27;s last visit (2026-03-03, MEDIUM), and P05, now floating, on the team&#x27;s last contact with the patient, whoever made it, because on a covering shift they have often never touched the chart (2026-04-07, MEDIUM). A referral follow-up coordinator said it has to cover appointments and results, not just medications (2026-09-29, MEDIUM).</li><li><strong>Workarounds, learning the role and the legacy scheduling tool.</strong> Conventions such as the shared spreadsheet&#x27;s colours and which alerts can wait are still passed on by word of mouth. A newer coordinator learned them by shadowing, with nothing written down, and said newer coordinators might gain most from a ranked queue but be least able to tell when it is wrong (2026-08-20, HIGH); a remote coordinator learned the colours by asking colleagues and keeps a private key (2026-06-09, MEDIUM). Chart review took the newer coordinator &quot;closer to 20 minutes at first&quot; (informal recollection; 2026-08-20, MEDIUM). Coordinators still cross-check the same 3 to 4 systems before a call, and from home the legacy scheduling tool is the slowest of them (2026-06-09, HIGH). Confirming there whether a referred appointment happened is the biggest time sink for a referral follow-up coordinator, and overdue-referral alerts are often already resolved (2026-09-29, HIGH). Scribe-drafted notes are longer, so coordinators skip to the plan and medication list, at &quot;a couple of extra minutes&quot; on complex patients (informal; 2026-03-03, HIGH).</li><li><strong>After-visit summaries.</strong> A transitions of care coordinator recalled the after-visit summary leaving out a medication change &quot;a few times this year&quot;, with no log and no count of correct summaries (2026-04-16, HIGH). That is an anecdote, not a rate.</li></ul>\n<p>Still open after the 2026 interviews: how often the after-visit summary misses changes; whether the 2025 queue showed coordinators what its ranking was based on; how accurate the ranking is; real-world triage speed; how often coordinators follow a ranked order without judgement (no measurement of rubber-stamping); and whether the override-capture idea reached the data-science team.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-01-29</strong> — <a href=\"../raw/2025-01-29-contextual-inquiry-chart-review-baseline/session-notes.md\">Contextual Inquiry — Manual Chart Review Baseline (Care Coordinators)</a> <em>(<code>contextual-inquiry</code>)</em></li><li><strong>2025-08-26</strong> — <a href=\"../raw/2025-08-26-usability-test-alert-triage-ai-care-coordination/session-notes.md\">Usability Test — AI Alert Triage for Care Coordination</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-11-18</strong> — <a href=\"../raw/2025-11-18-accessibility-audit-mobile-clinician-app/session-notes.md\">Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</a> <em>(<code>accessibility-audit</code>)</em></li><li><strong>2026-03-03</strong> — <a href=\"../raw/2026-03-03-interview-care-coordinator-chart-review-scribe-notes/session-notes.md\">Interview — Care Coordinator on Chart Review of Scribe-Drafted Notes</a> <em>(<code>interview</code>)</em></li><li><strong>2026-04-07</strong> — <a href=\"../raw/2026-04-07-interview-care-coordinator-float-pool-system-familiarity/session-notes.md\">Interview — Float-Pool Care Coordinator on System Familiarity</a> <em>(<code>interview</code>)</em></li><li><strong>2026-04-16</strong> — <a href=\"../raw/2026-04-16-interview-care-coordinator-transitions-medication-changes/session-notes.md\">Interview — Transitions-of-Care Coordinator on Medication Changes after Discharge</a> <em>(<code>interview</code>)</em></li><li><strong>2026-05-05</strong> — <a href=\"../raw/2026-05-05-interview-care-coordinator-supervisor-queue-oversight/session-notes.md\">Interview — Care Coordinator Supervisor on Queue Oversight</a> <em>(<code>interview</code>)</em></li><li><strong>2026-06-09</strong> — <a href=\"../raw/2026-06-09-interview-care-coordinator-remote-outreach/session-notes.md\">Interview — Remote Care Coordinator on Telephonic Outreach</a> <em>(<code>interview</code>)</em></li><li><strong>2026-07-07</strong> — <a href=\"../raw/2026-07-07-interview-care-coordinator-override-reason-capture/session-notes.md\">Interview — Returning Care Coordinator on Override-Reason Capture</a> <em>(<code>interview</code>)</em></li><li><strong>2026-08-04</strong> — <a href=\"../raw/2026-08-04-interview-care-coordinator-complex-care-alert-volume/session-notes.md\">Interview — Complex Care Coordinator on Alert Volume</a> <em>(<code>interview</code>)</em></li><li><strong>2026-08-20</strong> — <a href=\"../raw/2026-08-20-interview-care-coordinator-new-hire-shadowing/session-notes.md\">Interview — New Care Coordinator on Learning the Queue</a> <em>(<code>interview</code>)</em></li><li><strong>2026-09-01</strong> — <a href=\"../raw/2026-09-01-interview-care-coordinator-float-pool-coverage/session-notes.md\">Interview — Float Pool Care Coordinator on Covering Several Teams</a> <em>(<code>interview</code>)</em></li><li><strong>2026-09-29</strong> — <a href=\"../raw/2026-09-29-interview-care-coordinator-referral-follow-up/session-notes.md\">Interview — Specialty Clinic Care Coordinator on Referral Follow-up</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Clinician Experience &amp; Documentation Burden](clinician-experience-documentation-burden.md)</li></ul>", "searchText": "care coordination & alert triage alert-fatigue alert-triage ambient-scribe baseline care-coordination chart-review medication-safety scheduling training usability workflow project-care-coordination alert-triage-queue chart-review-summary-panel care coordination &amp; alert triage overview two sessions bookend this topic: a baseline contextual inquiry of manual chart review (jan 2025, before any ai concept existed) and a usability test of an ai-ranked alert triage queue (aug 2025). the baseline recommended a narrow scope. coordinator view of scribe-drafted notes ( interview ) 2026-04-07 — interview — float-pool care coordinator on system familiarity ( interview ) 2026-04-16 — interview — transitions-of-care coordinator on medication changes after discharge ( interview ) 2026-05-05 — interview — care coordinator supervisor on queue oversight ( interview ) 2026-06-09 — interview — remote care coordinator on telephonic outreach ( interview ) 2026-07-07 — interview — returning care coordinator on override-reason capture ( interview ) 2026-08-04 — interview — complex care coordinator on alert volume ( interview ) 2026-08-20 — interview — new care coordinator on learning the queue ( interview ) 2026-09-01 — interview — float pool care coordinator on covering several teams ( interview ) 2026-09-29 — interview — specialty clinic care coordinator on referral follow-up ( interview ) related findings [clinician experience &amp; documentation burden](clinician-experience-documentation-burden.md)"}, {"id": "finding:clinician-experience-documentation-burden", "kind": "finding", "title": "Clinician Experience & Documentation Burden", "date": "2026-10-13", "type": "synthesis", "status": "synthesized", "tags": ["ambient-scribe", "baseline", "burnout", "chart-review", "clinician-experience", "clinician-workflow", "dashboard", "documentation", "documentation-burden", "high-acuity", "information-architecture", "nursing", "survey", "trust-in-ai", "usability", "project-cross-cutting"], "related_components": ["ambient-scribe-widget", "care-gap-badge", "clinician-dashboard"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/clinician-experience-documentation-burden.md", "corrections": [], "html": "<h1>Clinician Experience &amp; Documentation Burden</h1>\n<h2>Overview</h2>\n<p>Three sessions trace clinician sentiment and documentation burden across the year: a nursing attitudes survey (Feb 2025, before AI framing was introduced), a clinician dashboard usability test (May 2025), and an org-wide burnout/documentation-burden baseline survey (Sep 2025, which explicitly referenced the AI initiative).</p>\n<ul><li><strong>The top volunteered concern was not accuracy or privacy — it was voice.</strong> In February, &quot;losing my clinical narrative voice / it will sound robotic&quot; was the most common open-ended concern among nurses — not accuracy or privacy as originally hypothesized.</li><li><strong>Documentation burden is real and quantifiable, not just anecdotal.</strong> The September baseline found documentation burden is physicians&#x27; #1 self-selected burnout driver (52%, ahead of patient volume at 31%), with 64% doing regular after-hours &quot;pajama time&quot; charting (avg. 1.2 hrs/day). The session recommends it as the official pre-AI baseline for measuring Compass AI&#x27;s impact at 6 and 12 months post-rollout. <strong>Caveat:</strong> the September survey mentioned the AI initiative explicitly in its framing, while the February survey didn&#x27;t — any comparison between the two datasets needs to account for that framing difference, not treat them as a clean before/after.</li><li><strong>Alert fatigue is an emerging risk, not yet realized.</strong> The May dashboard test found that 5 of 6 participants expected AI-flagged &quot;care gap&quot; badges to become background noise within a week if flagging precision isn&#x27;t improved — 2 of the 3 example flags shown were judged clinically low-value. The care-coordination alert triage testing later echoed this alert-fatigue concern (see [care-coordination-triage.md](care-coordination-triage.md)). That session judged the two &quot;likely the same underlying tuning problem&quot; — an inference it recommended sharing with the care-gap model&#x27;s Data Science team, not something either session tested.</li></ul>\n<p>Recommendation: do not ship the care-gap flagging feature until precision is validated against clinical review, and use the September survey as the fixed baseline instrument for future comparisons rather than re-wording the questions.</p>\n<h2>Since GA: 2026 Nurse Interviews</h2>\n<p>Four 1:1 interviews between March and October 2026 asked registered nurses, all new to this research, about documentation after the ambient scribe went GA in January 2026: a primary care clinic nurse (P138), an ICU nurse (P140), a medical-surgical night nurse (P141) and a telemetry nurse (P145). The scribe drafts visit notes for physicians, NPs and PAs only; no nurse uses it for their own documentation and nurse charting is manual, so what nurses said about AI drafting nursing notes is expectation, not experience. Every figure below is an informal participant estimate or recollection, not a count or a rate.</p>\n<ul><li><strong>The September figures are physician-only.</strong> The 52%, 31%, 64% and 1.2 hours a day above describe physicians and should not be read as describing nurses. The September baseline&#x27;s roster lists registered nurses among its respondents, but its notes report these figures for physicians only, and whether nurse results exist is not recorded.</li><li><strong>Charting after the shift: one nurse&#x27;s account, and no nurse figure.</strong> A medical-surgical night nurse regularly finishes notes after handoff, &quot;most shifts, thirty to forty-five minutes&quot;, mostly narrative and end-of-shift reassessments deferred whenever a patient needed something (informal self-estimate; 2026-07-21, HIGH). That is one nurse on one unit, not comparable to the physician figures; they described fatigue, not burnout, and no burnout measure was used.</li><li><strong>The voice concern has two readings.</strong> The February 2025 survey framed it as nurses losing their own narrative voice. An ICU nurse described the narrative as a handoff safety artifact, where they record what worried them and what the next nurse should watch, and expected that a nurse at the end of a twelve-hour shift would accept an AI draft of it rather than rewrite it (2026-05-28, HIGH; the expectation, MEDIUM). A clinic nurse who reads scribe-drafted provider notes placed the concern in other people&#x27;s notes: they read less like the provider, so it is harder to tell what the provider meant to emphasise (2026-03-17, MEDIUM). This complicates the survey&#x27;s framing, but it doesn&#x27;t show which reading is more common: the two readings come from different nurses, and neither is a count.</li><li><strong>A clinic nurse who reads scribe-drafted notes reads the whole note, not just the plan.</strong> They now read the whole note before a callback, because plan items said during the visit sometimes land in the body rather than the plan; they put near-misses at &quot;a few times a week&quot;, an informal impression (2026-03-17, HIGH). If the plan is incomplete, they message the provider before calling the patient, which delays the callback.</li><li><strong>One telemetry nurse&#x27;s start-of-shift review follows urgency, not the chart&#x27;s sections.</strong> They review each chart in the order of what could hurt the patient soonest (medications due, overnight telemetry events and trends, labs, then the night nurse&#x27;s narrative, progress notes last), at &quot;about five minutes a patient&quot; on an assignment of four (informal estimate; 2026-10-13, MEDIUM). They would expect an AI summary to order items by what needs action first, link each to its source, say what it covered, sit next to the patient list, and leave the night nurse&#x27;s narrative as written (2026-10-13, MEDIUM and LOW; an expectation, nothing shown). This adds a nurse view to the May 2025 test&#x27;s information-architecture evidence, whose roster had no nurses.</li></ul>\n<p>Still open after the 2026 interviews: how much time nurses spend charting (nothing measured); whether skepticism varies with tenure (the February survey&#x27;s cross-tab hasn&#x27;t been run, and one newer nurse&#x27;s view can&#x27;t answer it); whether the survey&#x27;s ICU and ED skepticism holds beyond one ICU interview; and how often plan items land outside the plan in scribe-drafted notes.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-02-11</strong> — <a href=\"../raw/2025-02-11-survey-nursing-attitudes-ai-documentation/session-notes.md\">Survey — Nursing Staff Attitudes Toward AI-Assisted Documentation</a> <em>(<code>survey</code>)</em></li><li><strong>2025-05-06</strong> — <a href=\"../raw/2025-05-06-usability-test-clinician-dashboard-redesign-v1/session-notes.md\">Usability Test — Clinician Dashboard Redesign (v1)</a> <em>(<code>usability-test</code>)</em></li><li><strong>2025-09-09</strong> — <a href=\"../raw/2025-09-09-survey-clinician-burnout-documentation-burden-baseline/session-notes.md\">Survey — Clinician Burnout &amp; Documentation Burden Baseline</a> <em>(<code>survey</code>)</em></li><li><strong>2026-03-17</strong> — <a href=\"../raw/2026-03-17-interview-clinic-nurse-reading-scribe-drafted-notes/session-notes.md\">Interview — Clinic Nurse on Reading Scribe-Drafted Visit Notes</a> <em>(<code>interview</code>)</em></li><li><strong>2026-05-28</strong> — <a href=\"../raw/2026-05-28-interview-icu-nurse-handoff-narrative/session-notes.md\">Interview — ICU Nurse on the Handoff Narrative</a> <em>(<code>interview</code>)</em></li><li><strong>2026-07-21</strong> — <a href=\"../raw/2026-07-21-interview-med-surg-night-nurse-charting-load/session-notes.md\">Interview — Med-Surg Night Nurse on Charting Load</a> <em>(<code>interview</code>)</em></li><li><strong>2026-10-13</strong> — <a href=\"../raw/2026-10-13-interview-telemetry-nurse-start-of-shift-chart-review/session-notes.md\">Interview — Telemetry Nurse on Start-of-Shift Chart Review</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[Care Coordination &amp; Alert Triage](care-coordination-triage.md)</li></ul>", "searchText": e, whose roster had no nurses. still open after the 2026 interviews: how much time nurses spend charting (nothing measured); whether skepticism varies with tenure (the february survey&#x27;s cross-tab hasn&#x27;t been run, and one newer nurse&#x27;s view can&#x27;t answer it); whether the survey&#x27;s icu and ed skepticism holds beyond one icu interview; and how often plan items land outside the plan in scribe-drafted notes. evidence trail 2025-02-11 — survey — nursing staff attitudes toward ai-assisted documentation ( survey ) 2025-05-06 — usability test — clinician dashboard redesign (v1) ( usability-test ) 2025-09-09 — survey — clinician burnout &amp; documentation burden baseline ( survey ) 2026-03-17 — interview — clinic nurse on reading scribe-drafted visit notes ( interview ) 2026-05-28 — interview — icu nurse on the handoff narrative ( interview ) 2026-07-21 — interview — med-surg night nurse on charting load ( interview ) 2026-10-13 — interview — telemetry nurse on start-of-shift chart review ( interview ) related findings [ambient ai scribe](ambient-scribe.md) [care coordination &amp; alert triage](care-coordination-triage.md)"}, {"id": "finding:governance-and-phi", "kind": "finding", "title": "AI Governance, PHI & Compliance", "date": "2026-06-02", "type": "synthesis", "status": "synthesized", "tags": ["ai-generated-content", "ai-strategy", "audit-trail", "cmio", "de-identification", "executive", "governance", "hipaa", "kickoff", "legal-record", "phi", "privacy", "retro", "roadmap", "year-end", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": "Priya Patel", "designer": null, "evaluator": null, "reviewed_by": null, "path": "findings/governance-and-phi.md", "corrections": [], "html": "<h1>AI Governance, PHI &amp; Compliance</h1>\n<h2>Overview</h2>\n<p>This is the connective tissue for the whole program: four sessions across the year — two executive-level sessions, the initial kickoff (Jan 2025) and the year-end retro (Dec 2025), with a Privacy Officer interview (Mar 2025) and a CMIO interview (Aug 2025) in between. Two 2026 HIM interviews (Apr and Jun 2026) add to the open attestation question below.</p>\n<ul><li><strong>The shared-metrics gap identified in January was real and took all year to close.</strong> At kickoff, the CIO and VP Clinical Informatics couldn&#x27;t agree on what &quot;success&quot; meant. By December&#x27;s retro, the same two executives (plus Privacy and CMIO) had converged on two headline 2026 metrics: documentation time saved, and PHI incidents (target: zero). This is the single clearest before/after in the whole research program and should anchor how the 2026 roadmap is framed.</li><li><strong>De-identification and audit-trail requirements (Privacy Officer, Mar) turned out to be non-negotiable engineering constraints, not policy nice-to-haves</strong>: Safe Harbor-level de-identification for any fine-tuning/eval data, and model-version + input provenance logging for anything that becomes part of the legal record. These constraints were later validated as workable by the CMIO&#x27;s August interview, which proposed a concrete attestation model (once a clinician signs AI-assisted content, it carries the same liability as if they&#x27;d typed it, with generation metadata kept in an internal audit log only) — but that model still needs formal Legal/Compliance ratification, it is not yet policy.</li><li><strong>PHI-sensitivity-ordered rollout sequencing</strong> (lowest-sensitivity workflows first: scheduling → admin/coding → documentation → clinical-decision-adjacent) was proposed independently by executives in January and reaffirmed by the CMIO in August — it&#x27;s held up as a stable planning principle across two separate conversations eight months apart.</li><li><strong>A recurring cross-cutting finding was explicitly named as a category, not just fixed three times</strong>: the CIO used the color-only status indicator accessibility bug (found independently in three separate audits — see [accessibility-cross-cutting.md](accessibility-cross-cutting.md)) as the example of a pattern research should flag as such, not file as three unrelated tickets.</li><li><strong>The attestation model says where generation metadata lives, not who can read it or whether it&#x27;s part of the record.</strong> A coding auditor agreed the metadata should stay off the permanent chart, but said &quot;internal&quot; has to include the people who audit codes, not only IT (2026-04-21, HIGH). They also want a per-code record of what an AI coding suggester suggested and what the coder did with it treated as release-blocking (CRITICAL; see [him-coding-and-billing.md](him-coding-and-billing.md)). An ROI specialist didn&#x27;t know whether the scribe&#x27;s drafts or transcripts are part of the designated record set or legal record, or whether a requester could ask for them, and had had no ROI guidance on it since GA. One attorney&#x27;s request for &quot;all versions and drafts&quot; of a visit note was escalated, and they didn&#x27;t hear how it was resolved (2026-06-02, HIGH).</li></ul>\n<p>Two items still need to move from &quot;informally agreed in a meeting&quot; to an actual governance document: the 2026 headline metrics, and the AI-content attestation model. Ratifying the attestation model now also has to settle who can read the internal audit log and whether scribe generation metadata is part of the designated record set.</p>\n<h2>Evidence Trail</h2>\n<ul><li><strong>2025-01-14</strong> — <a href=\"../raw/2025-01-14-stakeholder-interview-ai-strategy-kickoff/session-notes.md\">AI Strategy Kickoff — Executive Alignment Interview</a> <em>(<code>interview</code>)</em></li><li><strong>2025-03-24</strong> — <a href=\"../raw/2025-03-24-interview-privacy-officer-deidentification-requirements/session-notes.md\">Interview — Privacy/Compliance Officer on De-Identification &amp; Audit Trail Requirements</a> <em>(<code>interview</code>)</em></li><li><strong>2025-08-12</strong> — <a href=\"../raw/2025-08-12-interview-cmio-ai-generated-content-governance/session-notes.md\">Interview — CMIO on Governance for AI-Generated Content in the Legal Record</a> <em>(<code>interview</code>)</em></li><li><strong>2025-12-16</strong> — <a href=\"../raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md\">Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</a> <em>(<code>interview</code>)</em></li><li><strong>2026-04-21</strong> — <a href=\"../raw/2026-04-21-interview-coding-auditor-override-audit-trail/session-notes.md\">Interview — Coding Auditor on Override Tracking and Audit Trail</a> <em>(<code>interview</code>)</em></li><li><strong>2026-06-02</strong> — <a href=\"../raw/2026-06-02-interview-him-specialist-roi-ai-drafted-notes/session-notes.md\">Interview — HIM Specialist on Releasing AI-Drafted Notes</a> <em>(<code>interview</code>)</em></li></ul>\n<h2>Related Findings</h2>\n<ul><li>[Ambient AI Scribe](ambient-scribe.md)</li><li>[Scope Boundaries &amp; Workflow Fit](scope-boundaries-and-workflow-fit.md)</li><li>[Ambient Scribe — Post-GA Refinements](ambient-scribe-post-ga-refinements.md)</li><li>[HIM: Coding, Billing &amp; Release of Information](him-coding-and-billing.md)</li></ul>", "searchText": "ai governance, phi & compliance ai-generated-content ai-strategy audit-trail cmio de-identification executive governance hipaa kickoff legal-record phi privacy retro roadmap year-end project-cross-cutting ai governance, phi &amp; compliance overview this is the connective tissue for the whole program: four sessions across the year — two executive-level sessions, the initial kickoff (jan 2025) and the year-end retro (dec 2025), with a privacy officer interview (mar 2025) and a cmio interview (aug 2025) in between. two 2026 him interviews (apr and jun 2026) add to the open attestation question below. the shared-metrics gap identified
