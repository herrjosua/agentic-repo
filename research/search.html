r&quot;) is the single largest drop-off point in the onboarding funnel, accounting for a larger share of incomplete signups than any other step. data sourced from the jan 2026 onboarding funnel export (platform analytics, not included in this fictional dataset — a real repo would keep the untouched export under analytics/raw/2026-01-onboarding-funnel-export/ ). interpretation drop-off concentrated at step 3 independently corroborates the usability study&#x27;s finding ( research/findings/onboarding.md ) that step 3&#x27;s wording is misread as optional — this isn&#x27;t users abandoning due to task difficulty, it&#x27;s users not realizing the step is required and exiting instead of completing it."}, {"id": "deliverable:research-plans/onboarding-usability-study-q1", "kind": "deliverable", "title": "Onboarding Usability Study — Q1", "date": "2026-01-12", "type": "research-plans", "status": "final", "tags": ["onboarding", "usability", "q1"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../research-plans/onboarding-usability-study-q1.md", "html": "<h2>Objectives</h2>\n<p>Understand where new workspace admins get stuck during first-time setup, and whether the current 6-step onboarding wizard matches how admins actually think about the task.</p>\n<h2>Method</h2>\n<p>Moderated remote usability sessions, 45 minutes each, think-aloud protocol. Sample: 6 participants, all first-time Fernway admins hired within the last 90 days, mix of company sizes (10–200 employees).</p>\n<h2>Timeline</h2>\n<ul><li>Recruiting: Jan 12–16</li><li>Sessions: Jan 19–23</li><li>Synthesis: Jan 26–30</li></ul>\n<h2>Related</h2>\n<p>See <code>facilitation-guides/onboarding-usability-guide.md</code> for the session script.</p>", "searchText": "onboarding usability study — q1 onboarding usability q1 objectives understand where new workspace admins get stuck during first-time setup, and whether the current 6-step onboarding wizard matches how admins actually think about the task. method moderated remote usability sessions, 45 minutes each, think-aloud protocol. sample: 6 participants, all first-time fernway admins hired within the last 90 days, mix of company sizes (10–200 employees). timeline recruiting: jan 12–16 sessions: jan 19–23 synthesis: jan 26–30 related see facilitation-guides/onboarding-usability-guide.md for the session script."}, {"id": "deliverable:facilitation-guides/onboarding-usability-guide", "kind": "deliverable", "title": "Onboarding Usability Study — Facilitation Guide", "date": "2026-01-16", "type": "facilitation-guides", "status": "final", "tags": ["onboarding", "usability"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../facilitation-guides/onboarding-usability-guide.md", "html": "<h2>Warm-up</h2>\n<ul><li>Tell me about your role and how long you&#x27;ve been using Fernway.</li><li>Walk me through the last time you set up a new workspace for your team.</li></ul>\n<h2>Core questions</h2>\n<ul><li>(Task) Imagine you just signed up — walk me through what you&#x27;d do first.</li><li>What does &quot;workspace&quot; mean to you before you&#x27;ve used the product?</li><li>At each step: what do you expect to happen next, before you click?</li></ul>\n<h2>Wrap-up</h2>\n<ul><li>What was the most confusing part of getting set up?</li><li>If you could change one thing about this flow, what would it be?</li><li>Thanks — anything you&#x27;d like to add that we didn&#x27;t cover?</li></ul>", "searchText": "onboarding usability study — facilitation guide onboarding usability warm-up tell me about your role and how long you&#x27;ve been using fernway. walk me through the last time you set up a new workspace for your team. core questions (task) imagine you just signed up — walk me through what you&#x27;d do first. what does &quot;workspace&quot; mean to you before you&#x27;ve used the product? at each step: what do you expect to happen next, before you click? wrap-up what was the most confusing part of getting set up? if you could change one thing about this flow, what would it be? thanks — anything you&#x27;d like to add that we didn&#x27;t cover?"}, {"id": "deliverable:topline-summaries/example-topline-summary", "kind": "deliverable", "title": "Onboarding Study — Session 1–3 Topline", "date": "2026-01-21", "type": "topline-summaries", "status": "final", "tags": ["onboarding", "usability"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../topline-summaries/example-topline-summary.md", "html": "<h2>Quick takeaways</h2>\n<ul><li>All 3 participants paused at step 3 (&quot;Invite your team&quot;) — unsure whether invites send immediately or wait until setup is finished.</li><li>2 of 3 tried to skip step 2 (&quot;Connect calendar&quot;) entirely, assuming it was optional even though it&#x27;s required.</li><li>Nobody read the sidebar progress indicator — all navigated by scrolling.</li></ul>\n<h2>Open questions</h2>\n<ul><li>Is the step-3 hesitation about wording, or about not trusting the system yet this early in the relationship? Watch for this in sessions 4–6.</li></ul>", "searchText": "onboarding study — session 1–3 topline onboarding usability quick takeaways all 3 participants paused at step 3 (&quot;invite your team&quot;) — unsure whether invites send immediately or wait until setup is finished. 2 of 3 tried to skip step 2 (&quot;connect calendar&quot;) entirely, assuming it was optional even though it&#x27;s required. nobody read the sidebar progress indicator — all navigated by scrolling. open questions is the step-3 hesitation about wording, or about not trusting the system yet this early in the relationship? watch for this in sessions 4–6."}, {"id": "deliverable:research-readouts/example-research-readout", "kind": "deliverable", "title": "Onboarding Flow — Q1 Readout", "date": "2026-02-03", "type": "research-readouts", "status": "final", "tags": ["onboarding", "readout", "q1"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../research-readouts/example-research-readout.md", "html": "<h2>Summary</h2>\n<p>New admins drop off most at the calendar-connection step, not because the step is hard, but because it&#x27;s unclear it&#x27;s required. Funnel data confirms the same step as the largest single drop-off point.</p>\n<h2>Key findings</h2>\n<ul><li>Step 3 wording implies optionality it doesn&#x27;t have — see finding <code>onboarding</code>.</li><li>Progress indicator is present but unused; participants navigate by scroll, not by the indicator.</li></ul>\n<h2>Recommendations</h2>\n<ul><li>Relabel step 3 to state clearly that calendar connection is required.</li><li>Consider removing the sidebar progress indicator or replacing it with inline step numbers, since it isn&#x27;t being used as designed.</li></ul>", "searchText": "onboarding flow — q1 readout onboarding readout q1 summary new admins drop off most at the calendar-connection step, not because the step is hard, but because it&#x27;s unclear it&#x27;s required. funnel data confirms the same step as the largest single drop-off point. key findings step 3 wording implies optionality it doesn&#x27;t have — see finding onboarding . progress indicator is present but unused; participants navigate by scroll, not by the indicator. recommendations relabel step 3 to state clearly that calendar connection is required. consider removing the sidebar progress indicator or replacing it with inline step numbers, since it isn&#x27;t being used as designed."}, {"id": "deliverable:heuristic-evaluations/example-heuristic-evaluation", "kind": "deliverable", "title": "Onboarding Wizard — Heuristic Evaluation", "date": "2026-02-05", "type": "heuristic-evaluations", "status": "final", "tags": ["onboarding", "heuristic-evaluation"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": "Jordan Lee", "reviewed_by": null, "path": "../heuristic-evaluations/example-heuristic-evaluation.md", "html": "<h2>Scope</h2>\n<p>Full onboarding wizard, steps 1–6, desktop web only.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>Heuristic violated</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Step 3 wording implies &quot;connect calendar&quot; is optional when it&#x27;s required</td><td>Match between system and real world</td><td>3</td><td>Step 3</td></tr><tr><td>No way to go back without losing entered data</td><td>User control and freedom</td><td>3</td><td>Steps 2–5</td></tr><tr><td>Progress indicator doesn&#x27;t reflect actual step count on mobile</td><td>Consistency and standards</td><td>2</td><td>Sidebar, mobile view</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Prioritize the step 3 wording fix (matches usability study finding) and the back-navigation data-loss issue before the mobile indicator fix.</p>", "searchText": "onboarding wizard — heuristic evaluation onboarding heuristic-evaluation scope full onboarding wizard, steps 1–6, desktop web only. issues found issue heuristic violated severity location step 3 wording implies &quot;connect calendar&quot; is optional when it&#x27;s required match between system and real world 3 step 3 no way to go back without losing entered data user control and freedom 3 steps 2–5 progress indicator doesn&#x27;t reflect actual step count on mobile consistency and standards 2 sidebar, mobile view recommendations prioritize the step 3 wording fix (matches usability study finding) and the back-navigation data-loss issue before the mobile indicator fix."}, {"id": "deliverable:accessibility-screenings/example-accessibility-screening", "kind": "deliverable", "title": "Onboarding Wizard — Accessibility Screening", "date": "2026-02-06", "type": "accessibility-screenings", "status": "final", "tags": ["onboarding", "accessibility"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../accessibility-screenings/example-accessibility-screening.md", "html": "<h2>Scope</h2>\n<p>Onboarding wizard, steps 1–6, screened against WCAG 2.1 AA using keyboard-only navigation and VoiceOver.</p>\n<h2>Issues found</h2>\n<table><thead><tr><th>Issue</th><th>WCAG criterion</th><th>Severity</th><th>Location</th></tr></thead><tbody><tr><td>Calendar-connect button has no accessible label, reads as &quot;button&quot;</td><td>4.1.2 Name, Role, Value</td><td>High</td><td>Step 3</td></tr><tr><td>Focus order skips the &quot;Skip this step&quot; link</td><td>2.4.3 Focus Order</td><td>Medium</td><td>Step 3</td></tr><tr><td>Error message color contrast is 3.2:1, below the 4.5:1 minimum</td><td>1.4.3 Contrast (Minimum)</td><td>Medium</td><td>Steps 2, 4</td></tr></tbody></table>\n<h2>Recommendations</h2>\n<p>Fix the calendar-connect button label first — it&#x27;s a full blocker for screen-reader users completing the required step.</p>", "searchText": "onboarding wizard — accessibility screening onboarding accessibility scope onboarding wizard, steps 1–6, screened against wcag 2.1 aa using keyboard-only navigation and voiceover. issues found issue wcag criterion severity location calendar-connect button has no accessible label, reads as &quot;button&quot; 4.1.2 name, role, value high step 3 focus order skips the &quot;skip this step&quot; link 2.4.3 focus order medium step 3 error message color contrast is 3.2:1, below the 4.5:1 minimum 1.4.3 contrast (minimum) medium steps 2, 4 recommendations fix the calendar-connect button label first — it&#x27;s a full blocker for screen-reader users completing the required step."}, {"id": "deliverable:service-topology/example-service-topology", "kind": "deliverable", "title": "Onboarding & Account Provisioning — Service Topology", "date": "2026-02-10", "type": "service-topology", "status": "in-review", "tags": ["onboarding", "service-blueprint"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../service-topology/example-service-topology.md", "html": "<h2>Overview</h2>\n<p>Maps the onboarding wizard&#x27;s front-end steps against the backend services they trigger: account creation, workspace provisioning, and calendar OAuth.</p>\n<h2>Map</h2>\n<p>Signup form -&gt; Account Service (sync) -&gt; Workspace Provisioning (async, ~8s average) -&gt; Calendar OAuth (external, Google/Outlook) -&gt; Invite Service (sends on submit, not on step completion — this is the source of the step-3 &quot;does this send now?&quot; confusion identified in the usability study).</p>", "searchText": "onboarding & account provisioning — service topology onboarding service-blueprint overview maps the onboarding wizard&#x27;s front-end steps against the backend services they trigger: account creation, workspace provisioning, and calendar oauth. map signup form -&gt; account service (sync) -&gt; workspace provisioning (async, ~8s average) -&gt; calendar oauth (external, google/outlook) -&gt; invite service (sends on submit, not on step completion — this is the source of the step-3 &quot;does this send now?&quot; confusion identified in the usability study)."}, {"id": "deliverable:personas/a-perfectly-normal-deliverable-slug", "kind": "deliverable", "title": "Legit deliverable", "date": "2026-09-21", "type": "personas", "status": "draft", "tags": [], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "../personas/a-perfectly-normal-deliverable-slug.md", "html": "<h1>Legit deliverable</h1>\n<h2>Description</h2>\n<p>TODO — one or two paragraphs describing this personas artifact.</p>\n<h2>Details</h2>\n<p>TODO</p>", "searchText": "legit deliverable legit deliverable description todo — one or two paragraphs describing this personas artifact. details todo"}, {"id": "deliverable:personas/dana-overwhelmed-new-admin", "kind": "deliverable", "title": "Dana — The Overwhelmed New Admin", "date": "2026-02-12", "type": "personas", "status": "final", "tags": ["onboarding", "persona"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../personas/dana-overwhelmed-new-admin.md", "html": "<h2>Summary</h2>\n<p>Dana, 34, Office Manager at a 40-person company. Just been handed Fernway setup as &quot;one more thing&quot; on top of her regular job. Not technical, but capable — she just doesn&#x27;t have time to figure things out by trial and error.</p>\n<h2>Goals</h2>\n<ul><li>Get the team up and running with minimal back-and-forth.</li><li>Avoid looking like she broke something in front of her team.</li></ul>\n<h2>Frustrations</h2>\n<ul><li>Steps that don&#x27;t clearly say what&#x27;s required vs. optional.</li><li>No way to preview what happens before committing to an action.</li></ul>\n<h2>Based on</h2>\n<p>Grounded in <code>research-plans/onboarding-usability-study-q1.md</code>, sessions 1–6.</p>", "searchText": "dana — the overwhelmed new admin onboarding persona summary dana, 34, office manager at a 40-person company. just been handed fernway setup as &quot;one more thing&quot; on top of her regular job. not technical, but capable — she just doesn&#x27;t have time to figure things out by trial and error. goals get the team up and running with minimal back-and-forth. avoid looking like she broke something in front of her team. frustrations steps that don&#x27;t clearly say what&#x27;s required vs. optional. no way to preview what happens before committing to an action. based on grounded in research-plans/onboarding-usability-study-q1.md , sessions 1–6."}, {"id": "deliverable:personas/physician-longitudinal-scribe-user", "kind": "deliverable", "title": "The Longitudinal Physician — Ambient Scribe", "date": "2026-02-26", "type": "personas", "status": "final", "tags": ["ambient-scribe", "persona", "longitudinal", "trust-in-ai"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../personas/physician-longitudinal-scribe-user.md", "html": "<h1>The Longitudinal Physician — Ambient Scribe</h1>\n<h2>Summary</h2>\n<p>Modeled on the one participant (P09, Internal Medicine) present across all three ambient-scribe testing rounds — v0.1 (Feb 2025), v0.2 (Sep 2025), and the GA candidate (Jan 2026). Represents the clinician whose relationship with the tool has actually changed over a year of iteration, not a first-time impression.</p>\n<h2>Goals</h2>\n<ul><li>Trust the tool enough to stop reading every generated line, without trusting it blindly.</li><li>Catch the specific error types that matter clinically (medication names) rather than treating all uncertainty as equally worth flagging.</li><li>Not lose work to session/security interruptions that are unrelated to the clinical task.</li></ul>\n<h2>What changed for this persona, round over round</h2>\n<ul><li><strong>v0.1 → v0.2:</strong> Accuracy improved, but reading behavior didn&#x27;t — still read every line, despite fewer errors to catch.</li><li><strong>v0.2 → GA candidate:</strong> The first behavior change came from <em>visible uncertainty</em> (per-line confidence highlighting), not from further accuracy gains — this persona began skimming high-confidence lines for the first time.</li><li><strong>Post-GA (this initiative):</strong> The next trust lever is specificity, not just visibility — a distinct medication-safety flag reads as more actionable than generic low confidence, but risks over-trusting anything left unflagged if that distinction isn&#x27;t actively managed in the UI.</li></ul>\n<h2>Frustrations</h2>\n<ul><li>Generic &quot;low confidence&quot; signals don&#x27;t tell this persona <em>what kind</em> of thing to double-check.</li><li>Session locks during dictation currently look identical to data loss, which erodes trust in the tool independent of transcription accuracy itself.</li></ul>\n<h2>Based on</h2>\n<p>Longitudinal composite of participant P09 across the three sessions above, plus the 2026-02-10 medication-flag concept test and 2026-02-17 session-lock contextual inquiry.</p>", "searchText": "the longitudinal physician — ambient scribe ambient-scribe persona longitudinal trust-in-ai the longitudinal physician — ambient scribe summary modeled on the one participant (p09, internal medicine) present across all three ambient-scribe testing rounds — v0.1 (feb 2025), v0.2 (sep 2025), and the ga candidate (jan 2026). represents the clinician whose relationship with the tool has actually changed over a year of iteration, not a first-time impression. goals trust the tool enough to stop reading every generated line, without trusting it blindly. catch the specific error types that matter clinically (medication names) rather than treating all uncertainty as equally worth flagging. not lose work to session/security interruptions that are unrelated to the clinical task. what changed for this persona, round over round v0.1 → v0.2: accuracy improved, but reading behavior didn&#x27;t — still read every line, despite fewer errors to catch. v0.2 → ga candidate: the first behavior change came from visible uncertainty (per-line confidence highlighting), not from further accuracy gains — this persona began skimming high-confidence lines for the first time. post-ga (this initiative): the next trust lever is specificity, not just visibility — a distinct medication-safety flag reads as more actionable than generic low confidence, but risks over-trusting anything left unflagged if that distinction isn&#x27;t actively managed in the ui. frustrations generic &quot;low confidence&quot; signals don&#x27;t tell this persona what kind of thing to double-check. session locks during dictation currently look identical to data loss, which erodes trust in the tool independent of transcription accuracy itself. based on longitudinal composite of participant p09 across the three sessions above, plus the 2026-02-10 medication-flag concept test and 2026-02-17 session-lock contextual inquiry."}, {"id": "deliverable:mental-models/example-mental-model", "kind": "deliverable", "title": "Workspace Setup — Mental Model", "date": "2026-02-13", "type": "mental-models", "status": "in-review", "tags": ["onboarding", "mental-model"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../mental-models/example-mental-model.md", "html": "<h2>Overview</h2>\n<p>Covers how new admins conceptualize &quot;setting up a workspace&quot; before they&#x27;ve used Fernway, versus how the system actually models the task.</p>\n<h2>Model</h2>\n<p>Admins think of setup as one task with optional extras (&quot;connect stuff if I want to&quot;). The system actually models it as a required linear sequence where several &quot;extras&quot; (like calendar connection) gate later functionality. This mismatch is the root cause behind the step-3 confusion seen across research.</p>", "searchText": "workspace setup — mental model onboarding mental-model overview covers how new admins conceptualize &quot;setting up a workspace&quot; before they&#x27;ve used fernway, versus how the system actually models the task. model admins think of setup as one task with optional extras (&quot;connect stuff if i want to&quot;). the system actually models it as a required linear sequence where several &quot;extras&quot; (like calendar connection) gate later functionality. this mismatch is the root cause behind the step-3 confusion seen across research."}, {"id": "deliverable:mindsets/example-mindset", "kind": "deliverable", "title": "Time-Pressed First-Time Admin", "date": "2026-02-13", "type": "mindsets", "status": "final", "tags": ["onboarding", "mindset"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../mindsets/example-mindset.md", "html": "<h2>Overview</h2>\n<p>Not a persona — a mindset that shows up across multiple admin personas. Defined by low time budget and a &quot;just get it done&quot; orientation, regardless of technical skill level.</p>\n<h2>Implications</h2>\n<p>Design for skimmability over completeness: fewer required decisions, clearer signaling of what&#x27;s mandatory, and no dead-ends that force starting over.</p>", "searchText": "time-pressed first-time admin onboarding mindset overview not a persona — a mindset that shows up across multiple admin personas. defined by low time budget and a &quot;just get it done&quot; orientation, regardless of technical skill level. implications design for skimmability over completeness: fewer required decisions, clearer signaling of what&#x27;s mandatory, and no dead-ends that force starting over."}, {"id": "deliverable:journey-maps/example-journey-map", "kind": "deliverable", "title": "New Admin Onboarding — Journey Map", "date": "2026-02-14", "type": "journey-maps", "status": "final", "tags": ["onboarding", "journey-map"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../journey-maps/example-journey-map.md", "html": "<h2>Overview</h2>\n<p>Follows Dana from receiving the &quot;set up Fernway&quot; task through first successful workspace creation.</p>\n<h2>Stages</h2>\n<ol><li><strong>Signup</strong> — Confident, low effort.</li><li><strong>Step 1–2 (Basics, Calendar)</strong> — Still confident; pauses briefly at calendar connection, unsure if required, proceeds anyway.</li><li><strong>Step 3 (Invite team)</strong> — Anxious — worried invites are sending before she&#x27;s ready. Stalls here longest of any step.</li><li><strong>Step 4–5 (Preferences, Review)</strong> — Relief; the hard part felt over.</li><li><strong>Completion</strong> — Mild surprise the setup is actually done — no strong confirmation moment.</li></ol>", "searchText": "new admin onboarding — journey map onboarding journey-map overview follows dana from receiving the &quot;set up fernway&quot; task through first successful workspace creation. stages signup — confident, low effort. step 1–2 (basics, calendar) — still confident; pauses briefly at calendar connection, unsure if required, proceeds anyway. step 3 (invite team) — anxious — worried invites are sending before she&#x27;s ready. stalls here longest of any step. step 4–5 (preferences, review) — relief; the hard part felt over. completion — mild surprise the setup is actually done — no strong confirmation moment."}, {"id": "deliverable:thumbnails/example-thumbnail", "kind": "deliverable", "title": "Workspace Setup Screen — Thumbnail Explorations", "date": "2026-02-17", "type": "thumbnails", "status": "draft", "tags": ["onboarding", "thumbnails"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../thumbnails/example-thumbnail.md", "html": "<h2>Concept</h2>\n<p>Six quick sketches exploring how to make it clear that invites don&#x27;t send until the whole wizard is submitted.</p>\n<h2>Options considered</h2>\n<ol><li>Explicit &quot;Invites will send when you finish setup&quot; banner — carried forward.</li><li>A draft/preview list with a visible &quot;not sent yet&quot; state — carried forward.</li><li>Moving invites to the very last step — dropped, breaks existing step order research already validated elsewhere.</li></ol>", "searchText": "workspace setup screen — thumbnail explorations onboarding thumbnails concept six quick sketches exploring how to make it clear that invites don&#x27;t send until the whole wizard is submitted. options considered explicit &quot;invites will send when you finish setup&quot; banner — carried forward. a draft/preview list with a visible &quot;not sent yet&quot; state — carried forward. moving invites to the very last step — dropped, breaks existing step order research already validated elsewhere."}, {"id": "deliverable:wireframes/ambient-scribe-medication-flag", "kind": "deliverable", "title": "Ambient Scribe — Sound-Alike Medication Flag", "date": "2026-02-24", "type": "wireframes", "status": "in-review", "tags": ["ambient-scribe", "medication-safety", "wireframe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../wireframes/ambient-scribe-medication-flag.md", "html": "<h1>Ambient Scribe — Sound-Alike Medication Flag</h1>\n<h2>Description</h2>\n<p>Lo-fi layout for the distinct sound-alike-medication flag validated in the 2026-02-10 concept test. Applies to the <code>ambient-scribe-widget</code> component&#x27;s draft-review surface, inside the <code>encounter-view</code> screen. Separate from the existing generic <code>confidence-highlighted</code> variant — this flag reads specifically as &quot;check this drug name,&quot; not &quot;low confidence generally.&quot;</p>\n<h2>Details</h2>\n<ul><li><strong>Placement:</strong> inline, immediately after the medication name — tested 5:1 over a right-hand margin badge, since participants didn&#x27;t want to look away from the text.</li><li><strong>Visual treatment:</strong> small amber pill-shaped badge, distinct in shape and color from the existing subtle low-confidence underline, so the two signals are never visually conflated.</li><li><strong>Copy:</strong> short on-hover/on-tap label — &quot;Possible sound-alike medication name — verify before signing&quot; — worded to prompt verification, not to assert an error.</li><li><strong>Adjacent messaging (new):</strong> a one-time inline tip, shown the first time a clinician encounters the flag, stating that lines <em>without</em> this flag still warrant normal review — directly addressing the over-trust-on-unflagged-lines risk found in 2 of 6 concept-test participants.</li><li><strong>Open item:</strong> false-positive tolerance testing (2026-02-10) suggests the underlying detection threshold can run looser than strict-precision defaults without frustrating clinicians — final threshold tuning is an engineering/detection decision, not a layout decision, and is out of scope for this wireframe.</li></ul>", "searchText": "ambient scribe — sound-alike medication flag ambient-scribe medication-safety wireframe ambient scribe — sound-alike medication flag description lo-fi layout for the distinct sound-alike-medication flag validated in the 2026-02-10 concept test. applies to the ambient-scribe-widget component&#x27;s draft-review surface, inside the encounter-view screen. separate from the existing generic confidence-highlighted variant — this flag reads specifically as &quot;check this drug name,&quot; not &quot;low confidence generally.&quot; details placement: inline, immediately after the medication name — tested 5:1 over a right-hand margin badge, since participants didn&#x27;t want to look away from the text. visual treatment: small amber pill-shaped badge, distinct in shape and color from the existing subtle low-confidence underline, so the two signals are never visually conflated. copy: short on-hover/on-tap label — &quot;possible sound-alike medication name — verify before signing&quot; — worded to prompt verification, not to assert an error. adjacent messaging (new): a one-time inline tip, shown the first time a clinician encounters the flag, stating that lines without this flag still warrant normal review — directly addressing the over-trust-on-unflagged-lines risk found in 2 of 6 concept-test participants. open item: false-positive tolerance testing (2026-02-10) suggests the underlying detection threshold can run looser than strict-precision defaults without frustrating clinicians — final threshold tuning is an engineering/detection decision, not a layout decision, and is out of scope for this wireframe."}, {"id": "deliverable:wireframes/workspace-setup-step3", "kind": "deliverable", "title": "Workspace Setup — Step 3 Wireframe", "date": "2026-02-19", "type": "wireframes", "status": "in-review", "tags": ["onboarding", "wireframe"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../wireframes/workspace-setup-step3.md", "html": "<h2>Overview</h2>\n<p>Lo-fi layout for the reworked step 3, incorporating the &quot;not sent yet&quot; banner and draft invite list from the thumbnail exploration.</p>\n<h2>Notes</h2>\n<p>Banner sits above the invite input, persistent until submit. Draft list shows entered emails with a &quot;Draft — not sent&quot; tag next to each.</p>", "searchText": "workspace setup — step 3 wireframe onboarding wireframe overview lo-fi layout for the reworked step 3, incorporating the &quot;not sent yet&quot; banner and draft invite list from the thumbnail exploration. notes banner sits above the invite input, persistent until submit. draft list shows entered emails with a &quot;draft — not sent&quot; tag next to each."}, {"id": "deliverable:user-flows/ambient-scribe-session-lock-recovery", "kind": "deliverable", "title": "Ambient Scribe — Session Lock Recovery", "date": "2026-02-25", "type": "user-flows", "status": "in-review", "tags": ["ambient-scribe", "sso", "mfa", "user-flow"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": "Jordan Lee", "path": "../user-flows/ambient-scribe-session-lock-recovery.md", "html": "<h1>Ambient Scribe — Session Lock Recovery</h1>\n<h2>Description</h2>\n<p>Response to the 2026-02-17 contextual inquiry finding that a session lock mid-recording currently reads as silent draft loss. Covers the <code>encounter-view</code>/<code>ambient-scribe-widget</code> interaction from the moment the idle timeout fires through resumed dictation, replacing today&#x27;s silent freeze with an explicit state. Per IT Security (interviewed in that session), the 10-minute idle-timeout policy itself is fixed and out of scope — this flow only changes what the UI communicates during that window, not when it triggers.</p>\n<h2>Details</h2>\n<ol><li><strong>Recording (normal state)</strong> — <code>ambient-scribe-widget</code> in <code>recording</code> state, <code>encounter-view</code> in <code>default</code> state, unchanged from today.</li><li><strong>Idle timeout fires → Paused (new state)</strong> — <code>encounter-view</code> moves to <code>locked</code>; <code>ambient-scribe-widget</code> moves to a new <code>paused-preserved</code> state showing &quot;Session paused — your draft is saved. Re-authenticate to resume.&quot; Recording audio stops; draft is not discarded client- or server-side. This replaces today&#x27;s silent freeze, which 4 of 5 observed clinicians misread as data loss.</li><li><strong>Re-authenticate → Resume</strong> — on successful SSO/MFA re-auth, <code>encounter-view</code> returns to 27;s silent freeze, which 4 of 5 observed clinicians misread as data loss. re-authenticate → resume — on successful sso/mfa re-auth, encounter-view returns to default , ambient-scribe-widget returns to recording (if the clinician chooses to continue) or reviewing-draft (if they&#x27;d rather review what&#x27;s captured so far first). the preserved draft is visible immediately on return — no re-dictation needed. explicitly out of scope: changing the idle-timeout duration, or any cross-feature timeout behavior beyond ambient scribe (flagged as a follow-up question in the source session, not resolved here). framing note carried from research: copy in step 2 should read as an expected safety behavior, not an unrelated login interruption — the source session found clinicians already numb to frequent unrelated re-auth prompts, which was part of why the current silent freeze reads as broken rather than as a deliberate pause."}, {"id": "deliverable:user-flows/onboarding-flow", "kind": "deliverable", "title": "Onboarding Flow — v2", "date": "2026-02-20", "type": "user-flows", "status": "in-review", "tags": ["onboarding", "user-flow"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../user-flows/onboarding-flow.md", "html": "<h2>Overview</h2>\n<p>Signup through first workspace created, v2 (post-research revisions).</p>\n<h2>Steps</h2>\n<ol><li>Signup</li><li>Basics (workspace name, team size)</li><li>Calendar connect (now clearly marked required)</li><li>Invite team (now shows draft/not-sent state)</li><li>Preferences</li><li>Review &amp; finish</li></ol>", "searchText": "onboarding flow — v2 onboarding user-flow overview signup through first workspace created, v2 (post-research revisions). steps signup basics (workspace name, team size) calendar connect (now clearly marked required) invite team (now shows draft/not-sent state) preferences arification.</p>", "searchText": "workspace setup — step 3 mockup onboarding mockup overview hi-fi visual design for the reworked step 3, matching the wireframe and brand style guide. notes banner uses the &quot;info&quot; token color from the design system, not &quot;warning&quot; — this isn&#x27;t an error state, just a clarification."}, {"id": "deliverable:prototypes/example-prototype", "kind": "deliverable", "title": "Onboarding Flow v2 — Click-through", "date": "2026-02-27", "type": "prototypes", "status": "final", "tags": ["onboarding", "prototype"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../prototypes/example-prototype.md", "html": "<p>Click-through prototype covering the full reworked onboarding flow, steps 1–6, including the step 3 draft/not-sent state. Used for the Feb 28 stakeholder walkthrough and as the reference for the v2 usability re-test.</p>", "searchText": "onboarding flow v2 — click-through onboarding prototype click-through prototype covering the full reworked onboarding flow, steps 1–6, including the step 3 draft/not-sent state. used for the feb 28 stakeholder walkthrough and as the reference for the v2 usability re-test."}, {"id": "deliverable:design-system/example-design-system", "kind": "deliverable", "title": "Design System — v3.2 Snapshot", "date": "2026-02-28", "type": "design-system", "status": "final", "tags": ["design-system"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../design-system/example-design-system.md", "html": "<h2>Overview</h2>\n<p>Snapshot of the component library as of v3.2, covering the components used in the onboarding v2 redesign (banner, draft-tag, stepper).</p>\n<h2>Components</h2>\n<p>Banner (info/warning/error variants), Draft Tag, Stepper (desktop + mobile variants — mobile variant updated post accessibility screening).</p>", "searchText": "design system — v3.2 snapshot design-system overview snapshot of the component library as of v3.2, covering the components used in the onboarding v2 redesign (banner, draft-tag, stepper). components banner (info/warning/error variants), draft tag, stepper (desktop + mobile variants — mobile variant updated post accessibility screening)."}, {"id": "deliverable:style-guide/foundations-v3", "kind": "deliverable", "title": "Style Guide — Foundations v3", "date": "2026-02-28", "type": "style-guide", "status": "final", "tags": ["style-guide"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": "Sam Okafor", "evaluator": null, "reviewed_by": null, "path": "../style-guide/foundations-v3.md", "html": "<h2>Overview</h2>\n<p>Foundational tokens referenced by the onboarding v2 mockups — colors, type scale, spacing.</p>\n<h2>Foundations</h2>\n<p>Info color updated this version (previously too close to the warning color in contrast testing — see accessibility screening for the related contrast issue on error messages).</p>", "searchText": "style guide — foundations v3 style-guide overview foundational tokens referenced by the onboarding v2 mockups — colors, type scale, spacing. foundations info color updated this version (previously too close to the warning color in contrast testing — see accessibility screening for the related contrast issue on error messages)."}]</script>
<script>
(function () {
  const records = JSON.parse(document.getElementById('research-data').textContent);
  const TYPE_LABELS = {"usability-test": "Usability test", "interview": "Interview", "survey": "Survey", "contextual-inquiry": "Contextual inquiry", "accessibility-audit": "Accessibility audit", "analytics": "Analytics", "analytics-summary": "Analytics summary", "synthesis": "Synthesis", "research-plans": "Research plan", "facilitation-guides": "Facilitation guide", "topline-summaries": "Topline summary", "research-readouts": "Research readout", "heuristic-evaluations": "Heuristic evaluation", "accessibility-screenings": "Accessibility screening", "service-topology": "Service topology", "personas": "Persona", "mental-models": "Mental model", "mindsets": "Mindset", "journey-maps": "Journey map", "thumbnails": "Thumbnail", "wireframes": "Wireframe", "user-flows": "User flow", "wireflows": "Wireflow", "storyboards": "Storyboard", "mockups": "Mockup", "prototypes": "Prototype", "design-system": "Design system", "style-guide": "Style guide"};
  const KIND_LABELS = { raw: 'Sessions', finding: 'Findings', component: 'Components', analytics: 'Analytics', deliverable: 'Deliverables' };
  const KIND_COLORS = { raw: 'var(--kind-raw)', finding: 'var(--kind-finding)', component: 'var(--kind-component)', analytics: 'var(--kind-analytics)', deliverable: 'var(--kind-deliverable)' };
  const SEV_COLORS = { critical: 'var(--sev-critical)', high: 'var(--sev-high)', medium: 'var(--sev-medium)', low: 'var(--sev-low)' };

  const state = {
    query: '',
    kinds: new Set(['raw', 'finding', 'component', 'analytics', 'deliverable']),
    types: new Set(),
    tags: new Set(),
    openId: null,
  };

  const allKinds = ['raw', 'finding', 'component', 'analytics', 'deliverable'];
  const allTypes = [...new Set(records.map(r => r.type).filter(Boolean))].sort();
  const allTags = [...new Set(records.flatMap(r => r.tags))].sort();
  state.types = new Set(allTypes);

  function countFor(predicate) {
    return records.filter(predicate).length;
  }

  function renderKindFilters() {
    const el = document.getElementById('kind-filters');
    el.innerHTML = allKinds.map(k => {
      const count = countFor(r => r.kind === k);
      const checked = state.kinds.has(k) ? 'checked' : '';
      return `<label class="filter-row"><input type="checkbox" data-kind="${k}" ${checked}>${KIND_LABELS[k]}<span class="count">${count}</span></label>`;
    }).join('');
    el.querySelectorAll('input[data-kind]').forEach(input => {
      input.addEventListener('change', () => {
        const k = input.getAttribute('data-kind');
        if (input.checked) state.kinds.add(k); else state.kinds.delete(k);
        render();
      });
    });
  }

  function renderTypeFilters() {
    const el = document.getElementById('type-filters');
    el.innerHTML = allTypes.map(t => {
      const count = countFor(r => r.type === t);
      const checked = state.types.has(t) ? 'checked' : '';
      return `<label class="filter-row"><input type="checkbox" data-type="${t}" ${checked}>${TYPE_LABELS[t] || t}<span class="count">${count}</span></label>`;
    }).join('');
    el.querySelectorAll('input[data-type]').forEach(input => {
      input.addEventListener('change', () => {
        const t = input.getAttribute('data-type');
        if (input.checked) state.types.add(t); else state.types.delete(t);
        render();
      });
    });
  }

  function renderTagFilters() {
    const el = document.getElementById('tag-filters');
    el.innerHTML = allTags.map(tag => {
      const active = state.tags.has(tag) ? 'active' : '';
      return `<button type="button" class="tag-chip ${active}" data-tag="${tag}">${tag}</button>`;
    }).join('');
    el.querySelectorAll('.tag-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.getAttribute('data-tag');
        if (state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
        render();
      });
    });
  }

  function matches(record) {
    if (!state.kinds.has(record.kind)) return false;
    if (record.type && allTypes.includes(record.type) && !state.types.has(record.type)) return false;
    if (state.tags.size > 0 && ![...state.tags].every(t => record.tags.includes(t))) return false;
    if (state.query && !record.searchText.includes(state.query)) return false;
    return true;
  }

  function severityDots(sev) {
    if (!sev) return '';
    const order = ['critical', 'high', 'medium', 'low'];
    const dots = order.filter(k => sev[k] > 0).map(k => `<span title="${sev[k]} ${k}" style="background:${SEV_COLORS[k]}"></span>`);
    return dots.length ? `<div class="sev-dots">${dots.join('')}</div>` : '';
  }

  function renderResults() {
    const filtered = records.filter(matches).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const list = document.getElementById('results-list');
    const emptyState = document.getElementById('empty-state');
    document.getElementById('result-count').textContent = `${filtered.length} of ${records.length}`;

    if (filtered.length === 0) {
      list.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    list.innerHTML = filtered.map(r => {
      const isOpen = state.openId === r.id;
      return `
        <li>
          <div class="result-row" data-id="${r.id}">
            <div class="result-meta">
              <span class="kind-dot" style="background:${KIND_COLORS[r.kind]}"></span>${r.date || ''}
              ${severityDots(r.severity)}
            </div>
            <div>
              <p class="result-title">${r.title}</p>
              <div class="result-tags">
                ${r.type ? `<span class="type-label">${TYPE_LABELS[r.type] || r.type}</span>` : ''}
                ${r.tags.join(', ')}
              </div>
            </div>
            <div class="result-detail ${isOpen ? 'open' : ''}" id="detail-${cssEscape(r.id)}">
              <div class="result-detail-inner">
                ${isOpen ? r.html : ''}
                ${isOpen ? `<a class="source-link" href="${r.path}">Open source file: ${r.path}</a>` : ''}
              </div>
            </div>
          </div>
        </li>`;
    }).join('');

    list.querySelectorAll('.result-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('a')) return; // let source-file links navigate normally
        const id = row.getAttribute('data-id');
        state.openId = state.openId === id ? null : id;
        render();
        if (state.openId) {
          const el = document.getElementById(`detail-${cssEscape(state.openId)}`);
          if (el && typeof el.scrollIntoView === 'function') {
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }
      });
    });
  }

  function cssEscape(s) { return s.replace(/[^a-zA-Z0-9_-]/g, '_'); }

  function render() {
    renderKindFilters();
    renderTypeFilters();
    renderTagFilters();
    renderResults();
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('reset-filters').addEventListener('click', () => {
    state.query = '';
    state.kinds = new Set(allKinds);
    state.types = new Set(allTypes);
    state.tags = new Set();
    state.openId = null;
    document.getElementById('search-input').value = '';
    render();
  });

  render();
})();
</script>
