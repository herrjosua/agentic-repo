<style>

    --kind-raw: #1F52B3;
    --kind-finding: #146B64;
    --kind-component: #9A5E0D;

  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text-primary);
    font-family: var(--serif); font-size: 16px; line-height: 1.55;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  header {
    padding: 28px 32px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 {
    margin: 0 0 4px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em;
  }
  header p.tagline {
    margin: 0; color: var(--text-secondary); font-size: 14px; font-family: var(--mono);
  }

  .search-bar { padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }

    width: 100%; max-width: 640px; padding: 10px 14px; font-size: 15px;
    font-family: var(--serif); border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--text-primary);
  }
  .search-bar input[type="search"]::placeholder { color: var(--text-secondary); }

  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 130px); }

  aside {
    padding: 24px; border-right: 1px solid var(--border); background: var(--surface);

    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--text-secondary); margin: 20px 0 8px;
  }
  aside h2:first-child { margin-top: 0; }
  .filter-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 0;
    font-family: var(--mono); font-size: 13px; cursor: pointer;
  }
  .filter-row input[type="checkbox"] { accent-color: var(--accent); }
  .filter-row .count { color: var(--text-secondary); margin-left: auto; }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-chip {
    font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary);
    cursor: pointer; line-height: 1.4;
  }
  .tag-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  #reset-filters {
    margin-top: 20px; font-family: var(--mono); font-size: 12px; color: var(--accent);
    background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline;
  }

  main { padding: 24px 32px; }
  .result-count { font-family: var(--mono); font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }

  ul.results { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border-subtle); }
  .result-row {
    border-bottom: 1px solid var(--border-subtle); padding: 14px 4px; cursor: pointer;
    display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: start;
  }
  .result-row:hover { background: var(--accent-tint); }
  .result-meta { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); padding-top: 2px; }
  .result-meta .kind-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    vertical-align: middle; position: relative; top: -1px;
  }
  .sev-dots { margin-top: 6px; display: flex; gap: 4px; }
  .sev-dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
  .result-title { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
  .result-tags { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }
  .result-tags .type-label { color: var(--text-primary); font-weight: 600; margin-right: 8px; }

  .result-detail {
    grid-column: 1 / -1; padding: 16px 0 4px 0; max-width: 720px;
    overflow: hidden; max-height: 0; transition: max-height 0.25s ease;
  }
  .result-detail.open { max-height: 4000px; }
  .result-detail-inner { padding-top: 8px; border-top: 1px dashed var(--border); }
  .result-detail h1 { font-size: 20px; }
  .result-detail h2 { font-size: 16px; margin-top: 20px; }
  .result-detail blockquote {
    margin: 12px 0; padding: 4px 16px; border-left: 3px solid var(--border); color: var(--text-secondary);
  }
  .result-detail table { border-collapse: collapse; font-size: 14px; margin: 12px 0; }
  .result-detail th, .result-detail td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .result-detail code { font-family: var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  .source-link { display: inline-block; margin-top: 12px; font-family: var(--mono); font-size: 12px; }

  .empty-state { padding: 40px 4px; color: var(--text-secondary); max-width: 520px; }
  .empty-state h3 { font-family: var(--serif); font-size: 18px; color: var(--text-primary); margin-bottom: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .result-detail { transition: none; }
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); }
    .result-row { grid-template-columns: 1fr; }
    .result-meta { display: flex; gap: 10px; }
  }
</style>

<script id="research-data" type="application/json">[{"id": "raw:2025-01-14-stakeholder-interview-ai-strategy-kickoff", "kind": "raw", "title": "AI Strategy Kickoff — Executive Alignment Interview", "date": "2025-01-14", "type": "interview", "status": "raw", "tags": ["ai-strategy", "governance", "phi", "executive", "kickoff", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-01-14-stakeholder-interview-ai-strategy-kickoff/session-notes.md", "corrections": [], "html": "<h1>AI Strategy Kickoff — Executive Alignment Interview</h1>\n<h2>Objective</h2>\n<p>Understand executive priorities, risk tolerance, and success criteria for the Compass AI modernization program before any tools are scoped.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 stakeholder interview (60 min, recorded w/ consent, transcript scrubbed)</li><li><strong>Researcher:</strong> J. Alvarez</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(risk tolerance)</em> Both stakeholders want AI pilots to start in low-PHI-exposure workflows (scheduling, intake) before touching clinical documentation, citing HIPAA audit exposure as the top concern.</li><li><strong>[MEDIUM]</strong> <em>(success criteria)</em> VP Clinical Informatics defines success as &#x27;reduced documentation time,&#x27; while CIO defines success as &#x27;reduced vendor sprawl&#x27; — the two are not currently reconciled in a shared metric.</li><li><strong>[MEDIUM]</strong> <em>(governance)</em> Neither stakeholder could name who owns model-output accuracy sign-off; assumed it would &#x27;probably fall to compliance.&#x27;</li><li><strong>[LOW]</strong> <em>(change management)</em> Both anticipate clinician skepticism based on a prior failed CDS (clinical decision support) alert rollout in 2022.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;We can&#x27;t be the org that leaks PHI through some vendor&#x27;s training pipeline. That&#x27;s the headline we&#x27;re trying to avoid, not chase.&quot;</p><p>— Chief Information Officer, P01</p></blockquote>\n<blockquote><p>&quot;If a doctor spends less time typing and more time looking at the patient, I don&#x27;t care what&#x27;s under the hood.&quot;</p><p>— VP Clinical Informatics, P02</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Facilitate a follow-up session to align on 2-3 shared, measurable success metrics before scoping any pilot.</li><li>Document a RACI for AI-output review/sign-off; surface the gap to Compliance directly.</li><li>Reference the 2022 CDS alert rollout retro in early clinician-facing research to avoid repeating known failure modes.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Who in Compliance should own model-output sign-off? Schedule follow-up interview.</li><li>Request access to 2022 CDS alert rollout post-mortem if it exists.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — AI Strategy Kickoff — Executive Alignment Interview</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Chief Information Officer</li><li>VP Clinical Informatics</li></ul>\n<p><strong>Researcher:</strong> J. Alvarez</p>\n<ul><li><strong>Logistics:</strong> Conducted in exec conference room; both stakeholders present simultaneously (joint interview, not ideal but scheduling-constrained).</li></ul>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "ai strategy kickoff — executive alignment interview ai-strategy governance phi executive kickoff project-cross-cutting ai strategy kickoff — executive alignment interview objective understand executive priorities, risk tolerance, and success criteria for the compass ai modernization program before any tools are scoped. method method: 1:1 stakeholder interview (60 min, recorded w/ consent, transcript scrubbed) researcher: j. alvarez full participant roster: see participants.md in this folder key findings [high] (risk tolerance) both stakeholders want ai pilots to start in low-phi-exposure workflows (scheduling, intake) before touching clinical documentation, citing hipaa audit exposure as the top concern. [medium] (success criteria) vp clinical informatics defines success as &#x27;reduced documentation time,&#x27; while cio defines success as &#x27;reduced vendor sprawl&#x27; — the two are not currently reconciled in a shared metric. [medium] (governance) neither stakeholder could name who owns model-output accuracy sign-off; assumed it would &#x27;probably fall to compliance.&#x27; [low] (change management) both anticipate clinician skepticism based on a prior failed cds (clinical decision support) alert rollout in 2022. representative quotes &quot;we can&#x27;t be the org that leaks phi through some vendor&#x27;s training pipeline. that&#x27;s the headline we&#x27;re trying to avoid, not chase.&quot; — chief information officer, p01 &quot;if a doctor spends less time typing and more time looking at the patient, i don&#x27;t care what&#x27;s under the hood.&quot; — vp clinical informatics, p02 recommendations facilitate a follow-up session to align on 2-3 shared, measurable success metrics before scoping any pilot. document a raci for ai-output review/sign-off; surface the gap to compliance directly. reference the 2022 cds alert rollout retro in early clinician-facing research to avoid repeating known failure modes. follow-ups / open questions who in compliance should own model-output sign-off? schedule follow-up interview. request access to 2022 cds alert rollout post-mortem if it exists. related synthesized into: governance-and-phi.md participants participants — ai strategy kickoff — executive alignment interview count: 2 roles: chief information officer vp clinical informatics researcher: j. alvarez logistics: conducted in exec conference room; both stakeholders present simultaneously (joint interview, not ideal but scheduling-constrained). recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-01-29-contextual-inquiry-chart-review-baseline", "kind": "raw", "title": "Contextual Inquiry — Manual Chart Review Baseline (Care Coordinators)", "date": "2025-01-29", "type": "contextual-inquiry", "status": "raw", "tags": ["baseline", "chart-review", "workflow", "care-coordination", "project-care-coordination"], "related_components": ["chart-review-summary-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-01-29-contextual-inquiry-chart-review-baseline/session-notes.md", "corrections": [], "html": "<h1>Contextual Inquiry — Manual Chart Review Baseline (Care Coordinators)</h1>\n<h2>Objective</h2>\n<p>Establish a baseline of how care coordinators currently review patient charts across encounters, to identify where an AI summarization tool could plausibly help without disrupting judgment calls.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> In-person shadowing, 3 sessions x ~90 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(cognitive load)</em> Coordinators manually cross-reference 3-4 systems (EHR, care management platform, a shared spreadsheet, and a legacy scheduling tool) to build a mental model of a patient&#x27;s status before every outreach call.</li><li><strong>[MEDIUM]</strong> <em>(trust)</em> Coordinators already distrust auto-generated summaries from the EHR&#x27;s built-in &#x27;AVS&#x27; (after-visit summary) tool because they&#x27;ve caught it omitting recently changed medications twice in the past quarter.</li><li><strong>[MEDIUM]</strong> <em>(workaround)</em> One coordinator keeps a personal color-coding system in the shared spreadsheet that isn&#x27;t documented anywhere else; if she&#x27;s out, others reportedly &#x27;just wing it.&#x27;</li><li><strong>[MEDIUM]</strong> <em>(time)</em> Chart review before an outreach call takes 8-14 minutes per patient depending on complexity; coordinators see 12-18 patients/day.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I don&#x27;t trust the summary the system spits out. I&#x27;ve been burned by it missing a med change, so now I just re-check everything myself, which kind of defeats the point.&quot;</p><p>— Care Coordinator, P03</p></blockquote>\n<blockquote><p>&quot;If it could just tell me what changed since I last touched this chart, that alone would save me time. I don&#x27;t need it to think for me.&quot;</p><p>— Care Coordinator (float pool), P05</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Scope an early AI concept around &#x27;what changed since last review&#x27; rather than full summarization — matches an expressed need and avoids the trust gap seen with the existing AVS tool.</li><li>Investigate formalizing the informal color-coding workaround as a real feature so knowledge isn&#x27;t siloed in one person.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Quantify how often the AVS tool has missed medication changes — pull incident/complaint logs if they exist.</li><li>Revisit with float-pool coordinators specifically; they may have different pain points due to less system familiarity.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/care-coordination-triage.md\">care-coordination-triage.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Manual Chart Review Baseline (Care Coordinators)</h1>\n<p><strong>Count:</strong> 3</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Care Coordinator</li><li>Care Coordinator</li><li>Care Coordinator (float pool)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "contextual inquiry — manual chart review baseline (care coordinators) baseline chart-review workflow care-coordination project-care-coordination chart-review-summary-panel contextual inquiry — manual chart review baseline (care coordinators) objective establish a baseline of how care coordinators currently review patient charts across encounters, to identify where an ai summarization tool could plausibly help without disrupting judgment calls. method method: in-person shadowing, 3 sessions x ~90 min researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (cognitive load) coordinators manually cross-reference 3-4 systems (ehr, care management platform, a shared spreadsheet, and a legacy scheduling tool) to build a mental model of a patient&#x27;s status before every outreach call. [medium] (trust) coordinators already distrust auto-generated summaries from the ehr&#x27;s built-in &#x27;avs&#x27; (after-visit summary) tool because they&#x27;ve caught it omitting recently changed medications twice in the past quarter. [medium] (workaround) one coordinator keeps a personal color-coding system in the shared spreadsheet that isn&#x27;t documented anywhere else; if she&#x27;s out, others reportedly &#x27;just wing it.&#x27; [medium] (time) chart review before an outreach call takes 8-14 minutes per patient depending on complexity; coordinators see 12-18 patients/day. representative quotes &quot;i don&#x27;t trust the summary the system spits out. i&#x27;ve been burned by it missing a med change, so now i just re-check everything myself, which kind of defeats the point.&quot; — care coordinator, p03 &quot;if it could just tell me what changed since i last touched this chart, that alone would save me time. i don&#x27;t need it to think for me.&quot; — care coordinator (float pool), p05 recommendations scope an early ai concept around &#x27;what changed since last review&#x27; rather than full summarization — matches an expressed need and avoids the trust gap seen with the existing avs tool. investigate formalizing the informal color-coding workaround as a real feature so knowledge isn&#x27;t siloed in one person. follow-ups / open questions quantify how often the avs tool has missed medication changes — pull incident/complaint logs if they exist. revisit with float-pool coordinators specifically; they may have different pain points due to less system familiarity. related synthesized into: care-coordination-triage.md participants participants — contextual inquiry — manual chart review baseline (care coordinators) count: 3 roles: care coordinator care coordinator care coordinator (float pool) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-02-11-survey-nursing-attitudes-ai-documentation", "kind": "raw", "title": "Survey — Nursing Staff Attitudes Toward AI-Assisted Documentation", "date": "2025-02-11", "type": "survey", "status": "raw", "tags": ["survey", "nursing", "trust-in-ai", "documentation-burden", "project-cross-cutting"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-02-11-survey-nursing-attitudes-ai-documentation/session-notes.md", "corrections": [], "html": "<h1>Survey — Nursing Staff Attitudes Toward AI-Assisted Documentation</h1>\n<h2>Objective</h2>\n<p>Gauge baseline sentiment and specific concerns among nursing staff ahead of any AI documentation pilot, and identify which units are most receptive to early testing.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Online survey, distributed via internal staff portal, 12 questions (Likert + 2 open-ended)</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(sentiment)</em> 61% of respondents were &#x27;neutral to skeptical&#x27; about AI-generated documentation being accurate enough to sign off on without heavy editing; 24% were optimistic; 15% strongly opposed.</li><li><strong>[MEDIUM]</strong> <em>(concern)</em> The top volunteered concern (open-ended, coded from 89 responses) was &#x27;losing my clinical narrative voice / it will sound robotic,&#x27; not accuracy or privacy as originally hypothesized.</li><li><strong>[LOW]</strong> <em>(unit variance)</em> ICU and ED nurses were notably more skeptical than Med-Surg and outpatient clinic nurses, likely correlated with documentation complexity/acuity.</li><li><strong>[LOW]</strong> <em>(openness to pilot)</em> 38% of respondents volunteered interest in being part of an early pilot group when asked directly.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;My notes are how I hand off a patient safely. If a robot writes them and I&#x27;m just rubber-stamping, that scares me more than typing.&quot;</p><p>— Registered Nurse, ICU, P07 (survey open-ended)</p></blockquote>\n<blockquote><p>&quot;Honestly if it got me out of the room 10 minutes faster to chart, I&#x27;d try almost anything.&quot;</p><p>— Registered Nurse, Outpatient Clinic, P41 (survey open-ended)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Recruit the initial usability testing panel from the 38% who volunteered, weighted toward Med-Surg/outpatient where skepticism is lower, to build early momentum before tackling ICU/ED.</li><li>Reframe internal AI messaging around &#x27;voice preservation&#x27; and editability, not just time savings — this addresses the top volunteered concern directly.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Cross-tab results by tenure — does skepticism correlate with years of experience?</li><li>Consider a focused follow-up survey for ICU/ED specifically given their outsized skepticism.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Survey — Nursing Staff Attitudes Toward AI-Assisted Documentation</h1>\n<p><strong>Count:</strong> 142</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Registered Nurse (various units)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "survey — nursing staff attitudes toward ai-assisted nteered concern directly. follow-ups / open questions cross-tab results by tenure — does skepticism correlate with years of experience? consider a focused follow-up survey for icu/ed specifically given their outsized skepticism. related synthesized into: clinician-experience-documentation-burden.md participants participants — survey — nursing staff attitudes toward ai-assisted documentation count: 142 roles: registered nurse (various units) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-02-25-usability-test-ambient-scribe-v01", "kind": "raw", "title": "Usability Test — Ambient AI Scribe Prototype v0.1", "date": "2025-02-25", "type": "usability-test", "status": "raw", "tags": ["ambient-scribe", "usability", "documentation", "v0.1", "project-ambient-scribe"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-02-25-usability-test-ambient-scribe-v01/session-notes.md", "corrections": [], "html": "<h1>Usability Test — Ambient AI Scribe Prototype v0.1</h1>\n<h2>Objective</h2>\n<p>First formative usability test of the ambient AI scribe concept, focused on accuracy, trust, and any early PHI-handling red flags before further investment.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, simulated patient encounters, 45 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[CRITICAL]</strong> <em>(phi-handling)</em> In 2 of 5 sessions, the prototype&#x27;s draft transcript persisted in an editable state after the simulated encounter ended with no clear indication of where/how long it was stored — a potential PHI retention/audit gap that needs Security review before any real-patient pilot.</li><li><strong>[HIGH]</strong> <em>(accuracy)</em> The scribe correctly captured the chief complaint and HPI in all 5 sessions but missed or garbled medication dosages in 3 of 5 — physicians said this was disqualifying for direct sign-off without review.</li><li><strong>[HIGH]</strong> <em>(trust calibration)</em> 4 of 5 participants read every line of AI-generated text before accepting it in this first exposure; none trusted it enough to skim, which undercuts the time-savings premise if that behavior persists post-adoption.</li><li><strong>[MEDIUM]</strong> <em>(interaction)</em> Participants were unsure how to correct a single wrong sentence without regenerating the whole note; the edit affordance wasn&#x27;t discoverable.</li><li><strong>[MEDIUM]</strong> <em>(workflow fit)</em> The &#x27;start listening&#x27; control required a manual click, which physicians said they would likely forget mid-conversation with a patient.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I love what it got right, but I have to read every word anyway right now, so where&#x27;s the time savings? Ask me again in a month.&quot;</p><p>— Physician, Internal Medicine, P09</p></blockquote>\n<blockquote><p>&quot;Wait — where did that draft just go when I closed the window? That&#x27;s the kind of question Legal is going to ask me.&quot;</p><p>— Physician, Family Medicine, P11</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Escalate the draft-transcript retention behavior to Security/Compliance before any additional testing involving even simulated PHI-like content.</li><li>Redesign the correction interaction so a single line can be edited/regenerated in place.</li><li>Investigate ambient &#x27;always listening within visit&#x27; activation (with clear consent/indicator) instead of manual start to fix the workflow-fit issue.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Re-test v0.2 with the same participants where possible for longitudinal comparison.</li><li>Confirm with Compliance whether draft-state ambient transcripts need to be retained/audited even if never finalized.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Ambient AI Scribe Prototype v0.1</h1>\n<p><strong>Count:</strong> 5</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician (Family Medicine)</li><li>Physician (Internal Medicine)</li><li>Nurse Practitioner</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ambient ai scribe prototype v0.1 ambient-scribe usability documentation v0.1 project-ambient-scribe ambient-scribe-widget encounter-view usability test — ambient ai scribe prototype v0.1 objective first formative usability test of the ambient ai scribe concept, focused on accuracy, trust, and any early phi-handling red flags before further investment. method method: moderated usability test, simulated patient encounters, 45 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [critical] (phi-handling) in 2 of 5 sessions, the prototype&#x27;s draft transcript persisted in an editable state after the simulated encounter ended with no clear indication of where/how long it was stored — a potential phi retention/audit gap that needs security review before any real-patient pilot. [high] (accuracy) the scribe correctly captured the chief complaint and hpi in all 5 sessions but missed or garbled medication dosages in 3 of 5 — physicians said this was disqualifying for direct sign-off without review. [high] (trust calibration) 4 of 5 participants read every line of ai-generated text before accepting it in this first exposure; none trusted it enough to skim, which undercuts the time-savings premise if that behavior persists post-adoption. [medium] (interaction) participants were unsure how to correct a single wrong sentence without regenerating the whole note; the edit affordance wasn&#x27;t discoverable. [medium] (workflow fit) the &#x27;start listening&#x27; control required a manual click, which physicians said they would likely forget mid-conversation with a patient. representative quotes &quot;i love what it got right, but i have to read every word anyway right now, so where&#x27;s the time savings? ask me again in a month.&quot; — physician, internal medicine, p09 &quot;wait — where did that draft just go when i closed the window? that&#x27;s the kind of question legal is going to ask me.&quot; — physician, family medicine, p11 recommendations escalate the draft-transcript retention behavior to security/compliance before any additional testing involving even simulated phi-like content. redesign the correction interaction so a single line can be edited/regenerated in place. investigate ambient &#x27;always listening within visit&#x27; activation (with clear consent/indicator) instead of manual start to fix the workflow-fit issue. follow-ups / open questions re-test v0.2 with the same participants where possible for longitudinal comparison. confirm with compliance whether draft-state ambient transcripts need to be retained/audited even if never finalized. related synthesized into: ambient-scribe.md participants participants — usability test — ambient ai scribe prototype v0.1 count: 5 roles: physician (family medicine) physician (internal medicine) nurse practitioner researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-03-10-accessibility-audit-legacy-extjs-admin-console", "kind": "raw", "title": "Accessibility Audit — Legacy Admin Console (ExtJS)", "date": "2025-03-10", "type": "accessibility-audit", "status": "raw", "tags": ["accessibility", "wcag", "extjs", "legacy", "section-508", "project-cross-cutting"], "related_components": ["admin-console-grid"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-03-10-accessibility-audit-legacy-extjs-admin-console/session-notes.md", "corrections": [], "html": "<h1>Accessibility Audit — Legacy Admin Console (ExtJS)</h1>\n<h2>Objective</h2>\n<p>Assess the accessibility of the legacy ExtJS-based admin console that Compass AI&#x27;s governance dashboards would be built into or alongside, ahead of any decision to extend vs. replace it.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Manual WCAG 2.1 AA audit + screen reader walkthrough (NVDA, JAWS)</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[CRITICAL]</strong> <em>(screen reader)</em> Core data grids render without proper ARIA roles; NVDA announces rows as generic &#x27;clickable text&#x27; with no column/row context, making the primary admin workflow effectively unusable non-visually.</li><li><strong>[CRITICAL]</strong> <em>(keyboard trap)</em> Modal dialogs for user permission edits trap focus with no visible or announced way to close via keyboard (Esc does not work in 2 of 4 modal types tested).</li><li><strong>[HIGH]</strong> <em>(color contrast)</em> Status indicator icons rely on color alone (red/yellow/green dots) with no text or pattern alternative, failing WCAG 1.4.1.</li><li><strong>[HIGH]</strong> <em>(focus order)</em> Tab order in the record-edit form does not match visual layout, jumping unpredictably between fieldsets.</li><li><strong>[MEDIUM]</strong> <em>(zoom/reflow)</em> Layout breaks below 1280px effective width even with the OS at 100% zoom, forcing horizontal scrolling that isn&#x27;t announced.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I&#x27;ve basically memorized which grid row is which by row count instead of by what it actually says, because the screen reader just says nothing useful.&quot;</p><p>— IT Admin, screen reader user, P13</p></blockquote>\n<blockquote><p>&quot;This isn&#x27;t a modernization nice-to-have, this is a 508 complaint waiting to happen the day someone new tries to use it.&quot;</p><p>— Accessibility Specialist (internal), Internal SME</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Treat the two critical findings (grid ARIA, keyboard trap) as blockers for building any new Compass AI governance UI on top of this console without remediation or replacement.</li><li>If replacement is on the table, use this audit as the accessibility baseline/requirements input for the new admin experience rather than re-auditing from scratch later.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Determine whether legal/Section 508 has a documented remediation deadline already in place for this console independent of Compass AI.</li><li>Scope effort estimate: incremental ARIA remediation vs. full rebuild.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/accessibility-cross-cutting.md\">accessibility-cross-cutting.md</a></li></ul><h2>Participants</h2><h1>Participants — Accessibility Audit — Legacy Admin Console (ExtJS)</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Accessibility Specialist (internal)</li><li>IT Admin (screen reader user, low vision)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "accessibility audit — legacy admin console (extjs) accessibility wcag extjs legacy section-508 project-cross-cutting admin-console-grid accessibility audit — legacy admin console (extjs) objective assess the accessibility of the legacy extjs-based admin console that compass ai&#x27;s governance dashboards would be built into or alongside, ahead of any decision to extend vs. replace it. method method: manual wcag 2.1 aa audit + screen reader walkthrough (nvda, jaws) researcher: priya patel full participant roster: see participants.md in this folder key findings [critical] (screen reader) core data grids render without proper aria roles; nvda announces rows as generic &#x27;clickable text&#x27; with no column/row context, making the primary admin workflow effectively unusable non-visually. [critical] (keyboard trap) modal dialogs for user permission edits trap focus with no visible or announced way to close via keyboard (esc does not work in 2 of 4 modal types tested). [high] (color contrast) status indicator icons rely on color alone (red/yellow/green dots) with no text or pattern alternative, failing wcag 1.4.1. [high] (focus order) tab order in the record-edit form does not match visual layout, jumping unpredictably between fieldsets. [medium] (zoom/reflow) layout breaks below 1280px effective width even with the os at 100% zoom, forcing horizontal scrolling that isn&#x27;t announced. representative quotes &quot;i&#x27;ve basically memorized which grid row is which by row count instead of by what it actually says, because the screen reader just says nothing useful.&quot; — it admin, screen reader user, p13 &quot;this isn&#x27;t a modernization nice-to-have, this is a 508 complaint waiting to happen the day someone new tries to use it.&quot; — accessibility specialist (internal), internal sme recommendations treat the two critical findings (grid aria, keyboard trap) as blockers for building any new compass ai governance ui on top of this console without remediation or replacement. if replacement is on the table, use this audit as the accessibility baseline/requirements input for the new admin experience rather than re-auditing from scratch later. follow-ups / open questions determine whether legal/section 508 has a documented remediation deadline already in place for this console independent of compass ai. scope effort estimate: incremental aria remediation vs. full rebuild. related synthesized into: accessibility-cross-cutting.md participants participants — accessibility audit — legacy admin console (extjs) count: 2 roles: accessibility specialist (internal) it admin (screen reader user, low vision) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-03-24-interview-privacy-officer-deidentification-requirements", "kind": "raw", "title": "Interview — Privacy/Compliance Officer on De-Identification & Audit Trail Requirements", "date": "2025-03-24", "type": "interview", "status": "raw", "tags": ["privacy", "hipaa", "de-identification", "audit-trail", "governance", "project-cross-cutting"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-03-24-interview-privacy-officer-deidentification-requirements/session-notes.md", "corrections": [], "html": "<h1>Interview — Privacy/Compliance Officer on De-Identification &amp; Audit Trail Requirements</h1>\n<h2>Objective</h2>\n<p>Understand concrete de-identification, retention, and auditability requirements that any AI tool touching PHI must meet, to translate into design/engineering constraints.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 50 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(de-identification standard)</em> Org requires Safe Harbor-level de-identification (all 18 HIPAA identifiers removed) for any data used in model fine-tuning or evaluation sets — Expert Determination method is not currently approved as an alternative internally.</li><li><strong>[HIGH]</strong> <em>(audit trail)</em> Any AI-generated content that becomes part of the legal medical record must be traceable to a specific model version and prompt/input at time of generation, retained for the same period as the record itself (currently 10 years per state requirement she cited).</li><li><strong>[MEDIUM]</strong> <em>(vendor risk)</em> Any third-party AI vendor must sign a Business Associate Agreement (BAA) and demonstrate the data is not used for their own model training by default — she flagged this as the most common gap in vendor pitches she&#x27;s reviewed so far.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;If I can&#x27;t tell you exactly which model version generated a line in the chart three years from now, we don&#x27;t have a product, we have a liability.&quot;</p><p>— Chief Privacy Officer, P15</p></blockquote>\n<blockquote><p>&quot;Everyone says &#x27;we don&#x27;t train on your data&#x27; until you ask them to point to the contract clause. Half the time it&#x27;s not actually in there.&quot;</p><p>— Chief Privacy Officer, P15</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Add model-version + input provenance logging as a non-negotiable requirement in any AI feature&#x27;s technical design, not a post-hoc addition.</li><li>Build a standard vendor-evaluation checklist item specifically requiring the BAA + no-training-on-our-data clause to be pointed to in the actual contract text, not just claimed in a sales deck.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Get the exact state medical record retention period in writing (she cited 10 years from memory) to confirm before it&#x27;s used as a hard requirement.</li><li>Ask Legal whether Expert Determination de-identification could ever become an approved alternative, or if that door is closed.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Privacy/Compliance Officer on De-Identification &amp; Audit Trail Requirements</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Chief Privacy Officer</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "interview — privacy/compliance officer on de-identification & audit trail requirements privacy hipaa de-identification audit-trail governance project-cross-cutting interview — privacy/compliance officer on de-identification &amp; audit trail requirements objective understand concrete de-identification, retention, and auditability requirements that any ai tool touching phi must meet, to translate into design/engineering constraints. method method: 1:1 interview, 50 min researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (de-identification standard) org requires safe harbor-level de-identification (all 18 hipaa identifiers removed) for any data used in model fine-tuning or evaluation sets — expert determination method is not currently approved as an alternative internally. [high] (audit trail) any ai-generated content that becomes part of the legal medical record must be traceable to a specific model version and prompt/input at time of generation, retained for the same period as the record itself (currently 10 years per state requirement she cited). [medium] (vendor risk) any third-party ai vendor must sign a business associate agreement (baa) and demonstrate the data is not used for their own model training by default — she flagged this as the most common gap in vendor pitches she&#x27;s reviewed so far. representative quotes &quot;if i can&#x27;t tell you exactly which model version generated a line in the chart three years from now, we don&#x27;t have a product, we have a liability.&quot; — chief privacy officer, p15 &quot;everyone says &#x27;we don&#x27;t train on your data&#x27; until you ask them to point to the contract clause. half the time it&#x27;s not actually in there.&quot; — chief privacy officer, p15 recommendations add model-version + input provenance logging as a non-negotiable requirement in any ai feature&#x27;s technical design, not a post-hoc addition. build a standard vendor-evaluation checklist item specifically requiring the baa + no-training-on-our-data clause to be pointed to in the actual contract text, not just claimed in a sales deck. follow-ups / open questions get the exact state medical record retention period in writing (she cited 10 years from memory) to confirm before it&#x27;s used as a hard requirement. ask legal whether expert determination de-identification could ever become an approved alternative, or if that door is closed. related synthesized into: governance-and-phi.md participants participants — interview — privacy/compliance officer on de-identification &amp; audit trail requirements count: 1 roles: chief privacy officer researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-04-08-usability-test-prior-auth-ai-v1", "kind": "raw", "title": "Usability Test — AI-Assisted Prior Authorization Drafting (v1)", "date": "2025-04-08", "type": "usability-test", "status": "raw", "tags": ["prior-auth", "usability", "utilization-management", "v1", "project-prior-auth"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-04-08-usability-test-prior-auth-ai-v1/session-notes.md", "corrections": [{"path": "raw/2025-04-08-usability-test-prior-auth-ai-v1/correction-2026-10-13.md", "date": "2026-10-13", "title": "Correction — Usability Test — AI-Assisted Prior Authorization Drafting (v1)"}], "html": "<h1>Usability Test — AI-Assisted Prior Authorization Drafting (v1)</h1>\n<h2>Objective</h2>\n<p>Test whether an AI-drafted prior authorization request (pulling from chart data to pre-fill medical necessity justification) speeds up the process without introducing errors that could cause denials.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, 4 realistic case scenarios, 60 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(accuracy)</em> In 2 of 4 cases, the AI draft cited outdated diagnosis codes still present elsewhere in the chart rather than the most recent/active ones, which participants said would likely cause a payer denial if submitted as-is.</li><li><strong>[HIGH]</strong> <em>(liability concern)</em> The supervisor was firm that nurses would still need to read every AI-drafted justification in full before submission, since a wrongly submitted prior auth can delay patient care by days — no shortcut is acceptable here.</li><li><strong>[HIGH]</strong> <em>(time savings (positive))</em> Despite the above, participants estimated the draft cut initial drafting time from ~15 minutes to ~5 minutes per straightforward case when the citation was correct, which was seen as a real win if accuracy improves.</li><li><strong>[MEDIUM]</strong> <em>(transparency)</em> Participants wanted to see which specific chart entries the AI pulled from, inline, rather than trusting a black-box summary — &#x27;show your work&#x27; was mentioned unprompted by 3 of 4.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Five minutes saved is great until it&#x27;s the case that gets denied and now I&#x27;m on the phone with the payer for 40 minutes instead. Show me where it got that info.&quot;</p><p>— Utilization Review Nurse, P17</p></blockquote>\n<blockquote><p>&quot;I actually really liked this for the boring, obvious cases. Just don&#x27;t let it near the complicated ones yet.&quot;</p><p>— Utilization Review Nurse, P19</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Fix the outdated-diagnosis-code issue before any further piloting; this is a correctness bug, not a UX issue.</li><li>Add inline source citations (chart entry + date) for every claim in the generated justification.</li><li>Consider limiting initial pilot scope to &#x27;straightforward&#x27; case types the nurses themselves can help define, deferring complex cases.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Work with engineering to confirm whether the outdated-code issue is a data-freshness bug or a model retrieval issue.</li><li>Ask supervisor to help define what counts as a &#x27;straightforward&#x27; case for a narrower v2 pilot scope.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/prior-authorization.md\">prior-authorization.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — AI-Assisted Prior Authorization Drafting (v1)</h1>\n<p><strong>Count:</strong> 4</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Utilization Review Nurse</li><li>Utilization Review Nurse</li><li>Utilization Review Nurse (supervisor)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p><h2>Correction (2026-10-13)</h2><p>Filed 2026-10-13 as <code>correction-2026-10-13.md</code> in this session's folder. The original notes above are unchanged.</p><p>Corrects <code>session-notes.md</code> in this folder. That file is left unedited (<code>raw/</code> is append-only).</p>\n<h3>Correction (2026-10-13): P17&#x27;s role</h3>\n<p><code>session-notes.md</code> (lines 34-35) says:</p>\n<blockquote><p>&quot;Five minutes saved is great until it&#x27;s the case that gets denied and now I&#x27;m on the phone with</p><p>the payer for 40 minutes instead. Show me where it got that info.&quot;</p><p>— Utilization Review Nurse, P17</p></blockquote>\n<p><strong>Correct label:</strong> Utilization Review Nurse (supervisor), P17 — the one supervisor listed in <code>participants.md</code> in this folder. The v2 follow-up quotes the same participant as &quot;Utilization Review Nurse (supervisor), P17 (returning from v1)&quot; (<code> nes yet.&quot; — utilization review nurse, p19 recommendations fix the outdated-diagnosis-code issue before any further piloting; this is a correctness bug, not a ux issue. add inline source citations (chart entry + date) for every claim in the generated justification. consider limiting initial pilot scope to &#x27;straightforward&#x27; case types the nurses themselves can help define, deferring complex cases. follow-ups / open questions work with engineering to confirm whether the outdated-code issue is a data-freshness bug or a model retrieval issue. ask supervisor to help define what counts as a &#x27;straightforward&#x27; case for a narrower v2 pilot scope. related synthesized into: prior-authorization.md participants participants — usability test — ai-assisted prior authorization drafting (v1) count: 4 roles: utilization review nurse utilization review nurse utilization review nurse (supervisor) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels. correction (2026-10-13) filed 2026-10-13 as correction-2026-10-13.md in this session's folder. the original notes above are unchanged. corrects session-notes.md in this folder. that file is left unedited ( raw/ is append-only). correction (2026-10-13): p17&#x27;s role session-notes.md (lines 34-35) says: &quot;five minutes saved is great until it&#x27;s the case that gets denied and now i&#x27;m on the phone with the payer for 40 minutes instead. show me where it got that info.&quot; — utilization review nurse, p17 correct label: utilization review nurse (supervisor), p17 — the one supervisor listed in participants.md in this folder. the v2 follow-up quotes the same participant as &quot;utilization review nurse (supervisor), p17 (returning from v1)&quot; ( raw/2025-11-04-usability-test-prior-auth-ai-v2/session-notes.md:36 )."}, {"id": "raw:2025-04-22-contextual-inquiry-ed-intake-shadowing", "kind": "raw", "title": "Contextual Inquiry — Emergency Department Intake Shadowing", "date": "2025-04-22", "type": "contextual-inquiry", "status": "raw", "tags": ["ed", "intake", "workflow", "high-acuity", "baseline", "project-cross-cutting"], "related_components": ["ed-intake-form"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-04-22-contextual-inquiry-ed-intake-shadowing/session-notes.md", "corrections": [], "html": "<h1>Contextual Inquiry — Emergency Department Intake Shadowing</h1>\n<h2>Objective</h2>\n<p>Observe real-time intake workflow under peak load to assess where, if anywhere, an AI tool could realistically fit without adding cognitive burden during high-acuity moments.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> In-person shadowing during peak hours (4-7pm), 2 sessions</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(interruption tolerance)</em> Intake staff are interrupted every 2-4 minutes on average during peak hours (paged, walked up to, or called over); any AI tool requiring sustained attention to review/correct output is unlikely to be used in this specific role during peak windows.</li><li><strong>[MEDIUM]</strong> <em>(triage priority)</em> Registration/demographic data entry is frequently completed after the clinical triage, not before, contradicting the originally assumed &#x27;intake happens first&#x27; workflow model.</li><li><strong>[MEDIUM]</strong> <em>(paper backup)</em> Staff keep a physical paper triage sheet as backup &#x27;in case the system is slow,&#x27; which happens often enough (self-reported several times a shift) that any AI feature needs to survive or gracefully degrade during system slowness.</li><li><strong>[LOW]</strong> <em>(positive signal)</em> Registration clerk expressed interest in AI that could pre-fill demographic fields from insurance card photo capture, since that specific task is high-volume and low-judgment.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;You can build the smartest tool in the world, but if I have three people yelling for me at once, I am not sitting there reviewing an AI&#x27;s homework.&quot;</p><p>— ED Intake Nurse, P21</p></blockquote>\n<blockquote><p>&quot;Just let me snap a photo of the insurance card and stop making me type the same sixteen fields for the hundredth time tonight.&quot;</p><p>— ED Registration Clerk, P23</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Deprioritize any AI feature aimed at ED intake nurses specifically during peak hours; if pursued, target low-attention, high-volume tasks like the clerk&#x27;s insurance-card idea instead.</li><li>Any AI feature in this environment must have a clearly tested degraded/offline mode given frequent system slowness.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Talk to IT about actual system slowness frequency/root cause — is it a known, trackable issue?</li><li>Explore insurance-card OCR pre-fill as a smaller, separate low-risk pilot candidate.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Emergency Department Intake Shadowing</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>ED Intake Nurse</li><li>ED Registration Clerk</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "contextual inquiry — emergency department intake shadowing ed intake workflow high-acuity baseline project-cross-cutting ed-intake-form contextual inquiry — emergency department intake shadowing objective observe real-time intake workflow under peak load to assess where, if anywhere, an ai tool could realistically fit without adding cognitive burden during high-acuity moments. method method: in-person shadowing during peak hours (4-7pm), 2 sessions researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (interruption tolerance) intake staff are interrupted every 2-4 minutes on average during peak hours (paged, walked up to, or called over); any ai tool requiring sustained attention to review/correct output is unlikely to be used in this specific role during peak windows. [medium] (triage priority) registration/demographic data entry is frequently completed after the clinical triage, not before, contradicting the originally assumed &#x27;intake happens first&#x27; workflow model. [medium] (paper backup) staff keep a physical paper triage sheet as backup &#x27;in case the system is slow,&#x27; which happens often enough (self-reported several times a shift) that any ai feature needs to survive or gracefully degrade during system slowness. [low] (positive signal) registration clerk expressed interest in ai that could pre-fill demographic fields from insurance card photo capture, since that specific task is high-volume and low-judgment. representative quotes &quot;you can build the smartest tool in the world, but if i have three people yelling for me at once, i am not sitting there reviewing an ai&#x27;s homework.&quot; — ed intake nurse, p21 &quot;just let me snap a photo of the insurance card and stop making me type the same sixteen fields for the hundredth time tonight.&quot; — ed registration clerk, p23 recommendations deprioritize any ai feature aimed at ed intake nurses specifically during peak hours; if pursued, target low-attention, high-volume tasks like the clerk&#x27;s insurance-card idea instead. any ai feature in this environment must have a clearly tested degraded/offline mode given frequent system slowness. follow-ups / open questions talk to it about actual system slowness frequency/root cause — is it a known, trackable issue? explore insurance-card ocr pre-fill as a smaller, separate low-risk pilot candidate. related synthesized into: scope-boundaries-and-workflow-fit.md participants participants — contextual inquiry — emergency department intake shadowing count: 2 roles: ed intake nurse ed registration clerk researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-05-06-usability-test-clinician-dashboard-redesign-v1", "kind": "raw", "title": "Usability Test — Clinician Dashboard Redesign (v1)", "date": "2025-05-06", "type": "usability-test", "status": "raw", "tags": ["dashboard", "usability", "clinician-experience", "information-architecture", "project-clinician-dashboard"], "related_components": ["clinician-dashboard", "care-gap-badge"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-05-06-usability-test-clinician-dashboard-redesign-v1/session-notes.md", "corrections": [], "html": "<h1>Usability Test — Clinician Dashboard Redesign (v1)</h1>\n<h2>Objective</h2>\n<p>Test a redesigned clinician home dashboard that surfaces AI-flagged items (abnormal results, care gaps) alongside the standard patient list, to see if the new information hierarchy helps or adds noise.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, task-based, 50 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(alert fatigue)</em> 5 of 6 participants said the new AI-flagged &#x27;care gap&#x27; badges would likely become background noise within a week if the flagging threshold isn&#x27;t tuned, since 2 of the 3 example flags shown were judged clinically low-value.</li><li><strong>[MEDIUM]</strong> <em>(information architecture)</em> Participants generally liked having flags inline with the patient list rather than in a separate panel, but wanted a way to dismiss/snooze a flag per patient.</li><li><strong>[MEDIUM]</strong> <em>(trust)</em> Participants wanted to know the flag&#x27;s underlying logic (&#x27;why is this flagged?&#x27;) available on hover/click, not just the flag itself.</li><li><strong>[MEDIUM]</strong> <em>(visual design)</em> Badge color scheme was confused with existing acuity color-coding already used elsewhere in the EHR, creating a risk of misreading a documentation-quality flag as a clinical-acuity flag.</li><li><strong>[LOW]</strong> <em>(positive signal)</em> Participants responded well to the reduced number of clicks to get from dashboard to chart (2 clicks vs. 4 in the current system).</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;If two out of three of these flags are junk, I&#x27;m going to start ignoring all of them, including the one that actually matters. That&#x27;s worse than no flag at all.&quot;</p><p>— Physician, P27</p></blockquote>\n<blockquote><p>&quot;Don&#x27;t reuse red/yellow/green for this. That already means something else to me on this exact screen.&quot;</p><p>— Nurse Practitioner, P29</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Do not ship the care-gap flagging feature until precision is meaningfully improved and validated against clinical review, given the explicit alert-fatigue risk raised.</li><li>Change the flag badge visual system to something clearly distinct from the existing acuity color convention.</li><li>Add a &#x27;why flagged&#x27; explanation and per-flag dismiss/snooze control before next round of testing.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Get current false-positive rate on the care-gap model from Data Science before scheduling v2 testing.</li><li>Coordinate with design system team on a non-conflicting badge treatment.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/clinician-experience-documentation-burden.md\">clinician-experience-documentation-burden.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Clinician Dashboard Redesign (v1)</h1>\n<p><strong>Count:</strong> 6</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician</li><li>Physician</li><li>Nurse Practitioner</li><li>Physician Assistant</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — clinician dashboard redesign (v1) dashboard usability clinician-experience information-architecture project-clinician-dashboard clinician-dashboard care-gap-badge usability test — clinician dashboard redesign (v1) objective test a redesigned clinician home dashboard that surfaces ai-flagged items (abnormal results, care gaps) alongside the standard patient list, to see if the new information hierarchy helps or adds noise. method method: moderated usability test, task-based, 50 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (alert fatigue) 5 of 6 participants said the new ai-flagged &#x27;care gap&#x27; badges would likely become background noise within a week if the flagging threshold isn&#x27;t tuned, since 2 of the 3 example flags shown were judged clinically low-value. [medium] (information architecture) participants generally liked having flags inline with the patient list rather than in a separate panel, but wanted a way to dismiss/snooze a flag per patient. [medium] (trust) participants wanted to know the flag&#x27;s underlying logic (&#x27;why is this flagged?&#x27;) available on hover/click, not just the flag itself. [medium] (visual design) badge color scheme was confused with existing acuity color-coding already used elsewhere in the ehr, creating a risk of misreading a documentation-quality flag as a clinical-acuity flag. [low] (positive signal) participants responded well to the reduced number of clicks to get from dashboard to chart (2 clicks vs. 4 in the current system). representative quotes &quot;if two out of three of these flags are junk, i&#x27;m going to start ignoring all of them, including the one that actually matters. that&#x27;s worse than no flag at all.&quot; — physician, p27 &quot;don&#x27;t reuse red/yellow/green for this. that already means something else to me on this exact screen.&quot; — nurse practitioner, p29 recommendations do not ship the care-gap flagging feature until precision is meaningfully improved and validated against clinical review, given the explicit alert-fatigue risk raised. change the flag badge visual system to something clearly distinct from the existing acuity color convention. add a &#x27;why flagged&#x27; explanation and per-flag dismiss/snooze control before next round of testing. follow-ups / open questions get current false-positive rate on the care-gap model from data science before scheduling v2 testing. coordinate with design system team on a non-conflicting badge treatment. related synthesized into: clinician-experience-documentation-burden.md participants participants — usability test — clinician dashboard redesign (v1) count: 6 roles: physician physician nurse practitioner physician assistant researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-05-20-interview-it-security-sso-mfa-modernization", "kind": "raw", "title": "Interview — IT Security on SSO/MFA Modernization Impact", "date": "2025-05-20", "type": "interview", "status": "raw", "tags": ["security", "sso", "mfa", "authentication", "clinician-workflow", "project-cross-cutting"], "related_components": ["sso-mfa-login", "ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-05-20-interview-it-security-sso-mfa-modernization/session-notes.md", "corrections": [], "html": "<h1>Interview — IT Security on SSO/MFA Modernization Impact</h1>\n<h2>Objective</h2>\n<p>Understand planned SSO/MFA changes and their anticipated impact on clinical workflow before any AI feature is layered on top of authentication-dependent sessions.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 40 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(session timeout)</em> Planned MFA rollout would introduce a shared-workstation re-authentication requirement every 15 minutes, down from the current 4 hours — flagged internally as likely to cause clinician pushback based on prior rollout feedback, independent of any AI feature.</li><li><strong>[MEDIUM]</strong> <em>(badge-tap workflow)</em> Most units already use badge-tap proximity login for shared workstations; new MFA plan hasn&#x27;t yet been confirmed to work with the existing badge-tap hardware.</li><li><strong>[MEDIUM]</strong> <em>(AI session risk)</em> If an AI ambient scribe session is mid-recording when a forced re-auth occurs, current design has no defined behavior — could lose the in-progress draft.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Security wants 15 minutes, clinical ops wants 4 hours, and nobody&#x27;s told me yet who wins that argument, but I have to build for one of them.&quot;</p><p>— IT Security Engineer, P31</p></blockquote>\n<blockquote><p>&quot;Nobody&#x27;s asked what happens to an active AI recording session if the screen locks mid-visit. That&#x27;s going to be a real incident the first time it happens.&quot;</p><p>— IT Security Engineer, P31</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Flag the ambient-scribe-mid-recording + forced-reauth interaction to the ambient scribe engineering team immediately as an unhandled edge case.</li><li>Push for a joint decision meeting between Security and Clinical Ops on the session timeout conflict before MFA rollout, independent of Compass AI.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm badge-tap hardware compatibility with new MFA plan.</li><li>Get the ambient scribe team&#x27;s answer on session-loss behavior into a future usability test script.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — IT Security on SSO/MFA Modernization Impact</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>IT Security Engineer</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "interview — it security on sso/mfa modernization impact security sso mfa authentication clinician-workflow project-cross-cutting sso-mfa-login ambient-scribe-widget interview — it security on sso/mfa modernization impact objective understand planned sso/mfa changes and their anticipated impact on clinical workflow before any ai feature is layered on top of authentication-dependent sessions. method method: 1:1 interview, 40 min researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (session timeout) planned mfa rollout would introduce a shared-workstation re-authentication requirement every 15 minutes, down from the current 4 hours — flagged internally as likely to cause clinician pushback based on prior rollout feedback, independent of any ai feature. [medium] (badge-tap workflow) most units already use badge-tap proximity login for shared workstations; new mfa plan hasn&#x27;t yet been confirmed to work with the existing badge-tap hardware. [medium] (ai session risk) if an ai ambient scribe session is mid-recording when a forced re-auth occurs, current design has no defined behavior — could lose the in-progress draft. representative quotes &quot;security wants 15 minutes, clinical ops wants 4 hours, and nobody&#x27;s told me yet who wins that argument, but i have to build for one of them.&quot; — it security engineer, p31 &quot;nobody&#x27;s asked what happens to an active ai recording session if the screen locks mid-visit. that&#x27;s going to be a real incident the first time it happens.&quot; — it security engineer, p31 recommendations flag the ambient-scribe-mid-recording + forced-reauth interaction to the ambient scribe engineering team immediately as an unhandled edge case. push for a joint decision meeting between security and clinical ops on the session timeout conflict before mfa rollout, independent of compass ai. follow-ups / open questions confirm badge-tap hardware compatibility with new mfa plan. get the ambient scribe team&#x27;s answer on session-loss behavior into a future usability test script. related synthesized into: scope-boundaries-and-workflow-fit.md participants participants — interview — it security on sso/mfa modernization impact count: 1 roles: it security engineer researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-06-03-survey-patient-portal-ai-chatbot-trust", "kind": "raw", "title": "Survey — Patient Trust in AI Chatbot for Scheduling", "date": "2025-06-03", "type": "survey", "status": "raw", "tags": ["survey", "patient-experience", "chatbot", "trust", "scheduling", "project-patient-chatbot"], "related_components": ["patient-chatbot-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-06-03-survey-patient-portal-ai-chatbot-trust/session-notes.md", "corrections": [], "html": "<h1>Survey — Patient Trust in AI Chatbot for Scheduling</h1>\n<h2>Objective</h2>\n<p>Gauge patient comfort with an AI chatbot handling appointment scheduling and basic pre-visit questions, ahead of building a prototype.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Online survey via patient portal, 9 questions, incentivized ($10 gift card)</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(trust threshold)</em> 67% of respondents were comfortable with an AI chatbot for scheduling/rescheduling specifically, but comfort dropped to 22% when the question extended to &#x27;answering questions about my symptoms.&#x27;</li><li><strong>[MEDIUM]</strong> <em>(transparency ask)</em> Open-ended responses frequently (41% of those who answered) asked for a clear, easy way to reach &#x27;a real person&#x27; if the bot couldn&#x27;t help — treated as a trust prerequisite, not a nice-to-have.</li><li><strong>[LOW]</strong> <em>(age variance)</em> Comfort with the chatbot skewed higher among respondents who self-reported as under 45, consistent with general digital-trust patterns, not a novel finding but worth noting for pilot recruitment.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;Booking an appointment, sure, a robot&#x27;s fine. Asking it if my chest pain is serious? Absolutely not.&quot;</p><p>— Patient portal user, P44 (survey open-ended)</p></blockquote>\n<blockquote><p>&quot;As long as I can type &#x27;human please&#x27; and get one, I don&#x27;t mind trying the bot first.&quot;</p><p>— Patient portal user, P58 (survey open-ended)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Scope the chatbot&#x27;s initial functionality strictly to scheduling/logistics; explicitly exclude symptom-related Q&amp;A from v1 given the sharp trust drop-off.</li><li>Design a highly visible, low-friction &#x27;talk to a person&#x27; escape hatch as a core requirement, not an afterthought.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Usability test the escape-hatch design specifically once a prototype exists.</li><li>Consider a targeted follow-up with the 45+ demographic to understand specific hesitations.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/patient-scheduling-chatbot.md\">patient-scheduling-chatbot.md</a></li></ul><h2>Participants</h2><h1>Participants — Survey — Patient Trust in AI Chatbot for Scheduling</h1>\n<p><strong>Count:</strong> 310</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Patient portal user (general population)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "survey — patient trust in ai chatbot for scheduling survey patient-experience chatbot trust scheduling project-patient-chatbot patient-chatbot-widget survey — patient trust in ai chatbot for scheduling objective gauge patient comfort with an ai chatbot handling appointment scheduling and basic pre-visit questions, ahead of building a prototype. method method: online survey via patient portal, 9 questions, incentivized ($10 gift card) researcher: priya patel full participant roster: see participants.md in this folder key findings [medium] (trust threshold) 67% of respondents were comfortable with an ai chatbot for scheduling/rescheduling specifically, but comfort dropped to 22% when the question extended to &#x27;answering questions about my symptoms.&#x27; [medium] (transparency ask) open-ended responses frequently (41% of those who answered) asked for a clear, easy way to reach &#x27;a real person&#x27; if the bot couldn&#x27;t help — treated as a trust prerequisite, not a nice-to-have. [low] (age variance) comfort with the chatbot skewed higher among respondents who self-reported as under 45, consistent with general digital-trust patterns, not a novel finding but worth noting for pilot recruitment. representative quotes &quot;booking an appointment, sure, a robot&#x27;s fine. asking it if my chest pain is serious? absolutely not.&quot; — patient portal user, p44 (survey open-ended)
