: null, "path": "raw/2025-09-23-usability-test-ambient-scribe-v02/session-notes.md", "html": "<h1>Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)</h1>\n<h2>Objective</h2>\n<p>Re-test the ambient scribe after v0.1 fixes (medication dosage accuracy, inline correction, auto-listening, and the draft-retention/Security review from February) to see whether the critical and high findings were resolved.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, simulated patient encounters, 45 min/session — follow-up with 3 returning + 2 new participants</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[LOW]</strong> <em>(phi-handling (resolved))</em> The draft-retention issue from v0.1 (critical finding, Feb) has been fixed — drafts now auto-expire from the editable state after 10 minutes of inactivity and the behavior is documented for Compliance; verified in all 5 sessions.</li><li><strong>[MEDIUM]</strong> <em>(accuracy (improved but not resolved))</em> Medication dosage errors dropped from 3/5 to 1/5 sessions — a clear improvement, but the remaining error type (misheard similar-sounding drug names) is a known class of error the team should track going forward.</li><li><strong>[HIGH]</strong> <em>(trust calibration (unchanged))</em> Despite accuracy improvements, all 5 participants still read every line before accepting — the returning 3 participants said their behavior from v0.1 hadn&#x27;t changed at all in the interim, suggesting trust doesn&#x27;t shift from accuracy improvements alone without something like a track record or confidence indicator.</li><li><strong>[MEDIUM]</strong> <em>(interaction (resolved))</em> In-place line correction (requested in v0.1) works well; all participants successfully corrected a wrong line without regenerating the full note.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;It&#x27;s better, no question. But I still read every line, same as last time. Getting it right once doesn&#x27;t mean I trust it yet.&quot;</p><p>— Physician, Internal Medicine, P09 (returning from v0.1)</p></blockquote>\n<blockquote><p>&quot;The fix where I can just click and edit one line? That&#x27;s the difference between me using this and not.&quot;</p><p>— Physician, Family Medicine, P11 (returning from v0.1)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Since accuracy fixes alone haven&#x27;t shifted trust/skim behavior, explore an explicit confidence indicator per line (e.g., highlighting low-confidence transcriptions) as the next trust-building lever, rather than continuing to chase raw accuracy alone.</li><li>Add a specific test/tracking metric for similar-sounding medication name errors going forward, since it&#x27;s now the dominant remaining error type.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Design and test a per-line confidence indicator concept for v0.3.</li><li>Check with engineering whether a medication name pronunciation dictionary/fine-tune could reduce the sound-alike error class.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Ambient AI Scribe Prototype v0.2 (Follow-up)</h1>\n<p><strong>Count:</strong> 5</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician (Family Medicine)</li><li>Physician (Internal Medicine)</li><li>Nurse Practitioner</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ambient ai scribe prototype v0.2 (follow-up) ambient-scribe usability documentation v0.2 longitudinal ambient-scribe-widget encounter-view usability test — ambient ai scribe prototype v0.2 (follow-up) objective re-test the ambient scribe after v0.1 fixes (medication dosage accuracy, inline correction, auto-listening, and the draft-retention/security review from february) to see whether the critical and high findings were resolved. method method: moderated usability test, simulated patient encounters, 45 min/session — follow-up with 3 returning + 2 new participants researcher: priya patel full participant roster: see participants.md in this folder key findings [low] (phi-handling (resolved)) the draft-retention issue from v0.1 (critical finding, feb) has been fixed — drafts now auto-expire from the editable state after 10 minutes of inactivity and the behavior is documented for compliance; verified in all 5 sessions. [medium] (accuracy (improved but not resolved)) medication dosage errors dropped from 3/5 to 1/5 sessions — a clear improvement, but the remaining error type (misheard similar-sounding drug names) is a known class of error the team should track going forward. [high] (trust calibration (unchanged)) despite accuracy improvements, all 5 participants still read every line before accepting — the returning 3 participants said their behavior from v0.1 hadn&#x27;t changed at all in the interim, suggesting trust doesn&#x27;t shift from accuracy improvements alone without something like a track record or confidence indicator. [medium] (interaction (resolved)) in-place line correction (requested in v0.1) works well; all participants successfully corrected a wrong line without regenerating the full note. representative quotes &quot;it&#x27;s better, no question. but i still read every line, same as last time. getting it right once doesn&#x27;t mean i trust it yet.&quot; — physician, internal medicine, p09 (returning from v0.1) &quot;the fix where i can just click and edit one line? that&#x27;s the difference between me using this and not.&quot; — physician, family medicine, p11 (returning from v0.1) recommendations since accuracy fixes alone haven&#x27;t shifted trust/skim behavior, explore an explicit confidence indicator per line (e.g., highlighting low-confidence transcriptions) as the next trust-building lever, rather than continuing to chase raw accuracy alone. add a specific test/tracking metric for similar-sounding medication name errors going forward, since it&#x27;s now the dominant remaining error type. follow-ups / open questions design and test a per-line confidence indicator concept for v0.3. check with engineering whether a medication name pronunciation dictionary/fine-tune could reduce the sound-alike error class. related synthesized into: ambient-scribe.md participants participants — usability test — ambient ai scribe prototype v0.2 (follow-up) count: 5 roles: physician (family medicine) physician (internal medicine) nurse practitioner researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-10-07-contextual-inquiry-behavioral-health-sensitive-notes", "kind": "raw", "title": "Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling", "date": "2025-10-07", "type": "contextual-inquiry", "status": "raw", "tags": ["behavioral-health", "42-cfr-part-2", "phi", "sensitive-notes"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-10-07-contextual-inquiry-behavioral-health-sensitive-notes/session-notes.md", "html": "<h1>Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling</h1>\n<h2>Objective</h2>\n<p>Understand how behavioral health documentation is currently handled given its extra legal protections, to determine whether/how any Compass AI documentation tools (like the ambient scribe) could safely extend here, if at all.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> In-person shadowing + informal interview, 1 session, 2 hours</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(scope caution)</em> Clinician was firm that any AI tool listening to or drafting behavioral health session notes raises consent and 42 CFR Part 2 questions well beyond what&#x27;s been addressed for general medical encounters so far — this population should not be included in any near-term ambient scribe rollout without a dedicated legal/consent review.</li><li><strong>[HIGH]</strong> <em>(existing gap)</em> Reiterates the July HIM finding: there is still no structured way to flag a note as Part-2 protected in the EHR, which independently limits any AI feature&#x27;s ability to know to treat such notes differently even if it wanted to.</li><li><strong>[MEDIUM]</strong> <em>(documentation style)</em> Behavioral health notes are more narrative and clinically nuanced than typical med-surg notes, which the clinician felt would be especially hard for a generic ambient scribe to draft accurately even setting aside the legal question.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I&#x27;m not against AI. I&#x27;m against AI listening to a session about someone&#x27;s substance use history before we&#x27;ve even figured out how to flag that note as protected in the first place.&quot;</p><p>— Behavioral Health Clinician, P95</p></blockquote>\n<blockquote><p>&quot;You&#x27;d need a completely separate conversation with legal before this unit is anywhere near a pilot.&quot;</p><p>— Behavioral Health Unit Charge Nurse, P97</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Formally exclude behavioral health and substance use encounters from any ambient scribe pilot scope until a dedicated legal/consent review is completed — recommend this be an explicit, documented scope boundary in the 2026 roadmap, not just an informal assumption.</li><li>Escalate the recurring &#x27;no structured way to flag Part 2 notes&#x27; finding (now raised independently in two separate research threads, HIM in July and here) as a standalone platform gap worth fixing regardless of AI plans.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm with Legal whether a consent review for this population is even on a timeline, or needs to be requested.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/scope-boundaries-and-workflow-fit.md\">scope-boundaries-and-workflow-fit.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Behavioral Health Unit, Sensitive Note Handling</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Behavioral Health Clinician</li><li>Behavioral Health Unit Charge Nurse</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "contextual inquiry — behavioral health unit, sensitive note handling behavioral-health 42-cfr-part-2 phi sensitive-notes ambient-scribe-widget contextual inquiry — behavioral health unit, sensitive note handling objective understand how behavioral health documentation is currently handled given its extra legal protections, to determine whether/how any compass ai documentation tools (like the ambient scribe) could safely extend here, if at all. method method: in-person shadowing + informal interview, 1 session, 2 hours researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (scope caution) clinician was firm that any ai tool listening to or drafting behavioral health session notes raises consent and 42 cfr part 2 questions well beyond what&#x27;s been addressed for general medical encounters so far — this population should not be included in any near-term ambient scribe rollout without a dedicated legal/consent review. [high] (existing gap) reiterates the july him finding: there is still no structured way to flag a note as part-2 protected in the ehr, which independently limits any ai feature&#x27;s ability to know to treat such notes differently even if it wanted to. [medium] (documentation style) behavioral health notes are more narrative and clinically nuanced than typical med-surg notes, which the clinician felt would be especially hard for a generic ambient scribe to draft accurately even setting aside the legal question. representative quotes &quot;i&#x27;m not against ai. i&#x27;m against ai listening to a session about someone&#x27;s substance use history before we&#x27;ve even figured out how to flag that note as protected in the first place.&quot; — behavioral health clinician, p95 &quot;you&#x27;d need a completely separate conversation with legal before this unit is anywhere near a pilot.&quot; — behavioral health unit charge nurse, p97 recommendations formally exclude behavioral health and substance use encounters from any ambient scribe pilot scope until a dedicated legal/consent review is completed — recommend this be an explicit, documented scope boundary in the 2026 roadmap, not just an informal assumption. escalate the recurring &#x27;no structured way to flag part 2 notes&#x27; finding (now raised independently in two separate research threads, him in july and here) as a standalone platform gap worth fixing regardless of ai plans. follow-ups / open questions confirm with legal whether a consent review for this population is even on a timeline, or needs to be requested. related synthesized into: scope-boundaries-and-workflow-fit.md participants participants — contextual inquiry — behavioral health unit, sensitive note handling count: 2 roles: behavioral health clinician behavioral health unit charge nurse researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-10-21-interview-training-department-rollout-change-management", "kind": "raw", "title": "Interview — Training & Education Dept on Rollout/Change Management Planning", "date": "2025-10-21", "type": "interview", "status": "raw", "tags": ["change-management", "training", "rollout"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-10-21-interview-training-department-rollout-change-management/session-notes.md", "html": "<h1>Interview — Training &amp; Education Dept on Rollout/Change Management Planning</h1>\n<h2>Objective</h2>\n<p>Understand what a realistic training/rollout plan looks like for the first Compass AI features going to general availability, drawing on lessons from past rollouts.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> 1:1 interview, 40 min</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(past rollout lesson)</em> Director pointed to the 2022 CDS alert rollout (also referenced by executives in January) as a cautionary tale specifically because training was a single 20-minute video with no hands-on practice, and adoption suffered as a result — she wants any Compass AI rollout to include live, hands-on sessions instead.</li><li><strong>[MEDIUM]</strong> <em>(champion model)</em> Prefers a &#x27;unit champion&#x27; model (1-2 respected staff per unit trained early and deeply, who then support peers) over an all-at-once broadcast rollout, based on past success with an unrelated EHR module rollout in 2023.</li><li><strong>[LOW]</strong> <em>(timing sensitivity)</em> Flagged that rolling out during flu season (Nov-Feb) has historically correlated with poor training attendance and should be avoided if possible for the ambient scribe GA rollout.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;We already know what doesn&#x27;t work. A video nobody watches and hoping for the best. I don&#x27;t want to repeat 2022.&quot;</p><p>— Director of Clinical Training &amp; Education, P99</p></blockquote>\n<blockquote><p>&quot;Give me two respected nurses per unit, trained early and given actual time to practice, and they&#x27;ll do more for adoption than any all-staff email ever will.&quot;</p><p>— Director of Clinical Training &amp; Education, P99</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Build the ambient scribe GA rollout plan around the unit-champion model, and explicitly avoid flu-season timing given the historical attendance pattern.</li><li>Include hands-on practice time in training, not just a recorded overview, directly addressing the 2022 lesson learned.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Get the actual 2022 CDS rollout adoption numbers if they exist, to quantify the lesson rather than rely on recollection.</li><li>Identify candidate unit champions once the GA rollout unit list is finalized.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/rollout-and-change-management.md\">rollout-and-change-management.md</a></li></ul><h2>Participants</h2><h1>Participants — Interview — Training &amp; Education Dept on Rollout/Change Management Planning</h1>\n<p><strong>Count:</strong> 1</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Director of Clinical Training &amp; Education</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "interview — training & education dept on rollout/change management planning change-management training rollout interview — training &amp; education dept on rollout/change management planning objective understand what a realistic training/rollout plan looks like for the first compass ai features going to general availability, drawing on lessons from past rollouts. method method: 1:1 interview, 40 min researcher: priya patel full participant roster: see participants.md in this folder key findings [medium] (past rollout lesson) director pointed to the 2022 cds alert rollout (also referenced by executives in january) as a cautionary tale specifically because training was a single 20-minute video with no hands-on practice, and adoption suffered as a result — she wants any compass ai rollout to include live, hands-on sessions instead. [medium] (champion model) prefers a &#x27;unit champion&#x27; model (1-2 respected staff per unit trained early and deeply, who then support peers) over an all-at-once broadcast rollout, based on past success with an unrelated ehr module rollout in 2023. [low] (timing sensitivity) flagged that rolling out during flu season (nov-feb) has historically correlated with poor training attendance and should be avoided if possible for the ambient scribe ga rollout. representative quotes &quot;we already know what doesn&#x27;t work. a video nobody watches and hoping for the best. i don&#x27;t want to repeat 2022.&quot; — director of clinical training &amp; education, p99 &quot;give me two respected nurses per unit, trained early and given actual time to practice, and they&#x27;ll do more for adoption than any all-staff email ever will.&quot; — director of clinical training &amp; education, p99 recommendations build the ambient scribe ga rollout plan around the unit-champion model, and explicitly avoid flu-season timing given the historical attendance pattern. include hands-on practice time in training, not just a recorded overview, directly addressing the 2022 lesson learned. follow-ups / open questions get the actual 2022 cds rollout adoption numbers if they exist, to quantify the lesson rather than rely on recollection. identify candidate unit champions once the ga rollout unit list is finalized. related synthesized into: rollout-and-change-management.md participants participants — interview — training &amp; education dept on rollout/change management planning count: 1 roles: director of clinical training &amp; education researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-11-04-usability-test-prior-auth-ai-v2", "kind": "raw", "title": "Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)", "date": "2025-11-04", "type": "usability-test", "status": "raw", "tags": ["prior-auth", "usability", "utilization-management", "v2", "longitudinal"], "related_components": ["prior-auth-drafting-panel"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-11-04-usability-test-prior-auth-ai-v2/session-notes.md", "html": "<h1>Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)</h1>\n<h2>Objective</h2>\n<p>Re-test the prior authorization tool after the outdated-diagnosis-code fix and addition of inline source citations (from April findings), scoped to the &#x27;straightforward&#x27; case definition the supervisor helped define.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, 4 case scenarios (2 straightforward, 2 complex), 60 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[LOW]</strong> <em>(accuracy (resolved))</em> The outdated diagnosis code issue from v1 did not recur in any of the 4 test cases; citations now correctly reference the most recent active diagnosis.</li><li><strong>[LOW]</strong> <em>(transparency (resolved))</em> Inline source citations were well-received and used actively — 3 of 4 participants clicked into at least one citation to verify before accepting, which participants described as appropriately fast rather than as friction.</li><li><strong>[MEDIUM]</strong> <em>(scope boundary)</em> On the 2 complex cases (intentionally outside the agreed &#x27;straightforward&#x27; scope), the tool still struggled, confirming the supervisor&#x27;s April instinct that scope limitation was the right call rather than something to fix immediately.</li><li><strong>[MEDIUM]</strong> <em>(time savings (confirmed))</em> For straightforward cases, drafting time was confirmed at ~5 minutes vs. ~15 minutes manual, consistent with April&#x27;s estimate, now measured directly rather than estimated.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;This is what I wanted in April. It shows its work, it got the codes right, and it didn&#x27;t try to be a hero on the complicated case — it basically said &#x27;this one&#x27;s harder, take the wheel.&#x27;&quot;</p><p>— Utilization Review Nurse (supervisor), P17 (returning from v1)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Recommend this tool for pilot expansion within the agreed straightforward-case scope; do not expand scope to complex cases without a separate, dedicated round of model work and testing.</li><li>Use the clear before/after (v1 to v2) data here as a model for how to communicate iterative improvement to executives, tying back to the January request for shared success metrics.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Define what &#x27;pilot expansion&#x27; means concretely — how many nurses, how many weeks, what&#x27;s the go/no-go metric.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/prior-authorization.md\">prior-authorization.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — AI-Assisted Prior Authorization Drafting (v2, Follow-up)</h1>\n<p><strong>Count:</strong> 4</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Utilization Review Nurse</li><li>Utilization Review Nurse</li><li>Utilization Review Nurse (supervisor)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ai-assisted prior authorization drafting (v2, follow-up) prior-auth usability utilization-management v2 longitudinal prior-auth-drafting-panel usability test — ai-assisted prior authorization drafting (v2, follow-up) objective re-test the prior authorization tool after the outdated-diagnosis-code fix and addition of inline source citations (from april findings), scoped to the &#x27;straightforward&#x27; case definition the supervisor helped define. authorization.md participants participants — usability test — ai-assisted prior authorization drafting (v2, follow-up) count: 4 roles: utilization review nurse utilization review nurse utilization review nurse (supervisor) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-11-18-accessibility-audit-mobile-clinician-app", "kind": "raw", "title": "Accessibility Audit — Mobile Clinician App (Low Vision & Motor Impairment Focus)", "date": "2025-11-18", "type": "accessibility-audit", "status": "raw", "tags": ["accessibility", "mobile", "low-vision", "motor-impairment"], "related_components": ["mobile-app-alert-list", "alert-triage-queue"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-11-18-accessibility-audit-mobile-clinician-app/session-notes.md", "html": "<h1>Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</h1>\n<h2>Objective</h2>\n<p>Assess mobile clinician app accessibility for low vision and motor impairment specifically, ahead of the app becoming a secondary surface for Compass AI features like alert triage.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Manual audit + 2 participant walkthroughs (low vision, limited fine motor control), iOS + Android</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(touch target size)</em> Several action icons in the alert triage list (a Compass AI surface, per the August findings) are 32x32px, below the 44x44px minimum recommended for reliable use by the motor-impairment participant, who mis-tapped adjacent icons repeatedly.</li><li><strong>[HIGH]</strong> <em>(text scaling)</em> App text does not respect the OS-level dynamic text size setting; the low-vision participant&#x27;s usual 200% system text setting had no effect within the app, forcing reliance on pinch-zoom which broke the layout.</li><li><strong>[MEDIUM]</strong> <em>(voiceover labeling)</em> Several icon-only buttons lack accessible labels, announced only as &#x27;button&#x27; by VoiceOver.</li><li><strong>[MEDIUM]</strong> <em>(color-only status)</em> Same red/yellow/green-only status pattern flagged in the March legacy audit also appears here, suggesting it may be a broader design system gap rather than isolated to one surface.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I set my phone to 200% text everywhere else. In this app it&#x27;s like that setting doesn&#x27;t exist.&quot;</p><p>— Clinician, low vision, P103</p></blockquote>\n<blockquote><p>&quot;Those little icons in the alert list, I hit the wrong one probably one in four times. On a good day.&quot;</p><p>— Clinician, limited fine motor control, P105</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Fix touch target sizing on the alert triage icons as a priority, since it directly affects a live Compass AI feature (linking to August findings).</li><li>Implement support for OS-level dynamic text sizing; this is likely a systemic app issue, not specific to any one screen.</li><li>Note the recurring color-only status pattern (now found in 3 separate audits: legacy console, design system, mobile app) as a candidate for a single, org-wide design system fix rather than three separate ones.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm whether the color-only status issue has a single shared root component across surfaces, which would make for one fix instead of three.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/accessibility-cross-cutting.md\">accessibility-cross-cutting.md</a></li></ul><h2>Participants</h2><h1>Participants — Accessibility Audit — Mobile Clinician App (Low Vision &amp; Motor Impairment Focus)</h1>\n<p><strong>Count:</strong> 2</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Clinician (low vision)</li><li>Clinician (limited fine motor control, uses stylus)</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "accessibility audit — mobile clinician app (low vision & motor impairment focus) accessibility mobile low-vision motor-impairment mobile-app-alert-list alert-triage-queue accessibility audit — mobile clinician app (low vision &amp; motor impairment focus) objective assess mobile clinician app accessibility for low vision and motor impairment specifically, ahead of the app becoming a secondary surface for compass ai features like alert triage. method method: manual audit + 2 participant walkthroughs (low vision, limited fine motor control), ios + android researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (touch target size) several action icons in the alert triage list (a compass ai surface, per the august findings) are 32x32px, below the 44x44px minimum recommended for reliable use by the motor-impairment participant, who mis-tapped adjacent icons repeatedly. [high] (text scaling) app text does not respect the os-level dynamic text size setting; the low-vision participant&#x27;s usual 200% system text setting had no effect within the app, forcing reliance on pinch-zoom which broke the layout. [medium] (voiceover labeling) several icon-only buttons lack accessible labels, announced only as &#x27;button&#x27; by voiceover. [medium] (color-only status) same red/yellow/green-only status pattern flagged in the march legacy audit also appears here, suggesting it may be a broader design system gap rather than isolated to one surface. representative quotes &quot;i set my phone to 200% text everywhere else. in this app it&#x27;s like that setting doesn&#x27;t exist.&quot; — clinician, low vision, p103 &quot;those little icons in the alert list, i hit the wrong one probably one in four times. on a good day.&quot; — clinician, limited fine motor control, p105 recommendations fix touch target sizing on the alert triage icons as a priority, since it directly affects a live compass ai feature (linking to august findings). implement support for os-level dynamic text sizing; this is likely a systemic app issue, not specific to any one screen. note the recurring color-only status pattern (now found in 3 separate audits: legacy console, design system, mobile app) as a candidate for a single, org-wide design system fix rather than three separate ones. follow-ups / open questions confirm whether the color-only status issue has a single shared root component across surfaces, which would make for one fix instead of three. related synthesized into: accessibility-cross-cutting.md participants participants — accessibility audit — mobile clinician app (low vision &amp; motor impairment focus) count: 2 roles: clinician (low vision) clinician (limited fine motor control, uses stylus) researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-12-02-survey-allstaff-ai-readiness-pulse", "kind": "raw", "title": "Survey — All-Staff AI Readiness Pulse Survey", "date": "2025-12-02", "type": "survey", "status": "raw", "tags": ["survey", "organizational-readiness", "pulse", "year-end"], "related_components": ["patient-chatbot-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-12-02-survey-allstaff-ai-readiness-pulse/session-notes.md", "html": "<h1>Survey — All-Staff AI Readiness Pulse Survey</h1>\n<h2>Objective</h2>\n<p>Take an org-wide temperature check on AI readiness/sentiment heading into 2026, as input to roadmap prioritization and communications planning.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Org-wide anonymous pulse survey, 10 questions</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(awareness gap)</em> Only 34% of non-clinical staff reported being aware Compass AI initiatives were underway at all, versus 71% of clinical staff — suggesting internal communications have been clinically focused and may need broadening if non-clinical rollouts (e.g., scheduling) proceed.</li><li><strong>[MEDIUM]</strong> <em>(sentiment trend (directional, not causal))</em> Among clinical respondents, favorable sentiment toward AI-assisted documentation was somewhat higher than the March-ish baseline period, though this survey used different question wording than February&#x27;s, so it&#x27;s directional context rather than a clean comparison.</li><li><strong>[LOW]</strong> <em>(top requested feature)</em> When asked what AI feature they&#x27;d most want next, &#x27;appointment scheduling help&#x27; was the top write-in among non-clinical/admin staff, and &#x27;documentation time savings&#x27; remained the top pick among clinical staff — consistent with priorities identified all year.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I hear about this AI stuff from clinical friends but nobody&#x27;s told admin staff what&#x27;s actually happening or if it affects us.&quot;</p><p>— Non-clinical/administrative staff, P112 (survey open-ended)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Broaden internal communications about Compass AI to non-clinical staff specifically before any admin-facing pilot (e.g., scheduling chatbot) goes live, given the awareness gap found here.</li><li>If a clean sentiment trend is wanted for 2026 reporting, re-run the exact February nursing survey instrument rather than a new pulse survey, to get a true apples-to-apples comparison.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Decide with leadership whether the September burnout survey or a repeat of the February survey is the better instrument for the planned 6-month post-GA comparison.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/rollout-and-change-management.md\">rollout-and-change-management.md</a></li></ul><h2>Participants</h2><h1>Participants — Survey — All-Staff AI Readiness Pulse Survey</h1>\n<p><strong>Count:</strong> 421</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Clinical staff (various)</li><li>Non-clinical/administrative staff</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "survey — all-staff ai readiness pulse survey survey organizational-readiness pulse year-end patient-chatbot-widget survey — all-staff ai readiness pulse survey objective take an org-wide temperature check on ai readiness/sentiment heading into 2026, as input to roadmap prioritization and communications planning. method method: org-wide anonymous pulse survey, 10 question nical staff (various) non-clinical/administrative staff researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2025-12-16-stakeholder-interview-executive-steering-committee-retro", "kind": "raw", "title": "Executive Steering Committee — Year-End Retro & 2026 Roadmap Input", "date": "2025-12-16", "type": "interview", "status": "raw", "tags": ["executive", "retro", "roadmap", "year-end", "governance"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2025-12-16-stakeholder-interview-executive-steering-committee-retro/session-notes.md", "html": "<h1>Executive Steering Committee — Year-End Retro &amp; 2026 Roadmap Input</h1>\n<h2>Objective</h2>\n<p>Close out the year with the same executive group (plus two additions) from the January kickoff to review what research found, what shipped, and what should be prioritized in 2026.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Group interview/retro, 90 min, 4 executives</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(shared metrics gap partially closed)</em> The group agreed, informally, to adopt &#x27;documentation time saved&#x27; and &#x27;PHI incidents (target: zero)&#x27; as the two headline metrics going into 2026 — resolving the shared-metrics gap flagged as a finding back in January, though it&#x27;s not yet been formally written into any governance document.</li><li><strong>[MEDIUM]</strong> <em>(recurring platform debt surfaced)</em> The CIO specifically called out the color-only status indicator issue (found independently in 3 separate 2025 audits) as an example of the kind of small, recurring finding that research should flag as a pattern, not just three separate tickets — asked for a standing &#x27;cross-cutting findings&#x27; section in future reporting.</li><li><strong>[LOW]</strong> <em>(scope discipline praised)</em> VP Clinical Informatics specifically praised the decision to keep behavioral health and complex prior-auth cases out of scope for 2025, saying the discipline of &#x27;not doing it&#x27; was as valuable as anything shipped.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;A year ago we couldn&#x27;t agree on what success even meant. Now we at least agree on the two numbers we&#x27;re arguing about. That&#x27;s real progress.&quot;</p><p>— Chief Information Officer, P01 (returning from January)</p></blockquote>\n<blockquote><p>&quot;The stuff you told us not to build yet mattered as much as the stuff you told us to build.&quot;</p><p>— VP Clinical Informatics, P02 (returning from January)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Formalize the two agreed 2026 headline metrics in an actual governance document before Q1 2026 planning locks, so the informal agreement here doesn&#x27;t get lost.</li><li>Introduce a standing &#x27;cross-cutting findings&#x27; section in the research repo/reporting specifically to surface patterns like the color-only status issue across otherwise-separate sessions.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Draft the formal metrics document and route for exec sign-off in January 2026.</li><li>Retrofit a &#x27;cross-cutting findings&#x27; index into the research repo covering 2025 (e.g., color-only status, transparency/citation requests, Part 2 flagging gap).</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/governance-and-phi.md\">governance-and-phi.md</a></li></ul><h2>Participants</h2><h1>P ell received and, notably, 4 of 6 participants said it let them skim high-confidence lines for the first time across the whole testing history — the first session where reduced line-by-line reading was observed.</li><li><strong>[MEDIUM]</strong> <em>(sound-alike medication errors)</em> Still present in 1 of 6 sessions despite the pronunciation dictionary work referenced in September; team should treat this as an ongoing monitoring item post-GA rather than a pre-GA blocker, given the confidence indicator now flags it for review anyway.</li><li><strong>[MEDIUM]</strong> <em>(training readiness)</em> Participants who&#x27;d been through the champion-model style training pilot (per October&#x27;s recommendation) reported higher initial comfort than those who hadn&#x27;t, though this wasn&#x27;t a controlled comparison.</li><li><strong>[LOW]</strong> <em>(phi-handling (confirmed stable))</em> Draft-retention/auto-expiry behavior (fixed in v0.2) remains stable and correctly documented for audit purposes; no new PHI-handling issues found.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;This is the first time I actually skimmed a section instead of reading every word, because it showed me exactly where to look instead.&quot;</p><p>— Physician, Internal Medicine, P09 (returning from v0.1 and v0.2)</p></blockquote>\n<blockquote><p>&quot;I went through the champion training last month and honestly walked in already comfortable. That part worked.&quot;</p><p>— Nurse Practitioner, P118 (new participant)</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Approve for GA release; the critical (Feb) and high (Feb, Sept) findings across this tool&#x27;s full testing history are resolved or actively monitored, and the confidence-indicator concept appears to be the trust-building lever the team was looking for since September.</li><li>Continue tracking sound-alike medication errors as a post-GA metric rather than delaying release further for a low-frequency, now-flagged issue.</li><li>Use this session as the evidence base for the CIO&#x27;s requested &#x27;documentation time saved&#x27; 2026 headline metric baseline measurement.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Set up post-GA monitoring dashboard for sound-alike medication error rate.</li><li>Feed this session&#x27;s time data into the formal 2026 metrics document (per December retro action item).</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Ambient AI Scribe GA Release Candidate (Final Validation)</h1>\n<p><strong>Count:</strong> 6</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician (Family Medicine)</li><li>Physician (Internal Medicine)</li><li>Nurse Practitioner</li><li>Physician Assistant</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. No real patient or staff identities are represented; participant IDs (e.g. P01) are session-scoped fictional labels.</p>", "searchText": "usability test — ambient ai scribe ga release candidate (final validation) ambient-scribe usability documentation ga-release longitudinal ambient-scribe-widget encounter-view usability test — ambient ai scribe ga release candidate (final validation) objective final validation pass on the ambient scribe before ga release, testing the v0.3 confidence-indicator concept (from september&#x27;s recommendation) and confirming readiness against the full history of prior findings. method method: moderated usability test, simulated + 2 real (consented) low-acuity encounters, 45 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [low] (confidence indicator (positive)) the new per-line confidence highlighting (low-confidence transcription shown in a subtle underline) was well received and, notably, 4 of 6 participants said it let them skim high-confidence lines for the first time across the whole testing history — the first session where reduced line-by-line reading was observed. [medium] (sound-alike medication errors) still present in 1 of 6 sessions despite the pronunciation dictionary work referenced in september; team should treat this as an ongoing monitoring item post-ga rather than a pre-ga blocker, given the confidence indicator now flags it for review anyway. [medium] (training readiness) participants who&#x27;d been through the champion-model style training pilot (per october&#x27;s recommendation) reported higher initial comfort than those who hadn&#x27;t, though this wasn&#x27;t a controlled comparison. [low] (phi-handling (confirmed stable)) draft-retention/auto-expiry behavior (fixed in v0.2) remains stable and correctly documented for audit purposes; no new phi-handling issues found. representative quotes &quot;this is the first time i actually skimmed a section instead of reading every word, because it showed me exactly where to look instead.&quot; — physician, internal medicine, p09 (returning from v0.1 and v0.2) &quot;i went through the champion training last month and honestly walked in already comfortable. that part worked.&quot; — nurse practitioner, p118 (new participant) recommendations approve for ga release; the critical (feb) and high (feb, sept) findings across this tool&#x27;s full testing history are resolved or actively monitored, and the confidence-indicator concept appears to be the trust-building lever the team was looking for since september. continue tracking sound-alike medication errors as a post-ga metric rather than delaying release further for a low-frequency, now-flagged issue. use this session as the evidence base for the cio&#x27;s requested &#x27;documentation time saved&#x27; 2026 headline metric baseline measurement. follow-ups / open questions set up post-ga monitoring dashboard for sound-alike medication error rate. feed this session&#x27;s time data into the formal 2026 metrics document (per december retro action item). related synthesized into: ambient-scribe.md participants participants — usability test — ambient ai scribe ga release candidate (final validation) count: 6 roles: physician (family medicine) physician (internal medicine) nurse practitioner physician assistant researcher: priya patel recruitment note: participants recruited via internal unit/department contacts or the patient portal panel, consistent with prior sessions on this topic where applicable. no real patient or staff identities are represented; participant ids (e.g. p01) are session-scoped fictional labels."}, {"id": "raw:2026-01-19-onboarding-usability-test", "kind": "raw", "title": "Onboarding usability test — session notes", "date": "2026-01-19", "type": "usability-test", "status": "raw", "tags": ["onboarding"], "related_components": [], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-01-19-onboarding-usability-test/session-notes.md", "html": "<p><strong>Researcher:</strong> Priya Patel</p>\n<h2>Session 1 — Jan 19</h2>\n<p>Participant paused ~15s at step 3 (&quot;Connect calendar&quot;), said &quot;wait, do I have to do this?&quot; before proceeding. Completed step without connecting a real calendar (used the skip-adjacent &quot;I&#x27;ll do this later&quot; affordance, which doesn&#x27;t actually exist — participant tried clicking the step label itself as an exit).</p>\n<h2>Session 2 — Jan 20</h2>\n<p>Attempted to skip step 2 directly, assuming it was optional. Backed out when the &quot;required&quot; indicator appeared, expressed mild frustration (&quot;could&#x27;ve told me that up front&quot;).</p>\n<h2>Session 3 — Jan 21</h2>\n<p>Same step 3 hesitation as session 1. When asked directly, said: &quot;I guess I&#x27;m worried this is going to email my whole team before I&#x27;m ready.&quot;</p>\n<h2>Sessions 4–6 (Jan 22–23)</h2>\n<p>Consistent with sessions 1–3: step 3 wording read as optional by all participants; none independently identified it as required without hitting the &quot;required&quot; state first.</p><h2>Participants</h2><p><strong>Researcher:</strong> Priya Patel</p>\n<p>6 participants, all first-time Fernway workspace admins hired within the last 90 days. Company sizes ranged 10–200 employees, mix of industries. Recruited via existing customer outreach list, screened for &quot;has not previously completed Fernway onboarding themselves.&quot;</p>", "searchText": "onboarding usability test — session notes onboarding researcher: priya patel session 1 — jan 19 participant paused ~15s at step 3 (&quot;connect calendar&quot;), said &quot;wait, do i have to do this?&quot; before proceeding. completed step without connecting a real calendar (used the skip-adjacent &quot;i&#x27;ll do this later&quot; affordance, which doesn&#x27;t actually exist — participant tried clicking the step label itself as an exit). session 2 — jan 20 attempted to skip step 2 directly, assuming it was optional. backed out when the &quot;required&quot; indicator appeared, expressed mild frustration (&quot;could&#x27;ve told me that up front&quot;). session 3 — jan 21 same step 3 hesitation as session 1. when asked directly, said: &quot;i guess i&#x27;m worried this is going to email my whole team before i&#x27;m ready.&quot; sessions 4–6 (jan 22–23) consistent with sessions 1–3: step 3 wording read as optional by all participants; none independently identified it as required without hitting the &quot;required&quot; state first. participants researcher: priya patel 6 participants, all first-time fernway workspace admins hired within the last 90 days. company sizes ranged 10–200 employees, mix of industries. recruited via existing customer outreach list, screened for &quot;has not previously completed fernway onboarding themselves.&quot;"}, {"id": "raw:2026-01-27-dashboard-review-ambient-scribe-ga-adoption", "kind": "raw", "title": "Dashboard review — Ambient scribe GA candidate adoption", "date": "2026-01-27", "type": "analytics", "status": "raw", "tags": ["ambient-scribe", "ga-release", "dashboard"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-01-27-dashboard-review-ambient-scribe-ga-adoption/session-notes.md", "html": "<h1>Dashboard review — Ambient scribe GA candidate adoption</h1>\n<h2>Objective</h2>\n<p>Manually review the internal usage dashboard for the ambient scribe GA release candidate to see whether adoption and engagement patterns in real usage match what the GA-candidate usability round found — particularly whether the per-line confidence highlighting is actually changing reviewing behavior at scale, not just in the moderated session.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Manual dashboard review (no moderated session, no participants) — internal analytics dashboard covering the first 4 weeks of GA-candidate rollout</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> none — this is an analytics review, not a research session; see <code>participants.md</code> in this folder for why</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[MEDIUM]</strong> <em>(trust)</em> Clinicians who were shown confidence highlighting skim high-confidence lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the usability round&#x27;s finding that visible uncertainty, not raw accuracy, changes reviewing behavior.</li><li><strong>[LOW]</strong> <em>(adoption)</em> Adoption is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments, worth understanding qualitatively rather than assuming it&#x27;s a training gap.</li></ul>\n<h2>Recommendations</h2>\n<ol><li>Feed this dashboard pattern back into <code>findings/ambient-scribe.md</code> as corroborating evidence for the confidence-highlighting result, rather than treating it as a separate finding.</li><li>Consider a short follow-up interview round specifically on the physician/resident adoption gap.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Is the physician/resident adoption gap explained by workflow differences, trust, or something else entirely? Dashboard data alone can&#x27;t answer this.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe.md\">ambient-scribe.md</a></li></ul><h2>Participants</h2><h1>Participants — Dashboard review — Ambient scribe GA candidate adoption</h1>\n<p><strong>Count:</strong> N/A</p>\n<p><strong>Roles:</strong> N/A — this session has no research participants. It&#x27;s a manual review of aggregate, de-identified usage data from the internal analytics dashboard, not a moderated or observed session. This file exists only to keep the folder shape consistent with every other <code>raw/</code> session for indexing purposes.</p>\n<p><strong>Researcher:</strong> Priya Patel</p>", "searchText": "dashboard review — ambient scribe ga candidate adoption ambient-scribe ga-release dashboard ambient-scribe-widget dashboard review — ambient scribe ga candidate adoption objective manually review the internal usage dashboard for the ambient scribe ga release candidate to see whether adoption and engagement patterns in real usage match what the ga-candidate usability round found — particularly whether the per-line confidence highlighting is actually changing reviewing behavior at scale, not just in the moderated session. method method: manual dashboard review (no moderated session, no participants) — internal analytics dashboard covering the first 4 weeks of ga-candidate rollout researcher: priya patel full participant roster: none — this is an analytics review, not a research session; see participants.md in this folder for why key findings [medium] (trust) clinicians who were shown confidence highlighting skim high-confidence lines at roughly double the rate of the pre-highlighting cohort — directionally consistent with the usability round&#x27;s finding that visible uncertainty, not raw accuracy, changes reviewing behavior. [low] (adoption) adoption is uneven by role: attending physicians are opting in at a noticeably higher rate than residents in the same departments, worth understanding qualitatively rather than assuming it&#x27;s a training gap. recommendations feed this dashboard pattern back into findings/ambient-scribe.md as corroborating evidence for the confidence-highlighting result, rather than treating it as a separate finding. consider a short follow-up interview round specifically on the physician/resident adoption gap. follow-ups / open questions is the physician/resident adoption gap explained by workflow differences, trust, or something else entirely? dashboard data alone can&#x27;t answer this. related synthesized into: ambient-scribe.md participants participants — dashboard review — ambient scribe ga candidate adoption count: n/a roles: n/a — this session has no research participants. it&#x27;s a manual review of aggregate, de-identified usage data from the internal analytics dashboard, not a moderated or observed session. this file exists only to keep the folder shape consistent with every other raw/ session for indexing purposes. researcher: priya patel"}, {"id": "raw:2026-02-10-ambient-scribe-medication-flag-concept", "kind": "raw", "title": "Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept", "date": "2026-02-10", "type": "usability-test", "status": "raw", "tags": ["ambient-scribe", "usability", "medication-safety", "documentation"], "related_components": ["ambient-scribe-widget"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-02-10-ambient-scribe-medication-flag-concept/session-notes.md", "html": "<h1>Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept</h1>\n<h2>Objective</h2>\n<p>The GA-candidate round (2026-01-13) recommended treating sound-alike medication errors as an ongoing post-GA monitoring item rather than a launch blocker, since the existing <code>confidence-highlighted</code> variant already surfaces them as generically low-confidence. This session tests an early concept that goes one step further: a <em>distinct</em> flag specifically for suspected sound-alike medication names, visually separate from the general low-confidence underline, to see whether participants notice and act on it differently than they do on ordinary low-confidence text.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Moderated usability test, 6 simulated encounters seeded with known sound-alike pairs (e.g. hydralazine/hydroxyzine, clonidine/Klonopin), 40 min/session</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[HIGH]</strong> <em>(flag recognized correctly)</em> 5 of 6 participants correctly identified the medication-specific flag (a distinct amber pill-shaped badge, vs. the generic low-confidence underline) as &quot;different from the usual low-confidence thing&quot; within the first two encounters, without being told the distinction existed.</li><li><strong>[MEDIUM]</strong> <em>(over-trust risk)</em> 2 participants said the badge&#x27;s specificity made them <em>more</em> likely to treat unflagged medication lines as automatically correct — the opposite of the intended effect, and worth watching as adoption scales.</li><li><strong>[LOW]</strong> <em>(placement)</em> Badge placement inline with the medication name (vs. in a right-hand margin, tested as an alternate) was preferred 5:1 — participants didn&#x27;t want to look away from the text to check a flag.</li><li><strong>[LOW]</strong> <em>(false positive tolerance)</em> One deliberately-seeded false positive (a real but unusual drug name) was accepted by all 6 participants as &quot;worth a second look, not annoying&quot; — suggests some over-flagging is tolerable if the badge is visually light.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;That&#x27;s different from the fuzzy-underline stuff — this one&#x27;s telling me specifically &#x27;check the</p><p>drug name,&#x27; which is exactly what I&#x27;d want flagged.&quot;</p><p>— Physician, Internal Medicine, P22</p></blockquote>\n<blockquote><p>&quot;If it&#x27;s not flagged, I might just... trust it more than I should. That&#x27;s on me, but it&#x27;s worth</p><p>knowing the tool does that to people.&quot;</p><p>— Nurse Practitioner, P24</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Build the distinct medication-safety flag as its own variant, inline with the medication name, separate from generic confidence highlighting.</li><li>Before rollout, pair the flag with brief onboarding copy or training-pilot messaging that explicitly counters the over-trust-on-unflagged-lines risk surfaced by 2 of 6 participants — don&#x27;t let the flag imply &quot;anything unflagged is guaranteed correct.&quot;</li><li>Feed the false-positive tolerance finding to whoever tunes the sound-alike detection threshold — participants have headroom for a few extra false positives in exchange for not missing a real one.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Needs a larger-N validation pass before this moves from concept test to build-ready spec.</li><li>Over-trust-on-unflagged risk should be checked again once the post-GA monitoring dashboard (recommended 2026-01-13) has real error-rate data to compare against self-reported behavior.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe-post-ga-refinements.md\">ambient-scribe-post-ga-refinements.md</a></li></ul><h2>Participants</h2><h1>Participants — Usability Test — Ambient Scribe Sound-Alike Medication Flag Concept</h1>\n<p><strong>Count:</strong> 6</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician</li><li>Nurse Practitioner</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> Drawn from the existing GA-candidate cohort (2026-01-13) plus 2 new participants, screened for regularly reviewing ambient-scribe drafts containing prescribed medications. No real patient or staff identities are recorded here; session-notes.md uses session-scoped fictional/anonymized participant IDs (e.g. P22) instead of names.</p>", "searchText": "usability test — ambient scribe sound-alike medication flag concept ambient-scribe usability medication-safety documentation ambient-scribe-widget usability test — ambient scribe sound-alike medication flag concept objective the ga-candidate round (2026-01-13) recommended treating sound-alike medication errors as an ongoing post-ga monitoring item rather than a launch blocker, since the existing confidence-highlighted variant already surfaces them as generically low-confidence. this session tests an early concept that goes one step further: a distinct flag specifically for suspected sound-alike medication names, visually separate from the general low-confidence underline, to see whether participants notice and act on it differently than they do on ordinary low-confidence text. method method: moderated usability test, 6 simulated encounters seeded with known sound-alike pairs (e.g. hydralazine/hydroxyzine, clonidine/klonopin), 40 min/session researcher: priya patel full participant roster: see participants.md in this folder key findings [high] (flag recognized correctly) 5 of 6 participants correctly identified the medication-specific flag (a distinct amber pill-shaped badge, vs. the generic low-confidence underline) as &quot;different from the usual low-confidence thing&quot; within the first two encounters, without being told the distinction existed. [medium] (over-trust risk) 2 participants said the badge&#x27;s specificity made them more likely to treat unflagged medication lines as automatically correct — the opposite of the intended effect, and worth watching as adoption scales. [low] (placement) badge placement inline with the medication name (vs. in a right-hand margin, tested as an alternate) was preferred 5:1 — participants didn&#x27;t want to look away from the text to check a flag. [low] (false positive tolerance) one deliberately-seeded false positive (a real but unusual drug name) was accepted by all 6 participants as &quot;worth a second look, not annoying&quot; — suggests some over-flagging is tolerable if the badge is visually light. representative quotes &quot;that&#x27;s different from the fuzzy-underline stuff — this one&#x27;s telling me specifically &#x27;check the drug name,&#x27; which is exactly what i&#x27;d want flagged.&quot; — physician, internal medicine, p22 &quot;if it&#x27;s not flagged, i might just... trust it more than i should. that&#x27;s on me, but it&#x27;s worth knowing the tool does that to people.&quot; — nurse practitioner, p24 recommendations build the distinct medication-safety flag as its own variant, inline with the medication name, separate from generic confidence highlighting. before rollout, pair the flag with brief onboarding copy or training-pilot messaging that explicitly counters the over-trust-on-unflagged-lines risk surfaced by 2 of 6 participants — don&#x27;t let the flag imply &quot;anything unflagged is guaranteed correct.&quot; feed the false-positive tolerance finding to whoever tunes the sound-alike detection threshold — participants have headroom for a few extra false positives in exchange for not missing a real one. follow-ups / open questions needs a larger-n validation pass before this moves from concept test to build-ready spec. over-trust-on-unflagged risk should be checked again once the post-ga monitoring dashboard (recommended 2026-01-13) has real error-rate data to compare against self-reported behavior. related synthesized into: ambient-scribe-post-ga-refinements.md participants participants — usability test — ambient scribe sound-alike medication flag concept count: 6 roles: physician nurse practitioner researcher: priya patel recruitment note: drawn from the existing ga-candidate cohort (2026-01-13) plus 2 new participants, screened for regularly reviewing ambient-scribe drafts containing prescribed medications. no real patient or staff identities are recorded here; session-notes.md uses session-scoped fictional/anonymized participant ids (e.g. p22) instead of names."}, {"id": "raw:2026-02-17-session-lock-during-dictation", "kind": "raw", "title": "Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation", "date": "2026-02-17", "type": "contextual-inquiry", "status": "raw", "tags": ["ambient-scribe", "sso", "mfa", "authentication", "phi"], "related_components": ["ambient-scribe-widget", "encounter-view"], "severity": {}, "last_edited_by": null, "last_edited_at": null, "researcher": null, "designer": null, "evaluator": null, "reviewed_by": null, "path": "raw/2026-02-17-session-lock-during-dictation/session-notes.md", "html": "<h1>Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation</h1>\n<h2>Objective</h2>\n<p><code>encounter-view.md</code>&#x27;s component notes flag the <code>locked</code> state&#x27;s interaction with an in-progress ambient scribe recording as an open edge case, raised as a side note in the 2025-05-20 SSO/MFA interview but never directly studied. This session shadows clinicians through their normal SSO/MFA idle-timeout window while actively dictating, to observe what actually happens today and what they expect/want instead.</p>\n<h2>Method</h2>\n<ul><li><strong>Method:</strong> Contextual inquiry / shadowing, 5 clinicians observed through at least one natural idle-timeout event during a real or simulated dictation session, plus 1 IT Security stakeholder interviewed on the technical constraints</li><li><strong>Researcher:</strong> Priya Patel</li><li><strong>Full participant roster:</strong> see <code>participants.md</code> in this folder</li></ul>\n<h2>Key Findings</h2>\n<ul><li><strong>[CRITICAL]</strong> <em>(silent draft loss)</em> In the current build, a session lock mid-recording simply freezes the ambient-scribe widget with no message; 4 of 5 clinicians assumed the draft was lost and started re-dictating from scratch after re-authenticating, even though the draft is server-side and actually survives the lock.</li><li><strong>[HIGH]</strong> <em>(no explicit paused state)</em> There is no visual distinction between &quot;recording,&quot; &quot;frozen because locked,&quot; and &quot;actually stopped&quot; — participants could not tell which state they were in without asking a shadowing observer.</li><li><strong>[MEDIUM]</strong> <em>(re-auth friction stacks)</em> Clinicians already re-authenticate frequently for unrelated reasons (badge-tap SSO renewals); a lock during dictation is perceived as &quot;one more annoying re-login,&quot; not as a distinct, expected safety behavior — this framing gap likely drives the abandon-and-redictate behavior above as much as the missing UI does.</li><li><strong>[LOW]</strong> <em>(IT Security confirms feasibility)</em> IT Security confirmed the 10-minute idle timeout is not adjustable per-feature, but confirmed an explicit &quot;paused, draft preserved&quot; UI state is technically straightforward to add without changing the timeout policy itself.</li></ul>\n<h2>Representative Quotes</h2>\n<blockquote><p>&quot;I genuinely thought I&#x27;d lost it. I&#x27;ve just gotten used to starting over when the screen locks,</p><p>so I didn&#x27;t even try to check.&quot;</p><p>— Physician, Family Medicine, P31</p></blockquote>\n<blockquote><p>&quot;If it said &#x27;paused, nothing lost, just log back in,&#x27; I&#x27;d believe it and wait. Right now it just</p><p>looks broken.&quot;</p><p>— Nurse Practitioner, P33</p></blockquote>\n<blockquote><p>&quot;The timeout window itself is a hard policy constraint, but what the screen tells the clinician</p><p>during that window is entirely a product decision — that part isn&#x27;t locked down.&quot;</p><p>— IT Security stakeholder</p></blockquote>\n<h2>Recommendations</h2>\n<ol><li>Add an explicit &quot;paused — draft preserved, re-authenticate to resume&quot; state to the <code>encounter-view</code>/<code>ambient-scribe-widget</code> lock interaction, replacing the current silent freeze.</li><li>Do not attempt to change or extend the idle-timeout policy itself — per IT Security, treat it as fixed and solve this entirely at the UI-messaging layer.</li><li>Pair the new state with brief messaging that reframes the lock as an expected safety behavior rather than an unrelated login interruption, to counter the &quot;one more annoying re-login&quot; framing found here.</li></ol>\n<h2>Follow-ups / Open Questions</h2>\n<ul><li>Confirm with IT Security whether the same &quot;paused, preserved&quot; messaging pattern should extend to other session-timeout-adjacent surfaces beyond ambient scribe.</li><li>Re-test the abandon-and-redictate behavior once the explicit paused state ships, to confirm it actually changes clinician behavior and not just their stated understanding.</li></ul>\n<h2>Related</h2>\n<ul><li>Synthesized into: <a href=\"../../findings/ambient-scribe-post-ga-refinements.md\">ambient-scribe-post-ga-refinements.md</a></li></ul><h2>Participants</h2><h1>Participants — Contextual Inquiry — Session Lock During Active Ambient Scribe Dictation</h1>\n<p><strong>Count:</strong> 5</p>\n<p><strong>Roles:</strong></p>\n<ul><li>Physician</li><li>Nurse Practitioner</li><li>IT Security</li></ul>\n<p><strong>Researcher:</strong> Priya Patel</p>\n<p><strong>Recruitment note:</strong> 4 clinicians recruited from regular ambient-scribe users on units with known short idle-timeout windows; 1 IT Security stakeholder recruited directly for technical context rather than shadowed. No real patient or staff identities are recorded here; session-notes.md uses session-scoped fictional/anonymized participant IDs (e.g. P31) instead of names.</p>", "searchText": "contextual inquiry — session lock during active ambient scribe dictation ambient-scribe sso mfa authentication phi ambient-scribe-widget encounter-view contextual inquiry — session lock during active ambient scribe dictation objective encounter-view.md &#x27;s component notes flag the locked state&#x27;s interaction with an in-progress ambient scribe recording as an open edge case, raised as a side note in the 2025-05-20 sso/mfa interview but never directly studied. this session shadows clinicians through their normal sso/mfa idle-timeout window while actively dictating, to observe what actually happens today and what they expect/want instead. method method: contextual inquiry / shadowing, 5 clinicians observed through at least one natural idle-timeout event during a real or simulated dictation session, plus 1 it security stakeholder interviewed on the technical constraints researcher: priya patel full participant roster: see participants.md in this folder key findings [critical] (silent draft loss) in the current build, a session lock mid-recording simply freezes the ambient-scribe widget with no message; 4 of 5 clinicians assumed the draft was lost and started re-dictating from scratch after re-authenticating, even though the draft is server-side and actually survives the lock. [high] (no explicit paused state) there is no visual distinction between &quot;recording,&quot; &quot;frozen because locked,&quot; and &quot;actually stopped&quot; — participants could not tell which state t
