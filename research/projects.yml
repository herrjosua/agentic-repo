# Canonical project list, plus the project assignment for the two record kinds whose own files
# can't carry a project tag: raw sessions (research/raw/ is append-only) and components
# (design-tokens/components/ is generated output). Every other record kind — findings,
# analytics summaries, deliverables — carries its project-* tag in its own `tags:` frontmatter.
#
# build_search_ui.py / export_records.py append the mapped tag to raw and component records at
# load time; an unmapped entry falls back to project-cross-cutting with a warning.
# build_index.py (and --check) fails on any unmapped, stale, or unknown entry.
#
# See docs/projects.md for the rules and per-project counts. Every id here must also be defined
# in research/findings/tags.md.

projects:
  - id: project-ambient-scribe
    label: Ambient AI Scribe
    description: Ambient documentation scribe, v0.1 through GA and post-GA refinements.
  - id: project-onboarding
    label: Onboarding
    description: First-run workspace setup flow for new admins.
  - id: project-care-coordination
    label: Care Coordination & Alert Triage
    description: AI alert ranking and chart-review summaries for care coordinators.
  - id: project-design-system
    label: Design System
    description: Shared component library, style guide, and their audits.
  - id: project-prior-auth
    label: AI-Assisted Prior Authorization
    description: Prior-auth drafting for utilization management, v1 and v2.
  - id: project-him
    label: HIM Coding, Billing & Release of Information
    description: AI coding suggestions and ROI redaction for Health Information Management.
  - id: project-patient-chatbot
    label: Patient Scheduling Chatbot
    description: Patient-facing scheduling chatbot and scheduling widget.
  - id: project-clinician-dashboard
    label: Clinician Dashboard
    description: Clinician home dashboard redesign and its care-gap flags.
  - id: project-cross-cutting
    label: Cross-cutting
    description: Program-level work that belongs to no single project (governance, baselines, scope, rollout, platform).

