# Participant registry: one entry per person, keyed by their participant ID. IDs are one global
# sequence across every raw session, never session-scoped, and an ID is never reused for a
# different person. See docs/participants.md for the rules and docs/decisions.md (entry 16) for
# why this is one central file rather than a file in each raw session folder.
#
# research/raw/ is append-only, so this file records what the raw files can't: which session
# folders each person appears in, their role class, and what a correction file changed. Each
# appearance is one session folder; that session's session-notes.md attribution lines
# ("> — <role>, P<nn>") must match it. A correction is mirrored here with raw_id / raw_role (what
# session-notes.md says) and corrected_by (the correction-*.md in that folder, which stays
# authoritative). reserved: true marks an appearance allocated by new_research_session.py
# --participants that doesn't have to be quoted.
#
# build_index.py (and --check) validates this file against raw/. IDs that were never quoted in a
# raw session aren't recorded; next_id is the next one to allocate and is never reused.

next_id: P127

# IDs first used in a session dated after this baseline must be first_id or higher (warn-only).
sequence_baseline:
  date: 2026-10-13
  first_id: P120

role_classes:
  - physician
  - app                 # advanced practice provider: nurse practitioner, physician assistant
  - nurse
  - care-coordinator
  - him-coder           # HIM specialists and supervisors, medical coders
  - behavioral-health
  - patient
  - executive           # C-suite, VPs, directors
  - it
  - accessibility
  - admin-staff         # registration, non-clinical/administrative staff
  - clinician           # clinician, role not specified
  - mixed-staff         # survey bucket spanning several roles

