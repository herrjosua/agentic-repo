name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest

      - name: Index up to date
        run: python research/scripts/build_index.py --check

      - name: Search UI up to date
        run: python research/scripts/build_search_ui.py --check

      - name: Dependency audit
        run: pip-audit -r requirements.txt
